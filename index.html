<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <title>Yellow Zone — אוהדי מכבי קונים כחול־צהוב</title>

  <!-- Open Graph — §268. הדף הזה הוא מה שמוגש על הדומיין החשוף (yellowzone.co.il), וזו
       הכתובת שאנשים מקלידים בפועל כששולחים אותה בוואטסאפ. ה-meta refresh למטה מעביר בני-אדם
       ל-welcome, אבל סורק-קישורים לא בהכרח עוקב אחריו — ולכן התגיות חייבות לשבת גם כאן,
       זהות לאלה שב-welcome.html (§266). כל שינוי שם — לעדכן גם פה. -->
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="Yellow Zone"/>
  <meta property="og:url" content="https://yellowzone.co.il/welcome"/>
  <meta property="og:title" content="Yellow Zone — אוהדי מכבי קונים כחול־צהוב"/>
  <meta property="og:description" content="כל העסקים של אוהדי מכבי תל אביב במקום אחד: הטבות בלעדיות והמלצות אמיתיות. כניסה רק לצהובים."/>
  <meta property="og:image" content="https://yellowzone.co.il/images/yellowzone-mark-square.png"/>
  <meta property="og:image:width" content="1080"/>
  <meta property="og:image:height" content="1080"/>
  <meta property="og:locale" content="he_IL"/>
  <meta name="description" content="כל העסקים של אוהדי מכבי תל אביב במקום אחד: הטבות בלעדיות והמלצות אמיתיות. כניסה רק לצהובים."/>
  <link rel="canonical" href="https://yellowzone.co.il/welcome"/>

  <!-- אחרון בכוונה: הדפדפן כבר פרסר את כל מה שמעל לפני שהוא עוזב את הדף. -->
  <meta http-equiv="refresh" content="0;url=welcome.html"/>
</head>
<body></body>
</html>
