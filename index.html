<!DOCTYPE html>

<head>

  <!-- Open Graph — §268/§269. הדף הזה מוגש על הדומיין החשוף (yellowzone.co.il), וזו הכתובת

  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="Yellow Zone"/>
  <meta property="og:url" content="https://yellowzone.co.il/welcome"/>
  <meta property="og:title" content="Yellow Zone — אוהדי מכבי קונים כחול־צהוב"/>

  <meta property="og:image:width" content="1080"/>
  <meta property="og:image:height" content="1080"/>
  <meta property="og:locale" content="he_IL"/>
  <meta name="description" content="כל העסקים של אוהדי מכבי תל אביב במקום אחד: הטבות בלעדיות והמלצות אמיתיות. כניסה רק לצהובים."/>
  <link rel="canonical" href="https://yellowzone.co.il/welcome"/>
</head>
<body>
  <!-- §269 — ההפניה היא JavaScript ולא meta refresh, בכוונה. סורק-קישורים אינו מריץ JS ולכן
       רואה כאן דף שלם עם תגיות OG, במקום דף-ביניים עם הוראת-הפניה שסורקים נוטים לוותר עליו
       (נמדד: הדומיין החשוף לא ייצר כרטיס בוואטסאפ כל עוד היה כאן meta refresh, בעוד
       /welcome — אותן תגיות בדיוק, בלי הפניה — כן ייצר). בני-אדם מועברים באותה מהירות. -->
  <script>location.replace("welcome.html");</script>
  <noscript><a href="welcome.html">כניסה ל-Yellow Zone</a></noscript>
</body>
