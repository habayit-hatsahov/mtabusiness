<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <title>Yellow Zone – אוהדי מכבי קונים כחול־צהוב</title>

  <!-- Open Graph — §268/§269. הדף הזה מוגש על הדומיין החשוף (yellowzone.co.il), וזו הכתובת
       שאנשים מקלידים בפועל כששולחים אותה בוואטסאפ — ולכן התגיות חייבות לשבת גם כאן, זהות
       לאלה שב-welcome.html (§266). כל שינוי שם — לעדכן גם פה, אין ביניהם מקור-אמת משותף. -->
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="Yellow Zone"/>
  <meta property="og:url" content="https://yellowzone.co.il/welcome"/>
  <meta property="og:title" content="Yellow Zone – אוהדי מכבי קונים כחול־צהוב"/>
  <meta property="og:description" content="כל העסקים של אוהדי מכבי תל אביב במקום אחד: הטבות בלעדיות והמלצות אמיתיות. מורידים את האפליקציה ונרשמים."/>
  <meta property="og:image" content="https://yellowzone.co.il/images/share-z.png"/>
  <meta property="og:image:width" content="1080"/>
  <meta property="og:image:height" content="1080"/>
  <meta property="og:image:type" content="image/png"/>
  <meta property="og:image:alt" content="Yellow Zone"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:image" content="https://yellowzone.co.il/images/share-z.png"/>
  <meta property="og:locale" content="he_IL"/>
  <meta name="description" content="כל העסקים של אוהדי מכבי תל אביב במקום אחד: הטבות בלעדיות והמלצות אמיתיות. מורידים את האפליקציה ונרשמים."/>
  <link rel="canonical" href="https://yellowzone.co.il/welcome"/>
</head>
<body>
  <!-- §269 — ההפניה היא JavaScript ולא meta refresh, בכוונה. סורק-קישורים אינו מריץ JS ולכן
       רואה כאן דף שלם עם תגיות OG, במקום דף-ביניים עם הוראת-הפניה שסורקים נוטים לוותר עליו
       (נמדד: הדומיין החשוף לא ייצר כרטיס בוואטסאפ כל עוד היה כאן meta refresh, בעוד
       /welcome — אותן תגיות בדיוק, בלי הפניה — כן ייצר). בני-אדם מועברים באותה מהירות. -->
  <!-- §492 — באפליקציה: welcome.html (מסך הכניסה וההרשמה שלה). בדפדפן: ישר לדף הנחיתה, בלי הפניה כפולה. -->
  <!-- §536י — באפליקציה התמונה מופיעה כבר כאן: הדף הזה קטן (3KB) ו-welcome.html גדול (340KB), והדפדפן משאיר
       את הדף הקודם על המסך עד שהבא מצויר – כלומר התמונה מכסה את כל זמן הטעינה של welcome, במקום לבן.
       welcome ממשיך אותה תמונה (sessionStorage) מיד, בלי עמעום שני. בדפדפן splash-photo.js לא עושה כלום. -->
  <script src="splash-photo.js"></script>
  <script>
    (function () {
      var inApp = !!window.Capacitor || /YellowZoneApp/i.test(navigator.userAgent || '');
      var went = false;
      var go = function () { if (went) return; went = true; location.replace(inApp ? "welcome.html" + location.search + location.hash : "landing.html" + location.search); };
      // באפליקציה – פריים אחד כדי שהשכבה תצויר לפני הניווט; בדפדפן – מיד, כמו קודם
      // (rAF לא רץ בלשונית מוסתרת – לכן גם תקרה של 120ms, שלא ניתקע כאן)
      if (inApp && window.requestAnimationFrame) { requestAnimationFrame(function () { setTimeout(go, 0); }); setTimeout(go, 120); } else go();
    })();
  </script>
  <noscript><a href="welcome.html">כניסה ל-Yellow Zone</a></noscript>
</body>
</html>
