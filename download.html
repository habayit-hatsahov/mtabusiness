<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <script src="fresh-page.js"></script><!-- §514 — דף ישן ממטמון ה-HTTP (עד 10 דק' אחרי פריסה) → טעינה מחדש אחת -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FFD400" />
  <title>האפליקציה של Yellow Zone</title>
  <!-- §483 — הקישור האחד לחנויות (החלטת רמי, §478: "קישור אחד שמפנה כל מכשיר לחנות שלו").
       yellowzone.co.il/download — זה הקישור שמפיצים בפוסט ההשקה.
       ⚠️ לא /app: התיקייה app/ (פרויקט Capacitor) יושבת באותו נתיב ב-GitHub Pages.
       אייפון ← App Store · אנדרואיד ← Play · בתוך האפליקציה ← home.html · מחשב ← welcome.html (§484).
       הכפתורים מוצגים תמיד, גם בזמן ההפניה: אם המעבר לחנות לא קרה (דפדפן פנימי של
       פייסבוק/אינסטגרם חוסם לפעמים), יש מה ללחוץ ולא נשאר מסך ריק. -->
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="Yellow Zone"/>
  <meta property="og:url" content="https://yellowzone.co.il/download"/>
  <meta property="og:title" content="Yellow Zone – האפליקציה זמינה בחנויות"/>
  <meta property="og:description" content="כל העסקים של אוהדי מכבי במקום אחד: הטבות בלעדיות ותעודת חבר דיגיטלית. לאייפון ולאנדרואיד."/>
  <meta property="og:image" content="https://yellowzone.co.il/images/share-z.png"/>
  <meta property="og:image:width" content="1080"/>
  <meta property="og:image:height" content="1080"/>
  <meta property="og:image:type" content="image/png"/>
  <meta property="og:image:alt" content="Yellow Zone"/>
  <meta property="og:locale" content="he_IL"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:image" content="https://yellowzone.co.il/images/share-z.png"/>
  <link rel="icon" href="icons/favicon-32.png"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <link rel="preload" href="fonts/rubik-hebrew.woff2" as="font" type="font/woff2" crossorigin/>
  <style>
    @font-face { font-family: 'Rubik'; font-style: normal; font-weight: 300 900; font-display: swap;
      src: url('fonts/rubik-hebrew.woff2') format('woff2');
      unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }

    :root {
      --yellow: #FFD400; --navy: #0A2A66; --bg: #F6F6F2; --card: #FFFFFF;
      --text: #0A2A66; --text-sm: #6B7A9B; --border: #E4E4DC;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--text); min-height: 100vh;
      font-family: 'Rubik', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      line-height: 1.6; padding: 28px 16px 40px;
      display: flex; align-items: center; justify-content: center;
    }
    .wrap { width: 100%; max-width: 420px; text-align: center; }
    .brand img { height: 44px; margin-bottom: 22px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 28px 22px 24px; box-shadow: 0 1px 3px rgba(10,42,102,.06);
      border-top: 6px solid var(--yellow);
    }
    h1 { font-size: 23px; font-weight: 900; margin: 0 0 6px; }
    .sub { color: var(--text-sm); font-size: 15px; margin: 0 0 22px; }
    .status { font-size: 14px; color: var(--text-sm); margin: -8px 0 18px; min-height: 1em; }
    .stores { display: flex; flex-direction: column; gap: 12px; }
    .store {
      display: block; text-decoration: none; border-radius: 14px; padding: 15px 18px;
      font-weight: 800; font-size: 16px; border: 2px solid var(--navy);
      background: var(--card); color: var(--navy);
    }
    .store small { display: block; font-weight: 500; font-size: 12.5px; opacity: .8; }
    /* החנות של המכשיר הנוכחי עולה למעלה ונצבעת — היא זו שצריך ללחוץ עליה */
    .store.mine { background: var(--navy); color: #fff; order: -1; }
    .foot { font-size: 13px; color: var(--text-sm); margin-top: 20px; }
    .foot a { color: var(--text); font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="images/yellowzone-logo-horizontal.png" alt="Yellow Zone"/></div>
    <div class="card">
      <h1>האפליקציה של Yellow Zone</h1>
      <p class="sub">כל העסקים של אוהדי מכבי במקום אחד – הטבות בלעדיות ותעודת חבר דיגיטלית</p>
      <p class="status" id="status"></p>
      <div class="stores">
        <a class="store" id="ios" href="https://apps.apple.com/il/app/yellow-zone/id6815345699">
          להורדה ב-App Store<small>לאייפון ולאייפד</small>
        </a>
        <a class="store" id="android" href="https://play.google.com/store/apps/details?id=il.co.yellowzone.app">
          להורדה ב-Google Play<small>לאנדרואיד</small>
        </a>
      </div>
    </div>
    <p class="foot"><a href="welcome.html">מה זה Yellow Zone?</a></p>
  </div>

  <script>
  (function () {
    'use strict';

    // אותו זיהוי כמו app-banner.js (שם ההסבר המלא) — לא שוכפל לוגיקה חדשה.
    function inApp() {
      return !!window.Capacitor || /YellowZoneApp/i.test(navigator.userAgent || '');
    }
    function platform() {
      var ua = navigator.userAgent || '';
      if (/android/i.test(ua)) return 'android';
      if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';
      // iPad מודרני מדווח על עצמו כ-Macintosh; מסך-מגע הוא מה שמבדיל אותו ממק אמיתי.
      if (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1) return 'ios';
      return 'other';
    }

    var os = inApp() ? 'app' : platform();
    // §484 — במחשב אין מה להתקין: עוברים לדף הנחיתה (הסבר + הורדה), לא לשני כפתורי חנות.
    var target = os === 'app' ? 'home.html'
      : (os === 'ios' || os === 'android') ? document.getElementById(os).href
      : 'welcome.html';

    if (os === 'ios' || os === 'android') {
      document.getElementById(os).classList.add('mine');
      document.getElementById('status').textContent = 'מעבירים אתכם לחנות…';
    }

    // ── מדידה: pageView עם channel = המכשיר, כדי לספור כמה הגיעו מהפוסט ולאן נשלחו ──
    // REST ולא ה-SDK: הדף הזה צריך להפנות מהר, ו-Firebase SDK שלם רק בשביל כתיבה אחת
    // היה מעכב את ההפניה. createdAt נקבע בשרת (REQUEST_TIME) — זה מה שהחוקים דורשים.
    // ?src=fb בקישור נשמר ב-blockId ("storeLink:fb") כדי להבדיל בין ערוצי הפצה.
    // מודדים רק מהדומיין החי, כמו שאר הדפים — localhost ועותקים אחרים שקטים.
    function logVisit() {
      if (!/^(www\.)?yellowzone\.co\.il$/.test(location.hostname)) return Promise.resolve();
      try {
        var src = (new URLSearchParams(location.search).get('src') || '').replace(/[^\w-]/g, '').slice(0, 30);
        var sid = 'hb_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
        var id = '';
        for (var i = 0; i < 20; i++) id += 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random() * 62)];
        var base = 'projects/habayit-hatsahov/databases/(default)/documents';
        var str = function (v) { return v == null ? { nullValue: null } : { stringValue: String(v) }; };
        var body = { writes: [{
          update: { name: base + '/events/' + id, fields: {
            type: str('pageView'),
            sessionId: str(sid),
            path: str(location.pathname.slice(0, 200)),
            referrer: str((document.referrer.split('/')[2] || '').slice(0, 50) || null),
            device: str(os === 'other' ? 'desktop' : 'mobile'),
            blockId: str('storeLink' + (src ? ':' + src : '')),
            channel: str(os),
          } },
          updateTransforms: [{ fieldPath: 'createdAt', setToServerValue: 'REQUEST_TIME' }],
          currentDocument: { exists: false },
        }] };
        // keepalive — הבקשה ממשיכה גם אחרי שהדף עובר לחנות.
        var req = fetch('https://firestore.googleapis.com/v1/' + base + ':commit?key=AIzaSyBfG7AU4BzSAbBpwPyKfA_NzUpy2pxzFu8', {
          method: 'POST', keepalive: true,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        }).catch(function () {});
        // לא מחכים לנצח: מדידה לעולם לא מעכבת את ההפניה יותר מ-700ms.
        return Promise.race([req, new Promise(function (r) { setTimeout(r, 700); })]);
      } catch (e) { return Promise.resolve(); }
    }

    logVisit().then(function () {
      if (target) location.replace(target);
    });
  })();
  </script>
</body>
</html>
