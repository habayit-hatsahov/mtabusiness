<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>דמו — עיצוב מחדש: דף הבית + כרטיס עסק</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  /* ══════════════════════════════════════════════════════════════════
     דמו מבודד — עיצוב מחדש (דו-גוני צהוב+כחול, מצב יחיד, בלי כהה/בהיר)
     מבוסס על חבילת "Yellow Zone_ עיצוב מחדש.zip". לא מחובר לנתונים אמיתיים —
     לבדיקת נאמנות ויזואלית בלבד לפני שילוב אמיתי ב-home.html.
     ══════════════════════════════════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#F6F6F2; --surface:#FFFFFF;
    --ink:#0A2A66; --ink-2:#3A4C7A; --ink-3:#6B7A9B;
    --line:#E7E7E0; --field:#F2F2EC; --field-line:#E4E4DC;
    --acc:#FFD400; --acc-ink:#0A2A66; --acc-text:#0A2A66;
    --acc-soft:#FFF7DB; --acc-line:#FFE9A3; --blue:#0A2A66; --like:#0A2A66; --like-count:#0A2A66;
    --r-card:16px; --r-tile:15px; --r-field:11px; --r-chip:999px; --r-btn:13px; --r-shell:20px; --r-modal:20px;
    --shadow:0 1px 2px rgba(10,42,102,.06); --shadow-h:0 12px 30px rgba(10,42,102,.14);
    --card-border:1px solid #ECEAE2;
    --cat-ink:#7A5B00;
    --cat-1:#FFF3C9; --cat-2:#E3E9F7; --cat-3:#FFF6D8; --cat-4:#E8EDF8;
    --skel-a:#EFEFE9; --skel-b:#FAFAF6;
  }
  html, body { background: var(--bg); }
  body { font-family: 'Rubik', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; display: block; }
  button { font: inherit; color: inherit; }

  .demo-note { background:#12203D; color:#fff; text-align:center; font-size:13px; padding:8px 16px; }
  .demo-note b { color: var(--acc); }

  /* ── Header ── */
  .yz-header { display:flex; align-items:center; gap:18px; padding:7px 28px; background:var(--surface); border-bottom:3px solid var(--acc); }
  .yz-header-blue-line { height:3px; background:var(--blue); }
  .yz-hamburger { width:40px; height:40px; border-radius:var(--r-field); display:flex; align-items:center; justify-content:center; color:var(--ink); cursor:pointer; flex:none; background:transparent; border:none; }
  .yz-hamburger:hover { background:var(--field); }
  .yz-search { display:flex; align-items:center; gap:8px; width:300px; height:34px; padding:0 12px; background:var(--field); border:1px solid var(--field-line); border-radius:var(--r-field); color:var(--ink-3); font-size:13.5px; }
  .yz-search input { border:none; background:none; outline:none; flex:1; font-family:inherit; font-size:13.5px; color:var(--ink); }
  .yz-search input::placeholder { color:var(--ink-3); }
  .yz-search.mobile { display:none; }
  .yz-header-spacer { flex:1; }
  .yz-logo { display:flex; align-items:center; cursor:pointer; flex:none; }
  .yz-logo img { display:block; height:38px; width:auto; object-fit:contain; }
  .yz-footer .yz-logo img { height:28px; }

  /* ── Greeting + categories ── */
  .yz-greeting-wrap { padding: 22px 28px 8px; background:var(--surface); }
  .yz-greeting { font-size:22px; font-weight:700; letter-spacing:-0.01em; margin-bottom:16px; }
  .yz-cats { display:flex; align-items:flex-start; gap:6px; overflow-x:auto; padding-bottom:18px; scrollbar-width:none; }
  .yz-cats::-webkit-scrollbar { display:none; }
  .yz-cat-item { display:flex; flex-direction:column; align-items:center; gap:8px; width:78px; flex:none; cursor:pointer; background:none; border:none; }
  .yz-cat-tile { width:56px; height:56px; border-radius:var(--r-tile); display:flex; align-items:center; justify-content:center; color:var(--cat-ink); }
  .yz-cat-tile svg { width:24px; height:24px; }
  .yz-cat-item.active .yz-cat-tile { background:var(--acc); color:var(--acc-ink); }
  .yz-cat-item:nth-of-type(odd) .yz-cat-tile { background:var(--cat-1); }
  .yz-cat-item:nth-of-type(even) .yz-cat-tile { background:var(--cat-2); }
  .yz-cat-item.more .yz-cat-tile { background:var(--field); color:var(--ink-2); }
  .yz-cat-item.more { opacity:.6; }
  .yz-cat-label { font-size:12.5px; font-weight:600; text-align:center; line-height:1.25; color:var(--ink-2); }

  /* ── Section header ── */
  .yz-section { padding: 8px 28px 8px; background:var(--surface); }
  .yz-section-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .yz-section-title-wrap { display:flex; flex-direction:column; gap:6px; }
  .yz-section-title { font-size:20px; font-weight:700; letter-spacing:-0.01em; }
  .yz-section-actions { display:flex; align-items:center; gap:8px; }
  .yz-chip-all { display:flex; align-items:center; gap:5px; height:32px; padding:0 13px; border-radius:999px; background:var(--acc-soft); border:1px solid var(--acc-line); font-size:13.5px; font-weight:700; color:var(--acc-text); cursor:pointer; }
  .yz-chip-all:hover { filter:brightness(.97); }
  .yz-arrow-btn { width:34px; height:34px; border-radius:999px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-2); }
  .yz-arrow-btn:hover { background:var(--field); color:var(--ink); }

  /* ── Card row ── */
  .yz-row { display:flex; gap:18px; overflow-x:auto; padding-bottom:20px; scrollbar-width:none; }
  .yz-row::-webkit-scrollbar { display:none; }

  /* ── Business card ── */
  .yz-card { flex:none; width:238px; background:var(--surface); border-radius:var(--r-card); border:var(--card-border); box-shadow:var(--shadow); overflow:hidden; cursor:pointer; transition:box-shadow .22s ease, transform .22s ease; }
  .yz-card:hover { box-shadow:var(--shadow-h); transform:translateY(-3px); }
  .yz-card-img { position:relative; overflow:hidden; aspect-ratio:4/3; }
  .yz-card-img-fill { position:absolute; inset:0; transition:transform .45s cubic-bezier(.2,.7,.3,1); display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:800; color:rgba(255,255,255,.92); }
  .yz-card:hover .yz-card-img-fill { transform:scale(1.06); }
  .yz-card-like { position:absolute; top:10px; left:10px; min-width:34px; height:34px; padding:0 9px; border-radius:999px; background:rgba(255,255,255,.68); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 2px 8px rgba(16,24,40,.18); display:flex; align-items:center; justify-content:center; gap:4px; cursor:pointer; border:none; }
  .yz-card-like svg { width:17px; height:17px; }
  .yz-card-like span { font-size:12px; font-weight:700; color:var(--like-count); }
  .yz-card-logo { position:absolute; bottom:10px; right:10px; width:34px; height:34px; border-radius:9px; background:#fff; box-shadow:0 2px 8px rgba(15,23,42,.18); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:var(--ink-2); letter-spacing:-.02em; }
  .yz-card-badge-new { position:absolute; top:10px; right:10px; background:var(--acc); color:var(--acc-ink); font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px; }
  .yz-card-body { padding:12px 16px 16px; display:flex; flex-direction:column; gap:3px; }
  .yz-card-name { font-size:16px; font-weight:700; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .yz-card-tags { display:flex; gap:5px; flex-wrap:wrap; margin-top:1px; }
  .yz-card-tag { font-size:11px; font-weight:600; color:var(--ink-3); background:var(--field); border-radius:999px; padding:2px 8px; }
  .yz-card-discount { margin-top:6px; font-size:14px; font-weight:700; color:var(--acc-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .yz-card-more { margin-top:2px; font-size:12px; font-weight:600; color:var(--ink-3); }

  /* small feed cards ("חדש") */
  .yz-row.small .yz-card { width:216px; }

  /* ── Skeleton ── */
  @keyframes yzShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .yz-skel-shimmer { background:linear-gradient(90deg,var(--skel-a) 25%,var(--skel-b) 37%,var(--skel-a) 63%); background-size:200% 100%; animation:yzShimmer 1.4s linear infinite; }
  .yz-skel-card { flex:none; width:238px; background:var(--surface); border-radius:var(--r-card); border:var(--card-border); box-shadow:var(--shadow); overflow:hidden; }
  .yz-skel-img { aspect-ratio:4/3; }
  .yz-skel-body { padding:14px; display:flex; flex-direction:column; gap:9px; }
  .yz-skel-line { height:12px; border-radius:4px; background:var(--skel-a); }

  /* ── Footer ── */
  .yz-footer-bars > div:first-child { background:var(--acc); height:3px; }
  .yz-footer-bars > div:last-child { background:var(--blue); height:3px; }
  .yz-footer { background:var(--surface); padding:10px 28px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .yz-footer-links { display:flex; align-items:center; gap:20px; font-size:12.5px; font-weight:600; color:var(--blue); flex-wrap:wrap; }
  .yz-footer-links a { color:inherit; text-decoration:none; display:flex; align-items:center; gap:7px; }
  .yz-footer-links a:hover { opacity:.6; }
  .yz-footer-links svg { width:17px; height:17px; }
  .yz-footer-copy { color:var(--ink-3); }

  /* ── Modal (open business card) — לפי ZonePhonePrev.dc.html מעודכן ── */
  .yz-overlay { position:fixed; inset:0; background:rgba(10,14,22,.55); display:none; align-items:center; justify-content:center; padding:18px; z-index:200; }
  .yz-overlay.open { display:flex; }
  .yz-modal { width:100%; max-width:420px; max-height:90vh; overflow-y:auto; background:var(--surface); border-radius:var(--r-modal); box-shadow:0 24px 60px rgba(10,14,22,.35); display:flex; flex-direction:column; }
  .yz-modal-hero { position:relative; height:206px; display:flex; align-items:center; justify-content:center; flex:none; }
  .yz-modal-bizlogo { width:82px; height:82px; border-radius:20px; background:var(--blue); color:var(--acc); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; box-shadow:0 6px 18px rgba(10,42,102,.24); }
  .yz-modal-icon-btn { position:absolute; top:14px; height:36px; min-width:36px; padding:0 12px; border-radius:999px; background:rgba(255,255,255,.78); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 2px 8px rgba(10,42,102,.18); display:flex; align-items:center; justify-content:center; gap:6px; color:var(--ink); border:none; cursor:pointer; }
  .yz-modal-close { left:14px; padding:0; }
  .yz-modal-like { right:14px; }
  .yz-modal-icon-btn svg { width:17px; height:17px; flex:none; }
  .yz-modal-like span { font-size:13px; font-weight:700; color:var(--like-count); font-variant-numeric:tabular-nums; }
  .yz-modal-body { padding:18px 16px 0; display:flex; flex-direction:column; gap:12px; }
  .yz-modal-top { display:flex; flex-direction:column; gap:9px; }
  .yz-modal-name { font-size:26px; font-weight:700; letter-spacing:-0.01em; line-height:1.15; }
  .yz-modal-chips { display:flex; gap:7px; flex-wrap:wrap; }
  .yz-modal-chip { font-size:12.5px; font-weight:700; padding:6px 11px; border-radius:var(--r-chip); background:var(--field); border:1px solid var(--field-line); color:var(--ink-2); }
  .yz-modal-catline { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--ink-2); }
  .yz-modal-catline svg { width:15px; height:15px; flex:none; }
  .yz-modal-desc { font-size:13.5px; line-height:1.65; color:var(--ink-2); text-wrap:pretty; }

  .yz-block-label { font-size:12.5px; font-weight:800; color:var(--ink-2); letter-spacing:.04em; }
  .yz-benefit-wrap { display:flex; flex-direction:column; gap:8px; padding-top:4px; }
  .yz-benefit-box { border-radius:var(--r-card); padding:14px; display:flex; flex-direction:column; gap:5px; }
  .yz-benefit-box.primary { border:1px solid var(--acc-line); background:var(--acc-soft); }
  .yz-benefit-box.secondary { border:1px solid var(--line); }
  .yz-benefit-tag { font-size:11.5px; font-weight:700; color:var(--ink-3); }
  .yz-benefit-text { font-size:17px; font-weight:700; line-height:1.35; }
  .yz-benefit-sub { font-size:12.5px; color:var(--ink-3); }

  .yz-redeem-block { border:1px solid var(--line); border-radius:var(--r-card); background:var(--bg); padding:16px; display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center; }
  .yz-redeem-icon { width:42px; height:42px; border-radius:12px; background:var(--acc); color:var(--ink); display:flex; align-items:center; justify-content:center; }
  .yz-redeem-icon svg { width:20px; height:20px; }
  .yz-redeem-title { font-size:15.5px; font-weight:700; }
  .yz-redeem-sub { font-size:12.5px; color:var(--ink-3); line-height:1.5; max-width:280px; }
  .yz-redeem-btn { margin-top:2px; height:46px; align-self:stretch; border-radius:var(--r-btn); background:var(--acc); color:var(--acc-ink); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; cursor:pointer; border:none; width:100%; }
  .yz-redeem-btn:hover { filter:brightness(.96); }

  .yz-gallery-wrap { display:flex; flex-direction:column; gap:8px; padding-top:4px; }
  .yz-gallery-row { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
  .yz-gallery-row::-webkit-scrollbar { display:none; }
  .yz-gallery-item { flex:none; width:96px; aspect-ratio:1; border-radius:12px; }

  .yz-info-rows { display:flex; flex-direction:column; padding-top:4px; }
  .yz-info-row { display:flex; align-items:flex-start; gap:11px; padding:12px 0; }
  .yz-info-icon { width:30px; height:30px; flex:none; border-radius:9px; background:var(--field); color:var(--ink); display:flex; align-items:center; justify-content:center; }
  .yz-info-icon svg { width:16px; height:16px; }
  .yz-info-body { min-width:0; display:flex; flex-direction:column; gap:2px; }
  .yz-info-label { font-size:11.5px; font-weight:600; color:var(--ink-3); }
  .yz-info-value { font-size:14px; font-weight:600; color:var(--ink); word-break:break-word; }
  .yz-info-sublink { margin-top:3px; font-size:12.5px; font-weight:700; color:var(--ink-2); text-decoration:underline; text-underline-offset:3px; cursor:pointer; display:inline-block; }

  .yz-modal-sticky { position:sticky; bottom:0; margin-top:14px; background:var(--surface); padding:12px 16px 16px; display:flex; gap:10px; }
  .yz-sticky-btn { flex:1; height:48px; border-radius:var(--r-btn); display:flex; align-items:center; justify-content:center; gap:8px; font-size:15px; font-weight:700; cursor:pointer; border:none; }
  .yz-sticky-btn svg { width:18px; height:18px; }
  .yz-sticky-wa { background:var(--blue); color:#fff; }
  .yz-sticky-wa:hover { filter:brightness(1.06); }
  .yz-sticky-call { background:var(--acc); color:var(--acc-ink); }
  .yz-sticky-call:hover { filter:brightness(.96); }

  .yz-shell { max-width:1180px; margin:24px auto; border-radius:var(--r-shell); overflow:hidden; box-shadow:0 1px 2px rgba(16,24,40,.06), 0 12px 40px rgba(16,24,40,.08); border:1px solid var(--line); }

  @media (max-width: 760px) {
    .yz-shell { margin:0; border-radius:0; border:none; box-shadow:none; }
    .yz-header { padding:0 16px 6px; justify-content:space-between; }
    .yz-search { display:none; }
    .yz-search.mobile { display:flex; width:auto; margin:10px 16px 0; }
    .yz-greeting-wrap, .yz-section { padding-left:16px; padding-right:16px; }
    .yz-greeting { font-size:19px; }
    .yz-cat-item { width:70px; }
    .yz-cat-tile { width:46px; height:46px; }
    .yz-cat-label { font-size:11.5px; }
    .yz-section-title { font-size:17px; }
    .yz-card, .yz-skel-card { width:216px; }
    .yz-footer { padding:8px 16px; }
    .yz-logo img { height:30px; }
  }
</style>
</head>
<body>

<div class="demo-note">🟡 <b>דמו מבודד</b> — עיצוב מחדש לדף הבית + כרטיס עסק פנימי · לא מחובר לנתונים אמיתיים · בלי מצב כהה/בהיר (מצב יחיד בלבד)</div>

<div class="yz-shell">

  <!-- HEADER -->
  <div class="yz-header">
    <button class="yz-hamburger" aria-label="תפריט">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="yz-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input type="text" placeholder="חיפוש עסק או קטגוריה"/>
    </div>
    <div class="yz-header-spacer"></div>
    <div class="yz-logo">
      <img src="images/yellowzone-logo-horizontal.png" alt="Yellow Zone"/>
    </div>
  </div>
  <div class="yz-header-blue-line"></div>

  <!-- GREETING + SEARCH (mobile) + CATEGORIES -->
  <div class="yz-greeting-wrap">
    <div class="yz-search mobile">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input type="text" placeholder="חיפוש עסק או קטגוריה"/>
    </div>
    <div class="yz-greeting">שלום רמי, מה מחפשים היום?</div>
    <div class="yz-cats" id="catsRow">
      <button class="yz-cat-item active" data-cat="all">
        <div class="yz-cat-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></div>
        <div class="yz-cat-label">הכל</div>
      </button>
      <button class="yz-cat-item" data-cat="food">
        <div class="yz-cat-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 3v7a3 3 0 0 0 6 0V3"/><path d="M7 10v11"/><path d="M17 3c-1.7 1.3-2.5 3.3-2.5 5.5S15.3 13 17 13v8"/></svg></div>
        <div class="yz-cat-label">אוכל ומסעדות</div>
      </button>
      <button class="yz-cat-item" data-cat="events">
        <div class="yz-cat-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5.8 11.3 2 22l10.7-3.8"/><path d="M4 3h.01M22 8h.01M15 2h.01M22 20h.01"/><path d="m11 13 9-9"/><path d="M19.5 9.5c.3 1.3 1.3 2.3 2.5 2.5"/></svg></div>
        <div class="yz-cat-label">אירועים והפקות</div>
      </button>
      <button class="yz-cat-item" data-cat="vehicle">
        <div class="yz-cat-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 17h14l-1.4-5.2A2 2 0 0 0 15.7 10H8.3a2 2 0 0 0-1.9 1.8L5 17z"/><circle cx="7.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/></svg></div>
        <div class="yz-cat-label">רכב ותחבורה</div>
      </button>
      <button class="yz-cat-item" data-cat="home">
        <div class="yz-cat-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21v-7h6v7"/></svg></div>
        <div class="yz-cat-label">בית וניקיון</div>
      </button>
      <button class="yz-cat-item" data-cat="fashion">
        <div class="yz-cat-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M9 3 4 6l2 4 2-1v12h8V9l2 1 2-4-5-3a3 3 0 0 1-6 0z"/></svg></div>
        <div class="yz-cat-label">אופנה, ספורט ופנאי</div>
      </button>
      <button class="yz-cat-item" data-cat="digital">

<script>
// ── נתוני דמו בלבד (לא מחובר ל-Firestore) — צורת השדות תואמת ל-biz האמיתי בקוד: ──
// name, cat, alsoCat, tags[], city, discount, additionalDiscounts[{text,sub}], likedBy[],
// desc, address, email, website, phone, whatsapp, gallery[] (כל שדה אופציונלי — כמו במודל האמיתי)
const DEMO_BUSINESSES = [
  { id:'b1', name:'ד"ר אופטיקה', cat:'health', tags:['משקפיים','אופטומטריה'], discount:'50% הנחה על משקפי שמש', additionalDiscounts:[{text:'עוד הטבה'},{text:'עוד הטבה'}], likes:14, initials:'DR', grad:['#7C93C9','#0A2A66'], city:'גבעתיים',
    desc:'רשת אופטיקה עם מגוון רחב של משקפי ראייה ושמש ממיטב המותגים, בדיקת ראייה חינם והתאמה אישית.',
    address:'כביש 4, גבעתיים', phone:'03-571-2345', email:'sales@dr-optics.co.il', website:'אתר · אינסטגרם',
    gallery:[['#7C93C9','#0A2A66'],['#FFE38A','#E0A800'],['#AEBCDD','#22407C']] },
  { id:'b2', name:'שווארמה רמי', cat:'food', alsoCat:'events', tags:['מסעדות','ברים'], discount:'שווארמה + לימונדה חינם', additionalDiscounts:[{text:'30% על עסקיות', sub:'מימוש בסניף גבעתיים · לא כולל משלוחים'}], likes:31, initials:'שר', grad:['#FFE38A','#E0A800'], city:'גבעתיים',
    desc:'שווארמה טרייה על האש כל היום, מנות עסקיות וקייטרינג לאירועים קטנים. אוהדי מכבי מקבלים יחס של אלופים.',
    address:'רד/ג׳ 12, גבעתיים', phone:'03-671-9090', whatsapp:'050-234-5678', email:'info@rami-shawarma.co.il', website:'אתר · אינסטגרם · פייסבוק',
    gallery:[['#FFE38A','#E0A800'],['#7C93C9','#0A2A66'],['#FFF1BE','#F0C400'],['#AEBCDD','#22407C']] },
  { id:'b3', name:'גולדה אירועים', cat:'events', alsoCat:'food', tags:['אוכל','אלכוהול לאירועים'], discount:'הנחה בסגירת אירוע והתאמה לגודל האורחים', additionalDiscounts:[], likes:6, initials:'GO', grad:['#FFF1BE','#F0C400'], city:'תל אביב',
    desc:'הכניסו את הסיפור האולטימטיבי לאירוע שלכם — עמדת גלידה של שולחני כל הגלידות האיכותיות של גולדה, מוגשות עד האירוע שלכם.',
    address:'דרוזנר 5, תל אביב', phone:'052-475-7970', whatsapp:'052-475-7970', email:'sales@sungold.co.il', website:'אתר · אינסטגרם · פייסבוק',
    gallery:[['#FFE38A','#E0A800'],['#7C93C9','#0A2A66'],['#FFF1BE','#F0C400'],['#AEBCDD','#22407C']] },
  { id:'b4', name:'יהב מטבחים', cat:'home', tags:['נגרות','ריהוט'], discount:'20% הנחה על מטבח חדש', additionalDiscounts:[{text:'עוד הטבה'}], likes:9, initials:'יהב', grad:['#AEBCDD','#22407C'], city:'ראשון לציון',
    address:'ראשון לציון', phone:'03-955-1122' },
  { id:'b5', name:'XRAY TLV', cat:'fashion', tags:['משקפיים','אביזורי אופנה'], discount:'50 ש"ח מתנה בקנייה', additionalDiscounts:[], likes:3, initials:'XR', grad:['#FFD873','#C79000'], city:'תל אביב',
    address:'תל אביב' },
];
const CATEGORIES_LABEL = { food:'אוכל ומסעדות', events:'אירועים והפקות', vehicle:'רכב ותחבורה', home:'בית וניקיון', fashion:'אופנה, ספורט ופנאי', digital:'דיגיטל וטכנולוגיה', health:'בריאות ויופי', finance:'פיננסים ומשפט' };

const liked = {};

function cardHtml(b) {
  const extra = (b.additionalDiscounts || []).length;
  const extraLabel = extra === 1 ? '+הטבה נוספת' : extra > 1 ? `+${extra} הטבות נוספות` : '';
  return `
    <div class="yz-card" data-id="${b.id}">
      <div class="yz-card-img">
        <div class="yz-card-img-fill" style="background:linear-gradient(135deg,${b.grad[0]} 0%,${b.grad[1]} 100%)">${b.initials}</div>
        <button class="yz-card-like" data-id="${b.id}" aria-label="לייק" onclick="event.stopPropagation(); toggleLike('${b.id}', this)">
          <svg viewBox="0 0 24 24" fill="${liked[b.id] ? 'var(--acc)' : 'none'}" stroke="${liked[b.id] ? 'var(--acc)' : 'var(--like)'}" stroke-width="2" stroke-linecap="round"><path d="M12 20.5s-6.6-4.1-8.8-8A5.2 5.2 0 0 1 12 6.3a5.2 5.2 0 0 1 8.8 6.2c-2.2 3.9-8.8 8-8.8 8z"/></svg>
          <span>${b.likes + (liked[b.id] ? 1 : 0)}</span>
        </button>
        <div class="yz-card-logo">${b.initials}</div>
      </div>
      <div class="yz-card-body">
        <div class="yz-card-name">${b.name}</div>
        <div class="yz-card-tags">${b.tags.map(t => `<span class="yz-card-tag">${t}</span>`).join('')}</div>
        <div class="yz-card-discount">${b.discount}</div>
        <div class="yz-card-more">${extraLabel}</div>
      </div>
    </div>`;
}

document.querySelector('[data-row]').innerHTML = DEMO_BUSINESSES.map(b => cardHtml(b)).join('');

function toggleLike(id, el) {
  liked[id] = !liked[id];
  document.querySelector('[data-row]').innerHTML = DEMO_BUSINESSES.map(b => cardHtml(b)).join('');
  bindCardClicks();
}

function bindCardClicks() {
  document.querySelectorAll('.yz-card').forEach(card => {
    card.onclick = () => openModal(card.dataset.id);
  });
}
bindCardClicks();

document.querySelectorAll('.yz-arrow-btn').forEach(btn => {
  btn.onclick = () => {
    const dir = Number(btn.dataset.dir);
    document.querySelector('[data-row]').scrollBy({ left: dir * 260, behavior: 'smooth' });
  };
});

document.querySelectorAll('.yz-cat-item').forEach(item => {
  item.onclick = () => {
    document.querySelectorAll('.yz-cat-item').forEach(i => i.classList.remove('active'));
    if (item.dataset.cat !== 'more') item.classList.add('active');
  };
});

const modalLiked = {};
let modalBizId = null;

const INFO_ICONS = {
  address: '<path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>',
  email:   '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  website: '<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>',
  phone:   '<path d="M5 3h4l2 5-2.5 1.5a12 12 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2.2 2A17 17 0 0 1 3 5.2 2 2 0 0 1 5 3z"/>',
  whatsapp:'<path d="M3.6 20.4 5 16.2a7.8 7.8 0 1 1 3 3z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5"/>',
};
function infoRow(kind, label, value, sublink) {
  return `
    <div class="yz-info-row">
      <div class="yz-info-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${INFO_ICONS[kind]}</svg></div>
      <div class="yz-info-body">
        <div class="yz-info-label">${label}</div>
        <div class="yz-info-value" dir="auto">${value}</div>
        ${sublink ? `<span class="yz-info-sublink">${sublink}</span>` : ''}
      </div>
    </div>`;
}

function openModal(id) {
  const b = DEMO_BUSINESSES.find(x => x.id === id);
  if (!b) return;
  modalBizId = id;

  document.getElementById('modalHero').style.background = `linear-gradient(135deg,${b.grad[0]} 0%,${b.grad[1]} 100%)`;
  document.getElementById('modalBizLogo').textContent = b.initials;
  document.getElementById('modalName').textContent = b.name;

  const chips = [...b.tags, b.city].filter(Boolean);
  document.getElementById('modalChips').innerHTML = chips.map(t => `<span class="yz-modal-chip">${t}</span>`).join('');

  const catLine = CATEGORIES_LABEL[b.cat] + (b.alsoCat ? ` · ${CATEGORIES_LABEL[b.alsoCat]}` : '');
  document.getElementById('modalCatLine').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="7.5" r="1.4"/></svg>${catLine}`;

  const descEl = document.getElementById('modalDesc');
  descEl.textContent = b.desc || '';
  descEl.style.display = b.desc ? '' : 'none';

  const boxes = [`
    <div class="yz-benefit-box primary">
      <div class="yz-benefit-text">${b.discount}</div>
      <div class="yz-benefit-sub">מימוש בסניף ${b.city} · הצגת תעודת חבר</div>
    </div>`];
  (b.additionalDiscounts || []).forEach(d => {
    if (!d.text) return;
    boxes.push(`
    <div class="yz-benefit-box secondary">
      <div class="yz-benefit-tag">הטבה נוספת</div>
      <div class="yz-benefit-text">${d.text}</div>
      ${d.sub ? `<div class="yz-benefit-sub">${d.sub}</div>` : ''}
    </div>`);
  });
  document.getElementById('modalBenefits').innerHTML = boxes.join('');

  const galleryWrap = document.getElementById('modalGalleryWrap');
  if (b.gallery && b.gallery.length) {
    galleryWrap.style.display = '';
    document.getElementById('modalGallery').innerHTML = b.gallery.map(g =>
      `<div class="yz-gallery-item" style="background:linear-gradient(135deg,${g[0]} 0%,${g[1]} 100%)"></div>`
    ).join('');
  } else {
    galleryWrap.style.display = 'none';
  }

  const rows = [];
  if (b.address) rows.push(infoRow('address', 'כתובת', b.address, 'ניווט ב-Waze'));
  if (b.email)   rows.push(infoRow('email', 'מייל שירות', b.email));
  if (b.website) rows.push(infoRow('website', 'אתר ורשתות', b.website));
  if (b.phone)   rows.push(infoRow('phone', 'טלפון', b.phone));
  if (b.whatsapp) rows.push(infoRow('whatsapp', 'WhatsApp', b.whatsapp));
  document.getElementById('modalInfoRows').innerHTML = rows.join('');

  renderModalLike(b);
  document.getElementById('yzOverlay').classList.add('open');
}

function renderModalLike(b) {
  const on = !!modalLiked[b.id];
  const svg = document.querySelector('#modalLike svg');
  svg.setAttribute('fill', on ? 'var(--acc)' : 'none');
  svg.setAttribute('stroke', on ? 'var(--acc)' : 'var(--like)');
  document.getElementById('modalLikeCount').textContent = b.likes + (on ? 1 : 0);
}

document.getElementById('modalClose').onclick = () => document.getElementById('yzOverlay').classList.remove('open');
document.getElementById('yzOverlay').addEventListener('click', e => {
  if (e.target.id === 'yzOverlay') e.currentTarget.classList.remove('open');
});
document.getElementById('modalLike').onclick = function (e) {
  e.stopPropagation();
  const b = DEMO_BUSINESSES.find(x => x.id === modalBizId);
  if (!b) return;
  modalLiked[b.id] = !modalLiked[b.id];
  renderModalLike(b);
};
</script>
