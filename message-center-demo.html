<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>דמו – מרכז ההודעות</title>
<!-- §504 – דמו מרכז ההודעות (רמי, 12.10: "אני אסמן מה אני רוצה שיקרה, לאן זה יגיע ולאיפה").
     סבב 3 (13.10, הערות רמי): חזרו "עסקים/אוהדים מסוימים" (בחירה פרטנית, רשימה שמתחילה ריקה) עם סינונים
     מהנתונים האמיתיים (ענף, מנוי, שער/יציע, גיל, שימוש, קטגוריה/תגית/סוג/הטבה/אזור); "כולם" הוסר; שמות הערוצים
     "התראה באפליקציה / פוש קופץ בטלפון / במייל / וואטסאפ"; "כתיבה פעם אחת" + "העתקה מ…" + 📋; סטטיסטיקה מלאה
     לכל הודעה; לשונית "התבניות הקבועות" באותה זרימה. קובץ מבודד, לא מקושר, הכל בזיכרון – שום דבר לא נשלח.
     המייל מרונדר ב-mail-format.js האמיתי. ר' PROJECT_CONTEXT §504. -->
<style>
  :root {
    --bg:#F5F6F8; --card:#fff; --border:#DDE2E8; --border-md:#E3E7EC; --text:#101828; --text-sm:#475467; --muted:#667085;
    --accent:#0A2A66; --accent-bg:#EEF2FA; --yellow:#FFD400; --green:#16A34A; --orange:#B54708; --red:#B42318; --warn-bg:#FFFBEB;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); }
  .demo-bar { background:#1c1c1c; color:#fff; padding:10px 16px; font-size:13px; line-height:1.6; }
  .demo-bar b { color:var(--yellow); }
  .top { max-width:1200px; margin:0 auto; padding:18px 16px 0; }
  .views { display:flex; gap:6px; background:#E6E9EE; border-radius:14px; padding:4px; width:max-content; max-width:100%; }
  .views button { border:none; background:none; border-radius:11px; padding:10px 18px; font:inherit; font-size:14.5px; font-weight:800; color:var(--text-sm); cursor:pointer; }
  .views button.on { background:#fff; color:var(--accent); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .wrap { max-width:1200px; margin:0 auto; padding:16px 16px 60px; display:grid; grid-template-columns:minmax(0,1fr) 410px; gap:20px; align-items:start; }
  @media (max-width:980px) { .wrap { grid-template-columns:minmax(0,1fr); } .side { position:static !important; } }
  .wrap > *, .tpl-layout > *, .tpl-it > span { min-width:0; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--text-sm); font-size:13.5px; margin-bottom:16px; line-height:1.6; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:14px; }
  .step { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .step-n { width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; font-weight:900; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
  .step-t { font-size:16px; font-weight:800; }
  .step-h { font-size:12.5px; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1.5px solid var(--border-md); background:#fff; border-radius:12px; padding:9px 14px; font:inherit; font-size:14px; font-weight:700; color:var(--text); cursor:pointer; }
  .chip small { display:block; font-size:11.5px; font-weight:500; color:var(--muted); margin-top:1px; }
  .chip.on { border-color:var(--accent); background:var(--accent); color:#fff; }
  .chip.on small { color:rgba(255,255,255,.75); }
  .aud-sum { margin-top:12px; background:var(--accent-bg); border-radius:12px; padding:10px 12px; font-size:13px; line-height:1.6; }
  /* סינון */
  .filters { border:1px solid var(--border); border-radius:12px; padding:6px 12px; margin-top:12px; }
  .fl-sec { font-size:11.5px; font-weight:900; color:var(--accent); letter-spacing:.3px; padding:8px 0 2px; }
  .fl-row { display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-top:1px dashed var(--border-md); }
  .fl-t { font-size:12.5px; font-weight:800; color:var(--text-sm); width:118px; flex-shrink:0; padding-top:5px; }
  .fl-opts { display:flex; flex-wrap:wrap; gap:6px; }
  .fl-opt { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border-md); border-radius:9px; padding:4px 9px; font-size:12.5px; cursor:pointer; background:#fff; user-select:none; }
  .fl-opt.on { border-color:var(--accent); background:var(--accent-bg); font-weight:700; }
  .fl-opt input { margin:0; accent-color:var(--accent); }
  .fl-opt .c { color:var(--muted); font-size:11.5px; }
  .fl-note { font-size:11.5px; color:var(--muted); margin-top:3px; }
  .fl-foot { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--muted); padding:8px 0 4px; border-top:1px dashed var(--border-md); }
  .picker { border:1px solid var(--border); border-radius:12px; padding:10px; margin-top:10px; }
  .picker input[type=text] { width:100%; font:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--border-md); border-radius:10px; }
  .pick-list { max-height:240px; overflow:auto; margin-top:8px; }
  .pick-row { display:flex; gap:8px; align-items:center; padding:5px 2px; font-size:13.5px; cursor:pointer; }
  .pick-row .m { color:var(--muted); font-size:12px; }
  .pick-sum { font-size:13px; margin-top:8px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .sel-chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .sel-chip { background:var(--accent); color:#fff; border-radius:8px; padding:3px 4px 3px 9px; font-size:12px; display:inline-flex; gap:4px; align-items:center; }
  .sel-chip button { background:rgba(255,255,255,.2); border:none; color:#fff; border-radius:6px; cursor:pointer; font-size:11px; padding:1px 5px; }
  .linkbtn { background:none; border:none; color:var(--accent); font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; text-decoration:underline; padding:0; }
  /* ערוצים */
  .chan { display:flex; gap:12px; align-items:flex-start; border:1.5px solid var(--border-md); border-radius:14px; padding:12px 14px; margin-bottom:8px; cursor:pointer; background:#fff; }
  .chan.on { border-color:var(--accent); background:var(--accent-bg); }
  .chan.dis { opacity:.55; cursor:not-allowed; }
  .chan input { width:20px; height:20px; margin-top:2px; accent-color:var(--accent); flex-shrink:0; }
  .chan-t { font-size:15px; font-weight:800; }
  .chan-d { font-size:12.5px; color:var(--text-sm); margin-top:2px; line-height:1.5; }
  .chan-n { margin-inline-start:auto; text-align:left; font-size:12px; color:var(--text-sm); white-space:nowrap; }
  .chan-n b { display:block; font-size:18px; color:var(--text); }
  .new { display:inline-block; font-size:10.5px; font-weight:900; background:#FFD400; color:#0A2A66; border-radius:6px; padding:1px 6px; margin-inline-start:6px; vertical-align:middle; }
  .note { background:var(--warn-bg); border:1px solid #FDE68A; border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.6; margin-top:8px; }
  .note.info { background:var(--accent-bg); border-color:#cdd8f2; }
  /* תיבות */
  .box { border:1.5px solid var(--accent); border-radius:14px; padding:14px; margin-bottom:12px; }
  .box.once { border-style:dashed; background:#FCFCFD; }
  .box-h { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:900; flex-wrap:wrap; }
  .copy-from { margin-inline-start:auto; display:flex; gap:4px; align-items:center; font-size:12px; font-weight:600; color:var(--muted); flex-wrap:wrap; }
  .copy-from button { border:1px solid var(--border-md); background:#fff; border-radius:8px; padding:3px 8px; font:inherit; font-size:12px; cursor:pointer; }
  .copy-from button:hover { border-color:var(--accent); }
  .box-empty { text-align:center; color:var(--muted); font-size:13px; padding:20px 10px; border:1.5px dashed var(--border-md); border-radius:14px; }
  label.f { display:flex; align-items:baseline; gap:8px; font-size:13px; font-weight:800; margin:12px 0 5px; }
  label.f .cnt { margin-inline-start:auto; font-size:11.5px; font-weight:600; color:var(--muted); }
  label.f .cnt.over { color:var(--orange); }
  .clip { border:none; background:none; cursor:pointer; font-size:14px; padding:0 2px; opacity:.6; }
  .clip:hover { opacity:1; }
  input.t, textarea.t, select.t { width:100%; font:inherit; font-size:14.5px; padding:10px 12px; border:1px solid var(--border-md); border-radius:10px; background:#fff; color:var(--text); }
  textarea.t { min-height:110px; resize:vertical; line-height:1.55; }
  textarea.t.mail { min-height:200px; border-top-left-radius:0; border-top-right-radius:0; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; line-height:1.5; }
  .hint code { direction:ltr; unicode-bidi:isolate; background:#F2F4F7; border-radius:5px; padding:0 4px; font-size:12px; }
  .row2 { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row2 > select.t { width:auto; flex:1; min-width:200px; }
  .fmt { display:flex; flex-wrap:wrap; gap:4px; align-items:center; border:1px solid var(--border-md); border-bottom:none; border-radius:10px 10px 0 0; padding:6px; background:#FAFBFC; }
  .fmt button { border:1px solid var(--border-md); background:#fff; border-radius:7px; padding:4px 8px; font:inherit; font-size:12px; cursor:pointer; }
  .fmt .sep { width:1px; height:20px; background:var(--border-md); margin:0 3px; }
  .fmt select { font:inherit; font-size:12px; padding:3px 6px; border:1px solid var(--border-md); border-radius:7px; }
  .vstrip { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0 0 6px; }
  .vs-l { font-size:12px; font-weight:800; color:var(--text-sm); }
  .vbtn { display:inline-flex; flex-direction:column; align-items:flex-start; border:1.5px solid var(--accent); background:var(--accent-bg); color:var(--accent); border-radius:10px; padding:4px 10px; font:inherit; font-size:13px; font-weight:800; cursor:pointer; line-height:1.25; }
  .vbtn:hover { background:var(--accent); color:#fff; } .vbtn:hover .vx { color:rgba(255,255,255,.8); }
  .vx { font-size:10.5px; font-weight:500; color:var(--muted); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .send-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .btn { border:none; border-radius:12px; padding:13px 22px; font:inherit; font-size:15px; font-weight:900; cursor:pointer; background:var(--yellow); color:#0A2A66; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn.ghost { background:#fff; border:1.5px solid var(--border-md); color:var(--text); }
  .btn.sm { padding:8px 12px; font-size:13px; border-radius:10px; }
  .why { font-size:12.5px; color:var(--orange); }
  /* תבניות */
  .tpl-list { display:flex; flex-direction:column; gap:6px; }
  .tpl-grp { font-size:12px; font-weight:900; color:var(--muted); margin:10px 0 2px; }
  .tpl-grp:first-child { margin-top:0; }
  .tpl-it { display:flex; gap:10px; align-items:center; text-align:right; border:1.5px solid var(--border-md); background:#fff; border-radius:12px; padding:10px 12px; font:inherit; cursor:pointer; width:100%; }
  .tpl-it.on { border-color:var(--accent); background:var(--accent-bg); }
  .tpl-it .ic { font-size:20px; }
  .tpl-it .tt { font-size:14px; font-weight:800; color:var(--text); }
  .tpl-it .ts { font-size:12px; color:var(--muted); margin-top:1px; }
  .tpl-it .chs { margin-inline-start:auto; font-size:13px; white-space:nowrap; }
  .facts { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:13px; line-height:1.55; }
  .facts b { color:var(--text-sm); white-space:nowrap; }
  .tpl-layout { display:grid; grid-template-columns:260px minmax(0,1fr); gap:14px; align-items:start; }
  @media (max-width:700px) { .tpl-layout { grid-template-columns:minmax(0,1fr); } .st-line { grid-template-columns:110px 1fr 64px; } }
  /* תצוגה */
  .side { position:sticky; top:16px; }
  .pv-tabs { display:flex; gap:4px; background:#ECEEF2; border-radius:12px; padding:4px; margin-bottom:10px; flex-wrap:wrap; }
  .pv-tab { flex:1; border:none; background:none; border-radius:9px; padding:8px 4px; font:inherit; font-size:12.5px; font-weight:700; color:var(--text-sm); cursor:pointer; white-space:nowrap; }
  .pv-tab.on { background:#fff; color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .pv-tab:disabled { opacity:.4; cursor:not-allowed; }
  .pv-who { font-size:12.5px; margin-bottom:10px; display:flex; gap:6px; align-items:center; }
  .pv-who select { font:inherit; font-size:12.5px; padding:4px 6px; border:1px solid var(--border-md); border-radius:8px; flex:1; min-width:0; }
  .pv-empty { text-align:center; color:var(--muted); font-size:13px; padding:30px 10px; }
  .pv-cap { font-size:12px; color:var(--muted); margin-bottom:8px; line-height:1.5; }
  .pv-lbl { font-size:11.5px; font-weight:800; color:var(--muted); margin:12px 0 5px; }
  .phone { background:#F6F6F2; border:8px solid #1c1c1c; border-radius:28px; padding:14px 12px; min-height:260px; }
  .ph-tabs { display:flex; gap:5px; background:#F2F2EC; border-radius:12px; padding:3px; margin-bottom:10px; font-size:12px; font-weight:700; color:#6B7A9B; }
  .ph-tabs span { flex:1; text-align:center; padding:7px 2px; border-radius:9px; }
  .ph-tabs span.on { background:#fff; color:#0A2A66; }
  .au-sec { background:#fff; border:1px solid #E7E7E0; border-radius:14px; overflow:hidden; }
  .au-sec.biz { border:2px solid #0A2A66; } .au-sec.biz .au-head { background:#0A2A66; color:#fff; } .au-sec.biz .au-sub { color:rgba(255,255,255,.75); }
  .au-sec.biz2 { border:2px solid #0A2A66; } .au-sec.biz2 .au-head { background:#E8EEFB; }
  .au-head { padding:11px 13px; border-bottom:1px solid #E7E7E0; }
  .au-title { font-size:14.5px; font-weight:900; color:inherit; }
  .au-sub { font-size:11.5px; color:#6B7A9B; margin-top:1px; }
  .au-item { padding:12px 13px; color:#0A2A66; }
  .au-new { font-size:10.5px; font-weight:900; background:#FFD400; border-radius:6px; padding:2px 7px; }
  .au-it { font-size:14.5px; font-weight:800; margin-top:6px; line-height:1.4; word-break:break-word; }
  .au-tx { font-size:13px; color:#6B7A9B; margin-top:3px; line-height:1.55; white-space:pre-line; word-break:break-word; }
  .au-link { display:inline-block; margin-top:8px; font-size:12px; font-weight:800; border:1px solid #E4E4DC; border-radius:9px; padding:5px 9px; background:#fff; }
  .lock { background:linear-gradient(160deg,#2b3a5c,#141b2d); border-radius:28px; border:8px solid #1c1c1c; padding:34px 12px 40px; }
  .lock-time { color:#fff; text-align:center; font-size:40px; font-weight:300; margin-bottom:18px; letter-spacing:1px; }
  .lock-lbl { color:rgba(255,255,255,.6); font-size:11px; margin:10px 4px 5px; }
  .notif { background:rgba(255,255,255,.93); border-radius:16px; padding:11px 12px; display:flex; gap:10px; }
  .notif-ic { width:30px; height:30px; border-radius:50%; background:#0A2A66; color:#FFD400; font-weight:900; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .notif > div:last-child { min-width:0; flex:1; }
  .notif-app { font-size:11px; color:#555; }
  .notif-t { font-size:13.5px; font-weight:800; color:#111; margin-top:1px; word-break:break-word; }
  .notif-b { font-size:13px; color:#333; margin-top:1px; line-height:1.4; word-break:break-word; }
  .notif.col .notif-t, .notif.col .notif-b { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .inbox-row { background:#fff; border:1px solid var(--border); border-radius:12px; padding:9px 11px; font-size:13px; margin-bottom:10px; }
  .inbox-row .s { font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .inbox-row .p { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mail { background:#fff; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .mail-h { padding:10px 12px; border-bottom:1px solid var(--border); font-size:12.5px; color:var(--text-sm); line-height:1.6; word-break:break-word; }
  .mail-h b { color:var(--text); }
  .mail-doc { max-height:520px; overflow:auto; }
  .wa-scr { background:#E5DDD5; border:8px solid #1c1c1c; border-radius:28px; padding:14px 12px 40px; min-height:240px; }
  .wa-top { background:#075E54; color:#fff; margin:-14px -12px 12px; padding:10px 12px; border-radius:20px 20px 0 0; font-size:13px; font-weight:700; }
  .wa-b { background:#DCF8C6; border-radius:10px; padding:8px 10px; font-size:13.5px; line-height:1.5; white-space:pre-line; word-break:break-word; max-width:88%; margin-inline-start:auto; box-shadow:0 1px 1px rgba(0,0,0,.1); }
  .scr { background:#fff; border:8px solid #1c1c1c; border-radius:28px; padding:30px 18px; text-align:center; color:#0A2A66; min-height:300px; }
  .scr h2 { margin:10px 0 12px; font-size:22px; } .scr p { white-space:pre-line; font-size:14px; line-height:1.7; margin:0; text-align:center; }
  .act { border:1px solid var(--border); border-radius:12px; overflow:hidden; background:#fff; }
  .act-h { background:#F9FAFB; padding:9px 12px; font-size:12.5px; font-weight:800; border-bottom:1px solid var(--border); }
  .act-row { padding:9px 12px; border-top:1px solid var(--border); font-size:12.5px; line-height:1.55; }
  .act-row:first-of-type { border-top:none; }
  .act-row .d { color:var(--muted); font-size:11.5px; }
  /* היסטוריה + סטטיסטיקה */
  .res { background:#ECFDF3; border:1px solid #ABEFC6; border-radius:14px; padding:14px; font-size:13.5px; line-height:1.8; }
  .hist-row { border-top:1px solid var(--border); padding:12px 0; font-size:13px; line-height:1.6; }
  .hist-row:first-child { border-top:none; }
  .tag { display:inline-block; font-size:11.5px; font-weight:800; border-radius:6px; padding:1px 7px; background:var(--accent-bg); color:var(--accent); margin-inline-end:4px; margin-top:3px; }
  .stats { margin-top:8px; border:1px solid var(--border); border-radius:12px; padding:12px; background:#FCFCFD; }
  .st-ch { margin-bottom:12px; }
  .st-ch-t { font-size:13px; font-weight:900; margin-bottom:4px; }
  .st-line { display:grid; grid-template-columns:150px 1fr 70px; gap:8px; align-items:center; font-size:12.5px; margin:3px 0; }
  .bar { height:8px; border-radius:6px; background:#EEF0F3; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); border-radius:6px; }
  .bar.g i { background:var(--green); } .bar.r i { background:var(--red); }
  .st-num { text-align:left; font-weight:800; }
  .st-sum { background:var(--accent-bg); border-radius:10px; padding:9px 11px; font-size:13px; line-height:1.6; margin-bottom:12px; }
  .st-tbl { width:100%; border-collapse:collapse; font-size:12.5px; }
  .st-tbl th { text-align:right; font-size:11.5px; color:var(--muted); font-weight:800; padding:5px 6px; border-bottom:1px solid var(--border); position:sticky; top:0; background:#FCFCFD; }
  .st-tbl td { padding:5px 6px; border-bottom:1px solid #F0F2F5; white-space:nowrap; }
  .st-tbl-wrap { max-height:260px; overflow:auto; border:1px solid var(--border); border-radius:10px; margin-top:6px; }
  .ok { color:var(--green); font-weight:800; } .bad { color:var(--red); font-weight:800; } .dim { color:#98A2B3; }
  .wa-go { background:#25D366; color:#fff; border:none; border-radius:8px; padding:3px 9px; font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
  .modal-bg { position:fixed; inset:0; background:rgba(16,24,40,.45); display:none; align-items:center; justify-content:center; padding:16px; z-index:50; }

const cnt = (v, L) => { const n = (v || '').length; const over = L.seen && n > L.seen; return `<span class="cnt${over ? ' over' : ''}">${n}/${L.max}${L.seenTxt ? ' · ' + L.seenTxt : ''}</span>`; };

}

function canSend() {
  const c = counts(), d = state.doc;
  if (!c.n) return isPick() ? 'סמנו לפחות ' + (audKind() === 'fans' ? 'אוהד אחד' : 'עסק אחד') : 'אין נמענים';
  if (!CH_KEYS.some((k) => d.ch[k])) return 'סמנו לפחות מקום אחד';
  if (d.ch.app && (!d.app.title.trim() || !d.app.text.trim())) return 'חסרה כותרת או תוכן בהתראה באפליקציה';
  if (d.ch.push && (!d.push.title.trim() || !d.push.body.trim())) return 'חסרה כותרת או שורה בפוש';
  if (d.ch.mail && (!d.mail.subject.trim() || !stripMeta(d.mail.body))) return 'חסר נושא או גוף במייל';
  if (d.ch.wa && !d.wa.text.trim()) return 'חסרה הודעת וואטסאפ';
  return '';
}
