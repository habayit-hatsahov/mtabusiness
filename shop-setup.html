<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Yellow Zone – מה יוצג בכרטיס שלכם</title>
<!-- §796ו – בעל עסק אונליין בוחר בעצמו מה יוצג בכרטיס העסק ב-Yellow Zone: אוטומטי / 5 קטגוריות + מוצרים ראשונים.
     הקישור נוצר ב-admin-shops ("🔗 קישור לבעל העסק") וחתום – POST /shop-owner. בלי כניסה, בלי logEvent. -->
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0A2A66; --ink-2: #3A4C7A; --ink-3: #6B7A9B; --line: #E7E7E0; --field: #F2F2EC; --acc: #FFD400; --acc-soft: #FFF7DB; --acc-line: #FFE9A3; --ok: #067647; --ok-bg: #ECFDF3; --bad: #3A4C7A;   /* בלי אדום (רמי, 23.11) */ }
  * { box-sizing: border-box; }
  body { margin: 0; background: #F6F6F2; color: var(--ink); font-family: Rubik, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 90px; }
  .yz { display: inline-flex; background: var(--ink); color: var(--acc); font-weight: 900; font-size: 14px; border-radius: 999px; padding: 6px 13px; }
  h1 { font-size: 21px; margin: 12px 0 4px; line-height: 1.35; }
  .lead { margin: 0 0 16px; font-size: 14px; color: var(--ink-2); line-height: 1.6; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 4px; font-size: 16px; }
  .card .sub { font-size: 13px; color: var(--ink-3); line-height: 1.55; margin-bottom: 10px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; margin-top: 8px; }
  .opt.on { border-color: var(--acc); background: var(--acc-soft); }
  .opt input { margin-top: 3px; accent-color: var(--ink); width: 18px; height: 18px; }
  .opt b { display: block; font-size: 15px; }
  .opt span { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { border: 1px solid #D5D9E2; background: #fff; color: var(--ink); border-radius: 999px; padding: 8px 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--acc); }
  .chip small { opacity: .6; font-weight: 500; }
  .count { font-size: 13px; font-weight: 700; color: var(--ink-3); }
  .srch { display: flex; gap: 8px; }
  .srch input { flex: 1; min-width: 0; font: inherit; font-size: 15px; border: 1px solid #D5D9E2; border-radius: 12px; padding: 10px 12px; }
  button.b { font: inherit; font-weight: 800; font-size: 14px; border-radius: 12px; padding: 10px 14px; cursor: pointer; border: 1px solid #D5D9E2; background: #fff; color: var(--ink); }
  button.b:disabled { opacity: .5; }
  .item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .item:first-child { border-top: 0; }
  .item img { width: 44px; height: 44px; object-fit: cover; border-radius: 10px; background: var(--field); flex: none; }
  .item .t { flex: 1; line-height: 1.35; }
  .item .t small { display: block; color: var(--ink-3); font-size: 12.5px; }
  .item .n { width: 20px; font-weight: 800; text-align: center; }
  .x { border: 0; background: none; color: var(--bad); font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .up { border: 1px solid #D5D9E2; background: #fff; border-radius: 8px; cursor: pointer; padding: 2px 8px; color: var(--ink); }
  .add { border: 0; background: var(--acc); color: var(--ink); border-radius: 10px; font: inherit; font-weight: 800; font-size: 13px; padding: 7px 11px; cursor: pointer; }
  .tip { background: var(--acc-soft); border: 1px solid var(--acc-line); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; line-height: 1.6; color: var(--ink-2); }
  .tip b { color: var(--ink); }
  .bar { position: fixed; inset-inline: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bar .in { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
  .save { flex: 1; border: 0; background: var(--ink); color: var(--acc); font: inherit; font-weight: 800; font-size: 16px; border-radius: 14px; padding: 13px; cursor: pointer; }
  .save:disabled { opacity: .6; }
  .pv { text-decoration: none; font-weight: 800; font-size: 14px; color: var(--ink); border: 1px solid #D5D9E2; border-radius: 14px; padding: 12px 14px; white-space: nowrap; }
  .msg { font-size: 13.5px; margin-top: 8px; }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
  .boot { padding: 60px 0; text-align: center; color: var(--ink-3); font-size: 15px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <span class="yz">Yellow Zone</span>
  <h1 id="h1">מה יוצג בכרטיס העסק שלכם</h1>
  <p class="lead" id="lead">בכרטיס שלכם באפליקציה יש סקשן "מה יש באתר" – המוצרים מהאתר שלכם, מתעדכנים לבד. כאן בוחרים מה יופיע בו.</p>
  <div id="app"><div class="boot">טוען…</div></div>
</div>
<div class="bar" id="bar" style="display:none"><div class="in">
  <button class="save" id="save">שמירה</button>
  <a class="pv" id="pv" target="_blank" rel="noopener">👀 איך זה נראה</a>
</div></div>

<script>
(function () {
  'use strict';
  var HOSTS = ['https://api.yellowzone.co.il', 'https://habayit-hatsahov.web.app/api', 'https://habayit-hatsahov-worker.yellowzone.workers.dev'];
  var P = new URLSearchParams(location.search), BIZ = P.get('biz') || '', K = P.get('k') || '';
  var S = null, res = null, busy = false;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fmt = function (n) { return Number(n || 0).toLocaleString('he-IL'); };
  function api(body) {
    body.biz = BIZ; body.k = K;
    var go = function (i) {
      if (i >= HOSTS.length) return Promise.reject(new Error('אין חיבור – נסו שוב'));
      var ac = window.AbortController ? new AbortController() : null, tm = setTimeout(function () { ac && ac.abort(); }, i + 1 < HOSTS.length ? 20000 : 30000);
      return fetch(HOSTS[i] + '/shop-owner', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ac ? ac.signal : undefined })
        .then(function (r) { clearTimeout(tm); return r.json(); }, function () { clearTimeout(tm); return go(i + 1); });
    };
    return go(0);
  }
  function render() {
    var man = S.mode === 'manual';
    var h = '<div class="card"><h2>איך לבחור את הלשוניות?</h2>' +
      '<label class="opt' + (!man ? ' on' : '') + '"><input type="radio" name="m" value="auto"' + (!man ? ' checked' : '') + '><div><b>אוטומטי (מומלץ)</b><span>"הכי נמכרים" + 3 הקטגוריות שהכי נמכרות אצלכם + מבצעים/אאוטלט אם יש. מתעדכן לבד לפי המכירות באתר.</span></div></label>' +
      '<label class="opt' + (man ? ' on' : '') + '"><input type="radio" name="m" value="manual"' + (man ? ' checked' : '') + '><div><b>אני בוחר 5 קטגוריות</b><span>אתם בוחרים אילו קטגוריות מהאתר יופיעו ובאיזה סדר.</span></div></label></div>';
    if (man) {
      h += '<div class="card"><h2>הקטגוריות <span class="count">(' + S.cats.length + '/5)</span></h2><div class="sub">לחצו לפי הסדר שתרצו – הראשונה שתלחצו תהיה הלשונית הראשונה.</div><div class="chips">' +
        S.allCats.map(function (c) { var n = S.cats.findIndex(function (x) { return x.id === c.id; });
          return '<button type="button" class="chip' + (n >= 0 ? ' on' : '') + '" data-c="' + c.id + '">' + (n >= 0 ? (n + 1) + '. ' : '') + esc(c.n) + ' <small>(' + fmt(c.c) + ')</small></button>'; }).join('') + '</div></div>';
    }
    h += '<div class="card"><h2>⭐ מוצרים שיופיעו ראשונים <span class="count">(' + S.pinned.length + '/12)</span></h2><div class="sub">לא חובה. המוצרים שתבחרו יופיעו בלשונית "מומלצים", ראשונה בכרטיס.</div>' +
      (S.pinned.length ? '<div>' + S.pinned.map(function (p, i) { return '<div class="item"><span class="n">' + (i + 1) + '</span>' + (p.img ? '<img src="' + esc(p.img) + '" alt="">' : '') + '<span class="t">' + esc(p.n) + '</span>' + (i ? '<button type="button" class="up" data-up="' + i + '">↑</button>' : '') + '<button type="button" class="x" data-x="' + i + '" aria-label="הסרה">✕</button></div>'; }).join('') + '</div>' : '') +
      (S.pinned.length < 12 ? '<div class="srch" style="margin-top:10px"><input id="q" placeholder="חיפוש מוצר מהאתר שלכם…" enterkeyhint="search"><button type="button" class="b" id="go">חיפוש</button></div>' +
        (res ? (res.length ? '<div style="margin-top:6px">' + res.map(function (p, i) { var has = S.pinned.some(function (x) { return x.id === p.id; });
          return '<div class="item"><img src="' + esc(p.img) + '" alt="" loading="lazy"><span class="t">' + esc(p.n) + '<small>' + fmt(p.p) + ' ₪</small></span>' + (has ? '<span class="count">✓ נבחר</span>' : '<button type="button" class="add" data-add="' + i + '">+ הוספה</button>') + '</div>'; }).join('') + '</div>' : '<div class="msg">לא נמצאו מוצרים</div>') : '') : '') + '</div>' +
      '<div class="tip">💡 אפשר לחזור לכאן ולשנות בכל זמן – גם מ<b>האזור האישי של העסק</b> באפליקציה.</div>' +
      '<div class="msg" id="msg"></div>';
    $('app').innerHTML = h;
  }
  function msg(t, ok) { var m = $('msg'); if (m) { m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'bad'); } }
  document.addEventListener('change', function (e) { if (e.target.name === 'm') { S.mode = e.target.value; render(); } });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t || !S) return;
    if (t.dataset.c) { var c = +t.dataset.c, n = S.cats.findIndex(function (x) { return x.id === c; });
      if (n >= 0) S.cats.splice(n, 1); else if (S.cats.length < 5) { var f = S.allCats.find(function (x) { return x.id === c; }); S.cats.push({ id: c, n: f.n }); } else return msg('אפשר עד 5 קטגוריות');
      return render(); }
    if (t.dataset.x != null) { S.pinned.splice(+t.dataset.x, 1); return render(); }
    if (t.dataset.up != null) { var i = +t.dataset.up; S.pinned.splice(i - 1, 0, S.pinned.splice(i, 1)[0]); return render(); }
    if (t.dataset.add != null) { var p = res[+t.dataset.add]; if (p && S.pinned.length < 12) S.pinned.push({ id: p.id, n: p.n, img: p.img }); return render(); }
    if (t.id === 'go') search();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'q') { e.preventDefault(); search(); } });
  function search() {
    var q = ($('q') || {}).value || ''; if (q.trim().length < 2) return;
    var g = $('go'); g.disabled = true; g.textContent = 'מחפש…';
    api({ action: 'search', q: q }).then(function (r) { res = r.ok ? r.products : []; render(); var qi = $('q'); if (qi) qi.value = q; if (!r.ok) msg(r.error || 'החיפוש נכשל'); })
      .catch(function (er) { g.disabled = false; g.textContent = 'חיפוש'; msg(er.message); });
  }
  $('save').onclick = function () {
    if (busy || !S) return;
    if (S.mode === 'manual' && !S.cats.length) return msg('בחרו לפחות קטגוריה אחת, או "אוטומטי"');
    busy = true; $('save').disabled = true; $('save').textContent = 'שומר…';
    api({ action: 'save', shopMode: S.mode, shopCats: S.cats, pinned: S.pinned }).then(function (r) {
      busy = false; $('save').disabled = false; $('save').textContent = 'שמירה';
      if (r.ok) msg('✓ נשמר! הכרטיס שלכם עודכן. אפשר ללחוץ "איך זה נראה" לראות.', true); else msg(r.error || 'השמירה נכשלה');
    }).catch(function (er) { busy = false; $('save').disabled = false; $('save').textContent = 'שמירה'; msg(er.message); });
  };
  if (!BIZ || !K) { $('app').innerHTML = '<div class="boot">הקישור לא שלם. בקשו מאיתנו קישור חדש 💛</div>'; return; }
  api({ action: 'get' }).then(function (r) {
    if (!r.ok) { $('app').innerHTML = '<div class="boot">' + (r.error === 'bad_link' ? 'הקישור לא תקף (אולי הוחלף בקישור חדש). בקשו מאיתנו קישור חדש 💛' : r.error === 'not_open_woo' ? 'לעסק הזה עוד אין חנות שאפשר להציג.' : esc(r.error || 'משהו השתבש')) + '</div>'; return; }
    S = { mode: r.mode, cats: r.cats || [], pinned: r.pinned || [], allCats: r.allCats || [] };
    $('h1').textContent = 'מה יוצג בכרטיס של ' + r.name;
    $('pv').href = 'biz-shop-demo.html?biz=' + encodeURIComponent(BIZ);
    $('bar').style.display = '';
    render();
  }).catch(function (er) { $('app').innerHTML = '<div class="boot">' + esc(er.message) + '</div>'; });
})();
</script>
</body>
</html>
