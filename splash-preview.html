<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ECC94B">
<title>תצוגת מסך פתיחה – Yellow Zone</title>
<!-- §536ד — "בדיקה בטלפון" מהלשונית "מסך פתיחה" במרכז הניהול. מריץ את splash-photo.js עצמו במצב תצוגה
     (YZ_SPLASH_PREVIEW), כך שהתמונה נראית בדיוק כמו בפתיחת האפליקציה – אותו צבע, אותו גודל, אותו רקע.
     ?u=כתובת התמונה (רק מהאחסון שלנו או מ-images/splash). לחיצה = פתיחה מחדש. -->
<style>
  html, body { margin: 0; height: 100%; background: #ECC94B; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  .msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; color: #0A2A66; font-weight: 700; }
</style>
</head>
<body>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var u = p.get('u') || '';
  var okUrl = /^https:\/\/firebasestorage\.googleapis\.com\/v0\/b\/habayit-hatsahov\.firebasestorage\.app\/o\/landing%2Fsplash%2F/.test(u) ||
    /^https:\/\/(www\.)?yellowzone\.co\.il\/images\/splash\/[\w.-]+$/.test(u);
  if (!okUrl) {
    document.body.innerHTML = '<div class="msg">הקישור לא תקין – פתחו אותו מחדש מ"מסך פתיחה" במרכז הניהול.</div>';
    return;
  }
  window.YZ_SPLASH_PREVIEW = u;
})();
</script>
<script src="splash-photo.js"></script>
</body>
</html>
