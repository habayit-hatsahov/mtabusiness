<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>דמו – לב לאוהד שמאחורי העסק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#E9EDF5;font-family:Rubik,sans-serif;color:#0A2A66}
  .demo-bar{position:sticky;top:0;z-index:50;background:#0A2A66;color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
  .demo-bar b{color:#FFD400;margin-inline-end:auto}
  .demo-bar button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.14);color:#fff}
  .demo-bar button.on{background:#FFD400;color:#0A2A66}
  .wrap{max-width:430px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 30px rgba(10,42,102,.12)}
  .note{max-width:430px;margin:0 auto;padding:12px 16px;font-size:12.5px;line-height:1.6;color:#3A4C7A;background:#FFF8CC;border-bottom:1px solid #F0E08A}

  /* ── הלב בראש הגיליון ── */
  .yl-hero-like{position:absolute!important;left:16px;bottom:18px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:4px}
  .yl-heart{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(10,42,102,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .15s ease,background .2s ease}
  .yl-heart svg{width:32px;height:32px;transition:transform .2s ease}
  .yl-heart svg path{fill:none;stroke:#fff;stroke-width:2}
  .yl-heart.liked{background:#FFD400;border-color:#FFD400}
  .yl-heart.liked svg path{fill:#0A2A66;stroke:#0A2A66}
  .yl-heart:active{transform:scale(.92)}
  .yl-heart.pop svg{animation:ylPop .45s ease}
  @keyframes ylPop{0%{transform:scale(1)}35%{transform:scale(1.45)}70%{transform:scale(.9)}100%{transform:scale(1)}}
  .yl-count{font-size:15px;font-weight:900;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);line-height:1}
  .yl-count small{display:block;font-size:10.5px;font-weight:700;color:#FFD400;margin-top:2px}
  .wk-hero.fan-photo > .t,.wk-hero.fan-photo > .who{margin-inline-end:84px}
  .yl-burst{position:absolute;left:50%;top:50%;pointer-events:none;font-size:18px;animation:ylFly .9s ease-out forwards}
  @keyframes ylFly{from{opacity:1;transform:translate(-50%,-50%) scale(.6)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2)}}

  /* ── שורת ההנעה מתחת לכותרת ── */
  .yl-nudge{display:flex;align-items:center;gap:10px;background:#FFF8CC;border:1px solid #F3E27A;border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.45;color:#0A2A66}
  .yl-nudge b{font-weight:800}
  .yl-nudge .yl-mini{flex:none;width:40px;height:40px}
  .yl-nudge .yl-mini svg{width:22px;height:22px}
  .yl-mini{border-radius:50%;border:2px solid #0A2A66;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .yl-mini svg path{fill:none;stroke:#0A2A66;stroke-width:2.2}
  .yl-mini.liked{background:#FFD400;border-color:#FFD400}
  .yl-mini.liked svg path{fill:#0A2A66}

  /* ── בסוף הסיפור ── */
  .yl-end{text-align:center;background:#0A2A66;color:#fff;border-radius:18px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .yl-end h3{margin:0;font-size:18px;font-weight:800;color:#FFD400}
  .yl-end p{margin:0;font-size:13.5px;line-height:1.55;opacity:.92}
  .yl-end .yl-big{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;background:#FFD400;color:#0A2A66;font:inherit;font-size:16px;font-weight:900;cursor:pointer}
  .yl-end .yl-big svg{width:22px;height:22px}
  .yl-end .yl-big svg path{fill:none;stroke:#0A2A66;stroke-width:2.4}
  .yl-end .yl-big.liked{background:#fff}
  .yl-end .yl-big.liked svg path{fill:#0A2A66}
  .yl-end .yl-sub{font-size:12px;opacity:.75}

  /* ── התיבה בקרוסלה (בחוץ) ── */
  .yl-slide-wrap{padding:16px}
  .yl-slide-wrap h4{margin:0 0 8px;font-size:13px;color:#3A4C7A}
  .yl-slide-chip{position:absolute!important;left:14px;top:14px;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.95);color:#0A2A66;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
  .yl-slide-chip svg{width:14px;height:14px}
  .yl-slide-chip svg path{fill:#0A2A66}
  .sec-label{max-width:430px;margin:0 auto;padding:14px 16px 4px;font-size:12px;font-weight:800;color:#6B7BA3;letter-spacing:.03em}
</style>
</head>
<body>
<div class="demo-bar">
  <b>דמו · לב לאוהד</b>
  <button type="button" data-n="47" class="on">עם לבבות (47)</button>
  <button type="button" data-n="0">עוד אין לבבות</button>
  <button type="button" id="demoReset">לאפס את הלב שלי</button>
</div>
<div class="note">
  דמו בלבד – לא נשמר בשום מקום. 47 הוא מספר לדוגמה. לב אחד לכל אוהד מחובר, ואפשר לבטל בלחיצה נוספת.
  הלב מופיע בשני מקומות: <b>בראש הגיליון</b> ו<b>שורת הנעה</b> מתחת לפרטי בעל העסק. שניהם מחוברים לאותו לב.
</div>

<div class="sec-label">1 · הגיליון שנפתח (הכר את העסק)</div>
<div class="wrap"><div class="wk-sheet wk-inline" id="sheet"></div></div>

<div class="sec-label">2 · התיבה בקרוסלה בדף הבית (רשות)</div>
<div class="wrap" style="min-height:0"><div class="yl-slide-wrap"><div id="slide" style="position:relative;height:212px;display:flex"></div></div></div>
<div style="height:40px"></div>

<script src="weekly-render.js?v=617"></script>
<script>
(function () {
  WK.injectCss();
  var d = WK.load(), f = d.fan;
  var first = String(f.owner || '').split(' ')[0] || 'לבעל העסק';
  var HEART = '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 6.9 4.5c2.1 0 3.6 1.2 5.1 3 1.5-1.8 3-3 5.1-3 3.5 0 5.5 3.5 4.2 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" stroke-linejoin="round"/></svg>';
  var state = { base: 47, mine: false };

  var ctx = WK.ctxFor(d);
  var sheet = document.getElementById('sheet');
  sheet.innerHTML = WK.sheetInner('fan', d, ctx);
  var close = sheet.querySelector('.wk-close'); if (close) close.removeAttribute('onclick');

  // 1 – בראש הגיליון
  var hero = sheet.querySelector('.wk-hero');
  var heroLike = document.createElement('div');
  heroLike.className = 'yl-hero-like';
  heroLike.innerHTML = '<button type="button" class="yl-heart" data-like aria-label="לפרגן ל' + first + '">' + HEART + '</button><div class="yl-count" id="heroCount"></div>';
  hero.appendChild(heroLike);

  // 2 – שורת הנעה מתחת לבעל העסק
  var owner = sheet.querySelector('.wk-owner');
  var nudge = document.createElement('div');
  nudge.className = 'yl-nudge';
  nudge.innerHTML = '<button type="button" class="yl-mini" data-like aria-label="לפרגן">' + HEART + '</button><div id="nudgeText"></div>';
  (owner || sheet.querySelector('.wk-lead')).insertAdjacentElement('afterend', nudge);

  // התיבה בחוץ
  var slide = document.getElementById('slide');
  slide.innerHTML = WK.slideHtml('fan', d, { preview: true, t: ctx.t });
  var sl = slide.firstChild; sl.style.width = '100%'; sl.style.flex = '1 1 auto'; sl.style.maxWidth = 'none'; sl.style.borderRadius = '18px';
  var chip = document.createElement('span'); chip.className = 'yl-slide-chip'; chip.id = 'slideChip';
  sl.appendChild(chip);

  function total() { return state.base + (state.mine ? 1 : 0); }
  function render() {
    var n = total(), others = state.base;
    document.getElementById('heroCount').innerHTML = n ? n + '<small>פירגנו</small>' : '<small>היו<br>ראשונים</small>';
    document.getElementById('nudgeText').innerHTML = state.mine
      ? '<b>פירגנת ל' + first + ' 💛</b> ' + (others ? 'יחד איתך ' + n + ' אוהדים.' : 'היית הראשון!')
      : (others ? '<b>' + others + ' אוהדים</b> כבר פירגנו ל' + first + '. תנו גם אתם לב ונפרגן לעסק ביחד.' : '<b>היו הראשונים לפרגן ל' + first + '</b> – לב אחד אומר לו שהקהילה מאחוריו.');
    document.getElementById('slideChip').innerHTML = HEART + (n ? n : 'לפרגן');
    document.querySelectorAll('[data-like]').forEach(function (b) { b.classList.toggle('liked', state.mine); });
  }
  function burst(btn) {
    btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
    if (!state.mine) return;
    for (var i = 0; i < 7; i++) {
      var s = document.createElement('span'); s.className = 'yl-burst'; s.textContent = '💛';
      var a = (Math.PI * 2 * i) / 7; s.style.setProperty('--dx', Math.round(Math.cos(a) * 48) + 'px'); s.style.setProperty('--dy', Math.round(Math.sin(a) * 48) + 'px');
      btn.style.position = 'relative'; btn.style.overflow = 'visible'; btn.appendChild(s);
      setTimeout(function (el) { el.remove(); }.bind(null, s), 950);
    }
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-like]');
    if (b) { state.mine = !state.mine; render(); burst(b); return; }
    var n = e.target.closest('.demo-bar [data-n]');
    if (n) { state.base = +n.dataset.n; document.querySelectorAll('.demo-bar [data-n]').forEach(function (x) { x.classList.toggle('on', x === n); }); render(); }
    if (e.target.id === 'demoReset') { state.mine = false; render(); }
  });
  render();
})();
</script>
</body>
</html>
