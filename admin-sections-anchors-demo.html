<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דמו — מרכז ניהול (דשבורד ראשי)</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  /* Clean & Modern SaaS (Stripe/Linear/Vercel) — ניטרלי, בהיר, בלי צבעי מותג */
  --bg: #F9FAFB;
  --nav-bg: #F3F4F6;
  --card-bg: #FFFFFF;
  --card-bg2: #FFFFFF;
  --accent: #111827;
  --accent-dark: #000000;
  --text: #111827;
  --text-sm: #6B7280;
  --text-muted: #9CA3AF;
  --green: #16A34A;
  --orange: #B45309;
  --red: #DC2626;
  --border: #E5E7EB;
  --border-md: #D1D5DB;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Heebo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 60px;
}

/* ── layout: sidebar + main (כמו פאנל ניהול) ── */
.dash-layout { max-width: 2200px; margin: 0 auto; padding: 20px 32px 0; display: flex; align-items: flex-start; gap: 18px; }
.sidebar {
  width: 208px; flex-shrink: 0; position: sticky; top: 20px; transition: width .15s;
  background: var(--card-bg2); border: 1px solid var(--border-md); border-radius: 14px; padding: 14px 10px;
}
.sidebar.collapsed { width: 52px; padding: 14px 6px; }
.sidebar-collapse-btn {
  display: flex; align-items: center; justify-content: center; width: 100%; height: 26px;
  border-radius: 8px; cursor: pointer; color: var(--text-muted); font-size: 13px; margin-bottom: 10px;
}
.sidebar-collapse-btn:hover { background: rgba(17,24,39,.06); color: var(--text); }
.sidebar.collapsed .sidebar-standalone { justify-content: center; padding: 11px 0; }
.sidebar.collapsed .sidebar-standalone span:not(.ic) { display: none; }
/* פריט עצמאי בראש הסיידבר (כל העסקים) — לא נעלם, לא תלוי בקבוצות שמתחתיו */
.sidebar-standalone {
  display: flex; align-items: center; gap: 9px; padding: 11px 11px; border-radius: 10px;
  cursor: pointer; margin-bottom: 12px; border: 1.5px solid var(--border-md); transition: all .12s;
  font-size: 12.5px; font-weight: 800; color: var(--text-sm);
}
.sidebar-standalone:hover { border-color: var(--accent); color: var(--text); }
.sidebar-standalone.active { border-color: var(--accent); background: rgba(17,24,39,.1); color: var(--accent); }
.sidebar-standalone .ic { font-size: 16px; }
.sidebar-divider { height: 1px; background: var(--border); margin: 2px 0 12px; }
.sidebar-section-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; padding: 0 4px; margin-bottom: 6px; }
/* קבוצות (סקשנים/קטגוריות) — הכותרת תמיד גלויה, נפתחת/נסגרת במקום, לא מוחקת כלום אחר */
.sidebar-group-header {
  display: flex; align-items: center; justify-content: space-between; padding: 9px 9px; border-radius: 9px;
  font-size: 11.5px; font-weight: 800; color: var(--text-sm); cursor: pointer; margin-bottom: 3px; transition: all .12s;
}
.sidebar-group-header:hover { background: rgba(17,24,39,.04); color: var(--text); }
.sidebar-group-header .chev { font-size: 9px; color: var(--text-muted); transition: transform .15s; }
.sidebar-group-header.open .chev { transform: rotate(180deg); }
.sidebar-group-body { margin: 0 0 10px 0; }
.sidebar-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 9px 8px 9px; border-radius: 9px;
  font-size: 12.5px; font-weight: 700; color: var(--text-sm); cursor: pointer; margin-bottom: 2px; transition: all .12s;
}
.sidebar-item:hover { background: rgba(17,24,39,.05); color: var(--text); }
.sidebar-item.active { background: rgba(17,24,39,.13); color: var(--accent); }
.main-content { flex: 1; min-width: 0; }
@media (max-width: 720px) {
  .dash-layout { flex-direction: column; }
  .sidebar { width: 100%; position: static; }
}

/* ── הסבר כללי + מילון מונחים — מקופל כברירת מחדל ── */
.info-accordion { background: var(--card-bg2); border: 1px solid var(--border-md); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
.info-accordion-header {
  display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
  cursor: pointer; font-size: 12.5px; font-weight: 800; color: var(--text-sm);
}
.info-accordion-header:hover { color: var(--text); }
.info-accordion-header .chev { font-size: 11px; color: var(--text-muted); transition: transform .15s; }
.info-accordion.open .chev { transform: rotate(180deg); }
.info-accordion-body { display: none; padding: 0 16px 16px; }
.info-accordion.open .info-accordion-body { display: block; }
.info-explainer { font-size: 12.5px; line-height: 1.9; color: var(--text-sm); margin-bottom: 14px; }
.info-explainer b { color: var(--text); }
.info-explainer .yl { color: var(--accent); }
.glossary-title { font-size: 11.5px; font-weight: 800; color: var(--text-muted); margin-bottom: 10px; }
.glossary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
.glossary-item { font-size: 11.5px; line-height: 1.6; }
.glossary-item .term { color: var(--accent); font-weight: 800; }
.glossary-item .def { color: var(--text-sm); }
@media (max-width: 480px) { .glossary-grid { grid-template-columns: 1fr; } }

.placeholder-note {
  background: var(--card-bg2); border: 1px dashed var(--border-md); border-radius: 12px;
  padding: 40px 16px; text-align: center; color: var(--text-muted); font-size: 13px;
}

/* ── כל העסקים: כרטיסי סטטיסטיקה + פילטר + בחירה מרובה + רשימת שורות קומפקטית ── */
/* 3 כרטיסי מידע בלבד — בדיוק כמו ב-admin-businesses.html היום (עסקים נרשמו/ממתינים לאישור/עסקים פעילים).
   אלה תצוגת מידע, לא כפתורי סינון — הסינון בפועל הוא שורת filter-btn נפרדת למטה, בדיוק כמו במקור. */
.biz-stats-row { display: flex; gap: 10px; margin-bottom: 18px; }
.biz-stat-card {
  flex: 1; background: var(--card-bg2); border: 1px solid var(--border-md); border-radius: 12px;
  padding: 14px 16px; text-align: center;
}
.biz-stat-card .num { font-size: 26px; font-weight: 900; color: var(--accent); }
.biz-stat-card.pending .num { color: var(--orange); }
.biz-stat-card.approved .num { color: var(--green); }
.biz-stat-card .lbl { font-size: 11.5px; color: var(--text-sm); margin-top: 3px; font-weight: 700; }

/* שורת סינון — 5 כפתורים + חיפוש, בדיוק כמו filter-bar במקור */
.biz-filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.biz-filter-btn {
  padding: 7px 15px; border-radius: 20px; border: 1.5px solid var(--border-md); background: var(--card-bg2);
  font-family: 'Heebo', sans-serif; font-size: 12.5px; font-weight: 700; color: var(--text-sm); cursor: pointer; transition: all .15s; white-space: nowrap;
}
.biz-filter-btn.active { background: rgba(17,24,39,.15); border-color: var(--accent); color: var(--accent); }
.biz-filter-btn.changes { border-color: rgba(217,119,6,.4); color: var(--orange); background: rgba(217,119,6,.1); }
.biz-filter-btn.changes.active { background: #d97706; border-color: #d97706; color: #1a1a1a; }
.biz-changes-badge {
  display: inline-flex; align-items: center; justify-content: center; background: #d97706; color: #fff;
  font-size: 10.5px; font-weight: 800; min-width: 17px; height: 17px; border-radius: 9px; padding: 0 4px; margin-right: 3px;
}
.biz-filter-btn.changes.active .biz-changes-badge { background: #1a1a1a; color: #fbbf24; }
.biz-search {
  flex: 1; min-width: 180px; padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--border-md);
  background: var(--nav-bg); color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px;
}
.biz-search:focus { border-color: var(--accent); outline: none; }

/* ── סרגל סינון חדש (כל העסקים / כל האוהדים) — חיפוש+דרופדאונים+פילים, נקי ומכוון-משימה ── */
.filter-toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.filter-toolbar-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filter-search-input {
  flex: 1; min-width: 220px; max-width: 320px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-md);
  background: var(--card-bg); color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px;
}
.filter-search-input:focus { border-color: var(--accent); outline: none; }
.filter-select {
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-md); background: var(--card-bg);
  color: var(--text); font-family: 'Heebo', sans-serif; font-size: 12.5px; cursor: pointer;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-pill {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border-md); background: var(--card-bg);
  font-family: 'Heebo', sans-serif; font-size: 12.5px; font-weight: 700; color: var(--text-sm); cursor: pointer; transition: all .12s; white-space: nowrap;
}
.filter-pill:hover { border-color: var(--accent); color: var(--text); }
.filter-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.filter-pill.active .biz-changes-badge { background: #fff; color: var(--accent); }
.filter-clear {
  font-size: 12px; color: var(--text-sm); cursor: pointer; text-decoration: underline; background: none; border: none;
  font-family: 'Heebo', sans-serif; padding: 0;
}
.filter-clear:hover { color: var(--accent); }

.biz-select-all-row { display: flex; align-items: center; gap: 10px; margin-inline-start: auto; }
.biz-select-all-btn {
  flex-shrink: 0; border: 1.5px solid var(--border-md); background: var(--card-bg2); color: var(--text-sm);
  font-family: 'Heebo', sans-serif; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 20px; cursor: pointer; white-space: nowrap;
}
.biz-select-all-btn.active { background: rgba(17,24,39,.15); border-color: var(--accent); color: var(--accent); }
.biz-sel-count { font-size: 11.5px; color: var(--text-muted); }

.biz-bulk-bar {
  display: flex; align-items: center; gap: 10px; background: rgba(17,24,39,.08); border: 1px solid rgba(17,24,39,.3);
  border-radius: 10px; padding: 9px 13px; margin-bottom: 12px; font-size: 12.5px; font-weight: 700; color: var(--accent);
}
.biz-bulk-bar .sp { flex: 1; }
.biz-bulk-btn {
  border: none; font-family: 'Heebo', sans-serif; font-size: 11.5px; font-weight: 800; padding: 6px 12px;
  border-radius: 8px; cursor: pointer;
}
.biz-bulk-btn.approve { background: var(--green); color: #0f1524; }
.biz-bulk-btn.reject { background: var(--red); color: #fff; }
.biz-bulk-btn.cancel { background: transparent; border: 1.5px solid var(--border-md); color: var(--text-sm); }

/* שורת עסק — בדיוק תואמת ל-biz-card של admin-businesses.html: מסגרת ימין צבעונית לפי סטטוס,
   אווטאר גנרי, שם + תג "✏️ שינויים", שורת meta (סוג+עיר), צ'יפ סטטוס, שברון פתיחה */
.biz-list { border: 1px solid var(--border-md); border-radius: 10px; overflow: hidden; }
.biz-row {
  background: var(--card-bg); border-bottom: 1px solid var(--border); border-right: 3px solid transparent;
  padding: 9px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background .12s;
}
.biz-row:last-child { border-bottom: none; }
.biz-row:hover { background: rgba(17,24,39,.03); }
.biz-row.pending  { border-right-color: var(--orange); }
.biz-row.approved { border-right-color: var(--green); }
.biz-row.rejected { border-right-color: var(--border-md); opacity: .6; }
.biz-row.selected { background: rgba(17,24,39,.06); }
.biz-row-checkbox {
  flex-shrink: 0; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border-md);
  cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--accent);
}
.biz-row.selected .biz-row-checkbox { border-color: var(--accent); background: rgba(17,24,39,.15); }
.biz-row-icon {
  flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px; background: var(--card-bg2);
  display: flex; align-items: center; justify-content: center; font-size: 15px;
}
.biz-row-main { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.biz-row-name { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; }
.biz-row-meta { font-size: 11.5px; color: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.biz-change-badge {
  font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 9px; white-space: nowrap; flex-shrink: 0;
  color: var(--accent); background: rgba(17,24,39,.13); border: 1px solid rgba(17,24,39,.3);
}
.biz-status-badge { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
.biz-status-badge.approved { color: var(--green); background: rgba(22,163,74,.12); }
.biz-status-badge.pending  { color: var(--orange); background: rgba(217,119,6,.12); }
.biz-status-badge.rejected { color: var(--text-sm); background: rgba(17,24,39,.08); }
.biz-row-chevron { flex-shrink: 0; color: var(--text-muted); font-size: 15px; }

/* ── דשבורד ראשי (Home) — סרגל KPI קומפקטי, מרכז משימות, בריאות פרופיל ── */
.kpi-strip {
  display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 18px; margin-bottom: 20px;
}
.kpi-item { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.kpi-item .kpi-num { font-size: 17px; font-weight: 800; color: var(--text); }
.kpi-item.alert .kpi-num { color: var(--orange); }
.kpi-item .kpi-lbl { font-size: 12px; color: var(--text-sm); font-weight: 600; }
.kpi-item .kpi-delta { font-size: 11.5px; color: var(--green); font-weight: 700; }
.kpi-divider { width: 1px; height: 20px; background: var(--border-md); }

.section-h2 { font-size: 13.5px; font-weight: 800; color: var(--text-sm); margin: 22px 0 10px; display: flex; align-items: center; gap: 6px; }
.section-h2-row { display: flex; align-items: center; justify-content: flex-start; gap: 10px 16px; flex-wrap: wrap; margin: 22px 0 10px; }
.section-h2-row .section-h2 { margin: 0; }
.section-h2-row .filter-toolbar { margin-bottom: 0; }

.action-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.action-tab {
  padding: 9px 16px; border-radius: 20px; border: 1.5px solid var(--border-md); background: var(--card-bg2);
  font-family: 'Heebo', sans-serif; font-size: 12.5px; font-weight: 800; color: var(--text-sm); cursor: pointer; transition: all .15s;
}
.action-tab.active { background: rgba(17,24,39,.15); border-color: var(--accent); color: var(--accent); }
.action-tab .cnt {
  display: inline-flex; align-items: center; justify-content: center; background: var(--orange); color: #fff;
  font-size: 10px; font-weight: 800; min-width: 17px; height: 17px; border-radius: 9px; padding: 0 4px; margin-left: 5px;
}
.action-tab.active .cnt { background: var(--accent); color: #fff; }

.fan-row {
  background: var(--card-bg); border: 1px solid var(--border-md); border-right: 3px solid var(--orange); border-radius: 10px;
  padding: 12px 14px; display: flex; align-items: center; gap: 14px; margin-bottom: 8px; flex-wrap: wrap;
}
.fan-row-main { flex: 1; min-width: 180px; }
.fan-row-name { font-size: 13.5px; font-weight: 800; }
.fan-row-meta { font-size: 11.5px; color: var(--text-sm); margin-top: 2px; }
.fan-row-actions { display: flex; gap: 8px; flex-shrink: 0; }
.act-btn {
  border: 1.5px solid var(--border-md); background: transparent; color: var(--text-sm);
  font-family: 'Heebo', sans-serif; font-size: 11.5px; font-weight: 800; padding: 7px 13px;
  border-radius: 8px; cursor: pointer; white-space: nowrap; transition: all .15s;
}
.act-btn:hover { border-color: var(--accent); color: var(--accent); }
.act-btn.approve { background: var(--green); color: #0f1524; border-color: var(--green); }
.act-btn.approve:hover { opacity: .88; color: #0f1524; }
.act-btn.reject { background: transparent; border-color: rgba(255,92,92,.4); color: var(--red); }
.act-btn.reject:hover { border-color: var(--red); }
.act-btn.soon { opacity: .45; cursor: default; }
.act-btn.soon:hover { border-color: var(--border-md); color: var(--text-sm); }
.act-btn.tiny { padding: 4px 10px; font-size: 11px; }
.suggestion-actions { display: flex; gap: 6px; margin-top: 8px; }

.approve-card {
  background: var(--card-bg); border: 1px solid var(--border-md); border-right: 3px solid var(--orange); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 12px;
}
/* כותרת הכרטיס — שם+מטא זה לצד זה בצמידות, לא מתוחים לרוחב מלא (בכרטיס רחב זה השאיר שטח ריק גדול באמצע) */
.approve-card-head { margin-bottom: 8px; }
.approve-card-title { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.approve-card-meta { font-size: 11px; color: var(--text-sm); margin-top: 2px; }
.approve-field { margin: 12px 0; }
.approve-field-label { font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 5px; }
.approve-longtext {
  background: var(--nav-bg); border: 1px solid var(--border-md); border-radius: 8px; padding: 9px 11px;
  font-size: 12.5px; color: var(--text-sm); line-height: 1.6;
}
.ai-title-box { display: flex; align-items: center; gap: 8px; }
.ai-title-box input {
  flex: 1; padding: 8px 11px; border-radius: 8px; border: 1.5px solid rgba(17,24,39,.35);
  background: var(--nav-bg); color: var(--accent); font-family: 'Heebo', sans-serif; font-size: 13px; font-weight: 700;
}
.ai-title-tag { font-size: 10px; font-weight: 800; color: var(--accent); background: rgba(17,24,39,.12); padding: 2px 8px; border-radius: 8px; flex-shrink: 0; }
.char-count { font-size: 10.5px; color: var(--text-muted); margin-top: 3px; }
.char-count.over { color: var(--red); }

.photo-pick-grid { display: flex; gap: 8px; flex-wrap: wrap; }
.photo-pick-item {
  width: 74px; height: 74px; border-radius: 10px; border: 1.5px solid var(--border-md); background: var(--nav-bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; position: relative;
}
.photo-pick-item .ic { font-size: 24px; }
.photo-pick-item .lb { font-size: 9.5px; color: var(--text-muted); }
.photo-pick-item.selected { border-color: var(--accent); background: rgba(17,24,39,.1); }
.photo-pick-item.selected .lb { color: var(--accent); font-weight: 700; }
.photo-pick-check { position: absolute; top: 3px; left: 3px; font-size: 11px; color: var(--accent); }

.media-manager { margin-top: 4px; }
.media-slot-row { display: flex; gap: 10px; }
.media-slot {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  height: 74px; border-radius: 10px; border: 1.5px dashed var(--border-md); background: var(--nav-bg); transition: all .12s;
}
.media-slot.logo, .media-slot.cover { cursor: pointer; }
.media-slot.filled { border-style: solid; border-color: var(--accent); background: rgba(17,24,39,.04); }
.media-slot.drag-over { border-color: var(--green); background: rgba(22,163,74,.08); }
.media-slot-ic { font-size: 22px; }
.media-slot-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-align: center; padding: 0 4px; }
.media-slot-note { font-size: 10.5px; color: var(--text-muted); margin-top: 6px; }

.approve-card-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.approve-card-actions.top { margin: 0 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }

/* ── טופס עריכה מלא (בתוך כרטיס-עסק, כל העסקים) ── */
.edit-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px 14px; margin-bottom: 14px; }
.edit-field { display: flex; flex-direction: column; gap: 5px; font-size: 11px; font-weight: 800; color: var(--text-muted); min-width: 0; }
.edit-subrow { display: flex; gap: 8px; min-width: 0; }
.edit-subrow input { min-width: 0; flex: 1; }
.edit-field.full { grid-column: 1 / -1; }
.edit-field input[type="text"], .edit-field select, .edit-field textarea {
  width: 100%; box-sizing: border-box; min-width: 0;
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-md); background: var(--nav-bg); color: var(--text);
  font-family: 'Heebo', sans-serif; font-size: 13px; font-weight: 400;
}
.edit-field textarea { resize: vertical; }
.edit-check-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; font-weight: 400; color: var(--text); }
.edit-check-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
@media (max-width: 600px) { .edit-grid { grid-template-columns: 1fr; } }

.tag-chip-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.tag-chip {
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
  background: rgba(17,24,39,.06); color: var(--text); border: 1px solid var(--border-md);
}
.tag-chip.empty { color: var(--text-muted); font-weight: 400; }
.tag-chip.selectable { cursor: pointer; user-select: none; transition: background .15s, border-color .15s, color .15s; }
.tag-chip.selectable:hover { border-color: var(--accent); }
.tag-chip.selectable.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
.tag-suggestion-alert {
  display: block; width: 100%; margin-top: 6px;
  background: rgba(217,119,6,.1); border: 1.5px solid rgba(217,119,6,.35);
  border-radius: 10px; padding: 7px 11px;
  color: var(--orange); font-size: 11.5px; font-weight: 700;
}
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
.toggle-row > span { font-size: 12px; font-weight: 800; color: var(--text-muted); }
.toggle {
  width: 36px; height: 21px; background: rgba(17,24,39,.16); border-radius: 12px;
  position: relative; cursor: pointer; border: none; flex-shrink: 0; transition: background .2s; padding: 0;
}
.toggle.on { background: var(--green); }
.toggle::after {
  content: ''; position: absolute; width: 15px; height: 15px; background: #fff; border-radius: 50%;
  top: 3px; right: 3px; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.toggle.on::after { transform: translateX(-15px); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
  border: none; border-radius: 6px; background: rgba(17,24,39,.07); cursor: pointer; font-size: 12px;
  vertical-align: middle; margin: 0 2px;
}
.icon-btn:hover { background: rgba(17,24,39,.14); }

.owner-verify-details { margin-top: 8px; }
.owner-verify-details summary {
  cursor: pointer; font-size: 11.5px; font-weight: 700; color: var(--text-sm);
  padding: 6px 0; list-style: none;
}
.owner-verify-details summary::-webkit-details-marker { display: none; }
.owner-verify-details summary::before { content: '▸ '; }
.owner-verify-details[open] summary::before { content: '▾ '; }
.owner-verify-details:hover summary { color: var(--text); }

.edit-section-title {
  font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .03em;
  margin: 18px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.edit-section-title:first-of-type { margin-top: 4px; }
/* שלבים עם מעקב-סקירה (1-5) — כל השורה צבועה, לא רק הטקסט: כתום = עדיין לא נסקר, ירוק = נסקר.
   לא אדום במכוון — "טרם נסקר" זה מצב ניטרלי/ממתין, לא שגיאה. */
.edit-section-title.review-tracked {
  padding: 7px 10px; border-radius: 8px; border-bottom: none;
  background: rgba(217,119,6,.1); color: var(--orange);
}
.edit-section-title.review-tracked.reviewed { background: rgba(22,163,74,.13); color: var(--green); }
.sec-edit-btn {
  text-transform: none; letter-spacing: normal; font-size: 11px; font-weight: 700; color: var(--accent);
  background: rgba(17,24,39,.07); border: none; border-radius: 6px; padding: 3px 9px; cursor: pointer; flex-shrink: 0;
}
.sec-edit-btn:hover { background: rgba(17,24,39,.14); }
/* עריכה per-שלב על גבי הכרטיס (כמו admin-businesses.html האמיתי) — לא עוד "ערוך פרטי עסק" גורף לכל הכרטיס */
.sec-edit-form { display: none; margin-top: -6px; }
.sec-edit-form.open { display: block; }
.sec-edit-actions { display: flex; gap: 8px; margin-top: 12px; }
.sec-title-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.sec-reviewed-toggle { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--green); text-transform: none; cursor: pointer; white-space: nowrap; }
.sec-reviewed-toggle input { accent-color: var(--green); }
.review-badge { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 20px; margin-right: 6px; white-space: nowrap; }
.review-badge.none { background: rgba(217,119,6,.13); color: var(--orange); }
.review-badge.partial { background: rgba(217,119,6,.13); color: var(--orange); }
.review-badge.ready { background: rgba(22,163,74,.14); color: var(--green); }
/* אלמנטים אופציונליים בטופס העריכה — מקופלים כברירת מחדל (אלא אם כבר קיים ערך), נפתחים בלחיצה,
   בדיוק כמו "+ הוסף עוד הטבה" בטפסי ההרשמה האמיתיים (business.html/business-dashboard.html) */
.edit-optional {
  border: 1px dashed var(--border-md); border-radius: 8px; padding: 10px 12px; margin: 10px 0; background: var(--card-bg);
}
.edit-optional summary {
  cursor: pointer; font-size: 12px; font-weight: 700; color: var(--text-sm); list-style: none;
}
.edit-optional summary::-webkit-details-marker { display: none; }
.edit-optional summary::before { content: '+ '; color: var(--accent); font-weight: 900; }
.edit-optional[open] summary::before { content: '− '; }
.edit-optional[open] summary { margin-bottom: 10px; }
.edit-optional select, .edit-optional textarea, .edit-optional input[type="text"] {
  width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-md);
  background: var(--nav-bg); color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px;
}
.edit-optional .edit-grid { margin-bottom: 0; }

/* כותרת שלב עם שינוי ממתין — תג כחול נפרד מציר reviewed (ירוק/כתום), כדי לא לערבב בין "האם נסקר" ל"יש בקשת שינוי" */
.title-change-badge {
  display: inline-block; font-size: 10px; font-weight: 800; color: #fff; background: #2563eb;
  padding: 2px 8px; border-radius: 9px; margin-inline-start: 8px; text-transform: none; letter-spacing: normal;
}
/* שדה עריכה ספציפי עם שינוי ממתין — מסגרת+רקע כתום עדין + רמז "היה: X" מתחתיו */
.edit-field.field-changed input, .edit-field.field-changed textarea, .edit-field.field-changed select {
  border-color: var(--orange); background: rgba(217,119,6,.06);
}
.field-change-hint { font-size: 10.5px; color: var(--orange); font-weight: 700; margin-top: 4px; }
/* הבהוב חד-פעמי כשקופצים אל שלב מתוך תקציר-השינויים למעלה — תגובה ויזואלית מיידית ללחיצה */
@keyframes jumpFlash { 0% { box-shadow: 0 0 0 3px rgba(37,99,235,.55); } 100% { box-shadow: 0 0 0 0 rgba(37,99,235,0); } }
.jump-flash { animation: jumpFlash 1.2s ease-out; border-radius: 10px; }

/* ── תקציר-שינויים בראש הכרטיס — כל מה שהעסק מבקש (דיף רגיל + הצעות תגית/קטגוריה), שורה לחיצה שקופצת לשלב ── */
.changes-summary {
  background: rgba(217,119,6,.06); border: 1.5px solid rgba(217,119,6,.3); border-radius: 10px;
  padding: 10px 12px; margin: 0 0 14px;
}
.changes-summary-title { font-size: 11.5px; font-weight: 800; color: var(--orange); margin-bottom: 8px; }
.changes-summary-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--card-bg); border: 1px solid var(--border-md); border-radius: 8px;
  padding: 8px 11px; margin-bottom: 6px; cursor: pointer; transition: border-color .12s;
}
.changes-summary-row:last-child { margin-bottom: 0; }
.changes-summary-row:hover { border-color: var(--accent); }
.changes-summary-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.changes-summary-label { font-size: 11.5px; font-weight: 800; color: var(--text); }
.changes-summary-detail { font-size: 11px; color: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.changes-summary-arrow { font-size: 13px; color: var(--accent); flex-shrink: 0; }

.diff-row { background: var(--nav-bg); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; }
.diff-row.clickable { cursor: pointer; transition: background .15s; }
.diff-row.clickable:hover { background: rgba(17,24,39,.09); }
.diff-row-hint { font-size: 10.5px; color: var(--accent); font-weight: 700; margin-top: 4px; }
.diff-label { font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 5px; }
.diff-old { font-size: 12px; color: var(--red); text-decoration: line-through; opacity: .8; }
.diff-new { font-size: 12px; color: var(--green); font-weight: 700; margin-top: 2px; }

.health-toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.health-list { display: flex; flex-direction: column; gap: 7px; }
.health-row {
  display: flex; align-items: center; gap: 12px; background: var(--card-bg); border: 1px solid var(--border-md);
  border-radius: 10px; padding: 9px 13px; cursor: pointer; transition: border-color .12s;
}
.health-row:hover { border-color: var(--accent); }
.health-info { width: 190px; flex-shrink: 0; overflow: hidden; }
.health-name { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.health-missing { font-size: 10.5px; color: var(--orange); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.health-missing.ok { color: var(--green); }
.health-bar-track { flex: 1; height: 8px; border-radius: 5px; background: var(--nav-bg); overflow: hidden; }
.health-bar-fill { height: 100%; border-radius: 5px; background: var(--green); }
.health-bar-fill.low { background: var(--orange); }
.health-pct { font-size: 12px; font-weight: 800; width: 38px; text-align: left; flex-shrink: 0; }
.health-pct.low { color: var(--orange); }

/* ── ניהול תגיות — תור בקשות ממתינות מרוכז + רשימת תגיות לפי קטגוריה ── */
.tagmgmt-queue-card {
  background: var(--card-bg); border: 1px solid var(--border-md); border-right: 3px solid var(--orange); border-radius: 10px;
  padding: 10px 13px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap;
}
.tagmgmt-queue-main { flex: 1; min-width: 200px; }
.tagmgmt-queue-name { font-size: 12.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tagmgmt-queue-desc { font-size: 11.5px; color: var(--text-sm); margin-top: 3px; }
.tagmgmt-queue-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
.tagmgmt-cat-card {
  background: var(--card-bg2); border: 1px solid var(--border-md); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
}
.tagmgmt-cat-head { font-size: 13px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.tagmgmt-tag-row { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--border); }
.tagmgmt-tag-row:last-of-type { border-bottom: none; }
.tagmgmt-tag-name { font-size: 12.5px; font-weight: 700; }
.tagmgmt-tag-count {
  font-size: 11px; color: var(--text-sm); white-space: nowrap; border: none; background: rgba(17,24,39,.06);
  border-radius: 20px; padding: 3px 10px; cursor: pointer; font-family: 'Heebo', sans-serif; font-weight: 700;
}
.tagmgmt-tag-count:hover { background: rgba(17,24,39,.13); }
.tagmgmt-tag-count.zero { color: var(--orange); font-weight: 800; cursor: default; background: rgba(217,119,6,.1); }
.tagmgmt-usage-list { margin: 2px 0 8px; padding-right: 4px; }
.tagmgmt-usage-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px;
  padding: 6px 10px; border-radius: 7px; cursor: pointer; color: var(--text-sm);
}
.tagmgmt-usage-item:hover { background: rgba(17,24,39,.05); color: var(--text); }
.tagmgmt-usage-arrow { color: var(--accent); font-size: 12px; }
.tagmgmt-tag-actions { display: flex; gap: 4px; flex-shrink: 0; }
.tagmgmt-icon-btn {
  border: none; background: rgba(17,24,39,.07); border-radius: 6px; width: 24px; height: 24px; font-size: 12px;
  cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.tagmgmt-icon-btn:hover { background: rgba(17,24,39,.14); }
.tagmgmt-inline-form { display: flex; gap: 6px; align-items: center; flex: 1; flex-wrap: wrap; }
.tagmgmt-inline-form input, .tagmgmt-inline-form select {
  padding: 6px 9px; border-radius: 7px; border: 1px solid var(--border-md); background: var(--nav-bg); color: var(--text);
  font-family: 'Heebo', sans-serif; font-size: 12.5px;
}
.tagmgmt-add-row { display: flex; gap: 6px; margin-top: 8px; }
.tagmgmt-add-row input { flex: 1; }

.roadmap-panel {
  background: var(--card-bg2); border: 1px dashed var(--border-md); border-radius: 12px; padding: 14px 16px; margin-top: 24px;
}
.roadmap-title { font-size: 12px; font-weight: 800; color: var(--text-sm); margin-bottom: 8px; }
.roadmap-list { font-size: 12px; color: var(--text-muted); line-height: 2; }

/* ── מרכז המשימות — Master-Detail (רשימה מימין, פרטים משמאל) ── */
.task-split { display: flex; gap: 14px; align-items: flex-start; }
.task-list-col {
  /* הרשימה מכילה שורות קצרות (שם+מטא) שלא צריכות הרבה רוחב — עדיף לתת את רוב השטח לכרטיס הפרטים,
     ששם יש הרבה תוכן ובלעדיו נוצרת גלילה מיותרת. לא 50/50 — נוסה וגם נראה ריק מדי בפועל בצילום מסך. */
  flex: 0 0 32%; max-width: 32%; max-height: 640px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 7px; padding-left: 2px;
}
.task-detail-col { flex: 1; min-width: 0; }
.task-row {
  background: var(--card-bg); border: 1px solid var(--border-md); border-right: 3px solid transparent;
  border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: all .12s;
}
.task-row:hover { background: rgba(17,24,39,.04); }
.task-row.active { border-color: rgba(17,24,39,.4); border-right-color: var(--accent); background: rgba(17,24,39,.08); }
.task-row.pending  { border-right-color: var(--orange); }
.task-row.approved { border-right-color: var(--green); }
.task-row.rejected { border-right-color: var(--border-md); opacity: .65; }
.task-row-top { display: flex; align-items: center; gap: 10px; }
.task-row-check {
  flex-shrink: 0; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border-md);
  display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--accent); cursor: pointer;
}
.task-row.selected .task-row-check { border-color: var(--accent); background: rgba(17,24,39,.08); }
.task-row-body { flex: 1; min-width: 0; }
.task-row-chip { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 9px; white-space: nowrap; flex-shrink: 0; }
.task-row-chip.approved { color: var(--green); background: rgba(22,163,74,.12); }
.task-row-chip.pending  { color: var(--orange); background: rgba(217,119,6,.12); }
.task-row-chip.rejected { color: var(--text-sm); background: rgba(17,24,39,.06); }
.task-row-chevron { flex-shrink: 0; color: var(--text-muted); font-size: 14px; }
.task-row-name { font-size: 13px; font-weight: 800; }
.task-row-meta { font-size: 11px; color: var(--text-sm); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* חזרה מוסתרת בדסקטופ (בכל 3 ההקשרים — דשבורד/כל העסקים/כל האוהדים): הרשימה תמיד גלויה לצד הכרטיס
   ב-Master-Detail, אז יש כבר איך לעבור לפריט אחר בלי כפתור ייעודי. גלויה רק במובייל, ר' מדיה-קוורי,
   כי שם רשימה+פרטים מתחלפות (רק אחת גלויה בכל רגע) וזו הדרך היחידה לחזור. */
.task-back-btn { display: none; margin-bottom: 10px; }
@media (max-width: 860px) {
  .task-split { flex-direction: column; align-items: stretch; }
  .task-list-col, .task-detail-col { max-width: 100%; flex: 1 1 auto; }
  .task-split:not(.mobile-show-detail) .task-detail-col { display: none; }
  .task-split.mobile-show-detail .task-list-col { display: none; }
  .task-back-btn { display: inline-flex; }
}

/* ── active-tab info panel ── */
.tab-info {
  background: rgba(17,24,39,.05); border: 1px solid rgba(17,24,39,.2); border-radius: 12px;
  padding: 12px 14px; margin-bottom: 14px; font-size: 12px; line-height: 1.75;
}
.tab-info .ti-title { font-weight: 800; color: var(--accent); font-size: 12.5px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.tab-info .ti-type { font-size: 10px; font-weight: 700; color: var(--text-muted); background: rgba(17,24,39,.06); padding: 1px 8px; border-radius: 10px; }
.tab-info .ti-body { color: var(--text-sm); }
.tab-info .ti-body b { color: var(--text); }

/* ── expiring-soon panel ── */
.expiring-panel {
  background: var(--card-bg2); border: 1px solid var(--border-md); border-radius: 12px;
  padding: 12px 14px; margin-bottom: 18px;
}
.expiring-title { font-size: 12px; font-weight: 800; color: var(--text-sm); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.expiring-empty { font-size: 11.5px; color: var(--text-muted); }
.expiring-subgroup { margin-bottom: 14px; }
.expiring-subgroup:last-child { margin-bottom: 0; }
.exp-sub-title { font-size: 10.5px; font-weight: 800; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
.exp-sub-title.warn { color: var(--orange); }
.exp-sub-title.ok-title { color: var(--green); }
.exp-sub-list { background: var(--nav-bg); border-radius: 10px; overflow: hidden; }
.expiring-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-top: 1px solid var(--border); }
.expiring-item:first-child { border-top: none; }
.exp-pos {
  flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--card-bg);
  border: 1px solid var(--border-md); font-size: 9.5px; font-weight: 900; color: var(--text-sm);
  display: flex; align-items: center; justify-content: center;
}
.exp-body { flex: 1; min-width: 0; font-size: 12px; font-weight: 700; }
.exp-body .succ { font-weight: 400; color: var(--text-sm); }
.exp-body .succ .cv { color: var(--accent); font-weight: 700; }
.exp-days { font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.exp-days.urgent { color: var(--red); background: rgba(255,92,92,.12); }
.exp-days.soon { color: var(--orange); background: rgba(217,119,6,.15); }
.exp-days.ok { color: var(--text-sm); background: rgba(17,24,39,.06); }
.exp-action-btn {
  flex-shrink: 0; border: 1.5px solid var(--border-md); background: transparent; color: var(--accent);
  font-family: 'Heebo', sans-serif; font-size: 10.5px; font-weight: 700; padding: 5px 9px; border-radius: 8px; cursor: pointer;
}
.exp-action-btn:hover { border-color: var(--accent); }

/* ── preview strip ── */
.preview-label { font-size: 12px; font-weight: 800; color: var(--text-sm); margin-bottom: 10px; }
.preview-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 14px; margin-bottom: 22px; -webkit-overflow-scrolling: touch; }
.preview-strip::-webkit-scrollbar { display: none; }
.pv-card {
  flex-shrink: 0; width: 96px; background: var(--card-bg); border: 1.5px solid var(--border-md);
  border-radius: 12px; padding: 10px 8px; text-align: center; position: relative;
}
.pv-card.pinned { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(17,24,39,.25); }
.pv-pos {
  position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--nav-bg); border: 1.5px solid var(--border-md); color: var(--text-sm);
  font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center;
}
.pv-card.pinned .pv-pos { background: var(--accent); color: #fff; border-color: var(--accent); }
.pv-icon { font-size: 22px; margin-bottom: 4px; }
.pv-name { font-size: 10.5px; font-weight: 700; line-height: 1.3; }
.pv-pin-mark { font-size: 9px; color: var(--accent); font-weight: 800; margin-top: 3px; }
.pv-auto-mark { font-size: 9px; color: var(--text-muted); margin-top: 3px; }
.pv-empty-note { font-size: 12px; color: var(--text-muted); padding: 10px 0; }

/* ── slots table ── */
.slots { display: flex; flex-direction: column; gap: 8px; }
.slot {
  background: var(--card-bg); border: 1.5px solid var(--border-md); border-radius: 12px;
  padding: 10px 12px; display: flex; align-items: center; gap: 12px;
}
.slot.anchored { border-color: rgba(17,24,39,.35); background: linear-gradient(90deg, rgba(17,24,39,.06), var(--card-bg) 40%); }
.slot-num {
  flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--nav-bg);
  border: 1.5px solid var(--border-md); display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900; color: var(--text-sm);
}
.slot.anchored .slot-num { background: var(--accent); color: #fff; border-color: var(--accent); }
.slot-body { flex: 1; min-width: 0; }
.slot-empty-txt { font-size: 12.5px; color: var(--text-muted); }
.slot-biz-name { font-size: 13.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.slot-meta { font-size: 11px; color: var(--text-sm); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.slot-meta .fixed-tag { color: var(--green); font-weight: 700; }
.slot-meta .temp-tag { color: var(--orange); font-weight: 700; }
.chain-line { font-size: 10.5px; color: var(--text-sm); margin-top: 4px; }
.chain-line .cv { color: var(--accent); font-weight: 700; }
.slot-actions { flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; }
.slot-btn {
  border: 1.5px solid var(--border-md); background: transparent; color: var(--text-sm);
  font-family: 'Heebo', sans-serif; font-size: 11.5px; font-weight: 700; padding: 6px 11px;
  border-radius: 8px; cursor: pointer; white-space: nowrap; transition: all .15s;
}
.slot-btn:hover { border-color: var(--accent); color: var(--accent); }
.slot-btn.danger:hover { border-color: var(--red); color: var(--red); }
.slot-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.slot-btn.primary:hover { opacity: .88; color: #fff; }
.slot-btn[disabled] { opacity: .4; cursor: not-allowed; }
.slot-btn[disabled]:hover { border-color: var(--border-md); color: var(--text-sm); }

/* ── picker panel (inline, replaces slot body when picking) ── */
.picker { background: var(--nav-bg); border-radius: 10px; padding: 10px; margin-top: 8px; }
.picker input[type="search"] {
  width: 100%; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--border-md);
  background: var(--card-bg); color: var(--text); font-family: 'Heebo', sans-serif; font-size: 12.5px; margin-bottom: 8px;
}
.picker-scope-note { font-size: 10.5px; color: var(--text-muted); margin-bottom: 8px; }
.picker-list { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.picker-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px;
  cursor: pointer; font-size: 12.5px; transition: background .12s;
}
.picker-item:hover { background: rgba(17,24,39,.08); }
.picker-item .ic { font-size: 15px; }
.picker-item .nm { font-weight: 700; }
.picker-empty { font-size: 12px; color: var(--text-muted); padding: 10px; text-align: center; }

/* ── mode form (after choosing a business) ── */
.mode-form { background: var(--nav-bg); border-radius: 10px; padding: 12px; margin-top: 8px; }
.mode-form .chosen { font-size: 13px; font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
.mode-toggle { display: flex; gap: 8px; margin-bottom: 10px; }
.mode-opt {
  flex: 1; text-align: center; padding: 8px; border-radius: 8px; border: 1.5px solid var(--border-md);
  cursor: pointer; font-size: 12px; font-weight: 700; color: var(--text-sm);
}
.mode-opt.selected { border-color: var(--accent); background: rgba(17,24,39,.1); color: var(--accent); }
.days-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.days-row input {
  width: 70px; padding: 7px 9px; border-radius: 8px; border: 1.5px solid var(--border-md);
  background: var(--card-bg); color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px;
}
.days-row span { font-size: 11.5px; color: var(--text-sm); }
.mode-actions { display: flex; gap: 8px; }

.chain-block { background: var(--card-bg); border: 1px dashed var(--border-md); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
.chain-label { font-size: 11.5px; font-weight: 800; color: var(--text-sm); margin-bottom: 8px; }
.chain-select {
  width: 100%; padding: 8px 9px; border-radius: 8px; border: 1.5px solid var(--border-md);
  background: var(--nav-bg); color: var(--text); font-family: 'Heebo', sans-serif; font-size: 12.5px; margin-bottom: 8px;
}
.chain-sub-toggle { display: flex; gap: 8px; margin-top: 8px; }

.section-note { font-size: 11px; color: var(--text-muted); margin-top: 14px; text-align: center; }
</style>
</head>
<body>

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content" id="mainContent">

    <div id="tabContent"></div>

  </main>

</div>

<script>
// ── מוק דאטה — עסקים בדויים, עם שיוך לקטגוריה אמיתית + תכונות "אמיתיות" (הטבה/אונליין) ──
const MOCK_BUSINESSES = [
  { id:'b1',  name:'XRAY TLV',            icon:'👕', catKey:'fashion', hasDiscount:true,  isOnline:true  },
  { id:'b2',  name:'הדס תכשיטים',          icon:'👕', catKey:'fashion', hasDiscount:true,  isOnline:true  },
  { id:'b3',  name:'פיט זון',              icon:'👕', catKey:'fashion', hasDiscount:false, isOnline:true  },
  { id:'b4',  name:'סטייל האוס',           icon:'👕', catKey:'fashion', hasDiscount:true,  isOnline:false },
  { id:'b5',  name:'גולדה אירועים',        icon:'🎉', catKey:'events',  hasDiscount:true,  isOnline:false },
  { id:'b6',  name:'די.ג׳יי קליק',         icon:'🎉', catKey:'events',  hasDiscount:false, isOnline:false },
  { id:'b7',  name:'סאונד סטייג׳',         icon:'🎉', catKey:'events',  hasDiscount:false, isOnline:false },
  { id:'b8',  name:'גרין קאר',             icon:'🚗', catKey:'vehicle', hasDiscount:false, isOnline:false },
  { id:'b9',  name:'מוסך אצלנו',           icon:'🚗', catKey:'vehicle', hasDiscount:true,  isOnline:false },
  { id:'b10', name:'שירותי גרר מהיר',       icon:'🚗', catKey:'vehicle', hasDiscount:false, isOnline:false },
  { id:'b11', name:'יהב מטבחים',           icon:'🏠', catKey:'home',    hasDiscount:true,  isOnline:false },
  { id:'b12', name:'ניקיון זהב',           icon:'🏠', catKey:'home',    hasDiscount:false, isOnline:false },
  { id:'b13', name:'גינון ירוק',           icon:'🏠', catKey:'home',    hasDiscount:false, isOnline:false },
  { id:'b14', name:'טורנדו אפ איקס',       icon:'💻', catKey:'digital', hasDiscount:false, isOnline:true  },
  { id:'b15', name:'סטודיו פיקסל',         icon:'💻', catKey:'digital', hasDiscount:false, isOnline:true  },
  { id:'b16', name:'קוד פתוח בע"מ',        icon:'💻', catKey:'digital', hasDiscount:true,  isOnline:true  },
  { id:'b17', name:'ד"ר אופטיקה',          icon:'💊', catKey:'health',  hasDiscount:true,  isOnline:false },
  { id:'b18', name:'ביוטי לאב',            icon:'💊', catKey:'health',  hasDiscount:false, isOnline:true  },
  { id:'b19', name:'מרפאת חיוך',           icon:'💊', catKey:'health',  hasDiscount:false, isOnline:false },
  { id:'b20', name:'לגל פלוס',             icon:'⚖️', catKey:'finance', hasDiscount:true,  isOnline:true  },
  { id:'b21', name:'רואה חשבון כהן',       icon:'⚖️', catKey:'finance', hasDiscount:false, isOnline:false },
  { id:'b22', name:'ביטוח ישיר לעסקים',    icon:'⚖️', catKey:'finance', hasDiscount:true,  isOnline:true  },
  { id:'b23', name:'קפה השכונה',           icon:'🍕', catKey:'food',    hasDiscount:true,  isOnline:false },
  { id:'b24', name:'טעימים קייטרינג',      icon:'🍕', catKey:'food',    hasDiscount:true,  isOnline:true  },
  { id:'b25', name:'פיצה בלוק',            icon:'🍕', catKey:'food',    hasDiscount:false, isOnline:false },
  { id:'b26', name:'מאפיית הבוקר',         icon:'🍕', catKey:'food',    hasDiscount:false, isOnline:false },
];

// העשרת המוק לצורך מסך "כל העסקים": סטטוס/אזור/תאריך הרשמה/בקשת שינוי ממתינה/צפיות/לבבות —
// מחושב דטרמיניסטית מהאינדקס כדי שהתצוגה תהיה יציבה בין רינדורים, בלי תלות בסדר ה-DAY_MS למטה בקובץ.
const REGIONS_MOCK = ['גוש דן','ירושלים והסביבה','השפלה','השרון','חיפה והצפון','הדרום'];
const CITIES_MOCK = ['תל אביב','רמת גן','חולון','בת ים','גבעתיים','הרצליה','רעננה','כפר סבא','ראשון לציון','פתח תקווה'];
const STATUS_CYCLE_MOCK = ['approved','approved','approved','approved','pending','approved','approved','rejected'];
const OWNER_FIRST_NAMES_MOCK = ['רועי','שירה','דניאל','נועה','איתי','מאיה','אלון','הדר'];
const OWNER_LAST_NAMES_MOCK = ['כהן','לוי','מזרחי','פרץ','אברהם','ביטון'];
const CATEGORY_KEYS_MOCK = ['food','events','vehicle','home','fashion','digital','health','finance'];
MOCK_BUSINESSES.forEach((b, idx) => {
  b.status = STATUS_CYCLE_MOCK[idx % STATUS_CYCLE_MOCK.length];
  b.region = REGIONS_MOCK[idx % REGIONS_MOCK.length];
  b.city = CITIES_MOCK[idx % CITIES_MOCK.length];
  // סוג עסק — 3 אפשרויות אמיתיות (ר' business-dashboard.html/business.html): פיזית/אונליין/בעל מקצוע-נותן שירות
  b.bizTypes = idx % 5 === 4 ? ['pro'] : (b.isOnline ? (idx % 3 === 0 ? ['online'] : ['physical','online']) : ['physical']);
  b.registeredAt = new Date(Date.now() - (20 + idx * 11) * 86400000);
  b.hasPendingChange = b.status === 'approved' && (idx % 5 === 2);
  b.clicks = (idx * 37 + 12) % 480;
  b.likes = (idx * 7 + 3) % 60;
  b.hasLogo = idx % 3 !== 0;
  b.hasCoverPhoto = idx % 4 !== 1;
  b.hasPhoto = b.hasLogo || b.hasCoverPhoto; // חובה לפחות אחד מהשניים (כלל אמיתי, ר' §7) — הבדיקות הקיימות ממשיכות להסתמך על hasPhoto
  // קטגוריה משנית ("מופיע גם תחת") — admin-only במערכת האמיתית (ר' §8, 2026-07-14), ולכן ניתנת לעריכה כאן;
  // alsoCategorySuggestion היא מפתח קטגוריה שנבחר בגריד אצל בעל העסק (לא טקסט חופשי, זהה למבנה האמיתי
  // ב-admin-businesses.html מ-2026-07-17) — הצעה ממתינה לאישור מנהל, לא נכתבת ל-alsoUnderCategory עד שמאשרים.
  b.alsoUnderCategory = idx % 4 === 0 ? CATEGORY_KEYS_MOCK[(CATEGORY_KEYS_MOCK.indexOf(b.catKey) + 3) % CATEGORY_KEYS_MOCK.length] : null;
  b.alsoCategorySuggestion = (idx % 6 === 0 && !b.alsoUnderCategory) ? CATEGORY_KEYS_MOCK[(idx + 2) % CATEGORY_KEYS_MOCK.length] : '';
  b.hoursText = idx % 3 === 0 ? '' : 'א-ה 9:00-19:00, ו 9:00-14:00';
  b.descriptionText = idx % 5 === 0 ? '' : 'עסק מקומי ותיק המספק שירות איכותי ומקצועי ללקוחות הקהילה.';
  // פרטי קשר/בעלים/מדיה — שדות אמיתיים מ-PROJECT_CONTEXT.md §7, לא הומצאו
  b.phone = '0' + (50 + idx % 4) + '-' + (1000000 + idx * 137) % 9000000;
  b.website = idx % 4 === 1 ? 'www.' + b.id + '-biz.co.il' : '';
  b.instagram = idx % 3 === 1 ? '@' + b.id + '_official' : '';
  // שדות "יצירת קשר עם לקוחות" אמיתיים משלב 2 (ר' business-dashboard.html: whatsapp/serviceEmail/websiteOnline/regions) —
  // היו חסרים לגמרי מהדמו הקודם, לא רק במקום הלא-נכון.
  b.whatsapp = idx % 3 !== 2 ? b.phone : '';
  b.serviceEmail = idx % 4 === 0 ? 'service@' + b.id + '.co.il' : '';
  b.websiteOnline = b.bizTypes.includes('online') ? 'shop.' + b.id + '.co.il' : '';
  b.regions = b.bizTypes.includes('pro') ? [REGIONS_MOCK[idx % REGIONS_MOCK.length], REGIONS_MOCK[(idx + 2) % REGIONS_MOCK.length]] : [];
  b.ownerFirst = OWNER_FIRST_NAMES_MOCK[idx % OWNER_FIRST_NAMES_MOCK.length];
  b.ownerLast = OWNER_LAST_NAMES_MOCK[idx % OWNER_LAST_NAMES_MOCK.length];
  b.ownerPhone = '05' + (idx % 5) + '-' + (2000000 + idx * 219) % 9000000;
  b.ownerEmail = b.ownerFirst.toLowerCase() + '.' + b.ownerLast.toLowerCase() + '@example.com';
  b.galleryCount = b.hasPhoto ? (idx % 6) : 0;
  b.videoCount = b.hasPhoto && idx % 4 === 0 ? 1 : 0;
  b.approvedAt = b.status === 'approved' ? new Date(b.registeredAt.getTime() + (2 + idx % 3) * 86400000) : null;
  // שדות נוספים אמיתיים מ-PROJECT_CONTEXT.md §7/§8 שהיו חסרים בכרטיס — כתובות/מקום מימוש/דגלי מנהל
  b.facebook = idx % 5 === 2 ? 'facebook.com/' + b.id : '';
  // אימות "אוהד מכבי" של בעל העסק — זהה בדיוק לשדות האמיתיים ב-business.html (bizIsSubscriber/bizGate/
  // bizSubNum בנתיב מנוי; bizFanPhoto+bizFbUrl, שניהם חובה, בנתיב לא-מנוי). ⚠️ תוקן: אין "היה מנוי בעבר"
  // בהרשמת בעל עסק בפועל (זה קיים רק בהרשמת אוהד רגיל ב-fan-register.html) — שדה שהיה קודם בדמו ולא באמת קיים, הוסר.
  b.ownerIsSubscriber = idx % 3 !== 2;
  if (b.ownerIsSubscriber) {
    b.ownerSubscriberSection = 'שער ' + (1 + idx % 8);
    b.ownerSubscriberNumber = String(20456 + idx * 41);
    b.ownerFacebookUrl = '';
    b.ownerProofPhotoUrl = '';
  } else {
    b.ownerSubscriberSection = null;
    b.ownerSubscriberNumber = null;
    // שני השדות הבאים חובה בנתיב "לא מנוי" בהרשמה האמיתית (bizFbUrl/bizFanPhoto) — לא אופציונליים, תמיד קיימים כאן
    b.ownerFacebookUrl = 'https://facebook.com/' + b.id + '.owner';
    b.ownerProofPhotoUrl = `https://picsum.photos/seed/${b.id}-proof/480/320`;
  }
  b.branches = idx % 4 === 0 ? [{ city: CITIES_MOCK[(idx + 3) % CITIES_MOCK.length], address: 'רחוב הרצל ' + (10 + idx) }] : [];
  b.discountRedeemMode = !b.hasDiscount ? null
    : (b.bizTypes.includes('online') && !b.bizTypes.includes('physical')) ? 'online'
    : (idx % 5 === 0 ? 'sale' : 'physical');
  b.isNew = idx % 6 === 0;
  b.isFeatured = idx % 7 === 0;
  b.sectionDeals = !(idx % 9 === 8);
  // בקרת סקירה לעסק חדש (רלוונטי רק ל-status==='pending', ר' PROJECT_CONTEXT.md §43) — מסומן ידנית
  // ע"י המנהל לכל אחד מ-5 השלבים, נפרד לגמרי מבריאות פרופיל (שרלוונטית רק אחרי אישור).
  b.reviewedSections = {};
});
const REDEEM_MODE_LABELS_MOCK = { physical: '🏪 בחנות הפיזית', sale: '🤝 במעמד המכירה/השירות', online: '🌐 באתר' };

function findBiz(id) { return MOCK_BUSINESSES.find(b => b.id === id); }

// בריאות פרופיל נגזרת מ-4 שדות שבפועל משפיעים על איכות הכרטיס באינדקס — לא נוסחה שרירותית,
// כדי שהאחוז יהיה ניתן להסבר ("חסר: X, Y") ולא רק מספר בלי משמעות.
const HEALTH_CHECKLIST = [
  { test: b => !!b.hasCoverPhoto,   label: '🖼️ תמונה מייצגת' }, // לוגו בכוונה לא נספר כאן — לא לכל עסק יש אחד, רק תמונה מייצגת חובה
  { test: b => !!b.hoursText,       label: '🕒 שעות פעילות' },
  { test: b => !!b.descriptionText, label: '📝 תיאור עסק' },
  { test: b => !!b.hasDiscount,     label: '🏷️ הטבה מוגדרת' },
];
function computeHealthScore(b) {
  return Math.round((HEALTH_CHECKLIST.filter(c => c.test(b)).length / HEALTH_CHECKLIST.length) * 100);
}
function missingFieldsFor(b) {
  return HEALTH_CHECKLIST.filter(c => !c.test(b)).map(c => c.label);
}

// ── בקרת סקירה לעסק חדש (לפני אישור) — שונה במפורש מבריאות פרופיל: זו סימון ידני של המנהל
// ("עברתי על השלב הזה ווידאתי שהוא נכון"), לא בדיקה אוטומטית של "יש תוכן בשדה".
const BIZ_REVIEW_SECTION_LABELS = { 1: 'שלב 1', 2: 'שלב 2', 3: 'שלב 3', 4: 'שלב 4', 5: 'שלב 5' };
const BIZ_REVIEW_SECTIONS = [1, 2, 3, 4, 5];
function bizReviewedCount(b) {
  const r = b.reviewedSections || {};
  return BIZ_REVIEW_SECTIONS.filter(n => r[n]).length;
}
// מחליף את "חסר להשלמת הפרופיל" (מד בריאות-פרופיל) בראש הכרטיס — עכשיו שיש מד סקירה ייעודי,
// זה מיותר שם (שני מדדים שונים לגמרי מוצגים זה ליד זה). מציג במקום זאת אילו שלבים עדיין לא נסקרו,
// כדי שהמנהל ידע מיד בכניסה לעריכה מה נשאר לו לעשות.
function bizReviewGapHtml(b) {
  const missing = BIZ_REVIEW_SECTIONS.filter(n => !(b.reviewedSections && b.reviewedSections[n]));
  if (!missing.length) return `<span class="review-badge ready">✓ כל השלבים נסקרו</span>`;
  return `<span class="review-badge none">עדיין לא נסקר: ${missing.map(n => BIZ_REVIEW_SECTION_LABELS[n]).join(', ')}</span>`;
}
// מוצג בכל סטטוס, לא רק pending — עסק יכול לעלות מאושר גם בלי שכל 5 השלבים נסקרו בפועל (המנהל
// יכול לאשר עם תזכורת-בלבד, ר' approveBiz), וחשוב להמשיך לראות את הפער גם אחרי אישור.
function bizReviewBadgeHtml(b) {
  const n = bizReviewedCount(b);
  const cls = n === 5 ? 'ready' : n === 0 ? 'none' : 'partial';
