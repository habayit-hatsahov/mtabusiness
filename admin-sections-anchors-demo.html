function bizById(id) { return MOCK_BUSINESSES.find(b => b.id === id); }

// מאגר העסקים הרלוונטי לטאב: קטגוריה = רק עסקים ששייכים אליה בפועל. סקשן = הכל, אלא אם יש ELIGIBLE_FILTER.
function poolFor(tab) {
  if (tab.type === 'category') return MOCK_BUSINESSES.filter(b => b.catKey === tab.catKey);
  const ef = ELIGIBLE_FILTER[tab.key];
  return ef ? MOCK_BUSINESSES.filter(ef.test) : MOCK_BUSINESSES;
}
function scopeNoteFor(tab) {
  if (tab.type === 'category') return `מציג רק עסקים ששייכים בפועל לקטגוריית "${CATEGORIES.find(c=>c.key===tab.catKey).label}"`;
  const ef = ELIGIBLE_FILTER[tab.key];
  return ef ? ef.note : 'מציג את כל העסקים המאושרים באינדקס';
}

// סדר "אוטומטי" יציב לכל טאב, לצורך התצוגה המקדימה בלבד (מדמה את הסבב היומי ההוגן האמיתי)
function autoOrderFor(tab) {
  const seed = [...tab.key].reduce((a,c) => a + c.charCodeAt(0), 0);
  return [...poolFor(tab)].sort((a, b) => {
    const ha = (a.id.charCodeAt(1) * 31 + seed) % 97;
    const hb = (b.id.charCodeAt(1) * 31 + seed) % 97;
    return ha - hb;
  });
}

function fmtDateTime(d) {
  if (!d) return '';
  return d.toLocaleDateString('he-IL') + ' ' + d.toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit'});
}
function fmtDate(d) { return d.toLocaleDateString('he-IL'); }
// "כמה זמן עבר" — לשורות ממתינים/רשומים, כדי לראות מיד כמה זמן מישהו כבר מחכה, לא רק את התאריך היבש
// "לפני 150 ימים" לא ברור בקריאה מהירה (כמה זה בערך?) — פירוק לשבועות/חודשים/שנים לפער גדול,
// ימים בודדים נשארים מדויקים כי שם זה כן ברור.
function agoLabel(d) {
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days <= 0) return 'היום';
  if (days === 1) return 'אתמול';
  if (days < 14) return `לפני ${days} ימים`;
  if (days < 60) return `לפני ${Math.round(days / 7)} שבועות`;
  if (days < 365) return `לפני ${Math.round(days / 30)} חודשים`;
  const years = Math.round(days / 365);
  return `לפני ${years === 1 ? 'שנה' : years + ' שנים'}`;
}
function daysLeft(date) { return Math.ceil((date - new Date()) / DAY_MS); }
function isExpired(anchor) { return anchor.mode === 'temp' && anchor.until && new Date() > anchor.until; }
// התאריך שבו קורה משהו למיקום הזה: לעיגון זמני זה מועד הפקיעה. לעיגון קבוע זה תאריך ההחלפה
// המתוזמן (אם הוגדר) — קבוע בלי מחליף לא "מסתיים" אף פעם, ולכן לא מוצג בפאנל.
function effectiveDate(anchor) {
  return anchor.mode === 'temp' ? anchor.until : (anchor.next ? anchor.next.handoverAt : null);
}

// ── סיידבר קבוע: "כל העסקים" תמיד למעלה, ואז שתי קבוצות (סקשנים/קטגוריות) שנשארות גלויות —
// לוחצים על כותרת קבוצה כדי לפתוח/לסגור אותה, בלי לאבד את המקום או "לחזור" למסך ריק.
// רק קבוצה אחת פתוחה בו-זמנית (כדי לא להציג 13 פריטים ביחד) — אבל שתי הכותרות תמיד שם.
function sidebarGroupHtml(mode, title, list) {
  const open = openGroup === mode;
  const items = open ? list.map(t => `
    <div class="sidebar-item ${t.key===activeTab?'active':''}" onclick="selectTab('${t.key}')">${t.label}</div>`).join('') : '';
  return `
    <div class="sidebar-group-header ${open?'open':''}" onclick="toggleGroup('${mode}')">
      <span>${title}</span><span class="chev">▾</span>
    </div>
    ${open ? `<div class="sidebar-group-body">${items}</div>` : ''}`;
}

const HOME_KEY = 'home';

let sidebarCollapsed = false;

function renderSidebar() {
  const el = document.getElementById('sidebar');
  el.classList.toggle('collapsed', sidebarCollapsed);
  const collapseBtn = `<div class="sidebar-collapse-btn" onclick="toggleSidebarCollapsed()" title="${sidebarCollapsed?'הרחב תפריט':'כווץ תפריט'}">${sidebarCollapsed?'»':'« כווץ'}</div>`;
  if (sidebarCollapsed) {
    el.innerHTML = `
      ${collapseBtn}
      <div class="sidebar-standalone ${activeTab===HOME_KEY?'active':''}" onclick="selectTab('${HOME_KEY}')" title="דשבורד ראשי"><span class="ic">🏠</span></div>
      <div class="sidebar-standalone ${activeTab===ALL_BIZ_KEY?'active':''}" onclick="selectTab('${ALL_BIZ_KEY}')" title="כל העסקים"><span class="ic">🏬</span></div>
      <div class="sidebar-standalone ${activeTab===ALL_FANS_KEY?'active':''}" onclick="selectTab('${ALL_FANS_KEY}')" title="כל האוהדים"><span class="ic">👥</span></div>
      <div class="sidebar-standalone ${activeTab===TAGS_MGMT_KEY?'active':''}" onclick="selectTab('${TAGS_MGMT_KEY}')" title="ניהול תגיות"><span class="ic">🏷️</span></div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-standalone" onclick="expandAndOpenGroup('section')" title="סקשנים"><span class="ic">🗂</span></div>
      <div class="sidebar-standalone" onclick="expandAndOpenGroup('category')" title="קטגוריות"><span class="ic">🏷</span></div>`;
    return;
  }
  el.innerHTML = `
    ${collapseBtn}
    <div class="sidebar-section-label">ניהול</div>
    <div class="sidebar-standalone ${activeTab===HOME_KEY?'active':''}" onclick="selectTab('${HOME_KEY}')">
      <span class="ic">🏠</span><span>דשבורד ראשי</span>
    </div>
    <div class="sidebar-standalone ${activeTab===ALL_BIZ_KEY?'active':''}" onclick="selectTab('${ALL_BIZ_KEY}')">
      <span class="ic">🏬</span><span>כל העסקים</span>
    </div>
    <div class="sidebar-standalone ${activeTab===ALL_FANS_KEY?'active':''}" onclick="selectTab('${ALL_FANS_KEY}')">
      <span class="ic">👥</span><span>כל האוהדים</span>
    </div>
    <div class="sidebar-standalone ${activeTab===TAGS_MGMT_KEY?'active':''}" onclick="selectTab('${TAGS_MGMT_KEY}')">
      <span class="ic">🏷️</span><span>ניהול תגיות</span>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section-label">תצוגה בדף הבית</div>
    ${sidebarGroupHtml('section', '🗂 סקשנים', SECTIONS)}
    ${sidebarGroupHtml('category', '🏷 קטגוריות', CAT_TABS)}`;
}

window.toggleSidebarCollapsed = function() {
  sidebarCollapsed = !sidebarCollapsed;
  renderSidebar();
};

window.expandAndOpenGroup = function(mode) {
  sidebarCollapsed = false;
  openGroup = mode;
  renderSidebar();
};

window.toggleGroup = function(mode) {
  openGroup = openGroup === mode ? null : mode;
  renderSidebar();
};

function tabInfoHtml(tab) {
  const desc = tab.type === 'section' ? SECTION_DESC[tab.key] : CATEGORY_DESC_SUFFIX;
  const typeLabel = tab.type === 'section' ? 'סקשן בדף הבית' : 'קטגוריה';
  return `
    <div class="tab-info">
      <div class="ti-title">${tab.label} <span class="ti-type">${typeLabel}</span></div>
      <div class="ti-body">${desc}</div>
    </div>`;
}

window.selectTab = function(key) {
  activeTab = key;
  pickingSlot = null;
  choosingBiz = null;
  renderAll();
};

function expDaysBadge(dl) {
  const cls = dl <= 3 ? 'urgent' : dl <= 7 ? 'soon' : 'ok';
  return `<div class="exp-days ${cls}">${dl <= 0 ? 'היום' : 'בעוד ' + dl + ' ימים'}</div>`;
}

function expiringPanelHtml() {
  const slots = state[activeTab];
  const items = slots
    .map((a, i) => ({ a, i, ed: a ? effectiveDate(a) : null }))
    .filter(x => x.a && x.ed && !isExpired(x.a))
    .sort((x, y) => x.ed - y.ed);

  if (!items.length) {
    return `
      <div class="expiring-panel">
        <div class="expiring-title">⏳ מה מסתיים / מתחלף בקרוב</div>
        <div class="expiring-empty">אין כרגע עיגונים עם תאריך פקיעה או החלפה מתוזמנת בטאב הזה.</div>
      </div>`;
  }

  const needsAttention = items.filter(x => !x.a.next);
  const covered        = items.filter(x => x.a.next);

  const rowNeedsAttention = ({a, i, ed}) => {
    const biz = bizById(a.bizId);
    return `
      <div class="expiring-item">
        <div class="exp-pos">${i+1}</div>
        <div class="exp-body">${biz.icon} ${biz.name}</div>
        ${expDaysBadge(daysLeft(ed))}
        <button class="exp-action-btn" onclick="editExisting(${i})">📌 קבע מי יחליף</button>
      </div>`;
  };
  const rowCovered = ({a, i, ed}) => {
    const biz = bizById(a.bizId);
    const nx  = bizById(a.next.bizId);
    return `
      <div class="expiring-item">
        <div class="exp-pos">${i+1}</div>
        <div class="exp-body">${biz.icon} ${biz.name} <span class="succ">← <span class="cv">${nx.icon} ${nx.name}</span></span></div>
        ${expDaysBadge(daysLeft(ed))}
        <button class="exp-action-btn" onclick="editExisting(${i})">ערוך</button>
      </div>`;
  };

  const attentionBlock = needsAttention.length ? `
    <div class="expiring-subgroup">
      <div class="exp-sub-title warn">⚠️ ללא מחליף — יחזרו לסבב אוטומטי (${needsAttention.length})</div>
      <div class="exp-sub-list">${needsAttention.map(rowNeedsAttention).join('')}</div>
    </div>` : '';
  const coveredBlock = covered.length ? `
    <div class="expiring-subgroup">
      <div class="exp-sub-title ok-title">✓ כבר מוגדר מי יחליף (${covered.length})</div>
      <div class="exp-sub-list">${covered.map(rowCovered).join('')}</div>
    </div>` : '';

  return `
    <div class="expiring-panel">
      <div class="expiring-title">⏳ מה מסתיים / מתחלף בקרוב</div>
      ${attentionBlock}
      ${coveredBlock}
    </div>`;
}

function previewStripHtml(tab) {
  const slots = state[activeTab];
  const anchoredIds = new Set(slots.filter(Boolean).map(a => !isExpired(a) ? a.bizId : null).filter(Boolean));
  const autoPool = autoOrderFor(tab).filter(b => !anchoredIds.has(b.id));
  let autoIdx = 0;

  const cards = slots.map((anchor, i) => {
    if (anchor && !isExpired(anchor)) {
      const biz = bizById(anchor.bizId);
      return `<div class="pv-card pinned"><div class="pv-pos">${i+1}</div>
        <div class="pv-icon">${biz.icon}</div><div class="pv-name">${biz.name}</div>
        <div class="pv-pin-mark">📌 מעוגן</div></div>`;
    }
    const biz = autoPool[autoIdx++] || null;
    if (!biz) return '';
    return `<div class="pv-card"><div class="pv-pos">${i+1}</div>
      <div class="pv-icon">${biz.icon}</div><div class="pv-name">${biz.name}</div>
      <div class="pv-auto-mark">סבב אוטומטי</div></div>`;
  }).join('');

  return cards || `<div class="pv-empty-note">אין עדיין עסקים מתאימים במוק</div>`;
}

function slotsHtml(tab) {
  const slots = state[activeTab];
  const poolSize = poolFor(tab).length;

  return slots.map((anchor, i) => {
    const active = anchor && !isExpired(anchor);
    if (pickingSlot === i) return renderPickerSlot(i, tab);

    if (active) {
      const biz = bizById(anchor.bizId);
      const modeLine = anchor.mode === 'fixed'
        ? `<span class="fixed-tag">📌 קבוע</span>`
        : `<span class="temp-tag">⏳ עד ${fmtDate(anchor.until)}</span>`;
      let chainLine = '';
      if (anchor.next) {
        const when = anchor.mode === 'temp' ? 'לאחר שהעיגון יפוג' : 'ב-' + fmtDate(anchor.next.handoverAt);
        chainLine = `<div class="chain-line">→ ${when}: <span class="cv">${bizById(anchor.next.bizId).icon} ${bizById(anchor.next.bizId).name}</span> (${anchor.next.mode==='fixed' ? 'קבוע' : 'למשך ' + anchor.next.days + ' ימים'})</div>`;
      } else if (anchor.mode === 'temp') {
        chainLine = `<div class="chain-line" style="color:var(--text-muted)">→ לאחר מכן: חוזר לסבב אוטומטי</div>`;
      }
      const scheduleBtn = anchor.mode === 'fixed'
        ? `<button class="slot-btn" onclick="editExisting(${i})">${anchor.next ? 'ערוך תזמון' : '🗓 תזמן החלפה'}</button>`
        : '';
      return `
        <div class="slot anchored">
          <div class="slot-num">${i+1}</div>
          <div class="slot-body">
            <div class="slot-biz-name">${biz.icon} ${biz.name}</div>
            <div class="slot-meta">
              ${modeLine}
              <span>נקבע ב-${fmtDateTime(anchor.setAt)}</span>
            </div>
            ${chainLine}
          </div>
          <div class="slot-actions">
            <button class="slot-btn" onclick="openPicker(${i})">החלף</button>
            ${scheduleBtn}
            <button class="slot-btn danger" onclick="removeAnchor(${i})">הסר</button>
          </div>
        </div>`;
    }

    const disabled = poolSize === 0;
    return `
      <div class="slot">
        <div class="slot-num">${i+1}</div>
        <div class="slot-body"><div class="slot-empty-txt">— אוטומטי, מתחלף יומית —</div></div>
        <div class="slot-actions">
          <button class="slot-btn primary" ${disabled ? 'disabled' : ''} onclick="openPicker(${i})">📌 עגן עסק כאן</button>
        </div>
      </div>`;
  }).join('');
}

function renderPickerSlot(i, tab) {
  if (choosingBiz) return renderModeForm(i, tab);

  return `
    <div class="slot anchored">
      <div class="slot-num">${i+1}</div>
      <div class="slot-body" style="width:100%">
        <div class="picker">
          <input type="search" placeholder="חפש עסק לפי שם..." oninput="filterPicker(this.value)" id="pickerSearch">
          <div class="picker-scope-note">${scopeNoteFor(tab)}</div>
          <div class="picker-list" id="pickerList"></div>
        </div>
        <div class="mode-actions" style="margin-top:8px">
          <button class="slot-btn" onclick="cancelPicker()">ביטול</button>
        </div>
      </div>
    </div>`;
}

// בלוק "מי יחליף" — זמין גם לעיגון זמני (מחליף נכנס כשהתוקף פג) וגם לעיגון קבוע
// (מחליף נכנס בתאריך שבוחרים ידנית, כי לקבוע אין תאריך פקיעה טבעי).
function renderChainBlock(tab, i) {
  const excludeIds = new Set(
    state[activeTab].map((a,idx) => (a && !isExpired(a) && idx !== i) ? a.bizId : null).filter(Boolean)
  );
  excludeIds.add(choosingBiz);
  const successorOptions = poolFor(tab).filter(b => !excludeIds.has(b.id));
  const isTemp = editMode.type === 'temp';

  const offLabel = isTemp ? '🔄 חוזר לסבב אוטומטי' : '♾ יישאר קבוע (בלי תזמון)';
  const onLabel  = isTemp ? '📌 עסק אחר יחליף' : '📌 תזמן מי יחליף ומתי';
  const blockTitle = isTemp ? 'מה קורה כשפג התוקף?' : 'לתזמן כבר עכשיו מי יחליף בעתיד?';

  return `
    <div class="chain-block">
      <div class="chain-label">${blockTitle}</div>
      <div class="mode-toggle">
        <div class="mode-opt ${editMode.chainMode==='auto'?'selected':''}" onclick="setChainMode('auto')">${offLabel}</div>
        <div class="mode-opt ${editMode.chainMode==='chain'?'selected':''}" onclick="setChainMode('chain')">${onLabel}</div>
      </div>
      ${editMode.chainMode === 'chain' ? `
        <select class="chain-select" onchange="editMode.nextBizId=this.value||null; renderAll()">
          <option value="">בחר עסק שיחליף...</option>
          ${successorOptions.map(b => `<option value="${b.id}" ${editMode.nextBizId===b.id?'selected':''}>${b.icon} ${b.name}</option>`).join('')}
        </select>
        ${editMode.nextBizId ? `
          ${!isTemp ? `
            <div class="days-row" style="margin-bottom:8px">
              <input type="number" min="1" value="${editMode.handoverDays}" oninput="editMode.handoverDays=parseInt(this.value)||1; renderAll()">
              <span>ימים מהיום — ההחלפה תקרה ב-${fmtDate(new Date(Date.now()+ (editMode.handoverDays||30)*DAY_MS))}</span>
            </div>` : ''
          }
          <div class="chain-sub-toggle">
            <div class="mode-opt ${editMode.nextType==='fixed'?'selected':''}" onclick="setNextType('fixed')">📌 קבוע</div>
            <div class="mode-opt ${editMode.nextType==='temp'?'selected':''}" onclick="setNextType('temp')">⏳ הוא עצמו לזמן מוגבל</div>
          </div>
          ${editMode.nextType === 'temp' ? `
            <div class="days-row" style="margin-top:8px">
              <input type="number" min="1" value="${editMode.nextDays}" oninput="editMode.nextDays=parseInt(this.value)||1">
              <span>ימים מרגע שהוא נכנס</span>
            </div>` : ''
          }` : ''
        }
      ` : ''}
    </div>`;
}

function renderModeForm(i, tab) {
  const biz = bizById(choosingBiz);

  return `
    <div class="slot anchored">
      <div class="slot-num">${i+1}</div>
      <div class="slot-body" style="width:100%">
        <div class="mode-form">
          <div class="chosen">${biz.icon} ${biz.name} <span style="color:var(--text-muted);font-weight:400;font-size:11px">— בחר קבוע או זמני</span></div>
          <div class="mode-toggle">
            <div class="mode-opt ${editMode.type==='fixed'?'selected':''}" onclick="setEditMode('fixed')">📌 קבוע</div>
            <div class="mode-opt ${editMode.type==='temp'?'selected':''}" onclick="setEditMode('temp')">⏳ לזמן מוגבל</div>
          </div>
          ${editMode.type==='temp' ? `
            <div class="days-row">
              <input type="number" min="1" value="${editMode.days}" oninput="editMode.days=parseInt(this.value)||1; renderAll()">
              <span>ימים מהיום — יפוג ב-${fmtDate(new Date(Date.now()+ (editMode.days||1)*DAY_MS))}</span>
            </div>` : ''
          }
          ${renderChainBlock(tab, i)}
          <div class="mode-actions">
            <button class="slot-btn primary" onclick="saveAnchor(${i})">שמור עיגון</button>
            <button class="slot-btn" onclick="cancelPicker()">ביטול</button>
          </div>
        </div>
      </div>
    </div>`;
}

window.openPicker = function(i) {
  pickingSlot = i;
  choosingBiz = null;
  editMode = { type: 'fixed', days: 30, chainMode: 'auto', nextBizId: null, nextType: 'fixed', nextDays: 30, handoverDays: 30 };
  renderAll();
  setTimeout(() => filterPicker(''), 0);
};

// עריכה מהירה של עיגון קיים (למשל מתוך פאנל "מסתיים בקרוב") — נכנס ישר לטופס המצב, בלי לחפש מחדש
window.editExisting = function(i) {
  pickingSlot = i;
  const a = state[activeTab][i];
  choosingBiz = a.bizId;
  const now = Date.now();
  editMode = {
    type: a.mode, days: a.days || 30,
    chainMode: a.next ? 'chain' : 'auto',
    nextBizId: a.next ? a.next.bizId : null,
    nextType: a.next ? a.next.mode : 'fixed',
    nextDays: (a.next && a.next.days) || 30,
    handoverDays: (a.mode === 'fixed' && a.next) ? Math.max(1, Math.round((a.next.handoverAt - now) / DAY_MS)) : 30,
  };
  renderAll();
};

window.cancelPicker = function() {
  pickingSlot = null;
  choosingBiz = null;
  renderAll();
};

window.filterPicker = function(q) {
  const tab = tabMeta(activeTab);
  const anchoredIdsElsewhere = new Set(
    state[activeTab].map((a,idx) => (a && !isExpired(a) && idx !== pickingSlot) ? a.bizId : null).filter(Boolean)
  );
  const list = poolFor(tab).filter(b =>
    !anchoredIdsElsewhere.has(b.id) &&
    (!q || b.name.includes(q))
  );
  const listEl = document.getElementById('pickerList');
  if (!listEl) return;
  listEl.innerHTML = list.length ? list.map(b => `
    <div class="picker-item" onclick="chooseBiz('${b.id}')">
      <span class="ic">${b.icon}</span><span class="nm">${b.name}</span>
    </div>`).join('') : `<div class="picker-empty">לא נמצאו עסקים מתאימים</div>`;
};

window.chooseBiz = function(id) {
  choosingBiz = id;
  renderAll();
};

window.setEditMode = function(type) {
  editMode.type = type;
  renderAll();
};
window.setChainMode = function(mode) {
  editMode.chainMode = mode;
  renderAll();
};
window.setNextType = function(type) {
  editMode.nextType = type;
  renderAll();
};

window.saveAnchor = function(i) {
  const now = new Date();
  const until = editMode.type === 'temp' ? new Date(now.getTime() + (editMode.days||1) * DAY_MS) : null;

  let next = null;
  if (editMode.chainMode === 'chain' && editMode.nextBizId) {
    const handoverAt = editMode.type === 'temp' ? until : new Date(now.getTime() + (editMode.handoverDays||30) * DAY_MS);
    next = {
      bizId: editMode.nextBizId,
      mode: editMode.nextType,
      days: editMode.nextType === 'temp' ? (editMode.nextDays || 1) : null,
      handoverAt,
    };
  }

  state[activeTab][i] = {
    bizId: choosingBiz,
    mode: editMode.type,
    days: editMode.type === 'temp' ? (editMode.days || 1) : null,
    setAt: now,
    until,
    next,
  };
  pickingSlot = null;
  choosingBiz = null;
  renderAll();
};

window.removeAnchor = function(i) {
  state[activeTab][i] = null;
  renderAll();
};

// שדות שאין ב-admin-businesses.html היום (region/clicks/likes) לא מוצגים בשורה — נשארים במוק
// כי הם רלוונטיים ל"מרכז נתונים" (שם הם כבר קיימים היום, ר' הצעה שנשלחה בצ'אט), לא לרשימה עצמה.
const BIZ_TYPE_LABELS_MOCK = { physical: '🏪 חנות פיזית', online: '🌐 אונליין', pro: '🔧 בעל מקצוע / נותן שירות' };

let bizSearch = '';
let bizStatusFilter = 'all';     // 'all' | 'pending' | 'approved' | 'rejected' | 'changes'
let bizCategoryFilter = 'all';   // 'all' | catKey
let bizTypeFilter = 'all';       // 'all' | 'physical' | 'online' | 'pro'
let bizReviewFilter = 'all';     // 'all' | 'incomplete' (<5/5 נסקר) | 'complete' (5/5)
let bizDateRangeFilter = 'all';  // 'all' | '7' | '30' | '90' (ימים אחורה מהיום, לפי registeredAt) — תואם לfanDateRangeFilter
let bizSort = 'newest';          // 'newest' | 'oldest' | 'clicks' | 'likes' | 'reviewedAsc' | 'reviewedDesc'
let bizAdvancedOpen = false;     // "עוד סינונים" (סוג עסק/סקירה/תאריך) — מקופל כברירת מחדל, פחות עומס חזותי
let selectedBizIds = new Set();

window.setBizCategoryFilter = function(v) { bizCategoryFilter = v; renderMain(); };
window.setBizTypeFilter = function(v) { bizTypeFilter = v; renderMain(); };
window.setBizReviewFilter = function(v) { bizReviewFilter = v; renderMain(); };
window.setBizDateRangeFilter = function(v) { bizDateRangeFilter = v; renderMain(); };
window.setBizSort = function(v) { bizSort = v; renderMain(); };
window.toggleBizAdvanced = function() { bizAdvancedOpen = !bizAdvancedOpen; renderMain(); };
window.clearBizFilters = function() {
  bizSearch = ''; bizStatusFilter = 'all'; bizCategoryFilter = 'all'; bizTypeFilter = 'all'; bizReviewFilter = 'all'; bizDateRangeFilter = 'all'; bizSort = 'newest';
  renderMain();
};

function bizFilteredList() {
  const q = bizSearch.trim();
  const list = MOCK_BUSINESSES.filter(b => {
    const matchF = bizStatusFilter === 'all' ? true
      : bizStatusFilter === 'changes' ? !!b.hasPendingChange
      : b.status === bizStatusFilter;
    const matchCat = bizCategoryFilter === 'all' || b.catKey === bizCategoryFilter;
    const matchType = bizTypeFilter === 'all' || (b.bizTypes || []).includes(bizTypeFilter);
    const matchReview = bizReviewFilter === 'all' ? true
      : bizReviewFilter === 'complete' ? bizReviewedCount(b) === 5
      : bizReviewedCount(b) < 5;
    const matchDate = bizDateRangeFilter === 'all' ? true
      : (Date.now() - b.registeredAt.getTime()) <= Number(bizDateRangeFilter) * 86400000;
    const catLabel = (CATEGORIES.find(c => c.key === b.catKey) || {}).label || '';
    const matchQ = !q || b.name.includes(q) || (b.city || '').includes(q) || catLabel.includes(q);
    return matchF && matchCat && matchType && matchReview && matchDate && matchQ;
  });
  return list.sort((a, b) => {
    if (bizSort === 'oldest') return a.registeredAt - b.registeredAt;
    if (bizSort === 'clicks') return b.clicks - a.clicks;
    if (bizSort === 'likes') return b.likes - a.likes;
    if (bizSort === 'reviewedAsc') return bizReviewedCount(a) - bizReviewedCount(b);
    if (bizSort === 'reviewedDesc') return bizReviewedCount(b) - bizReviewedCount(a);
    return b.registeredAt - a.registeredAt;
  });
}

// תואם ל-statusChip()/waitingChip() ב-admin-businesses.html: מאושר/נדחה מקבלים צ'יפ קבוע,
// ממתין־לאישור מציג "נרשם [תאריך]" (כל העסקים במוק רשומים מעל 24 שעות, כמו במציאות ברוב המקרים)
function bizStatusChipHtml(b) {
  if (b.status === 'approved') return `<span class="biz-status-badge approved">✓ אושר</span>`;
  if (b.status === 'rejected') return `<span class="biz-status-badge rejected">✗ נדחה</span>`;
  return `<span class="biz-status-badge pending">📅 נרשם ${fmtDate(b.registeredAt)}</span>`;
}

// שורת מטא מייצגת (שורה ב"כל העסקים"/משימות + כותרת הכרטיס) — סוג עסק/עיר לא מעניינים כאן (מוצגים
// בפירוט בשלב 2 של הכרטיס עצמו), מה שכן חשוב לזיהוי מהיר זה מי בעל העסק.
function bizMetaStr(b) {
  return [b.ownerFirst, b.ownerLast].filter(Boolean).join(' ') || '—';
}

let selectedBizDetailId = null;
let bizMobileShowDetail = false;
// מצב בורר התגיות בשלב 3 של הכרטיס (עסק יחיד בעריכה בכל רגע נתון) — [ראשית, שנייה]
let editSelectedTags = [];
let editSecondTagOpen = false;
// מצב מסך "ניהול תגיות" + מיפוי הצעת-תגית-חופשית (tagSuggestion) לתגית קיימת — משותף בין הכרטיס והטאב הייעודי
let tagsMgmtEditing = null;   // {catKey, tag} — תגית שעורכים כרגע את השם שלה
let tagsMgmtMerging = null;   // {catKey, tag} — תגית שנבחרה למיזוג, ממתינה לבחירת יעד
let tagsMgmtAdding = {};      // {catKey: true} — קטגוריה עם שדה "הוסף תגית" פתוח כרגע
let tagQueueMapping = null;   // מזהה עסק שבתהליך מיפוי tagSuggestion שלו לתגית קיימת (במקום תגית חדשה)
let tagsMgmtSubtab = 'queue'; // 'queue' (חלק ב׳ — בקשות ממתינות) | 'list' (חלק א׳ — כל התגיות) — בדיוק כמו homeSubtab במרכז המשימות
let tagsMgmtListCat = CATEGORIES[0].key; // איזו קטגוריה מוצגת בחלק א׳ — כפתור אחד לכל קטגוריה, מציג רק את הנבחרת (לא כל 8 יחד)
let tagQueueNewCatPicking = null; // מזהה עסק שבתהליך בחירת קטגוריה לאישור tagSuggestion כתגית חדשה (לא תמיד הקטגוריה של העסק עצמו)
let tagUsageListOpen = null;  // {catKey, tag} — איזו רשימת "אילו עסקים משתמשים בתגית" פתוחה כרגע בחלק א׳

function bizRowsHtml() {
  const shown = bizFilteredList();
  if (!shown.length) return `<div class="placeholder-note">לא נמצאו עסקים</div>`;
  const chipLabel = b => b.status === 'approved' ? '✓ אושר' : b.status === 'rejected' ? '✗ נדחה' : 'ממתין';
  return shown.map(b => {
    const changeBadge = b.hasPendingChange ? `<span class="biz-change-badge">✏️ שינויים</span>` : '';
    const sel = selectedBizIds.has(b.id);
    const active = b.id === selectedBizDetailId;
    const ownerSubBadge = b.ownerIsSubscriber ? `<span class="tag-chip">✓ מנוי</span>` : `<span class="tag-chip empty">לא מנוי</span>`;
    return `
      <div class="task-row ${b.status} ${active?'active':''} ${sel?'selected':''}" onclick="selectBizDetail('${b.id}')">
        <div class="task-row-top">
          <div class="task-row-check" onclick="event.stopPropagation();toggleBizSelect('${b.id}')">${sel ? '✓' : ''}</div>
          <div class="task-row-body">
            <div class="task-row-name">${b.icon} ${b.name} ${changeBadge}</div>
            <div class="task-row-meta">${bizReviewBadgeHtml(b)}${ownerSubBadge} ${bizMetaStr(b)} · נרשם ${fmtDate(b.registeredAt)}</div>
          </div>
          <span class="task-row-chip ${b.status}">${chipLabel(b)}</span>
          <span class="task-row-chevron">›</span>
        </div>
      </div>`;
  }).join('');
}

// ── שליחת הודעה ישירה מהכרטיס — פותח WhatsApp Web/אפליקציית מייל עם טקסט מוכן מראש, בדיוק כמו
// buildWA()/buildMail() הקיימים היום ב-admin-businesses.html/admin-members.html (wa.me + mailto).
// זה לא שולח כלום אוטומטית — פותח חלון כתיבה מוכן, המנהל עדיין לוחץ "שלח" בעצמו. בדמו: טקסט קבוע,
// לא תבנית ניתנת לעריכה (זה קיים כבר ב-admin-messages.html לדפי האדמין האמיתיים — לא שוכפל כאן).
window.sendWA = function(phone, name) {
  const digits = (phone || '').replace(/[^0-9]/g, '');
  const intl = digits.startsWith('0') ? '972' + digits.slice(1) : digits;
  const msg = encodeURIComponent(`שלום ${name}, מדברים מצוות Yellow Zone 👋`);
  window.open(`https://wa.me/${intl}?text=${msg}`, '_blank');
};
window.sendMail = function(email, name) {
  const subject = encodeURIComponent('Yellow Zone — פנייה מהצוות');
  const body = encodeURIComponent(`שלום ${name},\n\n`);
  window.open(`mailto:${email}?subject=${subject}&body=${body}`, '_blank');
};

// ── תוכן מלא ואחיד לכרטיס עסק (לא רק תמצית) — משמש גם ב"כל העסקים" וגם בפתיחה מתוך הדשבורד הראשי ──
// ── כרטיס עסק מאוחד: תצוגה+עריכה בכל 5 השלבים ביחד, עריכה per-שלב (לא כרטיס-אחד-נערך-בשלמותו) ──
// זהה בהיגיון ל-admin-businesses.html האמיתי (card-section/sec-edit-btn/secView-secEdit/toggleSecEdit/saveSecN).
// כל 5 השלבים תמיד מרונדרים (תצוגה+עריכה), רק העריכה מוסתרת ב-CSS עד שלוחצים "✏️ ערוך" — בלי רינדור-מחדש
// בפתיחה/סגירה עצמה (מהיר, שומר גלילה/מצב שלבים אחרים). שמירה בפועל כן עושה renderMain() מלא (עקבי עם
// שאר הפעולות בקובץ — approveBiz/rejectBiz/approveTagSecondSuggestion וכו').
function bizFullDetailHtml(id, opts) {
  const b = findBiz(id);
  if (!b) return `<div class="placeholder-note">עסק לא נמצא</div>`;
  const o = Object.assign({ backFn: 'bizBackToList' }, opts || {});
  initEditTagsState(id); // מכין את בורר התגיות של שלב 3 מראש, כי הוא מרונדר תמיד (גם אם מוסתר)

  const catMeta = CATEGORIES.find(c => c.key === b.catKey);
  const alsoCatMeta = b.alsoUnderCategory ? CATEGORIES.find(c => c.key === b.alsoUnderCategory) : null;
  // תגית שנייה וקטגוריה שנייה ("מופיע גם תחת") — שתיהן עוברות אישור מנהל ייעודי, ולכן כשיש הצעה
  // ממתינה מוצגים כפתורי אישור/דחייה ישירים בכרטיס עצמו — לא רק דרך פתיחת עריכת שלב 3.
  const liveSecondTag = (b.tags || [])[1] || '';
  const tagSecondSuggestionHtml = (b.tagSecondSuggestion && b.tagSecondSuggestion !== liveSecondTag)
    ? `<div class="tag-suggestion-alert">💡 העסק ביקש תגית שנייה: "${b.tagSecondSuggestion}"
        <div class="suggestion-actions">
          <button class="act-btn approve tiny" onclick="approveTagSecondSuggestion('${b.id}')">✅ אשר</button>
          <button class="act-btn reject tiny" onclick="rejectTagSecondSuggestion('${b.id}')">✗ דחה</button>
        </div>
      </div>`
    : '';
  const alsoCatSuggestionMeta = (b.alsoCategorySuggestion && b.alsoCategorySuggestion !== b.alsoUnderCategory)
    ? CATEGORIES.find(c => c.key === b.alsoCategorySuggestion) : null;
  const alsoCatSuggestionHtml = alsoCatSuggestionMeta
    ? `<div class="tag-suggestion-alert">💡 העסק ביקש להופיע גם תחת: ${alsoCatSuggestionMeta.icon} ${alsoCatSuggestionMeta.label}
        <div class="suggestion-actions">
          <button class="act-btn approve tiny" onclick="approveAlsoCatSuggestion('${b.id}')">✅ אשר</button>
          <button class="act-btn reject tiny" onclick="rejectAlsoCatSuggestion('${b.id}')">✗ דחה</button>
        </div>
      </div>`
    : '';
  // הצעת תגית חדשה חופשית (tagSuggestion) — נפרד לגמרי מ-tagSecondSuggestion (זו הצעה לתגית שלא קיימת
  // בכלל ברשימה הנעולה, לא בחירה בין תגיות קיימות). מוצג באותו דפוס תיבת-התרעה + פעולות ישירות מהכרטיס.
  const tagFreeSuggestionMapOpen = tagQueueMapping === b.id;
  const tagFreeSuggestionCatPicking = tagQueueNewCatPicking === b.id;
  const tagFreeSuggestionPool = TAGS_BY_CATEGORY_MOCK[b.catKey] || [];
  const tagFreeSuggestionCatOptions = CATEGORIES.map(c => `<option value="${c.key}" ${b.catKey===c.key?'selected':''}>${c.icon} ${c.label}${b.catKey===c.key?' (הקטגוריה של העסק)':''}</option>`).join('');
  const tagFreeSuggestionHtml = b.tagSuggestion
    ? `<div class="tag-suggestion-alert">🆕 העסק הציע תגית חדשה: "${b.tagSuggestion}"
        ${tagFreeSuggestionMapOpen ? `
        <div class="tagmgmt-inline-form" style="margin-top:6px">
          <select id="tagQueueMapSelect_${b.id}">
            ${tagFreeSuggestionPool.map(t => `<option value="${t.replace(/"/g,'&quot;')}">${t}</option>`).join('')}
          </select>
          <button class="act-btn approve tiny" onclick="confirmMapTagSuggestion('${b.id}')">אישור מיפוי</button>
          <button class="act-btn tiny" onclick="cancelMapTagSuggestion()">ביטול</button>
        </div>` : tagFreeSuggestionCatPicking ? `
        <div class="tagmgmt-inline-form" style="margin-top:6px">
          <span style="font-size:11px;color:var(--text-sm)">תחת איזו קטגוריה?</span>
          <select id="tagNewCatSelect_${b.id}">${tagFreeSuggestionCatOptions}</select>
          <button class="act-btn approve tiny" onclick="confirmApproveTagSuggestionNewCat('${b.id}')">✅ הוסף ואשר</button>
          <button class="act-btn tiny" onclick="cancelNewCatPicking()">ביטול</button>
        </div>` : `
        <div class="suggestion-actions">
          <button class="act-btn approve tiny" onclick="startNewCatPicking('${b.id}')">✅ אשר כתגית חדשה</button>
          <button class="act-btn tiny" onclick="startMapTagSuggestion('${b.id}')">🔀 מפה לקיימת</button>
          <button class="act-btn reject tiny" onclick="rejectTagSuggestion('${b.id}')">✗ דחה</button>
        </div>`}
      </div>`
    : '';
  const tagsHtml = (b.tags && b.tags.length) ? b.tags.map(t => `<span class="tag-chip">${t}</span>`).join('') : '<span class="tag-chip empty">אין תגיות</span>';
  const types = b.bizTypes || [];
  const isPhysical = types.includes('physical');
  const isOnline = types.includes('online');
  const isPro = types.includes('pro');
  const typeLabels = types.map(t => BIZ_TYPE_LABELS_MOCK[t]).filter(Boolean).join(' · ') || '—';
  const allDiscounts = [{ text: b.discountFullText, redeemMode: b.discountRedeemMode }].concat(b.additionalDiscounts || []);
  // דיף שינויים ממתינים — מוצג בתוך השלב הרלוונטי בפועל (לא תמיד שלב 4), לפי DIFF_FIELD_TO_SECTION
  // שורת דיף לחיצה פותחת ישירות את עריכת השלב (הכרטיס כבר תמיד פתוח, אין "כרטיס אחר" לקפוץ אליו)
  const diffHtmlForSection = (n) => {
    if (!b.pendingChangeDiff) return '';
    const keys = Object.keys(b.pendingChangeDiff).filter(key => (DIFF_FIELD_TO_SECTION[key] || 2) === n);
    if (!keys.length) return '';
    return keys.map(key => `
      <div class="diff-row clickable" onclick="toggleBizSecEdit('${b.id}',${n})" title="לחצו לעריכת השלב">
        <div class="diff-label">${DIFF_FIELD_LABELS_MOCK[key] || key}</div>

  const flagChips = [

  const statusActions = b.status === 'pending'

    : b.pendingChangeDiff
    ? `<button class="act-btn approve" onclick="approveChanges('${b.id}')">✅ אשר שינויים</button>
       <button class="act-btn reject" onclick="rejectChanges('${b.id}')">✗ דחה שינויים</button>`
    : '';

  // ── שדות עריכה (מוכנים תמיד, מוסתרים ב-CSS עד "✏️ ערוך") ──
  const catOptions = CATEGORIES.map(c => `<option value="${c.key}" ${b.catKey===c.key?'selected':''}>${c.icon} ${c.label}</option>`).join('');
  const alsoCatOptions = CATEGORIES.filter(c => c.key !== b.catKey)
    .map(c => `<option value="${c.key}" ${b.alsoUnderCategory===c.key?'selected':''}>${c.icon} ${c.label}</option>`).join('');

  const proRegionsChecks = REGIONS_MOCK.map(r => `<label><input type="checkbox" class="edit-proregion-${b.id}" value="${r}" ${(b.regions||[]).includes(r)?'checked':''}> ${r}</label>`).join('');
  const redeemOptions = (val) => `
    <option value="physical" ${val==='physical'?'selected':''}>🏪 בחנות הפיזית</option>

  const d2 = (b.additionalDiscounts && b.additionalDiscounts[0]) || { text:'', redeemMode:'physical' };

  // כל פריטי השינוי הממתינים, מקובצים לפי שלב — משמש גם לצביעת כותרת השלב למטה וגם לצביעת השדה
  // הספציפי בטופסי העריכה (fieldChangeHintHtml). המשתמש: "תצבע לי את השלב ואת השדה שמבוקש לשינוי".
  const pendingChangeItems = bizPendingChangeItems(b);
  const changeItemsBySection = {};
  pendingChangeItems.forEach(it => { (changeItemsBySection[it.section] = changeItemsBySection[it.section] || []).push(it); });
  // רמז-שדה — תג "🔸 היה: X" מתחת לשדה עריכה ספציפי, רק אם יש עבורו פריט שינוי ממתין (מזוהה לפי field).
  const fieldChangeHintHtml = (field) => {
    const it = pendingChangeItems.find(x => x.field === field && x.old !== undefined);
    return it ? `<div class="field-change-hint">🔸 היה: "${it.old}"</div>` : '';

  // וחשוב להמשיך לראות ולסמן את זה גם אחרי אישור (ר' PROJECT_CONTEXT.md §44).
  // "has-change" — כותרת השלב מקבלת סימון כחול (ציר נפרד מ-reviewed ירוק/כתום) כל עוד יש עבורו שינוי ממתין.
  const secTitle = (n, label) => {
    const isReviewed = !!(b.reviewedSections && b.reviewedSections[n]);
    const hasChange = !!(changeItemsBySection[n] && changeItemsBySection[n].length);

        <label class="sec-reviewed-toggle"><input type="checkbox" ${isReviewed ? 'checked' : ''} onchange="toggleSecReviewed('${b.id}',${n},this.checked)"> נסקר</label>
        <button class="sec-edit-btn" onclick="toggleBizSecEdit('${b.id}',${n})">✏️ ערוך</button>
      </div>

  };

              </a>` : ''}

        ${isPhysical ? `<div class="approve-field"><div class="approve-field-label">📍 כתובות סניפים</div><div class="approve-longtext">${branchesHtml}</div></div>` : ''}
        ${isOnline ? `<div class="approve-field"><div class="approve-field-label">🌐 אתר אונליין</div><div class="approve-longtext">${b.websiteOnline || '—'}</div></div>` : ''}

        <div class="approve-field">

          <div class="approve-longtext">
            טלפון: ${b.phone || '—'}${b.phone ? ` <button class="icon-btn" title="שלח וואטסאפ" onclick="sendWA('${b.phone}','${b.name}')">📲</button>` : ''}<br>

            מייל שירות: ${b.serviceEmail || '—'}${b.serviceEmail ? ` <button class="icon-btn" title="שלח מייל" onclick="sendMail('${b.serviceEmail}','${b.name}')">✉️</button>` : ''}

          <div class="approve-longtext">${b.website ? '🌐 ' + b.website : 'אין אתר'}${b.instagram ? '<br>📷 ' + b.instagram : ''}${b.facebook ? '<br>👍 ' + b.facebook : ''}</div>

        <div class="edit-grid">
          <label class="edit-field"><span>קטגוריה ראשית</span><select id="edit_cat_${b.id}" onchange="onEditCatChange('${b.id}')">${catOptions}</select></label>

// ── עריכה per-שלב: toggle ישיר של show/hide (בלי רינדור-מחדש), זהה בהיגיון ל-toggleSecEdit ב-admin-businesses.html ──
window.toggleBizSecEdit = function(id, n) {
  const view = document.getElementById('secView'+n+'_'+id);
  const edit = document.getElementById('secEdit'+n+'_'+id);
  if (!edit) return;
  const opening = !edit.classList.contains('open');
  // שלב 3 (תגיות) תלוי ב-state גלובלי (editSelectedTags) שיכול "להידבק" מעריכה קודמת שבוטלה בלי שמירה —
  // מאתחלים ומרנדרים מחדש בכל טוגל (פתיחה וגם סגירה) כדי שיהיה תמיד עקבי עם b.tags/b.tagSecondSuggestion בפועל.
  if (n === 3) {
    initEditTagsState(id);
    rerenderEditTagsArea(id);
  }
  edit.classList.toggle('open', opening);
  if (view) view.style.display = opening ? 'none' : '';
};

// ── סימון "נסקר" לכל שלב — בקרה ידנית של המנהל על עסק pending לפני אישור, לא קשור לבריאות פרופיל ──
window.toggleSecReviewed = function(id, n, checked) {
  const b = findBiz(id);
  if (!b) return;
  if (!b.reviewedSections) b.reviewedSections = {};
  b.reviewedSections[n] = checked;
  renderMain();
};

window.saveBizSec1 = function(id) {
  const b = findBiz(id);
  if (!b) return;
  b.ownerFirst = document.getElementById('edit_ownerFirst_'+id).value.trim();
  b.ownerLast = document.getElementById('edit_ownerLast_'+id).value.trim();
  b.ownerPhone = document.getElementById('edit_ownerPhone_'+id).value.trim();
  b.ownerEmail = document.getElementById('edit_ownerEmail_'+id).value.trim();

  // אין "היה מנוי בעבר" (שדה שלא קיים בהרשמת בעל עסק, ר' business.html) ואין ערך-צל מהנתיב הלא-נבחר.
  b.ownerIsSubscriber = document.getElementById('edit_ownerIsSub_'+id).value === 'yes';

    b.ownerFacebookUrl = document.getElementById('edit_ownerFbUrl_'+id).value.trim();

window.saveBizSec2 = function(id) {
  const b = findBiz(id);

  if (document.getElementById('edit_type_online_'+id).checked) types.push('online');
  if (document.getElementById('edit_type_pro_'+id).checked) types.push('pro');
  b.bizTypes = types;
  b.isOnline = types.includes('online');
  // שדות type-conditional (ר' business-dashboard.html שלב 2) — נקראים תמיד, אבל רק אם הסוג המתאים מסומן
  // כך שאם המנהל מסמן/מבטל checkbox בלי לגעת בשדה עצמו, הערך לא "נדבק" לסוג שכבר לא רלוונטי
  const branchCity = document.getElementById('edit_branchCity_'+id).value.trim();
  const branchAddress = document.getElementById('edit_branchAddress_'+id).value.trim();
  b.branches = (types.includes('physical') && (branchCity || branchAddress)) ? [{ city: branchCity, address: branchAddress }] : [];
  b.websiteOnline = types.includes('online') ? document.getElementById('edit_websiteOnline_'+id).value.trim() : '';
  b.regions = types.includes('pro') ? Array.from(document.querySelectorAll('.edit-proregion-'+id+':checked')).map(el => el.value) : [];
  b.phone = document.getElementById('edit_phone_'+id).value.trim();
  b.whatsapp = document.getElementById('edit_whatsapp_'+id).value.trim();
  b.serviceEmail = document.getElementById('edit_serviceEmail_'+id).value.trim();
  b.website = document.getElementById('edit_website_'+id).value.trim();
  b.instagram = document.getElementById('edit_instagram_'+id).value.trim();
  b.facebook = document.getElementById('edit_facebook_'+id).value.trim();
  b.hoursText = document.getElementById('edit_hours_'+id).value.trim();
  b.descriptionText = document.getElementById('edit_desc_'+id).value.trim();
  b.healthScore = computeHealthScore(b);
  renderMain();
};

window.saveBizSec3 = function(id) {
  const b = findBiz(id);

  b.catKey = document.getElementById('edit_cat_'+id).value;

window.saveBizSec4 = function(id) {

// ── בורר תגית ראשית+שנייה בטופס עריכה, כולל מנגנון האישור לתגית שנייה (זהה בהיגיון ל-admin-businesses.html) ──
// מאתחל את editSelectedTags/editSecondTagOpen כשנפתח טופס עריכה: תגיות מאושרות קיימות + הצעת תגית שנייה
// ממתינה (אם תקפה לקטגוריה הנוכחית ועדיין לא אושרה) מוצגת כבר מסומנת, כדי שאישור המנהל יהיה פשוט "שמור".
function initEditTagsState(id) {
  const b = findBiz(id);
  if (!b) return;
  const pool = TAGS_BY_CATEGORY_MOCK[b.catKey] || [];
  editSelectedTags = (b.tags || []).slice(0, 2);
  const liveSecond = editSelectedTags[1] || '';
  if (!editSelectedTags[1] && b.tagSecondSuggestion && b.tagSecondSuggestion !== liveSecond && pool.includes(b.tagSecondSuggestion)) {
    editSelectedTags[1] = b.tagSecondSuggestion;
  }
  editSecondTagOpen = !!editSelectedTags[1];
}

function editTagsAreaHtml(b, catKey) {
  const pool = TAGS_BY_CATEGORY_MOCK[catKey] || [];
  const primaryChips = pool.map(t => `<div class="tag-chip selectable${editSelectedTags[0]===t?' selected':''}" onclick="selectPrimaryTag('${b.id}','${t.replace(/'/g,"\\'")}')">${t}</div>`).join('');
  const liveSecond = (b.tags || [])[1] || '';
  const suggestionHtml = (b.tagSecondSuggestion && b.tagSecondSuggestion !== liveSecond)
    ? `<div class="tag-suggestion-alert">💡 העסק ביקש תגית שנייה: "${b.tagSecondSuggestion}"</div>` : '';
  const freeSuggestionHtml = b.tagSuggestion
    ? `<div class="tag-suggestion-alert">🆕 העסק הציע תגית חדשה: "${b.tagSuggestion}"
        ${editSelectedTags.filter(Boolean).length >= 2
          ? ' — כבר נבחרו 2 תגיות, אי אפשר להוסיף עוד'
          : `<button class="act-btn approve tiny" onclick="addFreeSuggestionToPool('${b.id}','${catKey}')">➕ הוסף לרשימה ובחר (${(CATEGORIES.find(c=>c.key===catKey)||{}).label||catKey})</button>`}
      </div>`
    : '';
  const showSecondRow = !!editSelectedTags[0];
  const secondPool = pool.filter(t => t !== editSelectedTags[0]);
  const secondChips = secondPool.map(t => `<div class="tag-chip selectable${editSelectedTags[1]===t?' selected':''}" onclick="selectSecondTag('${b.id}','${t.replace(/'/g,"\\'")}')">${t}</div>`).join('');
  return `
    <div id="edit_tagsArea_${b.id}">
      <div class="tag-chip-list">${primaryChips || '<span class="tag-chip empty">אין תגיות מוגדרות לקטגוריה זו</span>'}</div>
      ${suggestionHtml}
      ${freeSuggestionHtml}
      ${showSecondRow ? `
      <div class="toggle-row">
        <span>תגית שנייה (אופציונלי)</span>
        <button type="button" class="toggle${editSecondTagOpen?' on':''}" onclick="toggleSecondTag('${b.id}')"></button>
      </div>
      ${editSecondTagOpen ? `<div class="tag-chip-list" style="margin-top:6px">${secondChips || '<span class="tag-chip empty">אין תגיות נוספות בקטגוריה זו</span>'}</div>` : ''}` : ''}
    </div>`;
}

function rerenderEditTagsArea(id) {
  const b = findBiz(id);
  const catKey = document.getElementById('edit_cat_'+id).value;
  const el = document.getElementById('edit_tagsArea_'+id);
  if (el) el.outerHTML = editTagsAreaHtml(b, catKey);
}

window.onEditCatChange = function(id) {
  editSelectedTags = [];
  editSecondTagOpen = false;
  rerenderEditTagsArea(id);
};

// ── אימות "אוהד מכבי" של בעל העסק בטופס עריכה — מציג רק את קבוצת השדות של הנתיב שנבחר בפועל ──
window.onEditOwnerSubChange = function(id) {
  const isSub = document.getElementById('edit_ownerIsSub_'+id).value === 'yes';
  const subFields = document.getElementById('edit_ownerSubFields_'+id);
  const noSubFields = document.getElementById('edit_ownerNoSubFields_'+id);
  if (subFields) subFields.style.display = isSub ? 'grid' : 'none';
  if (noSubFields) noSubFields.style.display = isSub ? 'none' : 'block';
};
window.updateOwnerProofPreview = function(id, url) {
  const wrap = document.getElementById('edit_ownerProofPreview_'+id);
  const img = document.getElementById('edit_ownerProofImg_'+id);
  if (!wrap || !img) return;
  img.src = url;
  wrap.style.display = url ? 'block' : 'none';
};

// ── סוג עסק בטופס עריכה — כל checkbox חושף/מסתיר רק את השדות הרלוונטיים לסוג הזה (ר' business-dashboard.html שלב 2) ──
window.onEditBizTypeChange = function(id) {
  const isPhysical = document.getElementById('edit_type_physical_'+id).checked;
  const isOnline = document.getElementById('edit_type_online_'+id).checked;
  const isPro = document.getElementById('edit_type_pro_'+id).checked;
  const physicalEl = document.getElementById('edit_typePhysicalFields_'+id);
  const onlineEl = document.getElementById('edit_typeOnlineFields_'+id);
  const proEl = document.getElementById('edit_typeProFields_'+id);
  if (physicalEl) physicalEl.style.display = isPhysical ? 'block' : 'none';
  if (onlineEl) onlineEl.style.display = isOnline ? 'grid' : 'none';
  if (proEl) proEl.style.display = isPro ? 'block' : 'none';
};

window.selectPrimaryTag = function(id, tag) {
  if (editSelectedTags[0] === tag) {
    editSelectedTags = [];
    editSecondTagOpen = false;
  } else {
    editSelectedTags = [tag, ...editSelectedTags.slice(1)].filter(Boolean);
  }
  rerenderEditTagsArea(id);
};

window.selectSecondTag = function(id, tag) {
  editSelectedTags[1] = (editSelectedTags[1] === tag ? undefined : tag);
  editSelectedTags = editSelectedTags.filter(Boolean);
  rerenderEditTagsArea(id);
};

window.toggleSecondTag = function(id) {
  editSecondTagOpen = !editSecondTagOpen;
  if (!editSecondTagOpen) editSelectedTags = editSelectedTags.slice(0, 1);
  rerenderEditTagsArea(id);
};

// "➕ הוסף לרשימה ובחר" בתוך טופס העריכה — מוסיף את ההצעה החופשית (tagSuggestion) לפול התגיות
// של הקטגוריה, ובוחר אותה מיד (ראשית אם ריקה, אחרת שנייה). לא מנקה b.tagSuggestion כאן —
// זה קורה רק בשמירה בפועל (saveBizSec3), בדיוק כמו tagSecondSuggestion.
// catKey מגיע מהקטגוריה שנבחרה *בפועל* בטופס העריכה כרגע (לא בהכרח b.catKey — יכול להשתנות באמצע
// עריכה דרך "קטגוריה ראשית" לפני שנשמר) — כדי שהתגית תתווסף לפול הנכון ותיבחר בהתאם.
window.addFreeSuggestionToPool = function(id, catKey) {
  const b = findBiz(id);
  if (!b || !b.tagSuggestion) return;
  const cat = catKey || b.catKey;
  const pool = TAGS_BY_CATEGORY_MOCK[cat] || (TAGS_BY_CATEGORY_MOCK[cat] = []);
  const tag = b.tagSuggestion;
  if (!pool.includes(tag)) pool.push(tag);
  if (!editSelectedTags[0]) editSelectedTags[0] = tag;
  else if (!editSelectedTags[1]) { editSelectedTags[1] = tag; editSecondTagOpen = true; }
  rerenderEditTagsArea(id);
};

function refreshBizList() {
  const list = bizFilteredList();
  if (!list.find(b => b.id === selectedBizDetailId)) {
    selectedBizDetailId = list[0] ? list[0].id : null;
    const dc = document.getElementById('bizDetailCol');
    if (dc) dc.innerHTML = selectedBizDetailId ? bizFullDetailHtml(selectedBizDetailId) : `<div class="placeholder-note">לא נמצאו עסקים</div>`;
  }
  const el = document.getElementById('bizListCol');
  if (el) el.innerHTML = bizRowsHtml();
  const bar = document.getElementById('bizBulkBarWrap');
  if (bar) bar.outerHTML = bizBulkBarHtml();
  const selRow = document.getElementById('bizSelectAllRow');
  if (selRow) selRow.outerHTML = bizSelectAllRowHtml();
}

window.filterBizRows = function(v) {
  bizSearch = v;
  refreshBizList();
};

window.setBizStatusFilter = function(status) {
  bizStatusFilter = status;
  renderMain();
};

window.toggleBizSelect = function(id) {
  if (selectedBizIds.has(id)) selectedBizIds.delete(id); else selectedBizIds.add(id);
  refreshBizList();
};

window.toggleSelectAllBiz = function() {
  const ids = bizFilteredList().map(b => b.id);
  const allSelected = ids.length > 0 && ids.every(id => selectedBizIds.has(id));
  if (allSelected) ids.forEach(id => selectedBizIds.delete(id));
  else ids.forEach(id => selectedBizIds.add(id));
  refreshBizList();
};

window.clearBizSelection = function() {
  selectedBizIds.clear();
  refreshBizList();
};

// פעולה גורפת לדוגמה בלבד — משנה סטטוס במוק המקומי, לא כותבת לשום מקום אמיתי
window.bulkSetBizStatus = function(status) {
  selectedBizIds.forEach(id => { const b = bizById(id); if (b) b.status = status; });

};

        <span class="sp"></span>

      </div>

        </select>
        <select class="filter-select" onchange="setBizReviewFilter(this.value)">
          <option value="all">כל מצבי הסקירה</option>
          <option value="incomplete" ${bizReviewFilter==='incomplete'?'selected':''}>לא נסקר במלואו (&lt;5/5)</option>
          <option value="complete" ${bizReviewFilter==='complete'?'selected':''}>נסקר במלואו (5/5)</option>
        </select>
        <select class="filter-select" onchange="setBizDateRangeFilter(this.value)">
          <option value="all">כל התאריכים</option>
          <option value="7" ${bizDateRangeFilter==='7'?'selected':''}>נרשמו ב-7 הימים האחרונים</option>
          <option value="30" ${bizDateRangeFilter==='30'?'selected':''}>נרשמו ב-30 הימים האחרונים</option>
          <option value="90" ${bizDateRangeFilter==='90'?'selected':''}>נרשמו ב-90 הימים האחרונים</option>
        </select>
      </div>` : ''}
    </div>`;
}

function bizSelectAllRowHtml() {
  const ids = bizFilteredList().map(b => b.id);
  const allSelected = ids.length > 0 && ids.every(id => selectedBizIds.has(id));
  return `
    <div class="biz-select-all-row" id="bizSelectAllRow">
      <button class="biz-select-all-btn ${allSelected?'active':''}" onclick="toggleSelectAllBiz()">${allSelected ? '☑ בטל בחירת הכל' : '☐ בחר הכל'}</button>
      <span class="biz-sel-count">${selectedBizIds.size ? selectedBizIds.size + ' נבחרו' : ''}</span>
    </div>`;
}

// המספרים הכוללים (נרשמו/ממתינים/פעילים) מוצגים בסרגל ה-KPI בדשבורד הראשי — לא כפולים כאן,
// כדי לא לחזור על אותו מידע פעמיים (לבקשת המשתמש).
function bizListHtml() {
  const list = bizFilteredList();
  if (selectedBizDetailId == null || !list.find(b => b.id === selectedBizDetailId)) {
    selectedBizDetailId = list[0] ? list[0].id : null;
  }
  return `
    ${bizFilterBarHtml()}
    ${bizBulkBarHtml()}
    <div class="task-split ${bizMobileShowDetail?'mobile-show-detail':''}" id="bizSplit">
      <div class="task-list-col" id="bizListCol">${bizRowsHtml()}</div>
      <div class="task-detail-col" id="bizDetailCol">${selectedBizDetailId ? bizFullDetailHtml(selectedBizDetailId) : '<div class="placeholder-note">לא נמצאו עסקים</div>'}</div>
    </div>`;
}

// ══════════════════════════════════════════════════════════════════
// כל האוהדים — סטטיסטיקה + סינון + Master-Detail (מקביל ל"כל העסקים")
// ══════════════════════════════════════════════════════════════════

let fanSearch = '';
let fanStatusFilter = 'all';   // 'all' | 'pending' | 'approved' | 'rejected'
let fanSort = 'newest';        // 'newest' | 'oldest'
let fanDateRangeFilter = 'all'; // 'all' | '7' | '30' | '90' (ימים אחורה מהיום)
let selectedFanIds = new Set();
let selectedFanDetailId = null;
let fanMobileShowDetail = false;

window.setFanSort = function(v) { fanSort = v; renderMain(); };
window.setFanDateRangeFilter = function(v) { fanDateRangeFilter = v; renderMain(); };
window.clearFanFilters = function() {
  fanSearch = ''; fanStatusFilter = 'all'; fanSort = 'newest'; fanDateRangeFilter = 'all';
  renderMain();
};

function fanFilteredList() {
  const q = fanSearch.trim();
  const now = Date.now();
  const list = MOCK_FANS.filter(f => {
    const matchF = fanStatusFilter === 'all' ? true : f.status === fanStatusFilter;
    const matchQ = !q || f.name.includes(q) || f.phone.includes(q) || f.email.includes(q);
    const matchRange = fanDateRangeFilter === 'all' || (now - f.registeredAt.getTime()) <= Number(fanDateRangeFilter) * 86400000;
    return matchF && matchQ && matchRange;
  });
  return list.sort((a, b) => {
    if (fanSort === 'oldest') return a.registeredAt - b.registeredAt;
    if (fanSort === 'unverifiedFirst') return (a.adminVerified?1:0) - (b.adminVerified?1:0);
    if (fanSort === 'verifiedFirst') return (b.adminVerified?1:0) - (a.adminVerified?1:0);
    return b.registeredAt - a.registeredAt; // newest — ברירת מחדל
  });
}

function fanStatusChipHtml(f) {
  if (f.status === 'approved') return `<span class="biz-status-badge approved">✓ אושר</span>`;
  if (f.status === 'rejected') return `<span class="biz-status-badge rejected">✗ נדחה</span>`;
  return `<span class="biz-status-badge pending">📅 נרשם ${fmtDate(f.registeredAt)}</span>`;
}

// באדג'ים "✓ מנוי"/"לא מנוי" + "🏪 בעל עסק: <שם העסק>" (לא סתם "כן") — משותף לכל מקום שמציג שורת/כרטיס אוהד
function fanBadgesHtml(f) {
  const subBadge = f.isSubscriber ? `<span class="tag-chip">✓ מנוי</span>` : `<span class="tag-chip empty">לא מנוי</span>`;
  const linkedBiz = f.isBusinessOwner ? findBiz(f.linkedBusinessId) : null;
  const ownerBadge = f.isBusinessOwner ? `<span class="tag-chip">🏪 ${linkedBiz ? linkedBiz.name : 'בעל עסק'}</span>` : '';
  const verifyBadge = f.adminVerified
    ? `<span class="biz-status-badge approved">✓ נבדק</span>`
    : `<span class="biz-status-badge pending">⏳ טרם נבדק</span>`;
  const noteBadge = f.adminNote ? `<span class="tag-chip" title="יש הערת מנהל">📝</span>` : '';
  return `${verifyBadge}${subBadge}${ownerBadge}${noteBadge} `;
}

function fanRowsHtml() {
  const shown = fanFilteredList();
  if (!shown.length) return `<div class="placeholder-note">לא נמצאו אוהדים</div>`;
  const chipLabel = f => f.status === 'approved' ? '✓ אושר' : f.status === 'rejected' ? '✗ נדחה' : 'ממתין';
  return shown.map(f => {
    const sel = selectedFanIds.has(f.id);
    const active = f.id === selectedFanDetailId;
    return `
      <div class="task-row ${f.status} ${active?'active':''} ${sel?'selected':''}" onclick="selectFanDetail('${f.id}')">
        <div class="task-row-top">
          <div class="task-row-check" onclick="event.stopPropagation();toggleFanSelect('${f.id}')">${sel ? '✓' : ''}</div>
          <div class="task-row-body">
            <div class="task-row-name">🧑 ${f.name}</div>
            <div class="task-row-meta">${fanBadgesHtml(f)}${f.phone} · נרשם ${fmtDate(f.registeredAt)}</div>
          </div>
          <span class="task-row-chip ${f.status}">${chipLabel(f)}</span>
          <span class="task-row-chevron">›</span>
        </div>
      </div>`;
  }).join('');
}

window.selectFanDetail = function(id) {
  selectedFanDetailId = id;
  fanMobileShowDetail = true;
  const lc = document.getElementById('fanListCol');
  const dc = document.getElementById('fanDetailCol');
  const sp = document.getElementById('fanSplit');
  if (lc) lc.innerHTML = fanRowsHtml();
  if (dc) dc.innerHTML = fanFullDetailHtml(id);
  if (sp) sp.classList.add('mobile-show-detail');
};

window.fanBackToList = function() {
  fanMobileShowDetail = false;
  const sp = document.getElementById('fanSplit');
  if (sp) sp.classList.remove('mobile-show-detail');
};

function fanFullDetailHtml(id, opts) {
  const f = MOCK_FANS.find(x => x.id === id);
  if (!f) return `<div class="placeholder-note">אוהד לא נמצא</div>`;
  const o = Object.assign({ backFn: 'fanBackToList' }, opts || {});
  const actionsTop = f.status === 'pending' ? `
    <div class="approve-card-actions top">
      <button class="act-btn approve" title="שולח אוטומטית מייל אישור עם קוד כניסה (Brevo)" onclick="approveFan('${f.id}')">✅ אשר</button>
      <button class="act-btn reject" onclick="rejectFan('${f.id}')">✗ דחה</button>
    </div>` : '';
  return `
    <button class="act-btn task-back-btn" onclick="${o.backFn}()">→ חזרה</button>
    <div class="approve-card">
      <div class="approve-card-head">
        <div class="approve-card-title">🧑 ${f.name}</div>
        <div class="approve-card-meta">נרשם ${fmtDate(f.registeredAt)} (${agoLabel(f.registeredAt)})</div>
      </div>
      ${actionsTop}
      <div class="approve-field">
        <div class="approve-field-label">סטטוס</div>
        ${fanStatusChipHtml(f)}
        ${f.reviewFlag === 'name_mismatch' ? '<div class="health-missing" style="font-size:11.5px">⚠️ דגל בדיקה: שם לא תואם רשומה קודמת (דדופ-הרשמה) — טרם סומן כנבדק</div>' : ''}
      </div>
      <div class="approve-field">
        <div class="approve-field-label">🔍 בדיקת מנהל</div>
        <label class="sec-reviewed-toggle" style="font-size:13px">
          <input type="checkbox" ${f.adminVerified ? 'checked' : ''} onchange="toggleFanVerified('${f.id}', this.checked)">
          ${f.adminVerified ? '✓ נבדק ואומת ע"י מנהל' : 'סמן כנבדק ואומת ע"י מנהל'}
        </label>
        <label class="edit-field full" style="margin-top:8px">
          <span>הערה לעצמי (למנהלים בלבד, לא גלוי לאוהד)</span>
          <textarea id="fanNote_${f.id}" rows="2" placeholder="למשל: התקשרתי לוודא, הכל תקין..." onblur="saveFanNote('${f.id}', this.value)">${f.adminNote || ''}</textarea>
        </label>
      </div>
      <div class="approve-field">
        <div class="approve-field-label">פרטי קשר</div>
        <div class="approve-longtext">
          ${f.phone} <button class="icon-btn" title="שלח וואטסאפ" onclick="sendWA('${f.phone}','${f.name}')">📲</button><br>
          ${f.email} <button class="icon-btn" title="שלח מייל" onclick="sendMail('${f.email}','${f.name}')">✉️</button>
        </div>
      </div>
      <div class="approve-field">
        <div class="approve-field-label">🎫 אימות מנוי</div>
        <div class="approve-longtext">${f.isSubscriber
          ? `מנוי בפועל · ${f.subscriberSection} · מס' מנוי ${f.subscriberNumber}`
          : `לא מנוי כרגע (היה מנוי בעבר: ${f.wasSubscriber === 'yes' ? 'כן' : 'לא'})${f.facebookUrl ? '<br>🔗 ' + f.facebookUrl : ''}`}</div>
      </div>
      <div class="approve-field">
        <div class="approve-field-label">🖼️ תמונת הוכחה</div>
        <div class="approve-longtext">${f.hasProofPhoto ? 'הועלתה תמונת הוכחה' : 'לא הועלתה תמונת הוכחה'}</div>
      </div>
      ${f.isBusinessOwner ? `
      <div class="approve-field">
        <div class="approve-field-label">🏪 בעל עסק</div>
        <div class="approve-longtext">כן — מקושר לעסק: ${(findBiz(f.linkedBusinessId) || {}).name || f.linkedBusinessId}</div>
      </div>` : ''}
    </div>`;
}

// בדיקת-מנהל ידנית לאוהד — נפרד מ-status (אשר/דחה) ומ-reviewFlag האוטומטי, זמין בכל מקום שמציג כרטיס אוהד מלא
// (גם "אוהדים ממתינים" בדשבורד הראשי וגם "כל האוהדים") כי שניהם משתמשים באותו fanFullDetailHtml.
window.toggleFanVerified = function(id, checked) {
  const f = findFan(id);
  if (!f) return;
  f.adminVerified = checked;
  renderMain();
};

window.saveFanNote = function(id, value) {
  const f = findFan(id);
  if (!f) return;
  f.adminNote = value.trim();
  renderMain();
};

window.toggleFanSelect = function(id) {
  if (selectedFanIds.has(id)) selectedFanIds.delete(id); else selectedFanIds.add(id);
  refreshFanList();
};

window.toggleSelectAllFan = function() {
  const ids = fanFilteredList().map(f => f.id);
  const allSelected = ids.length > 0 && ids.every(id => selectedFanIds.has(id));
  if (allSelected) ids.forEach(id => selectedFanIds.delete(id));
  else ids.forEach(id => selectedFanIds.add(id));
  refreshFanList();
};

window.clearFanSelection = function() {
  selectedFanIds.clear();
  refreshFanList();
};

window.bulkSetFanStatus = function(status) {
  selectedFanIds.forEach(id => { const f = MOCK_FANS.find(x => x.id === id); if (f) f.status = status; });
  selectedFanIds.clear();
  renderMain();
};

function fanBulkBarHtml() {
  const count = selectedFanIds.size;
  if (!count) return `<div id="fanBulkBarWrap"></div>`;
  return `
    <div id="fanBulkBarWrap">
      <div class="biz-bulk-bar">
        <span>נבחרו ${count}</span>
        <span class="sp"></span>
        <button class="biz-bulk-btn approve" onclick="bulkSetFanStatus('approved')">✅ אשר נבחרים</button>
        <button class="biz-bulk-btn reject" onclick="bulkSetFanStatus('rejected')">✗ דחה נבחרים</button>
        <button class="biz-bulk-btn cancel" onclick="clearFanSelection()">ביטול</button>
      </div>
    </div>`;
}

window.filterFanRows = function(v) { fanSearch = v; refreshFanList(); };
window.setFanStatusFilter = function(status) { fanStatusFilter = status; renderMain(); };

function fanFilterBarHtml() {
  const hasActiveFilters = fanStatusFilter !== 'all' || fanSearch.trim() || fanSort !== 'newest' || fanDateRangeFilter !== 'all';
  return `
    <div class="filter-toolbar">
      <div class="filter-toolbar-row">
        <select class="filter-select" onchange="setFanStatusFilter(this.value)">
          <option value="all">כל הסטטוסים</option>
          <option value="pending" ${fanStatusFilter==='pending'?'selected':''}>ממתינים</option>
          <option value="approved" ${fanStatusFilter==='approved'?'selected':''}>מאושרים</option>
          <option value="rejected" ${fanStatusFilter==='rejected'?'selected':''}>נדחו</option>
        </select>
        <select class="filter-select" onchange="setFanDateRangeFilter(this.value)">
          <option value="all">כל התאריכים</option>
          <option value="7" ${fanDateRangeFilter==='7'?'selected':''}>נרשמו ב-7 הימים האחרונים</option>
          <option value="30" ${fanDateRangeFilter==='30'?'selected':''}>נרשמו ב-30 הימים האחרונים</option>
          <option value="90" ${fanDateRangeFilter==='90'?'selected':''}>נרשמו ב-90 הימים האחרונים</option>
        </select>
        <select class="filter-select" onchange="setFanSort(this.value)">
          <option value="newest" ${fanSort==='newest'?'selected':''}>מיון: החדשים ביותר</option>
          <option value="oldest" ${fanSort==='oldest'?'selected':''}>מיון: הוותיקים ביותר</option>
          <option value="unverifiedFirst" ${fanSort==='unverifiedFirst'?'selected':''}>מיון: טרם נבדק קודם</option>
          <option value="verifiedFirst" ${fanSort==='verifiedFirst'?'selected':''}>מיון: נבדק קודם</option>
        </select>
        ${hasActiveFilters ? `<button class="filter-clear" onclick="clearFanFilters()">נקה סינון</button>` : ''}
        <input class="filter-search-input" type="search" placeholder="🔍 חיפוש לפי שם, טלפון או אימייל..." value="${fanSearch}" oninput="filterFanRows(this.value)">
        ${fanSelectAllRowHtml()}
      </div>
    </div>`;
}

function fanSelectAllRowHtml() {
  const ids = fanFilteredList().map(f => f.id);
  const allSelected = ids.length > 0 && ids.every(id => selectedFanIds.has(id));
  return `
    <div class="biz-select-all-row" id="fanSelectAllRow">
      <button class="biz-select-all-btn ${allSelected?'active':''}" onclick="toggleSelectAllFan()">${allSelected ? '☑ בטל בחירת הכל' : '☐ בחר הכל'}</button>
      <span class="biz-sel-count">${selectedFanIds.size ? selectedFanIds.size + ' נבחרו' : ''}</span>
    </div>`;
}

function refreshFanList() {
  const list = fanFilteredList();
  if (!list.find(f => f.id === selectedFanDetailId)) {
    selectedFanDetailId = list[0] ? list[0].id : null;
    const dc = document.getElementById('fanDetailCol');
    if (dc) dc.innerHTML = selectedFanDetailId ? fanFullDetailHtml(selectedFanDetailId) : `<div class="placeholder-note">לא נמצאו אוהדים</div>`;
  }
  const el = document.getElementById('fanListCol');
  if (el) el.innerHTML = fanRowsHtml();
  const bar = document.getElementById('fanBulkBarWrap');
  if (bar) bar.outerHTML = fanBulkBarHtml();
  const selRow = document.getElementById('fanSelectAllRow');
  if (selRow) selRow.outerHTML = fanSelectAllRowHtml();
}

function fanListHtml() {
  const list = fanFilteredList();
  if (selectedFanDetailId == null || !list.find(f => f.id === selectedFanDetailId)) {
    selectedFanDetailId = list[0] ? list[0].id : null;
  }
  return `
    ${fanFilterBarHtml()}
    ${fanBulkBarHtml()}
    <div class="task-split ${fanMobileShowDetail?'mobile-show-detail':''}" id="fanSplit">
      <div class="task-list-col" id="fanListCol">${fanRowsHtml()}</div>
      <div class="task-detail-col" id="fanDetailCol">${selectedFanDetailId ? fanFullDetailHtml(selectedFanDetailId) : '<div class="placeholder-note">לא נמצאו אוהדים</div>'}</div>
    </div>`;
}

// ══════════════════════════════════════════════════════════════════
// דשבורד ראשי (Home) — שורת מדדים, מרכז משימות (Master-Detail), בריאות פרופיל
// ══════════════════════════════════════════════════════════════════

function homeStatsHtml() {
  const pendingFans = MOCK_FANS.filter(f => f.status === 'pending').length;
  const pendingBiz = MOCK_BUSINESSES.filter(b => b.status === 'pending').length;
  const pendingChanges = MOCK_BUSINESSES.filter(b => b.pendingChangeDiff || bizHasPendingTagSuggestion(b)).length;
  const approvedBiz = MOCK_BUSINESSES.filter(b => b.status === 'approved').length;
  const openTasks = pendingFans + pendingBiz + pendingChanges;
  const kpi = (num, lbl, alert) => `<div class="kpi-item ${alert?'alert':''}"><span class="kpi-num">${num}</span><span class="kpi-lbl">${lbl}</span></div>`;
  return `
    <div class="kpi-strip">
      ${kpi(openTasks, '🔔 משימות פתוחות', true)}
      <div class="kpi-divider"></div>
      ${kpi(AVG_HANDLING_TIME_MOCK, '⏱ זמן טיפול ממוצע')}
      <div class="kpi-divider"></div>
      ${kpi(`${approvedBiz}/${MOCK_BUSINESSES.length}`, '🏬 עסקים פעילים מתוך רשומים')}
      <div class="kpi-divider"></div>
      <div class="kpi-item"><span class="kpi-num">${TOTAL_FANS_MOCK}</span><span class="kpi-lbl">👥 אוהדים רשומים</span><span class="kpi-delta">+${NEW_FANS_THIS_WEEK_MOCK} השבוע</span></div>
      <div class="kpi-divider"></div>
      ${kpi(ACTIVITY_24H_MOCK, '📈 כניסות ב-24 שעות')}
    </div>`;
}

// ── מרכז המשימות: 3 לשוניות (סוג משימה) + Master-Detail בכל לשונית ──
let homeSubtab = 'fans';
let selectedTaskId = { fans: null, businesses: null, changes: null };
let mobileShowDetail = false;
let bizAiTitleEdits = {};   // עריכות ידניות לכותרת ה-AI המוצעת, לפי מזהה עסק

window.setHomeSubtab = function(key) {
  homeSubtab = key;
  mobileShowDetail = false;
  renderMain();
};

function actionTabsHtml() {
  const pendingFans = MOCK_FANS.filter(f => f.status === 'pending').length;
  const pendingBiz = MOCK_BUSINESSES.filter(b => b.status === 'pending').length;
  const pendingChanges = MOCK_BUSINESSES.filter(b => b.pendingChangeDiff || bizHasPendingTagSuggestion(b)).length;
  const lowHealthCount = MOCK_BUSINESSES.filter(b => b.status === 'approved' && b.healthScore < 70).length;
  const tabBtn = (key, label, count) => `
    <button class="action-tab ${homeSubtab===key?'active':''}" onclick="setHomeSubtab('${key}')">
      ${count ? `<span class="cnt">${count}</span>` : ''}${label}
    </button>`;
  return `
    <div class="action-tabs">
      ${tabBtn('fans', 'אוהדים ממתינים', pendingFans)}
      ${tabBtn('businesses', 'עסקים חדשים', pendingBiz)}
      ${tabBtn('changes', 'שינויים לעסקים', pendingChanges)}
      ${tabBtn('health', '💯 בריאות פרופיל', lowHealthCount)}
    </div>`;
}

// מיון לכל אחת מ-4 לשוניות מרכז המשימות — עד עכשיו היה קבוע בקוד בלי אפשרות למנהל לשנות, ר' PROJECT_CONTEXT.md §47
let taskSort = { fans: 'newest', businesses: 'reviewedAsc', changes: 'newest', health: 'leastHealthy' };
window.setTaskSort = function(key, v) { taskSort[key] = v; renderMain(); };
const TASK_SORT_OPTIONS = {
  fans: [['newest','החדשים ביותר'], ['oldest','הוותיקים ביותר'], ['unverifiedFirst','טרם נבדק קודם'], ['verifiedFirst','נבדק קודם']],
  businesses: [['reviewedAsc','הכי פחות שלבים נסקרו'], ['reviewedDesc','הכי הרבה שלבים נסקרו'], ['newest','החדשים ביותר'], ['oldest','הוותיקים ביותר']],
  health: [['leastHealthy','הכי פחות בריא'], ['mostHealthy','הכי בריא']],
  changes: [['newest','החדשים ביותר'], ['oldest','הוותיקים ביותר']],
};
function taskSortBarHtml(key) {
  const opts = TASK_SORT_OPTIONS[key];
  if (!opts) return '';
  return `
    <div class="filter-toolbar">
      <div class="filter-toolbar-row">
        <select class="filter-select" onchange="setTaskSort('${key}', this.value)">
          ${opts.map(([v, l]) => `<option value="${v}" ${taskSort[key]===v?'selected':''}>מיון: ${l}</option>`).join('')}
        </select>
      </div>
    </div>`;
}

function taskListForSubtab(key) {
  if (key === 'fans') return MOCK_FANS.filter(f => f.status === 'pending')
    .slice().sort((a, b) => {
      if (taskSort.fans === 'oldest') return a.registeredAt - b.registeredAt;
      if (taskSort.fans === 'unverifiedFirst') return (a.adminVerified?1:0) - (b.adminVerified?1:0);
      if (taskSort.fans === 'verifiedFirst') return (b.adminVerified?1:0) - (a.adminVerified?1:0);
      return b.registeredAt - a.registeredAt; // newest — ברירת מחדל
    })
    .map(f => ({ id:f.id, title:f.name, meta:`${fanBadgesHtml(f)}${f.phone} · ממתין ${agoLabel(f.registeredAt)} (נרשם ${fmtDate(f.registeredAt)})` }));
  if (key === 'businesses') return MOCK_BUSINESSES.filter(b => b.status === 'pending')
    .slice().sort((a, b) => {
      if (taskSort.businesses === 'reviewedDesc') return bizReviewedCount(b) - bizReviewedCount(a);
      if (taskSort.businesses === 'newest') return b.registeredAt - a.registeredAt;
      if (taskSort.businesses === 'oldest') return a.registeredAt - b.registeredAt;
      return bizReviewedCount(a) - bizReviewedCount(b); // reviewedAsc — ברירת מחדל, דע איפה נדרש טיפול
    })
    .map(b => ({ id:b.id, title:`${b.icon} ${b.name}`, meta:`${bizReviewBadgeHtml(b)}${b.ownerIsSubscriber ? '<span class="tag-chip">✓ מנוי</span>' : '<span class="tag-chip empty">לא מנוי</span>'} ${bizMetaStr(b)} · ממתין ${agoLabel(b.registeredAt)}` }));
  if (key === 'health') return MOCK_BUSINESSES.filter(b => b.status === 'approved')
    .slice().sort((a,b) => taskSort.health === 'mostHealthy' ? b.healthScore - a.healthScore : a.healthScore - b.healthScore)
    .map(b => ({ id:b.id, title:`${b.icon} ${b.name}`, meta:`${bizMetaStr(b)} · ${b.healthScore}% · ${missingFieldsFor(b).length ? 'חסר: ' + missingFieldsFor(b).join(', ') : '✓ פרופיל מלא'}` }));
  return MOCK_BUSINESSES.filter(b => b.pendingChangeDiff || bizHasPendingTagSuggestion(b))
    .slice().sort((a, b) => {
      const da = a.changeSubmittedAt || a.registeredAt, db = b.changeSubmittedAt || b.registeredAt;
      return taskSort.changes === 'oldest' ? da - db : db - da;
    })
    .map(b => {
      // עסק יכול להיות כאן בגלל דיף רגיל (טלפון/שעות/הטבה), הצעת-תגית, או שניהם ביחד — המטא משקף מה בדיוק ממתין
      const reasons = [];
      if (b.pendingChangeDiff) reasons.push('בקשת עדכון פרטים');
      if (bizHasPendingTagSuggestion(b)) reasons.push('הצעת תגית');
      return { id:b.id, title:`${b.icon} ${b.name}`, meta:`${bizMetaStr(b)} · ${reasons.join(' + ')} · ממתין ${agoLabel(b.changeSubmittedAt || b.registeredAt)}` };
    });
}

// שינוי משימה נבחרת — מעדכן *רק* את שתי הקוביות (רשימה+פרטים), לא את כל הדף
window.selectTask = function(key, id) {
  selectedTaskId[key] = id;
  mobileShowDetail = true;
  const listCol = document.getElementById('taskListCol');
  const detailCol = document.getElementById('taskDetailCol');
  const splitEl = document.getElementById('taskSplit');
  if (listCol) listCol.innerHTML = taskListForSubtab(key).map(t => taskRowHtml(key, t)).join('');
  if (detailCol) detailCol.innerHTML = taskDetailHtml(key, id);
  if (splitEl) splitEl.classList.add('mobile-show-detail');
};

window.backToTaskList = function() {
  mobileShowDetail = false;
  const splitEl = document.getElementById('taskSplit');
  if (splitEl) splitEl.classList.remove('mobile-show-detail');
};

function taskRowHtml(key, t) {
  return `
    <div class="task-row ${t.id===selectedTaskId[key]?'active':''}" onclick="selectTask('${key}','${t.id}')">
      <div class="task-row-name">${t.title}</div>
      <div class="task-row-meta">${t.meta}</div>
    </div>`;
}

function taskSplitHtml(key) {
  const list = taskListForSubtab(key);
  if (!list.length) return `<div class="placeholder-note">אין כרגע פריטים בלשונית הזו 🎉</div>`;
  if (selectedTaskId[key] == null || !list.find(t => t.id === selectedTaskId[key])) selectedTaskId[key] = list[0].id;
  return `
    <div class="task-split ${mobileShowDetail?'mobile-show-detail':''}" id="taskSplit">
      <div class="task-list-col" id="taskListCol">${list.map(t => taskRowHtml(key, t)).join('')}</div>
      <div class="task-detail-col" id="taskDetailCol">${taskDetailHtml(key, selectedTaskId[key])}</div>
    </div>`;
}

// כל 4 הלשוניות פותחות ישר את הכרטיס המלא — אין יותר בשום מקום מסך-תמצית עם כפתור "פתח כרטיס מלא"
// נפרד (המשתמש: "שלא יהיה פתח בכרטיס מלא, שהכרטיס יהיה ישר פתוח... בכל מקום"). "שינויים לעסקים" הייתה
// האחרונה שעדיין השתמשה בכזה מסך (changeDetailHtml, הוסר) — הדיף עצמו כבר מוצג בתוך השלב הנכון
// בכרטיס המלא (ר' diffHtmlForSection), וכפתורי "אשר/דחה שינויים" כבר מגיעים אוטומטית מ-statusActions.
function taskDetailHtml(key, id) {
  if (key === 'fans') return fanFullDetailHtml(id, { backFn: 'backToTaskList' });
  return bizFullDetailHtml(id, { backFn: 'backToTaskList' });
}

// ── ניהול מדיה — לוגו + תמונה מייצגת (זו שמוצגת על כרטיס העסק באינדקס, מחוץ לדף העסק) ──
// "5 תמונות מוצעות" קשורות במפורש לבחירת התמונה המייצגת — לא AI-generated (הוחלט לא לבנות את זה, ר' §39),
// אלא בורר מתוך אפשרויות קיימות. ניתן לבחור בלחיצה, או לגרור אל תיבת התמונה המייצגת (גם כדי להחליף בחירה קיימת).
function mediaViewHtml(b) {
  return `
    <div class="media-slot-row">
      <div class="media-slot logo ${b.hasLogo?'filled':''}"><span class="media-slot-ic">${b.hasLogo?'🏷️':'—'}</span><span class="media-slot-label">לוגו</span></div>
      <div class="media-slot cover ${b.hasCoverPhoto?'filled':''}"><span class="media-slot-ic">${b.hasCoverPhoto?b.icon:'—'}</span><span class="media-slot-label">תמונה מייצגת</span></div>
    </div>
    <div class="approve-longtext" style="margin-top:6px">${b.galleryCount} תמונות בגלריה · ${b.videoCount} סרטונים</div>`;

function coverPhotoManagerHtml(b) {
  const chosenIdx = b.coverPhotoChoice;
  const chosenLabel = chosenIdx != null ? PHOTO_OPTIONS_MOCK[chosenIdx].label : null;
  return `
    <div class="media-manager" id="media_${b.id}">
      <div class="media-slot-row">
        <div class="media-slot logo ${b.hasLogo?'filled':''}" onclick="toggleLogoSet('${b.id}')" title="לחץ לסימון לוגו קיים/חסר">
          <span class="media-slot-ic">${b.hasLogo?'🏷️':'➕'}</span><span class="media-slot-label">לוגו</span>
        </div>
        <div class="media-slot cover ${b.hasCoverPhoto?'filled':''}"
             ondragover="event.preventDefault(); this.classList.add('drag-over')"
             ondragleave="this.classList.remove('drag-over')"
             ondrop="dropOnCover(event, '${b.id}')">
          <span class="media-slot-ic">${b.hasCoverPhoto ? b.icon : '🖼️'}</span>
          <span class="media-slot-label">${b.hasCoverPhoto ? (chosenLabel || 'תמונה מייצגת') : 'גררו לכאן תמונה'}</span>
        </div>
      </div>
      <div class="media-slot-note">התמונה המייצגת היא זו שמוצגת על כרטיס העסק באינדקס. לוגו הוא badge קטן נוסף.</div>
      <div class="approve-field-label" style="margin-top:10px">בחרו או גררו לתמונה המייצגת — עד ${PHOTO_OPTIONS_MOCK.length} הצעות</div>
      <div class="photo-pick-grid">
        ${PHOTO_OPTIONS_MOCK.map((p, idx) => `
          <div class="photo-pick-item ${chosenIdx===idx?'selected':''}" draggable="true"
               ondragstart="event.dataTransfer.setData('text/plain', '${idx}')"
               onclick="setCoverPhoto('${b.id}', ${idx})">
            ${chosenIdx===idx ? '<span class="photo-pick-check">✓</span>' : ''}
            <span class="ic">${b.icon}</span><span class="lb">${p.label}</span>
          </div>`).join('')}
      </div>
    </div>`;
}
window.dropOnCover = function(ev, id) {
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag-over');
  const idx = parseInt(ev.dataTransfer.getData('text/plain'), 10);
  if (!isNaN(idx)) setCoverPhoto(id, idx);
};
window.setCoverPhoto = function(id, idx) {
  const b = findBiz(id);
  if (!b) return;
  b.coverPhotoChoice = idx;
  b.hasCoverPhoto = true;
  b.hasPhoto = b.hasLogo || b.hasCoverPhoto;
  b.healthScore = computeHealthScore(b);
  const el = document.getElementById('media_' + id);
  if (el) el.outerHTML = coverPhotoManagerHtml(b);
};
window.toggleLogoSet = function(id) {
  const b = findBiz(id);
  if (!b) return;
  b.hasLogo = !b.hasLogo;
  b.hasPhoto = b.hasLogo || b.hasCoverPhoto;
  b.healthScore = computeHealthScore(b);
  const el = document.getElementById('media_' + id);
  if (el) el.outerHTML = coverPhotoManagerHtml(b);
};

function aiTitleFieldHtml(b) {

  const len = (val || '').length;

    <div class="approve-field">

const SOON_TITLE = 'בקרוב — טרם נבנה בדמו';

// ניווט-החוצה ל"כל האוהדים" — משמש רק ממקומות מחוץ למרכז המשימות (כרגע לא בשימוש פעיל, נשמר לעתיד)
window.openFanFullCard = function(id) {
  fanStatusFilter = 'all'; fanSearch = ''; fanSort = 'newest';
  selectedFanDetailId = id;
  selectTab(ALL_FANS_KEY);
};
window.approveFan = function(id) { const f = MOCK_FANS.find(x => x.id === id); if (f) f.status = 'approved'; renderMain(); };
window.rejectFan  = function(id) { const f = MOCK_FANS.find(x => x.id === id); if (f) f.status = 'rejected'; renderMain(); };

window.approveBiz = function(id) {
  const b = findBiz(id);
  if (!b) return;
  const reviewed = bizReviewedCount(b);
  // תזכורת רכה, לא חסימה — המנהל עדיין יכול לאשר גם בלי לסמן את כל 5 השלבים כנסקרו
  if (reviewed < 5 && !confirm(`רק ${reviewed}/5 שלבים סומנו כ"נסקר". לאשר בכל זאת?`)) return;
  b.status = 'approved';
  // אישור עסק מאשר ישירות גם את האוהד המקושר אם הוא בעל העסק עצמו (הרשמת עסק = הרשמת אוהד באותה פעולה, ר' business.html)
  const ownerFan = MOCK_FANS.find(f => f.isBusinessOwner && f.linkedBusinessId === id);
  if (ownerFan && ownerFan.status !== 'approved') ownerFan.status = 'approved';
  renderMain();
};
window.rejectBiz  = function(id) { const b = findBiz(id); if (b) b.status = 'rejected'; renderMain(); };

// ── אישור/דחייה ישירים מהכרטיס לתגית שנייה ולקטגוריה שנייה ("מופיע גם תחת") — בלי לפתוח טופס עריכה מלא ──
window.approveTagSecondSuggestion = function(id) {

window.rejectTagSecondSuggestion = function(id) {

window.approveAlsoCatSuggestion = function(id) {

window.rejectAlsoCatSuggestion = function(id) {
