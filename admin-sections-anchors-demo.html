<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דמו — מרכז ניהול (דשבורד ראשי)</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  /* Clean & Modern SaaS (Stripe/Linear/Vercel) — ניטרלי, בהיר, בלי צבעי מותג */
  --bg: #F9FAFB;
  --nav-bg: #F3F4F6;
  --card-bg: #FFFFFF;
  --card-bg2: #FFFFFF;
  --accent: #111827;
  --accent-dark: #000000;
  --text: #111827;
  --text-sm: #6B7280;
  --text-muted: #9CA3AF;
  --green: #16A34A;
  --orange: #B45309;
  --red: #DC2626;
  --border: #E5E7EB;
  --border-md: #D1D5DB;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Heebo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 60px;
}

/* ── layout: sidebar + main (כמו פאנל ניהול) ── */
.dash-layout { max-width: 2200px; margin: 0 auto; padding: 20px 32px 0; display: flex; align-items: flex-start; gap: 18px; }
.sidebar {
  width: 208px; flex-shrink: 0; position: sticky; top: 20px; transition: width .15s;
  background: var(--card-bg2); border: 1px solid var(--border-md); border-radius: 14px; padding: 14px 10px;
}
.sidebar.collapsed { width: 52px; padding: 14px 6px; }
.sidebar-collapse-btn {
  display: flex; align-items: center; justify-content: center; width: 100%; height: 26px;
  border-radius: 8px; cursor: pointer; color: var(--text-muted); font-size: 13px; margin-bottom: 10px;
}
.sidebar-collapse-btn:hover { background: rgba(17,24,39,.06); color: var(--text); }
.sidebar.collapsed .sidebar-standalone { justify-content: center; padding: 11px 0; }
.sidebar.collapsed .sidebar-standalone span:not(.ic) { display: none; }
/* פריט עצמאי בראש הסיידבר (כל העסקים) — לא נעלם, לא תלוי בקבוצות שמתחתיו */
.sidebar-standalone {
  display: flex; align-items: center; gap: 9px; padding: 11px 11px; border-radius: 10px;
  cursor: pointer; margin-bottom: 12px; border: 1.5px solid var(--border-md); transition: all .12s;
  font-size: 12.5px; font-weight: 800; color: var(--text-sm);
}
.sidebar-standalone:hover { border-color: var(--accent); color: var(--text); }
.sidebar-standalone.active { border-color: var(--accent); background: rgba(17,24,39,.1); color: var(--accent); }
.sidebar-standalone .ic { font-size: 16px; }
.sidebar-divider { height: 1px; background: var(--border); margin: 2px 0 12px; }
.sidebar-section-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; padding: 0 4px; margin-bottom: 6px; }
/* קבוצות (סקשנים/קטגוריות) — הכותרת תמיד גלויה, נפתחת/נסגרת במקום, לא מוחקת כלום אחר */
.sidebar-group-header {
  display: flex; align-items: center; justify-content: space-between; padding: 9px 9px; border-radius: 9px;
  font-size: 11.5px; font-weight: 800; color: var(--text-sm); cursor: pointer; margin-bottom: 3px; transition: all .12s;
}
.sidebar-group-header:hover { background: rgba(17,24,39,.04); color: var(--text); }
.sidebar-group-header .chev { font-size: 9px; color: var(--text-muted); transition: transform .15s; }
.sidebar-group-header.open .chev { transform: rotate(180deg); }
.sidebar-group-body { margin: 0 0 10px 0; }
.sidebar-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 9px 8px 9px; border-radius: 9px;
  font-size: 12.5px; font-weight: 700; color: var(--text-sm); cursor: pointer; margin-bottom: 2px; transition: all .12s;
}
.sidebar-item:hover { background: rgba(17,24,39,.05); color: var(--text); }
.sidebar-item.active { background: rgba(17,24,39,.13); color: var(--accent); }
.main-content { flex: 1; min-width: 0; }
@media (max-width: 720px) {
  .dash-layout { flex-direction: column; }
  .sidebar { width: 100%; position: static; }
}

/* ── הסבר כללי + מילון מונחים — מקופל כברירת מחדל ── */
.info-accordion { background: var(--card-bg2); border: 1px solid var(--border-md); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
.info-accordion-header {
  display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
  cursor: pointer; font-size: 12.5px; font-weight: 800; color: var(--text-sm);
}
.info-accordion-header:hover { color: var(--text); }
.info-accordion-header .chev { font-size: 11px; color: var(--text-muted); transition: transform .15s; }
.info-accordion.open .chev { transform: rotate(180deg); }
.info-accordion-body { display: none; padding: 0 16px 16px; }
.info-accordion.open .info-accordion-body { display: block; }
.info-explainer { font-size: 12.5px; line-height: 1.9; color: var(--text-sm); margin-bottom: 14px; }
.info-explainer b { color: var(--text); }
.info-explainer .yl { color: var(--accent); }
.glossary-title { font-size: 11.5px; font-weight: 800; color: var(--text-muted); margin-bottom: 10px; }
.glossary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
.glossary-item { font-size: 11.5px; line-height: 1.6; }
.glossary-item .term { color: var(--accent); font-weight: 800; }
.glossary-item .def { color: var(--text-sm); }
@media (max-width: 480px) { .glossary-grid { grid-template-columns: 1fr; } }

.placeholder-note {
  background: var(--card-bg2); border: 1px dashed var(--border-md); border-radius: 12px;
  padding: 40px 16px; text-align: center; color: var(--text-muted); font-size: 13px;
}

/* ── כל העסקים: כרטיסי סטטיסטיקה + פילטר + בחירה מרובה + רשימת שורות קומפקטית ── */
/* 3 כרטיסי מידע בלבד — בדיוק כמו ב-admin-businesses.html היום (עסקים נרשמו/ממתינים לאישור/עסקים פעילים).
   אלה תצוגת מידע, לא כפתורי סינון — הסינון בפועל הוא שורת filter-btn נפרדת למטה, בדיוק כמו במקור. */
.biz-stats-row { display: flex; gap: 10px; margin-bottom: 18px; }
.biz-stat-card {
  flex: 1; background: var(--card-bg2); border: 1px solid var(--border-md); border-radius: 12px;
  padding: 14px 16px; text-align: center;
}
.biz-stat-card .num { font-size: 26px; font-weight: 900; color: var(--accent); }
.biz-stat-card.pending .num { color: var(--orange); }
.biz-stat-card.approved .num { color: var(--green); }
.biz-stat-card .lbl { font-size: 11.5px; color: var(--text-sm); margin-top: 3px; font-weight: 700; }

/* שורת סינון — 5 כפתורים + חיפוש, בדיוק כמו filter-bar במקור */
.biz-filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.biz-filter-btn {
  padding: 7px 15px; border-radius: 20px; border: 1.5px solid var(--border-md); background: var(--card-bg2);
  font-family: 'Heebo', sans-serif; font-size: 12.5px; font-weight: 700; color: var(--text-sm); cursor: pointer; transition: all .15s; white-space: nowrap;
}
.biz-filter-btn.active { background: rgba(17,24,39,.15); border-color: var(--accent); color: var(--accent); }
.biz-filter-btn.changes { border-color: rgba(217,119,6,.4); color: var(--orange); background: rgba(217,119,6,.1); }
.biz-filter-btn.changes.active { background: #d97706; border-color: #d97706; color: #1a1a1a; }
.biz-changes-badge {
  display: inline-flex; align-items: center; justify-content: center; background: #d97706; color: #fff;
  font-size: 10.5px; font-weight: 800; min-width: 17px; height: 17px; border-radius: 9px; padding: 0 4px; margin-right: 3px;
}
.biz-filter-btn.changes.active .biz-changes-badge { background: #1a1a1a; color: #fbbf24; }
.biz-search {
  flex: 1; min-width: 180px; padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--border-md);
  background: var(--nav-bg); color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px;
}
.biz-search:focus { border-color: var(--accent); outline: none; }

/* ── סרגל סינון חדש (כל העסקים / כל האוהדים) — חיפוש+דרופדאונים+פילים, נקי ומכוון-משימה ── */
.filter-toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.filter-toolbar-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filter-search-input {
  flex: 1; min-width: 220px; max-width: 320px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-md);
  background: var(--card-bg); color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px;
}
.filter-search-input:focus { border-color: var(--accent); outline: none; }
.filter-select {
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-md); background: var(--card-bg);
  color: var(--text); font-family: 'Heebo', sans-serif; font-size: 12.5px; cursor: pointer;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-pill {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border-md); background: var(--card-bg);
  font-family: 'Heebo', sans-serif; font-size: 12.5px; font-weight: 700; color: var(--text-sm); cursor: pointer; transition: all .12s; white-space: nowrap;
}
.filter-pill:hover { border-color: var(--accent); color: var(--text); }
.filter-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.filter-pill.active .biz-changes-badge { background: #fff; color: var(--accent); }
.filter-clear {
  font-size: 12px; color: var(--text-sm); cursor: pointer; text-decoration: underline; background: none; border: none;
  font-family: 'Heebo', sans-serif; padding: 0;
}
.filter-clear:hover { color: var(--accent); }

.biz-select-all-row { display: flex; align-items: center; gap: 10px; padding-top: 6px; }
.biz-select-all-btn {
  flex-shrink: 0; border: 1.5px solid var(--border-md); background: var(--card-bg2); color: var(--text-sm);
  font-family: 'Heebo', sans-serif; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 20px; cursor: pointer; white-space: nowrap;
}
.biz-select-all-btn.active { background: rgba(17,24,39,.15); border-color: var(--accent); color: var(--accent); }
.biz-sel-count { font-size: 11.5px; color: var(--text-muted); }

.biz-bulk-bar {
  display: flex; align-items: center; gap: 10px; background: rgba(17,24,39,.08); border: 1px solid rgba(17,24,39,.3);
  border-radius: 10px; padding: 9px 13px; margin-bottom: 12px; font-size: 12.5px; font-weight: 700; color: var(--accent);
}
.biz-bulk-bar .sp { flex: 1; }
.biz-bulk-btn {
  border: none; font-family: 'Heebo', sans-serif; font-size: 11.5px; font-weight: 800; padding: 6px 12px;
  border-radius: 8px; cursor: pointer;
}
.biz-bulk-btn.approve { background: var(--green); color: #0f1524; }
.biz-bulk-btn.reject { background: var(--red); color: #fff; }
.biz-bulk-btn.cancel { background: transparent; border: 1.5px solid var(--border-md); color: var(--text-sm); }

/* שורת עסק — בדיוק תואמת ל-biz-card של admin-businesses.html: מסגרת ימין צבעונית לפי סטטוס,
   אווטאר גנרי, שם + תג "✏️ שינויים", שורת meta (סוג+עיר), צ'יפ סטטוס, שברון פתיחה */
.biz-list { border: 1px solid var(--border-md); border-radius: 10px; overflow: hidden; }
.biz-row {
  background: var(--card-bg); border-bottom: 1px solid var(--border); border-right: 3px solid transparent;
  padding: 9px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background .12s;
}
.biz-row:last-child { border-bottom: none; }
.biz-row:hover { background: rgba(17,24,39,.03); }
.biz-row.pending  { border-right-color: var(--orange); }
.biz-row.approved { border-right-color: var(--green); }
.biz-row.rejected { border-right-color: var(--border-md); opacity: .6; }
.biz-row.selected { background: rgba(17,24,39,.06); }
.biz-row-checkbox {
  flex-shrink: 0; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border-md);
  cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--accent);
}
.biz-row.selected .biz-row-checkbox { border-color: var(--accent); background: rgba(17,24,39,.15); }
.biz-row-icon {
  flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px; background: var(--card-bg2);
  display: flex; align-items: center; justify-content: center; font-size: 15px;
}
.biz-row-main { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.biz-row-name { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; }
.biz-row-meta { font-size: 11.5px; color: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.biz-change-badge {
  font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 9px; white-space: nowrap; flex-shrink: 0;
  color: var(--accent); background: rgba(17,24,39,.13); border: 1px solid rgba(17,24,39,.3);
}
.biz-change-badge.note { color: #0369a1; background: rgba(3,105,161,.1); border-color: rgba(3,105,161,.35); }
.biz-status-badge { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
.biz-status-badge.approved { color: var(--green); background: rgba(22,163,74,.12); }
.biz-status-badge.pending  { color: var(--orange); background: rgba(217,119,6,.12); }
.biz-status-badge.rejected { color: var(--text-sm); background: rgba(17,24,39,.08); }
.biz-row-chevron { flex-shrink: 0; color: var(--text-muted); font-size: 15px; }

/* ── דשבורד ראשי (Home) — סרגל KPI קומפקטי, מרכז משימות, בריאות פרופיל ── */
.kpi-strip {
  display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 18px; margin-bottom: 20px;
}
.kpi-item { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.kpi-item .kpi-num { font-size: 17px; font-weight: 800; color: var(--text); }
.kpi-item.alert .kpi-num { color: var(--orange); }
.kpi-item .kpi-lbl { font-size: 12px; color: var(--text-sm); font-weight: 600; }
.kpi-item .kpi-delta { font-size: 11.5px; color: var(--green); font-weight: 700; }
.kpi-divider { width: 1px; height: 20px; background: var(--border-md); }

.section-h2 { font-size: 13.5px; font-weight: 800; color: var(--text-sm); margin: 22px 0 10px; display: flex; align-items: center; gap: 6px; }
.section-h2-row { display: flex; align-items: center; justify-content: flex-start; gap: 10px 16px; flex-wrap: wrap; margin: 22px 0 10px; }
.section-h2-row .section-h2 { margin: 0; }
.section-h2-row .filter-toolbar { margin-bottom: 0; }

.action-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.action-tab {
  padding: 9px 16px; border-radius: 20px; border: 1.5px solid var(--border-md); background: var(--card-bg2);
  font-family: 'Heebo', sans-serif; font-size: 12.5px; font-weight: 800; color: var(--text-sm); cursor: pointer; transition: all .15s;
}
.action-tab.active { background: rgba(17,24,39,.15); border-color: var(--accent); color: var(--accent); }
.action-tab .cnt {
  display: inline-flex; align-items: center; justify-content: center; background: var(--orange); color: #fff;
  font-size: 10px; font-weight: 800; min-width: 17px; height: 17px; border-radius: 9px; padding: 0 4px; margin-left: 5px;
}
.action-tab.active .cnt { background: var(--accent); color: #fff; }

.fan-row {
  background: var(--card-bg); border: 1px solid var(--border-md); border-right: 3px solid var(--orange); border-radius: 10px;
  padding: 12px 14px; display: flex; align-items: center; gap: 14px; margin-bottom: 8px; flex-wrap: wrap;
}
.fan-row-main { flex: 1; min-width: 180px; }
.fan-row-name { font-size: 13.5px; font-weight: 800; }
.fan-row-meta { font-size: 11.5px; color: var(--text-sm); margin-top: 2px; }
.fan-row-actions { display: flex; gap: 8px; flex-shrink: 0; }
.act-btn {
  border: 1.5px solid var(--border-md); background: transparent; color: var(--text-sm);
  font-family: 'Heebo', sans-serif; font-size: 11.5px; font-weight: 800; padding: 7px 13px;
  border-radius: 8px; cursor: pointer; white-space: nowrap; transition: all .15s;
}
.act-btn:hover { border-color: var(--accent); color: var(--accent); }
.act-btn.approve { background: var(--green); color: #0f1524; border-color: var(--green); }
.act-btn.approve:hover { opacity: .88; color: #0f1524; }
.act-btn.reject { background: transparent; border-color: rgba(255,92,92,.4); color: var(--red); }
.act-btn.reject:hover { border-color: var(--red); }
.act-btn.soon { opacity: .45; cursor: default; }
.act-btn.soon:hover { border-color: var(--border-md); color: var(--text-sm); }
.act-btn.tiny { padding: 4px 10px; font-size: 11px; }
.suggestion-actions { display: flex; gap: 6px; margin-top: 8px; }

.approve-card {
  background: var(--card-bg); border: 1px solid var(--border-md); border-right: 3px solid var(--orange); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 12px;
}
/* כותרת הכרטיס — שם+מטא זה לצד זה בצמידות, לא מתוחים לרוחב מלא (בכרטיס רחב זה השאיר שטח ריק גדול באמצע) */
.approve-card-head { margin-bottom: 8px; }
.approve-card-title { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.approve-card-meta { font-size: 11px; color: var(--text-sm); margin-top: 2px; }
.approve-field { margin: 12px 0; }
.approve-field-label { font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 5px; }
.approve-longtext {
  background: var(--nav-bg); border: 1px solid var(--border-md); border-radius: 8px; padding: 9px 11px;
  font-size: 12.5px; color: var(--text-sm); line-height: 1.6;
}
.ai-title-box { display: flex; align-items: center; gap: 8px; }
.ai-title-box input {
  flex: 1; padding: 8px 11px; border-radius: 8px; border: 1.5px solid rgba(17,24,39,.35);
  background: var(--nav-bg); color: var(--accent); font-family: 'Heebo', sans-serif; font-size: 13px; font-weight: 700;
}
.ai-title-tag { font-size: 10px; font-weight: 800; color: var(--accent); background: rgba(17,24,39,.12); padding: 2px 8px; border-radius: 8px; flex-shrink: 0; }
.char-count { font-size: 10.5px; color: var(--text-muted); margin-top: 3px; }
.char-count.over { color: var(--red); }
.ai-title-options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ai-title-option {
  padding: 6px 10px; border-radius: 8px; border: 1.5px solid rgba(17,24,39,.25); background: var(--nav-bg);
  color: var(--accent); font-family: 'Heebo', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer;
}
.ai-title-option:hover { border-color: var(--accent); }

.photo-pick-grid { display: flex; gap: 8px; flex-wrap: wrap; }
.photo-pick-item {
  width: 74px; height: 74px; border-radius: 10px; border: 1.5px solid var(--border-md); background: var(--nav-bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; position: relative;
}
.photo-pick-item .ic { font-size: 24px; }
.photo-pick-item .lb { font-size: 9.5px; color: var(--text-muted); }
.photo-pick-item.selected { border-color: var(--accent); background: rgba(17,24,39,.1); }
.photo-pick-item.selected .lb { color: var(--accent); font-weight: 700; }
.photo-pick-check { position: absolute; top: 3px; left: 3px; font-size: 11px; color: var(--accent); }

.media-manager { margin-top: 4px; }
.media-slot-row { display: flex; gap: 10px; }
.media-slot {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  height: 74px; border-radius: 10px; border: 1.5px dashed var(--border-md); background: var(--nav-bg); transition: all .12s;
}
.media-slot.logo, .media-slot.cover { cursor: pointer; }
.media-slot.filled { border-style: solid; border-color: var(--accent); background: rgba(17,24,39,.04); }
.media-slot.drag-over { border-color: var(--green); background: rgba(22,163,74,.08); }
.media-slot-ic { font-size: 22px; }
.media-slot-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-align: center; padding: 0 4px; }
.media-slot-note { font-size: 10.5px; color: var(--text-muted); margin-top: 6px; }

.approve-card-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.approve-card-actions.top { margin: 0 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }

/* ── טופס עריכה מלא (בתוך כרטיס-עסק, כל העסקים) ── */
.edit-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px 14px; margin-bottom: 14px; }
.edit-field { display: flex; flex-direction: column; gap: 5px; font-size: 11px; font-weight: 800; color: var(--text-muted); min-width: 0; }
.edit-subrow { display: flex; gap: 8px; min-width: 0; }
.edit-subrow input { min-width: 0; flex: 1; }
.edit-field.full { grid-column: 1 / -1; }
.edit-field input[type="text"], .edit-field select, .edit-field textarea {
  width: 100%; box-sizing: border-box; min-width: 0;
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-md); background: var(--nav-bg); color: var(--text);
  font-family: 'Heebo', sans-serif; font-size: 13px; font-weight: 400;
}
.edit-field textarea { resize: vertical; }
.edit-check-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; font-weight: 400; color: var(--text); }
.edit-check-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
@media (max-width: 600px) { .edit-grid { grid-template-columns: 1fr; } }

.tag-chip-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.tag-chip {
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
  background: rgba(17,24,39,.06); color: var(--text); border: 1px solid var(--border-md);
}
.tag-chip.empty { color: var(--text-muted); font-weight: 400; }
.tag-chip.selectable { cursor: pointer; user-select: none; transition: background .15s, border-color .15s, color .15s; }
.tag-chip.selectable:hover { border-color: var(--accent); }
.tag-chip.selectable.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
.tag-suggestion-alert {
  display: block; width: 100%; margin-top: 6px;
  background: rgba(217,119,6,.1); border: 1.5px solid rgba(217,119,6,.35);
  border-radius: 10px; padding: 7px 11px;
  color: var(--orange); font-size: 11.5px; font-weight: 700;
}
.note-alert { margin-top: 10px; background: rgba(3,105,161,.08); border-color: rgba(3,105,161,.35); color: #0369a1; }
.note-handled-box {
  margin-top: 10px; background: var(--card-bg2); border: 1.5px solid var(--border-md); border-radius: 10px; padding: 7px 11px;
  color: var(--text-sm); font-size: 11.5px;
}
.note-handled-box summary { cursor: pointer; font-weight: 700; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
.toggle-row > span { font-size: 12px; font-weight: 800; color: var(--text-muted); }
.toggle {
  width: 36px; height: 21px; background: rgba(17,24,39,.16); border-radius: 12px;
  position: relative; cursor: pointer; border: none; flex-shrink: 0; transition: background .2s; padding: 0;
}
.toggle.on { background: var(--green); }
.toggle::after {
  content: ''; position: absolute; width: 15px; height: 15px; background: #fff; border-radius: 50%;
  top: 3px; right: 3px; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.toggle.on::after { transform: translateX(-15px); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
  border: none; border-radius: 6px; background: rgba(17,24,39,.07); cursor: pointer; font-size: 12px;
  vertical-align: middle; margin: 0 2px;
}
.icon-btn:hover { background: rgba(17,24,39,.14); }

.owner-verify-details { margin-top: 8px; }
.owner-verify-details summary {
  cursor: pointer; font-size: 11.5px; font-weight: 700; color: var(--text-sm);
  padding: 6px 0; list-style: none;
}
.owner-verify-details summary::-webkit-details-marker { display: none; }
.owner-verify-details summary::before { content: '▸ '; }
.owner-verify-details[open] summary::before { content: '▾ '; }
.owner-verify-details:hover summary { color: var(--text); }

.edit-section-title {
  font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .03em;
  margin: 18px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.edit-section-title:first-of-type { margin-top: 4px; }
/* שלבים עם מעקב-סקירה (1-5) — כל השורה צבועה, לא רק הטקסט: כתום = עדיין לא נסקר, ירוק = נסקר.
   לא אדום במכוון — "טרם נסקר" זה מצב ניטרלי/ממתין, לא שגיאה. */
.edit-section-title.review-tracked {
  padding: 7px 10px; border-radius: 8px; border-bottom: none;
  background: rgba(217,119,6,.1); color: var(--orange);
}
.edit-section-title.review-tracked.reviewed { background: rgba(22,163,74,.13); color: var(--green); }
.sec-edit-btn {
  text-transform: none; letter-spacing: normal; font-size: 11px; font-weight: 700; color: var(--accent);
  background: rgba(17,24,39,.07); border: none; border-radius: 6px; padding: 3px 9px; cursor: pointer; flex-shrink: 0;
}
.sec-edit-btn:hover { background: rgba(17,24,39,.14); }
/* עריכה per-שלב על גבי הכרטיס (כמו admin-businesses.html האמיתי) — לא עוד "ערוך פרטי עסק" גורף לכל הכרטיס */
.sec-edit-form { display: none; margin-top: -6px; }
.sec-edit-form.open { display: block; }
.sec-edit-actions { display: flex; gap: 8px; margin-top: 12px; }
.sec-title-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.sec-reviewed-toggle { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--green); text-transform: none; cursor: pointer; white-space: nowrap; }
.sec-reviewed-toggle input { accent-color: var(--green); }
.review-badge { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 20px; margin-right: 6px; white-space: nowrap; }
.review-badge.none { background: rgba(217,119,6,.13); color: var(--orange); }
.review-badge.partial { background: rgba(217,119,6,.13); color: var(--orange); }
.review-badge.ready { background: rgba(22,163,74,.14); color: var(--green); }
/* אלמנטים אופציונליים בטופס העריכה — מקופלים כברירת מחדל (אלא אם כבר קיים ערך), נפתחים בלחיצה,
   בדיוק כמו "+ הוסף עוד הטבה" בטפסי ההרשמה האמיתיים (business.html/business-dashboard.html) */
.edit-optional {
  border: 1px dashed var(--border-md); border-radius: 8px; padding: 10px 12px; margin: 10px 0; background: var(--card-bg);
}
.edit-optional summary {
  cursor: pointer; font-size: 12px; font-weight: 700; color: var(--text-sm); list-style: none;
}
.edit-optional summary::-webkit-details-marker { display: none; }
.edit-optional summary::before { content: '+ '; color: var(--accent); font-weight: 900; }
.edit-optional[open] summary::before { content: '− '; }
.edit-optional[open] summary { margin-bottom: 10px; }
.edit-optional select, .edit-optional textarea, .edit-optional input[type="text"] {
  width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-md);
  background: var(--nav-bg); color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px;
}
.edit-optional .edit-grid { margin-bottom: 0; }

/* כותרת שלב עם שינוי ממתין — תג כחול נפרד מציר reviewed (ירוק/כתום), כדי לא לערבב בין "האם נסקר" ל"יש בקשת שינוי" */
.title-change-badge {
  display: inline-block; font-size: 10px; font-weight: 800; color: #fff; background: #2563eb;
  padding: 2px 8px; border-radius: 9px; margin-inline-start: 8px; text-transform: none; letter-spacing: normal;
}
/* שדה עריכה ספציפי עם שינוי ממתין — מסגרת+רקע כתום עדין + רמז "היה: X" מתחתיו */
.edit-field.field-changed input, .edit-field.field-changed textarea, .edit-field.field-changed select {
  border-color: var(--orange); background: rgba(217,119,6,.06);
}
.field-change-hint { font-size: 10.5px; color: var(--orange); font-weight: 700; margin-top: 4px; }
/* הבהוב חד-פעמי כשקופצים אל שלב מתוך תקציר-השינויים למעלה — תגובה ויזואלית מיידית ללחיצה */
@keyframes jumpFlash { 0% { box-shadow: 0 0 0 3px rgba(37,99,235,.55); } 100% { box-shadow: 0 0 0 0 rgba(37,99,235,0); } }
.jump-flash { animation: jumpFlash 1.2s ease-out; border-radius: 10px; }

/* ── תקציר-שינויים בראש הכרטיס — כל מה שהעסק מבקש (דיף רגיל + הצעות תגית/קטגוריה), שורה לחיצה שקופצת לשלב ── */
.changes-summary {
  background: rgba(217,119,6,.06); border: 1.5px solid rgba(217,119,6,.3); border-radius: 10px;
  padding: 10px 12px; margin: 0 0 14px;
}
.changes-summary-title { font-size: 11.5px; font-weight: 800; color: var(--orange); margin-bottom: 8px; }
.changes-summary-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--card-bg); border: 1px solid var(--border-md); border-radius: 8px;
  padding: 8px 11px; margin-bottom: 6px; cursor: pointer; transition: border-color .12s;
}
.changes-summary-row:last-child { margin-bottom: 0; }
.changes-summary-row:hover { border-color: var(--accent); }
.changes-summary-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.changes-summary-label { font-size: 11.5px; font-weight: 800; color: var(--text); }
.changes-summary-detail { font-size: 11px; color: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.changes-summary-arrow { font-size: 13px; color: var(--accent); flex-shrink: 0; }

.diff-row { background: var(--nav-bg); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; }
.diff-row.clickable { cursor: pointer; transition: background .15s; }
.diff-row.clickable:hover { background: rgba(17,24,39,.09); }
.diff-row-hint { font-size: 10.5px; color: var(--accent); font-weight: 700; margin-top: 4px; }
.diff-label { font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 5px; }
.diff-old { font-size: 12px; color: var(--red); text-decoration: line-through; opacity: .8; }
.diff-new { font-size: 12px; color: var(--green); font-weight: 700; margin-top: 2px; }
.pending-edit-input {
  width: 100%; margin-top: 4px; padding: 6px 8px; border-radius: 6px; font-family: 'Heebo', sans-serif;
  font-size: 12px; font-weight: 700; color: var(--green); background: var(--bg-main); border: 1.5px solid var(--green);
}

.broadcast-body-input {
  width: 100%; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--border-md);
  background: var(--nav-bg); color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px;
  line-height: 1.7; margin-bottom: 10px; resize: vertical;
}
.broadcast-actions { display: flex; gap: 10px; margin-bottom: 8px; }
.broadcast-history-row {
  background: var(--nav-bg); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
}
.broadcast-history-subject { font-size: 13px; font-weight: 800; color: var(--text); }
.broadcast-history-meta { font-size: 11.5px; color: var(--text-sm); margin-top: 3px; }
.broadcast-history-audience { font-size: 10.5px; font-weight: 700; color: var(--text-muted); margin-right: 6px; }
.broadcast-audience-toggle { display: flex; gap: 8px; margin-bottom: 14px; }

/* ── מרכז הודעות — מקטעים ניתנים לקיפול (שידור המוני / הודעה בודדת), במקום טופס פתוח תמיד ── */
.msg-section { border: 1px solid var(--border-md); border-radius: 12px; background: var(--card-bg2); margin-bottom: 14px; overflow: hidden; }
.msg-section-head { display: flex; align-items: baseline; gap: 8px; padding: 14px 16px; cursor: pointer; }
.msg-section-head .ttl { font-size: 13.5px; font-weight: 800; color: var(--text); white-space: nowrap; }
.msg-section-head .hint { font-size: 11.5px; color: var(--text-sm); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg-section-head .chev { margin-inline-start: auto; color: var(--text-muted); font-size: 12px; flex-shrink: 0; }
.msg-section-body { padding: 0 16px 16px; border-top: 1px solid var(--border); padding-top: 14px; }
.msg-group-label { font-size: 12.5px; font-weight: 800; color: var(--text-sm); margin: 22px 2px 4px; display: flex; align-items: baseline; gap: 8px; }
.msg-group-label .hint { font-size: 11px; color: var(--text-muted); font-weight: 400; }
.msg-group-label:first-child { margin-top: 0; }

/* ── בורר קהל inline (checkboxes) — בתוך .picker/.picker-list הקיימים, רק שורה+תיבת-סימון משלה ── */
/* label שלם (לא רק ה-checkbox) הוא היעד ללחיצה — קליק בכל מקום בשורה מסמן/מבטל, native checkbox
   כדי שיהיה חד-משמעית ברור וניתן-ללחיצה (בלי תלות ב-onclick על div מותאם-אישית). */
.aud-picker-row {
  display: flex; align-items: center; gap: 9px; padding: 7px 6px; border-radius: 8px; cursor: pointer;
  font-size: 12.5px; user-select: none;
}
.aud-picker-row:hover { background: rgba(17,24,39,.05); }
.aud-picker-row input[type="checkbox"] { flex-shrink: 0; width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
.selected-recipient-row {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 8px 10px; border-radius: 8px;
  background: var(--nav-bg); margin-bottom: 6px; font-size: 12.5px;
}
.selected-recipient-row .nm { font-weight: 700; flex: 1; }
.picker-note-hint { flex-basis: 100%; font-size: 11.5px; color: #0369a1; font-weight: 600; }
.aud-chips-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
.aud-chip {
  display: flex; align-items: center; gap: 6px; background: var(--card-bg); border: 1px solid var(--border-md);
  border-radius: 20px; padding: 5px 6px 5px 10px; font-size: 12px; font-weight: 700; color: var(--text);
}
.aud-chip button {
  border: none; background: rgba(17,24,39,.08); border-radius: 50%; width: 16px; height: 16px; font-size: 10px;
  cursor: pointer; color: var(--text-sm); display: flex; align-items: center; justify-content: center; padding: 0;
}
.tpl-explain-box { font-size: 12px; color: var(--text-sm); background: var(--nav-bg); border-radius: 8px; padding: 10px 12px; margin: 10px 0; line-height: 1.7; text-align: right; }
.tpl-explain-box b { color: var(--text); }
.tpl-vars-box { font-size: 11px; color: var(--text-muted); margin: 0 0 10px; }
.tpl-vars-box code { background: rgba(17,24,39,.08); color: var(--accent); padding: 1px 6px; border-radius: 5px; font-family: monospace; }
.aud-summary { font-size: 12px; color: var(--text-sm); margin-bottom: 10px; line-height: 1.6; }

.health-toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.health-list { display: flex; flex-direction: column; gap: 7px; }
.health-row {
  display: flex; align-items: center; gap: 12px; background: var(--card-bg); border: 1px solid var(--border-md);
  border-radius: 10px; padding: 9px 13px; cursor: pointer; transition: border-color .12s;
}
.health-row:hover { border-color: var(--accent); }
.health-info { width: 190px; flex-shrink: 0; overflow: hidden; }
.health-name { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.health-missing { font-size: 10.5px; color: var(--orange); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.health-missing.ok { color: var(--green); }
.health-bar-track { flex: 1; height: 8px; border-radius: 5px; background: var(--nav-bg); overflow: hidden; }
.health-bar-fill { height: 100%; border-radius: 5px; background: var(--green); }
.health-bar-fill.low { background: var(--orange); }
.health-pct { font-size: 12px; font-weight: 800; width: 38px; text-align: left; flex-shrink: 0; }
.health-pct.low { color: var(--orange); }

/* ── ניהול תגיות — תור בקשות ממתינות מרוכז + רשימת תגיות לפי קטגוריה ── */
.tagmgmt-queue-card {
  background: var(--card-bg); border: 1px solid var(--border-md); border-right: 3px solid var(--orange); border-radius: 10px;
  padding: 10px 13px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap;
}
.tagmgmt-queue-main { flex: 1; min-width: 200px; }
.tagmgmt-queue-name { font-size: 12.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tagmgmt-queue-desc { font-size: 11.5px; color: var(--text-sm); margin-top: 3px; }
.tagmgmt-queue-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
.tagmgmt-cat-card {
  background: var(--card-bg2); border: 1px solid var(--border-md); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
}
.tagmgmt-cat-head { font-size: 13px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.tagmgmt-tag-row { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--border); }
.tagmgmt-tag-row:last-of-type { border-bottom: none; }
.tagmgmt-tag-name { font-size: 12.5px; font-weight: 700; }
.tagmgmt-tag-count {
  font-size: 11px; color: var(--text-sm); white-space: nowrap; border: none; background: rgba(17,24,39,.06);
  border-radius: 20px; padding: 3px 10px; cursor: pointer; font-family: 'Heebo', sans-serif; font-weight: 700;
}
.tagmgmt-tag-count:hover { background: rgba(17,24,39,.13); }
.tagmgmt-tag-count.zero { color: var(--orange); font-weight: 800; cursor: default; background: rgba(217,119,6,.1); }
.tagmgmt-usage-list { margin: 2px 0 8px; padding-right: 4px; }
.tagmgmt-usage-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px;
  padding: 6px 10px; border-radius: 7px; cursor: pointer; color: var(--text-sm);
}
.tagmgmt-usage-item:hover { background: rgba(17,24,39,.05); color: var(--text); }
.tagmgmt-usage-arrow { color: var(--accent); font-size: 12px; }
.tagmgmt-tag-actions { display: flex; gap: 4px; flex-shrink: 0; }
.tagmgmt-icon-btn {
  border: none; background: rgba(17,24,39,.07); border-radius: 6px; width: 24px; height: 24px; font-size: 12px;
  cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.tagmgmt-icon-btn:hover { background: rgba(17,24,39,.14); }
.tagmgmt-inline-form { display: flex; gap: 6px; align-items: center; flex: 1; flex-wrap: wrap; }
.tagmgmt-inline-form input, .tagmgmt-inline-form select {
  padding: 6px 9px; border-radius: 7px; border: 1px solid var(--border-md); background: var(--nav-bg); color: var(--text);
  font-family: 'Heebo', sans-serif; font-size: 12.5px;
}
.tagmgmt-add-row { display: flex; gap: 6px; margin-top: 8px; }
.tagmgmt-add-row input { flex: 1; }

.roadmap-panel {
  background: var(--card-bg2); border: 1px dashed var(--border-md); border-radius: 12px; padding: 14px 16px; margin-top: 24px;
}
.roadmap-title { font-size: 12px; font-weight: 800; color: var(--text-sm); margin-bottom: 8px; }
.roadmap-list { font-size: 12px; color: var(--text-muted); line-height: 2; }

/* ── מרכז המשימות — Master-Detail (רשימה מימין, פרטים משמאל) ── */
.task-split { display: flex; gap: 14px; align-items: flex-start; }
.task-list-col {
  /* הרשימה מכילה שורות קצרות (שם+מטא) שלא צריכות הרבה רוחב — עדיף לתת את רוב השטח לכרטיס הפרטים,
     ששם יש הרבה תוכן ובלעדיו נוצרת גלילה מיותרת. לא 50/50 — נוסה וגם נראה ריק מדי בפועל בצילום מסך.
     גובה נמתח עד תחתית המסך (לא 640px קבוע) + sticky כדי שתמיד יראו כמה שיותר שורות בלי לגלול את כל הדף. */
  flex: 0 0 32%; max-width: 32%; max-height: calc(100vh - 40px); overflow-y: auto;
  position: sticky; top: 20px;
  display: flex; flex-direction: column; gap: 7px; padding-left: 2px;
}
.task-detail-col { flex: 1; min-width: 0; }
.task-row {

<script type="module">
// ── 2026-07-26: חובר ל-Firestore אמיתי (שלב 1) — MOCK_BUSINESSES/MOCK_FANS הוחלפו ב-onSnapshot
// אמיתי (ר' בסוף הקובץ). השם "MOCK_" נשאר בכוונה (39 מקומות משתמשים בו בקובץ) — הוא כבר לא מוק,
// זה נתון אמיתי. hydrateBiz/hydrateFan למטה ממפים בין שמות שדות שהדמו המקורי המציא לשמות האמיתיים
// ב-Firestore (למשל hasCoverPhoto נגזר מ-coverPhoto, ownerIsSubscriber מ-isSubscriber==='yes').
// שדות שאין להם מקבילה אמיתית כלל (region, reviewedSections, adminVerified/adminNote,
// pendingChangeDiff/aiShortTitle) מקבלים ברירת מחדל בטוחה — עדיין לא ניתן לשמור אותם בפועל
// (ר' באנר האזהרה ב-bizFullDetailHtml/fanFullDetailHtml ותיעוד ב-PROJECT_CONTEXT.md §54).
import { db, auth, getStorageLazy } from './firebase-config.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js';
import {
  collection, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp, getDoc, runTransaction, query, where, getDocs, writeBatch, setDoc, addDoc, orderBy, limit
} from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js';
import { ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js';

let MOCK_BUSINESSES = [];
let MOCK_FANS = [];

const REGIONS_MOCK = ['גוש דן','ירושלים והסביבה','השפלה','השרון','חיפה והצפון','הדרום'];

function toJsDate(ts) { return ts && ts.toDate ? ts.toDate() : (ts || null); }
// זהה ל-esc() ב-admin-businesses.html — למניעת שבירת HTML/XSS כשערך שדה (name/value) מכיל " או <
function esc(v) {
  return (v == null ? '' : String(v)).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// ── העלאת מדיה אמיתית ל-Firebase Storage — זהה בדיוק ל-admin-businesses.html (uploadFile/
// compressImageFile/compressToFile/uploadImageWithThumb) — שלב 5 (מדיה) הוא הראשון בדמו שצריך את זה. ──
async function uploadFile(file, path) {
  const storageRef = ref(await getStorageLazy(), path);
  const snap = await uploadBytes(storageRef, file, { cacheControl: 'public, max-age=31536000, immutable' });
  return await getDownloadURL(snap.ref);
}
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function dataUrlToFile(dataUrl, filename) {
  const [meta, b64] = dataUrl.split(',');
  const mime = meta.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new File([bytes], filename, { type: mime });
}
function compressImageFile(file, maxDim = 1280, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    fileToDataUrl(file).then(rawDataUrl => {
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/webp', quality));
      };
      img.onerror = reject;
      img.src = rawDataUrl;
    }).catch(reject);
  });
}
async function compressToFile(file, maxDim, quality, filename) {
  const dataUrl = await compressImageFile(file, maxDim, quality);
  return dataUrlToFile(dataUrl, filename || file.name);
}
async function uploadImageWithThumb(file, basePath) {
  try {
    const [mainFile, thumbFile] = await Promise.all([
      compressToFile(file, 1280, 0.82, file.name),
      compressToFile(file, 400, 0.75, 'thumb_' + file.name),
    ]);
    const [url, thumbUrl] = await Promise.all([
      uploadFile(mainFile, basePath),
      uploadFile(thumbFile, basePath + '_thumb'),
    ]);
    return { url, thumbUrl };
  } catch (e) {
    console.error('⚠️ image compression failed, falling back to original file:', e);
    return { url: await uploadFile(file, basePath), thumbUrl: '' };
  }
}

// המרה קריאה לתצוגת דיף (לא כמו fmtVal המפורט של admin-businesses.html — מספיק לקריאה בסיסית, לא מפורמט לפי סוג שדה)
function fmtDiffVal(v) {
  if (v == null || v === '') return '—';
  if (typeof v === 'boolean') return v ? 'כן' : 'לא';
  if (Array.isArray(v)) return v.length ? v.map(x => typeof x === 'object' ? JSON.stringify(x) : x).join(', ') : '—';
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}

// ממפה מסמך businesses אמיתי לצורה שה-UI הקיים בקובץ הזה מצפה לה (נבנה במקור סביב שמות-שדה מומצאים)
function hydrateBiz(id, raw) {
  const branches = raw.branches || [];
  const b = {
    ...raw,
    id,
    registeredAt: toJsDate(raw.submittedAt) || new Date(),
    approvedAt: toJsDate(raw.approvedAt),
    rejectedAt: toJsDate(raw.rejectedAt),
    agreedTermsAt: toJsDate(raw.agreedTermsAt),
    ownerEmailSentAt: toJsDate(raw.ownerEmailSentAt),
    pendingChangesAt: toJsDate(raw.pendingChangesAt),
    hasCoverPhoto: !!raw.coverPhoto,
    hasLogo: !!raw.logo,
    hasPhoto: !!(raw.coverPhoto || raw.logo),
    hoursText: raw.hours || '',
    descriptionText: raw.desc || '',
    hasPendingChange: !!raw.pendingChanges,
    city: (branches[0] && branches[0].city) || '',
    region: '', // אין שדה "אזור" בודד על עסק אמיתי — לא קריטי לשלב זה
    likes: (raw.likedBy || []).length,
    clicks: raw.clicks || 0,
    bizTypes: raw.bizTypes || [],
    isOnline: (raw.bizTypes || []).includes('online'),
    tags: raw.tags || [],
    regions: raw.regions || [],
    branches,
    reviewedSections: raw.reviewedSections || {}, // עדיין לא נשמר בפועל — ר' toggleSecReviewed
    ownerIsSubscriber: raw.isSubscriber === 'yes',
    ownerSubscriberSection: raw.gate || null,
    ownerSubscriberNumber: raw.subNum || null,
    ownerFacebookUrl: raw.fbUrl || '',
    ownerProofPhotoUrl: raw.photoProofUrl || '',
    // תוקן — 2 באגים אמיתיים היו כאן:
    // (1) discountFullText נפל-בחזרה ל-raw.discountText (הכותרת המקוצרת) כשלא היה discountTextFull —
    //     זה גרם לטופס-העריכה להציג את הכותרת-הקצרה כאילו היא התיאור-המלא, ושמירה "מאשרת" את
    //     ההחלפה השקטה הזו לצמיתות — בדיוק התלונה: "דורסת את ההטבה הראשונה ומעתיקה את המקוצרת".
    // (2) שני השדות קראו רק מ-raw (המצב המאושר/הישן), אף פעם לא מ-raw.pendingChanges (מה שבעל
    //     העסק בפועל ביקש ועדיין ממתין לאישור) — אז אם הייתה בקשה ממתינה, המנהל היה עורך על סמך
    //     נתונים ישנים, והשמירה הייתה דורסת את הבקשה האמיתית של בעל העסק בלי לדעת שהוא בכלל ראה אותה.
    aiShortTitle: (raw.pendingChanges && 'discountText' in raw.pendingChanges) ? raw.pendingChanges.discountText : (raw.discountText || ''),
    discountFullText: (raw.pendingChanges && 'discountTextFull' in raw.pendingChanges) ? raw.pendingChanges.discountTextFull : (raw.discountTextFull || ''),
    // אותו תיקון (2) גם כאן — הטבה 2/3 חייבות להעדיף בקשה-ממתינה על פני המצב הישן, מאותה סיבה בדיוק
    additionalDiscounts: (raw.pendingChanges && 'additionalDiscounts' in raw.pendingChanges) ? raw.pendingChanges.additionalDiscounts : (raw.additionalDiscounts || []),
    // דיף שינויים ממתינים — נבנה מהערך הישן על המסמך מול הערך המוצע ב-pendingChanges (אמיתי, לא מוק)
    pendingChangeDiff: raw.pendingChanges ? Object.fromEntries(
      Object.keys(raw.pendingChanges).map(k => [k, { old: fmtDiffVal(raw[k]), new: fmtDiffVal(raw.pendingChanges[k]) }])
    ) : null,
    changeSubmittedAt: toJsDate(raw.pendingChangesAt),
    isNew: !!raw.isNew,
    isFeatured: !!raw.isFeatured,
    sectionDeals: raw.sectionDeals !== false,

    catKey: raw.categoryPrimary || raw.cat || '',
  };

}

const SLOT_COUNT = 10;
const DAY_MS = 86400000;

// state[tabKey][slotIndex] = null (=אוטומטי) או
// { bizId, mode:'fixed'|'temp', days, setAt:Date, until:Date|null,
//   next:null|{bizId,mode,days,handoverAt:Date} }
// handoverAt = מתי המחליף נכנס בפועל: לעיגון זמני זה תמיד until (אוטומטי). לעיגון קבוע זה תאריך
// שנבחר ידנית בעת הגדרת המחליף (כי לעיגון קבוע אין תאריך תפוגה טבעי).
// מ-2026-07-26: state נטען בפועל מ-Firestore (settings/sectionAnchors, מסמך יחיד עם שדה למפתח טאב,
// כל שדה מערך של 10 איברים nullable) — ר' anchorsDocToState/anchorToRaw למטה, וה-onSnapshot בתחתית
// הקובץ. עד שהמסמך נטען פעם ראשונה, state מאותחל ריק (הכל "אוטומטי") כדי לא לקרוס.
const state = {};
ALL_TABS.forEach(t => state[t.key] = new Array(SLOT_COUNT).fill(null));

// ISO string (כפי שנשמר ב-Firestore) → Date (כפי שכל שאר קוד העיגונים בקובץ הזה כבר מצפה לו)
function anchorFromRaw(raw) {
  if (!raw) return null;
  return {
    ...raw,
    setAt: raw.setAt ? new Date(raw.setAt) : null,
    until: raw.until ? new Date(raw.until) : null,
    next: raw.next ? { ...raw.next, handoverAt: raw.next.handoverAt ? new Date(raw.next.handoverAt) : null } : null,
  };
}
// Date → ISO string, לכתיבה חזרה ל-Firestore
function anchorToRaw(a) {
  if (!a) return null;
  return {
    ...a,
    setAt: a.setAt ? a.setAt.toISOString() : null,
    until: a.until ? a.until.toISOString() : null,
    next: a.next ? { ...a.next, handoverAt: a.next.handoverAt ? a.next.handoverAt.toISOString() : null } : null,
  };
}
function anchorsDocToState(raw) {
  const s = {};
  ALL_TABS.forEach(t => {
    const arr = (raw && raw[t.key]) || [];
    s[t.key] = Array.from({ length: SLOT_COUNT }, (_, i) => anchorFromRaw(arr[i] || null));
  });
  return s;
}

// (לא אכיפה אמיתית), מה שאיפשר לשמור כותרת שחורגת בפועל בכרטיס במובייל — זה מה שתוקן כאן.
const CARD_TITLE_RAW_WIDTH = 151;
const CARD_TITLE_SAFETY_MARGIN = 10;
const CARD_TITLE_MAX_WIDTH = CARD_TITLE_RAW_WIDTH - CARD_TITLE_SAFETY_MARGIN;
const CARD_TITLE_FONT = '700 11px Heebo';
let _measureCanvas = null;
function measureTextWidth(text, font) {
  if (!_measureCanvas) _measureCanvas = document.createElement('canvas');
  const ctx = _measureCanvas.getContext('2d');
  ctx.font = font;
  return ctx.measureText(text).width;
}
function ensureFitsCard(text) {
  let t = (text || '').trim();
  if (measureTextWidth(t, CARD_TITLE_FONT) <= CARD_TITLE_MAX_WIDTH) return t;
  while (t.includes(' ') && measureTextWidth(t, CARD_TITLE_FONT) > CARD_TITLE_MAX_WIDTH) {
    t = t.slice(0, t.lastIndexOf(' ')).trim();
  }
  while (t.length > 1 && measureTextWidth(t, CARD_TITLE_FONT) > CARD_TITLE_MAX_WIDTH) {
    t = t.slice(0, -1);
  }
  return t.trim();
}

function bizById(id) { return MOCK_BUSINESSES.find(b => b.id === id); }

// מאגר העסקים הרלוונטי לטאב: קטגוריה = רק עסקים ששייכים אליה בפועל. סקשן = הכל, אלא אם יש ELIGIBLE_FILTER.
function poolFor(tab) {
  if (tab.type === 'category') return MOCK_BUSINESSES.filter(b => b.catKey === tab.catKey);
  const ef = ELIGIBLE_FILTER[tab.key];
  return ef ? MOCK_BUSINESSES.filter(ef.test) : MOCK_BUSINESSES;
}
function scopeNoteFor(tab) {
  if (tab.type === 'category') return `מציג רק עסקים ששייכים בפועל לקטגוריית "${CATEGORIES.find(c=>c.key===tab.catKey).label}"`;
  const ef = ELIGIBLE_FILTER[tab.key];
  return ef ? ef.note : 'מציג את כל העסקים המאושרים באינדקס';
}

// סדר "אוטומטי" יציב לכל טאב, לצורך התצוגה המקדימה בלבד (מדמה את הסבב היומי ההוגן האמיתי)
function autoOrderFor(tab) {
  const seed = [...tab.key].reduce((a,c) => a + c.charCodeAt(0), 0);
  return [...poolFor(tab)].sort((a, b) => {
    const ha = (a.id.charCodeAt(1) * 31 + seed) % 97;
    const hb = (b.id.charCodeAt(1) * 31 + seed) % 97;
    return ha - hb;
  });
}

function fmtDateTime(d) {
  if (!d) return '';
  return d.toLocaleDateString('he-IL') + ' ' + d.toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit'});
}
function fmtDate(d) { return d.toLocaleDateString('he-IL'); }
// "כמה זמן עבר" — לשורות ממתינים/רשומים, כדי לראות מיד כמה זמן מישהו כבר מחכה, לא רק את התאריך היבש
// "לפני 150 ימים" לא ברור בקריאה מהירה (כמה זה בערך?) — פירוק לשבועות/חודשים/שנים לפער גדול,
// ימים בודדים נשארים מדויקים כי שם זה כן ברור.
function agoLabel(d) {
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days <= 0) return 'היום';
  if (days === 1) return 'אתמול';
  if (days < 14) return `לפני ${days} ימים`;
  if (days < 60) return `לפני ${Math.round(days / 7)} שבועות`;
  if (days < 365) return `לפני ${Math.round(days / 30)} חודשים`;
  const years = Math.round(days / 365);
  return `לפני ${years === 1 ? 'שנה' : years + ' שנים'}`;
}
function daysLeft(date) { return Math.ceil((date - new Date()) / DAY_MS); }
function isExpired(anchor) { return anchor.mode === 'temp' && anchor.until && new Date() > anchor.until; }
// התאריך שבו קורה משהו למיקום הזה: לעיגון זמני זה מועד הפקיעה. לעיגון קבוע זה תאריך ההחלפה
// המתוזמן (אם הוגדר) — קבוע בלי מחליף לא "מסתיים" אף פעם, ולכן לא מוצג בפאנל.
function effectiveDate(anchor) {
  return anchor.mode === 'temp' ? anchor.until : (anchor.next ? anchor.next.handoverAt : null);
}

// ── סיידבר קבוע: "כל העסקים" תמיד למעלה, ואז שתי קבוצות (סקשנים/קטגוריות) שנשארות גלויות —
// לוחצים על כותרת קבוצה כדי לפתוח/לסגור אותה, בלי לאבד את המקום או "לחזור" למסך ריק.
// רק קבוצה אחת פתוחה בו-זמנית (כדי לא להציג 13 פריטים ביחד) — אבל שתי הכותרות תמיד שם.
function sidebarGroupHtml(mode, title, list) {

  return `

      <span>${title}</span><span class="chev">▾</span>
    </div>
    ${open ? `<div class="sidebar-group-body">${items}</div>` : ''}`;
}

function expiringPanelHtml() {
  const slots = state[activeTab];
  const items = slots
    .map((a, i) => ({ a, i, ed: a ? effectiveDate(a) : null }))
    .filter(x => x.a && x.ed && !isExpired(x.a))
    .sort((x, y) => x.ed - y.ed);

  if (!items.length) {
    return `
      <div class="expiring-panel">
        <div class="expiring-title">⏳ מה מסתיים / מתחלף בקרוב</div>
        <div class="expiring-empty">אין כרגע עיגונים עם תאריך פקיעה או החלפה מתוזמנת בטאב הזה.</div>
      </div>`;
  }

  const needsAttention = items.filter(x => !x.a.next);
  const covered        = items.filter(x => x.a.next);

  const rowNeedsAttention = ({a, i, ed}) => {
    const biz = bizById(a.bizId);
    return `
      <div class="expiring-item">
        <div class="exp-pos">${i+1}</div>
        <div class="exp-body">${biz.name}</div>
        ${expDaysBadge(daysLeft(ed))}
        <button class="exp-action-btn" onclick="editExisting(${i})">📌 קבע מי יחליף</button>
      </div>`;
  };
  const rowCovered = ({a, i, ed}) => {
    const biz = bizById(a.bizId);
    const nx  = bizById(a.next.bizId);
    return `
      <div class="expiring-item">
        <div class="exp-pos">${i+1}</div>
        <div class="exp-body">${biz.name} <span class="succ">← <span class="cv">${nx.name}</span></span></div>
        ${expDaysBadge(daysLeft(ed))}
        <button class="exp-action-btn" onclick="editExisting(${i})">ערוך</button>
      </div>`;
  };

  const attentionBlock = needsAttention.length ? `
    <div class="expiring-subgroup">
      <div class="exp-sub-title warn">⚠️ ללא מחליף — יחזרו לסבב אוטומטי (${needsAttention.length})</div>
      <div class="exp-sub-list">${needsAttention.map(rowNeedsAttention).join('')}</div>
    </div>` : '';
  const coveredBlock = covered.length ? `
    <div class="expiring-subgroup">
      <div class="exp-sub-title ok-title">✓ כבר מוגדר מי יחליף (${covered.length})</div>
      <div class="exp-sub-list">${covered.map(rowCovered).join('')}</div>
    </div>` : '';

  return `
    <div class="expiring-panel">
      <div class="expiring-title">⏳ מה מסתיים / מתחלף בקרוב</div>
      ${attentionBlock}
      ${coveredBlock}
    </div>`;
}

function previewStripHtml(tab) {
  const slots = state[activeTab];
  const anchoredIds = new Set(slots.filter(Boolean).map(a => !isExpired(a) ? a.bizId : null).filter(Boolean));
  const autoPool = autoOrderFor(tab).filter(b => !anchoredIds.has(b.id));
  let autoIdx = 0;

  const cards = slots.map((anchor, i) => {
    if (anchor && !isExpired(anchor)) {
      const biz = bizById(anchor.bizId);
      return `<div class="pv-card pinned"><div class="pv-pos">${i+1}</div>
        <div class="pv-icon">${biz.icon}</div><div class="pv-name">${biz.name}</div>
        <div class="pv-pin-mark">📌 מעוגן</div></div>`;
    }
    const biz = autoPool[autoIdx++] || null;
    if (!biz) return '';
    return `<div class="pv-card"><div class="pv-pos">${i+1}</div>
      <div class="pv-icon">${biz.icon}</div><div class="pv-name">${biz.name}</div>
      <div class="pv-auto-mark">סבב אוטומטי</div></div>`;
  }).join('');

  return cards || `<div class="pv-empty-note">אין עדיין עסקים מתאימים במוק</div>`;
}

  return slots.map((anchor, i) => {
    const active = anchor && !isExpired(anchor);
    if (pickingSlot === i) return renderPickerSlot(i, tab);

    if (active) {

      const modeLine = anchor.mode === 'fixed'
        ? `<span class="fixed-tag">📌 קבוע</span>`

      let chainLine = '';
      if (anchor.next) {
        const when = anchor.mode === 'temp' ? 'לאחר שהעיגון יפוג' : 'ב-' + fmtDate(anchor.next.handoverAt);
        chainLine = `<div class="chain-line">→ ${when}: <span class="cv">${bizById(anchor.next.bizId).name}</span> (${anchor.next.mode==='fixed' ? 'קבוע' : 'למשך ' + anchor.next.days + ' ימים'})</div>`;

          <button class="slot-btn primary" ${disabled ? 'disabled' : ''} onclick="openPicker(${i})">📌 עגן עסק כאן</button>
        </div>
      </div>`;
  }).join('');
}

// בלוק "מי יחליף" — זמין גם לעיגון זמני (מחליף נכנס כשהתוקף פג) וגם לעיגון קבוע
// (מחליף נכנס בתאריך שבוחרים ידנית, כי לקבוע אין תאריך פקיעה טבעי).
function renderChainBlock(tab, i) {
  const excludeIds = new Set(
    state[activeTab].map((a,idx) => (a && !isExpired(a) && idx !== i) ? a.bizId : null).filter(Boolean)
  );
  excludeIds.add(choosingBiz);
  const successorOptions = poolFor(tab).filter(b => !excludeIds.has(b.id));
  const isTemp = editMode.type === 'temp';

  const offLabel = isTemp ? '🔄 חוזר לסבב אוטומטי' : '♾ יישאר קבוע (בלי תזמון)';
  const onLabel  = isTemp ? '📌 עסק אחר יחליף' : '📌 תזמן מי יחליף ומתי';

// כתיבה ל-Firestore דורשת את המערך השלם של 10 האיברים לאותו מפתח-טאב (אין עדכון-איבר-מערך חלקי
// נוח ב-Firestore) — bumpSlot בונה state[activeTab] מעודכן ואז כותב את כולו במכה אחת.
async function bumpSlot(i, value) {
  const prev = state[activeTab][i];
  state[activeTab][i] = value; // עדכון אופטימי מקומי, לפני שהכתיבה חוזרת
  renderAll();
  try {
    const rawArr = state[activeTab].map(anchorToRaw);
    // setDoc({merge:true}) ולא updateDoc — המסמך עשוי לא להתקיים עדיין בפעם הראשונה שמעגנים משהו בכלל
    await setDoc(doc(db, 'settings', 'sectionAnchors'), { [activeTab]: rawArr }, { merge: true });
  } catch (e) {
    console.error(e);
    alert('שגיאה בשמירת העיגון: ' + e.message);
    state[activeTab][i] = prev; // rollback מקומי אם הכתיבה נכשלה
    renderAll();
  }
}

window.saveAnchor = async function(i) {
  const now = new Date();
  const until = editMode.type === 'temp' ? new Date(now.getTime() + (editMode.days||1) * DAY_MS) : null;

  let next = null;
  if (editMode.chainMode === 'chain' && editMode.nextBizId) {
    const handoverAt = editMode.type === 'temp' ? until : new Date(now.getTime() + (editMode.handoverDays||30) * DAY_MS);
    next = {
      bizId: editMode.nextBizId,
      mode: editMode.nextType,
      days: editMode.nextType === 'temp' ? (editMode.nextDays || 1) : null,
      handoverAt,
    };
  }

  const value = {
    bizId: choosingBiz,
    mode: editMode.type,
    days: editMode.type === 'temp' ? (editMode.days || 1) : null,
    setAt: now,
    until,
    next,
  };
  pickingSlot = null;
  choosingBiz = null;
  await bumpSlot(i, value);
};

window.removeAnchor = async function(i) {
  await bumpSlot(i, null);
};

  renderMain();
};

function bizFilteredList() {
  const q = bizSearch.trim();
  const list = MOCK_BUSINESSES.filter(b => {
    const matchF = bizStatusFilter === 'all' ? true
      : bizStatusFilter === 'changes' ? !!b.hasPendingChange
      : b.status === bizStatusFilter;
    const matchCat = bizCategoryFilter === 'all' || b.catKey === bizCategoryFilter;
    const matchType = bizTypeFilter === 'all' || (b.bizTypes || []).includes(bizTypeFilter);
    const matchReview = bizReviewFilter === 'all' ? true
      : bizReviewFilter === 'complete' ? bizReviewedCount(b) === BIZ_REVIEW_SECTIONS.length
      : bizReviewedCount(b) < BIZ_REVIEW_SECTIONS.length;
    const matchHealth = bizHealthFilter === 'all' ? true
      : bizHealthFilter === 'complete' ? b.healthScore === 100
      : b.healthScore < 100;
    const matchDate = bizDateRangeFilter === 'all' ? true
      : (Date.now() - b.registeredAt.getTime()) <= Number(bizDateRangeFilter) * 86400000;
    const catLabel = (CATEGORIES.find(c => c.key === b.catKey) || {}).label || '';
    const matchQ = !q || b.name.includes(q) || (b.city || '').includes(q) || catLabel.includes(q);
    return matchF && matchCat && matchType && matchReview && matchHealth && matchDate && matchQ;
  });
  return list.sort((a, b) => {
    if (bizSort === 'oldest') return a.registeredAt - b.registeredAt;
    if (bizSort === 'clicks') return b.clicks - a.clicks;
    if (bizSort === 'likes') return b.likes - a.likes;
    if (bizSort === 'reviewedAsc') return bizReviewedCount(a) - bizReviewedCount(b);
    if (bizSort === 'reviewedDesc') return bizReviewedCount(b) - bizReviewedCount(a);
    return b.registeredAt - a.registeredAt;
  });
}

function bizRowsHtml() {
  const shown = bizFilteredList();
  if (!shown.length) return `<div class="placeholder-note">לא נמצאו עסקים</div>`;
  const chipLabel = b => b.status === 'approved' ? '✓ אושר' : b.status === 'rejected' ? '✗ נדחה' : 'ממתין';
  return shown.map(b => {

    const changeBadge = b.hasPendingChange ? `<span class="biz-change-badge">✏️ שינויים</span>`
      : (bizHasPendingTagSuggestion(b) || bizHasPendingCategoryRequest(b)) ? `<span class="biz-change-badge">🏷️ בקשה ממתינה</span>` : '';
    const noteBadge = bizHasUnhandledNote(b) ? `<span class="biz-change-badge note">💬 כתבו לנו</span>` : '';

function applyBizTpl(tpl, ownerName, businessName, accessToken) {
  const link = accessToken ? `${location.origin}${location.pathname.replace(/[^/]*$/, '')}business-dashboard.html?token=${accessToken}` : '';
  return tpl.replace(/\{name\}/g, ownerName || '').replace(/\{business\}/g, businessName || '').replace(/\{dashboard_link\}/g, link);
}
function applyFanTplLocal(tpl, name, code) {
  return tpl.replace(/\{name\}/g, name || '').replace(/\{code\}/g, code || '—');
}
function waLink(phone, msg) {
  const digits = (phone || '').replace(/[^0-9]/g, '');
  const intl = digits.startsWith('0') ? '972' + digits.slice(1) : digits;
  return `https://wa.me/${intl}?text=${encodeURIComponent(msg)}`;
}

window.sendBizWA = function(phone, ownerName, businessName, accessToken) {
  window.open(waLink(phone, applyBizTpl(getTpl('wa', DEFAULT_TPL_WA), ownerName, businessName, accessToken)), '_blank');
};
window.sendBizMail = function(email, ownerName, businessName, accessToken) {
  const subject = encodeURIComponent(applyBizTpl(getTpl('mailSubject', DEFAULT_TPL_SUBJECT), ownerName, businessName, accessToken));
  const body = encodeURIComponent(applyBizTpl(getTpl('mail', DEFAULT_TPL_MAIL), ownerName, businessName, accessToken));
  window.open(`mailto:${email}?subject=${subject}&body=${body}`, '_blank');
};
window.sendFanWA = function(phone, name, code) {
  window.open(waLink(phone, applyFanTplLocal(getTpl('fan_wa', DEFAULT_FAN_WA), name, code)), '_blank');
};
window.sendFanMail = function(email, name, code) {
  const subject = encodeURIComponent(getTpl('fan_mailSubject', DEFAULT_FAN_MAIL_SUBJECT));
  const body = encodeURIComponent(applyFanTplLocal(getTpl('fan_mail', DEFAULT_FAN_MAIL), name, code));
  window.open(`mailto:${email}?subject=${subject}&body=${body}`, '_blank');
};

// ── תוכן מלא ואחיד לכרטיס עסק (לא רק תמצית) — משמש גם ב"כל העסקים" וגם בפתיחה מתוך הדשבורד הראשי ──
// ── כרטיס עסק מאוחד: תצוגה+עריכה בכל 5 השלבים ביחד, עריכה per-שלב (לא כרטיס-אחד-נערך-בשלמותו) ──
// זהה בהיגיון ל-admin-businesses.html האמיתי (card-section/sec-edit-btn/secView-secEdit/toggleSecEdit/saveSecN).
// כל 5 השלבים תמיד מרונדרים (תצוגה+עריכה), רק העריכה מוסתרת ב-CSS עד שלוחצים "✏️ ערוך" — בלי רינדור-מחדש
// בפתיחה/סגירה עצמה (מהיר, שומר גלילה/מצב שלבים אחרים). שמירה בפועל כן עושה renderMain() מלא (עקבי עם
// שאר הפעולות בקובץ — approveBiz/rejectBiz/approveTagSecondSuggestion וכו').
// ── סימוני סקשן (✨ חדש/⭐ נבחר/💛 הטבות שוות/💙 לב מוצג) — זהה בדיוק ל"ניהול סקשנים" ב-admin-businesses.html
// (isSecNewActive/isSecFeaturedActive/isLikesOverrideActive/newCellHtml/featuredCellHtml/dealsCellHtml/
// likesOverrideCellHtml/applySectionUpdate/activateSectionFlag/clearSectionFlag/toggleDealsSection/
// activateLikesOverride/clearLikesOverride) — כאן מוצג בתוך כרטיס העסק במקום בטבלה נפרדת, אותם שדות/כתיבות.
function isSecNewActive(b) { return !!(b.isNew && b.newUntil && new Date() < new Date(b.newUntil)); }
function isSecFeaturedActive(b) { return !!(b.isFeatured && (!b.featuredUntil || new Date() < new Date(b.featuredUntil))); }
function isLikesOverrideActive(b) { return b.likesOverride != null && (!b.likesOverrideUntil || new Date() < new Date(b.likesOverrideUntil)); }

function sectionFlagsControlHtml(b) {
  const newCell = isSecNewActive(b)
    ? `<span class="tag-chip">✨ פעיל עד ${fmtDate(new Date(b.newUntil))}</span> <button class="act-btn tiny" onclick="clearSectionFlag('${b.id}','new')">הסר</button>`
    : `<input type="number" class="edit-days-input" id="newDays-${b.id}" value="30" min="1" style="width:60px" /> ימים
       <button class="act-btn approve tiny" onclick="activateSectionFlag('${b.id}','new')">✨ הפעל</button>`;
  const featuredCell = isSecFeaturedActive(b)
    ? `<span class="tag-chip">⭐ ${b.featuredUntil ? 'עד ' + fmtDate(new Date(b.featuredUntil)) : 'קבוע'}</span> <button class="act-btn tiny" onclick="clearSectionFlag('${b.id}','featured')">הסר</button>`
    : `<button class="act-btn approve tiny" onclick="activateSectionFlag('${b.id}','featured')">⭐ סמן קבוע</button>
       <input type="number" class="edit-days-input" id="featuredDays-${b.id}" placeholder="ימים" min="1" style="width:60px" />
       <button class="act-btn tiny" onclick="activateSectionFlag('${b.id}','featured',true)">זמני</button>`;
  const dealsCell = !b.hasDiscount
    ? `<span class="tag-chip empty">אין הטבה</span>`
    : `<button class="toggle${b.sectionDeals !== false ? ' on' : ''}" title="${b.discountText || ''}" onclick="toggleDealsSection('${b.id}',${b.sectionDeals !== false})"></button>`;
  const likesCell = isLikesOverrideActive(b)
    ? `<span class="tag-chip">💙 ${b.likesOverride}${b.likesOverrideUntil ? ' עד ' + fmtDate(new Date(b.likesOverrideUntil)) : ' (קבוע)'}</span> <button class="act-btn tiny" onclick="clearLikesOverride('${b.id}')">הסר, חזרה למספר האמיתי</button>`
    : `<input type="number" class="edit-days-input" id="likesVal-${b.id}" min="0" placeholder="מס'" style="width:60px" />
       <input type="number" class="edit-days-input" id="likesDays-${b.id}" min="1" placeholder="ימים" style="width:60px" />
       <button class="act-btn approve tiny" onclick="activateLikesOverride('${b.id}')">💙 הפעל</button>`;
  return `<div class="approve-field">
    <div class="approve-field-label">🗂️ סימוני סקשן באינדקס</div>
    <div class="approve-longtext">✨ חדש אצלנו: ${newCell}</div>
    <div class="approve-longtext">⭐ נבחר: ${featuredCell}</div>
    <div class="approve-longtext">💛 הטבות שוות: ${dealsCell}</div>
    <div class="approve-longtext">💙 לב מוצג: ${likesCell}</div>
  </div>`;
}

async function applySectionUpdate(id, updates, msg) {
  try {
    await updateDoc(doc(db, 'businesses', id), updates);
    if (msg) alert(msg);
  } catch (e) { console.error(e); alert('שגיאה בעדכון: ' + e.message); }
}
window.activateSectionFlag = async function(id, kind, temp) {
  if (kind === 'new') {
    const days = parseInt(document.getElementById(`newDays-${id}`)?.value, 10) || 30;
    await applySectionUpdate(id, { isNew: true, newUntil: new Date(Date.now() + days * 86400000).toISOString() }, '✨ סומן כ"חדש אצלנו"');
  } else if (kind === 'featured') {
    let until = null;
    if (temp) {
      const days = parseInt(document.getElementById(`featuredDays-${id}`)?.value, 10);
      if (!days || days < 1) { alert('נא להזין מספר ימים תקין'); return; }
      until = new Date(Date.now() + days * 86400000).toISOString();
    }
    await applySectionUpdate(id, { isFeatured: true, featuredUntil: until }, '⭐ סומן כעסק נבחר');
  }
};
window.clearSectionFlag = async function(id, kind) {
  await applySectionUpdate(id, kind === 'new' ? { isNew: false, newUntil: null } : { isFeatured: false, featuredUntil: null });
};
window.toggleDealsSection = async function(id, current) {
  await applySectionUpdate(id, { sectionDeals: !current });
};
window.activateLikesOverride = async function(id) {
  const val = parseInt(document.getElementById(`likesVal-${id}`)?.value, 10);
  if (isNaN(val) || val < 0) { alert('נא להזין מספר תקין'); return; }
  const days = parseInt(document.getElementById(`likesDays-${id}`)?.value, 10);
  const until = (days && days > 0) ? new Date(Date.now() + days * 86400000).toISOString() : null;
  await applySectionUpdate(id, { likesOverride: val, likesOverrideUntil: until, likesOverrideSetAt: new Date().toISOString() }, '💙 מספר הלב עודכן');
};
window.clearLikesOverride = async function(id) {
  await applySectionUpdate(id, { likesOverride: null, likesOverrideUntil: null, likesOverrideSetAt: null });
};

    : '';

    ? CATEGORIES.find(c => c.key === b.alsoCategorySuggestion) : null;
  const alsoCatSuggestionHtml = alsoCatSuggestionMeta

  // בכלל ברשימה הנעולה, לא בחירה בין תגיות קיימות). מוצג באותו דפוס תיבת-התרעה + פעולות ישירות מהכרטיס.
  const tagFreeSuggestionMapOpen = tagQueueMapping === b.id;
  const tagFreeSuggestionCatPicking = tagQueueNewCatPicking === b.id;
  const tagFreeSuggestionPool = TAGS_BY_CATEGORY_MOCK[b.catKey] || [];
  const tagFreeSuggestionCatOptions = CATEGORIES.map(c => `<option value="${c.key}" ${b.catKey===c.key?'selected':''}>${c.icon} ${c.label}${b.catKey===c.key?' (הקטגוריה של העסק)':''}</option>`).join('');
  const tagFreeSuggestionEditingOpen = tagSuggestionEditing === b.id;
  const tagFreeSuggestionHtml = b.tagSuggestion
    ? `<div class="tag-suggestion-alert">${tagFreeSuggestionEditingOpen ? `
        🆕 העסק הציע תגית חדשה:
        <div class="tagmgmt-inline-form" style="margin-top:6px">
          <input type="text" id="tagSuggestionEditInput_${b.id}" value="${esc(b.tagSuggestion)}" maxlength="40" style="flex:1">
          <button class="act-btn approve tiny" onclick="saveTagSuggestionEdit('${b.id}')">💾 שמור</button>
          <button class="act-btn tiny" onclick="cancelTagSuggestionEdit()">ביטול</button>
        </div>` : `
        🆕 העסק הציע תגית חדשה: "${b.tagSuggestion}"
        <button class="act-btn tiny" onclick="startTagSuggestionEdit('${b.id}')">✏️ ערוך</button>
        ${tagFreeSuggestionMapOpen ? `
        <div class="tagmgmt-inline-form" style="margin-top:6px">
          <select id="tagQueueMapSelect_${b.id}">

          <button class="act-btn tiny" onclick="cancelMapTagSuggestion()">ביטול</button>
        </div>` : tagFreeSuggestionCatPicking ? `
        <div class="tagmgmt-inline-form" style="margin-top:6px">
          <span style="font-size:11px;color:var(--text-sm)">תחת איזו קטגוריה?</span>

          <button class="act-btn approve tiny" onclick="confirmApproveTagSuggestionNewCat('${b.id}')">✅ הוסף ואשר</button>
          <button class="act-btn tiny" onclick="cancelNewCatPicking()">ביטול</button>
        </div>` : `
        <div class="suggestion-actions">
          <button class="act-btn approve tiny" onclick="startNewCatPicking('${b.id}')">✅ אשר כתגית חדשה</button>
          <button class="act-btn tiny" onclick="startMapTagSuggestion('${b.id}')">🔀 מפה לקיימת</button>
          <button class="act-btn reject tiny" onclick="rejectTagSuggestion('${b.id}')">✗ דחה</button>
        </div>`}`}

    : '';
  const tagsHtml = (b.tags && b.tags.length) ? b.tags.map(t => `<span class="tag-chip">${t}</span>`).join('') : '<span class="tag-chip empty">אין תגיות</span>';
  const types = b.bizTypes || [];
  const isPhysical = types.includes('physical');
  const isOnline = types.includes('online');
  const isPro = types.includes('pro');
  const typeLabels = types.map(t => BIZ_TYPE_LABELS_MOCK[t]).filter(Boolean).join(' · ') || '—';
  const allDiscounts = [{ text: b.discountFullText, redeemMode: b.discountRedeemMode }].concat(b.additionalDiscounts || []);

  // שורת דיף לחיצה פותחת ישירות את עריכת השלב (הכרטיס כבר תמיד פתוח, אין "כרטיס אחר" לקפוץ אליו)
  const diffHtmlForSection = (n) => {
    if (!b.pendingChangeDiff) return '';
    const keys = Object.keys(b.pendingChangeDiff).filter(key => (DIFF_FIELD_TO_SECTION[key] || 2) === n);
    if (!keys.length) return '';
    // מצב "עריכת הערך הממתין" (togglePendingEditMode) — זהה ל-editPendingChanges ב-admin-businesses.html:
    // רק שדות פשוטים (string/number, לא מערך/אובייקט) הופכים לשדה קלט; השאר נשארים תצוגה בלבד.
    const editing = pendingEditIds.has(b.id);
    return keys.map(key => {
      const rawVal = b.pendingChanges ? b.pendingChanges[key] : undefined;
      const isSimple = typeof rawVal === 'string' || typeof rawVal === 'number';
      const newValueHtml = (editing && isSimple)
        ? `<input type="text" class="pending-edit-input" data-biz="${b.id}" data-key="${key}" value="${esc(String(rawVal))}" onclick="event.stopPropagation()" />`
        : `<div class="diff-new">אחרי: ${b.pendingChangeDiff[key].new}</div>`;
      return `
      <div class="diff-row${editing ? '' : ' clickable'}"${editing ? '' : ` onclick="toggleBizSecEdit('${b.id}',${n})" title="לחצו לעריכת השלב"`}>
        <div class="diff-label">${DIFF_FIELD_LABELS_MOCK[key] || key}</div>
        <div class="diff-old">לפני: ${b.pendingChangeDiff[key].old}</div>
        ${newValueHtml}
        ${editing ? '' : '<div class="diff-row-hint">→ לחצו לעריכת השלב</div>'}
      </div>`;
    }).join('') +
      `<div style="font-size:11px;color:var(--text-muted);margin:4px 0 8px">בקשת השינוי ממתינה ${agoLabel(b.changeSubmittedAt || b.registeredAt)}</div>`;
  };
  const branchesHtml = (b.branches && b.branches.length)
    ? b.branches.map(br => `${br.city} — ${br.address}`).join('<br>')
    : 'אין סניפים נוספים';
  const sectionFlagsHtml = sectionFlagsControlHtml(b);
  const flagChips = [
    b.isNew ? '<span class="tag-chip">✨ חדש אצלנו</span>' : '',
    b.isFeatured ? '<span class="tag-chip">⭐ נבחר</span>' : '',
    !b.sectionDeals && b.hasDiscount ? '<span class="tag-chip empty">💛 לא מוצג בהטבות שוות</span>' : '',
  ].filter(Boolean).join('');
  const statusActions = (b.status === 'pending'
    ? `<button class="act-btn approve" onclick="approveBiz('${b.id}')">✅ אשר</button>
       <button class="act-btn reject" onclick="rejectBiz('${b.id}')">✗ דחה</button>`
    : b.pendingChangeDiff
    ? `<button class="act-btn approve" onclick="approveChanges('${b.id}')">✅ אשר שינויים</button>
       <button class="act-btn" onclick="togglePendingEditMode('${b.id}')">${pendingEditIds.has(b.id) ? '✔️ סיום עריכה' : '✏️ ערוך שינויים'}</button>
       <button class="act-btn reject" onclick="rejectChanges('${b.id}')">✗ דחה שינויים</button>`
    : '') + `<button class="act-btn reject" onclick="deleteBiz('${b.id}')">🗑️ מחק</button>`;

  // ── שדות עריכה (מוכנים תמיד, מוסתרים ב-CSS עד "✏️ ערוך") ──
  const catOptions = CATEGORIES.map(c => `<option value="${c.key}" ${b.catKey===c.key?'selected':''}>${c.icon} ${c.label}</option>`).join('');

  const redeemOptions = (val) => `
    <option value="physical" ${val==='physical'?'selected':''}>🏪 בחנות הפיזית</option>
    <option value="sale" ${val==='sale'?'selected':''}>🤝 במעמד המכירה/השירות</option>

  const d3 = (b.additionalDiscounts && b.additionalDiscounts[1]) || { text:'', redeemMode:'physical' };

  // כל פריטי השינוי הממתינים, מקובצים לפי שלב — משמש גם לצביעת כותרת השלב למטה וגם לצביעת השדה
  // הספציפי בטופסי העריכה (fieldChangeHintHtml). המשתמש: "תצבע לי את השלב ואת השדה שמבוקש לשינוי".
  const pendingChangeItems = bizPendingChangeItems(b);
  const changeItemsBySection = {};
  pendingChangeItems.forEach(it => { (changeItemsBySection[it.section] = changeItemsBySection[it.section] || []).push(it); });
  // רמז-שדה — תג "🔸 היה: X" מתחת לשדה עריכה ספציפי, רק אם יש עבורו פריט שינוי ממתין (מזוהה לפי field).
  const fieldChangeHintHtml = (field) => {
    const it = pendingChangeItems.find(x => x.field === field && x.old !== undefined);
    return it ? `<div class="field-change-hint">🔸 היה: "${it.old}"</div>` : '';
  };
  const fieldChangeClass = (field) => pendingChangeItems.some(x => x.field === field) ? ' field-changed' : '';

  // כותרת שלב + (אם pending) צ'קבוקס "נסקר" + כפתור "✏️ ערוך" — n הוא מספר השלב (1-5)

  // וחשוב להמשיך לראות ולסמן את זה גם אחרי אישור (ר' PROJECT_CONTEXT.md §44).
  // "has-change" — כותרת השלב מקבלת סימון כחול (ציר נפרד מ-reviewed ירוק/כתום) כל עוד יש עבורו שינוי ממתין.
  const secTitle = (n, label) => {
    // שלב 1 (פרטי בעל העסק) לא במעקב-סקירה בכלל (ר' BIZ_REVIEW_SECTIONS) — אין לו שיקול דעת אמיתי
    // לסמן, אז גם הצ'קבוקס "נסקר" עצמו לא מוצג שם, לא רק לא נספר.
    const trackReview = BIZ_REVIEW_SECTIONS.includes(n);
    const isReviewed = trackReview && !!(b.reviewedSections && b.reviewedSections[n]);
    const hasChange = !!(changeItemsBySection[n] && changeItemsBySection[n].length);
    return `
    <div class="edit-section-title${trackReview ? ' review-tracked' : ''}${isReviewed ? ' reviewed' : ''}">

        <div class="approve-longtext">נרשם: ${fmtDate(b.registeredAt)} (${agoLabel(b.registeredAt)})${b.approvedAt ? '<br>אושר: ' + fmtDate(b.approvedAt) : ''}</div>

// ── עריכה per-שלב: toggle ישיר של show/hide (בלי רינדור-מחדש), זהה בהיגיון ל-toggleSecEdit ב-admin-businesses.html ──
window.toggleBizSecEdit = function(id, n) {
  const view = document.getElementById('secView'+n+'_'+id);
  const edit = document.getElementById('secEdit'+n+'_'+id);
  if (!edit) return;
  const opening = !edit.classList.contains('open');
  // שלב 3 (תגיות) תלוי ב-state גלובלי (editSelectedTags) שיכול "להידבק" מעריכה קודמת שבוטלה בלי שמירה —
  // מאתחלים ומרנדרים מחדש בכל טוגל (פתיחה וגם סגירה) כדי שיהיה תמיד עקבי עם b.tags/b.tagSecondSuggestion בפועל.
  if (n === 3) {
    initEditTagsState(id);
    rerenderEditTagsArea(id);
  }
  edit.classList.toggle('open', opening);
  if (view) view.style.display = opening ? 'none' : '';
};

// ── סימון "נסקר" לכל שלב — בקרה ידנית של המנהל על עסק pending לפני אישור, לא קשור לבריאות פרופיל ──
// סימון "נסקר" — עכשיו שדה אמיתי (businesses/{id}.reviewedSections, מפה {1:bool,...}) — נכתב מיד בכל טוגל
window.toggleSecReviewed = async function(id, n, checked) {
  const b = findBiz(id);
  if (!b) return;
  const reviewedSections = { ...(b.reviewedSections || {}), [n]: checked };
  await saveSectionUpdates(id, { reviewedSections });
};

// זהה ל-saveSectionUpdates ב-admin-businesses.html — כותב Firestore אמיתי (רק שדות אמיתיים, לא שדות
// תאימות-תצוגה כמו hoursText/catKey/isOnline). מעדכן את המטמון המקומי מיידית דרך hydrateBiz מחדש —
// כך שדות התצוגה הנגזרים מתעדכנים באותה לוגיקה בדיוק כמו בטעינה הראשונית, בלי לכתוב אותם ל-Firestore.
async function saveSectionUpdates(id, updates) {
  try {
    await updateDoc(doc(db, 'businesses', id), updates);
    const b = findBiz(id);
    if (b) {
      Object.assign(b, updates);
      Object.assign(b, hydrateBiz(id, b));
    }
    renderMain();
  } catch (e) { console.error(e); alert('שגיאה בשמירה: ' + e.message); }
}
