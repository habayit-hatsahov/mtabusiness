// ── בורר תגית ראשית+שנייה בטופס עריכה, כולל מנגנון האישור לתגית שנייה (זהה בהיגיון ל-admin-businesses.html) ──
// מאתחל את editSelectedTags/editSecondTagOpen כשנפתח טופס עריכה: תגיות מאושרות קיימות + הצעת תגית שנייה
// ממתינה (אם תקפה לקטגוריה הנוכחית ועדיין לא אושרה) מוצגת כבר מסומנת, כדי שאישור המנהל יהיה פשוט "שמור".
function initEditTagsState(id) {
  const b = findBiz(id);
  if (!b) return;
  const pool = TAGS_BY_CATEGORY_MOCK[b.catKey] || [];
  editSelectedTags = (b.tags || []).slice(0, 2);
  const liveSecond = editSelectedTags[1] || '';
  if (!editSelectedTags[1] && b.tagSecondSuggestion && b.tagSecondSuggestion !== liveSecond && pool.includes(b.tagSecondSuggestion)) {
    editSelectedTags[1] = b.tagSecondSuggestion;
  }
  // הטוגל נפתח כברירת מחדל רק אם יש כבר תגית שנייה *מאושרת בפועל* (liveSecond) — לא בגלל הצעה
  // ממתינה בלבד. פתיחה אוטומטית בגלל הצעה גרמה לתחושת "נסגר לי מיד" (המנהל לא ידע שהטוגל כבר
  // דלוק, ולחיצה ראשונה כיבתה אותו) — ההצעה עצמה עדיין מוצגת בתיבת התרעה עם אשר/דחה בלי לפתוח שום דבר.
  editSecondTagOpen = !!liveSecond;
}

function editTagsAreaHtml(b, catKey) {
  const pool = TAGS_BY_CATEGORY_MOCK[catKey] || [];
  const primaryChips = pool.map(t => `<div class="tag-chip selectable${editSelectedTags[0]===t?' selected':''}" onclick="selectPrimaryTag('${b.id}','${t.replace(/'/g,"\\'")}')">${t}</div>`).join('');
  const liveSecond = (b.tags || [])[1] || '';
  const suggestionHtml = (b.tagSecondSuggestion && b.tagSecondSuggestion !== liveSecond)
    ? `<div class="tag-suggestion-alert">💡 העסק ביקש תגית שנייה: "${b.tagSecondSuggestion}"</div>` : '';
  const freeSuggestionHtml = b.tagSuggestion
    ? `<div class="tag-suggestion-alert">🆕 העסק הציע תגית חדשה: "${b.tagSuggestion}"
        ${editSelectedTags.filter(Boolean).length >= 2
          ? ' — כבר נבחרו 2 תגיות, אי אפשר להוסיף עוד'
          : `<button class="act-btn approve tiny" onclick="addFreeSuggestionToPool('${b.id}','${catKey}')">➕ הוסף לרשימה ובחר (${(CATEGORIES.find(c=>c.key===catKey)||{}).label||catKey})</button>`}
      </div>`
    : '';
  const showSecondRow = !!editSelectedTags[0];
  const secondPool = pool.filter(t => t !== editSelectedTags[0]);
  const secondChips = secondPool.map(t => `<div class="tag-chip selectable${editSelectedTags[1]===t?' selected':''}" onclick="selectSecondTag('${b.id}','${t.replace(/'/g,"\\'")}')">${t}</div>`).join('');
  return `
    <div id="edit_tagsArea_${b.id}">
      <div class="tag-chip-list">${primaryChips || '<span class="tag-chip empty">אין תגיות מוגדרות לקטגוריה זו</span>'}</div>
      ${suggestionHtml}
      ${freeSuggestionHtml}
      ${showSecondRow ? `
      <div class="toggle-row">
        <span>תגית שנייה (אופציונלי)</span>
        <button type="button" class="toggle${editSecondTagOpen?' on':''}" onclick="toggleSecondTag('${b.id}')"></button>
      </div>
      ${editSecondTagOpen ? `<div class="tag-chip-list" style="margin-top:6px">${secondChips || '<span class="tag-chip empty">אין תגיות נוספות בקטגוריה זו</span>'}</div>` : ''}` : ''}
    </div>`;
}

function rerenderEditTagsArea(id) {
  const b = findBiz(id);
  const catKey = document.getElementById('edit_cat_'+id).value;
  const el = document.getElementById('edit_tagsArea_'+id);
  if (el) el.outerHTML = editTagsAreaHtml(b, catKey);
}

window.selectPrimaryTag = function(id, tag) {
  if (editSelectedTags[0] === tag) {
    editSelectedTags = [];
    editSecondTagOpen = false;
  } else {
    editSelectedTags = [tag, ...editSelectedTags.slice(1)].filter(Boolean);
  }
  rerenderEditTagsArea(id);
};

window.selectSecondTag = function(id, tag) {
  editSelectedTags[1] = (editSelectedTags[1] === tag ? undefined : tag);
  editSelectedTags = editSelectedTags.filter(Boolean);
  rerenderEditTagsArea(id);
};

window.toggleSecondTag = function(id) {
  editSecondTagOpen = !editSecondTagOpen;
  if (!editSecondTagOpen) editSelectedTags = editSelectedTags.slice(0, 1);
  rerenderEditTagsArea(id);
};

// "➕ הוסף לרשימה ובחר" בתוך טופס העריכה — מוסיף את ההצעה החופשית (tagSuggestion) לפול התגיות
// של הקטגוריה, ובוחר אותה מיד (ראשית אם ריקה, אחרת שנייה). לא מנקה b.tagSuggestion כאן —
// זה קורה רק בשמירה בפועל (saveBizSec3), בדיוק כמו tagSecondSuggestion.
// catKey מגיע מהקטגוריה שנבחרה *בפועל* בטופס העריכה כרגע (לא בהכרח b.catKey — יכול להשתנות באמצע
// עריכה דרך "קטגוריה ראשית" לפני שנשמר) — כדי שהתגית תתווסף לפול הנכון ותיבחר בהתאם.
window.addFreeSuggestionToPool = function(id, catKey) {
  const b = findBiz(id);
  if (!b || !b.tagSuggestion) return;
  const cat = catKey || b.catKey;
  const pool = TAGS_BY_CATEGORY_MOCK[cat] || (TAGS_BY_CATEGORY_MOCK[cat] = []);
  const tag = b.tagSuggestion;
  if (!pool.includes(tag)) pool.push(tag);
  if (!editSelectedTags[0]) editSelectedTags[0] = tag;
  else if (!editSelectedTags[1]) { editSelectedTags[1] = tag; editSecondTagOpen = true; }
  rerenderEditTagsArea(id);
};

// tab-aware בכוונה: הפונקציה הזו נקראת גם ממקומות מחוץ לטאב "כל העסקים" (למשל בורר הקהל
// במרכז ההודעות, שמשתמש באותם setBizXFilter/filterBizRows/toggleSelectAllBiz בדיוק) — ה-DOM-ים
// הספציפיים (#bizListCol וכו') לא קיימים שם, אז נופלים ל-renderMain מלא. ר' [[feedback_module_scope_onclick]]
// לדוגמה קודמת מאותה משפחת באג (תיקון תלוי-טאב).
function refreshBizList() {
  if (activeTab !== ALL_BIZ_KEY) { renderMain(); return; }
  const list = bizFilteredList();
  if (!list.find(b => b.id === selectedBizDetailId)) {
    selectedBizDetailId = list[0] ? list[0].id : null;
    const dc = document.getElementById('bizDetailCol');
    if (dc) dc.innerHTML = selectedBizDetailId ? bizFullDetailHtml(selectedBizDetailId) : `<div class="placeholder-note">לא נמצאו עסקים</div>`;
  }
  const el = document.getElementById('bizListCol');
  if (el) el.innerHTML = bizRowsHtml();
  const bar = document.getElementById('bizBulkBarWrap');
  if (bar) bar.outerHTML = bizBulkBarHtml();
  const selRow = document.getElementById('bizSelectAllRow');
  if (selRow) selRow.outerHTML = bizSelectAllRowHtml();
}

window.filterBizRows = function(v) {
  bizSearch = v;
  refreshBizList();
};

window.setBizStatusFilter = function(status) {
  bizStatusFilter = status;
  renderMain();
};

window.toggleBizSelect = function(id) {
  if (selectedBizIds.has(id)) selectedBizIds.delete(id); else selectedBizIds.add(id);
  refreshBizList();
};

window.toggleSelectAllBiz = function() {
  const ids = bizFilteredList().map(b => b.id);
  const allSelected = ids.length > 0 && ids.every(id => selectedBizIds.has(id));
  if (allSelected) ids.forEach(id => selectedBizIds.delete(id));
  else ids.forEach(id => selectedBizIds.add(id));
  refreshBizList();
};

// נקרא גם מטאב "שליחת הודעה" (לא רק "כל העסקים") — refreshBizList מעדכן DOM-ים שקיימים רק
// בטאב העסקים, אז כשקוראים מטאב אחר צריך renderMain מלא כדי שהתצוגה שם באמת תתעדכן.
window.clearBizSelection = function() {
  selectedBizIds.clear();
  if (activeTab === ALL_BIZ_KEY) refreshBizList(); else renderMain();
};

// בולק אמיתי — אותה צורת כתיבה כמו admin-businesses.html bulkApprove/bulkReject
window.bulkSetBizStatus = async function(status) {
  const ids = [...selectedBizIds];
  selectedBizIds.clear();
  try {
    if (status === 'approved') {
      await Promise.all(ids.map(async id => {
        const b = bizById(id);
        if (!b || b.status !== 'pending') return;
        await updateDoc(doc(db, 'businesses', id), { status: 'approved', approvedAt: serverTimestamp(), ownerEmailStatus: 'pending' });
        await approveLinkedMember(b);
      }));
    } else {
      await Promise.all(ids.map(id => {
        const b = bizById(id);
        if (!b || b.status !== 'pending') return Promise.resolve();
        return updateDoc(doc(db, 'businesses', id), { status: 'rejected', rejectedAt: serverTimestamp() });
      }));
    }
  } catch (e) { console.error(e); alert('שגיאה בפעולה גורפת: ' + e.message); }
};

function bizBulkBarHtml() {
  const count = selectedBizIds.size;
  if (!count) return `<div id="bizBulkBarWrap"></div>`;
  return `
    <div id="bizBulkBarWrap">
      <div class="biz-bulk-bar">
        <span>נבחרו ${count}</span>
        <span class="sp"></span>
        <button class="biz-bulk-btn approve" onclick="bulkSetBizStatus('approved')">✅ אשר נבחרים</button>
        <button class="biz-bulk-btn reject" onclick="bulkSetBizStatus('rejected')">✗ דחה נבחרים</button>
        <button class="biz-bulk-btn" onclick="openBroadcastFor('businesses')">📣 שלח הודעה לנבחרים</button>
        <button class="biz-bulk-btn cancel" onclick="clearBizSelection()">ביטול</button>
      </div>
    </div>`;
}

          <option value="rejected" ${bizStatusFilter==='rejected'?'selected':''}>נדחו</option>
        </select>
        <select class="filter-select" onchange="setBizCategoryFilter(this.value)">
          <option value="all">כל הקטגוריות</option>
          ${CATEGORIES.map(c => `<option value="${c.key}" ${bizCategoryFilter===c.key?'selected':''}>${c.icon} ${c.label}</option>`).join('')}
        </select>
        <select class="filter-select" onchange="setBizSort(this.value)">
          <option value="newest" ${bizSort==='newest'?'selected':''}>מיון: החדשים ביותר</option>
          <option value="oldest" ${bizSort==='oldest'?'selected':''}>מיון: הוותיקים ביותר</option>
          <option value="clicks" ${bizSort==='clicks'?'selected':''}>מיון: הכי הרבה קליקים</option>
          <option value="likes" ${bizSort==='likes'?'selected':''}>מיון: הכי הרבה לייקים</option>
          <option value="reviewedAsc" ${bizSort==='reviewedAsc'?'selected':''}>מיון: הכי פחות שלבים נסקרו</option>
          <option value="reviewedDesc" ${bizSort==='reviewedDesc'?'selected':''}>מיון: הכי הרבה שלבים נסקרו (מוכנים לאישור)</option>
        </select>
        <button class="filter-pill ${bizAdvancedOpen?'active':''}" onclick="toggleBizAdvanced()">⚙️ עוד סינונים${advancedActiveCount ? ` <span class="biz-changes-badge">${advancedActiveCount}</span>` : ''}</button>
        ${hasActiveFilters ? `<button class="filter-clear" onclick="clearBizFilters()">נקה סינון</button>` : ''}
        <input class="filter-search-input" type="search" placeholder="🔍 חיפוש לפי שם, עיר או קטגוריה..." value="${bizSearch}" oninput="filterBizRows(this.value)">
      </div>
      ${bizSelectAllRowHtml()}
      ${bizAdvancedOpen ? `
      <div class="filter-toolbar-row">
        <select class="filter-select" onchange="setBizTypeFilter(this.value)">
          <option value="all">כל סוגי העסק</option>
          <option value="physical" ${bizTypeFilter==='physical'?'selected':''}>🏪 חנות פיזית</option>
          <option value="online" ${bizTypeFilter==='online'?'selected':''}>🌐 אונליין</option>
          <option value="pro" ${bizTypeFilter==='pro'?'selected':''}>🔧 בעל מקצוע / נותן שירות</option>
        </select>
        <select class="filter-select" onchange="setBizReviewFilter(this.value)">
          <option value="all">כל מצבי הסקירה</option>
          <option value="incomplete" ${bizReviewFilter==='incomplete'?'selected':''}>לא נסקר במלואו (&lt;${BIZ_REVIEW_SECTIONS.length}/${BIZ_REVIEW_SECTIONS.length})</option>
          <option value="complete" ${bizReviewFilter==='complete'?'selected':''}>נסקר במלואו (${BIZ_REVIEW_SECTIONS.length}/${BIZ_REVIEW_SECTIONS.length})</option>
        </select>
        <select class="filter-select" onchange="setBizHealthFilter(this.value)">
          <option value="all">כל רמות שלמות הכרטיס</option>
          <option value="incomplete" ${bizHealthFilter==='incomplete'?'selected':''}>⚠️ פרופיל לא שלם (&lt;100%)</option>
          <option value="complete" ${bizHealthFilter==='complete'?'selected':''}>פרופיל מלא (100%)</option>
        </select>
        <select class="filter-select" onchange="setBizDateRangeFilter(this.value)">
          <option value="all">כל התאריכים</option>
          <option value="7" ${bizDateRangeFilter==='7'?'selected':''}>נרשמו ב-7 הימים האחרונים</option>
          <option value="30" ${bizDateRangeFilter==='30'?'selected':''}>נרשמו ב-30 הימים האחרונים</option>
          <option value="90" ${bizDateRangeFilter==='90'?'selected':''}>נרשמו ב-90 הימים האחרונים</option>
        </select>
      </div>` : ''}
    </div>`;
}

// לא ספירה קבועה לכל סטטוס (זה היה תמיד למעלה) — רק מספר אחד, כמה עסקים מוצגים כרגע לפי הסינון
// הפעיל בפועל (כולל סטטוס) — מתעדכן בכל שינוי סינון, "כל מה שאבחר שיקבל מספור".
function bizSelectAllRowHtml() {
  const ids = bizFilteredList().map(b => b.id);
  const allSelected = ids.length > 0 && ids.every(id => selectedBizIds.has(id));
  return `
    <div class="biz-select-all-row" id="bizSelectAllRow">
      <button class="biz-select-all-btn ${allSelected?'active':''}" onclick="toggleSelectAllBiz()">${allSelected ? '☑ בטל בחירת הכל' : '☐ בחר הכל'}</button>
      <span class="biz-sel-count">מציג ${ids.length} עסקים${selectedBizIds.size ? ` · ${selectedBizIds.size} נבחרו` : ''}</span>
    </div>`;
}

// המספרים הכוללים (נרשמו/ממתינים/פעילים) מוצגים בסרגל ה-KPI בדשבורד הראשי — לא כפולים כאן,
// כדי לא לחזור על אותו מידע פעמיים (לבקשת המשתמש).
function bizListHtml() {
  const list = bizFilteredList();
  if (selectedBizDetailId == null || !list.find(b => b.id === selectedBizDetailId)) {
    selectedBizDetailId = list[0] ? list[0].id : null;
  }
  return `
    ${notConnectedBannerHtml()}
    ${bizFilterBarHtml()}
    ${bizBulkBarHtml()}
    <div class="task-split ${bizMobileShowDetail?'mobile-show-detail':''}" id="bizSplit">
      <div class="task-list-col" id="bizListCol">${bizRowsHtml()}</div>
      <div class="task-detail-col" id="bizDetailCol">${selectedBizDetailId ? bizFullDetailHtml(selectedBizDetailId) : '<div class="placeholder-note">לא נמצאו עסקים</div>'}</div>
    </div>`;
}

// ══════════════════════════════════════════════════════════════════
// כל האוהדים — סטטיסטיקה + סינון + Master-Detail (מקביל ל"כל העסקים")
// ══════════════════════════════════════════════════════════════════

let fanSearch = '';
let fanStatusFilter = 'all';   // 'all' | 'pending' | 'approved' | 'rejected'
let fanSort = 'newest';        // 'newest' | 'oldest'
let fanDateRangeFilter = 'all'; // 'all' | '7' | '30' | '90' (ימים אחורה מהיום)
let selectedFanIds = new Set();
let selectedFanDetailId = null;
let fanMobileShowDetail = false;

window.setFanSort = function(v) { fanSort = v; renderMain(); };
window.setFanDateRangeFilter = function(v) { fanDateRangeFilter = v; renderMain(); };
window.clearFanFilters = function() {
  fanSearch = ''; fanStatusFilter = 'all'; fanSort = 'newest'; fanDateRangeFilter = 'all';
  renderMain();
};

function fanFilteredList() {
  const q = fanSearch.trim();
  const now = Date.now();
  const list = MOCK_FANS.filter(f => {
    const matchF = fanStatusFilter === 'all' ? true : f.status === fanStatusFilter;
    const matchQ = !q || f.name.includes(q) || f.phone.includes(q) || f.email.includes(q);
    const matchRange = fanDateRangeFilter === 'all' || (now - f.registeredAt.getTime()) <= Number(fanDateRangeFilter) * 86400000;
    return matchF && matchQ && matchRange;
  });
  return list.sort((a, b) => {
    if (fanSort === 'oldest') return a.registeredAt - b.registeredAt;
    if (fanSort === 'unverifiedFirst') return (a.adminVerified?1:0) - (b.adminVerified?1:0);
    if (fanSort === 'verifiedFirst') return (b.adminVerified?1:0) - (a.adminVerified?1:0);
    return b.registeredAt - a.registeredAt; // newest — ברירת מחדל
  });
}

function fanStatusChipHtml(f) {
  if (f.status === 'approved') return `<span class="biz-status-badge approved">✓ אושר</span>`;
  if (f.status === 'rejected') return `<span class="biz-status-badge rejected">✗ נדחה</span>`;
  return `<span class="biz-status-badge pending">📅 נרשם ${fmtDate(f.registeredAt)}</span>`;
}

// באדג'ים "✓ מנוי"/"לא מנוי" + "🏪 בעל עסק: <שם העסק>" (לא סתם "כן") — משותף לכל מקום שמציג שורת/כרטיס אוהד
function fanBadgesHtml(f) {
  const subBadge = f.isSubscriber ? `<span class="tag-chip">✓ מנוי</span>` : `<span class="tag-chip empty">לא מנוי</span>`;
  const linkedBiz = f.isBusinessOwner ? findBiz(f.linkedBusinessId) : null;
  const ownerBadge = f.isBusinessOwner ? `<span class="tag-chip">🏪 ${linkedBiz ? linkedBiz.name : 'בעל עסק'}</span>` : '';
  const verifyBadge = f.adminVerified
    ? `<span class="biz-status-badge approved">✓ נבדק</span>`
    : `<span class="biz-status-badge pending">⏳ טרם נבדק</span>`;
  const noteBadge = f.adminNote ? `<span class="tag-chip" title="יש הערת מנהל">📝</span>` : '';
  return `${verifyBadge}${subBadge}${ownerBadge}${noteBadge} `;
}

function fanRowsHtml() {
  const shown = fanFilteredList();
  if (!shown.length) return `<div class="placeholder-note">לא נמצאו אוהדים</div>`;
  const chipLabel = f => f.status === 'approved' ? '✓ אושר' : f.status === 'rejected' ? '✗ נדחה' : 'ממתין';
  return shown.map(f => {
    const sel = selectedFanIds.has(f.id);
    const active = f.id === selectedFanDetailId;
    return `
      <div class="task-row ${f.status} ${active?'active':''} ${sel?'selected':''}" onclick="selectFanDetail('${f.id}')">
        <div class="task-row-top">
          <div class="task-row-check" onclick="event.stopPropagation();toggleFanSelect('${f.id}')">${sel ? '✓' : ''}</div>
          <div class="task-row-body">
            <div class="task-row-name">${f.name}${f.phone ? ` <button class="icon-btn" title="שלח וואטסאפ" onclick="event.stopPropagation();sendFanWA('${f.phone}','${f.name}','${f.loginCode||''}')">📲</button>` : ''}${f.email ? ` <button class="icon-btn" title="שלח מייל" onclick="event.stopPropagation();sendFanMail('${f.email}','${f.name}','${f.loginCode||''}')">✉️</button>` : ''}</div>
            <div class="task-row-meta">${fanBadgesHtml(f)}${f.status === 'pending' ? `ממתין ${agoLabel(f.registeredAt)}` : ''}</div>
          </div>
          <span class="task-row-chip ${f.status}">${chipLabel(f)}</span>
          <span class="task-row-chevron">›</span>
        </div>
      </div>`;
  }).join('');
}

window.selectFanDetail = function(id) {
  selectedFanDetailId = id;
  fanMobileShowDetail = true;
  const lc = document.getElementById('fanListCol');
  const dc = document.getElementById('fanDetailCol');
  const sp = document.getElementById('fanSplit');
  if (lc) lc.innerHTML = fanRowsHtml();
  if (dc) dc.innerHTML = fanFullDetailHtml(id);
  if (sp) sp.classList.add('mobile-show-detail');
};

window.fanBackToList = function() {
  fanMobileShowDetail = false;
  const sp = document.getElementById('fanSplit');
  if (sp) sp.classList.remove('mobile-show-detail');
};

function fanFullDetailHtml(id, opts) {
  const f = MOCK_FANS.find(x => x.id === id);
  if (!f) return `<div class="placeholder-note">אוהד לא נמצא</div>`;
  const o = Object.assign({ backFn: 'fanBackToList' }, opts || {});
  // קוד כניסה+לינק דשבורד עסק מקושר+סטטוס מייל — זהה למה שנוסף היום ב-admin-members.html (עליון בגיליון)
  const fanLoginCodeChip = (f.status === 'approved' && f.loginCode) ? `<span class="tag-chip">🔑 ${f.loginCode}</span>` : '';
  const fanEmailStatusChip = (f.status === 'approved' && f.loginCode) ? `<span class="tag-chip${f.loginCodeEmailStatus === 'sent' ? '' : ' empty'}">${
    f.loginCodeEmailStatus === 'sent' ? '✅ מייל נשלח' : f.loginCodeEmailStatus === 'failed' ? '❌ מייל נכשל' : '⏳ מייל ממתין'
  }</span>` : '';
  const linkedBiz = f.isBusinessOwner ? (findBiz(f.linkedBusinessId) || MOCK_BUSINESSES.find(b => b.ownerMemberId === f.id)) : null;
  const fanBizDashChip = (linkedBiz && linkedBiz.accessToken)
    ? `<a href="business-dashboard.html?token=${linkedBiz.accessToken}" target="_blank" class="tag-chip" style="text-decoration:none">🏪 דשבורד ${linkedBiz.name}</a>`
    : '';
  const actionsTop = `
    <div class="approve-card-actions top">
      ${f.status === 'pending' ? `<button class="act-btn approve" title="שולח אוטומטית מייל אישור עם קוד כניסה (Brevo)" onclick="approveFan('${f.id}')">✅ אשר</button>
      <button class="act-btn reject" onclick="rejectFan('${f.id}')">✗ דחה</button>` : ''}
      <button class="act-btn reject" onclick="deleteFan('${f.id}')">🗑️ מחק</button>
    </div>`;
  return `
    <button class="act-btn task-back-btn" onclick="${o.backFn}()">→ חזרה</button>
    <div class="approve-card">
      <div class="approve-card-head">
        <div class="approve-card-title">${f.name} ${fanBizDashChip}${fanLoginCodeChip}${f.phone ? ` <button class="icon-btn" title="שלח וואטסאפ" onclick="sendFanWA('${f.phone}','${f.name}','${f.loginCode||''}')">📲</button>` : ''}${f.email ? ` <button class="icon-btn" title="שלח מייל" onclick="sendFanMail('${f.email}','${f.name}','${f.loginCode||''}')">✉️</button>` : ''}</div>
        <div class="approve-card-meta">נרשם ${fmtDate(f.registeredAt)} (${agoLabel(f.registeredAt)})${fanEmailStatusChip ? ' · ' + fanEmailStatusChip : ''}</div>
      </div>
      ${actionsTop}
      ${fanEmailHistoryHtml(f)}
      <div class="approve-field">
        <div class="approve-field-label">סטטוס</div>
        ${fanStatusChipHtml(f)}
        ${f.reviewFlag === 'name_mismatch' ? '<div class="health-missing" style="font-size:11.5px">⚠️ דגל בדיקה: שם לא תואם רשומה קודמת (דדופ-הרשמה) — טרם סומן כנבדק</div>' : ''}
      </div>
      <div class="approve-field">
        <div class="approve-field-label">🔍 בדיקת מנהל</div>
        <label class="sec-reviewed-toggle" style="font-size:13px">
          <input type="checkbox" ${f.adminVerified ? 'checked' : ''} onchange="toggleFanVerified('${f.id}', this.checked)">
          ${f.adminVerified ? '✓ נבדק ואומת ע"י מנהל' : 'סמן כנבדק ואומת ע"י מנהל'}
        </label>
        <label class="edit-field full" style="margin-top:8px">
          <span>הערה לעצמי (למנהלים בלבד, לא גלוי לאוהד)</span>
          <textarea id="fanNote_${f.id}" rows="2" placeholder="למשל: התקשרתי לוודא, הכל תקין..." onblur="saveFanNote('${f.id}', this.value)">${f.adminNote || ''}</textarea>
        </label>
      </div>
      <div class="approve-field">
        <div class="approve-field-label">פרטי קשר ואימות מנוי <button class="sec-edit-btn" style="font-size:11px" onclick="toggleFanEdit('${f.id}')">✏️ ערוך</button></div>
        <div id="fanView_${f.id}">
          <div class="approve-longtext">
            ${f.firstName || ''} ${f.lastName || ''}<br>
            ${f.phone} <button class="icon-btn" title="שלח וואטסאפ" onclick="sendFanWA('${f.phone}','${f.name}','${f.loginCode||''}')">📲</button><br>
            ${f.email} <button class="icon-btn" title="שלח מייל" onclick="sendFanMail('${f.email}','${f.name}','${f.loginCode||''}')">✉️</button>
          </div>
          <div class="approve-longtext">${f.isSubscriber
            ? `מנוי בפועל · ${f.subscriberSection} · מס' מנוי ${f.subscriberNumber}`
            : `לא מנוי כרגע (היה מנוי בעבר: ${f.wasSubscriber === 'yes' ? 'כן' : 'לא'})${f.facebookUrl ? '<br>🔗 ' + f.facebookUrl : ''}`}</div>
        </div>
        <div id="fanEdit_${f.id}" class="sec-edit-form">
          <div class="form-row-2">
            <div class="form-row" style="margin:0"><label>שם פרטי</label><input type="text" id="fanEditFirst_${f.id}" value="${esc(f.firstName || '')}" /></div>
            <div class="form-row" style="margin:0"><label>שם משפחה</label><input type="text" id="fanEditLast_${f.id}" value="${esc(f.lastName || '')}" /></div>
          </div>
          <div class="form-row-2" style="margin-top:10px">
            <div class="form-row" style="margin:0"><label>טלפון</label><input type="tel" id="fanEditPhone_${f.id}" value="${esc(f.phone || '')}" /></div>
            <div class="form-row" style="margin:0"><label>אימייל</label><input type="email" id="fanEditEmail_${f.id}" value="${esc(f.email || '')}" /></div>
          </div>
          <div class="form-row" style="margin-top:10px">
            <label>מנוי בפועל?</label>
            <select id="fanEditIsSub_${f.id}" onchange="onFanEditSubChange('${f.id}')">
              <option value="yes" ${f.isSubscriber ? 'selected' : ''}>כן, מנוי</option>
              <option value="no" ${!f.isSubscriber ? 'selected' : ''}>לא מנוי</option>
            </select>
          </div>
          <div id="fanEditSubFields_${f.id}" style="display:${f.isSubscriber ? 'grid' : 'none'};margin-top:10px" class="form-row-2">
            <div class="form-row" style="margin:0"><label>שער</label><input type="text" id="fanEditGate_${f.id}" value="${esc(f.subscriberSection || '')}" /></div>
            <div class="form-row" style="margin:0"><label>מס' מנוי</label><input type="text" id="fanEditSubNum_${f.id}" value="${esc(f.subscriberNumber || '')}" /></div>
          </div>
          <div id="fanEditNoSubFields_${f.id}" style="display:${f.isSubscriber ? 'none' : 'block'};margin-top:10px">
            <div class="form-row" style="margin:0 0 10px">
              <label>היה מנוי בעבר?</label>
              <select id="fanEditWasSub_${f.id}"><option value="yes" ${f.wasSubscriber==='yes'?'selected':''}>כן</option><option value="no" ${f.wasSubscriber!=='yes'?'selected':''}>לא</option></select>
            </div>
            <div class="form-row" style="margin:0"><label>קישור פייסבוק</label><input type="text" id="fanEditFbUrl_${f.id}" value="${esc(f.facebookUrl || '')}" /></div>
          </div>
          <div class="edit-btn-row" style="margin-top:12px">
            <button class="btn btn-reject" onclick="toggleFanEdit('${f.id}')" style="flex:none;padding:10px 18px">ביטול</button>
            <button class="btn btn-approve" onclick="saveFanDetails('${f.id}')" style="flex:1">💾 שמור</button>
          </div>
        </div>
      </div>
      <div class="approve-field">
        <div class="approve-field-label">🖼️ תמונת הוכחה</div>
        <div class="approve-longtext">${f.hasProofPhoto ? 'הועלתה תמונת הוכחה' : 'לא הועלתה תמונת הוכחה'}</div>
      </div>
      ${f.isBusinessOwner ? `
      <div class="approve-field">
        <div class="approve-field-label">🏪 בעל עסק</div>
        <div class="approve-longtext">כן — מקושר לעסק: ${(findBiz(f.linkedBusinessId) || {}).name || f.linkedBusinessId}</div>
      </div>` : ''}
    </div>`;
}

// בדיקת-מנהל ידנית לאוהד — נפרד מ-status (אשר/דחה) ומ-reviewFlag האוטומטי, זמין בכל מקום שמציג כרטיס אוהד מלא
// (גם "אוהדים ממתינים" בדשבורד הראשי וגם "כל האוהדים") כי שניהם משתמשים באותו fanFullDetailHtml.
// adminVerified/adminNote לא היו קיימים בכלל בסכימת members האמיתית — הם שדות סקלריים חדשים, בטוחים
// להוספה (בלי התנגשות עם שדה קיים, לא נקראים משום קוד אחר באתר) — נוספו כאן לראשונה בפועל.
window.toggleFanEdit = function(id) {
  const view = document.getElementById('fanView_' + id);
  const edit = document.getElementById('fanEdit_' + id);
  if (!edit) return;
  const opening = !edit.classList.contains('open');
  edit.classList.toggle('open', opening);
  if (view) view.style.display = opening ? 'none' : '';
};
window.onFanEditSubChange = function(id) {
  const isSub = document.getElementById('fanEditIsSub_' + id).value === 'yes';
  const subEl = document.getElementById('fanEditSubFields_' + id);
  const noSubEl = document.getElementById('fanEditNoSubFields_' + id);
  if (subEl) subEl.style.display = isSub ? 'grid' : 'none';
  if (noSubEl) noSubEl.style.display = isSub ? 'none' : 'block';
};
// עריכת פרטים אישיים+אימות מנוי — זהה ל-admin-members.html saveEditBtn (שדות אמיתיים בלבד)
window.saveFanDetails = async function(id) {
  const isSub = document.getElementById('fanEditIsSub_' + id).value === 'yes';
  const updates = {
    firstName: document.getElementById('fanEditFirst_' + id).value.trim(),
    lastName: document.getElementById('fanEditLast_' + id).value.trim(),
    phone: document.getElementById('fanEditPhone_' + id).value.trim(),
    email: document.getElementById('fanEditEmail_' + id).value.trim(),
    isSubscriber: isSub,
    subscriberSection: isSub ? document.getElementById('fanEditGate_' + id).value.trim() : null,
    subscriberNumber: isSub ? document.getElementById('fanEditSubNum_' + id).value.trim() : null,
    wasSubscriber: isSub ? null : document.getElementById('fanEditWasSub_' + id).value,
    facebookUrl: isSub ? null : document.getElementById('fanEditFbUrl_' + id).value.trim(),
  };
  try {
    await updateDoc(doc(db, 'members', id), updates);
    const f = findFan(id);
    if (f) Object.assign(f, updates, { name: `${updates.firstName} ${updates.lastName}`.trim() || '—' });
    renderMain();
  } catch (e) { console.error(e); alert('שגיאה בשמירה: ' + e.message); }
};

window.toggleFanVerified = async function(id, checked) {
  const f = findFan(id);
  if (!f) return;
  try {
    await updateDoc(doc(db, 'members', id), { adminVerified: checked });
    f.adminVerified = checked;
    renderMain();

// בולק אמיתי — אותה צורת כתיבה כמו admin-members.html bulkApprove/bulkReject
window.bulkSetFanStatus = async function(status) {
  const ids = [...selectedFanIds];
  selectedFanIds.clear();
  try {
    if (status === 'approved') {
      await Promise.all(ids.map(async id => {
        const f = MOCK_FANS.find(x => x.id === id);
        if (!f || f.status !== 'pending') return;
        const memberNumber = await allocateMemberNumber();
        const loginCode = await generateLoginCode();
        await updateDoc(doc(db, 'members', id), {
          status: 'approved', approvedAt: serverTimestamp(), rejectedAt: null,
          memberNumber, loginCode, loginCodeCreatedAt: serverTimestamp(), loginCodeEmailStatus: 'pending'
        });
      }));
    } else {
      await Promise.all(ids.map(id => {
        const f = MOCK_FANS.find(x => x.id === id);
        if (!f || f.status !== 'pending') return Promise.resolve();
        return updateDoc(doc(db, 'members', id), { status: 'rejected', rejectedAt: serverTimestamp() });
      }));
    }
  } catch (e) { console.error(e); alert('שגיאה בפעולה גורפת: ' + e.message); }
};

// זמן טיפול ממוצע אמיתי — הפרש registeredAt→approvedAt על כל האוהדים+העסקים שכבר אושרו בפועל
function avgHandlingTimeLabel() {
  const durations = [];
  MOCK_FANS.forEach(f => { if (f.status === 'approved' && f.approvedAt && f.registeredAt) durations.push(f.approvedAt - f.registeredAt); });
  MOCK_BUSINESSES.forEach(b => { if (b.status === 'approved' && b.approvedAt && b.registeredAt) durations.push(b.approvedAt - b.registeredAt); });
  if (!durations.length) return '—';
  const hours = (durations.reduce((a, x) => a + x, 0) / durations.length) / 3600000;
  return hours < 48 ? `${hours.toFixed(1)} שעות` : `${(hours / 24).toFixed(1)} ימים`;
}
function homeStatsHtml() {
  const pendingFans = MOCK_FANS.filter(f => f.status === 'pending').length;
  const pendingBiz = MOCK_BUSINESSES.filter(b => b.status === 'pending').length;
  const pendingChanges = MOCK_BUSINESSES.filter(bizHasAnyPendingChange).length;
  const approvedBiz = MOCK_BUSINESSES.filter(b => b.status === 'approved').length;
  const openTasks = pendingFans + pendingBiz + pendingChanges;
  const weekAgo = Date.now() - 7 * 86400000;
  const newFansThisWeek = MOCK_FANS.filter(f => f.registeredAt && f.registeredAt.getTime() >= weekAgo).length;
  const kpi = (num, lbl, alert) => `<div class="kpi-item ${alert?'alert':''}"><span class="kpi-num">${num}</span><span class="kpi-lbl">${lbl}</span></div>`;
  return `
    <div class="kpi-strip">
      ${kpi(openTasks, '🔔 משימות פתוחות', true)}
      <div class="kpi-divider"></div>
      ${kpi(avgHandlingTimeLabel(), '⏱ זמן טיפול ממוצע')}
      <div class="kpi-divider"></div>
      ${kpi(`${approvedBiz}/${MOCK_BUSINESSES.length}`, '🏬 עסקים פעילים מתוך רשומים')}
      <div class="kpi-divider"></div>
      <div class="kpi-item"><span class="kpi-num">${MOCK_FANS.length}</span><span class="kpi-lbl">👥 אוהדים רשומים</span><span class="kpi-delta">+${newFansThisWeek} השבוע</span></div>
    </div>`;
  // "כניסות ב-24 שעות" הוסר בכוונה — אין שום מעקב session/login אמיתי במערכת (לא ב-members, לא
  // בשום מקום אחר) שממנו אפשר לחשב מספר כזה; הצגת מספר קבוע כאילו הוא אמיתי הייתה מטעה.
}

// מיון לכל אחת מ-4 לשוניות מרכז המשימות — עד עכשיו היה קבוע בקוד בלי אפשרות למנהל לשנות, ר' PROJECT_CONTEXT.md §47
let taskSort = { fans: 'newest', businesses: 'reviewedAsc', changes: 'newest', health: 'leastHealthy' };
window.setTaskSort = function(key, v) { taskSort[key] = v; renderMain(); };
// סינון לפי סוג ב"שינויים לעסקים" — 'all'/'details' (pendingChangeDiff)/'tag' (תגית שנייה+הצעת תגית)/
// 'category' (מופיע גם תחת+הערה)/'note' (כתבו לנו) — כדי לראות ספציפית מה מחכה, לא רק "יש משהו"
let changesTypeFilter = 'all';
window.setChangesTypeFilter = function(v) { changesTypeFilter = v; renderMain(); };
const CHANGES_TYPE_OPTIONS = [['all','הכל'], ['details','שינוי פרטים'], ['tag','תגית'], ['category','קטגוריה'], ['note','כתבו לנו']];
function bizMatchesChangesType(b, type) {
  if (type === 'all') return true;
  if (type === 'details') return !!b.pendingChangeDiff;
  if (type === 'tag') return bizHasPendingTagSuggestion(b);
  if (type === 'category') return bizHasPendingCategoryRequest(b);
  if (type === 'note') return bizHasUnhandledNote(b);
  return true;
}
const TASK_SORT_OPTIONS = {
  fans: [['newest','החדשים ביותר'], ['oldest','הוותיקים ביותר'], ['unverifiedFirst','טרם נבדק קודם'], ['verifiedFirst','נבדק קודם']],
  businesses: [['reviewedAsc','הכי פחות שלבים נסקרו'], ['reviewedDesc','הכי הרבה שלבים נסקרו'], ['newest','החדשים ביותר'], ['oldest','הוותיקים ביותר']],
  health: [['leastHealthy','הכי פחות בריא'], ['mostHealthy','הכי בריא']],
  changes: [['newest','החדשים ביותר'], ['oldest','הוותיקים ביותר']],
};
function taskSortBarHtml(key) {
  const opts = TASK_SORT_OPTIONS[key];
  if (!opts) return '';
  return `
    <div class="filter-toolbar">
      <div class="filter-toolbar-row">
        ${key === 'changes' ? `
        <select class="filter-select" onchange="setChangesTypeFilter(this.value)">
          ${CHANGES_TYPE_OPTIONS.map(([v, l]) => `<option value="${v}" ${changesTypeFilter===v?'selected':''}>סוג: ${l}</option>`).join('')}
        </select>` : ''}
        <select class="filter-select" onchange="setTaskSort('${key}', this.value)">
          ${opts.map(([v, l]) => `<option value="${v}" ${taskSort[key]===v?'selected':''}>מיון: ${l}</option>`).join('')}
        </select>
      </div>
    </div>`;
}

function taskListForSubtab(key) {
  if (key === 'fans') return MOCK_FANS.filter(f => f.status === 'pending')
    .slice().sort((a, b) => {
      if (taskSort.fans === 'oldest') return a.registeredAt - b.registeredAt;
      if (taskSort.fans === 'unverifiedFirst') return (a.adminVerified?1:0) - (b.adminVerified?1:0);
      if (taskSort.fans === 'verifiedFirst') return (b.adminVerified?1:0) - (a.adminVerified?1:0);
      return b.registeredAt - a.registeredAt; // newest — ברירת מחדל
    })
    .map(f => ({ id:f.id, title:f.name, meta:`${fanBadgesHtml(f)}ממתין ${agoLabel(f.registeredAt)}` }));
  if (key === 'businesses') return MOCK_BUSINESSES.filter(b => b.status === 'pending')
    .slice().sort((a, b) => {
      if (taskSort.businesses === 'reviewedDesc') return bizReviewedCount(b) - bizReviewedCount(a);
      if (taskSort.businesses === 'newest') return b.registeredAt - a.registeredAt;
      if (taskSort.businesses === 'oldest') return a.registeredAt - b.registeredAt;
      return bizReviewedCount(a) - bizReviewedCount(b); // reviewedAsc — ברירת מחדל, דע איפה נדרש טיפול
    })
    .map(b => ({ id:b.id, title:`${b.name}`, meta:`${bizReviewBadgeHtml(b)}${b.ownerIsSubscriber ? '<span class="tag-chip">✓ מנוי</span>' : '<span class="tag-chip empty">לא מנוי</span>'} ${bizMetaStr(b)} · ממתין ${agoLabel(b.registeredAt)}` }));
  if (key === 'health') return MOCK_BUSINESSES.filter(b => b.status === 'approved')
    .slice().sort((a,b) => taskSort.health === 'mostHealthy' ? b.healthScore - a.healthScore : a.healthScore - b.healthScore)
    .map(b => ({ id:b.id, title:`${b.name}`, meta:`${bizMetaStr(b)} · ${b.healthScore}% · ${missingFieldsFor(b).length ? 'חסר: ' + missingFieldsFor(b).join(', ') : '✓ פרופיל מלא'}` }));
  return MOCK_BUSINESSES.filter(b => bizHasAnyPendingChange(b) && bizMatchesChangesType(b, changesTypeFilter))
    .slice().sort((a, b) => {
      const da = a.changeSubmittedAt || a.registeredAt, db = b.changeSubmittedAt || b.registeredAt;
      return taskSort.changes === 'oldest' ? da - db : db - da;
    })
    .map(b => {
      // עסק יכול להיות כאן בגלל כמה סיבות ביחד — המטא משקף מה בדיוק ממתין
      const reasons = [];
      if (b.pendingChangeDiff) reasons.push('בקשת עדכון פרטים');
      if (bizHasPendingTagSuggestion(b)) reasons.push('הצעת תגית');
      if (bizHasPendingCategoryRequest(b)) reasons.push('בקשת קטגוריה');
      if (bizHasUnhandledNote(b)) reasons.push('💬 כתבו לנו');
      return { id:b.id, title:`${b.name}`, meta:`${bizMetaStr(b)} · ${reasons.join(' + ')} · ממתין ${agoLabel(b.changeSubmittedAt || b.registeredAt)}` };
    });
}

// מגבלת-האמת היא רוחב פיקסלים בפועל (ensureFitsCard), לא ספירת תווים — התווית מציגה "מתאים/חורג"
// לפי מדידה אמיתית, בדיוק כמו business-dashboard.html, כדי שלא יהיה פער בין מה שהמנהל רואה לביניהם
// לבין מה שבאמת יוצג בכרטיס במובייל.
function aiTitleFitLabel(val) {
  const t = (val || '').trim();
  if (!t) return { over: false, text: '' };
  const fits = measureTextWidth(t, CARD_TITLE_FONT) <= CARD_TITLE_MAX_WIDTH;
  return { over: !fits, text: fits ? '✓ נכנס בכרטיס' : '⚠️ חורג מרוחב הכרטיס — יקוצר אוטומטית בשמירה' };
}
// opts.standalone — מציג גם כפתור "שמור כותרת" עצמאי (בתצוגה הרגילה, לא בתוך טופס עריכה) — כך
// שאפשר לראות/לרענן/לבחור כותרת בלי לפתוח את כל עריכת שלב 4 (המשתמש: "בלי ללחוץ... כבר מבחוץ").
// הכרטיס המאוחד מרנדר גם תצוגה וגם טופס-עריכה בו-זמנית (רק אחד גלוי, ר' bizFullDetailHtml) — כלומר
// שני עותקים של השדה הזה קיימים ב-DOM בו-זמנית. משתמשים ב-data-attribute (לא id ייחודי) ומעדכנים
// את כל ההעתקים ביחד עם querySelectorAll, כדי שלא יתנגשו ושיישארו מסונכרנים.
function aiTitleFieldHtml(b, opts) {
  const standalone = opts && opts.standalone;
  const val = bizAiTitleEdits[b.id] !== undefined ? bizAiTitleEdits[b.id] : b.aiShortTitle;
  const fit = aiTitleFitLabel(val);
  return `
    <div class="approve-field">
      <div class="approve-field-label">🤖 כותרת מקוצרת מוצעת (AI) — מוצגת בכרטיס באינדקס</div>
      <div class="ai-title-box">
        <span class="ai-title-tag">AI</span>
        <input type="text" value="${val || ''}" maxlength="40" data-ai-title-input="${b.id}" oninput="setBizAiTitle('${b.id}', this.value)">
      </div>
      <div class="char-count ${fit.over?'over':''}" data-ai-title-len="${b.id}">${fit.text}</div>
      <button type="button" class="act-btn tiny" style="margin-top:6px" onclick="regenerateAiTitles('${b.id}')" data-ai-title-regen="${b.id}">🔄 הצע 3 כותרות AI</button>
      <div data-ai-title-options="${b.id}" class="ai-title-options"></div>
      ${standalone ? `<button type="button" class="act-btn approve tiny" style="margin-top:6px" onclick="saveBizAiTitleOnly('${b.id}')">💾 שמור כותרת</button>` : ''}
    </div>`;
}
// שמירה עצמאית של הכותרת בלבד (מתוך התצוגה הרגילה, standalone:true) — לא נוגעת בשאר שדות הטבה 1
window.saveBizAiTitleOnly = async function(id) {
  const b = findBiz(id);
  if (!b) return;
  const discountText = ensureFitsCard(bizAiTitleEdits[id] !== undefined ? bizAiTitleEdits[id] : (b.aiShortTitle || ''));
  delete bizAiTitleEdits[id];
  await saveSectionUpdates(id, { discountText });
};
window.setBizAiTitle = function(id, v) {
  bizAiTitleEdits[id] = v;
  const fit = aiTitleFitLabel(v);
  document.querySelectorAll(`[data-ai-title-len="${id}"]`).forEach(el => { el.textContent = fit.text; el.classList.toggle('over', fit.over); });
  document.querySelectorAll(`[data-ai-title-input="${id}"]`).forEach(el => { if (el.value !== v) el.value = v; });
};
// קורא ל-Worker (אותו endpoint שכבר משמש את בעל העסק ב-business-dashboard.html) ומבקש 3 ניסוחים
// שונים בקריאה אחת (לא 3 קריאות נפרדות שעלולות לחזור עם אותה תשובה) — כדי שהמנהל יוכל לבחור,
// לא רק לערוך ידנית. הטקסט המקורי לקיצור הוא תיאור ההטבה המלא — מהטופס אם פתוח, אחרת מהעסק עצמו
// (כדי שהכפתור יעבוד גם מהתצוגה הרגילה, בלי לפתוח עריכה, ר' ההערה למעלה).
window.regenerateAiTitles = async function(id) {
  const b = findBiz(id);
  const srcEl = document.getElementById('edit_discount_' + id);
  const sourceText = (srcEl ? srcEl.value : b.discountFullText || '').trim();
  if (!sourceText) { alert('אין טקסט הטבה לקיצור — מלאו קודם את תיאור ההטבה המלא.'); return; }
  const btns = document.querySelectorAll(`[data-ai-title-regen="${id}"]`);
  const optsEls = document.querySelectorAll(`[data-ai-title-options="${id}"]`);
  btns.forEach(btn => { btn.disabled = true; btn.textContent = '⏳ חושב על ניסוחים...'; });
  try {
    const resp = await fetch(WORKER_URL + '/shorten-benefit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: sourceText, count: 3 }),
    });
    const data = await resp.json();
    if (!data.shortTitles || !data.shortTitles.length) throw new Error(data.error || 'no_titles');
    const optionsHtml = data.shortTitles.map(t => `<button type="button" class="ai-title-option" onclick="pickAiTitleOption('${id}','${jsq(t)}')">${t}</button>`).join('');
    optsEls.forEach(el => { el.innerHTML = optionsHtml; });
  } catch (e) {
    console.error(e);
    alert('הצעת הכותרות נכשלה — נסו שוב בעוד רגע.');
  } finally {
    btns.forEach(btn => { btn.disabled = false; btn.textContent = '🔄 הצע 3 כותרות AI'; });
  }
};
window.pickAiTitleOption = function(id, text) {
  setBizAiTitle(id, text);
};

// קוד כניסה קבוע (6 ספרות) — מחליף את ה-OTP. נבדקת ייחודיות מול Firestore לפני שימוש
// (זהה בדיוק ל-admin-members.html/admin-businesses.html generateLoginCode)
async function generateLoginCode() {
  for (let i = 0; i < 20; i++) {
    const code = String(Math.floor(100000 + Math.random() * 900000));
    const snap = await getDocs(query(collection(db, 'members'), where('loginCode', '==', code)));
    if (snap.empty) return code;
  }
  throw new Error('לא הצלחנו להגריל קוד ייחודי');
}
// זהה בדיוק ל-admin-members.html allocateMemberNumber
async function allocateMemberNumber() {
  const counterRef = doc(db, 'counters', 'members');
  return await runTransaction(db, async tx => {
    const snap = await tx.get(counterRef);
    const current = snap.exists() ? (snap.data().nextNumber || 1) : 1;
    tx.set(counterRef, { nextNumber: current + 1 });
    return current;
  });
}
// זהה בדיוק ל-admin-businesses.html approveLinkedMember — מאשר את החבר המקושר לעסק (ownerMemberId
// עדיף, ownerEmail רק fallback legacy) ומקצה לו מספר חבר+קוד כניסה אם עוד אין
async function approveLinkedMember(b) {
  try {
    let memberId = b.ownerMemberId || null;
    if (!memberId) {
      const email = b.ownerEmail || b.email || '';
      if (!email) return;
      const msnap = await getDocs(query(collection(db, 'members'), where('email', '==', email)));
      if (msnap.empty) return;
      memberId = msnap.docs[0].id;
    }
    const mSnap = await getDoc(doc(db, 'members', memberId));
    if (!mSnap.exists()) return;
    const m = mSnap.data();
    const updates = { status: 'approved', approvedAt: serverTimestamp(), isBusinessOwner: true };
    if (!m.memberNumber) updates.memberNumber = await allocateMemberNumber();
    if (!m.loginCode) {
      updates.loginCode = await generateLoginCode();
      updates.loginCodeCreatedAt = serverTimestamp();
      updates.loginCodeEmailStatus = 'pending';
    }
    await updateDoc(doc(db, 'members', memberId), updates);
  } catch (e) { console.error('approveLinkedMember failed', e); }
}

  try {

    // אם המנהל ערך ערך ממתין לפני האישור (togglePendingEditMode) — הערך שהוקלד מחליף את מה שהעסק שלח.
    document.querySelectorAll(`.pending-edit-input[data-biz="${id}"]`).forEach(input => {
      changes[input.dataset.key] = input.value;
    });
    await updateDoc(doc(db, 'businesses', id), { ...changes, pendingChanges: null, pendingChangesAt: null });
    pendingEditIds.delete(id);
  } catch (e) { console.error(e); alert('שגיאה באישור השינויים: ' + e.message); }
};
window.rejectChanges = async function(id) {
  const b = findBiz(id);
  if (!b) return;
  try {
    await updateDoc(doc(db, 'businesses', id), { pendingChanges: null, pendingChangesAt: null });
    pendingEditIds.delete(id);
  } catch (e) { console.error(e); alert('שגיאה בדחיית השינויים: ' + e.message); }
};
// טוגל מצב-עריכה לערכים הממתינים של עסק מסוים (לפני אישור) — ר' diffHtmlForSection/statusActions.
window.togglePendingEditMode = function(id) {
  if (pendingEditIds.has(id)) pendingEditIds.delete(id); else pendingEditIds.add(id);
  renderMain();
};

// קפיצה מתקציר-השינויים בראש הכרטיס לעריכת השלב הרלוונטי + גלילה אליו. פותח את השלב רק אם הוא סגור —
// לא כמו toggleBizSecEdit הרגיל (טוגל) — כדי שלא "יסגור" בטעות שלב שכבר פתוח אם לוחצים שוב בטעות.
// מוסיף גם הבהוב-צבע חד-פעמי (jump-flash) על השלב עצמו כתגובה ויזואלית מיידית ללחיצה — בנוסף לצביעה
// הקבועה של כותרת השלב + השדה הספציפי (secTitle/field-changed, ר' bizFullDetailHtml) שנשארת כל עוד השינוי ממתין.
window.jumpToBizSection = function(id, n) {
  const edit = document.getElementById('secEdit' + n + '_' + id);
  if (edit && !edit.classList.contains('open')) toggleBizSecEdit(id, n);
  const target = document.getElementById('secEdit' + n + '_' + id) || document.getElementById('secView' + n + '_' + id);
  if (target) {
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    target.classList.add('jump-flash');
    setTimeout(() => target.classList.remove('jump-flash'), 1300);
  }
};

// ── כל "פריטי השינוי הממתינים" של עסק, ברשימה שטוחה אחת — מקור אמת יחיד המשמש גם לתקציר בראש הכרטיס
// וגם לצביעת כותרת-השלב + השדה הספציפי בטופסי העריכה (ר' secTitle/fieldChangeHintHtml למטה).
// מאחד דיף רגיל (טלפון/שעות/הטבה) + כל סוגי הצעות תגית/קטגוריה שנייה — "גם תגית או כל דבר שיהיה בשינויים".
function bizPendingChangeItems(b) {
  const items = [];
  if (b.pendingChangeDiff) {
    Object.keys(b.pendingChangeDiff).forEach(key => {
      const n = DIFF_FIELD_TO_SECTION[key] || 2;
      const d = b.pendingChangeDiff[key];
      items.push({ section: n, field: key, label: DIFF_FIELD_LABELS_MOCK[key] || key, old: d.old, new: d.new, detail: `לפני: "${d.old}"  →  עכשיו: "${d.new}"` });
    });
  }
  const liveSecondTag = (b.tags || [])[1] || '';
  if (b.tagSecondSuggestion && b.tagSecondSuggestion !== liveSecondTag) {
    items.push({ section: 3, field: 'tagSecondSuggestion', label: '🏷️ תגית שנייה', detail: `הציע/ה: "${b.tagSecondSuggestion}"` });
  }
  if (b.tagSuggestion) {
    items.push({ section: 3, field: 'tagSuggestion', label: '🆕 תגית חדשה (הצעה חופשית)', detail: `הציע/ה: "${b.tagSuggestion}"` });
  }
  const alsoCatSugMeta = (b.alsoCategorySuggestion && b.alsoCategorySuggestion !== b.alsoUnderCategory)
    ? CATEGORIES.find(c => c.key === b.alsoCategorySuggestion) : null;
  if (alsoCatSugMeta) {
    items.push({ section: 3, field: 'alsoCategorySuggestion', label: '🏷️ קטגוריה נוספת ("מופיע גם תחת")', detail: `הציע/ה: ${alsoCatSugMeta.icon} ${alsoCatSugMeta.label}` });
  }
  if (b.alsoCategoryNote) {
    items.push({ section: 3, field: 'alsoCategoryNote', label: '📝 הערה לגבי קטגוריה נוספת', detail: `"${b.alsoCategoryNote}"` });
  }
  return items;
}

// היסטוריית מיילים שנשלחו לעסק/אוהד הזה דרך "שידור המוני" — נושא+תאריך בלבד, כמו שביקש המשתמש
// ("אם זה לא אומר מה הכותרת/נושא של המייל אין למה"). מבוסס messageBroadcastHistory (10 השידורים
// האחרונים, כבר טעון ב-onSnapshot) — לא כולל שליחות ידניות (WA/מייל בודד), כי אלה פותחות חלון
// אצל המנהל בלבד ואין שום אישור/רישום שהן אכן נשלחו בפועל.
function recipientEmailHistoryHtml(id, isFans, label) {
  const sent = messageBroadcastHistory
    .filter(h => (isFans ? h.audienceGroup === 'fans' : h.audienceGroup !== 'fans'))
    .map(h => ({ subject: h.subject, sentAt: h.sentAt, r: (h.results || []).find(r => r.id === id) }))
    .filter(x => x.r && x.r.status === 'sent');
  if (!sent.length) return '';
  return `
    <div class="approve-field">
      <div class="approve-field-label">📧 מיילים שנשלחו ל${label} הזה (שידור המוני)</div>
      <div class="approve-longtext">${sent.map(x => `${esc(x.subject)} — ${x.sentAt ? fmtDateTime(x.sentAt) : ''}`).join('<br>')}</div>
    </div>`;
}
function bizEmailHistoryHtml(b) { return recipientEmailHistoryHtml(b.id, false, 'עסק'); }
function fanEmailHistoryHtml(f) { return recipientEmailHistoryHtml(f.id, true, 'אוהד'); }

// "רוצה לכתוב לנו משהו?" — הודעה חופשית משלב הסיכום בהרשמה (business.html). בכוונה נפרד לגמרי
// מ"מה מבקשים לשנות" (bizPendingChangesSummaryHtml) — זו לא בקשת שינוי, בעל העסק יכול לכתוב על כל
// נושא (המשתמש: "הם לא מבקשים לשנות הם יכולים לכתוב בכל נושא"). לא מטופל → תיבה בולטת פתוחה עם
// כפתור "סמן כטופל". מטופל → תיבה מכווצת (<details>, "אפשר לפתוח ולראות") שאפשר עדיין לפתוח.
function bizNoteHtml(b) {
  if (!b.note) return '';
  if (!b.noteHandled) {
    return `
    <div class="tag-suggestion-alert note-alert">
      💬 העסק כתב לנו: "${esc(b.note)}"
      <div class="suggestion-actions">
        <button class="act-btn approve tiny" onclick="toggleBizNoteHandled('${b.id}', true)">✓ סמן כטופל</button>
      </div>
    </div>`;
  }
  return `
    <details class="note-handled-box">
      <summary>💬 הודעה מהעסק (טופלה) — לחצו לפתיחה</summary>
      <div class="approve-longtext" style="margin-top:6px">"${esc(b.note)}"</div>
      <button class="act-btn tiny" style="margin-top:6px" onclick="toggleBizNoteHandled('${b.id}', false)">↩️ בטל סימון "טופל"</button>
    </details>`;
}
window.toggleBizNoteHandled = async function(id, handled) {
  await saveSectionUpdates(id, { noteHandled: handled, noteHandledAt: handled ? serverTimestamp() : null, noteOwnerAckAt: null });
};

// תקציר-שינויים בראש הכרטיס — "מה בדיוק מבקשים לשנות, מאיזה שלב, לפני/עכשיו" בשורה אחת לכל פריט, לחיצה קופצת ישר לעריכת השלב.
function bizPendingChangesSummaryHtml(b) {
  const items = bizPendingChangeItems(b);
  if (!items.length) return '';
  return `
    <div class="changes-summary">
      <div class="changes-summary-title">📝 מה מבקשים לשנות (${items.length})</div>
      ${items.map(it => `
        <div class="changes-summary-row" onclick="jumpToBizSection('${b.id}',${it.section})">
          <div class="changes-summary-main">
            <span class="changes-summary-label">שלב ${it.section} · ${it.label}</span>
            <span class="changes-summary-detail">${it.detail}</span>
          </div>
          <span class="changes-summary-arrow">→</span>
        </div>`).join('')}
    </div>`;

// ══════════════════════════════════════════════════════════════════
// 🏷️ ניהול תגיות — חלק א׳ (רשימה לפי קטגוריה, ➕✏️🔀🗑️) + חלק ב׳ (תור בקשות ממתינות מרוכז:
// tagSecondSuggestion + tagSuggestion). ר' PROJECT_CONTEXT.md §41/§48.
// ══════════════════════════════════════════════════════════════════

function tagUsageCount(catKey, tag) {
  return MOCK_BUSINESSES.filter(b => b.catKey === catKey && (b.tags || []).includes(tag)).length;
}

// האם לעסק יש הצעת-תגית ממתינה מכל סוג (שנייה או חופשית) — משותף לתור הממוין ול"שינויים לעסקים"
// (המשתמש ביקש שעסק עם הצעת-תגית בלבד, בלי pendingChangeDiff אחר, גם יופיע שם — ר' PROJECT_CONTEXT.md §48/§49)
function bizHasPendingTagSuggestion(b) {
  return (b.tagSecondSuggestion && b.tagSecondSuggestion !== ((b.tags || [])[1] || '')) || !!b.tagSuggestion;
}
// בקשת קטגוריה נוספת ("מופיע גם תחת") — בין אם דרך בחירה בגריד (alsoCategorySuggestion) ובין אם
// רק במלל חופשי (alsoCategoryNote, קיים רק בעריכה מהדשבורד — ר' business-dashboard.html שלב 3)
function bizHasPendingCategoryRequest(b) {
  return (b.alsoCategorySuggestion && b.alsoCategorySuggestion !== b.alsoUnderCategory) || !!b.alsoCategoryNote;
}
// הודעה חופשית מ"רוצה לכתוב לנו משהו?" שעדיין לא סומנה כטופלה — לא בקשת שינוי, ר' ההערה ב-hydrateBiz
function bizHasUnhandledNote(b) {
  return !!b.note && !b.noteHandled;
}
// מקור-אמת יחיד ל"האם יש לעסק הזה משהו שממתין לתשומת לב מנהל" — משמש גם לבאדג' השורה וגם לתור "שינויים לעסקים"
function bizHasAnyPendingChange(b) {
  return !!b.pendingChangeDiff || bizHasPendingTagSuggestion(b) || bizHasPendingCategoryRequest(b) || bizHasUnhandledNote(b);
}

// שם עסק+תגית משותפים לכתיבה בטוחה בתוך onclick="...('...')" — מונע שבירה כשיש גרשיים בתגית עצמה
function jsq(s) { return String(s).replace(/'/g, "\\'"); }

function tagSecondSuggestionQueue() {
  return MOCK_BUSINESSES.filter(b => b.tagSecondSuggestion && b.tagSecondSuggestion !== ((b.tags || [])[1] || ''));
}
function tagFreeSuggestionQueue() {
  return MOCK_BUSINESSES.filter(b => b.tagSuggestion);
}

// מאתר "משבצת" פנויה לתגית (ראשית קודם, אחרת שנייה) — משותף לאישור-כחדשה ולמיפוי-לקיימת.
// אם שתי המשבצות תפוסות, לא ניתן לשבץ אוטומטית (חוסם עם הסבר) — המנהל צריך להסיר תגית קודם דרך עריכת שלב 3.
function assignTagToBiz(b, tag) {
  b.tags = b.tags || [];
  if (!b.tags[0]) { b.tags[0] = tag; }
  else if (!b.tags[1]) { b.tags[1] = tag; }
  else { alert(`ל"${b.name}" כבר יש 2 תגיות. יש להסיר אחת קודם (דרך "✏️ ערוך" בשלב 3 בכרטיס העסק) לפני שאפשר להוסיף תגית נוספת.`); return false; }
  return true;
}

// "אשר כתגית חדשה" — לא חד-לחיצה: קודם בוחרים תחת איזו קטגוריה התגית שייכת (ברירת מחדל = הקטגוריה
// של העסק עצמו, אבל המנהל יכול לבחור אחרת — למשל תגית שמתאימה יותר לקטגוריה שונה מזו של העסק המציע).
// אם נבחרה קטגוריה אחרת מזו של העסק, התגית מתווספת לפול של הקטגוריה הנבחרת אבל *לא* משויכת לעסק הזה
// (כי תגיות מוגבלות לפול הקטגוריה הראשית של העסק בפועל — לא ניתן לשייך תגית מקטגוריה אחרת).
window.startNewCatPicking = function(id) { tagQueueNewCatPicking = id; tagQueueMapping = null; renderMain(); };
window.cancelNewCatPicking = function() { tagQueueNewCatPicking = null; renderMain(); };
window.confirmApproveTagSuggestionNewCat = function(id) {
  const b = findBiz(id);
  if (!b || !b.tagSuggestion) return;
  const sel = document.getElementById('tagNewCatSelect_' + id);
  const chosenCat = sel ? sel.value : b.catKey;
  const tag = b.tagSuggestion;
  const pool = TAGS_BY_CATEGORY_MOCK[chosenCat] || (TAGS_BY_CATEGORY_MOCK[chosenCat] = []);
  if (!pool.includes(tag)) pool.push(tag);
  if (chosenCat === b.catKey) {
    if (!assignTagToBiz(b, tag)) return; // אם שתי המשבצות תפוסות — assignTagToBiz כבר הציג alert ועצר, לא ממשיכים
  } else {
    const chosenLabel = (CATEGORIES.find(c => c.key === chosenCat) || {}).label || chosenCat;
    const ownLabel = (CATEGORIES.find(c => c.key === b.catKey) || {}).label || b.catKey;
    alert(`התגית "${tag}" נוספה לקטגוריית "${chosenLabel}" — לא שויכה ל"${b.name}" כי הקטגוריה שלו ("${ownLabel}") שונה.`);
  }
  b.tagSuggestion = '';
  tagQueueNewCatPicking = null;
  b.healthScore = computeHealthScore(b);
  renderMain();
};
window.rejectTagSuggestion = function(id) {
  const b = findBiz(id);
  if (!b) return;
  b.tagSuggestion = '';
  renderMain();
};
// עריכת טקסט ה-tagSuggestion לפני אישור/מיפוי (למשל תיקון שגיאת הקלדה) — זמינה גם מהכרטיס וגם
// מתור "ניהול תגיות" (tagQueueRowHtml). נכתבת מיד ל-Firestore (לא רק בזיכרון, בניגוד לפעולות
// האישור/דחייה/מיפוי הקיימות למעלה שנשארות רק בזיכרון עד רענון — פער קיים קודם, לא בהיקף כאן).
window.startTagSuggestionEdit = function(id) { tagSuggestionEditing = id; renderMain(); };
window.cancelTagSuggestionEdit = function() { tagSuggestionEditing = null; renderMain(); };
window.saveTagSuggestionEdit = async function(id) {
  const input = document.getElementById('tagSuggestionEditInput_' + id);
  const val = input ? input.value.trim() : '';
  if (!val) return;
  tagSuggestionEditing = null;
  await saveSectionUpdates(id, { tagSuggestion: val });
};
window.startMapTagSuggestion = function(id) { tagQueueMapping = id; tagQueueNewCatPicking = null; renderMain(); };
window.cancelMapTagSuggestion = function() { tagQueueMapping = null; renderMain(); };
window.confirmMapTagSuggestion = function(id) {
  const b = findBiz(id);
  if (!b) return;
  const sel = document.getElementById('tagQueueMapSelect_' + id);
  const tag = sel ? sel.value : '';
  if (!tag) return;
  if (!assignTagToBiz(b, tag)) return;
  b.tagSuggestion = '';
  tagQueueMapping = null;
  b.healthScore = computeHealthScore(b);
  renderMain();
};

// ניווט-החוצה מהתור המרוכז ל"כל העסקים" עם העסק הרלוונטי פתוח — הסינונים מתאפסים כדי שהעסק בטוח יופיע ברשימה
window.jumpToBizFromTagQueue = function(id) {
  bizSearch = ''; bizStatusFilter = 'all'; bizCategoryFilter = 'all';
  selectedBizDetailId = id;
  selectTab(ALL_BIZ_KEY);
};

function tagQueueRowHtml(b) {
  const catMeta = CATEGORIES.find(c => c.key === b.catKey);
  const catChip = catMeta ? `<span class="tag-chip">${catMeta.icon} ${catMeta.label}</span>` : '';
  if (b.tagSecondSuggestion && b.tagSecondSuggestion !== ((b.tags || [])[1] || '')) {
    return `
      <div class="tagmgmt-queue-card">
        <div class="tagmgmt-queue-main">
          <div class="tagmgmt-queue-name">${b.name} ${catChip}</div>
          <div class="tagmgmt-queue-desc">💡 ביקש/ה תגית שנייה: "${b.tagSecondSuggestion}"</div>
        </div>
        <div class="tagmgmt-queue-actions">
          <button class="act-btn approve tiny" onclick="approveTagSecondSuggestion('${b.id}')">✅ אשר</button>
          <button class="act-btn reject tiny" onclick="rejectTagSecondSuggestion('${b.id}')">✗ דחה</button>

        </div>
      </div>`;
  }

  const isEditingText = tagSuggestionEditing === b.id;
  const catOptions = CATEGORIES.map(c => `<option value="${c.key}" ${b.catKey===c.key?'selected':''}>${c.icon} ${c.label}${b.catKey===c.key?' (הקטגוריה של העסק)':''}</option>`).join('');
  return `
    <div class="tagmgmt-queue-card">
      <div class="tagmgmt-queue-main">
        <div class="tagmgmt-queue-name">${b.name} ${catChip}</div>
        ${isEditingText ? `
        <div class="tagmgmt-inline-form" style="margin-top:4px">
          <input type="text" id="tagSuggestionEditInput_${b.id}" value="${esc(b.tagSuggestion)}" maxlength="40" style="flex:1">
          <button class="act-btn approve tiny" onclick="saveTagSuggestionEdit('${b.id}')">💾 שמור</button>
          <button class="act-btn tiny" onclick="cancelTagSuggestionEdit()">ביטול</button>
        </div>` : `
        <div class="tagmgmt-queue-desc">🆕 הציע/ה תגית חדשה: "${b.tagSuggestion}" <button class="act-btn tiny" onclick="startTagSuggestionEdit('${b.id}')">✏️ ערוך</button></div>`}
        ${isMapping ? `
        <div class="tagmgmt-inline-form" style="margin-top:6px">
          <select id="tagQueueMapSelect_${b.id}">
            ${pool.map(t => `<option value="${t.replace(/"/g,'&quot;')}">${t}</option>`).join('')}
          </select>
          <button class="act-btn approve tiny" onclick="confirmMapTagSuggestion('${b.id}')">אישור מיפוי</button>
          <button class="act-btn tiny" onclick="cancelMapTagSuggestion()">ביטול</button>
        </div>` : ''}
        ${isPickingCat ? `
        <div class="tagmgmt-inline-form" style="margin-top:6px">
          <span style="font-size:11px;color:var(--text-sm)">תחת איזו קטגוריה?</span>
          <select id="tagNewCatSelect_${b.id}">${catOptions}</select>
          <button class="act-btn approve tiny" onclick="confirmApproveTagSuggestionNewCat('${b.id}')">✅ הוסף ואשר</button>
          <button class="act-btn tiny" onclick="cancelNewCatPicking()">ביטול</button>
        </div>` : ''}
      </div>
      ${!isMapping && !isPickingCat && !isEditingText ? `
      <div class="tagmgmt-queue-actions">
        <button class="act-btn approve tiny" onclick="startNewCatPicking('${b.id}')">✅ אשר כתגית חדשה</button>
        <button class="act-btn tiny" onclick="startMapTagSuggestion('${b.id}')">🔀 מפה לקיימת</button>
        <button class="act-btn reject tiny" onclick="rejectTagSuggestion('${b.id}')">✗ דחה</button>
        <button class="act-btn tiny" onclick="jumpToBizFromTagQueue('${b.id}')">🔗 לעסק</button>
      </div>` : ''}
    </div>`;
}

// ── חלק א׳ — רשימת תגיות לפי קטגוריה: הוספה/עריכת שם/מיזוג/מחיקה ──
window.startAddTag = function(catKey) { tagsMgmtAdding[catKey] = true; renderMain(); };
window.cancelAddTag = function(catKey) { tagsMgmtAdding[catKey] = false; renderMain(); };
window.confirmAddTag = async function(catKey) {
  const input = document.getElementById('tagAddInput_' + catKey);
  const val = input ? input.value.trim() : '';
  if (!val) return;
  const pool = TAGS_BY_CATEGORY_MOCK[catKey] || (TAGS_BY_CATEGORY_MOCK[catKey] = []);
  if (pool.includes(val)) { alert('תגית בשם הזה כבר קיימת בקטגוריה זו.'); return; }
  pool.push(val);
  await saveTagTaxonomy();
  tagsMgmtAdding[catKey] = false;
  renderMain();
};

window.startTagEdit = function(catKey, tag) { tagsMgmtEditing = { catKey, tag }; tagsMgmtMerging = null; renderMain(); };
window.cancelTagEdit = function() { tagsMgmtEditing = null; renderMain(); };
window.confirmRenameTag = async function(catKey, oldTag) {
  const input = document.getElementById('tagEditInput_' + catKey);
  const newTag = input ? input.value.trim() : '';
  if (!newTag || newTag === oldTag) { tagsMgmtEditing = null; renderMain(); return; }
  const pool = TAGS_BY_CATEGORY_MOCK[catKey] || [];
  if (pool.includes(newTag)) { alert('כבר יש תגית בשם הזה בקטגוריה — כדי לאחד ביניהן יש להשתמש בפעולת מיזוג (🔀) במקום שינוי שם.'); return; }
  const affected = MOCK_BUSINESSES.filter(b => b.catKey === catKey && ((b.tags || []).includes(oldTag) || b.tagSecondSuggestion === oldTag));
  const count = affected.length;
  if (count > 0 && !confirm(`${count} עסק${count===1?' משתמש':'ים משתמשים'} בתגית "${oldTag}". לשנות את השם ל"${newTag}" גם אצלם (כתיבה אמיתית ל-Firestore)?`)) return;
  const idx = pool.indexOf(oldTag);
  if (idx > -1) pool[idx] = newTag;
  try {
    if (affected.length) {
      const batch = writeBatch(db);
      affected.forEach(b => {
        const patch = { tags: (b.tags || []).map(t => t === oldTag ? newTag : t) };
        if (b.tagSecondSuggestion === oldTag) patch.tagSecondSuggestion = newTag;
        batch.update(doc(db, 'businesses', b.id), patch);
      });
      await batch.commit();
    }
    await saveTagTaxonomy();
  } catch (e) { console.error(e); alert('שגיאה בשינוי השם: ' + e.message); return; }
  affected.forEach(b => {
    b.tags = (b.tags || []).map(t => t === oldTag ? newTag : t);
    if (b.tagSecondSuggestion === oldTag) b.tagSecondSuggestion = newTag;
  });
  tagsMgmtEditing = null;
  renderMain();
};

window.deleteTag = async function(catKey, tag) {
  const count = tagUsageCount(catKey, tag);
  if (count > 0) { alert(`אי אפשר למחוק את "${tag}" — ${count} עסק${count===1?' עדיין משתמש':'ים עדיין משתמשים'} בה. אפשר למזג אותה לתוך תגית אחרת (🔀) כדי להעביר ${count===1?'אותו':'אותם'} קודם.`); return; }
  if (!confirm(`למחוק את התגית "${tag}"?`)) return;
  const pool = TAGS_BY_CATEGORY_MOCK[catKey] || [];
  const idx = pool.indexOf(tag);
  if (idx > -1) pool.splice(idx, 1);
  await saveTagTaxonomy();
  renderMain();
};

window.startTagMerge = function(catKey, tag) {
  if ((TAGS_BY_CATEGORY_MOCK[catKey] || []).filter(t => t !== tag).length === 0) { alert('אין תגית נוספת באותה קטגוריה למזג אליה.'); return; }
  tagsMgmtMerging = { catKey, tag }; tagsMgmtEditing = null; renderMain();
};
window.cancelTagMerge = function() { tagsMgmtMerging = null; renderMain(); };
// מיזוג תגיות — משנה בפועל את tags על כל העסקים שמשתמשים בתגית המקור (batch אחד אטומי), וגם את
// קטלוג התגיות עצמו (settings/tagTaxonomy) — כל שינויי ניהול-התגיות (מיזוג/שינוי-שם/מחיקה) נשמרים
// בפועל כאן. business.html/admin-businesses.html עדיין לא קוראים מהקטלוג הזה (ר' הערה למעלה).
window.confirmMergeTag = async function(catKey, oldTag) {
  const sel = document.getElementById('tagMergeTarget_' + catKey);
  const newTag = sel ? sel.value : '';
  if (!newTag) return;
  const affected = MOCK_BUSINESSES.filter(b => b.catKey === catKey && (b.tags || []).includes(oldTag));
  const count = affected.length;
  if (!confirm(`למזג "${oldTag}" לתוך "${newTag}"? ${count} עסק${count===1?' יעבור':'ים יעברו'} לתגית "${newTag}" — כתיבה אמיתית ל-Firestore, לא ניתנת לביטול אוטומטי.`)) return;
  try {
    const batch = writeBatch(db);
    affected.forEach(b => {
      const newTags = [...new Set(b.tags.map(t => t === oldTag ? newTag : t))]; // Set מונע כפילות אם העסק כבר החזיק גם את שתי התגיות שהתמזגו
      const patch = { tags: newTags };
      if (b.tagSecondSuggestion === oldTag) patch.tagSecondSuggestion = newTag;
      batch.update(doc(db, 'businesses', b.id), patch);
    });
    await batch.commit();
  } catch (e) { console.error(e); alert('שגיאה במיזוג: ' + e.message); return; }
  const pool = TAGS_BY_CATEGORY_MOCK[catKey] || [];
  const idx = pool.indexOf(oldTag);
  if (idx > -1) pool.splice(idx, 1);
  await saveTagTaxonomy();
  tagsMgmtMerging = null;
  alert(`✅ מוזג — ${count} עסק${count===1?' עבר':'ים עברו'} בפועל ל-"${newTag}"`);
  renderMain();
};

let tplFirestoreData = {};
let tplSiteTextsData = {};
let openTemplateId = null;
window.toggleTemplateItem = function(id) {
  openTemplateId = (openTemplateId === id) ? null : id;
  renderMain();
};

function tplGetLocal(key, fallback) { return localStorage.getItem('_hb_tpl_' + key) || fallback; }
function tplSetLocal(key, val) { localStorage.setItem('_hb_tpl_' + key, val); }
function findMessageTemplate(id) { return MESSAGE_TEMPLATE_ITEMS.find(i => i.id === id); }
function tplFieldValue(item, f) {
  return item.storage === 'firestore' ? (tplFirestoreData[f.key] ?? item.defaults[f.key])
    : item.storage === 'firestoreSite' ? (tplSiteTextsData[f.key] ?? item.defaults[f.key])
    : tplGetLocal(f.key, item.defaults[f.key]);
}

window.saveTemplateItem = async function(id) {
  const item = findMessageTemplate(id);
  const values = {};
  item.fields.forEach(f => values[f.key] = document.getElementById('tplField_' + f.key).value);
  if (item.storage === 'firestore' || item.storage === 'firestoreSite') {
    const targetDoc = item.storage === 'firestore' ? TPL_SETTINGS_DOC() : TPL_SITE_TEXTS_DOC();
    const cache = item.storage === 'firestore' ? tplFirestoreData : tplSiteTextsData;
    try {
      await setDoc(targetDoc, values, { merge: true });
      Object.assign(cache, values);
      alert('✅ נשמר');
    } catch (e) { console.error(e); alert('שגיאה בשמירה: ' + e.message); }
  } else {
    Object.entries(values).forEach(([k, v]) => tplSetLocal(k, v));
    alert('✅ נשמר');
  }
  renderMain();
};

window.resetTemplateItem = function(id) {
  const item = findMessageTemplate(id);
  item.fields.forEach(f => { const el = document.getElementById('tplField_' + f.key); if (el) el.value = item.defaults[f.key]; });
};

function templateFieldHtml(item, f) {
  const val = esc(tplFieldValue(item, f));
  return f.type === 'textarea'
    ? `<div class="approve-field-label" style="margin-top:10px">${f.label}</div><textarea class="broadcast-body-input" id="tplField_${f.key}" rows="${f.rows||8}">${val}</textarea>`
    : `<div class="approve-field-label" style="margin-top:10px">${f.label}</div><input class="chain-select" type="text" id="tplField_${f.key}" value="${val}">`;
}

function templateCardHtml(item) {
  if (!item) return '';
  const isOpen = openTemplateId === item.id;
  const varsHtml = item.vars.length
    ? `<div class="tpl-vars-box">משתנים זמינים: ${item.vars.map(([k,d]) => `<code>{${k}}</code>=${esc(d)}`).join(' · ')}</div>`
    : '';
  const replyToNote = item.replyTo
    ? `<br>תשובה למייל (Reply-To): כן — ${TPL_REPLY_TO_ADDRESS}`
    : (item.group === 'auto' ? `<br>תשובה למייל (Reply-To): אין — כתובת ללא מענה.` : '');
  const explainHtml = `<div class="tpl-explain-box"><b>למי:</b> ${item.who}<br><b>מתי:</b> ${item.when}${replyToNote}</div>`;
  const fieldsHtml = item.fields.map(f => templateFieldHtml(item, f)).join('');
  return `
    <div class="chain-block">
      <div class="chain-label" onclick="toggleTemplateItem('${item.id}')" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer">
        <span>${item.icon} ${item.title} — <span style="font-weight:400">${esc(item.sub)}</span></span>
        <span>${isOpen ? '▲' : '▼'}</span>
      </div>
      ${isOpen ? `
        ${explainHtml}

// ── עריכת תוכן חד-פעמית ("הודעה בודדת") — בכוונה נפרדת מ-_hb_tpl_* (התבנית הקבועה שמשמשת גם
// את כפתורי 📲/✉️ ליד עסק/אוהד ברשימות): עריכה כאן היא ל-session הזה בלבד, לא נשמרת ולא דורסת

// שליחה בפועל מ"הודעה בודדת" — משתמש בתוכן החד-פעמי (אם נערך) או בברירת המחדל מהתבנית הקבועה,
// עם אותם helper-ים של placeholder בדיוק (applyBizTpl/applyFanTplLocal/waLink, שורות ~1808-1818).
window.sendManualAdhoc = function(channel, id) {
  const isFans = manualPickerType === 'fans';
  const x = isFans ? findFan(id) : bizById(id);
  if (!x) return;
  const item = findMessageTemplate(isFans ? 'fanManual' : 'bizManual');
  if (channel === 'wa') {
    const tpl = manualAdhocValue(item, isFans ? 'fan_wa' : 'wa');
    const msg = isFans ? applyFanTplLocal(tpl, x.name, x.loginCode || '') : applyBizTpl(tpl, x.ownerFirst || '', x.name, x.accessToken || '');
    window.open(waLink(isFans ? x.phone : x.ownerPhone, msg), '_blank');
  } else {
    const subjTpl = manualAdhocValue(item, isFans ? 'fan_mailSubject' : 'mailSubject');
    const bodyTpl = manualAdhocValue(item, isFans ? 'fan_mail' : 'mail');
    const subject = encodeURIComponent(isFans ? subjTpl : applyBizTpl(subjTpl, x.ownerFirst || '', x.name, x.accessToken || ''));
    const body = encodeURIComponent(isFans ? applyFanTplLocal(bodyTpl, x.name, x.loginCode || '') : applyBizTpl(bodyTpl, x.ownerFirst || '', x.name, x.accessToken || ''));
    window.open(`mailto:${isFans ? x.email : x.ownerEmail}?subject=${subject}&body=${body}`, '_blank');
  }
};

window.saveBroadcastDraft = async function() {
  const subject = document.getElementById('broadcastSubject').value.trim();
  const body = document.getElementById('broadcastBody').value.trim();
  broadcastDraft = { subject, body };
  try {
    await setDoc(doc(db, 'settings', 'broadcastDraft'), { subject, body }, { merge: true });
    alert('הטיוטה נשמרה');
  } catch (e) { console.error(e); alert('שגיאה בשמירת הטיוטה: ' + e.message); }
};

window.sendBroadcastNow = async function() {
  const subject = document.getElementById('broadcastSubject').value.trim();
  const body = document.getElementById('broadcastBody').value.trim();
  if (!subject || !body) { alert('חסר נושא או גוף הודעה'); return; }
  const isFans = broadcastAudienceType === 'fans';
  const noun = isFans ? 'האוהדים' : 'העסקים';
  const audience = broadcastAudience();
  if (!audience.length) { alert('אין נמענים לשלוח אליהם'); return; }
  const selectedSet = isFans ? selectedFanIds : selectedBizIds;
  const usingSelection = selectedSet.size > 0;
  const confirmMsg = usingSelection
    ? `לשלוח את ההודעה הזו במייל ל-${audience.length} ${noun} הנבחרים? הפעולה שולחת מייל אמיתי ולא ניתנת לביטול.`
    : `לשלוח את ההודעה הזו במייל ל-${audience.length} ${noun} המאושרים? הפעולה שולחת מייל אמיתי ולא ניתנת לביטול.`;
  if (!confirm(confirmMsg)) return;

  broadcastDraft = { subject, body };
  try { await setDoc(doc(db, 'settings', 'broadcastDraft'), { subject, body }, { merge: true }); } catch (e) { /* לא חוסם שליחה אם רק שמירת הטיוטה נכשלה */ }

  broadcastSending = true;
  renderMain();
  try {
    const idToken = await auth.currentUser.getIdToken();
    const idsField = isFans ? { memberIds: audience.map(x => x.id) } : { businessIds: audience.map(x => x.id) };
    const resp = await fetch(WORKER_URL + '/send-broadcast-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idToken, subject, body, audienceType: broadcastAudienceType, ...idsField }),
    });
    const data = await resp.json();
    if (data.error) { alert('שגיאה בשליחה: ' + data.error); return; }
    const results = data.results || [];
    const sentCount = results.filter(r => r.status === 'sent').length;
    const failedCount = results.filter(r => r.status === 'failed').length;
    await addDoc(collection(db, 'messageBroadcasts'), {
      subject, body, sentAt: serverTimestamp(), sentByUid: auth.currentUser.uid,
      audienceGroup: broadcastAudienceType, audienceType: usingSelection ? 'selected' : 'allApproved',
      totalRecipients: results.length, sentCount, failedCount, results,
    });
    if (usingSelection) selectedSet.clear();
    alert(`נשלח! ${sentCount} בהצלחה${failedCount ? `, ${failedCount} נכשלו` : ''}.`);
  } catch (e) {
    console.error(e);
    alert('שגיאה בשליחה: ' + e.message);
  } finally {
    broadcastSending = false;
    renderMain();
  }
};

  const wrap = document.getElementById('tabContent');
  if (!activeTab) {
    wrap.innerHTML = `<div class="placeholder-note">👈 בחר פריט מהתפריט בצד כדי להתחיל</div>`;
    return;
  }
  if (activeTab === HOME_KEY) {
    wrap.innerHTML = homeTabHtml();
    return;
  }
  if (activeTab === ALL_BIZ_KEY) {
    wrap.innerHTML = bizListHtml();
    return;
  }
  if (activeTab === ALL_FANS_KEY) {
    wrap.innerHTML = fanListHtml();
    return;
  }
  if (activeTab === TAGS_MGMT_KEY) {
    wrap.innerHTML = tagsManagementHtml();
    return;
  }
  if (activeTab === BROADCAST_KEY) {
    wrap.innerHTML = messageCenterHtml();
    return;
  }
  const tab = tabMeta(activeTab);
  wrap.innerHTML = `
    ${infoAccordionHtml()}
    ${tabInfoHtml(tab)}
    ${expiringPanelHtml()}
    <div class="preview-label">👁 ככה זה ייראה בפועל</div>
    <div class="preview-strip">${previewStripHtml(tab)}</div>
    <div class="slots">${slotsHtml(tab)}</div>
    <div class="section-note">10 המיקומים הראשונים בלבד ניתנים לעיגון. השאר תמיד אוטומטי.</div>`;
}

function renderAll() {
  renderSidebar();
  renderMain();
}

// admin guard — session אמיתי (Firebase Auth) + isAdmin:true על רשומת החבר, זהה ל-admin-businesses.html/admin-members.html
await new Promise(resolve => {
  const unsub = onAuthStateChanged(auth, async user => {
    unsub();
    if (!user) { location.href = 'welcome.html'; return; }
    const snap = await getDoc(doc(db, 'members', user.uid));
    if (!snap.exists() || snap.data().isAdmin !== true) { location.href = 'home.html'; return; }
    resolve();
  });
});

let _bizLoaded = false, _fanLoaded = false;
function maybeInitialRender() { if (_bizLoaded && _fanLoaded) renderAll(); }

onSnapshot(collection(db, 'businesses'), snapshot => {
  MOCK_BUSINESSES = snapshot.docs.map(d => hydrateBiz(d.id, d.data()));
  _bizLoaded = true;
  if (_fanLoaded) renderAll(); else maybeInitialRender();
}, err => console.error('שגיאה בטעינת עסקים מ-Firestore:', err));

onSnapshot(collection(db, 'members'), snapshot => {
  MOCK_FANS = snapshot.docs.map(d => hydrateFan(d.id, d.data()));
  _fanLoaded = true;
  if (_bizLoaded) renderAll(); else maybeInitialRender();
}, err => console.error('שגיאה בטעינת אוהדים מ-Firestore:', err));

// עיגוני סקשנים/קטגוריות — מסמך יחיד, לא חוסם את הרינדור הראשוני (state כבר מאותחל ריק, "הכל אוטומטי")
onSnapshot(doc(db, 'settings', 'sectionAnchors'), snap => {
  Object.assign(state, anchorsDocToState(snap.exists() ? snap.data() : null));
  renderAll();
}, err => console.error('שגיאה בטעינת עיגונים מ-Firestore:', err));

// קטלוג תגיות — מסמך יחיד, נופל בחזרה לברירת המחדל הקשיחה אם עוד לא נכתב אף פעם
onSnapshot(doc(db, 'settings', 'tagTaxonomy'), snap => {
  const data = snap.exists() ? snap.data() : {};
  Object.keys(TAGS_BY_CATEGORY_MOCK).forEach(k => delete TAGS_BY_CATEGORY_MOCK[k]);
  Object.assign(TAGS_BY_CATEGORY_MOCK, Object.keys(data).length ? data : TAG_TAXONOMY_DEFAULTS);
  renderAll();
}, err => console.error('שגיאה בטעינת קטלוג תגיות מ-Firestore:', err));

// מרכז הפצת הודעות — טיוטת הנושא/גוף הנוכחית (נופלת לברירת המחדל הקבועה בקוד אם עוד לא נשמרה אף פעם)
onSnapshot(doc(db, 'settings', 'broadcastDraft'), snap => {
  if (snap.exists()) broadcastDraft = { subject: snap.data().subject || '', body: snap.data().body || '' };
  if (activeTab === BROADCAST_KEY) renderMain();
}, err => console.error('שגיאה בטעינת טיוטת שידור מ-Firestore:', err));

// תבניות ההודעה הקבועות (מרכז הודעות) — אותם מסמכים בדיוק שקורא/כותב admin-messages.html הישן,
// כדי ששני המסכים יישארו תמיד מסונכרנים בלי מיגרציה.
onSnapshot(TPL_SETTINGS_DOC(), snap => {
  tplFirestoreData = snap.exists() ? snap.data() : {};
  if (activeTab === BROADCAST_KEY) renderMain();
}, err => console.error('שגיאה בטעינת תבניות הודעה מ-Firestore:', err));
onSnapshot(TPL_SITE_TEXTS_DOC(), snap => {
  tplSiteTextsData = snap.exists() ? snap.data() : {};
  if (activeTab === BROADCAST_KEY) renderMain();
}, err => console.error('שגיאה בטעינת טקסטי אתר מ-Firestore:', err));

// היסטוריית שידורים — 10 האחרונים בלבד
onSnapshot(query(collection(db, 'messageBroadcasts'), orderBy('sentAt', 'desc'), limit(10)), snapshot => {
  messageBroadcastHistory = snapshot.docs.map(d => ({ id: d.id, ...d.data(), sentAt: toJsDate(d.data().sentAt) }));
  if (activeTab === BROADCAST_KEY) renderMain();
}, err => console.error('שגיאה בטעינת היסטוריית שידורים מ-Firestore:', err));
</script>
</body>
</html>
