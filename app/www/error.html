<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yellow Zone</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f1524; color: #fff; padding: 24px;
    font-family: "Heebo", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    text-align: center;
  }
  .wrap { max-width: 340px; }
  .dot { width: 64px; height: 64px; border-radius: 50%; background: #FFD400; margin: 0 auto 22px; }
  h1 { font-size: 21px; margin: 0 0 10px; }
  p { font-size: 15px; line-height: 1.6; color: #b9c2d6; margin: 0 0 26px; }
  button {
    font: inherit; font-weight: 700; font-size: 16px; cursor: pointer;
    background: #FFD400; color: #0f1524; border: 0; border-radius: 12px;
    padding: 14px 34px; width: 100%;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="dot"></div>
    <h1>אין חיבור לאינטרנט</h1>
    <!-- מסך זה מוגש מתוך האפליקציה עצמה (server.errorPath), ולכן הוא היחיד שנראה
         כשהאתר לא נטען בכלל. בלעדיו המשתמש רואה מסך לבן ריק בלי שום הסבר. -->
    <p>Yellow Zone לא מצליחה להתחבר כרגע. ננסה שוב לבד – או לחצו "נסו שוב".</p>
    <button onclick="yzRetry()">נסו שוב</button>
  </div>
  <!-- §525 — 🐛 "נסו שוב" היה location.reload(), כלומר טעינה מחדש **של המסך הזה** (קובץ מתוך האפליקציה) ולא
       של האתר – ולכן רק יציאה וכניסה עזרו (רמי, 14.10). עכשיו: חזרה לאתר, וגם ניסיון אוטומטי (2/4/8 שנ'…)
       ומיד כשהרשת חוזרת. ⚠️ הקובץ ארוז באפליקציה – נכנס לתוקף רק בבנייה הבאה (Android 1.3 / iOS 1.0.1). -->
  <script>
    function yzRetry() { location.href = 'https://yellowzone.co.il/'; }
    (function () {
      var d = 2000;
      function tick() { setTimeout(function () { if (navigator.onLine !== false) yzRetry(); else { d = Math.min(d * 2, 15000); tick(); } }, d); }
      window.addEventListener('online', yzRetry);
      tick();
    })();
  </script>
</body>
</html>
