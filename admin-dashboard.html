// עודכן (2026-08-04, תואם-handoff): מקבל item={b,kind} במקום b בלבד (§148 — עסק יכול להופיע כמה
// פעמים בתור אם יש לו כמה סוגי-בקשות בו-זמנית, לא רק הראשון-שנמצא). נוסף סוג שלישי 'category'.
function tagQueueRowHtml(item) {
  const { b, kind } = item;
  const catMeta = CATEGORIES.find(c => c.key === b.catKey);
  const catChip = catMeta ? `<span class="tag-chip">${catMeta.label}</span>` : '';
  if (kind === 'second') {
    return `
      <div class="tagmgmt-queue-card">
        <div class="tagmgmt-queue-main">
          <div class="tagmgmt-queue-name">${b.name} ${catChip}</div>
          <div class="tagmgmt-queue-desc">💡 ביקש/ה תגית שנייה: "${b.tagSecondSuggestion}"</div>
        </div>
        <div class="tagmgmt-queue-actions">
          <button class="act-btn approve tiny" onclick="approveTagSecondSuggestion('${b.id}')">✅ אשר</button>
          <button class="act-btn reject tiny" onclick="rejectTagSecondSuggestion('${b.id}')">✗ דחה</button>
          <button class="act-btn tiny" onclick="jumpToBizFromTagQueue('${b.id}')">🔗 לעסק</button>
        </div>
      </div>`;
  }
  if (kind === 'category') {
    const wantsCat = (b.alsoCategorySuggestion && b.alsoCategorySuggestion !== b.alsoUnderCategory)
      ? CATEGORIES.find(c => c.key === b.alsoCategorySuggestion) : null;
    return `
      <div class="tagmgmt-queue-card">
        <div class="tagmgmt-queue-main">
          <div class="tagmgmt-queue-name">${b.name} ${catChip}</div>
          ${wantsCat ? `<div class="tagmgmt-queue-desc">🏷️ מבקש/ת להופיע גם תחת: <strong>${wantsCat.label}</strong></div>` : ''}
          ${b.alsoCategoryNote ? `<div class="tagmgmt-queue-desc">📝 הערת העסק: "${esc(b.alsoCategoryNote)}"</div>` : ''}
        </div>
        <div class="tagmgmt-queue-actions">
          ${wantsCat ? `
          <button class="act-btn approve tiny" onclick="approveAlsoCatSuggestion('${b.id}')">✅ אשר</button>
          <button class="act-btn reject tiny" onclick="rejectAlsoCatSuggestion('${b.id}')">✗ דחה</button>` : ''}
          <button class="act-btn tiny" onclick="jumpToBizFromTagQueue('${b.id}')">🔗 לעסק</button>
        </div>
      </div>`;
  }
  const pool = TAGS_BY_CATEGORY_MOCK[b.catKey] || [];
  const isMapping = tagQueueMapping === b.id;
  const isPickingCat = tagQueueNewCatPicking === b.id;
  // §263 — isEditingText היה בשימוש למטה בלי הגדרה בכלל: ReferenceError שהפיל את *כל*
  // tagsManagementHtml() ברגע שהיה ולו בקשת-תגית-חדשה אחת בתור, ולכן "אי אפשר להיכנס לניהול
  // תגיות". (הסיידבר המשיך לעבוד כי sidebarTaskCounts סופר בלי לרנדר שורות.)
  const isEditingText = tagSuggestionEditing === b.id;
  const catOptions = CATEGORIES.map(c => `<option value="${c.key}" ${b.catKey===c.key?'selected':''}>${c.icon} ${c.label}${b.catKey===c.key?' (הקטגוריה של העסק)':''}</option>`).join('');
  return `
    <div class="tagmgmt-queue-card">
      <div class="tagmgmt-queue-main">
        <div class="tagmgmt-queue-name">${b.name} ${catChip}</div>
        <div class="tagmgmt-inline-form" style="margin-top:4px">
          <span style="font-size:11px;color:var(--text-sm);white-space:nowrap">🆕 תגית חדשה:</span>
          <input type="text" id="tagSuggestionEditInput_${b.id}" value="${esc(b.tagSuggestion)}" maxlength="40" onchange="saveTagSuggestionEdit('${b.id}')" style="flex:1">
        </div>
        ${isMapping ? `
        <div class="tagmgmt-inline-form" style="margin-top:6px">
          <select id="tagQueueMapSelect_${b.id}">
            ${pool.map(t => `<option value="${t.replace(/"/g,'&quot;')}">${t}</option>`).join('')}
          </select>
          <button class="act-btn approve tiny" onclick="confirmMapTagSuggestion('${b.id}')">אישור מיפוי</button>
          <button class="act-btn tiny" onclick="cancelMapTagSuggestion()">ביטול</button>
        </div>` : ''}
        ${isPickingCat ? `
        <div class="tagmgmt-inline-form" style="margin-top:6px">
          <span style="font-size:11px;color:var(--text-sm)">תחת איזו קטגוריה?</span>
          <select id="tagNewCatSelect_${b.id}">${catOptions}</select>
          <button class="act-btn approve tiny" onclick="confirmApproveTagSuggestionNewCat('${b.id}')">✅ הוסף ואשר</button>
          <button class="act-btn tiny" onclick="cancelNewCatPicking()">ביטול</button>
        </div>` : ''}
      </div>
      ${!isMapping && !isPickingCat && !isEditingText ? `
      <div class="tagmgmt-queue-actions">
        <button class="act-btn approve tiny" onclick="startNewCatPicking('${b.id}')">✅ אשר כתגית חדשה</button>
        <button class="act-btn tiny" onclick="startMapTagSuggestion('${b.id}')">🔀 מפה לקיימת</button>
        <button class="act-btn reject tiny" onclick="rejectTagSuggestion('${b.id}')">✗ דחה</button>
        <button class="act-btn tiny" onclick="jumpToBizFromTagQueue('${b.id}')">🔗 לעסק</button>
      </div>` : ''}
    </div>`;
}

// ── חלק א׳ — רשימת תגיות לפי קטגוריה: הוספה/עריכת שם/מיזוג/מחיקה ──
window.startAddTag = function(catKey) { tagsMgmtAdding[catKey] = true; renderMain(); };
window.cancelAddTag = function(catKey) { tagsMgmtAdding[catKey] = false; renderMain(); };
window.confirmAddTag = async function(catKey) {
  const input = document.getElementById('tagAddInput_' + catKey);
  const val = input ? input.value.trim() : '';
  if (!val) return;
  const pool = TAGS_BY_CATEGORY_MOCK[catKey] || (TAGS_BY_CATEGORY_MOCK[catKey] = []);
  if (pool.includes(val)) { alert('תגית בשם הזה כבר קיימת בקטגוריה זו.'); return; }
  pool.push(val);
  await saveTagTaxonomy();
  tagsMgmtAdding[catKey] = false;
  renderMain();
};

window.startTagEdit = function(catKey, tag) { tagsMgmtEditing = { catKey, tag }; tagsMgmtMerging = null; renderMain(); };
window.cancelTagEdit = function() { tagsMgmtEditing = null; renderMain(); };
window.confirmRenameTag = async function(catKey, oldTag) {
  const input = document.getElementById('tagEditInput_' + catKey);
  const newTag = input ? input.value.trim() : '';
  if (!newTag || newTag === oldTag) { tagsMgmtEditing = null; renderMain(); return; }
  const pool = TAGS_BY_CATEGORY_MOCK[catKey] || [];
  if (pool.includes(newTag)) { alert('כבר יש תגית בשם הזה בקטגוריה — כדי לאחד ביניהן יש להשתמש בפעולת מיזוג (🔀) במקום שינוי שם.'); return; }
  const affected = MOCK_BUSINESSES.filter(b => b.catKey === catKey && ((b.tags || []).includes(oldTag) || b.tagSecondSuggestion === oldTag));
  const count = affected.length;
  if (count > 0 && !confirm(`${count} עסק${count===1?' משתמש':'ים משתמשים'} בתגית "${oldTag}". לשנות את השם ל"${newTag}" גם אצלם (כתיבה אמיתית ל-Firestore)?`)) return;
  const idx = pool.indexOf(oldTag);
  if (idx > -1) pool[idx] = newTag;
  try {
    if (affected.length) {
      const batch = writeBatch(db);
      affected.forEach(b => {
        const patch = { tags: (b.tags || []).map(t => t === oldTag ? newTag : t) };
        if (b.tagSecondSuggestion === oldTag) patch.tagSecondSuggestion = newTag;
        batch.update(doc(db, 'businesses', b.id), patch);
      });
      await batch.commit();
    }
    await saveTagTaxonomy();
  } catch (e) { console.error(e); alert('שגיאה בשינוי השם: ' + e.message); return; }
  affected.forEach(b => {
    b.tags = (b.tags || []).map(t => t === oldTag ? newTag : t);
    if (b.tagSecondSuggestion === oldTag) b.tagSecondSuggestion = newTag;
  });
  tagsMgmtEditing = null;
  renderMain();
};

window.deleteTag = async function(catKey, tag) {
  const count = tagUsageCount(catKey, tag);
  if (count > 0) { alert(`אי אפשר למחוק את "${tag}" — ${count} עסק${count===1?' עדיין משתמש':'ים עדיין משתמשים'} בה. אפשר למזג אותה לתוך תגית אחרת (🔀) כדי להעביר ${count===1?'אותו':'אותם'} קודם.`); return; }
  if (!confirm(`למחוק את התגית "${tag}"?`)) return;
  const pool = TAGS_BY_CATEGORY_MOCK[catKey] || [];
  const idx = pool.indexOf(tag);
  if (idx > -1) pool.splice(idx, 1);
  await saveTagTaxonomy();
  renderMain();
};

window.startTagMerge = function(catKey, tag) {
  if ((TAGS_BY_CATEGORY_MOCK[catKey] || []).filter(t => t !== tag).length === 0) { alert('אין תגית נוספת באותה קטגוריה למזג אליה.'); return; }
  tagsMgmtMerging = { catKey, tag }; tagsMgmtEditing = null; renderMain();
};
window.cancelTagMerge = function() { tagsMgmtMerging = null; renderMain(); };
// מיזוג תגיות — משנה בפועל את tags על כל העסקים שמשתמשים בתגית המקור (batch אחד אטומי), וגם את
// קטלוג התגיות עצמו (settings/tagTaxonomy) — כל שינויי ניהול-התגיות (מיזוג/שינוי-שם/מחיקה) נשמרים
// בפועל כאן. business.html/admin-businesses.html עדיין לא קוראים מהקטלוג הזה (ר' הערה למעלה).
window.confirmMergeTag = async function(catKey, oldTag) {
  const sel = document.getElementById('tagMergeTarget_' + catKey);
  const newTag = sel ? sel.value : '';
  if (!newTag) return;
  const affected = MOCK_BUSINESSES.filter(b => b.catKey === catKey && (b.tags || []).includes(oldTag));
  const count = affected.length;
  if (!confirm(`למזג "${oldTag}" לתוך "${newTag}"? ${count} עסק${count===1?' יעבור':'ים יעברו'} לתגית "${newTag}" — כתיבה אמיתית ל-Firestore, לא ניתנת לביטול אוטומטי.`)) return;
  try {
    const batch = writeBatch(db);
    affected.forEach(b => {
      const newTags = [...new Set(b.tags.map(t => t === oldTag ? newTag : t))]; // Set מונע כפילות אם העסק כבר החזיק גם את שתי התגיות שהתמזגו
      const patch = { tags: newTags };
      if (b.tagSecondSuggestion === oldTag) patch.tagSecondSuggestion = newTag;
      batch.update(doc(db, 'businesses', b.id), patch);
    });
    await batch.commit();
  } catch (e) { console.error(e); alert('שגיאה במיזוג: ' + e.message); return; }
  const pool = TAGS_BY_CATEGORY_MOCK[catKey] || [];
  const idx = pool.indexOf(oldTag);
  if (idx > -1) pool.splice(idx, 1);
  await saveTagTaxonomy();
  tagsMgmtMerging = null;
  alert(`✅ מוזג — ${count} עסק${count===1?' עבר':'ים עברו'} בפועל ל-"${newTag}"`);
  renderMain();
};

function tagRowHtml(catKey, tag) {
  const count = tagUsageCount(catKey, tag);
  const isEditing = tagsMgmtEditing && tagsMgmtEditing.catKey === catKey && tagsMgmtEditing.tag === tag;
  const isMerging = tagsMgmtMerging && tagsMgmtMerging.catKey === catKey && tagsMgmtMerging.tag === tag;
  if (isEditing) {
    return `
      <div class="tagmgmt-tag-row">
        <div class="tagmgmt-inline-form">
          <input type="text" id="tagEditInput_${catKey}" value="${tag}" maxlength="40">
          <button class="act-btn approve tiny" onclick="confirmRenameTag('${catKey}','${jsq(tag)}')">💾 שמור</button>
          <button class="act-btn tiny" onclick="cancelTagEdit()">ביטול</button>
        </div>
      </div>`;
  }
  if (isMerging) {
    const targets = (TAGS_BY_CATEGORY_MOCK[catKey] || []).filter(t => t !== tag);
    return `
      <div class="tagmgmt-tag-row">
        <div class="tagmgmt-inline-form">
          <span style="font-size:12px;color:var(--text-sm)">מיזוג "${tag}" לתוך:</span>
          <select id="tagMergeTarget_${catKey}">
            ${targets.map(t => `<option value="${t.replace(/"/g,'&quot;')}">${t}</option>`).join('')}
          </select>
          <button class="act-btn approve tiny" onclick="confirmMergeTag('${catKey}','${jsq(tag)}')">🔀 מזג</button>
          <button class="act-btn tiny" onclick="cancelTagMerge()">ביטול</button>
        </div>
      </div>`;
  }
  const usageOpen = tagUsageListOpen && tagUsageListOpen.catKey === catKey && tagUsageListOpen.tag === tag;
  const countLabel = count === 0 ? '⚠️ לא בשימוש' : `${count} עסק${count===1?'':'ים'}`;
  const countHtml = count > 0
    ? `<button class="tagmgmt-tag-count" onclick="toggleTagUsageList('${catKey}','${jsq(tag)}')" title="לחצו לראות אילו עסקים בדיוק">${countLabel} ${usageOpen ? '▴' : '▾'}</button>`
    : `<span class="tagmgmt-tag-count zero">${countLabel}</span>`;
  // כפתורים כטקסט-נקי במקום אייקוני-אימוג'י, וספירת-השימוש ליד שם-התגית (2026-08-04, בקשת המשתמש
  // + תואם-handoff שכבר תיעד את זה כפער ב-§148: "כפתורים-עם-אימוג'ים... במקום טקסט-נקי-נייבי").
  return `
    <div class="tagmgmt-tag-row">
      <span class="tagmgmt-tag-name">${tag}</span>
      ${countHtml}
      <div style="flex:1"></div>
      <div class="tagmgmt-tag-actions">
        <button class="tagmgmt-text-btn" onclick="startTagEdit('${catKey}','${jsq(tag)}')">שינוי שם</button>
        <button class="tagmgmt-text-btn" onclick="startTagMerge('${catKey}','${jsq(tag)}')">מיזוג</button>
        <button class="tagmgmt-text-btn ${count ? '' : 'danger'}" title="${count ? 'לא ניתן למחוק — יש עסקים שמשתמשים בתגית' : 'מחק תגית'}" onclick="deleteTag('${catKey}','${jsq(tag)}')">מחיקה</button>
      </div>
    </div>
    ${usageOpen ? tagUsageListHtml(catKey, tag) : ''}`;
}

// רשימת העסקים שמשתמשים בתגית בפועל (ראשית או שנייה) — נפתחת בלחיצה על כפתור הכמות, כל שורה קופצת ל"כל העסקים"
function tagUsageListHtml(catKey, tag) {
  const list = MOCK_BUSINESSES.filter(b => b.catKey === catKey && (b.tags || []).includes(tag));
  return `
    <div class="tagmgmt-usage-list">
      ${list.map(b => `
        <div class="tagmgmt-usage-item" onclick="jumpToBizFromTagQueue('${b.id}')">
          <span>${b.name}</span><span class="tagmgmt-usage-arrow">→</span>
        </div>`).join('')}
    </div>`;
}
window.toggleTagUsageList = function(catKey, tag) {
  tagUsageListOpen = (tagUsageListOpen && tagUsageListOpen.catKey === catKey && tagUsageListOpen.tag === tag)
    ? null : { catKey, tag };
  renderMain();
};

function tagCategoryCardHtml(cat) {
  const pool = TAGS_BY_CATEGORY_MOCK[cat.key] || [];
  const shown = tagCategorySortedFiltered(cat.key);
  const addOpen = !!tagsMgmtAdding[cat.key];
  return `
    <div class="tagmgmt-cat-card">
      <div class="tagmgmt-cat-head">${cat.label} <span class="tag-chip empty">${pool.length} תגיות</span></div>
      <div class="tagmgmt-cat-body">
      ${tagCatalogFilterBarHtml()}
      ${shown.map(t => tagRowHtml(cat.key, t)).join('') || `<div class="placeholder-note" style="padding:14px">${pool.length ? 'אין תגיות תואמות לסינון' : 'אין תגיות בקטגוריה זו'}</div>`}
      ${addOpen ? `
      <div class="tagmgmt-add-row">
        <input type="text" id="tagAddInput_${cat.key}" placeholder="שם תגית חדשה...">
        <button class="act-btn approve tiny" onclick="confirmAddTag('${cat.key}')">➕ הוסף</button>

// ══════════════════ עסק השבוע · הטבת השבוע ══════════════════
// לפי המפרט המלא של המשתמש ("עסק השבוע והטבת השבוע — שתי שאלות.md"). **סבב שלישי (2026-08-04):**
// המשתמש ביקש שהמסך כולו יתייחס ל-2 המסלולים כ-2 יוזמות נפרדות שמנוהלות בנפרד לגמרי, כולל
// טאב-מתג עליון. **סבב רביעי (2026-08-05, אחרי בדיקה חיה של הגרסה-המופרדת):** המשתמש ראה את זה
// בפועל וביקש הפוך — לאחד את 2 המסלולים לאותו מסך אחד (בלי טאב-מתג, שני live-cards זה-לצד-זה,
// רשימת "מי הביע עניין" ממוזגת עם צ'יפ-לכל-מסלול) — מחליף את ההחלטה מהסבב השלישי. weekly_schedule
// עדיין **מסמך אחד = שיבוץ אחד למסלול אחד בשבוע אחד** (`track: 'business'|'benefit'`) — זה לא
// השתנה, רק התצוגה: לוח-השבועות/היסטוריה נשארים 2 רשימות נפרדות-אך-גלויות-יחד-על-אותו-מסך (לא
// טאב-מתג, לא מיזוג-שורה-לשורה שהיה דורש איחוד-לוגיקת-עריכה מסוכן). "מי הביע עניין" כן מוזג
// לרשימה אחת — weekly_interest ממילא מסמך-אחד-לעסק (contactStatus משותף לשני המסלולים במכוון,
// זו אותה שיחת-טלפון), כך שמיזוג-תצוגה כאן זול ובטוח, לא רק אפשרי.

function weekStartOf(d) {
  const dt = new Date(d);
  dt.setHours(0, 0, 0, 0);
  dt.setDate(dt.getDate() - dt.getDay());
  return dt;
}
function weekStartStr(d) { return weekStartOf(d).toISOString().slice(0, 10); }
function weekEndDate(weekStr) { const end = new Date(weekStr + 'T00:00:00'); end.setDate(end.getDate() + 7); return end; }
function fmtWeekRange(weekStr) {
  if (!weekStr) return '—';
  const start = new Date(weekStr + 'T00:00:00');
  const end = new Date(start); end.setDate(end.getDate() + 6);
  return `${fmtDate(start)}–${fmtDate(end)}`;
}
function isCurrentWeek(weekStr) { return !!weekStr && new Date() >= new Date(weekStr + 'T00:00:00') && new Date() < weekEndDate(weekStr); }
function isFutureWeek(weekStr) { return !!weekStr && new Date(weekStr + 'T00:00:00') > new Date(); }
function isPastWeek(weekStr) { return !!weekStr && weekEndDate(weekStr) <= new Date(); }
function daysLeftInWeek(weekStr) { return Math.max(0, Math.ceil((weekEndDate(weekStr) - new Date()) / DAY_MS)); }

function weeklyScheduleForTrack(track) { return WEEKLY_SCHEDULE.filter(s => s.track === track); }
function scheduleRowsFor(bizId, track) { return WEEKLY_SCHEDULE.filter(s => s.businessId === bizId && s.track === track); }
function weeklyDerivedStatus(w, track) {
  const rows = scheduleRowsFor(w.businessId, track);
  if (rows.some(s => isCurrentWeek(s.weekStart) || isFutureWeek(s.weekStart))) return 'scheduled';
  if (rows.some(s => isPastWeek(s.weekStart))) return 'done';
  return w.contactStatus; // pending | contacted | declined
}
const WEEKLY_STATUS_LABELS = { pending: 'ממתין לשיחה', contacted: 'דיברנו, מוכן', declined: 'הוסר מהרשימה', scheduled: 'נקבע תור', done: 'היה כבר' };
const WEEKLY_TRACK_LABELS = { business: '🏆 עסק השבוע', benefit: '🎁 הטבת השבוע' };

// ── חלק 1: על האוויר עכשיו ──────────────────────────────────────────────
function weeklyLiveCardHtml(track) {

  const b = live ? bizById(live.businessId) : null;
  if (!live || !b) return `<div class="wk-live-card empty"><div class="wk-live-label">${label}</div><div class="placeholder-note" style="padding:10px 0">אין כרגע עסק משובץ</div></div>`;
  const img = live.image ? `<img src="${live.image}" class="wk-live-img" alt="">` : '';
  return `

// כל העסקים המאושרים יכולה להיות ארוכה, וגלילה ב-<select> לא נוחה. מועמדים "אמיתיים" (מי שסימן

// אחר מוצג עם "(לא ביקש/ה)" — כדי לשמר את ההבחנה "הצענו להם" (סעיף 3 במפרט) גם בלי optgroup
// (datalist לא תומך בקיבוץ ויזואלי). המיפוי טקסט-מוצג→ID נשמר ב-weeklyBizNameMaps, לא כתוב כ-HTML
// inline (script בתוך innerHTML לא רץ) — syncWeeklyBizPick קורא ממנו כשהמשתמש מקליד/בוחר.
let weeklyBizNameMaps = {}; // { [scheduleId]: { [תווית-מוצגת]: businessId } }

function weeklyBizPickerHtml(scheduleId, track, alreadyPickedId) {
  const flagKey = track === 'business' ? 'wantsBusinessOfWeek' : 'wantsBenefitOfWeek';
  const requested = weeklyInterestMerged().filter(w => w[flagKey] && w.contactStatus === 'contacted' && bizById(w.businessId)).map(w => bizById(w.businessId));
  const requestedIds = new Set(requested.map(b => b.id));
  const already = alreadyPickedId ? bizById(alreadyPickedId) : null;
  const manualPool = MOCK_BUSINESSES.filter(b => b.status === 'approved' && !requestedIds.has(b.id) && b.id !== alreadyPickedId);

  const map = {};
  const labels = [];
  const addOpt = (b, suffix) => {
    if (!b || map[b.name + suffix]) return;
    const label = suffix ? `${b.name} ${suffix}` : b.name;
    map[label] = b.id;
    labels.push(label);
  };
  requested.forEach(b => addOpt(b, ''));
  if (already && !requestedIds.has(already.id)) addOpt(already, '(הוצע ידנית)');
  manualPool.forEach(b => addOpt(b, '(לא ביקש/ה)'));

  weeklyBizNameMaps[scheduleId] = map;
  const currentLabel = already ? (labels.find(l => map[l] === already.id) || already.name) : '';
  const dlId = 'wkBizDL_' + scheduleId;
  return `
    <input type="text" id="wkSchedBizSearch_${scheduleId}" list="${dlId}" value="${esc(currentLabel)}"
      placeholder="הקלידו לחיפוש שם עסק, או השאירו ריק לביטול בחירה" oninput="syncWeeklyBizPick('${scheduleId}')" autocomplete="off">
    <datalist id="${dlId}">${labels.map(l => `<option value="${esc(l)}">`).join('')}</datalist>
    <input type="hidden" id="wkSchedBiz_${scheduleId}" value="${already ? already.id : ''}">`;
}
window.syncWeeklyBizPick = function(scheduleId) {
  const input = document.getElementById('wkSchedBizSearch_' + scheduleId);
  const hidden = document.getElementById('wkSchedBiz_' + scheduleId);
  const map = weeklyBizNameMaps[scheduleId] || {};
  hidden.value = map[input.value] || '';
};

          <div class="step-field"><div class="step-field-h">תמונה מיוחדת</div><input type="file" id="wkImage_${s.id}" accept="image/*">${s.image ? `<div class="step-field-was">קיימת תמונה — <a href="${s.image}" target="_blank">צפייה</a></div>` : ''}</div>

        <button class="act-btn reject tiny" onclick="deleteWeeklySchedule('${s.id}')">🗑 מחיקת שבוע</button>
      </div>` : `
      <div class="wk-sched-actions"><button class="act-btn tiny" onclick="startWeeklyEdit('${s.id}')">✏️ שיבוץ ועריכת תוכן</button></div>`}

window.saveWeeklySchedule = async function(id) {
  const s = WEEKLY_SCHEDULE.find(x => x.id === id);
  if (!s) return;
  const updates = {
    businessId:       document.getElementById('wkSchedBiz_' + id).value || null,
    noticePreference: document.getElementById('wkSchedNotice_' + id).value || null,
    status:           document.getElementById('wkSchedStatus_' + id).value,
    rawNotes:         document.getElementById('wkRawNotes_' + id).value.trim(),
    title:            document.getElementById('wkTitle_' + id).value.trim(),
    bodyText:         document.getElementById('wkBodyText_' + id).value.trim(),
    historyNote:      document.getElementById('wkHistoryNote_' + id).value.trim(),
  };
  if (updates.status === 'confirmed' && s.status !== 'confirmed') {
    updates.approvedBy = CURRENT_ADMIN.name;
    updates.approvedAt = serverTimestamp();
  }
  try {
    const imageFile = document.getElementById('wkImage_' + id)?.files[0];
    if (imageFile) {
      const compressed = await compressToFile(imageFile, 1280, 0.82, imageFile.name);
      updates.image = await uploadFile(compressed, `weeklySchedule/${id}/img_${Date.now()}`);
    }
    await updateDoc(doc(db, 'weekly_schedule', id), updates);
    weeklyEditingId = null;
    await logActivity('weekly_schedule', id, { type: 'weeklyScheduleSave', title: 'עדכון שיבוץ ותוכן שבוע', detail: `${WEEKLY_TRACK_LABELS[s.track]} · ${fmtWeekRange(s.weekStart)}`, field: 'status', before: s.status, after: updates.status });
  } catch (e) { console.error(e); alert('שגיאה בשמירה: ' + e.message); }
};

window.declineWeeklyInterest = async function(id) {

  if (!w) return;
  try {
    const realId = await ensureWeeklyInterestId(id);
    if (!realId) return;
    await updateDoc(doc(db, 'weekly_interest', realId), { contactStatus: 'declined' });
    await logActivity('weekly_interest', realId, { type: 'weeklyDecline', title: 'הוסר מהרשימה', field: 'contactStatus', before: w.contactStatus, after: 'declined' });
  } catch (e) { console.error(e); alert('שגיאה: ' + e.message); }
};
window.bulkMarkWeeklyContacted = async function() {
  for (const id of [...selectedWeeklyIds]) await markWeeklyContacted(id);
  selectedWeeklyIds.clear(); renderMain();
};
window.bulkDeclineWeekly = async function() {
  for (const id of [...selectedWeeklyIds]) await declineWeeklyInterest(id);
  selectedWeeklyIds.clear(); renderMain();
};
window.bulkWeeklyFollowupMail = function() {
  const rows = weeklyInterestMerged();
  [...selectedWeeklyIds].forEach(id => {
    const w = rows.find(x => x.id === id);
    const b = w && bizById(w.businessId);
    if (!b || !b.ownerEmail) return;
    const subject = DEFAULT_WEEKLY_FOLLOWUP_SUBJECT;
    const body = DEFAULT_WEEKLY_FOLLOWUP_MAIL.replace(/\{name\}/g, b.ownerFirst || '').replace(/\{business\}/g, b.name);
    // window.open חייב לרוץ סינכרונית מתוך הקליק — פותחים קודם, ורק אז יוצרים/רושמים ביומן
    window.open(gmailComposeLink(b.ownerEmail, subject, body), '_blank');
    ensureWeeklyInterestId(id)
      .then(realId => realId && logActivity('weekly_interest', realId, { type: 'email', title: 'נשלח מייל מעקב "נחזור אליכם"', detail: `אל ${b.ownerEmail}`, field: 'channel', before: null, after: 'email' }))
      .catch(e => console.error('weekly followup log failed:', e));
  });
};

// מסך-אחד ממוזג לשני המסלולים (2026-08-05, המשך §150 — המשתמש ראה את הגרסה-המופרדת חי וביקש
// הפוך: לאחד למסך אחד, בלי עמודה-שלישית קבועה — הפאנלים עוברים לתחתית העמוד, לא לצד). "מי הביע
// עניין" ממוזג לשורה-אחת-לעסק (weekly_interest ממילא מסמך-אחד-לעסק) עם צ'יפ-פר-מסלול. לוח-השבועות
// והיסטוריה נשארים 2 רשימות נפרדות אך גלויות-יחד-זו-לצד-זו (לא טאב-מתג, לא מיזוג-שורה-לשורה
// שהיה דורש איחוד-לוגיקת-עריכה מסוכן — כל שיבוץ עדיין מסמך נפרד ל-track אחד).

// ── §263 — מקור-אמת יחיד ל"מי הביע עניין" ────────────────────────────────────────────────
// עד עכשיו המסך קרא **רק** מ-weekly_interest. רשומה כזו נכתבת אך ורק בהרשמה הראשונית
// (business.html §145), ולכן בעל-עסק שסימן את השאלות מאוחר יותר בדשבורד שלו
// (business-dashboard.html → saveDiscount → stageChanges → אישור מנהל) עדכן רק את
// wantsBusinessOfWeek/wantsBenefitOfWeek על מסמך העסק — ונעלם מהמסך הזה לגמרי.
// המיזוג: **מסמך העסק הוא הקובע לגבי מה סומן** (שם זה מתעדכן בכל עריכה), ו-weekly_interest
// מחזיק רק את *סטטוס-הפנייה*. עסק שהדגל דלוק עליו מופיע תמיד, גם בלי רשומת-תור — ובעל-עסק
// שהוריד את הסימון יורד מהרשימה גם אם נשארה לו רשומה ישנה.
function weeklyInterestMerged() {
  const byBiz = {};
  WEEKLY_INTEREST.forEach(w => { if (w.businessId) byBiz[w.businessId] = w; });
  return MOCK_BUSINESSES
    .filter(b => b.wantsBusinessOfWeek || b.wantsBenefitOfWeek)
    .map(b => {
      const w = byBiz[b.id] || null;
      return {
        ...(w || {}),
        id: w ? w.id : 'virtual:' + b.id,
        virtual: !w,
        businessId: b.id,
        wantsBusinessOfWeek: !!b.wantsBusinessOfWeek,
        wantsBenefitOfWeek: !!b.wantsBenefitOfWeek,
        requestedAt: (w && w.requestedAt) || b.changeSubmittedAt || b.approvedAt || b.registeredAt || new Date(0),
        contactStatus: (w && w.contactStatus) || 'pending',
      };
    });
}

// שורה "וירטואלית" = העסק סימן אבל אין לו עדיין רשומת-תור. הפעולה הראשונה עליה (דיברנו/הסרה/
// מייל-מעקב) יוצרת את הרשומה בפועל ורק אז מעדכנת — המנהל מורשה create מלא (firestore.rules).
// מחזיר מזהה-מסמך אמיתי, או null אם העסק לא נמצא.
async function ensureWeeklyInterestId(rowId) {
  const key = String(rowId);
  if (!key.startsWith('virtual:')) return key;
  const bizId = key.slice('virtual:'.length);
  const existing = WEEKLY_INTEREST.find(w => w.businessId === bizId);
  if (existing) return existing.id;
  const b = bizById(bizId);
  if (!b) return null;
  const created = await addDoc(collection(db, 'weekly_interest'), {
    businessId: bizId,
    wantsBusinessOfWeek: !!b.wantsBusinessOfWeek,
    wantsBenefitOfWeek: !!b.wantsBenefitOfWeek,
    requestedAt: serverTimestamp(),
    contactStatus: 'pending',
    scheduledWeek: null, scheduledTrack: null, contentStatus: 'missing',
  });
  return created.id;
}

  const marks = tracks.map(t => `<span class="tag-chip">${WEEKLY_TRACK_LABELS[t]}</span>`).join(' ');
  const statusLines = tracks.map(t => `<div>${WEEKLY_TRACK_LABELS[t]}: ${WEEKLY_STATUS_LABELS[weeklyDerivedStatus(w, t)] || ''}</div>`).join('');

  const mailBtn = b.ownerEmail ? `<button class="act-btn tiny" onclick="sendBizMail('${b.id}','${b.ownerEmail}','${escJsAttr(b.ownerFirst||'')}','${escJsAttr(b.name)}','${b.accessToken||''}')">מייל</button>` : '';

      <div class="wk-row-actions">

        ${w.contactStatus === 'pending' ? `<button class="act-btn approve tiny" onclick="markWeeklyContacted('${w.id}')">דיברנו איתם</button>` : ''}
        ${w.contactStatus !== 'declined' ? `<button class="act-btn reject tiny" onclick="declineWeeklyInterest('${w.id}')">הסרה</button>` : ''}
      </div>
    </div>`;
}

    .filter(w => {

      return w.contactStatus === weeklyStatusFilter;

    .sort((a, b) => weeklySort === 'oldest' ? a.requestedAt - b.requestedAt : b.requestedAt - a.requestedAt);
  const chip = (key, label) => `<button class="biz-class-pill ${weeklyStatusFilter===key?'active':''}" onclick="setWeeklyStatusFilter('${key}')">${label} · ${counts[key]}</button>`;

// כותרת-עמוד דינמית + KPI אמיתיים, ממוזגת על 2 המסלולים ביחד.
function weeklyHeaderHtml() {
  const allInterest = weeklyInterestMerged().filter(w => bizById(w.businessId));
  const pendingCount = allInterest.filter(w => w.contactStatus === 'pending').length;
  const upcoming = [...weeklyScheduleForTrack('business'), ...weeklyScheduleForTrack('benefit')].filter(s => !isPastWeek(s.weekStart));
  const filledUpcoming = upcoming.filter(s => s.businessId).length;
  let title;
  if (pendingCount > 0) title = pendingCount === 1 ? `עסק אחד מחכה לשיחה השבוע` : `${pendingCount} עסקים מחכים לשיחה השבוע`;
  else if (upcoming.length && filledUpcoming < upcoming.length) {
    const empty = upcoming.length - filledUpcoming;
    title = `אין ממתינים לשיחה כרגע — אבל ${empty === 1 ? 'שבוע אחד עדיין ריק' : empty + ' שבועות עדיין ריקים'}`;
  }
  else title = `הכל מטופל — אין ממתינים ואין שבועות ריקים`;
  return `
    <div class="msg-content-head">
      <div style="flex:1;min-width:230px">
        <div class="msg-crumb"><a onclick="selectTab('${HOME_KEY}')">← מרכז המשימות</a><span>/</span><span>עסק השבוע · הטבת השבוע</span></div>
        <div class="msg-page-title">${title}</div>
      </div>
      <div class="msg-kpis">
        <div><div class="msg-kpi-num">${allInterest.length}</div><div class="msg-kpi-label">ברשימת ההמתנה</div></div>
        <div class="msg-kpi-sep"></div>
        <div><div class="msg-kpi-num">${pendingCount}</div><div class="msg-kpi-label">ממתינים לשיחה</div></div>
        <div class="msg-kpi-sep"></div>
        <div><div class="msg-kpi-num">${filledUpcoming}<span style="font-size:13px;font-weight:500;color:var(--text-sm)">/${upcoming.length}</span></div><div class="msg-kpi-label">שבועות מאוכלסים</div></div>
      </div>
    </div>`;
}

function weeklyScheduleBlockHtml(track, past) {
  const list = weeklyScheduleForTrack(track)
    .filter(s => past ? isPastWeek(s.weekStart) : !isPastWeek(s.weekStart))
    .sort((a, b) => past ? b.weekStart.localeCompare(a.weekStart) : a.weekStart.localeCompare(b.weekStart));
  const emptyMsg = past ? 'אין עדיין היסטוריה — שבועות עוברים לכאן אוטומטית אחרי שהשבוע מסתיים' : `אין עדיין שבועות בלוח ל${WEEKLY_TRACK_LABELS[track]}`;
  return `<div class="wk-sched-list">${list.map(s => weeklyScheduleRowHtml(s)).join('') || `<div class="placeholder-note">${emptyMsg}</div>`}</div>`;
}

function weeklyActionPanelHtml() {
  const pending = weeklyInterestMerged().filter(w => w.contactStatus === 'pending' && bizById(w.businessId))
    .sort((a, b) => a.requestedAt - b.requestedAt).slice(0, 3);
  const emptyWeeks = [...weeklyScheduleForTrack('business'), ...weeklyScheduleForTrack('benefit')]
    .filter(s => !isPastWeek(s.weekStart) && !s.businessId)
    .sort((a, b) => a.weekStart.localeCompare(b.weekStart)).slice(0, 2);

  const items = [
    ...pending.map(w => {
      const b = bizById(w.businessId);
      const marks = [w.wantsBusinessOfWeek ? WEEKLY_TRACK_LABELS.business : null, w.wantsBenefitOfWeek ? WEEKLY_TRACK_LABELS.benefit : null].filter(Boolean).join(' + ');
      return { title: b.name, sub: `ביקש/ה ${marks} · ${agoLabel(w.requestedAt)} · טרם דובר`, onclick: `jumpToBizFromTagQueue('${b.id}')` };
    }),
    ...emptyWeeks.map(s => ({ title: `${fmtWeekRange(s.weekStart)} · ${WEEKLY_TRACK_LABELS[s.track]}`, sub: `אין עסק משובץ לשבוע הזה`, onclick: `startWeeklyEdit('${s.id}')` })),
  ];

  if (!items.length) {
    return `
      <div class="expiring-panel wk-action-panel">
        <div class="expiring-title">✓ דורש פעולה</div>
        <div class="expiring-empty">אין כרגע פריטים שדורשים פעולה.</div>

  }
  return `
    <div class="expiring-panel wk-action-panel">
      <div class="expiring-title">⚠️ דורש פעולה</div>
      <div class="expiring-subgroup">

          </div>`).join('')}
        </div>
      </div>
    </div>`;
}

  document.getElementById('broadcastSubject').value = subj;
  document.getElementById('broadcastBody').value = body;
  updateBroadcastPreview();
};

function broadcastAudience() {
  if (broadcastAudienceType === 'fans') {
    if (selectedFanIds.size) return [...selectedFanIds].map(id => findFan(id)).filter(Boolean);
    return MOCK_FANS.filter(f => f.status === 'approved');
  }
  if (selectedBizIds.size) return [...selectedBizIds].map(id => bizById(id)).filter(Boolean);
  return MOCK_BUSINESSES.filter(b => b.status === 'approved');
}

let tplFirestoreData = {};
let tplSiteTextsData = {};
let openTemplateId = null;
window.toggleTemplateItem = function(id) {
  openTemplateId = (openTemplateId === id) ? null : id;
  renderMain();
};

function tplGetLocal(key, fallback) { return localStorage.getItem('_hb_tpl_' + key) || fallback; }
function tplSetLocal(key, val) { localStorage.setItem('_hb_tpl_' + key, val); }
function findMessageTemplate(id) { return MESSAGE_TEMPLATE_ITEMS.find(i => i.id === id); }
function tplFieldValue(item, f) {
  return item.storage === 'firestore' ? (tplFirestoreData[f.key] ?? item.defaults[f.key])
    : item.storage === 'firestoreSite' ? (tplSiteTextsData[f.key] ?? item.defaults[f.key])
    : tplGetLocal(f.key, item.defaults[f.key]);
}

window.saveTemplateItem = async function(id) {
  const item = findMessageTemplate(id);
  const values = {};
  item.fields.forEach(f => values[f.key] = document.getElementById('tplField_' + f.key).value);
  if (item.storage === 'firestore' || item.storage === 'firestoreSite') {
    const targetDoc = item.storage === 'firestore' ? TPL_SETTINGS_DOC() : TPL_SITE_TEXTS_DOC();
    const cache = item.storage === 'firestore' ? tplFirestoreData : tplSiteTextsData;
    try {
      await setDoc(targetDoc, values, { merge: true });
      Object.assign(cache, values);
      alert('✅ נשמר');
    } catch (e) {
      // קוד השגיאה (permission-denied / unavailable / invalid-argument) הוא מה שמבדיל בין
      // "אין הרשאה" ל"אין רשת" ל"נתון פסול" — בלעדיו הדיווח הוא תמיד 'לא נשמר, יש שגיאה'.
      console.error('[שמירת תבנית]', e);
      alert('שגיאה בשמירה\n\nקוד: ' + (e.code || 'לא ידוע') + '\n' + (e.message || ''));
    }
  } else {
    Object.entries(values).forEach(([k, v]) => tplSetLocal(k, v));
    alert('✅ נשמר');
  }
  renderMain();
};

// ── תצוגה מקדימה אמיתית של המייל ──────────────────────────────────────────────────────────
// עד §311 היה כאן עותק-מראה מלא של מנוע-העיצוב של הוורקר ("קוד מוכפל בכוונה"), וכל תוספת-עיצוב
// הייתה חייבת להיכתב פעמיים כדי שהתצוגה לא תשקר. עכשיו שני הצדדים מייבאים את mail-format.js —
// renderMailHtml כאן ו-renderMailHtml שם הם אותה פונקציה, ולכן התצוגה **היא** המייל.
// mailPreviewDocHtml בונה את מה שנשלח בפועל: גוף המכתב + הפוטר שמתווסף ריכוזית ב-sendBrevoEmail.
function mailPreviewDocHtml(body, vars, linkLabel) {
  const html = renderMailHtml(body, vars, { linkLabel, padding: '16px 24px', extraStyle: 'background:#fff' });
  return `<div style="background:#fff">${html}<div style="padding:0 18px 16px">${mailFooterHtml(html)}</div></div>`;
}

// ── סרגל העיצוב של גוף המייל (§311) ───────────────────────────────────────────────────────
// הכפתורים כותבים סימונים לתוך הטקסט עצמו (*מודגש*, - פריט, {center}, {big}...) — mail-format.js
// הופך אותם ל-HTML. למה לא עורך WYSIWYG: ההסבר המלא בראש mail-format.js — בקצרה, הגוף נשמר
// כטקסט חופשי, עובר escape לפני הרינדור (הגנת XSS) ונשלח גם כגרסת-טקסט-חלופית; עורך שמייצר
// HTML היה שובר את שלושתם ומוצג ללקוח כתגיות מילוליות.
//
// ⚠️ הסרגל מוצג **רק** על שדות שהוורקר מרנדר: השידור ההמוני וגוף המיילים האוטומטיים. הוא לא
// מוצג על "נמענים נבחרים" ועל תבניות ה-WhatsApp — אלה נפתחים ב-Gmail/וואטסאפ כטקסט גולמי, ושם
// הסימונים היו מגיעים לנמען ככוכביות וסוגריים מסולסלים במקום עיצוב.
const MAIL_FMT_SIZES = [['big', 'כותרת גדולה'], ['mid', 'כותרת'], ['small', 'קטן']];

function mailToolbarHtml(targetId, tplId, currentBody) {
  const call = (action, val) => `mailFmt('${targetId}','${action}','${val || ''}','${tplId || ''}')`;
  // data-mfmt הוא הידית של mailFmtSyncBar לסימון הכפתורים הפעילים על הפסקה/שורה הנוכחית
  const btn = (action, label, title) => `<button type="button" class="mfmt-btn" data-mfmt="${action}" title="${title}" onclick="${call(action)}">${label}</button>`;
  const fontKey = mailFontKey(currentBody || '');
  return `
    <div class="mail-fmt-bar" id="mfmtBar_${targetId}">
      ${btn('bold', '<b>B</b>', 'מודגש — עוטף את הטקסט המסומן בכוכביות')}
      ${btn('italic', '<i>I</i>', 'נטוי')}
      <span class="mfmt-sep"></span>
      ${MAIL_FMT_SIZES.map(([k, l]) => btn(k, l, 'גודל הכתב של הפסקה — לחיצה נוספת מבטלת')).join('')}
      <span class="mfmt-sep"></span>
      ${btn('center', '⇔ מרכוז', 'ממרכז את הפסקה — לחיצה נוספת מבטלת')}
      ${btn('bullet', '• רשימה', 'הופך את השורות המסומנות לרשימת נקודות')}
      ${btn('quote', '▎הדגשה', 'תיבת הדגשה צהובה')}
      ${btn('hr', '— קו מפריד', 'קו מפריד בין חלקי המכתב')}
      ${btn('link', '🔗 כפתור', 'מוסיף את {link} כפסקה נפרדת — הופך לכפתור צהוב ממותג')}
      <span class="mfmt-sep"></span>
      <span class="mfmt-lbl">גופן</span>
      <select class="mfmt-select" onchange="mailFmt('${targetId}','font',this.value,'${tplId || ''}')">
        ${MAIL_FONTS.map(f => `<option value="${f.key}" ${f.key === fontKey ? 'selected' : ''}>${esc(f.label)}</option>`).join('')}
      </select>
    </div>`;
}
// שורת-העזרה יושבת **מתחת** לתיבת הטקסט ולא בין הסרגל לתיבה: הסרגל בנוי כהמשך-מסגרת של התיבה
// (בלי מסגרת תחתונה, פינות מעוגלות רק למעלה), וכל דבר שנדחף ביניהם משאיר אותו קופסה פתוחה באוויר.
function mailFmtHintHtml() {
  return `<div class="mail-fmt-hint">אפשר גם להקליד ידנית: <code>*מודגש*</code> · <code>_נטוי_</code> · <code>- פריט</code> · <code>&gt; הדגשה</code> · <code>---</code> · <code>{center}</code> <code>{big}</code> <code>{mid}</code> <code>{small}</code> בתחילת פסקה</div>`;
}

// ── פעולות העריכה ─────────────────────────────────────────────────────────────────────────
// כולן עובדות ישירות על ה-textarea ומחזירות את הפוקוס והסימון, ואז מרעננות רק את קופסת-התצוגה
// (לא renderMain — הוא היה בונה מחדש את השדה מהערך השמור ומוחק כל מה שנכתב ועוד לא נשמר).
//
// **כל פעולה חייבת לכבד בחירה מרובה.** הגרסה הראשונה של הסרגל טיפלה רק בפסקה שהסמן בה,
// ולכן "סמן הכל ← מרכוז" מרכז פסקה אחת מתוך עשר — המשתמש דיווח על זה מיד. הכלל עכשיו:
// כפתור-פסקה חל על **כל** הפסקאות שהבחירה נוגעת בהן, כפתור-שורה על כל השורות, וסימון-תוך-שורה
// על כל שורה בבחירה בנפרד. הביטול הוא "אם כולן כבר מסומנות — הסר מכולן", כמו בכל עורך.
//
// mailFmtReplace מחליף טווח דרך execCommand ולא ב-ta.value=: השמה ישירה **מוחקת את היסטוריית
// ה-Undo של הדפדפן**, כלומר Ctrl+Z אחרי לחיצה על כפתור לא היה מחזיר כלום. יש נפילה-לאחור
// להשמה ישירה אם הפקודה לא נתמכת.
function mailFmtReplace(ta, start, end, text, selStart, selEnd) {
  ta.focus();
  ta.setSelectionRange(start, end);
  let ok = false;
  try { ok = document.execCommand(text === '' ? 'delete' : 'insertText', false, text); } catch (e) { ok = false; }
  if (!ok || ta.value.slice(start, start + text.length) !== text) {
    const v = ta.value;
    ta.value = v.slice(0, start) + text + v.slice(end);
  }
  ta.setSelectionRange(selStart, selEnd == null ? selStart : selEnd);
}

  // את הרווח שאחריה, ובלי זה הכוכבית הייתה נוחתת אחרי הרווח (*מילה *) במקום צמודה למילה.

// ── סימוני-פסקה ({center}/{big}/{mid}/{small}) ────────────────────────────────────────────

// את "קטן" ולא תצטבר איתו. חל על כל הפסקאות בבחירה — אם לכולן כבר יש הסימון, הוא מוסר מכולן.

    if (!p.trim()) return p;
    let marks = mfmtParaMarks(p).filter(x => (group ? !group.includes(x) : x !== mark));
    if (!allHave) marks.push(mark);
    marks.sort((a, b) => (a === 'center' ? 0 : 1) - (b === 'center' ? 0 : 1)); // סדר קבוע בטקסט הגולמי
    return marks.map(x => `{${x}}`).join('') + mfmtParaBody(p);

// תחילית-שורה (רשימה/תיבת-הדגשה) על כל השורות המסומנות. אם *כולן* כבר מסומנות — מסיר.
function mailFmtToggleLinePrefix(ta, prefix, rx) {

  // הסימון היה הופך לחלק מהטקסט של הפריט ומודפס לנמען.

// אחרי הבחירה הנוכחית (לא במקומה — בחירה קיימת אף פעם לא נמחקת בלחיצה על כפתור).

// מוחלף רק הקידומת ולא כל הטקסט — כדי לא לזרוק את הסמן ואת ה-Undo על כל המכתב.

// ── סנכרון מצב-הכפתורים ───────────────────────────────────────────────────────────────────
// בלי זה אי אפשר לדעת מה כבר מופעל על הפסקה שהסמן בה, וכפתור-מתג בלי מצב-פעיל הוא ניחוש.
// selectionchange גלובלי ולא מאזין פר-שדה: הסרגל נבנה מחדש בכל renderMain, ומאזין שמוצמד
// לאלמנט היה מת בשקט בכל רינדור.

  const paras = v.slice(ps, pe).split('\n\n').filter(p => p.trim());
  const [ls, le] = mailFmtLineRange(v, ta.selectionStart, ta.selectionEnd);

  const hasPrefix = (rx) => lines.length > 0 && lines.every(l => rx.test(mfmtParaBody(l)));

    const a = b.dataset.mfmt;
    let on = false;
    if (a === 'center' || a === 'big' || a === 'mid' || a === 'small') on = hasMark(a);
    else if (a === 'bullet') on = hasPrefix(/^[ \t]*[-•][ \t]+/);
    else if (a === 'quote') on = hasPrefix(/^[ \t]*>[ \t]+/);

  const sizes = MAIL_FMT_SIZES.map(([k]) => k);
  if (action === 'bold') mailFmtWrap(ta, '*');
  else if (action === 'italic') mailFmtWrap(ta, '_');
  else if (sizes.includes(action)) mailFmtToggleMark(ta, action, sizes);

// לא 4 כמו MESSAGE_TEMPLATE_ITEMS.length בפועל (9, כי כל גרסת-אודיינס נשמרת כרשומה נפרדת ב-Firestore).
function messageTemplateRowCount() {
  return MESSAGE_TEMPLATE_ITEMS.filter(i => i.group === 'auto' || i.group === 'manual').length + 2;
}

// ── "הודעה בודדת/למספר נמענים" — חיפוש+בחירה מרובה (checkboxes) של עסקים/אוהדים, ואז שליחה
// ידנית לכל אחד בנפרד (מיד קיים: sendBizWA/sendBizMail/sendFanWA/sendFanMail, שורות ~1821) —
// בלי לחפש את השורה ברשימה הארוכה. Set נפרד מ-selectedBizIds/selectedFanIds בכוונה: אלה
// משמשים לבולק-אישור/דחייה ב"כל העסקים"/"כל האוהדים" — לא רוצים שבחירה כאן (ad-hoc, לשליחה
// ידנית בלבד) תתערבב עם זרימת האישור שם.
let manualPickerType = 'businesses'; // 'businesses' | 'fans'
let manualPickerSelectedBizIds = new Set();
let manualPickerSelectedFanIds = new Set();
// מצב-שליחה — שידור-המוני מול נמענים-נבחרים, מתג אחד עם 2 מצבים (§136, לפי מוקאפ
// demo-redesign-admin-messages.html) — מחליף 2 אקורדיונים-עצמאיים ישנים (msgOpenSection/toggleMsgSection).
let msgSendMode = 'broadcast'; // 'broadcast' | 'single'
window.setMsgSendMode = function(m) { msgSendMode = m; renderMain(); };

window.setManualPickerType = function(type) {
  manualPickerType = type;
  renderMain();
};

function manualPickerSelectedSet() {
  return manualPickerType === 'fans' ? manualPickerSelectedFanIds : manualPickerSelectedBizIds;
}

// אותם סינונים בדיוק כמו בבורר הקהל של "שידור המוני" (bizFilteredList/fanFilteredList — סטטוס/
// קטגוריה/מצב-סקירה/בריאות-פרופיל/תאריך/מיון, אותו state גלובלי משותף) — לא בורר-חיפוש נפרד.
function manualPickerListHtml() {
  const isFans = manualPickerType === 'fans';
  const filtered = isFans ? fanFilteredList() : bizFilteredList();
  if (!filtered.length) return `<div class="picker-empty">לא נמצאו תוצאות</div>`;
  const set = manualPickerSelectedSet();
  return filtered.slice(0, 100).map(x => {
    const sel = set.has(x.id);
    const noteFlag = (!isFans && bizHasUnhandledNote(x)) ? ' 💬' : '';
    return `
    <label class="aud-picker-row">
      <input type="checkbox" ${sel?'checked':''} onchange="toggleManualPickerSelect('${x.id}')">
      <span class="nm">${esc(x.name)}${noteFlag}</span>
    </label>`;
  }).join('');
}

window.toggleManualPickerSelect = function(id) {
  const set = manualPickerSelectedSet();
  if (set.has(id)) set.delete(id); else set.add(id);
  renderMain();
};

function manualSelectedRecipientsHtml() {
  const isFans = manualPickerType === 'fans';
  const set = manualPickerSelectedSet();
  if (!set.size) return '';
  const items = [...set].map(id => isFans ? findFan(id) : bizById(id)).filter(Boolean);
  return `<div style="margin-top:12px">` + items.map(x => {
    const waBtn = (isFans ? x.phone : x.ownerPhone) ? `<button class="slot-btn" onclick="sendManualAdhoc('wa','${x.id}')">📲 WhatsApp</button>` : '';
    const mailBtn = (isFans ? x.email : x.ownerEmail) ? `<button class="slot-btn" onclick="sendManualAdhoc('mail','${x.id}')">✉️ מייל</button>` : '';
    // הקשר קטן — אם לעסק יש הודעת "כתבו לנו" ממתינה, נוח לראות אותה כאן לפני שמנסחים תשובה
    const noteHint = (!isFans && bizHasUnhandledNote(x)) ? `<div class="picker-note-hint">💬 העסק כתב: "${esc(x.note)}"</div>` : '';
    return `<div class="selected-recipient-row"><span class="nm">${esc(x.name)}</span>${waBtn}${mailBtn}<button class="slot-btn" onclick="toggleManualPickerSelect('${x.id}')">✕ הסר</button>${noteHint}</div>`;
  }).join('') + `</div>`;
}

// ── עריכת תוכן חד-פעמית ("הודעה בודדת") — בכוונה נפרדת מ-_hb_tpl_* (התבנית הקבועה שמשמשת גם
// את כפתורי 📲/✉️ ליד עסק/אוהד ברשימות): עריכה כאן היא ל-session הזה בלבד, לא נשמרת ולא דורסת
// את התבנית הקבועה. ברירת המחדל בכל שדה היא הערך הנוכחי של התבנית — אפשר לערוך בלי לפגוע בו.
let manualAdhocFields = { wa: null, mailSubject: null, mail: null, fan_wa: null, fan_mailSubject: null, fan_mail: null };
window.setManualAdhocField = function(key, value) {
  manualAdhocFields[key] = value; // בכוונה בלי renderMain() — לא לאבד פוקוס/מיקום סמן בכל הקלדה
};
function manualAdhocValue(item, key) {
  return manualAdhocFields[key] != null ? manualAdhocFields[key] : tplFieldValue(item, item.fields.find(f => f.key === key));
}

function manualAdhocFieldsHtml() {
  const isFans = manualPickerType === 'fans';
  const item = findMessageTemplate(isFans ? 'fanManual' : 'bizManual');
  const waKey = isFans ? 'fan_wa' : 'wa';
  const subjKey = isFans ? 'fan_mailSubject' : 'mailSubject';
  const bodyKey = isFans ? 'fan_mail' : 'mail';
  return `
    <div class="msg-group-label" style="margin-top:16px">✏️ עריכת התוכן לשליחה הזו <span class="hint">— חד-פעמי, לא משנה את התבנית הקבועה למטה</span></div>
    <div class="approve-field-label">📲 תבנית WhatsApp</div>
    <textarea class="broadcast-body-input" rows="5" oninput="setManualAdhocField('${waKey}', this.value)">${esc(manualAdhocValue(item, waKey))}</textarea>
    <div class="approve-field-label">✉️ נושא המייל</div>
    <input type="text" class="chain-select" value="${esc(manualAdhocValue(item, subjKey))}" oninput="setManualAdhocField('${subjKey}', this.value)">
    <div class="approve-field-label">✉️ גוף המייל</div>
    <textarea class="broadcast-body-input" rows="6" oninput="setManualAdhocField('${bodyKey}', this.value)">${esc(manualAdhocValue(item, bodyKey))}</textarea>`;
}

// שליחה בפועל מ"הודעה בודדת" — משתמש בתוכן החד-פעמי (אם נערך) או בברירת המחדל מהתבנית הקבועה,
// עם אותם helper-ים של placeholder בדיוק (applyBizTpl/applyFanTplLocal/waLink, שורות ~1808-1818).
window.sendManualAdhoc = function(channel, id) {
  const isFans = manualPickerType === 'fans';
  const x = isFans ? findFan(id) : bizById(id);
  if (!x) return;
  const item = findMessageTemplate(isFans ? 'fanManual' : 'bizManual');
  if (channel === 'wa') {
    const tpl = manualAdhocValue(item, isFans ? 'fan_wa' : 'wa');
    const msg = isFans ? applyFanTplLocal(tpl, x.name, x.loginCode || '') : applyBizTpl(tpl, x.ownerFirst || '', x.name, x.accessToken || '');
    window.open(waLink(isFans ? x.phone : x.ownerPhone, msg), '_blank');
  } else {
    const subjTpl = manualAdhocValue(item, isFans ? 'fan_mailSubject' : 'mailSubject');
    const bodyTpl = manualAdhocValue(item, isFans ? 'fan_mail' : 'mail');
    const subject = isFans ? subjTpl : applyBizTpl(subjTpl, x.ownerFirst || '', x.name, x.accessToken || '');
    const body = isFans ? applyFanTplLocal(bodyTpl, x.name, x.loginCode || '') : applyBizTpl(bodyTpl, x.ownerFirst || '', x.name, x.accessToken || '');
    window.open(gmailComposeLink(isFans ? x.email : x.ownerEmail, subject, body), '_blank');
  }
};

// גוף-בלבד (בלי עטיפת-כרטיס/כותרת-קיפול משלו) — §136: מוצג בתוך sendNowSectionHtml כשמצב
// המתג הוא 'single'. ההערה "בתבניות הקבועות... שליחה ידנית" עברה להיות hint קבוע במתג עצמו.
function singleSenderBodyHtml() {
  const isFans = manualPickerType === 'fans';
  return `
    <div class="broadcast-audience-toggle">
      <button class="filter-pill ${!isFans?'active':''}" onclick="setManualPickerType('businesses')">🏪 עסקים</button>
      <button class="filter-pill ${isFans?'active':''}" onclick="setManualPickerType('fans')">👥 אוהדים</button>
    </div>
    ${isFans ? fanFilterBarHtml() : bizFilterBarHtml()}
    <div class="picker" style="margin-top:8px">
      <div class="picker-list" id="manualPickerList" style="max-height:280px">${manualPickerListHtml()}</div>
    </div>
    ${manualSelectedRecipientsHtml()}
    ${manualAdhocFieldsHtml()}`;
}

// ── בורר קהל inline לשידור המוני — משתמש **באותם סינונים בדיוק** של "כל העסקים"/"כל האוהדים"
// (bizFilteredList/bizFilterBarHtml — סטטוס/קטגוריה/סוג/מצב-סקירה/בריאות-פרופיל/תאריך/מיון,
// אותו state גלובלי) כדי לענות על הבקשה: "רק לממתינים", "הכי פחות שלבים נסקרו", "פרופיל לא בריא",
// "לפי קטגוריות" — כל אלה כבר קיימים שם, לא הומצאו מחדש. checkboxes על selectedBizIds/selectedFanIds
// (אותו Set שמשמש גם לבולק-אישור/דחייה שם — broadcastAudience() כבר קורא מהם).
// toggleBizSelect/toggleFanSelect/filterBizRows/toggleSelectAllBiz בטוחים לקריאה מכאן כי
// refreshBizList/refreshFanList הפכו ל-tab-aware (ר' למעלה) — נופלים ל-renderMain מלא כשלא
// בטאב "כל העסקים"/"כל האוהדים".
function broadcastAudPickerListHtml() {
  const isFans = broadcastAudienceType === 'fans';
  const filtered = isFans ? fanFilteredList() : bizFilteredList();
  if (!filtered.length) return `<div class="picker-empty">לא נמצאו תוצאות</div>`;
  const set = isFans ? selectedFanIds : selectedBizIds;
  const toggleFn = isFans ? 'toggleFanSelect' : 'toggleBizSelect';
  return filtered.slice(0, 100).map(x => {
    const sel = set.has(x.id);
    return `
    <label class="aud-picker-row">
      <input type="checkbox" ${sel?'checked':''} onchange="${toggleFn}('${x.id}')">
      <span class="nm">${esc(x.name)}</span>
    </label>`;
  }).join('');
}

// ── תצוגה מקדימה של המייל (שלב 5א, §8 במפרט) — placeholders מוחלפים בנתוני הנמען הראשון בקהל.
// applyBroadcastVars זהה בכוונה ל-applyVars ב-worker/src/brevo.js (split/join פשוט, לא regex) —
// אותה לוגיקת-החלפה בדיוק כמו מה שהוורקר עושה בפועל בזמן שליחה, כדי שהתצוגה תהיה נאמנה.
function broadcastVarsFor(item, isFans) {
  const base = `${location.origin}${location.pathname.replace(/[^/]*$/, '')}`;
  return isFans
    ? { name: item.firstName || item.ownerFirst || '', code: item.loginCode || '', link: base + 'home.html' }
    : { name: item.ownerFirst || '', business: item.name || '', link: item.accessToken ? base + 'business-dashboard.html?token=' + item.accessToken : '' };
}
function applyBroadcastVars(text, vars) {
  return Object.entries(vars).reduce((s, [k, v]) => s.split(`{${k}}`).join(v ?? ''), text || '');
}
// מעטפת-מייל מדומה (§149, תואם-handoff: "כך המייל ייראה אצל X" + כותרת מ/אל + נושא+גוף בתוך
// "מייל" לבן עם מסגרת) — במקום קופסת-טקסט-שטוחה. אותם נתונים בדיוק (broadcastVarsFor/
// applyBroadcastVars), רק העיצוב השתנה.
// §311 — הגוף עבר מטקסט-שטוח (esc + <br>) לרינדור האמיתי דרך mail-format.js, אותו קוד שהוורקר
// מריץ. קודם התצוגה לא הראתה אפילו את *מודגש* ואת תיבת-הקוד שכבר היו קיימים, ועם סרגל העיצוב
// אי אפשר לעצב מכתב מול תצוגה ששונה ממנו.
function broadcastPreviewHtml(subject, body, audience, isFans) {
  if (!audience.length) return `<div class="broadcast-preview-empty">אין נמענים לתצוגה מקדימה</div>`;
  const first = audience[0];
  const vars = broadcastVarsFor(first, isFans);
  const toEmail = (isFans ? first.email : first.ownerEmail) || '—';
  return `
    <div class="broadcast-preview">
      <div class="broadcast-preview-label">כך המייל ייראה אצל ${esc(first.name)}</div>
      <div class="broadcast-preview-envelope" style="padding:0;overflow:hidden">
        <div class="broadcast-preview-head" style="padding:12px 16px">
          <div class="broadcast-preview-meta">מ־ Yellow Zone · אל ${esc(toEmail)}</div>
          <div class="broadcast-preview-subject">${esc(applyBroadcastVars(subject, vars))}</div>
        </div>
        ${mailPreviewDocHtml(body, vars, vars.code ? 'כניסה לאתר' : 'כניסה לאזור העסק שלי')}
      </div>
      <div class="broadcast-preview-note">המשתנים הוחלפו בנתונים של הנמען הראשון בקהל</div>
    </div>`;
}
// מעדכן רק את קופסת-התצוגה עצמה בהקלדה (לא renderMain מלא — היה מאבד פוקוס/מיקום-סמן בשדות)
window.updateBroadcastPreview = function() {
  const subjectEl = document.getElementById('broadcastSubject');
  const bodyEl = document.getElementById('broadcastBody');
  const box = document.getElementById('broadcastPreviewBox');
  if (!subjectEl || !bodyEl || !box) return;
  box.innerHTML = broadcastPreviewHtml(subjectEl.value, bodyEl.value, broadcastAudience(), broadcastAudienceType === 'fans');
};

// שורת "תגיות" של הקהל שנבחר בפועל — מוצגת מעל הרשימה, כדי שברור בלי לגלול מי כבר מסומן
function broadcastSelectedChipsHtml() {
  const isFans = broadcastAudienceType === 'fans';
  const set = isFans ? selectedFanIds : selectedBizIds;
  if (!set.size) return '';
  const items = [...set].map(id => isFans ? findFan(id) : bizById(id)).filter(Boolean);
  return `<div class="aud-chips-row">${items.map(x => `
    <span class="aud-chip">${esc(x.name)}<button onclick="${isFans?'toggleFanSelect':'toggleBizSelect'}('${x.id}')">✕</button></span>`).join('')}</div>`;
}

// שני טאבים ראשיים (שלב 5, §8 במפרט) — מחליף החלטה קודמת של "עמוד גלילה אחד, לא טאבים שמחביאים
// מקטעים". המשתמש אישר במפורש להפוך את זה — "יותר נוח ככה" מ-2 טאבים. "שליחה עכשיו" = 2 המקטעים
// הפעילים (הודעה בודדת + שידור המוני, עדיין נפתחים/נסגרים בפני עצמם עם toggleMsgSection כרגיל),
// "תבניות קבועות" = 4 קבוצות-ההגדרות עם סינון-צ'יפים ביניהן.
let msgMainTab = 'send';       // 'send' | 'templates'
let msgTemplateGroupFilter = 'all'; // 'all' | 'manual' | 'auto' | 'site' — 'site' מכסה גם 'success' וגם 'terms' (ר' templateGroupHtml)
window.setMsgMainTab = function(v) { msgMainTab = v; renderMain(); };
window.setMsgTemplateGroupFilter = function(v) { msgTemplateGroupFilter = v; renderMain(); };
// כרטיס "שליחה עכשיו" מאוחד — מתג (שידור המוני / נמענים נבחרים) בכותרת, גוף מוחלף לפי המצב
// (§136, לפי מוקאפ). מחליף 2 אקורדיונים-עצמאיים ישנים (manualSenderHtml+broadcastTabHtml
// היו כל אחד עם עטיפת-כרטיס+כותרת-קיפול משלו) — עכשיו הם רק ספקי-תוכן (body-only).
function sendNowSectionHtml() {
  const isSingle = msgSendMode === 'single';
  const singleCount = manualPickerSelectedSet().size;
  return `
    <div class="msg-section">
      <div class="card-head">
        <div class="card-head-title">שליחה עכשיו</div>
        <div class="spacer"></div>
        <div class="seg">
          <div class="${!isSingle?'on':''}" onclick="setMsgSendMode('broadcast')">שידור המוני</div>
          <div class="${isSingle?'on':''}" onclick="setMsgSendMode('single')">נמענים נבחרים${singleCount?` (${singleCount})`:''}</div>
        </div>
      </div>
      <div class="msg-section-body">
        ${isSingle ? singleSenderBodyHtml() : broadcastTabHtml()}
      </div>
    </div>`;
}

// כותרת-עמוד (breadcrumb+3 KPI) — §139, לפי מוקאף. scoped למרכז-הודעות בלבד (עדיין לא קיים
// בשום טאב אחר, ר' §136) — "שידורים נשלחו" מוגבל ל-10 האחרונים כי זה גודל ה-onSnapshot query
// הקיים (messageBroadcastHistory), לא נוספה שאילתת-ספירה-אמיתית חדשה בשביל KPI אחד.
function msgContentHeadHtml() {
  const approvedFans = MOCK_FANS.filter(f => f.status === 'approved').length;
  const approvedBiz = MOCK_BUSINESSES.filter(b => b.status === 'approved').length;
  return `
    <div class="msg-content-head">
      <div style="flex:1;min-width:240px">
        <div class="msg-crumb"><a onclick="selectTab('${HOME_KEY}')">← מרכז המשימות</a><span>/</span><span>מרכז הודעות</span></div>
        <div class="msg-page-title">מרכז הודעות</div>
      </div>
      <div class="msg-kpis">
        <div><div class="msg-kpi-num">${approvedFans}</div><div class="msg-kpi-label">אוהדים מאושרים</div></div>
        <div class="msg-kpi-sep"></div>
        <div><div class="msg-kpi-num">${approvedBiz}</div><div class="msg-kpi-label">עסקים מאושרים</div></div>
        <div class="msg-kpi-sep"></div>
        <div><div class="msg-kpi-num">${messageBroadcastHistory.length}</div><div class="msg-kpi-label">שידורים אחרונים</div></div>
      </div>
    </div>`;
}

function messageCenterHtml() {
  const total = messageTemplateRowCount();
  const showGroup = (g) => msgTemplateGroupFilter === 'all' || msgTemplateGroupFilter === g;
  return `
    ${msgContentHeadHtml()}
    <div class="msg-layout">
      <div class="msg-col-main">
        <div class="action-tabs">
          <button class="action-tab ${msgMainTab==='send'?'active':''}" onclick="setMsgMainTab('send')">📨 שליחה עכשיו</button>
          <button class="action-tab ${msgMainTab==='templates'?'active':''}" onclick="setMsgMainTab('templates')"><span class="cnt">${total}</span>התבניות הקבועות</button>
        </div>
        ${msgMainTab === 'send' ? `
          ${sendNowSectionHtml()}
        ` : `
          <div class="msg-section">
            <div class="tpl-filters">
              <div class="card-head-title" style="margin-inline-end:4px">התבניות הקבועות</div>
              <button class="tpl-filter ${msgTemplateGroupFilter==='all'?'on':''}" onclick="setMsgTemplateGroupFilter('all')">הכל · ${total}</button>
              <button class="tpl-filter ${msgTemplateGroupFilter==='auto'?'on':''}" onclick="setMsgTemplateGroupFilter('auto')">✉️ מיילים אוטומטיים</button>
              <button class="tpl-filter ${msgTemplateGroupFilter==='manual'?'on':''}" onclick="setMsgTemplateGroupFilter('manual')">📨 הודעות ידניות</button>
              <button class="tpl-filter ${msgTemplateGroupFilter==='site'?'on':''}" onclick="setMsgTemplateGroupFilter('site')">📜 טקסטים באתר</button>
            </div>
            <div class="msg-section-body" style="padding-top:2px">
              ${showGroup('auto') ? `<div class="msg-group-label">✉️ מיילים אוטומטיים <span class="hint">— נשלחים לבד ע"י המערכת, אין כפתור לחיצה</span></div>${templateGroupHtml('auto')}` : ''}
              ${showGroup('manual') ? `<div class="msg-group-label">📨 תבניות קבועות (WhatsApp/מייל ידני) <span class="hint">— הטקסט ש-📲/✉️ ליד עסק/אוהד ברשימות, וגם ב"הודעה בודדת" ב"שליחה עכשיו", משתמשים בו</span></div>${templateGroupHtml('manual')}` : ''}
              ${showGroup('site') ? `<div class="msg-group-label">📜 טקסטים באתר <span class="hint">— תקנון (terms.html) והודעת "הבקשה התקבלה" — כל אחד ב-2 גרסאות, אוהדים ועסקים</span></div>${templateGroupHtml('site')}` : ''}
            </div>
          </div>
        `}
      </div>
      <div class="msg-col-side">

window.sendBroadcastNow = async function() {
  const subject = document.getElementById('broadcastSubject').value.trim();
  const body = document.getElementById('broadcastBody').value.trim();
  if (!subject || !body) { alert('חסר נושא או גוף הודעה'); return; }
  const isFans = broadcastAudienceType === 'fans';
  const noun = isFans ? 'האוהדים' : 'העסקים';
  const audience = broadcastAudience();
  if (!audience.length) { alert('אין נמענים לשלוח אליהם'); return; }
  const selectedSet = isFans ? selectedFanIds : selectedBizIds;
  const usingSelection = selectedSet.size > 0;
  const confirmMsg = usingSelection
    ? `לשלוח את ההודעה הזו במייל ל-${audience.length} ${noun} הנבחרים? הפעולה שולחת מייל אמיתי ולא ניתנת לביטול.`
    : `לשלוח את ההודעה הזו במייל ל-${audience.length} ${noun} המאושרים? הפעולה שולחת מייל אמיתי ולא ניתנת לביטול.`;
  if (!confirm(confirmMsg)) return;

  broadcastDraft = { subject, body };
  try { await setDoc(doc(db, 'settings', 'broadcastDraft'), { subject, body }, { merge: true }); } catch (e) { /* לא חוסם שליחה אם רק שמירת הטיוטה נכשלה */ }

  broadcastSending = true;
  renderMain();
  try {
    const idToken = await auth.currentUser.getIdToken();
    const idsField = isFans ? { memberIds: audience.map(x => x.id) } : { businessIds: audience.map(x => x.id) };
    const resp = await hbApiFetch('/send-broadcast-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idToken, subject, body, audienceType: broadcastAudienceType, ...idsField }),
    });
    const data = await resp.json();
    if (data.error) { alert('שגיאה בשליחה: ' + data.error); return; }
    const results = data.results || [];
    const sentCount = results.filter(r => r.status === 'sent').length;
    const failedCount = results.filter(r => r.status === 'failed').length;
    await addDoc(collection(db, 'messageBroadcasts'), {
      subject, body, sentAt: serverTimestamp(), sentByUid: auth.currentUser.uid,
      audienceGroup: broadcastAudienceType, audienceType: usingSelection ? 'selected' : 'allApproved',
      totalRecipients: results.length, sentCount, failedCount, results,
    });
    if (usingSelection) selectedSet.clear();
    alert(`נשלח! ${sentCount} בהצלחה${failedCount ? `, ${failedCount} נכשלו` : ''}.`);
  } catch (e) {
    console.error(e);
    alert('שגיאה בשליחה: ' + e.message);
  } finally {
    broadcastSending = false;
    renderMain();
  }
};

// שליחה מחדש לנכשלים בלבד (שלב 5ב, §8 במפרט) — results כבר נשמר עם status:'failed' לכל נמען,
// רק חסר כפתור. אותו endpoint בדיוק (/send-broadcast-email) עם רשימת-id מוגבלת לנכשלים, ורשומת-
// היסטוריה חדשה נפרדת (לא דורסת את המקורית — כדי לשמור עקבה מלאה מה נשלח מתי).
window.resendFailedFromBroadcast = async function(historyId) {
  const h = messageBroadcastHistory.find(x => x.id === historyId);
  if (!h) return;
  const failed = (h.results || []).filter(r => r.status === 'failed' && r.id);
  if (!failed.length) return;
  if (!confirm(`לשלוח שוב במייל ל-${failed.length} נמענים שנכשלו ב"${h.subject}"? הפעולה שולחת מייל אמיתי.`)) return;
  const isFans = h.audienceGroup === 'fans';
  broadcastSending = true;
  renderMain();
  try {
    const idToken = await auth.currentUser.getIdToken();
    const idsField = isFans ? { memberIds: failed.map(r => r.id) } : { businessIds: failed.map(r => r.id) };
    const resp = await hbApiFetch('/send-broadcast-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idToken, subject: h.subject, body: h.body, audienceType: h.audienceGroup, ...idsField }),
    });
    const data = await resp.json();
    if (data.error) { alert('שגיאה בשליחה חוזרת: ' + data.error); return; }
    const results = data.results || [];
    const sentCount = results.filter(r => r.status === 'sent').length;
    const failedCount = results.filter(r => r.status === 'failed').length;
    await addDoc(collection(db, 'messageBroadcasts'), {
      subject: h.subject, body: h.body, sentAt: serverTimestamp(), sentByUid: auth.currentUser.uid,
      audienceGroup: h.audienceGroup, audienceType: 'resendFailed', resendOf: h.id,
      totalRecipients: results.length, sentCount, failedCount, results,
    });
    alert(`נשלח שוב! ${sentCount} בהצלחה${failedCount ? `, ${failedCount} עדיין נכשלו` : ''}.`);
  } catch (e) {
    console.error(e);
    alert('שגיאה בשליחה חוזרת: ' + e.message);
  } finally {
    broadcastSending = false;
    renderMain();
  }
};

// ══ מרכז תקלות מייל (§204) ════════════════════════════════════════════════════════════════
// למה זה קיים: שליחת מייל היא הצינור היחיד במערכת שאפשר להיכשל בו **בלי שאף אחד יידע**. הכי גרוע
// הוא דומיין עם שגיאת-כתיב (gamil.com): Brevo מקבל את הבקשה, אנחנו מסמנים "נשלח", והנמען לא מקבל
// כלום לעולם. הפאנל הזה מרכז את כל המקרים שבהם עסק/אוהד כנראה לא קיבל מאיתנו מייל בפועל.
// (ר' docs/PROJECT_CONTEXT.md §203 — באג-אמת "יהב מטבחים", 2026-08-15)
//
// חמש התקלות שנתפסות, לפי חומרה:
//   1. failed     — Brevo החזיר שגיאה מפורשת (ownerEmailError/loginCodeEmailError שמור אצלנו)
//   2. sentToBad  — סומן "נשלח" אבל לדומיין שגוי → הכי מסוכן, נראה תקין לגמרי בכל מסך אחר
//   3. stuck      — אושר לפני יותר מ-10 דקות ועדיין 'pending' (ה-cron רץ כל דקה — משהו תקוע)
//   4. noEmail    — מאושר בלי כתובת מייל בכלל
//   5. badPending — כתובת שגויה/לא-תקינה אצל מי שעוד לא אושר → לתקן לפני האישור, לא אחריו
//   6. wrongLetter — בעל עסק שקיבל את מייל-העסק הקצר במקום מכתב-הפתיחה המאוחד (2026-08-18)
//   7. late        — המייל כן יצא, אבל הרבה אחרי שנכנס לתור (2026-08-18)
//
// 6+7 נוספו אחרי שני מקרי-אמת שאף אחת מ-5 התקלות הראשונות לא תפסה, כי בשתיהן המערכת מציגה
// "נשלח ✅" ונראית תקינה לגמרי: Kaneti insurance (17.8) קיבל שני מיילים קצרים נפרדים במקום
// מכתב-הפתיחה, ובני שליחויות (16.8) קיבל את מייל-העסק ואת קוד-הכניסה בהפרש של 14.7 שעות.
// שניהם התגלו רק כי בעל העסק התלונן — בדיוק מה שהפאנל הזה אמור למנוע.
const MAIL_STUCK_MINUTES = 10;
// סף האיחור: ה-cron רץ כל דקה, אז כל מה שמעל רבע שעה הוא כבר לא "עומס רגעי" אלא תקלה.
const MAIL_LATE_MINUTES = 15;
const MAIL_RX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

// כמה דקות עברו בין הכניסה-לתור לשליחה בפועל. מוחזר 0 כשאין חותמת תור (מסמכים שנוצרו לפני
// 18.8) — בכוונה: עדיף לא לדעת מאשר להמציא איחור מהפרש מול approvedAt, ששליחה חוזרת דורסת.
function mailLateMinutes(queuedAt, sentAt) {
  if (!queuedAt || !sentAt) return 0;
  const mins = Math.round((sentAt.getTime() - queuedAt.getTime()) / 60000);
  return mins >= MAIL_LATE_MINUTES ? mins : 0;
}
function lateLabel(mins) {
  if (mins < 60) return mins + ' דקות';
  const h = Math.floor(mins / 60), m = mins % 60;
  const hours = h === 1 ? 'שעה' : h === 2 ? 'שעתיים' : h + ' שעות';
  return hours + (m ? ` ו-${m} דקות` : '');
}
// בעל העסק קיבל את מייל-העסק הקצר לבדו (welcomeEmailKind:'bizOnly' נכתב ע"י ה-Worker בזמן
// השליחה, ר' worker/src/index.js) — ובאמת יש מאחוריו רשומת-חבר, כלומר היה *אמור* לקבל את
// מכתב-הפתיחה המאוחד. הסתמכות על השדה ולא על הפרשי-זמנים היא מכוונת: שליחה חוזרת דורסת את
// ownerEmailSentAt, וכל ניחוש מבוסס-זמנים מסמן בטעות גם עסקים שקיבלו את המכתב הנכון.
function gotWrongWelcomeLetter(b) {
  if (b.welcomeEmailKind !== 'bizOnly') return null;
  const f = b.ownerMemberId ? findFan(b.ownerMemberId) : null;
  return f && f.status === 'approved' ? f : null;
}

// ── "טיפלתי" על תקלת מייל (2026-08-16, בקשת המשתמש) ─────────────────────────────────────────
// תקלות מייל הן *מחושבות* מהנתונים, לא רשומות בבסיס-הנתונים — אז אין מה "לסגור". חלק מהן גם לא
// ניתנות לפתרון מתוך המערכת (כתובת שגויה שצריך להשיג מחדש בטלפון, נמען שחסם אותנו). בלעדי סימון
// כזה הן נשארות על המסך לנצח. הפתרון: חתימה של התקלה הספציפית (mailIssueKey) נשמרת על המסמך —
// כך שאותה תקלה בדיוק נעלמת, אבל תקלה *חדשה* (שליחה חוזרת שנכשלה שוב, כתובת חדשה, כישלון מאוחר
// יותר) מייצרת חתימה אחרת וחוזרת למסך. סימון לא משתיק את הנמען לתמיד.
function mailIssueKey(kind, id, badge, email, when) {
  return [kind, id, badge, email || '', when ? when.getTime() : 0].join('|');
}
function mailIssueHandledKeyOf(entity) {
  const h = entity && entity.mailIssueHandled;
  return h && h.key ? h.key : '';
}

function mailIssueList() {
  const out = [];
  const now = Date.now();

  // ── בעל עסק נספר פעם אחת בלבד — כשורת החנות (2026-08-22, בקשת המשתמש) ─────────────────────
  // בעל עסק קיים במערכת פעמיים: מסמך העסק (ownerEmail) ומסמך החבר שמאחוריו (email) — שניהם עם
  // *אותה כתובת*. כשהכתובת חוזרת/לא נפתחת, שני המסמכים נכשלים באותה צורה ושתי שורות עלו לרשימה,
  // כך שמונה התקלות הראה 17 במקום 9. זו לא כפילות-תצוגה בלבד: היא גם מכפילה את העבודה, כי טיפול
  // אחד (תיקון הכתובת) סוגר את שתיהן. לכן שורת האוהד נבלעת בשורת החנות.
  // שורת אוהד של בעל-עסק נשמרת רק כשלחנות עצמה *אין* תקלה — אחרת המידע היה נעלם לגמרי.
  const ownerBizOf = new Map();
  for (const b of MOCK_BUSINESSES) {
    if (b.status !== 'rejected' && b.ownerMemberId) ownerBizOf.set(b.ownerMemberId, b);
  }
  const bizWithIssue = new Set();
  let curOwnerBiz = null;   // מוגדר בלולאת האוהדים בלבד; מתייג את השורה כ"בעל העסק «X»"

  const add = (kind, id, name, email, sev, badge, detail, when, canResend, action) =>
    out.push({ kind, id, name, email: email || '', sev, badge, detail, when: when || null, canResend: !!canResend,
               action: action || '', key: mailIssueKey(kind, id, badge, email, when),
               ownerBizName: curOwnerBiz ? curOwnerBiz.name : '' });

  for (const b of MOCK_BUSINESSES) {
    if (b.status === 'rejected') continue;
    const approved = b.status === 'approved';
    const hit = emailDomainHit(b.ownerEmail);
    const malformed = b.ownerEmail && !MAIL_RX.test(b.ownerEmail);
    if (approved && b.ownerEmailStatus === 'failed') {
      add('biz', b.id, b.name, b.ownerEmail, 1, 'שליחה נכשלה', b.ownerEmailError ? String(b.ownerEmailError).slice(0, 160) : 'Brevo החזיר שגיאה', b.ownerEmailSentAt, true);
    } else if (approved && mailDeliveryFailed(b.ownerEmailDelivery)) {
      // Brevo דיווח בפועל שהמייל לא נחת (§205) — עדיף על כל ניחוש שלנו
      add('biz', b.id, b.name, b.ownerEmail, 1, MAIL_DELIVERY_BADGES[b.ownerEmailDelivery] || 'המייל לא נמסר', `Brevo דיווח: ${MAIL_DELIVERY_LABELS[b.ownerEmailDelivery].txt}${b.ownerEmailDeliveryReason ? ' · ' + String(b.ownerEmailDeliveryReason).slice(0, 120) : ''}`, b.ownerEmailDeliveryAt || b.ownerEmailSentAt, true);
    } else if (approved && (hit || malformed)) {
      add('biz', b.id, b.name, b.ownerEmail, 1, 'נשלח לכתובת שגויה',
        hit ? `הדומיין "${hit.domain}" לא קיים כשירות מייל — כנראה ${hit.suggested}. המייל סומן "נשלח" ולא הגיע.` : 'הכתובת לא בנויה כמו כתובת מייל תקינה.',
        b.ownerEmailSentAt, true);
    } else if (approved && !b.ownerEmail) {
      add('biz', b.id, b.name, '', 2, 'אין כתובת מייל', 'העסק מאושר אבל אין למי לשלוח — צריך להשיג כתובת ולעדכן בכרטיס.', b.approvedAt, false);
    } else if (approved && b.ownerEmailStatus !== 'sent' && b.approvedAt && (now - b.approvedAt.getTime()) > MAIL_STUCK_MINUTES * 60000) {
      add('biz', b.id, b.name, b.ownerEmail, 2, 'תקוע בתור', `אושר ${agoLabel(b.approvedAt)} והמייל עדיין לא יצא. ה-cron רץ כל דקה — כדאי לבדוק את ה-Worker.`, b.approvedAt, true);
    } else if (approved && gotWrongWelcomeLetter(b)) {
      add('biz', b.id, b.name, b.ownerEmail, 2, 'קיבל את המייל הלא-נכון',
        `יצא מייל-העסק הקצר בלבד, בלי מכתב הפתיחה המאוחד (קוד כניסה + מה לעשות עכשיו) שכל שאר בעלי העסקים מקבלים. "שליחה חוזרת" רגילה תשלח שוב את אותו מייל קצר — הכפתור כאן שולח את מכתב הפתיחה המלא.`,
        b.ownerEmailSentAt, false, 'welcome');
    } else if (approved && mailLateMinutes(b.ownerEmailQueuedAt, b.ownerEmailSentAt)) {
      add('biz', b.id, b.name, b.ownerEmail, 2, 'יצא באיחור',
        `המייל נכנס לתור ויצא בפועל רק ${lateLabel(mailLateMinutes(b.ownerEmailQueuedAt, b.ownerEmailSentAt))} אחר כך. ה-cron רץ כל דקה — עיכוב כזה אומר שהסריקה נתקעה או דילגה, כדאי לבדוק שהעסק אכן קיבל.`,
        b.ownerEmailSentAt, true);
    } else if (approved && mailUnopenedTooLong(b.ownerEmailStatus, b.ownerEmailDelivery, b.ownerEmailOpenedAt, b.ownerEmailClickedAt, b.ownerEmailSentAt, now)) {
      add('biz', b.id, b.name, b.ownerEmail, 3, 'נמסר ולא נפתח', MAIL_UNOPENED_DETAIL(b.ownerEmailSentAt), b.ownerEmailSentAt, true);
    } else if (!approved && (hit || malformed)) {
      add('biz', b.id, b.name, b.ownerEmail, 3, 'כתובת שגויה — לפני אישור',
        hit ? `כנראה ${hit.suggested}. אם תאשר ככה, המייל "יישלח" ולא יגיע.` : 'הכתובת לא בנויה כמו כתובת מייל תקינה — לתקן לפני האישור.',
        b.registeredAt, false);
    }
  }

  // כל שורות החנויות כבר בפנים — מכאן והלאה אפשר לדעת על איזו חנות כבר דווח
  out.forEach(x => { if (x.kind === 'biz') bizWithIssue.add(x.id); });

  for (const f of MOCK_FANS) {
    if (f.status === 'rejected') continue;
    curOwnerBiz = ownerBizOf.get(f.id) || null;
    // החנות של אותו בעל-עסק כבר מופיעה ברשימה עם אותה כתובת בדיוק — לא לספור פעמיים
    if (curOwnerBiz && bizWithIssue.has(curOwnerBiz.id)) continue;
    const approved = f.status === 'approved';
    const hit = emailDomainHit(f.email);
    const malformed = f.email && !MAIL_RX.test(f.email);
    if (approved && f.loginCodeEmailStatus === 'failed') {
      add('fan', f.id, f.name, f.email, 1, 'שליחה נכשלה', f.loginCodeEmailError ? String(f.loginCodeEmailError).slice(0, 160) : 'Brevo החזיר שגיאה', f.loginCodeEmailSentAt, !!f.loginCode);
    } else if (approved && mailDeliveryFailed(f.loginCodeEmailDelivery)) {
      add('fan', f.id, f.name, f.email, 1, MAIL_DELIVERY_BADGES[f.loginCodeEmailDelivery] || 'המייל לא נמסר', `Brevo דיווח: ${MAIL_DELIVERY_LABELS[f.loginCodeEmailDelivery].txt}${f.loginCodeEmailDeliveryReason ? ' · ' + String(f.loginCodeEmailDeliveryReason).slice(0, 120) : ''}`, f.loginCodeEmailDeliveryAt || f.loginCodeEmailSentAt, !!f.loginCode);
    } else if (approved && (hit || malformed)) {
      add('fan', f.id, f.name, f.email, 1, 'נשלח לכתובת שגויה',
        hit ? `הדומיין "${hit.domain}" לא קיים כשירות מייל — כנראה ${hit.suggested}. קוד הכניסה סומן "נשלח" ולא הגיע.` : 'הכתובת לא בנויה כמו כתובת מייל תקינה.',
        f.loginCodeEmailSentAt, !!f.loginCode);
    } else if (approved && !f.email) {
      add('fan', f.id, f.name, '', 2, 'אין כתובת מייל', 'האוהד מאושר אבל אין למי לשלוח את קוד הכניסה.', f.approvedAt, false);
    } else if (approved && f.loginCode && f.loginCodeEmailStatus !== 'sent' && f.approvedAt && (now - f.approvedAt.getTime()) > MAIL_STUCK_MINUTES * 60000) {
      add('fan', f.id, f.name, f.email, 2, 'תקוע בתור', `אושר ${agoLabel(f.approvedAt)} וקוד הכניסה עדיין לא יצא.`, f.approvedAt, true);
    } else if (approved && mailLateMinutes(f.loginCodeEmailQueuedAt, f.loginCodeEmailSentAt)) {
      add('fan', f.id, f.name, f.email, 2, 'יצא באיחור',
        `קוד הכניסה נכנס לתור ויצא בפועל רק ${lateLabel(mailLateMinutes(f.loginCodeEmailQueuedAt, f.loginCodeEmailSentAt))} אחר כך. ה-cron רץ כל דקה — כדאי לבדוק שהמייל אכן התקבל.`,
        f.loginCodeEmailSentAt, !!f.loginCode);
    } else if (approved && mailUnopenedTooLong(f.loginCodeEmailStatus, f.loginCodeEmailDelivery, f.loginCodeEmailOpenedAt, f.loginCodeEmailClickedAt, f.loginCodeEmailSentAt, now)) {
      add('fan', f.id, f.name, f.email, 3, 'נמסר ולא נפתח', MAIL_UNOPENED_DETAIL(f.loginCodeEmailSentAt), f.loginCodeEmailSentAt, !!f.loginCode);
    } else if (!approved && (hit || malformed)) {
      add('fan', f.id, f.name, f.email, 3, 'כתובת שגויה — לפני אישור',
        hit ? `כנראה ${hit.suggested}. אם תאשר ככה, קוד הכניסה "יישלח" ולא יגיע.` : 'הכתובת לא בנויה כמו כתובת מייל תקינה — לתקן לפני האישור.',
        f.registeredAt, false);
    }
  }

  // מסנן החוצה תקלה שכבר סומנה "טיפלתי" — לפי חתימה מדויקת, לא לפי הנמען (ר' mailIssueKey)
  const handledKeys = new Set([
    ...MOCK_BUSINESSES.map(mailIssueHandledKeyOf),
    ...MOCK_FANS.map(mailIssueHandledKeyOf),
  ].filter(Boolean));
  return out
    .filter(x => !handledKeys.has(x.key))
    .sort((a, b) => a.sev - b.sev || (b.when ? b.when.getTime() : 0) - (a.when ? a.when.getTime() : 0));
}

window.markMailIssueHandled = async function(kind, id, key, badge, name) {
  const note = prompt(`סימון תקלת המייל של "${name}" כטופלה.\n\n(${badge})\n\nאיך זה טופל? (אופציונלי — נשמר ב"טופלו")`, '');
  if (note === null) return;
  const coll = kind === 'fan' ? 'members' : 'businesses';
  try {
    await updateDoc(doc(db, coll, id), {
      mailIssueHandled: { key, at: new Date().toISOString(), note: (note || '').trim(), badge, by: auth.currentUser ? auth.currentUser.uid : '' },
    });
    await logActivity(coll, id, {
      type: 'email', title: 'תקלת מייל סומנה כטופלה', detail: badge + ((note || '').trim() ? ` — ${note.trim()}` : ''),
      field: 'mailIssueHandled', before: null, after: key,
    });
  } catch (e) { console.error(e); alert('שגיאה: ' + e.message); }
};
window.unmarkMailIssueHandled = async function(kind, id) {
  const coll = kind === 'fan' ? 'members' : 'businesses';
  try { await updateDoc(doc(db, coll, id), { mailIssueHandled: null }); }
  catch (e) { console.error(e); alert('שגיאה: ' + e.message); }
};

    ? `<button class="act-btn approve tiny" onclick="event.stopPropagation();requeueWelcomeEmail('${x.id}')">שליחת מכתב הפתיחה</button>`
    : x.canResend
      ? `<button class="act-btn approve tiny" onclick="event.stopPropagation();${x.kind === 'biz' ? 'requeueBizEmail' : 'requeueFanEmail'}('${x.id}')">שליחה חוזרת</button>`
      : '';
  return `
