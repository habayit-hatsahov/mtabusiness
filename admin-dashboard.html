}

// ══════════════════ מרכז נתונים (פריט 4 האחרון, §3 במפרט) ══════════════════
// מסך חדש-לגמרי, לא היה קיים בכלל בקוד האמיתי (רק homeStatsHtml הקטן בדשבורד הראשי, שונה לגמרי).
// מוגבל בכוונה לטאב "עסקים" היחיד מתוך 6 טאבי הדמו (demo-redesign-admin-stats.html) — הוא היחיד
// שהדמו עצמו מסמן כנתמך בנתון-אמת (ר' .biz-foot שם). חשיפות/המרה/פניות/מגמות-יומיות/משפך-הרשמה
// לא נבנו כלל: אין להם צנרת-איסוף (רק events נכתב, בלי אגרגציה) — בנייתם הייתה מספרים מומצאים.
// עמודת "עדכון אחרון" מהדמו הוחלפה ב"באינדקס מאז" (approvedAt||registeredAt) כי אין שדה updatedAt
// אמיתי לעסק; זה תחליף כן מבחינת המשמעות (זמן-בפועל אמיתי) ולא המצאה. עיגונים מחושבים בזמן-אמת
// מ-state (כבר טעון מ-Firestore, ר' sectionAnchors) — לא שדה שמור בנפרד.
// ── §275 — מדידת מימוש-הטבה ────────────────────────────────────────────────────────────
// נטען מ-collection 'events' (type='benefitRedeem') בכניסה למרכז-הנתונים בלבד — **לא** ב-
// onSnapshot גלובלי: זו קריאה חד-פעמית, והמסך הזה נצפה לעיתים רחוקות. שאילתת שוויון-בודד
// אינה דורשת אינדקס מורכב.
// ⚠️ אין כאן אגרגציה בשרת — נספרות רשומות-אירוע גולמיות בצד הלקוח. כשהנפח יגדל צריך לעבור
// ל-statsDaily (הקולקציה כבר מוגדרת ב-firestore.rules וממתינה ל-Worker).
// §276 — 'open' = פתיחת כרטיס-מימוש, **אחד ללחיצה**. שאר הערוצים הם ה*פעולות* שנעשו אחרי
// הפתיחה, והם הסיגנל האמיתי ("כמה באמת הלכו לממש" מול "כמה רק הציצו").
// cardOpen/couponReveal הם שמות **היסטוריים** מהגרסה הראשונה, שבה פתיחת כרטיס-מאוחד רשמה
// שתי פעולות ולכן לחיצה אחת נספרה כ-2. הם ממופים ל-open כדי שאירועים ישנים לא ייעלמו —
// אבל אירוע-מאוחד ישן עדיין תורם 2. אין תיקון-למפרע: events אסורים לעדכון/מחיקה ב-rules.
const REDEEM_LEGACY_OPEN = { cardOpen: 1, couponReveal: 1 };
const REDEEM_ACTION_LABELS = {
  couponCopy: 'העתיקו קוד', siteClick: 'עברו לאתר',
  contactWhatsapp: 'פנו בוואטסאפ', contactPhone: 'התקשרו',
};
// ── §352 — כל המתנת-רשת במסך הזה חסומה בזמן ────────────────────────────────────────────
// הכלל של §280/§312/§313 ("כל await ברשת חייב גבול-זמן") נאכף עד היום רק בדפים של האוהד
// ובעל-העסק. שתי הטעינות כאן היו הנתיבים האחרונים בלעדיו — והן דווקא הכבדות באתר: עד
// 10,000 מסמכים כל אחת. `getDocs` **לא** מקבל AbortSignal, ולכן מרוץ מול טיימר: ההבטחה
// עצמה ממשיכה ברקע (אין דרך לבטל אותה), אבל המסך מפסיק לחכות לה.
// ⚠️ בלעדיו, בקשה שנתקעת משאירה "טוען…" לנצח — כלומר בדיוק התסמין של §351 (פאנל שלא
// נפתח), רק בלי אף שורה בקונסול שתסגיר את הסיבה. שם שורת הקונסול פתרה תוך שנייה.
// 20 שניות ולא 8 כמו בכניסת האוהד: שם זה round-trip יחיד לוורקר (נמדד 0.54–0.71 שנ'),
// כאן זו הזרמה של אלפי מסמכים. סף קצר מדי היה מייצר פסק-זמן שקרי על רשת איטית-אך-תקינה.
const STATS_TIMEOUT_MS = 20000;
function statsWithTimeout(promise, ms = STATS_TIMEOUT_MS) {
  let t;
  return Promise.race([
    promise.finally(() => clearTimeout(t)),
    new Promise((_, reject) => { t = setTimeout(() => reject(new Error('hb_timeout')), ms); }),
  ]);
}
// 'hb_timeout' הוא מזהה פנימי — אסור שיגיע למסך כמו שהוא. ר' §351: המסך הזה כבר הציג
// שגיאת-מנוע גולמית שאיש לא ידע לקרוא, וזה מה שהפך באג בן-שורה לסבב-אבחון שלם.
const statsErrLabel = (err) => err?.message === 'hb_timeout'
  ? `הבקשה לא חזרה תוך ${STATS_TIMEOUT_MS / 1000} שניות`
  : (err?.code || err?.message || 'שגיאה לא ידועה');

// §352 — תקרה לשאילתת המימושים. עד עכשיו היא הייתה **חסרת גבול לחלוטין**: כל אירוע
// benefitRedeem מאז ומעולם, בלי limit ובלי חלון-תאריכים, בזמן שהשאילתה שלידה כן מוגבלת.
// ⚠️ אין כאן orderBy **בכוונה**: `where('type','==') + orderBy('createdAt')` דורש אינדקס
// מורכב שאינו קיים, והוספתו הייתה מפילה את השאילתה עד לבנייתו — בדיוק סוג ה"תיקון" שהפיל
// את §326. בלי orderBy הסדר הוא לפי מזהה-המסמך, כלומר בחיתוך מתקבלת **דגימה** ולא
// "האחרונים" — ולכן החיתוך חייב להופיע על המסך ולא רק להתקיים בקוד.
const REDEEM_EVENT_LIMIT = 10000;
let redeemStats = null;      // { [bizId]: { total, ch: {channel: n} } } | null = טרם נטען
let redeemStatsError = null;
let redeemTruncated = false;
let redeemLoading = false;
async function loadRedeemStats() {
  // §352 — גארד-בו-זמנית. renderMain נקראת מכמה onSnapshot באותו tick, ובלי הדגל הזה יצאו
  // שאילתות זהות במקביל — נצפה בפועל ב-§351, שם אותה שגיאה הודפסה ארבע פעמים. בשאילתה של
  // 10,000 מסמכים זה פי-4 בקריאות ובזמן, על נתונים זהים לחלוטין.
  if (redeemStats || redeemStatsError || redeemLoading) return;
  redeemLoading = true;
  try {
    const snap = await statsWithTimeout(getDocs(query(
      collection(db, 'events'),
      where('type', '==', 'benefitRedeem'),
      limit(REDEEM_EVENT_LIMIT)
    )));
    const acc = {};
    snap.forEach(d => {
      const e = d.data();
      if (!e.bizId) return;
      const row = acc[e.bizId] || (acc[e.bizId] = { opens: 0, ch: {} });
      const c = e.channel || 'unknown';
      // פתיחות נספרות לעמודה הראשית; פעולות-המשך נספרות לפירוק. שתי ספירות נפרדות, כדי
      // שלחיצה אחת לעולם לא תיראה כשתי פעולות.
      if (c === 'open' || REDEEM_LEGACY_OPEN[c]) row.opens++;
      else row.ch[c] = (row.ch[c] || 0) + 1;
    });
    redeemStats = acc;
    redeemTruncated = snap.size >= REDEEM_EVENT_LIMIT;
  } catch (err) {
    console.error('loadRedeemStats failed:', err);
    redeemStatsError = statsErrLabel(err);
  }
  redeemLoading = false;
  renderMain();
}
// §352 — פסק-זמן שאין ממנו דרך חזרה גרוע מהמתנה: הוא הופך תקלה חולפת למסך מת עד רענון.
window.retryRedeemStats = function() { redeemStatsError = null; renderMain(); };
const redeemFor = id => (redeemStats && redeemStats[id]) || { opens: 0, ch: {} };

// ── §281 — פאנל "פלטפורמה": כניסות ומשפך-הרשמה ──────────────────────────────────────────
// collection 'events' נאסף מאז §110 אבל **מעולם לא הוצג** — המסך הזה הראה רק נתונים שמקורם
// במסמכי העסק (לחיצות/לבבות) ובמימושים. שני חורים סגרו את המעגל:
//   1. `formSubmit` לא נרשם משום מקום — נוסף ל-fan-register.html ול-business.html.
//   2. `referrer` נשלח כ-URL מלא בזמן ש-firestore.rules אוכפת 50 תווים — כל הגעה מקישור עם
//      נתיב נדחתה ב-permission-denied, כלומר **האירוע כולו** אבד. עכשיו נשלח המארח בלבד.
//
// שאילתה אחת בלבד: טווח על createdAt + orderBy על אותו שדה — לא דורש אינדקס מורכב ולא שאילתה
// נפרדת לכל סוג-אירוע. **תמיד נשלפים 30 יום, פעם אחת**, ובורר-הטווח מסנן על מה שכבר בזיכרון —
// כך שמעבר בין "היום" ל"30 יום" הוא מיידי ובלי אף קריאה נוספת ל-Firestore.
// כשהנפח יגדל זה יעבור ל-statsDaily (כבר מוגדר ב-firestore.rules וממתין ל-Worker).
const PLATFORM_WINDOW_DAYS = 30;
// §326 — הועלה מ-5,000. `scrollDepth` מוסיף עד שלושה אירועים לכל סשן-נחיתה, ובקצב של
// 26–29.8 (≈40 נחיתות ביום) זה מקפיץ את החלון של 30 יום מעל התקרה הישנה — כלומר הפאנל
// היה מתחיל לחתוך אירועים ולהציג משפך שגוי. ⚠️ החיתוך הזה **שקט** מבחינת נכונות המספרים:
// יש באנר "נשלפו X האחרונים בלבד", אבל המספרים עצמם ממשיכים להיראות תקינים לגמרי.
// 🔴 §351 — §326 העלה את המספר ל-15,000, **מעל התקרה הקשיחה של Firestore (10,000)**.
// כל השאילתה נדחתה מאז עם 'Limit value in the structured query is over the maximum value
// of 10000', `platformStatsError` נדלק, וכל קובייה שנשענת על platformEvents הציגה
// "טעינת המדידה נכשלה" — כולל "תקלות כניסה". זה מה שנקרא בפועל כ"אין שורה" ב-30.8, ושלח
// סבב אבחון שלם לכיוון הלא-נכון.
// ⚠️ **הלקח: תקרה שמועלית כדי למנוע חיתוך חייבת להיבדק מול המגבלה של המנוע.** §326 שם לב
// נכון שהחלון גדל, ותיקן את זה בערך שהמנוע דוחה — כלומר "תיקון" שהמיר חיתוך-שקט
// בכיבוי-מלא. גרוע יותר ממה שבא לתקן.
// 10,000 הוא המקסימום המותר. אם החלון של 30 יום יעבור אותו — הפתרון הוא statsDaily
// (כבר מוגדר ב-firestore.rules) או קיצור החלון, **לא** מספר גדול יותר כאן.
const PLATFORM_EVENT_LIMIT = 10000;
// היום שבו formSubmit התחיל להיאסף. בלי התאריך הזה המשפך נראה כמו אסון ("נפתחו 300, נשלחו 4")
// בזמן שפשוט לא הייתה מדידה — ולכן הוא מוצג במפורש על המסך.
const SUBMIT_MEASURE_START = '2026-08-26';
// §326 — היום שבו `scrollDepth` התחיל להיאסף. אותו תפקיד בדיוק כמו SUBMIT_MEASURE_START:
// בלעדיו טווח שמתחיל מוקדם יותר מציג "0% ראו את כרטיס ההרשמה" — מספר שנראה כמו אסון
// ובפועל אומר רק שלא הייתה מדידה. ⚠️ לעדכן לתאריך הפריסה בפועל.
const DEPTH_MEASURE_START = '2026-08-29';
const PLATFORM_RANGES = [
  { d: 1,  label: 'היום' },
  { d: 2,  label: 'יומיים אחרונים' },
  { d: 7,  label: '7 ימים אחרונים' },
  { d: 14, label: '14 יום אחרונים' },
  { d: 30, label: '30 יום אחרונים' },
];

let platformEvents = null;          // מערך גולמי מצומצם | null = טרם נטען
let platformTruncated = false;
let platformStatsError = null;
let platformLoading = false;        // §352 — גארד-בו-זמנית, ר' ההערה ב-loadRedeemStats
let platformRange = 7;
let platformIncludeAdmins = false;  // ברירת מחדל: **בלי** הצפיות של המנהלים עצמם

window.setPlatformRange = function(v) { platformRange = +v || 7; renderMain(); };
window.setPlatformIncludeAdmins = function(on) { platformIncludeAdmins = !!on; renderMain(); };
// §352 — כאן זה קריטי יותר מאשר במימושים: ב-platformEvents תלויים גם קוביית "תקלות הרשמה"
// וגם רשימת "תקלות כניסה" במרכז המשימות, לא רק הפאנל הזה. פסק-זמן בלי דרך חזרה היה מכבה
// את שלושתם עד רענון ידני — בדיוק התסמין של §351.
window.retryPlatformStats = function() { platformStatsError = null; renderMain(); };

async function loadPlatformStats() {
  if (platformEvents || platformStatsError || platformLoading) return;
  platformLoading = true;
  try {
    const since = new Date(Date.now() - PLATFORM_WINDOW_DAYS * 864e5);
    const snap = await statsWithTimeout(getDocs(query(
      collection(db, 'events'),
      where('createdAt', '>=', since),
      orderBy('createdAt', 'desc'),
      limit(PLATFORM_EVENT_LIMIT)
    )));
    const rows = [];
    snap.forEach(docSnap => {
      const e = docSnap.data();
      const at = e.createdAt && e.createdAt.toDate ? e.createdAt.toDate() : null;
      if (!at) return;   // אירוע שעדיין לא קיבל חותמת-שרת — אין לו יום לשייך אליו
      rows.push({
        at, type: e.type, path: (e.path || '').toLowerCase(), blockId: e.blockId || null,
        memberId: e.memberId || null, sessionId: e.sessionId || null,
        device: e.device || null, referrer: e.referrer || null,
        // ── 🔴 §302 — `channel` ו-`bizId` **לא נטענו כאן מעולם** ────────────────────────
        // זה הפך את כל §296 לקוד מת בפועל: המסווג קורא `e.channel`, קיבל `undefined`,
        // וכל כשל־תמונה הוצג כ"הרשמת אוהד נכשלה · קוד השגיאה: לא ידוע" — בדיוק ההפך
        // ממה ש-§296 בא לתקן, ובדיוק מה שהמשתמש דיווח: *"אין לי פרטים בתקלות הרשמה"*.
        // **הלקח: תיקון־תצוגה שנשען על שדה חדש חייב לוודא שהשדה עובר את שכבת הטעינה.**
        channel: e.channel || null, bizId: e.bizId || null,
        // §355 — בלי השורה הזאת הטלפון שנכתב ב-welcome.html מגיע ל-loginFailList כ-undefined,
        // בדיוק כמו ש-`channel` לא נטען מעולם והפך את §296 לקוד מת. **שדה חדש בכתיבה = שורה
        // חדשה גם כאן**, אחרת התיקון עובד בייצור ולא על המסך.
        phone: e.phone || null,
      });
    });
    platformEvents = rows;
    platformTruncated = snap.size >= PLATFORM_EVENT_LIMIT;
  } catch (err) {
    console.error('loadPlatformStats failed:', err);
    platformStatsError = statsErrLabel(err);
  }
  platformLoading = false;
  renderMain();
}

// מי נחשב "מנהל" — נלקח מרשימת החברים החיה (isAdmin על מסמך members), לא רשימה קשיחה.
// כך שאם יתווסף מנהל נוסף הוא ייצא מהספירה מעצמו.
function adminMemberIds() {
  const s = new Set();
  MOCK_FANS.forEach(f => { if (f.isAdmin === true) s.add(f.id); });
  return s;
}

// מחשב את כל המונים מהמערך שכבר בזיכרון. days = כמה ימי-לוח אחורה כולל היום.
function computePlatformStats(days, includeAdmins) {
  const from = new Date();
  from.setHours(0, 0, 0, 0);
  from.setDate(from.getDate() - (days - 1));
  const admins = adminMemberIds();

  const a = {
    from, days,
    landing: 0, home: 0,
    landingSessions: new Set(), homeSessions: new Set(),
    fanOpen: 0, fanSubmit: 0, bizOpen: 0, bizSubmit: 0, loginOpen: 0,
    device: { mobile: 0, desktop: 0 },
    sources: {}, direct: 0,
    adminHidden: 0, inRange: 0,
    // §326 — עומק-גלילה בדף הנחיתה, סשנים ייחודיים לכל אבן-דרך
    depth: { regCard: new Set(), preview: new Set(), final: new Set() },
  };

  (platformEvents || []).forEach(e => {
    if (e.at < from) return;
    // ⚠️ אפשר לזהות רק אירוע שנשא memberId. אירוע של מנהל **מנותק** (למשל כניסה לדף הנחיתה
    // בלי session פעיל) נראה בדיוק כמו אורח ואי אפשר להוציא אותו — מוצג כהסתייגות על המסך.
    const isAdminEvent = e.memberId && admins.has(e.memberId);
    if (isAdminEvent) { a.adminHidden++; if (!includeAdmins) return; }
    a.inRange++;

    // index.html הוא redirect לדף הנחיתה, ולכן נספר איתו ולא כדף נפרד
    const isLanding = e.path.includes('welcome') || e.path.includes('index') || e.path === '/' || e.path === '';
    const isHome    = e.path.includes('home');

    if (e.type === 'pageView') {
      // דף שאינו נחיתה/בית לא נספר בכלל. היום אין כזה (רק welcome/home רושמים pageView),
      // אבל אם יתווסף — בלי היציאה הזאת הוא היה מזליג ל"מקורות תנועה"/"מובייל" בלי להופיע
      // באף אחד משני מוני-הכניסות.
      if (!isLanding && !isHome) return;
      if (e.device === 'mobile' || e.device === 'desktop') a.device[e.device]++;
      // נספר במפורש ולא בחיסור — חיסור נשבר בשקט בכל פעם שמישהו מוסיף pageView חדש
      if (e.referrer) a.sources[e.referrer] = (a.sources[e.referrer] || 0) + 1; else a.direct++;
      if (isLanding) { a.landing++; if (e.sessionId) a.landingSessions.add(e.sessionId); }
      else           { a.home++;    if (e.sessionId) a.homeSessions.add(e.sessionId); }
    } else if (e.type === 'scrollDepth') {
      // §326 — **לפי סשן ולא לפי אירוע.** אבן-דרך נורית פעם אחת לסשן ממילא, אבל ספירת
      // אירועים הייתה שוברת את המונוטוניות ברגע שמישהו יפתח את הדף פעמיים באותו טאב.
      if (e.sessionId && a.depth[e.blockId]) a.depth[e.blockId].add(e.sessionId);
    } else if (e.type === 'formOpen') {
      // joinModal = נפתח מתוך welcome.html; fanRegister = כניסה ישירה לדף ההרשמה
      if (e.blockId === 'joinModal' || e.blockId === 'fanRegister') a.fanOpen++;
      else if (e.blockId === 'bizForm') a.bizOpen++;
      else if (e.blockId === 'loginModal') a.loginOpen++;
    } else if (e.type === 'formSubmit') {
      if (e.blockId === 'bizForm') a.bizSubmit++; else a.fanSubmit++;
    }
  });

  return a;
}

const platPct = (n, of) => of > 0 ? Math.round((n / of) * 100) + '%' : '—';

// ── תצוגה (2026-08-26, בקשת המשתמש) ──────────────────────────────────────────────────────
// הוחלף מרשת-ריבועים לשורות: ריבועים מכריחים את ההסבר להיות זעיר ומצומצם, ובפועל 12 ריבועים
// זהים זה לצד זה נקראים כמו קיר-מספרים בלי היררכיה. שורה נותנת מקום אמיתי למשפט-הסבר.
// ── §367 — כמה אוהדים אושרו ולא נכנסו מעולם ───────────────────────────────
// המשתמש: *"תבדוק כמה אישרתי שלא נכנסו"*. זה המחיר בפועל של "טלפון + קוד" בכניסה
// הראשונה: אוהד שאישרת, שהונפק לו קוד, ושמעולם לא הגיע פנימה.
//
// ⚠️ **תקרת-אמינות שחייבת להיאמר במסך ולא רק כאן:** `lastSeenAt` נכתב רק מ-2.8.26.
// אוהד שנכנס לפני התאריך הזה ולא חזר מאז ייספר כ"לא נכנס". לכן השורה הראשונה היא
// **גבול עליון** בלבד, והשנייה — שמוגבלת למי שאושר אחרי שהמדידה כבר רצה — היא המספר
// שאפשר להסתמך עליו. מספר יחיד בלי הסייג הזה היה שקר שקט.
const HB_SEEN_SINCE = new Date('2026-08-02T00:00:00Z');
function fanEntryStats() {
  const approved = (MOCK_FANS || []).filter(f => f.status === 'approved');
  const never = approved.filter(f => !f.lastSeenAt);
  const clean = approved.filter(f => f.approvedAt && f.approvedAt >= HB_SEEN_SINCE);
  const cleanNever = clean.filter(f => !f.lastSeenAt);
  return { approved: approved.length, never: never.length, clean: clean.length, cleanNever: cleanNever.length };
}

// ── §390 — פילוח "אושרו ולא נכנסו" לפי מצב המייל ────────────────────────────────────────
// המספר לבדו אינו ניתן-לפעולה: "לא נכנס" הוא **שלוש בעיות שונות** שמתחפשות לאחת, וכל אחת
// דורשת פעולה אחרת — כתובת שגויה (לתקן ולשלוח שוב) · נמסר ולא נפתח (ערוץ אחר) · נפתח
// ובכל זאת לא נכנס (חיכוך הקוד עצמו, וזה מה שגוגל פותר).
//
// 🔑 **הדלי הרביעי, "אין נתוני מסירה", הוא העיקר כאן.** ה-webhook של Brevo (§205/§206)
// התחיל לרוץ מתישהו באמצע, ולרוב הרשומות הישנות פשוט **אין** נתון. בלי דלי נפרד הן היו
// נופלות ל"לא נמסר" — כלומר בדיוק אותו כשל של §388: **חוסר-מידע שמוצג כעובדה שלילית**,
// והפעם הוא היה שולח את המנהל לתקן 60 כתובות תקינות.
//
// §394 — 🔑 **הסיווג הוצא לפונקציה אחת**, כי מרגע שאפשר לסנן לפי דלי, אותה הגדרה חיה בשני
// מקומות: המונה בפאנל והסינון ברשימה. שתי העתקות של אותו `if` הן בדיוק הפער של §353/§390 —
// מנהל שלוחץ על "12" ומקבל רשימה של 11 מפסיק להאמין לשני המספרים.
function fanEmailBucketOf(f) {
  if (f.loginCodeEmailStatus !== 'sent') return 'notSent';
  if (f.loginCodeEmailOpenedAt || f.loginCodeEmailClickedAt) return 'opened';
  if (f.loginCodeEmailDeliveryAt || f.loginCodeEmailDelivery) return 'deliveredNotOpened';
  return 'sentNoData';
}

// §394 — התווית והפעולה של כל דלי, במקום אחד. הפאנל, שבב-הסינון ברשימה וכותרת-ההסבר מעל
// הרשימה קוראים כולם מכאן, כדי שהמנהל יראה את אותו משפט בשני המסכים.
const FAN_EMAIL_BUCKETS = {
  notSent: {
    label: 'המייל לא נשלח',
    action: 'כאן <b>אין טעם לדבר על גוגל</b> — הם מעולם לא קיבלו את הקוד. זו כתובת שגויה או כשל שליחה, והפעולה היא לתקן את הכתובת ואז "שליחה חוזרת" בכרטיס האוהד. וואטסאפ עובד כאן גם הוא, כי הוא מוסר את הקוד בלי תלות בכתובת.',
  },
  sentNoData: {
    label: 'נשלח, אין נתוני מסירה',
    action: '⚠️ <b>זה לא "לא נמסר" — זה "לא יודעים".</b> ה-webhook של Brevo התחיל לרוץ מאוחר יותר, ולרשומות הישנות פשוט אין נתון. אין מכאן מסקנה, ולכן גם אין פעולה מתבקשת: וואטסאפ כאן הוא ניחוש סביר, לא תיקון.',
  },
  deliveredNotOpened: {
    label: 'נמסר ולא נפתח',
    action: '🔑 <b>וואטסאפ — לא שליחה חוזרת של אותו מייל.</b> המכתב הגיע לשרת הדואר ולא נפתח; לשלוח אותו שוב זה לחזור בדיוק על מה שכבר לא עבד. ספאם/קידומים הוא חשוד אמיתי, וערוץ אחר עוקף אותו. ⚠️ ובכל זאת "לא נפתח" הוא <b>סימן חלש</b>: הפתיחה נמדדת בתמונה זעירה ש-Outlook וחלק מהלקוחות חוסמים, כלומר יש כאן גם אנשים שכן ראו את המכתב.',
  },
  opened: {
    label: 'נפתח — ובכל זאת לא נכנס',
    action: '🔑 <b>הם קיבלו, פתחו, וויתרו</b> — כלומר החיכוך הוא הקוד עצמו ולא המסירה. זו הקבוצה שגוגל נבנה בשבילה, וכדאי לומר להם במפורש שאפשר להיכנס גם בלי הקוד.',
  },
};

function fanEntryBreakdown() {
  const never = (MOCK_FANS || []).filter(f => f.status === 'approved' && !f.lastSeenAt);
  const out = { never: never.length, opened: 0, deliveredNotOpened: 0, sentNoData: 0, notSent: 0 };
  for (const f of never) out[fanEmailBucketOf(f)]++;
  return out;
}

// §394 — הפרמטר החמישי (onclick) אופציונלי: 20 הקריאות הקיימות מעבירות ארבעה ארגומנטים
// וממשיכות להתנהג בדיוק כמו קודם. רק שורות-הפילוח מקבלות אותו, כי רק להן יש רשימה להוביל אליה.
function platRow(name, num, sub, help, onclick) {
  return `<div class="plat-row${onclick ? ' clickable' : ''}"${onclick ? ` onclick="${onclick}" title="להצגת הרשימה"` : ''}>
    <div class="plat-row-name">${name}${onclick ? ' <span class="plat-row-go">← לרשימה</span>' : ''}</div>
    <div class="plat-row-num">${num}</div>
    ${sub ? `<div class="plat-row-sub">${sub}</div>` : ''}
    <div class="plat-row-help">${help}</div>
  </div>`;
}

// פס יחיד במשפך. הרוחב יחסי **לשלב הראשון** ולא לרוחב הזמין — כך שהנשירה נראית לעין
// ולא רק נקראת כמספר. min-width קטן כדי ששלב עם 0 עדיין ייתן קו ולא ייעלם לגמרי.
function platBar(name, n, max, pct) {
  // n===0 → פס באורך אפס ממש. רצפת ה-2% קיימת רק כדי ששלב קטן-אבל-קיים לא ייעלם —
  // לתת "קצת פס" לשלב שאף אחד לא הגיע אליו זה בדיוק סוג העיוות שהמסך הזה אמור למנוע.
  const w = (max > 0 && n > 0) ? Math.max(2, Math.round((n / max) * 100)) : 0;
  return `<div class="plat-bar-row">
    <div class="plat-bar-name">${name}</div>
    <div class="plat-bar-track"><div class="plat-bar-fill" style="width:${w}%"></div></div>
    <div class="plat-bar-val">${n.toLocaleString('he-IL')}${pct ? ` <span class="plat-bar-pct">${pct}</span>` : ''}</div>
  </div>`;
}

function platFunnel(openN, submitN, openHelp, submitHelp) {
  const lost = Math.max(0, openN - submitN);
  return `
    ${platBar('פתחו את הטופס', openN, openN)}
    ${platBar('שלחו בקשה', submitN, openN, platPct(submitN, openN))}
    ${openN ? `<div class="plat-drop">↓ ${lost.toLocaleString('he-IL')} פתחו ולא שלחו — נטשו באמצע</div>` : ''}
    <div class="plat-funnel-help">${openHelp}<br>${submitHelp}</div>`;
}

function platformStatsHtml() {
  const head = `<div class="plat-title">🌐 פלטפורמה — כניסות ומשפך הרשמה</div>`;
  if (platformStatsError) {
    return `<div class="plat-panel">${head}<div class="plat-sub">לא ניתן לטעון את נתוני האירועים: ${esc(platformStatsError)}</div>
      <div style="margin-top:8px"><button class="act-btn tiny" onclick="retryPlatformStats()">נסה שוב</button></div></div>`;
  }
  if (!platformEvents) {
    return `<div class="plat-panel">${head}<div class="plat-sub">טוען נתוני כניסות…</div></div>`;
  }

  const a = computePlatformStats(platformRange, platformIncludeAdmins);
  const topSources = Object.entries(a.sources).sort((x, y) => y[1] - x[1]).slice(0, 8);
  const devTotal = a.device.mobile + a.device.desktop;
  const rangeLabel = (PLATFORM_RANGES.find(r => r.d === platformRange) || {}).label || '';

  return `
  <div class="plat-panel">
    <div class="plat-head-row">
      <div style="flex:1;min-width:200px">
        ${head}
        <div class="plat-sub">${esc(rangeLabel)} · מ-${fmtDate(a.from)} · ${a.inRange.toLocaleString('he-IL')} אירועים${
          platformTruncated ? ` · <b style="color:var(--orange)">נשלפו ${PLATFORM_EVENT_LIMIT.toLocaleString('he-IL')} האירועים האחרונים בלבד</b>` : ''}</div>
      </div>
      <select class="filter-select" onchange="setPlatformRange(this.value)">
        ${PLATFORM_RANGES.map(r => `<option value="${r.d}" ${platformRange === r.d ? 'selected' : ''}>${r.label}</option>`).join('')}
      </select>
    </div>

    <label class="plat-toggle">
      <input type="checkbox" ${platformIncludeAdmins ? 'checked' : ''} onchange="setPlatformIncludeAdmins(this.checked)">
      <span>להציג גם צפיות של מנהלים${a.adminHidden ? ` (${a.adminHidden.toLocaleString('he-IL')} אירועים בטווח)` : ''}</span>
    </label>

    ${(() => {
      // §367 — נגזר מ-MOCK_FANS ולא מהאירועים, ולכן מדויק גם כשהמדידה חלקית או קטומה.
      const fe = fanEntryStats();
      if (!fe.approved) return '';
      const pct = Math.round(fe.never / fe.approved * 100);
      return `<div class="plat-sect">אוהדים מאושרים</div>
      <div class="plat-rows">
        ${platRow('אושרו ולא נכנסו מעולם', fe.never.toLocaleString('he-IL'),
          `${pct}% מתוך ${fe.approved.toLocaleString('he-IL')} מאושרים`,
          '⚠️ <b>גבול עליון.</b> הנתון (lastSeenAt) נכתב רק מ-2.8.26, ולכן אוהד שנכנס לפני כן ולא חזר מאז נספר כאן בטעות. השורה מתחת מסננת את זה.')}
        ${platRow('מתוכם — אושרו מ-2.8.26 ואילך', fe.cleanNever.toLocaleString('he-IL'),
          `מתוך ${fe.clean.toLocaleString('he-IL')} שאושרו מאז`,
          'כאן אין סייג היסטורי: כל אוהד בקבוצה הזאת אושר אחרי שהמדידה כבר רצה, ולכן "לא נכנס" אומר <b>באמת לא נכנס</b>. זה המספר שאפשר להסתמך עליו.')}
      </div>
      ${(() => {
        // §390 — הפילוח. כל שורה כאן היא **פעולה אחרת**, ולכן הן מופרדות ולא מסוכמות.
        const eb = fanEntryBreakdown();
        if (!eb.never) return '';
        // §394 — כל שורה כאן מובילה לרשימת האנשים שמאחוריה. עד עכשיו הפילוח נגמר במספר:
        // המנהל ראה "12 נמסר ולא נפתח" ולא הייתה לו שום דרך להגיע אל אותם 12.
        const bRow = (key, num, sub) =>
          platRow(FAN_EMAIL_BUCKETS[key].label, num.toLocaleString('he-IL'), sub,
                  FAN_EMAIL_BUCKETS[key].action, `goToFanBucket('${key}')`);
        return `<div class="plat-sect">מתוך אלה שלא נכנסו — מה קרה למייל</div>
        <div class="plat-rows">
          ${bRow('notSent', eb.notSent, 'נכשל או עדיין בתור')}
          ${bRow('sentNoData', eb.sentNoData, 'לפני שמעקב המסירה התחיל')}
          ${bRow('deliveredNotOpened', eb.deliveredNotOpened, 'הגיע לשרת הדואר')}
          ${bRow('opened', eb.opened, 'ראה את הקוד ולא השתמש בו')}
        </div>`;
      })()}`;
    })()}
    <div class="plat-sect">כניסות</div>
    <div class="plat-rows">
      ${platRow('דף הנחיתה', a.landing.toLocaleString('he-IL'),
        `${a.landingSessions.size.toLocaleString('he-IL')} מבקרים`,
        'כמה פעמים נטען דף הנחיתה. נספר <b>לאורחים בלבד</b> — חבר עם התחברות תקפה מועבר ישר לדף הבית ולא נספר כאן.')}
      ${platRow('דף הבית (האינדקס)', a.home.toLocaleString('he-IL'),
        `${a.homeSessions.size.toLocaleString('he-IL')} מבקרים`,
        'כמה פעמים נטען האינדקס עצמו — כאן נכנסים החברים המחוברים, ולכן זה המדד לשימוש חוזר.')}
      ${platRow('מובייל מול דסקטופ', devTotal ? platPct(a.device.mobile, devTotal) : '—',
        devTotal ? `דסקטופ ${platPct(a.device.desktop, devTotal)}` : '',
        'מתוך כלל הכניסות לשני הדפים. נקבע לפי רוחב המסך בזמן הכניסה, לא לפי סוג המכשיר עצמו.')}
      ${platRow('פתחו את חלון הכניסה', a.loginOpen.toLocaleString('he-IL'), '',
        'לחצו על "כניסה" בדף הנחיתה — חבר קיים שמנסה להתחבר, לא נרשם חדש.')}
    </div>

    <div class="plat-sect">עד לאן מגיעים בדף הנחיתה</div>
    ${(() => {
      // §326 — הבסיס הוא **סשני-נחיתה**, לא צפיות: השאלה היא "כמה אנשים הגיעו לכל נקודה",
      // וצפייה חוזרת באותו סשן אינה אדם נוסף.
      const base = a.landingSessions.size;
      const d = a.depth;
      // ⚠️ הסתייגות אמיתית ולא נימוס: `scrollDepth` נמדד רק מ-§326 ואילך. בטווח שמתחיל
      // לפני הפריסה, כל הסשנים הישנים ייראו כאילו "לא ראו כלום" — כלומר משפך מפחיד לגמרי
      // שכולו ארטיפקט. אותו לקח בדיוק כמו SUBMIT_MEASURE_START ב-§281.
      if (!base || (d.regCard.size + d.preview.size + d.final.size) === 0) {
        return `<div class="plat-sub">אין עדיין נתוני גלילה בטווח הזה. המדידה התחילה ב-${DEPTH_MEASURE_START} — טווח שמתחיל לפני התאריך הזה יציג נתונים חלקיים.</div>`;
      }
      return `
        ${platBar('נחתו בדף', base, base)}
        ${platBar('ראו את כרטיס ההרשמה', d.regCard.size, base, platPct(d.regCard.size, base))}
        ${platBar('הגיעו לתצוגת העסקים', d.preview.size, base, platPct(d.preview.size, base))}
        ${platBar('הגיעו לסוף הדף', d.final.size, base, platPct(d.final.size, base))}
        <div class="plat-funnel-help">
          <b>ראו את כרטיס ההרשמה</b> — ה-CTA הראשי בראש הדף. אם המספר הזה נמוך, הכפתור לא נראה
          כלל ומדובר בבעיית פריסה ולא בבעיית שכנוע.<br>
          <b>הגיעו לתצוגת העסקים / לסוף הדף</b> — גללו והמשיכו. מי שגלל עד הסוף ולא נרשם
          <b>כן</b> ראה את ההצעה ובחר לא — וזו בעיה אחרת לגמרי.<br>
          נמדד מ-${DEPTH_MEASURE_START}, לפי סשנים ייחודיים ולא לפי צפיות. אבן-דרך נספרת ברגע
          ש-35% מהאלמנט נראו על המסך.
        </div>`;
    })()}

    <div class="plat-sect">משפך הרשמה — אוהדים</div>
    ${platFunnel(a.fanOpen, a.fanSubmit,
      '<b>פתחו את הטופס</b> — נפתח מודאל ההרשמה מדף הנחיתה, או שנכנסו ישירות לדף ההרשמה.',
      `<b>שלחו בקשה</b> — הבקשה נקלטה בפועל, נספר רק אחרי כתיבה מוצלחת ולא על לחיצה. נמדד רק מ-${SUBMIT_MEASURE_START}.`)}

    <div class="plat-sect">משפך הרשמה — עסקים</div>
    ${platFunnel(a.bizOpen, a.bizSubmit,

      `<b>שלחו בקשה</b> — רשומת עסק נוצרה בפועל. הטופס ארוך בהרבה מזה של האוהדים, ולכן כאן רואים כמה נושרים בגללו. נמדד רק מ-${SUBMIT_MEASURE_START}.`)}

    <div class="plat-sect">מקורות תנועה</div>
    ${(topSources.length || a.direct)
      ? `<div class="plat-src">${topSources.map(([src, n]) =>
          `<div class="plat-src-chip"><b>${esc(src)}</b> ${n.toLocaleString('he-IL')}</div>`).join('')}
         <div class="plat-src-chip">כניסה ישירה ${a.direct.toLocaleString('he-IL')}</div></div>
         <div class="plat-sub" style="margin-top:6px">מאיפה הגיעו — לפי כתובת המקור של הדפדפן. "כניסה ישירה" = הקלדת כתובת, סימנייה, או אפליקציה שלא מעבירה מקור (חלק מלקוחות וואטסאפ).</div>`
      : `<div class="plat-sub">אין כניסות בטווח הזה.</div>`}

    <div class="plat-note">
      <b>מה חשוב לדעת לפני שמסיקים מסקנות:</b><br>
      · <b>צפיות של מנהלים מוסתרות</b> כברירת מחדל, לפי <code>isAdmin</code> על רשומת החבר. מגבלה: אפשר לזהות רק אירוע שנשא זיהוי-חבר — כניסה של מנהל <b>מנותק</b> לדף הנחיתה נראית בדיוק כמו אורח ואי אפשר להוציא אותה.<br>
      · <b>עמודת "לחיצות" בטבלת העסקים למטה היא מונה נפרד</b> ואינה מושפעת מהבחירה כאן — היא מספר בודד על מסמך העסק, בלי זיהוי מי לחץ, ולכן אי אפשר לנקות ממנה צפיות עבר. מ-${SUBMIT_MEASURE_START} היא כבר לא נספרת כשמנהל לוחץ.<br>
      · <b>שליחות טופס נמדדות רק מ-${SUBMIT_MEASURE_START}</b> — לפני כן האירוע לא נרשם בכלל, ולכן טווח שכולל ימים קודמים יראה שיעור השלמה נמוך מדי. מספר ההרשמות האמיתי נמצא ב"כל האוהדים", לפי תאריך ההגשה.<br>
      · <b>עד ${SUBMIT_MEASURE_START} חלק מהכניסות אבדו:</b> כתובת המקור נשלחה במלואה בזמן שחוקי האבטחה מגבילים ל-50 תווים, וכל הגעה מקישור ארוך (קבוצת פייסבוק, מייל, חיפוש) נדחתה יחד עם כל האירוע. תוקן — נשמר המארח בלבד.<br>
      · "מבקרים" = דפדפן+טאב (session), לא אדם. אותו אדם בשני מכשירים נספר פעמיים.
    </div>
  </div>`;
}

let dataSort = 'clicks'; // 'clicks' | 'likes' | 'anchors' | 'newest' | 'redeem'
let dataSearch = '';
let dataCategoryFilter = 'all';
window.setDataSort = function(v) { dataSort = v; renderMain(); };
window.filterDataRows = function(v) { dataSearch = v; renderMain(); };
window.setDataCategoryFilter = function(v) { dataCategoryFilter = v; renderMain(); };

function anchoredForBiz(bizId) {
  const counts = {};
  ALL_TABS.forEach(t => {
    (state[t.key] || []).forEach(a => {
      if (a && a.bizId === bizId && !isExpired(a)) counts[t.label] = (counts[t.label] || 0) + 1;
    });
  });
  const total = Object.values(counts).reduce((s, n) => s + n, 0);
  const label = Object.entries(counts).map(([lbl, n]) => lbl.replace(/^\S+\s/, '') + ' ' + n).join(' · ') || '—';
  return { total, label };
}

function dataCenterHtml() {
  const approved = MOCK_BUSINESSES.filter(b => b.status === 'approved');
  const totalClicks = approved.reduce((s, b) => s + (b.clicks || 0), 0);
  const totalHearts = approved.reduce((s, b) => s + (b.likesOverride ?? b.likes ?? 0), 0);
  const q = dataSearch.trim().toLowerCase();
  const filtered = approved.filter(b => {
    if (dataCategoryFilter !== 'all' && b.catKey !== dataCategoryFilter) return false;
    if (q) {
      const catLabel = (CATEGORIES.find(c => c.key === b.catKey) || {}).label || '';
      if (!b.name.toLowerCase().includes(q) && !catLabel.toLowerCase().includes(q)) return false;
    }
    return true;
  });
  const rows = filtered.map(b => ({ b, anchors: anchoredForBiz(b.id), redeem: redeemFor(b.id) })).sort((x, y) => {
    if (dataSort === 'likes') return (y.b.likesOverride ?? y.b.likes ?? 0) - (x.b.likesOverride ?? x.b.likes ?? 0);
    if (dataSort === 'anchors') return y.anchors.total - x.anchors.total;
    if (dataSort === 'newest') return y.b.registeredAt - x.b.registeredAt;
    if (dataSort === 'redeem') return y.redeem.opens - x.redeem.opens;
    return (y.b.clicks || 0) - (x.b.clicks || 0);
  });
  // §275 — סיכום כלל-פלטפורמה ל-KPI שבראש המסך. opens ופעולות נספרים בנפרד (§276).
  const redeemTotals = rows.reduce((acc, r) => {
    acc.opens += r.redeem.opens;
    Object.entries(r.redeem.ch).forEach(([c, n]) => { acc.ch[c] = (acc.ch[c] || 0) + n; });

  }, { opens: 0, ch: {} });
  return `

      <div style="flex:1;min-width:230px">

        <div><div class="msg-kpi-num">${approved.length}</div><div class="msg-kpi-label">עסקים באינדקס</div></div>
        <div class="msg-kpi-sep"></div>
        <div><div class="msg-kpi-num">${totalClicks.toLocaleString('he-IL')}</div><div class="msg-kpi-label">סה״כ לחיצות</div></div>
        <div class="msg-kpi-sep"></div>
        <div><div class="msg-kpi-num">${totalHearts.toLocaleString('he-IL')}</div><div class="msg-kpi-label">סה״כ לבבות</div></div>
        <div class="msg-kpi-sep"></div>
        <div><div class="msg-kpi-num">${redeemStats ? redeemTotals.opens.toLocaleString('he-IL') : '—'}</div><div class="msg-kpi-label">פתיחות מימוש</div></div>
      </div>
    </div>
    ${redeemStatsError
      ? `<div class="placeholder-note">לא ניתן לטעון את נתוני המימוש: ${esc(redeemStatsError)}
          <div style="margin-top:8px"><button class="act-btn tiny" onclick="retryRedeemStats()">נסה שוב</button></div></div>`
      : !redeemStats
        ? `<div class="placeholder-note">טוען נתוני מימוש…</div>`
        : `${redeemTruncated ? `<div class="placeholder-note" style="color:var(--orange)">⚠️ נשלפו ${REDEEM_EVENT_LIMIT.toLocaleString('he-IL')} אירועי מימוש בלבד — המספרים כאן חלקיים. השליפה מסודרת לפי מזהה-המסמך ולא לפי תאריך, ולכן זו דגימה ולא "האחרונים".</div>` : ''}
          <div class="redeem-kpi-row">${Object.entries(REDEEM_ACTION_LABELS).map(([k, lbl]) =>
            `<div class="redeem-kpi"><div class="redeem-kpi-num">${(redeemTotals.ch[k] || 0).toLocaleString('he-IL')}</div><div class="redeem-kpi-lbl">${lbl}</div></div>`).join('')}</div>`}
    ${platformStatsHtml()}
    <div class="filter-toolbar-row" style="margin-bottom:10px">
      <input class="filter-search-input" type="search" id="dataSearchInput" placeholder="🔍 חיפוש עסק או קטגוריה" value="${esc(dataSearch)}" oninput="filterDataRows(this.value)">
      <select class="filter-select" onchange="setDataCategoryFilter(this.value)">
        <option value="all">כל הקטגוריות</option>
        ${CATEGORIES.map(c => `<option value="${c.key}" ${dataCategoryFilter===c.key?'selected':''}>${c.icon} ${c.label}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="setDataSort(this.value)">
        <option value="clicks" ${dataSort==='clicks'?'selected':''}>מיון: הכי הרבה לחיצות</option>
        <option value="likes" ${dataSort==='likes'?'selected':''}>מיון: הכי הרבה לבבות</option>
        <option value="anchors" ${dataSort==='anchors'?'selected':''}>מיון: הכי הרבה מיקומים מעוגנים</option>
        <option value="newest" ${dataSort==='newest'?'selected':''}>מיון: הכי חדשים</option>
        <option value="redeem" ${dataSort==='redeem'?'selected':''}>מיון: הכי הרבה מימושים</option>
      </select>
      <div style="flex:1"></div>
      <div style="font-size:12px;color:var(--text-sm)">מציג ${rows.length} מתוך ${approved.length} עסקים באינדקס</div>
    </div>
    <div class="data-tbl">
      <div class="data-row data-head">
        <div>עסק</div><div>לחיצות</div><div>לבבות</div><div>פתיחות מימוש</div><div>באינדקס מאז</div><div>מיקומים מעוגנים</div>
      </div>
      ${rows.map(({ b, anchors, redeem }) => {

        return `
        <div class="data-row">

          <div class="data-val strong">${(b.clicks || 0).toLocaleString('he-IL')}</div>
          <div class="data-val">${shownLikes.toLocaleString('he-IL')}</div>
          <div class="data-val${redeem.opens ? ' strong' : ''}">${redeemStats ? redeem.opens.toLocaleString('he-IL') : '—'}${
            Object.keys(redeem.ch).length ? `<div class="data-redeem-brk">${Object.entries(redeem.ch)
              .sort((a, c) => c[1] - a[1])
              .map(([k, n]) => `${REDEEM_ACTION_LABELS[k] || k} ${n}`).join(' · ')}</div>` : ''}</div>
          <div class="data-val">${fmtDate(b.approvedAt || b.registeredAt)}</div>
          <div class="data-val">${anchors.label}</div>

      }).join('') || `<div class="placeholder-note">${approved.length ? 'אין עסקים תואמים לחיפוש/סינון' : 'אין עסקים מאושרים באינדקס'}</div>`}
    </div>
    <div class="biz-foot">מוצגים כאן רק נתונים אמיתיים: <span class="hl">לחיצות</span> (מונה בודד על העסק, בלי פירוק לפי יום — ולכן אין מגמה או השוואת תקופות), <span class="hl">לבבות</span>, <span class="hl">תאריך הצטרפות לאינדקס</span> ו<span class="hl">מיקומים מעוגנים</span> בפועל. <span class="warnhl">חשיפות, אחוז המרה ופניות</span> אינם מוצגים — אין להם עדיין צנרת מדידה במערכת.</div>
    ${dataFutureRoadmapHtml()}`;
}

// רשימת-נתונים-עתידית (2026-08-05, בקשת המשתמש) — לא מספרים מומצאים, רשימת "מה נרצה למדוד בעתיד"
// מסודרת לפי פלטפורמה/אוהדים/עסקים, שקופה לגבי מה כבר נאסף ברקע (collection 'events', ר' §110-111)
// מול מה שעדיין דורש קוד חדש בדפים חיים. נשארת מחוץ ל-.biz-foot כי היא לא תיאור-הטבלה-שמעליה,
// אלא תכנון להמשך — לא לבלבל בין "מה מוצג כאן" למה "מה עוד יכול להיבנות".
function dataFutureRoadmapHtml() {
  return `
    <div class="roadmap-panel">
      <div class="roadmap-title">📊 נתונים שנרצה למדוד בעתיד (עדיין לא מוצגים כאן)</div>

      <div style="font-size:12px;font-weight:800;color:var(--text);margin:10px 0 4px">🌐 פלטפורמה (שימוש, כניסות, דף נחיתה)</div>
      <div class="roadmap-list">
        · <s>כניסות לדף הנחיתה/לאתר, מקורות תנועה, מובייל מול דסקטופ, ומשפך פתחו-טופס→שלחו-בקשה</s> — <b>✅ נבנה (§281)</b>, מוצג בפאנל "פלטפורמה" למעלה<br>
        · שלב "נחסמו-להתחבר" במשפך (gateBlock) — <b>כבר נאסף</b>, עדיין לא מוצג בפאנל<br>
        · ביצועי-בלוקים בדף-הנחיתה (איזה כפתור מביא הכי הרבה הרשמות) — <b>landingBlockClick עם blockId כבר נאסף</b>, רק לא מסוכם פר-בלוק<br>
        · זמן שהייה ממוצע, עומק-גלילה — לא נאסף כלל, דורש קוד חדש<br>
        · שינויים לא-מפורסמים בתוכן דף הנחיתה — נגזר ישירות מ-settings/landingContentDraft הקיים, לא דורש events בכלל
      </div>

      <div style="font-size:12px;font-weight:800;color:var(--text);margin:14px 0 4px">👥 אוהדים</div>
      <div class="roadmap-list">
        · <b>✅ §367 — "אושרו ולא נכנסו מעולם" מוצג עכשיו</b> בראש פאנל הפלטפורמה (גבול-עליון + מספר נקי מ-2.8.26). "נכנסו ב-30 יום" עדיין לא נבנה<br>
        · האוהדים הכי פעילים (כניסות+לחיצות פר-אוהד, לא רק לבבות) — pageView/bizClick <b>כבר נאספים עם memberId</b>, רק לא מקובצים פר-אוהד<br>
        · יחס-מעורבות (לב לכל 100 לחיצות, פנייה לכל 100 לחיצות, % אוהדים פעילים) — נגזר מנתונים-קיימים אחרי שיש אגרגציה
      </div>

      <div style="font-size:12px;font-weight:800;color:var(--text);margin:14px 0 4px">🏪 עסקים</div>
      <div class="roadmap-list">
        · חשיפות (עסק נראה בפיד, לא רק נלחץ) — <b>לא קיים כלל</b>, דורש אירוע-חדש (bizImpression) בכל render של כרטיס ב-home.html — זהירות מביצועים (intersection-observer/debounce, לא אירוע-בכל-סקרול)<br>
        · אחוז המרה פר-עסק (חשיפות→לחיצות) — תלוי בבניית חשיפות קודם<br>
        · פניות בפועל פר-עסק (וואטסאפ/טלפון/מייל, לא רק "לחיצה על הכרטיס") — <b>bizContact עם channel כבר נאסף</b> (phone/whatsapp), רק לא מסוכם פר-עסק<br>
        · פירוק-יומי ל-clicks (למגמה/השוואת-תקופות, לא רק המונה המצטבר הקיים) — <b>bizClick events כבר נאספים עם תאריך</b>, אפשר לגזור בלי לגעת בשדה clicks עצמו<br>
        · לפי-קטגוריה: לחיצות/חשיפות/פניות ברמת-קטגוריה — סיכום של הנקודות למעלה, לא נתון נפרד
      </div>

      <div class="roadmap-list" style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--border-md)">
        <b>מה חוצה את כל השלוש:</b> כלום היום לא קורא בפועל מ-collection ה-events בדשבורד הזה — כל הנקודות המסומנות "כבר נאסף" דורשות רק שכבת-אגרגציה/שאילתה חדשה כאן, לא שינוי בדפים החיים. הנקודות המסומנות "לא קיים כלל" דורשות גם קוד-איסוף חדש בדפים החיים לפני שיש מה לסכם.
      </div>
    </div>`;
}

const LANDING_FIELD_MAP = {
  heroTitle:     { input: 'lctInHeroTitle',     preview: 'lctPvHeroTitle' },
  heroSlogan:    { input: 'lctInHeroSlogan',    preview: 'lctPvHeroSlogan' },

  bizTitle:      { input: 'lctInBizTitle',      preview: 'lctPvBizTitle' },
  bizText:       { input: 'lctInBizText',       preview: 'lctPvBizText' },
  bizBtn:        { input: 'lctInBizBtn',        preview: 'lctPvBizBtn' },
  finalTitle:    { input: 'lctInFinalTitle',    preview: 'lctPvFinalTitle' },

  finalBtn2:     { input: 'lctInFinalBtn2',     preview: 'lctPvFinalBtn2' },
};

let landingLiveDoc = null;       // raw settings/landingContent (null = מעולם לא פורסם — LANDING_DEFAULTS הם ה"חי" בפועל)
let landingDraftDoc = null;      // raw settings/landingContentDraft (null = אין טיוטה ממתינה)
let landingWorking = null;       // המצב הנערך כרגע — מתחיל מהטיוטה אם יש, אחרת מהחי. מאותחל פעם אחת ב-maybeInitLandingWorking
let landingSelectedBlock = 'hero';
let landingPanelOpen = true;
let landingDevice = 'desktop';
let landingPendingTileImgIndex = null;
let landingTileUploading = {};   // { [tileIndex]: true } בזמן העלאה אמיתית ל-Storage
let landingSaveTimer = null;
let landingPublishing = false;
let _landingLiveLoaded = false, _landingDraftLoaded = false;

function landingClone(o) { return JSON.parse(JSON.stringify(o)); }
function landingEffectiveLive() { return landingLiveDoc || LANDING_DEFAULTS; }

// אתחול חד-פעמי — לא בכל snapshot, אחרת הד הכתיבה העצמית שלנו לטיוטה (מה-debounce) היה
// דורס את מה שהמנהל מקליד באמצע העריכה.
function maybeInitLandingWorking() {
  if (!_landingLiveLoaded || !_landingDraftLoaded || landingWorking) return;
  landingWorking = landingClone(landingDraftDoc || landingEffectiveLive());
  if (activeTab === LANDING_KEY) renderMain();
}

// שוויון עמוק אמיתי — לא JSON.stringify: Firestore לא מבטיח לשמר סדר שדות במפות בתוך מערך
// (tiles), אז אחרי round-trip לשרת סטרינגיפיקציה-גולמית הראתה "נערך" כוזב על בלוק שלא נגעו בו.
function landingDeepEqual(a, b) {
  if (a === b) return true;
  if (typeof a !== 'object' || typeof b !== 'object' || a === null || b === null) return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  const aKeys = Object.keys(a), bKeys = Object.keys(b);
  if (aKeys.length !== bKeys.length) return false;
  return aKeys.every(k => landingDeepEqual(a[k], b[k]));
}
function landingBlockDirty(key) {
  if (!landingWorking) return false;
  const live = landingEffectiveLive();
  return LANDING_BLOCK_FIELDS[key].some(f => !landingDeepEqual(landingWorking[f], live[f]));
}
function landingHasUnpublished() {
  if (!landingWorking) return false;
  return Object.keys(LANDING_BLOCK_FIELDS).some(landingBlockDirty);
}

function landingRefreshChrome() {
  const bl = document.getElementById('lctBlockList');
  if (bl) bl.innerHTML = landingBlockListHtml();
  const ta = document.getElementById('lctTopActions');
  if (ta) ta.innerHTML = landingTopActionsHtml();
}

function scheduleLandingDraftSave() {
  clearTimeout(landingSaveTimer);
  landingSaveTimer = setTimeout(async () => {
    try {
      if (landingHasUnpublished()) {
        await setDoc(doc(db, 'settings', 'landingContentDraft'), landingWorking);
      } else if (landingDraftDoc) {
        await deleteDoc(doc(db, 'settings', 'landingContentDraft'));
      }
    } catch (e) { console.error('שמירת טיוטת תוכן-נחיתה נכשלה:', e); }
  }, 900);
}

    if (c) { c.textContent = raw.length + ' / 90 תווים'; c.classList.toggle('warn', raw.length > 70); }

  scheduleLandingDraftSave();

};
window.onLandingTileFile = async function(input) {
  const i = landingPendingTileImgIndex;
  const file = input.files && input.files[0];
  input.value = '';
  if (i === null || !file) return;
  landingTileUploading[i] = true;
  renderMain();
  try {
    const compressed = await compressToFile(file, 1280, 0.82, `tile_${i}.webp`);
    const url = await uploadFile(compressed, `landing/tiles/tile_${Date.now()}_${i}.webp`);
    landingWorking.tiles[i].img = url;
    scheduleLandingDraftSave();
  } catch (e) {
    console.error('העלאת תמונת-קובייה נכשלה:', e);
    alert('העלאת התמונה נכשלה — נסו שוב.');
  } finally {
    delete landingTileUploading[i];
    renderMain();
  }
};

window.addLandingTile = function() {
  if (landingWorking.tiles.length >= LANDING_MAX_TILES) return;
  landingWorking.tiles.push({ img: '', title: '', sub: '', pill: '' });
  scheduleLandingDraftSave();
  renderMain();
};
window.removeLandingTile = function(i) {
  if (landingWorking.tiles.length <= 1) return;
  landingWorking.tiles.splice(i, 1);
  scheduleLandingDraftSave();
  renderMain();
};
window.moveLandingTile = function(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= landingWorking.tiles.length) return;
  const tmp = landingWorking.tiles[i]; landingWorking.tiles[i] = landingWorking.tiles[j]; landingWorking.tiles[j] = tmp;
  scheduleLandingDraftSave();
  renderMain();
};
window.onLandingLayoutChange = function() {
  landingWorking.tilesPerRow = parseInt(document.getElementById('lctInTilesPerRow').value, 10);
  landingWorking.tileSize = document.getElementById('lctInTileSize').value;
  scheduleLandingDraftSave();
  renderMain();
};

// ── §327 — גבול-זמן לפרסום ─────────────────────────────────────────────────────────────────
// דווח בפועל (2026-08-29): *"יש בעיה בשמירה, העכבר הופך לסימן אדום וזה נתקע"*.
// השורש: `setDoc` של Firestore **לא נכשל** כשהחיבור לא יציב — הוא מכניס את הכתיבה לתור
// מקומי וה-Promise פשוט לא חוזר לעולם. ה-`finally` שמאפס את landingPublishing אף פעם לא
// רץ, הכפתור נשאר disabled עם `cursor: not-allowed` (ר' .slot-btn[disabled]), ואין שום
// הודעה — כי לא הייתה שגיאה. אותו דפוס בדיוק כמו §280/§312/§313: **כל await ברשת חייב גבול**.
//
// ⚠️ הניסוח בהודעה אינו "הפרסום נכשל": הכתיבה עשויה עדיין להשלים כשהחיבור יחזור, ולומר
// "נכשל" היה גורם לפרסום כפול או לוויתור על שינוי שכן נשמר.
function landingWithTimeout(promise, ms, label) {
  let timer;
  return Promise.race([
    promise.finally(() => clearTimeout(timer)),
    new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(label)), ms); }),
  ]);
}

window.publishLandingContent = async function() {
  if (!landingWorking || landingPublishing || !landingHasUnpublished()) return;
  landingPublishing = true;
  renderMain();
  try {
    const changedBlocks = Object.keys(LANDING_BLOCK_FIELDS).filter(landingBlockDirty).map(k => LANDING_BLOCK_LABELS[k]);
    const payload = landingClone(landingWorking);
    payload.updatedAt = serverTimestamp();
    payload.updatedBy = CURRENT_ADMIN.name;
    await landingWithTimeout(
      setDoc(doc(db, 'settings', 'landingContent'), payload), 15000, 'publish-timeout');
    // מכאן ואילך הפרסום עצמו כבר הצליח. ניקוי-הטיוטה ורישום-הפעילות הם ניקוי-אחריו בלבד,
    // ולכן הם לא מפילים את הפרסום ולא תוקעים את הכפתור אם הם נתקעים בעצמם.
    await landingWithTimeout(
      deleteDoc(doc(db, 'settings', 'landingContentDraft')), 8000, 'draft-timeout').catch(() => {});
    await landingWithTimeout(logActivity('settings', 'landingContent', {
      type: 'landingPublish',
      title: 'פורסם תוכן חדש לדף הנחיתה',
      detail: changedBlocks.length ? changedBlocks.join(', ') : 'ללא שינוי בבלוקים',
      source: 'admin',
    }), 8000, 'activity-timeout').catch(() => {});
  } catch (e) {
    console.error('פרסום תוכן דף הנחיתה נכשל:', e);
    // הקוד האמיתי בתוך ההודעה — אותו לקח כמו bizWriteErrorMsg ב-business-dashboard.html:
    // "נסו שוב" גנרי הוא בדיוק מה שהסתיר את הבאג הזה עד היום.
    alert(e && e.message === 'publish-timeout'
      ? 'לא התקבל אישור מהשרת תוך 15 שניות. ייתכן שהפרסום יושלם לבד כשהחיבור יתייצב — רעננו את הדף ובדקו לפני שמפרסמים שוב.'
      : `הפרסום נכשל — נסו שוב. (קוד: ${(e && (e.code || e.message)) || 'unknown'})`);
  } finally {
    landingPublishing = false;
    renderMain();
  }
};

window.discardLandingChanges = async function() {
  if (!landingHasUnpublished()) return;
  if (!confirm('לבטל את כל השינויים שלא פורסמו ולחזור למה שחי היום?')) return;
  clearTimeout(landingSaveTimer);
  landingWorking = landingClone(landingEffectiveLive());
  try { await deleteDoc(doc(db, 'settings', 'landingContentDraft')); } catch (e) { console.error(e); }
  renderMain();
};

    <button class="act-btn tiny" ${!dirty ? 'disabled style="opacity:.4;cursor:default"' : ''} onclick="discardLandingChanges()">ביטול השינויים</button>
    ${landingPublishing
      ? `<button class="slot-btn primary" disabled style="cursor:progress">מפרסם…</button>`
      : !dirty
        /* ── §328 — "הכפתור תקוע ומופיע עיגול אדום עם פס" ────────────────────────────────
           זה **לא** היה תקיעה: אחרי פרסום מוצלח אין יותר שינויים, הכפתור מקבל disabled,
           ו-`.slot-btn[disabled] { cursor: not-allowed }` מצייר את סמן ה-🚫. אבל התווית
           נשארה "פרסום לאתר" — כלומר כפתור פעיל למראה שמסרב להילחץ, וזה נקרא בדיוק כמו
           תקלה. עכשיו התווית אומרת מה קורה, והסמן הוא default ולא "אסור".
           (הכפתור השכן "ביטול השינויים" כבר עשה בדיוק את זה — רק כאן זה נשכח.)
           ⚠️ גבול-הזמן של §327 מטפל בתקיעה **אמיתית** ברשת. שני דברים נפרדים שנראו זהים. */
        ? `<button class="slot-btn primary" disabled style="opacity:.45;cursor:default" title="אין שינויים שממתינים לפרסום">✓ הכל מפורסם</button>`

}

function landingTilesPreviewHtml() {
  const w = landingWorking;

  const basis = `calc(${100 / n}% - ${(n - 1) * gap / n}px)`;
  return w.tiles.map((t, i) => {
    const imgTag = landingTileUploading[i]
      ? `<div class="lct-tile-uploading">מעלה תמונה…</div>`

    return `
      <div class="lct-tile" style="flex:1 1 ${basis};aspect-ratio:${LANDING_SIZE_RATIO[w.tileSize]}">
        ${imgTag}
        <div class="lct-tile-overlay"></div>

          <div class="lct-tile-title" contenteditable="true" data-placeholder="כותרת..." oninput="onLandingTileTextEdit(${i},'title',this)">${esc(t.title)}</div>

// תצוגה קריאה-בלבד (לא טופס-עריכה) של כל מה שהעסק הזין בהרשמה, מקובצת ל-6 סעיפים בדיוק כמו
// 5 השלבים החדשים של business.html + "סיכום ושליחה" — לא ממציא שדות: כל השדות כאן כבר בשימוש

// "רק שדות חסרים" — CSS-בלבד (data-empty + class .only-missing), בלי re-render. "הורדה כ-PDF" —
// window.print() עם print-stylesheet (ר' .form-summary-toolbar/.no-print בהמשך), לא ספריית-PDF חדשה.
// ══════════════════════════════════════════════════════════════════
function bizFormSummaryHtml(b) {
  const catMeta = CATEGORIES.find(c => c.key === b.catKey);
  const types = b.bizTypes || [];
  const typeLabels = types.map(t => BIZ_TYPE_LABELS_MOCK[t]).filter(Boolean).join(' · ') || '';
  const field = (label, value, empty, full) => `
    <div class="form-field${full ? ' full' : ''}" data-empty="${!!empty}">
      <div class="form-field-label">${label}</div>
      <div class="form-field-val${empty ? ' empty' : ''}">${empty ? 'לא מולא' : esc(String(value))}</div>
    </div>`;
  // זהה ל-field, אבל הערך הוא HTML שכבר נבנה בטוח במקום אחר (שעות הפעילות — ר' adminHoursHtml).
  const fieldHtml = (label, html, full) => `
    <div class="form-field${full ? ' full' : ''}" data-empty="${!html}">
      <div class="form-field-label">${label}</div>
      <div class="form-field-val${html ? '' : ' empty'}">${html || 'לא מולא'}</div>
    </div>`;
  const websiteVal = b.website;
  const allDiscounts = [{ text: b.discountFullText, redeemMode: b.discountRedeemMode, code: b.discountCode }]
    .concat(b.additionalDiscounts || []).filter(d => d && d.text);
  const discountsHtml = allDiscounts.length ? allDiscounts.map((d, i) => `
    <div class="form-discount-box">
      <div class="form-discount-tags">
        <span class="form-discount-tag${i===0?' primary':''}">${i===0?'ראשית · על הכרטיס':'בגיליון הפנימי'}</span>
        <span class="form-discount-meta">${toRedeemArr(d.redeemMode).map(t=>REDEEM_MODE_LABELS_MOCK[t]||t).join(', ')}${d.code?' · קוד '+esc(d.code):''}</span>
      </div>
      <div class="form-discount-text">${esc(d.text)}</div>
    </div>`).join('') : `<div class="placeholder-note">אין הטבה מוגדרת</div>`;
  const branchesHtml = (b.branches && b.branches.length)
    ? `<div class="form-field full" data-empty="false"><div class="form-field-label">סניפים · ${b.branches.length}</div><div class="form-field-val">${b.branches.map(br=>esc([br.city,br.address].filter(Boolean).join(' · '))).join('<br>')}</div></div>` : '';
  const regionsHtml = (b.regions && b.regions.length)
    ? `<div class="form-field full" data-empty="false"><div class="form-field-label">אזורי פעילות</div><div class="form-field-val">${esc(b.regions.join(', '))}</div></div>` : '';
  return `
    <div class="form-summary">
      <div class="form-summary-toolbar no-print">
        <div class="form-summary-note">הטופס כפי שנשלח ב-${fmtDate(b.registeredAt)} · לחיצה על "ביקורת ואישור" פותחת לעריכה</div>
        <label class="form-summary-check"><input type="checkbox" onchange="document.getElementById('formSummary_${b.id}').classList.toggle('only-missing', this.checked)"> רק שדות חסרים</label>
        <button class="qj-btn" onclick="window.print()">הורדה כ-PDF</button>
      </div>
      <div class="form-summary-body" id="formSummary_${b.id}">
        <div class="form-sec-title">שלב 1 · העסק · קטגוריה ותגיות</div>
        <div class="form-grid">
          ${field('קטגוריה', catMeta?catMeta.label:'', !catMeta)}
          ${field('תגית ראשית', (b.tags&&b.tags[0])||'', !(b.tags&&b.tags[0]))}
          ${field('תגית שנייה', (b.tags&&b.tags[1])||'', !(b.tags&&b.tags[1]))}
          ${b.tagSuggestion ? field('תגית שהוצעה', b.tagSuggestion+' · ממתין', false) : ''}
          ${(b.alsoCategorySuggestion && b.alsoCategorySuggestion !== b.alsoUnderCategory) ? field('קטגוריה נוספת', ((CATEGORIES.find(c=>c.key===b.alsoCategorySuggestion))||{}).label+' · ממתין', false) : ''}
        </div>

        <div class="form-sec-title">שלב 2 · פרטים ויצירת קשר</div>
        <div class="form-grid">
          ${field('סוג מכירה', typeLabels, !types.length)}
          ${field('שם העסק', b.name, !b.name)}
          ${field('טלפון העסק', b.phone, !b.phone)}
          ${field('וואטסאפ', b.whatsapp, !b.whatsapp)}
          ${field('מייל שירות', b.serviceEmail, !b.serviceEmail)}
          ${field('אתר', websiteVal, !websiteVal)}
          ${field('תיאור', b.descriptionText, !b.descriptionText, true)}
          ${branchesHtml}
          ${regionsHtml}
          ${fieldHtml('שעות פעילות', adminHoursHtml(b) + hoursIssuesHtml(b) + hoursMigrationStatusHtml(b), true)}
          ${field('אינסטגרם', b.instagram, !b.instagram)}
          ${field('פייסבוק', b.facebook, !b.facebook)}
        </div>

        <div class="form-sec-title">שלב 3 · הטבות${allDiscounts.length>1?` · ${allDiscounts.length} מתוך ${allDiscounts.length}`:''}</div>
        <div class="form-discounts">${discountsHtml}</div>

        <div class="form-sec-title">שלב 4 · תמונות</div>
        <div class="form-grid">
          ${field('תמונה מייצגת', b.coverPhoto?'הועלתה':'', !b.coverPhoto)}
          ${field('לוגו', b.logo?'הועלה':'', !b.logo)}
          ${field('גלריה', (b.photos&&b.photos.length)?`${b.photos.length} תמונות`:'', !(b.photos&&b.photos.length))}
        </div>

        <div class="form-sec-title">שלב 5 · אימות בעל העסק</div>
        <div class="form-grid">
          ${field('שם מלא', [b.ownerFirst,b.ownerLast].filter(Boolean).join(' '), !(b.ownerFirst||b.ownerLast))}
          ${field('טלפון', b.ownerPhone, !b.ownerPhone)}
          ${field('אימייל', b.ownerEmail, !b.ownerEmail)}
          ${field('קרבה לבעל המנוי', RELATION_LABELS_MOCK[b.ownerRelation]||b.ownerRelation||'', !b.ownerRelation)}
          ${field('מנוי מכבי', b.ownerIsSubscriber?'כן':'לא · אימות ידני', false)}
          ${field(sectionLabelFor(b.ownerVerifiedSport) + ' / מספר מנוי', b.ownerIsSubscriber?[sectionWithTier(b.ownerSubscriberSection, b.ownerSubscriberTier),b.ownerSubscriberNumber].filter(Boolean).join(' / '):'', !b.ownerIsSubscriber)}
        </div>

        <div class="form-sec-title">סיכום ושליחה</div>
        <div class="form-grid">
          ${field('הודעה שהעסק כתב לצוות', b.note, !b.note, true)}
          ${field('תקנון', b.agreedTermsAt?`אושר · ${fmtDate(b.agreedTermsAt)}`:'', !b.agreedTermsAt)}
        </div>
      </div>
    </div>`;
}

function bizFullDetailHtml(id, opts) {
  const b = findBiz(id);
  if (!b) return `<div class="placeholder-note">עסק לא נמצא</div>`;
  const o = Object.assign({ backFn: 'bizBackToList' }, opts || {});
  initEditTagsState(id); // מכין את בורר התגיות של שלב 3 מראש, כי הוא מרונדר תמיד (גם אם מוסתר)

  // קוד כניסה — זהה למה שנוסף היום ב-admin-businesses.html. לינק-דשבורד וסטטוס-המייל עברו
  // לתצוגה ישירה בכרטיס-הזהות למטה (idDashBtn/idEmailNote) — לא chip-ים נפרדים יותר.
  // (התקנון עבר משם הלאה לכרטיס האימות, §299.)
  if (ownerLoginCodeCache[b.id] === undefined) fetchOwnerLoginCode(b);
  const ownerLoginCode = ownerLoginCodeCache[b.id];

  const catMeta = CATEGORIES.find(c => c.key === b.catKey);
  // תגית שנייה וקטגוריה שנייה ("מופיע גם תחת") — שתיהן עוברות אישור מנהל ייעודי. האישור/דחייה עצמם
  // מוצגים היום בכרטיס-שיפוט-מהיר (quickJudgmentHtml, §130) — לא בתצוגה נפרדת כאן, כדי לא לכפול פעולה.
  const alsoCatSuggestionMeta = (b.alsoCategorySuggestion && b.alsoCategorySuggestion !== b.alsoUnderCategory)
    ? CATEGORIES.find(c => c.key === b.alsoCategorySuggestion) : null;
  // הצעת תגית חדשה חופשית (tagSuggestion) — נפרד לגמרי מ-tagSecondSuggestion (זו הצעה לתגית שלא קיימת
  // בכלל ברשימה הנעולה, לא בחירה בין תגיות קיימות). מוצג באותו דפוס תיבת-התרעה + פעולות ישירות מהכרטיס.
  const tagFreeSuggestionMapOpen = tagQueueMapping === b.id;
  const tagFreeSuggestionCatPicking = tagQueueNewCatPicking === b.id;
  const tagFreeSuggestionPool = TAGS_BY_CATEGORY_MOCK[b.catKey] || [];
  const tagFreeSuggestionCatOptions = CATEGORIES.map(c => `<option value="${c.key}" ${b.catKey===c.key?'selected':''}>${c.icon} ${c.label}${b.catKey===c.key?' (הקטגוריה של העסק)':''}</option>`).join('');
  const tagFreeSuggestionEditingOpen = tagSuggestionEditing === b.id;
  const tagFreeSuggestionHtml = b.tagSuggestion
    ? `<div class="tag-suggestion-alert">${tagFreeSuggestionEditingOpen ? `
        🆕 העסק הציע תגית חדשה:
        <div class="tagmgmt-inline-form" style="margin-top:6px">
          <input type="text" id="tagSuggestionEditInput_${b.id}" value="${esc(b.tagSuggestion)}" maxlength="40" style="flex:1">
          <button class="act-btn approve tiny" onclick="saveTagSuggestionEdit('${b.id}')">💾 שמור</button>
          <button class="act-btn tiny" onclick="cancelTagSuggestionEdit()">ביטול</button>
        </div>` : `
        🆕 העסק הציע תגית חדשה: "${b.tagSuggestion}"
        <button class="act-btn tiny" onclick="startTagSuggestionEdit('${b.id}')">✏️ ערוך</button>
        ${tagFreeSuggestionMapOpen ? `
        <div class="tagmgmt-inline-form" style="margin-top:6px">
          <select id="tagQueueMapSelect_${b.id}">
            ${tagFreeSuggestionPool.map(t => `<option value="${t.replace(/"/g,'&quot;')}">${t}</option>`).join('')}
          </select>
          <button class="act-btn approve tiny" onclick="confirmMapTagSuggestion('${b.id}')">אישור מיפוי</button>
          <button class="act-btn tiny" onclick="cancelMapTagSuggestion()">ביטול</button>
        </div>` : tagFreeSuggestionCatPicking ? `
        <div class="tagmgmt-inline-form" style="margin-top:6px">
          <span style="font-size:11px;color:var(--text-sm)">תחת איזו קטגוריה?</span>
          <select id="tagNewCatSelect_${b.id}">${tagFreeSuggestionCatOptions}</select>
          <button class="act-btn approve tiny" onclick="confirmApproveTagSuggestionNewCat('${b.id}')">✅ הוסף ואשר</button>

  // בכלל — המשתמש אישר בפועל שזה תוכן-אמיתי-נדרש, לא לזרוק. הועבר לטאב "החלטות ויומן"
  // (bizDecisionPanelHtml) — בדיוק אותו עיקרון כמו "הסרה מהאינדקס"/יומן-פעילות שכבר יושבים שם:
  // מידע-ניהולי שלא בעיצוב "פרטי העסק" עצמו, לא תוכן שנעלם.
  const mainTabHtml = `
    ${quickJudgmentHtml(b)}
    ${identityCardHtml}
    ${anchorCardHtml}
    ${ownerVerifStepHtml}
    ${stepsCardHtml}`;
  return `
    <button class="act-btn task-back-btn" onclick="${o.backFn}()">→ חזרה</button>
    <div class="action-tabs">
      <button class="action-tab ${bizDetailViewTab==='main'?'active':''}" onclick="setBizDetailTab('main')">פרטי העסק</button>
      <button class="action-tab ${bizDetailViewTab==='decisions'?'active':''}" onclick="setBizDetailTab('decisions')">החלטות ויומן</button>
    </div>
    ${bizDetailViewTab === 'decisions' ? bizDecisionPanelHtml(b) : mainTabHtml}`;
}

// ── רכיב השעות המובנה בטופס העריכה של המנהל (2026-08-20, §230) ─────────────────────────────
// אותו רכיב בדיוק שבעל-העסק רואה (hours.js), עם הבדל אחד: **בלי הערת "עובר אישור הצוות"** —
// כאן המנהל הוא הצוות, ומה שהוא כותב נכנס ישירות.
// ממופה לפי id כי כמה כרטיסי-עסק יכולים להיות פתוחים בו-זמנית (אותה סיבה שבגללה openBizIds
// הוא Set ולא boolean יחיד).
const hoursEditors = {};

// תצוגת שעות במסכי הניהול — מעדיפה את המבנה, נופלת ל-hoursText הישן, ומגנה על כיוון
// טווחי-השעות ב-RTL (ר' hours.js). fail-open אם המודול לא נטען.
function adminHoursHtml(b) {
  if (!b) return '';
  if (window.HB_HOURS) return HB_HOURS.toHtml({ ...b, hours: b.hoursText });
  return esc(b.hoursText || '');
}

// ── מצב מיגרציית השעות לעסק הזה (§230) ─────────────────────────────────────────────────────
// בקשת המשתמש: "תסמן את זה כטופל ותציג לי מהיום שפתח את זה וראה את ההודעה".
// שלושה מצבים, ובכל אחד התאריך שרלוונטי לו בפועל:
//   טופל          — מתי ועל ידי מי (אני / בעל העסק)
//   ראה ולא טיפל  — מתי ראה, וכמה ימים עברו מאז
//   טרם ראה       — עוד לא נכנס לדשבורד מאז שהקובייה עלתה
// מוצג רק כשיש מה להציג: עסק שאין לו שעות **ואינו פיזי** לא מקבל קובייה בכלל, ולכן גם כאן שקט.
function hoursMigrationStatusHtml(b) {
  if (!b) return '';
  const isPhysical = (b.bizTypes || []).includes('physical');
  if (!b.hoursText && !b.hoursMode && !isPhysical) return '';

  const d = v => (v && v.toDate ? v.toDate() : (v ? new Date(v) : null));
  const done = d(b.hoursMigrationDone);
  const seen = d(b.hoursNoticeFirstSeen);
  const days = t => Math.floor((Date.now() - t.getTime()) / 86400000);

  if (done) {
    const who = b.hoursMigrationBy === 'admin' ? 'על ידך' : 'על ידי בעל העסק';
    return `<div class="hrs-status ok">✓ שעות הפעילות טופלו — ${fmtDateTime(b.hoursMigrationDone)} ${who}</div>`;
  }
  if (seen) {
    const n = days(seen);
    // אחרי שבוע בלי טיפול זה כבר לא "ראה לפני יומיים" — מודגש, כי זה מה שמחכה לך לסגור
    return `<div class="hrs-status ${n >= 7 ? 'warn' : ''}">👁 ראה את הודעת השעות ${fmtDateTime(b.hoursNoticeFirstSeen)}${n >= 1 ? ` (לפני ${n} ימים)` : ' (היום)'} — עדיין לא טיפל</div>`;
  }
  return '<div class="hrs-status">⏳ טרם נכנס לדשבורד מאז שהודעת השעות עלתה</div>';
}

// שורת-הסיבות מתחת לשעות בכרטיס — כך שכשקופצים לעסק מהקובייה רואים מיד **למה** הוא שם.
function hoursIssuesHtml(b) {
  const is = hoursIssues(b);
  return is.length ? `<div class="hrs-status warn">⚠️ ${is.map(esc).join(' · ')}</div>` : '';
}

function mountAdminHoursEditor(id) {
  const b = findBiz(id);
  const box = document.getElementById('edit_hoursBox_' + id);
  delete hoursEditors[id];
  if (!b || !box) return;
  if (!window.HB_HOURS) {          // fail-open — כשל בטעינת קובץ סטטי לא יחסום עריכה
    console.warn('hours.js לא נטען — שעות הפעילות נערכות כטקסט חופשי');
    box.innerHTML = `<input type="text" id="edit_hours_${id}" value="${esc(b.hoursText || '')}" placeholder="למשל: א-ה 9:00-19:00">`;
    return;
  }
  // hoursText הוא השם שבו hydrateBiz שומר את hours הגולמי — הרכיב מצפה ל-hours.
  hoursEditors[id] = HB_HOURS.mountEditor(box, { ...b, hours: b.hoursText }, { approvalNote: false });
}

// ── עריכה per-שלב: toggle ישיר של show/hide (בלי רינדור-מחדש), זהה בהיגיון ל-toggleSecEdit ב-admin-businesses.html ──
window.toggleBizSecEdit = function(id, n) {
  const view = document.getElementById('secView'+n+'_'+id);
  const edit = document.getElementById('secEdit'+n+'_'+id);
  const stepBlock = document.getElementById('stepBlock'+n+'_'+id); // קיים רק לשלבים שכבר הומרו לסגנון step-block (§131) — null-safe לשאר
  if (!edit) return;
  const opening = !edit.classList.contains('open');
  if (stepBlock) {
    stepBlock.classList.toggle('open', opening);
    const editBtn = document.getElementById('stepEditBtn'+n+'_'+id);
    if (editBtn) {
      editBtn.textContent = opening ? 'סגירה' : 'עריכה';
      editBtn.className = opening ? 'btn-step-close' : 'btn-step-edit';
    }
  }
  // שלב 3 (תגיות) תלוי ב-state גלובלי (editSelectedTags) שיכול "להידבק" מעריכה קודמת שבוטלה בלי שמירה —
  // מאתחלים ומרנדרים מחדש בכל טוגל (פתיחה וגם סגירה) כדי שיהיה תמיד עקבי עם b.tags/b.tagSecondSuggestion בפועל.
  if (n === 3) {
    initEditTagsState(id);
    rerenderEditTagsArea(id);
  }
  // שלב 2 מחזיק את רכיב השעות. נבנה מחדש בכל פתיחה מאותה סיבה בדיוק כמו שלב 3: עריכה
  // קודמת שנסגרה בלי שמירה הייתה "נדבקת" ומוצגת כאילו היא המצב החי.
  if (n === 2 && opening) mountAdminHoursEditor(id);
  edit.classList.toggle('open', opening);
  if (view) view.style.display = opening ? 'none' : '';
  // §258 — כל פתיחה/סגירה ידנית מעדכנת את ה-state, כדי שבנייה-מחדש תשחזר בדיוק את מה שהמנהל
  // השאיר פתוח. restoreOpenBizSteps קוראת לפונקציה הזו בעצמה, ולכן ה-add כאן אידמפוטנטי.
  if (opening) openBizSteps.add(id + ':' + n); else openBizSteps.delete(id + ':' + n);
};

// ── גרירת קבצים לאזור ההעלאה (2026-08-19) ───────────────────────────────────────────────────
// המחלקה .media-drop.drag-over הייתה מוגדרת ב-CSS מזמן בלי ששום קוד יפעיל אותה — פיצ'ר שתוכנן
// ולא הושלם. כאן הוא נסגר: אותן שלוש פונקציות העלאה, רק שהקבצים מגיעים מ-dataTransfer.
// מסננים ל-image/* בלבד כדי שגרירת PDF/וידאו בטעות לא תיפול על השרת עם קובץ שאי אפשר לדחוס.
window.mediaDragOver = function(e, el) { e.preventDefault(); el.classList.add('drag-over'); };
window.mediaDragLeave = function(el) { el.classList.remove('drag-over'); };
window.mediaDrop = function(e, el, id, kind) {
  e.preventDefault();
  el.classList.remove('drag-over');
  const files = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith('image/'));
  if (!files.length) { alert('אפשר לגרור לכאן קבצי תמונה בלבד'); return; }
  if (kind === 'logo') uploadBizLogo(id, files);
  else if (kind === 'cover') uploadBizCover(id, files);
  else uploadBizGalleryPhoto(id, files);
};

// פותח מחדש שלב שנסגר ע"י renderMain אחרי שמירה (ר' opts.reopenStep ב-saveSectionUpdates).
// toggleBizSecEdit הוא **טוגל** — קוראים לו רק כשהשלב באמת סגור, אחרת היינו סוגרים אותו בדיוק
// במקרה שבו רצינו להשאיר אותו פתוח.
window.reopenBizSecEdit = function(id, n) {
  const edit = document.getElementById('secEdit' + n + '_' + id);
  if (edit && !edit.classList.contains('open')) toggleBizSecEdit(id, n);
};

// ── סימון "נסקר" לכל שלב — בקרה ידנית של המנהל על עסק pending לפני אישור, לא קשור לבריאות פרופיל ──
// סימון "נסקר" — עכשיו שדה אמיתי (businesses/{id}.reviewedSections, מפה {1:bool,...}) — נכתב מיד בכל טוגל
window.toggleSecReviewed = async function(id, n, checked) {
  const b = findBiz(id);
  if (!b) return;
  const reviewedSections = { ...(b.reviewedSections || {}), [n]: checked };
  await saveSectionUpdates(id, { reviewedSections });
};

// זהה ל-saveSectionUpdates ב-admin-businesses.html — כותב Firestore אמיתי (רק שדות אמיתיים, לא שדות
// תאימות-תצוגה כמו hoursText/catKey/isOnline). מעדכן את המטמון המקומי מיידית דרך hydrateBiz מחדש —
// כך שדות התצוגה הנגזרים מתעדכנים באותה לוגיקה בדיוק כמו בטעינה הראשונית, בלי לכתוב אותם ל-Firestore.
// שדות-עזר טכניים (timestamps נלווים) — לא "שינוי" בפני עצמו בעיני המנהל, מדולגים ביומן.
// reviewedSections — סימון "נסקר" פר-שלב (toggleSecReviewed) הוא בדיקת-עצמי שקטה של המנהל, לא "שינוי"
// שמישהו אחר צריך לדעת עליו — לחיצה על הצ'קבוקס בכל שלב הייתה יוצרת רעש ביומן (המשתמש: "אני לא בטוח
// שזה חשוב"), בלי גם ערך קריא (אובייקט, לא מחרוזת). מדולג בכוונה.
// שדות-לוויין שלא נרשמים ביומן בנפרד — הם נלווים לשדה ראשי שכן נרשם, ורישום שלהם היה הופך
// שורת-יומן קריאה ("נערך: שעות פעילות") לרשימה טכנית עם מערך של 7 אובייקטים בתוכה.
const SAVE_LOG_SKIP_FIELDS = new Set(['noteAt', 'noteHandledAt', 'noteOwnerAckAt', 'pendingChangesAt', 'reviewedSections',
  'hoursMode', 'hoursDays', 'hoursOther', 'hoursMigrationDone', 'hoursMigrationBy']);
function fmtActivityVal(v) {
  if (v == null || v === '') return '—';
  if (Array.isArray(v)) return v.length ? v.join(', ') : '—';
  if (typeof v === 'object') return v.toDate ? fmtDate(v.toDate()) : (v instanceof Date ? fmtDate(v) : '(אובייקט)');
  return String(v);
}
// 🐛 4 ניסיונות קודמים לתקן קפיצת-גלילה ע"י *שחזור* המיקום אחרי renderMain() נכשלו בפועל (scrollY
// גולמי / עוגן-לקצה-הפאנל / drawer.scrollTop / עוגן-לאלמנט-ספציפי) — כולם ניסו לתקן תוצאה של הרס,
// לא את ההרס עצמו. renderMain() תמיד בונה מחדש innerHTML *שלם* של #tabContent — כולל .task-drawer
// (שיש לו overflow-y:auto, גלילה-פנימית) או bizDetailCol/fanDetailCol עצמם, כלומר ה-container הגלילי
// *נהרס ונבנה מחדש בכל שמירה* — אין לדפדפן שום "זיכרון" scrollTop לשמר על אלמנט שכבר לא קיים, וכל
// ניסיון-שחזור הוא מרוץ-תזמון (requestAnimationFrame מול layout/paint) שלא אמין ב-100% מהמקרים.
// הפתרון האמיתי: לא להרוס את ה-container הגלילי בכלל. refreshOpenDetailPanel() מעדכן ישירות רק את
// ה-innerHTML *של מה שבתוך* הפאנל הפתוח (.task-drawer-body / bizDetailCol / fanDetailCol עצמם) —
// ה-container שיש לו overflow/scrollTop נשאר אותו אלמנט DOM בדיוק, אז אין בכלל "קפיצה" לתקן.
// blur() מפורש לפני ההחלפה — מניע אפשרי-נוסף (אלמנט ממוקד שנהרס יכול לגרור גלילה-לתצוגה
// בחלק מהדפדפנים) — לא אומת כשורש-הבעיה בפועל (השורש האמיתי היה onSnapshot נפרד, ר' renderAllPreserveScroll
// למטה), אבל נשאר כהגנה זולה ובטוחה.
//
// 🐛 §254 — הבלור הזה היה **גורף** (`document.activeElement.blur()` על כל אלמנט ממוקד בעמוד), וזה
// היה שורש הבאג "החיפוש נעצר אחרי האות הראשונה": ב"כל העסקים" הקלדת אות אחת → refreshBizList →
// העסק שהיה מסומן כבר לא ברשימה המסוננת → הפאנל מצויר מחדש → bizFullDetailHtml יורה
// fetchOwnerLoginCode (קריאה אסינכרונית לשרת) → כשהיא חוזרת היא קוראת ל-refreshOpenDetailPanel →
// blur() הרג את הפוקוס בשדה-החיפוש, שנמצא בכלל **מחוץ** לפאנל שהוחלף. האותיות הבאות פשוט לא
// נכנסו לשום מקום, והמנהל היה צריך ללחוץ שוב על השדה. עכשיו מבליירים רק אם האלמנט הממוקד באמת
// יושב בתוך ה-container שעומד להימחק.
function blurIfInside(container) {
  const a = document.activeElement;
  if (a && a !== document.body && container.contains(a)) a.blur();
}
// ── §258 — "אחרי כל הזזת תמונה זה סוגר את החלון" ─────────────────────────────────────────────
// השלב הפתוח (secEditN_id.open) היה **מצב-DOM בלבד**, ולכן כל בנייה-מחדש של הכרטיס איבדה אותו.
// saveSectionUpdates פתר את זה לעצמו עם opts.reopenStep — אבל refreshOpenDetailPanel נקראת
// משלושה מקומות, ורק אחד מהם הוא נתיב-השמירה שלנו:
//   · fetchOwnerLoginCode (חזרה אסינכרונית מהשרת)
//   · renderMainPreserveScroll — נתיב השמירה, ורק הוא קרא ל-reopenBizSecEdit אחריו
//   · renderAllPreserveScroll — ה-**onSnapshot הגלובלי**, שרץ עצמאית על כל שינוי מסמך
// ה-onSnapshot מופעל גם ע"י הכתיבה-העצמית-של-המנהל, והתזמון שלו לא מובטח: כשהוא נוחת *אחרי*
// ה-reopen שלנו, הוא בונה את הכרטיס מחדש במצב-תצוגה והשלב נסגר — בדיוק מה שדווח.
// התיקון: הסט הזה הוא מקור-האמת, ו-restoreOpenBizSteps() רץ בסוף **כל** בנייה-מחדש. מכאן זה
// לא משנה איזה נתיב ניצח את המרוץ.
const openBizSteps = new Set(); // "bizId:n"
function restoreOpenBizSteps() {
  openBizSteps.forEach(key => {
    const [id, num] = key.split(':');
    const edit = document.getElementById('secEdit' + num + '_' + id);
    if (edit && !edit.classList.contains('open')) toggleBizSecEdit(id, Number(num));
  });
}

function refreshOpenDetailPanel() {
  const drawerBody = document.querySelector('.task-drawer-body');
  if (drawerBody && typeof selectedTaskKey !== 'undefined' && selectedTaskKey) {
    blurIfInside(drawerBody);
    drawerBody.innerHTML = taskDetailHtml2(selectedTaskKey);
    restoreOpenBizSteps();
    return true;
  }
  const bizCol = document.getElementById('bizDetailCol');
  if (bizCol && typeof selectedBizDetailId !== 'undefined' && selectedBizDetailId) {
    blurIfInside(bizCol);
    bizCol.innerHTML = bizFullDetailHtml(selectedBizDetailId);
    restoreOpenBizSteps();
    return true;
  }
  const fanCol = document.getElementById('fanDetailCol');
  if (fanCol && typeof selectedFanDetailId !== 'undefined' && selectedFanDetailId) {
    blurIfInside(fanCol);
    fanCol.innerHTML = fanFullDetailHtml(selectedFanDetailId);
    return true;
  }
  return false; // אף פאנל-פרטים פתוח — נופל ל-renderMain() מלא, בטוח בכל הקשר אחר
}
function renderMainPreserveScroll() {
  if (!refreshOpenDetailPanel()) renderMain();
}

// ── opts.reopenStep (2026-08-19) ────────────────────────────────────────────────────────────
// renderMainPreserveScroll בסוף הפונקציה בונה מחדש את כל כרטיס-העסק **במצב-תצוגה** — כלומר כל
// שמירה בודדת סוגרת למנהל את הטופס שהוא עומד באמצעו. בשלב המדיה זה כאב אמיתי שדווח בפועל
// ("לא נוח ולא יעיל, אני לא משתמש בזה כמעט"): כל העלאת תמונה דרשה לפתוח את השלב מחדש.
// opts הוא אופציונלי לגמרי — 15 הקריאות האחרות בקובץ לא מעבירות אותו ומתנהגות בדיוק כמו קודם.
async function saveSectionUpdates(id, updates, opts) {
  const b = findBiz(id);
  const beforeVals = {};
  if (b) Object.keys(updates).forEach(k => { beforeVals[k] = b[k]; });
  // ── כל שדה שהמנהל כותב כאן ידנית מבטל בקשה ממתינה על אותו שדה בדיוק (2026-08-16).
  // הבאג האמיתי שזה סוגר ("גולדה אירועים"): בעל-העסק שינה הטבה → discountText (הכותרת הקצרה שנגזרת
  // אוטומטית) נכנס ל-pendingChanges. discountText נמצא ב-DIFF_FIELD_EXCLUDE, כלומר אין לו שורה
  // לאישור/דחייה בשום מקום — אבל hydrateBiz *כן* מציג אותו בשדה "הכותרת שתופיע על הכרטיס".
  // התוצאה: כותרת שהמנהל רואה, לא מצליח לשנות (כל שמירה נדרסה חזרה ע"י הערך הממתין), ושאינה
  // מה שמופיע בפועל באינדקס (שם מוצג raw.discountText). בנוסף, שארית כזו החזיקה את העסק תקוע
  // ברשימת "בקשות מבעלי עסקים" בלי שום פריט להכריע בו.
  const leftoverPending = b && b.pendingChanges ? { ...b.pendingChanges } : null;
  const pendingPatch = {};
  if (leftoverPending) {
    let touched = false;
    Object.keys(updates).forEach(k => { if (k in leftoverPending) { delete leftoverPending[k]; touched = true; } });
    if (touched) {
      // prunedPending — אם נשארו רק שאריות טכניות (לא מוצגות בשום מקום) הבקשה נסגרת כאן
      const kept = prunedPending({ ...b, ...updates }, leftoverPending);
      pendingPatch.pendingChanges = kept;
      if (!kept) pendingPatch.pendingChangesAt = null;
    }
  }
  showSaving('שומר...');
  try {
    await updateDoc(doc(db, 'businesses', id), { ...updates, ...pendingPatch });
    if (b) {
      Object.assign(b, updates, pendingPatch);
      Object.assign(b, hydrateBiz(id, b));
    }
    // 16 קריאות ל-saveSectionUpdates בקובץ (סעיפים 1-5, סימון-הערה-כטופלה, עריכת-תגית-מוצעת ועוד) —
    // מקום אחד מרכזי לרשום ביומן "מה נערך", בלי לגעת בכל קריאה בנפרד. ר' §1 במפרט.
    const fields = Object.keys(updates).filter(k => !SAVE_LOG_SKIP_FIELDS.has(k));
    if (fields.length) {
      const summary = fields.map(k => DIFF_FIELD_LABELS_MOCK[k] || k).join(', ');
      logActivity('businesses', id, {
        type: 'adminEdit', title: `נערך: ${summary}`,
        detail: fields.map(k => `${DIFF_FIELD_LABELS_MOCK[k] || k}: "${fmtActivityVal(beforeVals[k])}" → "${fmtActivityVal(updates[k])}"`).join(' · '),
        field: fields[0], before: beforeVals[fields[0]] ?? null, after: updates[fields[0]] ?? null,
      });
    }
    hideSaving(true);
    renderMainPreserveScroll();
    if (opts && opts.reopenStep) reopenBizSecEdit(id, opts.reopenStep);
  } catch (e) { console.error(e); hideSaving(false); alert('שגיאה בשמירה: ' + e.message); }
}
