// המסמך, כדי שהיומן יגדל בלי הגבלה). קריטי: כל פעולת-ניהול (אישור/דחייה/עריכה/החלטת-תגית/עיגון/
// דגל-סקשן/לבבות/מייל/הערה) חייבת לקרוא לזה — בלעדיה התיעוד יוצא חלקי (ר' מפרט העברה §1).
// כשל בכתיבת היומן לא אמור לחסום את הפעולה העסקית עצמה (הכתיבה האמיתית כבר הצליחה) — רק נרשם ל-console.
async function logActivity(collectionName, entityId, entry) {
  try {
    await addDoc(collection(db, collectionName, entityId, 'activity'), {
      type: entry.type,
      title: entry.title || '',
      detail: entry.detail || '',
      field: entry.field ?? null,
      before: entry.before ?? null,
      after: entry.after ?? null,
      actorUid: CURRENT_ADMIN.uid,
      actorName: CURRENT_ADMIN.name,
      source: entry.source || 'admin',
      createdAt: serverTimestamp(),
    });
  } catch (e) { console.error('logActivity failed:', e); }
}

window.saveBizSec1 = async function(id) {
  const b = findBiz(id);
  if (!b) return;
  const isSub = document.getElementById('edit_ownerIsSub_'+id).value === 'yes';
  const updates = {
    ownerFirst: document.getElementById('edit_ownerFirst_'+id).value.trim(),
    ownerLast:  document.getElementById('edit_ownerLast_'+id).value.trim(),
    ownerPhone: document.getElementById('edit_ownerPhone_'+id).value.trim(),
    // toLowerCase — הכתובת היא מפתח-התאמה ל-webhook המסירה ולבדיקת-הכפילות (ר' §221)
    ownerEmail: document.getElementById('edit_ownerEmail_'+id).value.trim().toLowerCase(),
    // אימות "אוהד מכבי" של בעל העסק — נשמר רק לפי הנתיב שנבחר בפועל (מנוי/לא מנוי), כמו בהרשמה האמיתית —
    // אין "היה מנוי בעבר" (שדה שלא קיים בהרשמת בעל עסק, ר' business.html) ואין ערך-צל מהנתיב הלא-נבחר.
    isSubscriber: isSub ? 'yes' : 'no',
    verifiedSport: isSub ? document.getElementById('edit_ownerSport_'+id).value : null,
    gate:   isSub ? (document.getElementById('edit_ownerSection_'+id).value.trim() || null) : null,
    tier:   isSub ? (document.getElementById('edit_ownerTier_'+id).value || null) : null, // §319
    subNum: isSub ? (document.getElementById('edit_ownerNumber_'+id).value.trim() || null) : null,
    fbUrl:  document.getElementById('edit_ownerFbUrl_'+id).value.trim(), // §321 — ר' ההערה בצד האוהד
    // ── §382 — שני תיקונים בשורה אחת ─────────────────────────────────────────────────────
    // 1. **הכתובת יורדת מהמסמך הציבורי.** `''` נכתב במפורש ולא מושמט: זו גם המיגרציה עצמה —
    //    פתיחה ושמירה של עסק ותיק מנקה את השדה החשוף. הערך האמיתי נכתב ל-bizProofs למטה.
    // 2. ⚠️ **`isSub ? '' : …` היה מוחק ראיית-אימות של כל בעל-עסק שהוא מנוי, בכל שמירה.**
    //    התנאי נכתב כשמנוי לא נדרש לתמונה — ומאז §284/§294 שלושה מסלולים פתוחים גם למנויים
    //    ודורשים קובץ. כלומר שמירה שגרתית של המנהל מחקה ראיה קיימת, בלי סימן ובלי שגיאה.
    //    בדיוק הדפוס של "תנאי בשמירה מחק נתונים בשקט" (§321).
    // ⚠️ §382ד — הערך כאן **נדרס למטה** לפי מה שקרה בפועל בכתיבה ל-bizProofs. הוא נשאר
    // בליטרל רק כדי שהשדה יהיה חלק מהאובייקט; אל תסיק ממנו שהניקוי מובטח.
    photoProofUrl: '',
    fanInstagram: document.getElementById('edit_ownerInstagram_'+id).value.trim(), // §321
    ownerRelation: document.getElementById('edit_ownerRelation_'+id).value,
  };
  // ══ §382ד — הערך נקרא לפני השמירה, והסדר הפוך ═════════════════════════════════════════
  // 🐛 **הבאג שנמדד בפועל, על שני העסקים האמיתיים:** הגרסה הראשונה קראה את הערך מה-DOM
  // **אחרי** `await saveSectionUpdates`. אבל השמירה הזאת כותבת ל-Firestore, ה-onSnapshot
  // הגלובלי יורה, `queueRenderAllPreserveScroll` בונה מחדש את כל הכרטיס — והשדה נוצר מחדש
  // עם הערך שכבר נוקה (`photoProofUrl: ''`). כלומר `getElementById(...).value` החזיר
  // **מחרוזת ריקה**, נכתב ריק ל-bizProofs, והכתובת אבדה משני המקומות בבת אחת. שני הכרטיסים
  // הציגו "המסלול דורש תמונה — לא הועלתה" מיד אחרי שמירה מוצלחת לכאורה.
  // ⚠️ בדיוק [[feedback_admin_dashboard_global_rerender]]: **כל קריאה מה-DOM אחרי await
  // בקובץ הזה חשודה** — הרינדור הגלובלי רץ ביניהם. לקרוא לפני, תמיד.
  //
  // 🔑 **וגם הסדר התהפך:** כותבים קודם לאוסף החדש, ורק אם זה הצליח מנקים את השדה הישן.
  // הסדר ההפוך הופך כשל-כתיבה לאובדן-נתון: הישן כבר נמחק והחדש לא נכתב. אין כאן טרנזקציה
  // בין שני אוספים, ולכן הסדר הוא ההגנה היחידה.
  const proofUrl = document.getElementById('edit_ownerProofUrl_'+id).value.trim();
  let proofStored = false;
  try {
    // setDoc({merge:true}) ולא updateDoc: לרוב העסקים אין עדיין מסמך כזה.
    await setDoc(doc(db, 'bizProofs', id), { photoProofUrl: proofUrl, at: serverTimestamp() }, { merge: true });
    proofStored = true;
  } catch (e) {
    console.error('שמירת ראיית-האימות של בעל העסק נכשלה:', e.code || '', e.message);
    alert('שמירת כתובת ראיית-האימות נכשלה — היא לא נשמרה בשום מקום. שאר השדות נשמרו כרגיל; נסו שוב.');
  }
  // ── §385 — בכשל **לא כותבים כלום** לשדה הציבורי ────────────────────────────────────────
  // §382ד כתב כאן את הכתובת בחזרה למסמך העסק ("עדיף שדה חשוף מאשר ראיה שנעלמה") — וזה
  // היה נכון **רק** כל עוד `hydrateBiz` נפל-לאחור וקרא משם. עכשיו כשאין נפילה-לאחור,
  // כתיבה כזאת נותנת את שני החסרונות ואפס יתרונות: הכתובת חשופה על מסמך ציבורי, **ואף
  // אחד לא רואה אותה** ממילא. משמיטים את השדה לגמרי — המסמך נשאר כפי שהיה, וה-alert
  // אומר למנהל לנסות שוב.
  // 🔑 הכלל: כשמסירים נפילה-לאחור, לבדוק גם את נתיבי-הכתיבה שהסתמכו עליה — לא רק את הקריאה.
  if (proofStored) updates.photoProofUrl = '';
  else delete updates.photoProofUrl;
  await saveSectionUpdates(id, updates);
  // סנכרון לרשומת החבר המקושרת — זהה ל-admin-businesses.html saveSec1 (מונע פער טלפון/מייל/שם מול הרשומה שדרכה בעל העסק נכנס)
  if (b.ownerMemberId) {
    try {
      await updateDoc(doc(db, 'members', b.ownerMemberId), {
        firstName: updates.ownerFirst, lastName: updates.ownerLast, phone: updates.ownerPhone, email: updates.ownerEmail,
      });
    } catch (e) { console.warn('owner member sync failed', e); }
  }
};

// 3 כפתורי-ההחלטה בכרטיס "אימות בעל העסק" (תואם-handoff, 2026-08-04) — שדה חדש ownerVerificationStatus
// ('confirmed'|'rejected'|'info_requested'|null), לא היה קיים קודם. לא נוגע בסטטוס-האישור של העסק
// כולו (approveBiz/rejectBiz) — זו רק החלטה נפרדת על אימות-האוהד-של-הבעלים, בדיוק כמו שהמקור מציג.
window.setOwnerVerification = async function(id, status) {
  const b = findBiz(id);
  if (!b) return;
  // status ריק = ביטול ההחלטה וחזרה ל"ממתין להחלטה" (נכתב null, לא '' — כדי שהבדיקות
  // `ownerVerificationStatus || null` בכל שאר הקוד יראו בדיוק את אותו מצב כמו עסק שמעולם לא הוכרע)
  const next = status || null;

// ── סניפים מרובים (עריכה מלאה) — עד עכשיו הכרטיס שימר סניפים 2+ בלי UI-עריכה בכלל (תצוגה בלבד,
// ר' PROJECT_CONTEXT.md §145/§146). זהה בהיגיון ל-branchRowHtml/addBranchRow/removeBranchRow
// ב-business-dashboard.html, אבל id-ים ממוקדי-עסק (editBranchesList_${bizId}) כי כרטיסים שונים
// יכולים להיות ברשימה בו-זמנית — לא בטוח שרק כרטיס אחד פתוח לעריכה בכל רגע.
function adminBranchRowHtml(bizId, city, address, idx) {
  return `
    <div class="branch-row" data-branch-idx="${idx}" style="border:1px solid var(--border);border-radius:11px;padding:12px;margin-bottom:8px;position:relative;background:var(--card-bg2);">
      ${idx > 0 ? `<button type="button" onclick="removeBranchRow('${bizId}',${idx})" style="position:absolute;top:8px;left:8px;background:none;border:none;font-size:15px;cursor:pointer;color:var(--text-muted);">✕</button>` : ''}
      <div style="font-size:11.5px;font-weight:700;color:var(--text-sm);margin-bottom:8px;">סניף ${idx + 1}</div>
      <div class="edit-subrow"><input type="text" class="branch-city" value="${esc(city)}" placeholder="עיר"><input type="text" class="branch-address" value="${esc(address)}" placeholder="כתובת מלאה"></div>
    </div>`;
}
function adminBranchRowsHtml(bizId, branches) {
  return branches.map((br, i) => adminBranchRowHtml(bizId, br.city || '', br.address || '', i)).join('');
}
window.addBranchRow = function(bizId) {
  const list = document.getElementById('editBranchesList_' + bizId);
  const idx = list.querySelectorAll('.branch-row').length;
  list.insertAdjacentHTML('beforeend', adminBranchRowHtml(bizId, '', '', idx));
};
window.removeBranchRow = function(bizId, idx) {
  const list = document.getElementById('editBranchesList_' + bizId);
  const rows = [...list.querySelectorAll('.branch-row')];
  rows[idx]?.remove();
  // מספור מחדש — אחרת אינדקסים/כפתורי-הסרה מתבלבלים אחרי מחיקה מהאמצע
  list.innerHTML = adminBranchRowsHtml(bizId, [...list.querySelectorAll('.branch-row')].map(r => ({
    city: r.querySelector('.branch-city').value, address: r.querySelector('.branch-address').value,
  })));
};
function collectBranchRowsAdmin(bizId) {
  return [...document.querySelectorAll('#editBranchesList_' + bizId + ' .branch-row')].map(r => ({
    city: r.querySelector('.branch-city').value.trim(),
    address: r.querySelector('.branch-address').value.trim(),
  })).filter(br => br.city || br.address);
}

window.saveBizSec2 = async function(id) {
  const b = findBiz(id);
  if (!b) return;
  const types = [];
  if (document.getElementById('edit_type_physical_'+id).checked) types.push('physical');
  if (document.getElementById('edit_type_online_'+id).checked) types.push('online');
  if (document.getElementById('edit_type_pro_'+id).checked) types.push('pro');
  // שדות type-conditional (ר' business-dashboard.html שלב 2) — נקראים תמיד, אבל רק אם הסוג המתאים מסומן
  // כך שאם המנהל מסמן/מבטל checkbox בלי לגעת בשדה עצמו, הערך לא "נדבק" לסוג שכבר לא רלוונטי
  const desc = document.getElementById('edit_desc_'+id).value.trim();
  // hoursEditors[id] נוצר ב-mountAdminHoursEditor כשהשלב נפתח. נפילה-לאחור למחרוזת הקיימת
  // ולא למחרוזת ריקה — אחרת פתיחת השלב בלי hours.js הייתה **מוחקת** לעסק את השעות בשמירה.
  const hoursPayload = hoursEditors[id] ? hoursEditors[id].getValue() : { hours: b.hoursText || '' };
  const updates = {
    name: document.getElementById('edit_name_'+id).value.trim() || b.name,
    bizTypes: types,
    branches: types.includes('physical') ? collectBranchRowsAdmin(id) : [],
    regions: types.includes('pro') ? Array.from(document.querySelectorAll('.edit-proregion-'+id+':checked')).map(el => el.value) : [],
    phone: document.getElementById('edit_phone_'+id).value.trim(),
    whatsapp: document.getElementById('edit_whatsapp_'+id).value.trim(),
    serviceEmail: document.getElementById('edit_serviceEmail_'+id).value.trim(),
    website: document.getElementById('edit_website_'+id).value.trim(),
    instagram: document.getElementById('edit_instagram_'+id).value.trim(),
    facebook: document.getElementById('edit_facebook_'+id).value.trim(),
    desc,
    ...hoursPayload,
    // המנהל ערך את השעות בעצמו — זה נחשב טיפול במיגרציה בדיוק כמו שבעל-העסק היה עושה זאת
    // (בקשת המשתמש: "במידה ואני מחליט לשנות ולערוך על בסיס ההבנה שלי... תסמן את זה כטופל").
    // נכתב רק אם טרם טופל, כדי לא לאפס לבעל-עסק אישור שכבר רץ ולהאריך לו את חלון-השבוע.
    ...(b.hoursMigrationDone ? {} : { hoursMigrationDone: new Date(), hoursMigrationBy: 'admin' }),
  };
  // אזהרת-מספר-שבור. כאן במפורש confirm ולא חסימה (בשונה מ-business.html/business-dashboard.html):
  // המנהל הוא מי שמתקן נתונים שגויים, ואסור לחסום אותו — אבל כן צריך שלא יעבור בשקט על מספר
  // עם ספרה עודפת/חסרה, שיוצר כפתור WhatsApp/התקשר מת בכרטיס. זהה בתפקידו ל-confirmSuspectEmail.
  if (!confirmSuspectPhone(updates.phone, 'טלפון העסק')) return;
  if (!confirmSuspectPhone(updates.whatsapp, 'ה-WhatsApp')) return;
  // §232 — אותו היגיון בדיוק, על שדות הקישור
  if (!confirmSuspectLink('website', updates.website, 'האתר')) return;
  if (!confirmSuspectLink('instagram', updates.instagram, 'האינסטגרם')) return;
  if (!confirmSuspectLink('facebook', updates.facebook, 'הפייסבוק')) return;
  await saveSectionUpdates(id, updates);
};

// re-render כמו ב-3 הקבצים האחרים; onchange פשוט על ה-checkbox עצמו מספיק.

window.saveBizSec4 = async function(id) {
  const b = findBiz(id);
  if (!b) return;
  const discountFullText = document.getElementById('edit_discount_'+id).value.trim();
  // 🐛 באג-אמת שנמצא (2026-08-08): hasDiscount חושב *רק* מ-discountFullText — עסק עם הטבה אמיתית
  // (hasDiscount:true, discountText קצר עם תוכן) אבל בלי discountTextFull שמור (לא עבר קיצור-AI,
  // או עסק ישן) היה מאבד את ההטבה *כליל* בכל שמירה של שלב 4, גם אם המנהל רק שינה "מקום מימוש" —
  // כי התיבה הריקה גרמה ל-hasDiscount:false, ואז discountText/discountRedeemMode/additionalDiscounts
  // כולם נמחקים באותה שמירה (למטה). עכשיו נשמר "יש הטבה" גם אם יש כותרת-קצרה קיימת בלי תיאור-מלא.
  const hasDiscount = !!(discountFullText || b.discountText || b.aiShortTitle);
  // רשת ביטחון אחרונה — לא ניתן לשמור כותרת שחורגת בפועל מרוחב הכרטיס, גם אם המנהל הקליד/הדביק
  // משהו ארוך יותר ידנית (ensureFitsCard חותך בעדינות לגבול מילה, זהה ל-business-dashboard.html)
  const discountText = ensureFitsCard(bizAiTitleEdits[id] !== undefined ? bizAiTitleEdits[id] : (b.aiShortTitle || ''));
  const disc2Text = document.getElementById('edit_disc2_text_'+id).value.trim();
  const disc3Text = document.getElementById('edit_disc3_text_'+id).value.trim();
  const checkedRedeem = suffix => Array.from(document.querySelectorAll('.edit-redeem-'+suffix+'-'+id+':checked')).map(el => el.value);
  // קוד קופון נשמר רק כשהמקום שנבחר בפועל כולל "אונליין" — אחרת מנוקה, אותו עיקרון בדיוק כמו
  // business-dashboard.html (ר' ההערה שם), כדי לא להשאיר קוד ישן/לא-רלוונטי אחרי שהמנהל מבטל את "באתר".
  const couponFor = suffix => {
    const el = document.getElementById('edit_coupon_'+suffix+'_'+id);
    return checkedRedeem(suffix).includes('online') ? (el?.value.trim() || '') : '';
  };
  const redeem1 = checkedRedeem('1');
  const additionalDiscounts = [];
  if (disc2Text) additionalDiscounts.push({ text: disc2Text, redeemMode: checkedRedeem('2'), code: couponFor('2') });
  if (disc3Text) additionalDiscounts.push({ text: disc3Text, redeemMode: checkedRedeem('3'), code: couponFor('3') });
  const updates = {
    hasDiscount,
    discountText: hasDiscount ? discountText : '',
    discountTextFull: hasDiscount ? discountFullText : '',
    discountRedeemMode: hasDiscount ? redeem1 : [],
    discountCode: hasDiscount ? couponFor('1') : '',
    additionalDiscounts: hasDiscount ? additionalDiscounts : [],
  };
  await saveSectionUpdates(id, updates);
};


// ── בורר תגית ראשית+שנייה בטופס עריכה, כולל מנגנון האישור לתגית שנייה (זהה בהיגיון ל-admin-businesses.html) ──
// מאתחל את editSelectedTags/editSecondTagOpen כשנפתח טופס עריכה: תגיות מאושרות קיימות + הצעת תגית שנייה
// ממתינה (אם תקפה לקטגוריה הנוכחית ועדיין לא אושרה) מוצגת כבר מסומנת, כדי שאישור המנהל יהיה פשוט "שמור".
function initEditTagsState(id) {
  const b = findBiz(id);
  if (!b) return;
  const pool = TAGS_BY_CATEGORY_MOCK[b.catKey] || [];
  editSelectedTags = (b.tags || []).slice(0, 2);
  const liveSecond = editSelectedTags[1] || '';
  if (!editSelectedTags[1] && b.tagSecondSuggestion && b.tagSecondSuggestion !== liveSecond && pool.includes(b.tagSecondSuggestion)) {
    editSelectedTags[1] = b.tagSecondSuggestion;
  }
  // הטוגל נפתח כברירת מחדל רק אם יש כבר תגית שנייה *מאושרת בפועל* (liveSecond) — לא בגלל הצעה
  // ממתינה בלבד. פתיחה אוטומטית בגלל הצעה גרמה לתחושת "נסגר לי מיד" (המנהל לא ידע שהטוגל כבר
  // דלוק, ולחיצה ראשונה כיבתה אותו) — ההצעה עצמה עדיין מוצגת בתיבת התרעה עם אשר/דחה בלי לפתוח שום דבר.
  editSecondTagOpen = !!liveSecond;
}

function editTagsAreaHtml(b, catKey) {
  const pool = TAGS_BY_CATEGORY_MOCK[catKey] || [];
  const primaryChips = pool.map(t => `<div class="tag-chip selectable${editSelectedTags[0]===t?' selected':''}" onclick="selectPrimaryTag('${b.id}','${t.replace(/'/g,"\\'")}')">${t}</div>`).join('');
  const liveSecond = (b.tags || [])[1] || '';
  const suggestionHtml = (b.tagSecondSuggestion && b.tagSecondSuggestion !== liveSecond)
    ? `<div class="tag-suggestion-alert">💡 העסק ביקש תגית שנייה: "${b.tagSecondSuggestion}"</div>` : '';
  const freeSuggestionHtml = b.tagSuggestion
    ? `<div class="tag-suggestion-alert">🆕 העסק הציע תגית חדשה: "${b.tagSuggestion}"
        ${editSelectedTags.filter(Boolean).length >= 2
          ? ' — כבר נבחרו 2 תגיות, אי אפשר להוסיף עוד'
          : `<button class="act-btn approve tiny" onclick="addFreeSuggestionToPool('${b.id}','${catKey}')">➕ הוסף לרשימה ובחר (${(CATEGORIES.find(c=>c.key===catKey)||{}).label||catKey})</button>`}
      </div>`
    : '';
  const showSecondRow = !!editSelectedTags[0];
  const secondPool = pool.filter(t => t !== editSelectedTags[0]);
  const secondChips = secondPool.map(t => `<div class="tag-chip selectable${editSelectedTags[1]===t?' selected':''}" onclick="selectSecondTag('${b.id}','${t.replace(/'/g,"\\'")}')">${t}</div>`).join('');
  return `
    <div id="edit_tagsArea_${b.id}">
      <div class="tag-chip-list">${primaryChips || '<span class="tag-chip empty">אין תגיות מוגדרות לקטגוריה זו</span>'}</div>
      ${suggestionHtml}
      ${freeSuggestionHtml}
      ${showSecondRow ? `
      <div class="toggle-row">
        <span>תגית שנייה (אופציונלי)</span>
        <button type="button" class="toggle${editSecondTagOpen?' on':''}" onclick="toggleSecondTag('${b.id}')"></button>
      </div>
      ${editSecondTagOpen ? `<div class="tag-chip-list" style="margin-top:6px">${secondChips || '<span class="tag-chip empty">אין תגיות נוספות בקטגוריה זו</span>'}</div>` : ''}` : ''}
    </div>`;
}

function rerenderEditTagsArea(id) {
  const b = findBiz(id);
  const catKey = document.getElementById('edit_cat_'+id).value;
  const el = document.getElementById('edit_tagsArea_'+id);
  if (el) el.outerHTML = editTagsAreaHtml(b, catKey);
}

  // עצמו מוסתר לגמרי (`.biz-type-card input { display:none }`, ר' CSS) — הסימון הוויזואלי היחיד
  // הוא מחלקת `.on` על ה-label העוטף, שהתחילה מ-render ראשוני (`types.includes(...)`) ומעולם לא
  // עודכנה בלחיצה. ה-checkbox בפועל *כן* השתנה (המצב הפנימי תקין, שמירה הייתה עובדת נכון) — פשוט
  // בלי שום משוב חזותי, בדיוק כמו הבאג הכללי עם כפתורי-שמירה שתוקן קודם באותו סשן.
  physicalCb.closest('.biz-type-card')?.classList.toggle('on', isPhysical);
  onlineCb.closest('.biz-type-card')?.classList.toggle('on', isOnline);

};

window.selectPrimaryTag = function(id, tag) {
  if (editSelectedTags[0] === tag) {
    editSelectedTags = [];
    editSecondTagOpen = false;
  } else {
    // 🐛 באג-אמת שנמצא (2026-08-08, המשתמש: "מוסיף מוחק משהו שם לא מסתדר לי"): אם התגית שנבחרת
    // עכשיו כראשית היא בדיוק אותה תגית שכבר הייתה שנייה — הקוד הישן פשוט שרשר `[tag, ...קודם]`
    // בלי לבדוק כפילות, ויצר [X,X]. שורת התגית-השנייה בכל זאת מסננת את הראשית מתוך ה-pool
    // (secondPool ב-editTagsAreaHtml), אז X "נעלם" משם ויזואלית — אבל עדיין שמור פנימית
    // כ-editSelectedTags[1], ונכתב בפועל כתגית כפולה בשמירה (saveBizSec3). אם התגית-השנייה
    // הקיימת זהה לזאת שנבחרת עכשיו כראשית — מנקים אותה, לא משכפלים.
    const nextSecond = editSelectedTags[1] === tag ? undefined : editSelectedTags[1];
    editSelectedTags = [tag, nextSecond].filter(Boolean);
  }
  rerenderEditTagsArea(id);
};

window.selectSecondTag = function(id, tag) {
  editSelectedTags[1] = (editSelectedTags[1] === tag ? undefined : tag);
  editSelectedTags = editSelectedTags.filter(Boolean);
  rerenderEditTagsArea(id);
};

window.toggleSecondTag = function(id) {
  editSecondTagOpen = !editSecondTagOpen;
  if (!editSecondTagOpen) editSelectedTags = editSelectedTags.slice(0, 1);
  rerenderEditTagsArea(id);
};

// "➕ הוסף לרשימה ובחר" בתוך טופס העריכה — מוסיף את ההצעה החופשית (tagSuggestion) לפול התגיות
// של הקטגוריה, ובוחר אותה מיד (ראשית אם ריקה, אחרת שנייה). לא מנקה b.tagSuggestion כאן —
// זה קורה רק בשמירה בפועל (saveBizSec3), בדיוק כמו tagSecondSuggestion.
// catKey מגיע מהקטגוריה שנבחרה *בפועל* בטופס העריכה כרגע (לא בהכרח b.catKey — יכול להשתנות באמצע
// עריכה דרך "קטגוריה ראשית" לפני שנשמר) — כדי שהתגית תתווסף לפול הנכון ותיבחר בהתאם.
window.addFreeSuggestionToPool = function(id, catKey) {
  const b = findBiz(id);
  if (!b || !b.tagSuggestion) return;
  const cat = catKey || b.catKey;
  const pool = TAGS_BY_CATEGORY_MOCK[cat] || (TAGS_BY_CATEGORY_MOCK[cat] = []);
  const tag = b.tagSuggestion;
  if (!pool.includes(tag)) pool.push(tag);
  if (!editSelectedTags[0]) editSelectedTags[0] = tag;
  else if (!editSelectedTags[1]) { editSelectedTags[1] = tag; editSecondTagOpen = true; }
  rerenderEditTagsArea(id);
};

// tab-aware בכוונה: הפונקציה הזו נקראת גם ממקומות מחוץ לטאב "כל העסקים" (למשל בורר הקהל
// במרכז ההודעות, שמשתמש באותם setBizXFilter/filterBizRows/toggleSelectAllBiz בדיוק) — ה-DOM-ים
// הספציפיים (#bizListCol וכו') לא קיימים שם, אז נופלים ל-renderMain מלא. ר' [[feedback_module_scope_onclick]]
// לדוגמה קודמת מאותה משפחת באג (תיקון תלוי-טאב).
function refreshBizList() {
  if (activeTab !== ALL_BIZ_KEY) { renderMain(); return; }
  const list = bizFilteredList();
  if (!list.find(b => b.id === selectedBizDetailId)) {
    selectedBizDetailId = list[0] ? list[0].id : null;
    const dc = document.getElementById('bizDetailCol');
    if (dc) dc.innerHTML = selectedBizDetailId ? bizFullDetailHtml(selectedBizDetailId) : `<div class="placeholder-note">לא נמצאו עסקים</div>`;
  }
  const el = document.getElementById('bizListRows');
  if (el) el.innerHTML = bizRowsHtml();
  const bar = document.getElementById('bizBulkBarWrap');
  if (bar) bar.outerHTML = bizBulkBarHtml();
  const selRow = document.getElementById('bizSelectAllRow');
  if (selRow) selRow.outerHTML = bizSelectAllRowHtml();
}

window.filterBizRows = function(v) {
  bizSearch = v;
  refreshBizList();
};

window.setBizStatusFilter = function(status) {
  bizStatusFilter = status;
  renderMain();
};

window.toggleBizSelect = function(id) {
  if (selectedBizIds.has(id)) selectedBizIds.delete(id); else selectedBizIds.add(id);
  refreshBizList();
};

window.toggleSelectAllBiz = function() {
  const ids = bizFilteredList().map(b => b.id);
  const allSelected = ids.length > 0 && ids.every(id => selectedBizIds.has(id));
  if (allSelected) ids.forEach(id => selectedBizIds.delete(id));
  else ids.forEach(id => selectedBizIds.add(id));
  refreshBizList();
};

// נקרא גם מטאב "שליחת הודעה" (לא רק "כל העסקים") — refreshBizList מעדכן DOM-ים שקיימים רק
// בטאב העסקים, אז כשקוראים מטאב אחר צריך renderMain מלא כדי שהתצוגה שם באמת תתעדכן.
window.clearBizSelection = function() {
  selectedBizIds.clear();
  if (activeTab === ALL_BIZ_KEY) refreshBizList(); else renderMain();
};

// בולק אמיתי — אותה צורת כתיבה כמו admin-businesses.html bulkApprove/bulkReject
window.bulkSetBizStatus = async function(status) {
  const ids = [...selectedBizIds];
  // באישור-המוני אין הזדמנות לראות כרטיס-כרטיס — לכן סיכום אחד של כל הכתובות החשודות בבחירה,
  // לפני שמאשרים. ביטול = לא אושר כלום, אפשר לתקן קודם.
  if (status === 'approved') {
    const suspects = ids.map(id => bizById(id)).filter(b => b && b.status === 'pending' && emailDomainHit(b.ownerEmail));
    if (suspects.length && !confirm(
      `${suspects.length} מהעסקים שנבחרו עם כתובת מייל שנראית שגויה:\n\n` +
      suspects.map(b => `• ${b.name} — ${b.ownerEmail} (כנראה ${emailDomainHit(b.ownerEmail).suggested})`).join('\n') +
      `\n\nלכתובות כאלה המייל יסומן "נשלח" אבל לא יגיע לאף אחד.\n\nאישור = לאשר את כולם בכל זאת · ביטול = לא לאשר כלום, אתקן קודם`
    )) return;
  }
  selectedBizIds.clear();
  try {
    if (status === 'approved') {
      await Promise.all(ids.map(async id => {
        const b = bizById(id);
        if (!b || b.status !== 'pending') return;
        await approveBizWithMemberBatch(b);
      }));
    } else {
      await Promise.all(ids.map(id => {
        const b = bizById(id);
        if (!b || b.status !== 'pending') return Promise.resolve();
        return updateDoc(doc(db, 'businesses', id), { status: 'rejected', rejectedAt: serverTimestamp() });
      }));
    }
  } catch (e) { console.error(e); alert('שגיאה בפעולה גורפת: ' + e.message); }
};

function bizBulkBarHtml() {
  const count = selectedBizIds.size;
  if (!count) return `<div id="bizBulkBarWrap"></div>`;
  return `
    <div id="bizBulkBarWrap">
      <div class="biz-bulk-bar">
        <span>נבחרו ${count}</span>
        <span class="sp"></span>
        <button class="biz-bulk-btn approve" onclick="bulkSetBizStatus('approved')">✅ אשר נבחרים</button>
        <button class="biz-bulk-btn reject" onclick="bulkSetBizStatus('rejected')">✗ דחה נבחרים</button>
        <button class="biz-bulk-btn" onclick="openBroadcastFor('businesses')">📣 שלח הודעה לנבחרים</button>
        <button class="biz-bulk-btn cancel" onclick="clearBizSelection()">ביטול</button>
      </div>
    </div>`;
}

// שורה ראשית תואמת ל-handoff (2026-08-04): חיפוש + מיון-דחיפות-אחד + 3 פילי-סיווג
// (הכל/ממתינים-לאישור/בקשות-מבעלי-עסקים), במקום סרגל-סינון-כללי. בורר-הסטטוס/קטגוריה/וכו' הישנים
// לא נמחקו לגמרי — עדיין בשימוש אמיתי בבורר-הקהל של מרכז ההודעות (broadcastAudPickerListHtml/
// manualPickerListHtml, ר' ההערות שם: "אותם סינונים בדיוק") — רק הוסתרו מ"כל העסקים" עצמו
// לבקשת המשתמש (2026-08-04, "תוריד את זה"), דרך opts.advanced=false. עדיין מוצגים בהקשר-השידור.
function bizFilterBarHtml(opts) {
  // searchId נמסר רק מ"כל העסקים" — הפונקציה נקראת גם פעמיים בו-זמנית במרכז ההודעות
  // (singleSenderBodyHtml + broadcastAudPicker), ושם id זהה היה נכפל ב-DOM. ר' §254.
  const o = Object.assign({ advanced: true, selectAll: true, searchId: '' }, opts || {});
  const advancedActiveCount = (bizStatusFilter!=='all'?1:0) + (bizCategoryFilter!=='all'?1:0) + (bizTypeFilter!=='all'?1:0) + (bizReviewFilter!=='all'?1:0) + (bizHealthFilter!=='all'?1:0) + (bizDateRangeFilter!=='all'?1:0);
  const hasActiveFilters = (o.advanced && advancedActiveCount > 0) || bizSearch.trim() || bizSort !== 'waitingLongest' || bizClassPill !== 'all';
  const counts = bizClassCounts();
  const pill = (key, label) => `<button class="biz-class-pill ${bizClassPill===key?'active':''}" onclick="setBizClassPill('${key}')">${label} · ${counts[key]}</button>`;
  return `
    <div class="filter-toolbar">
      <div class="filter-toolbar-row">

          <option value="reviewedAsc" ${bizSort==='reviewedAsc'?'selected':''}>מיון: הכי פחות שלבים נסקרו</option>
          <option value="reviewedDesc" ${bizSort==='reviewedDesc'?'selected':''}>מיון: הכי הרבה שלבים נסקרו</option>
          <option value="newest" ${bizSort==='newest'?'selected':''}>מיון: החדש ביותר</option>
          <option value="oldest" ${bizSort==='oldest'?'selected':''}>מיון: הישן ביותר</option>
          <option value="clicks" ${bizSort==='clicks'?'selected':''}>מיון: הכי הרבה קליקים</option>
          <option value="likes" ${bizSort==='likes'?'selected':''}>מיון: הכי הרבה לייקים</option>
        </select>
        ${o.advanced ? `<button class="filter-pill ${bizAdvancedOpen?'active':''}" onclick="toggleBizAdvanced()">⚙️ עוד סינונים${advancedActiveCount ? ` <span class="biz-changes-badge">${advancedActiveCount}</span>` : ''}</button>` : ''}
        ${hasActiveFilters ? `<button class="filter-clear" onclick="clearBizFilters()">נקה סינון</button>` : ''}
      </div>
      <div class="filter-toolbar-row biz-class-pills">
        ${pill('all', 'הכל')}
        ${pill('pending', 'ממתינים לאישור')}
        ${pill('requests', 'בקשות מבעלי עסקים')}
        ${pill('approved', 'מאושרים')}
        ${pill('rejected', 'נדחו')}
        ${counts.brokenLinks ? pill('brokenLinks', '🔗 קישורים שבורים') : ''}
        ${counts.hoursOther ? pill('hoursOther', '🕐 שעות לבדיקה') : ''}
      </div>
      ${o.selectAll ? bizSelectAllRowHtml() : ''}
      ${o.advanced && bizAdvancedOpen ? `
      <div class="filter-toolbar-row">
        <select class="filter-select" onchange="setBizStatusFilter(this.value)">
          <option value="all">כל הסטטוסים</option>
          <option value="pending" ${bizStatusFilter==='pending'?'selected':''}>ממתינים</option>
          <option value="approved" ${bizStatusFilter==='approved'?'selected':''}>מאושרים</option>
          <option value="rejected" ${bizStatusFilter==='rejected'?'selected':''}>נדחו</option>
        </select>
        <select class="filter-select" onchange="setBizCategoryFilter(this.value)">
          <option value="all">כל הקטגוריות</option>
          ${CATEGORIES.map(c => `<option value="${c.key}" ${bizCategoryFilter===c.key?'selected':''}>${c.icon} ${c.label}</option>`).join('')}
        </select>
        <select class="filter-select" onchange="setBizTypeFilter(this.value)">
          <option value="all">כל סוגי העסק</option>
          <option value="physical" ${bizTypeFilter==='physical'?'selected':''}>🏪 חנות פיזית</option>
          <option value="online" ${bizTypeFilter==='online'?'selected':''}>🌐 אונליין</option>
          <option value="pro" ${bizTypeFilter==='pro'?'selected':''}>🔧 בעל מקצוע / נותן שירות</option>
        </select>
        <select class="filter-select" onchange="setBizReviewFilter(this.value)">
          <option value="all">כל מצבי הסקירה</option>
          <option value="incomplete" ${bizReviewFilter==='incomplete'?'selected':''}>לא נסקר במלואו (&lt;${BIZ_REVIEW_SECTIONS.length}/${BIZ_REVIEW_SECTIONS.length})</option>
          <option value="complete" ${bizReviewFilter==='complete'?'selected':''}>נסקר במלואו (${BIZ_REVIEW_SECTIONS.length}/${BIZ_REVIEW_SECTIONS.length})</option>
        </select>
        <select class="filter-select" onchange="setBizHealthFilter(this.value)">
          <option value="all">כל רמות שלמות הכרטיס</option>
          <option value="incomplete" ${bizHealthFilter==='incomplete'?'selected':''}>⚠️ פרופיל לא שלם (&lt;100%)</option>
          <option value="complete" ${bizHealthFilter==='complete'?'selected':''}>פרופיל מלא (100%)</option>
          <!-- §232 — "רשימת הקישורים השבורים": אותו בורר, כי זו עוד בדיקת-איכות על הכרטיס -->
          <option value="brokenLinks" ${bizHealthFilter==='brokenLinks'?'selected':''}>🔗 קישור שבור (אתר/פייסבוק/אינסטגרם)</option>
        </select>
        <select class="filter-select" onchange="setBizDateRangeFilter(this.value)">
          <option value="all">כל התאריכים</option>
          <option value="7" ${bizDateRangeFilter==='7'?'selected':''}>נרשמו ב-7 הימים האחרונים</option>
          <option value="30" ${bizDateRangeFilter==='30'?'selected':''}>נרשמו ב-30 הימים האחרונים</option>
          <option value="90" ${bizDateRangeFilter==='90'?'selected':''}>נרשמו ב-90 הימים האחרונים</option>
        </select>
      </div>` : ''}
    </div>`;
}

// לא ספירה קבועה לכל סטטוס (זה היה תמיד למעלה) — רק מספר אחד, כמה עסקים מוצגים כרגע לפי הסינון
// הפעיל בפועל (כולל סטטוס) — מתעדכן בכל שינוי סינון, "כל מה שאבחר שיקבל מספור".
function bizSelectAllRowHtml() {
  const ids = bizFilteredList().map(b => b.id);
  const allSelected = ids.length > 0 && ids.every(id => selectedBizIds.has(id));
  return `
    <div class="biz-select-all-row" id="bizSelectAllRow">
      <button class="biz-select-all-btn ${allSelected?'active':''}" onclick="toggleSelectAllBiz()">${allSelected ? '☑ בטל בחירת הכל' : '☐ בחר הכל'}</button>
      <span class="biz-sel-count">מציג ${ids.length} עסקים${selectedBizIds.size ? ` · ${selectedBizIds.size} נבחרו` : ''}</span>
    </div>`;
}

// כותרת+KPI תואמים ל-handoff (2026-08-04): כותרת דינמית לפי ספירת classifyAction!=מאושר,
// ולא עוד "סה״כ עסקים/ממתינים לאישור" קבועים — 3 מדדים אמיתיים: משימות פתוחות, זמן טיפול ממוצע
// (ממוצע אמיתי approvedAt-registeredAt על עסקים מאושרים, לא בדוי), עסקים באינדקס (מאושרים/סה״כ).
function bizOpenTasksCount() {
  return MOCK_BUSINESSES.filter(b => classifyAction(b, 'business').primary !== 'מאושר · אין פעולה').length;
}
function bizAvgHandlingHoursLabel() {
  const done = MOCK_BUSINESSES.filter(b => b.status === 'approved' && b.approvedAt && b.registeredAt);
  if (!done.length) return '—';
  const avgMs = done.reduce((sum, b) => sum + (b.approvedAt.getTime() - b.registeredAt.getTime()), 0) / done.length;
  return (avgMs / 3600000).toFixed(1);
}
function bizListHtml() {
  const list = bizFilteredList();
  if (selectedBizDetailId == null || !list.find(b => b.id === selectedBizDetailId)) {
    selectedBizDetailId = list[0] ? list[0].id : null;
  }
  const openCount = bizOpenTasksCount();
  const approvedCount = MOCK_BUSINESSES.filter(b => b.status === 'approved').length;
  return `
    <div class="msg-content-head">
      <div style="flex:1;min-width:230px">
        <div class="msg-crumb"><a onclick="selectTab('${HOME_KEY}')">← מרכז המשימות</a><span>/</span><span>כל העסקים</span></div>
        <div class="msg-page-title">${openCount} עסקים דורשים ממך פעולה</div>
      </div>
      <div class="msg-kpis">
        <div><div class="msg-kpi-num">${openCount}</div><div class="msg-kpi-label">משימות פתוחות</div></div>
        <div class="msg-kpi-sep"></div>
        <div><div class="msg-kpi-num">${bizAvgHandlingHoursLabel()}<span class="msg-kpi-unit"> שע׳</span></div><div class="msg-kpi-label">זמן טיפול ממוצע</div></div>
        <div class="msg-kpi-sep"></div>
        <div><div class="msg-kpi-num">${approvedCount}<span class="msg-kpi-unit">/${MOCK_BUSINESSES.length}</span></div><div class="msg-kpi-label">עסקים באינדקס</div></div>
      </div>
    </div>
    ${notConnectedBannerHtml()}
    ${joinsOverviewHtml({ scope: 'biz' })}
    <div class="task-split ${bizMobileShowDetail?'mobile-show-detail':''}" id="bizSplit">
      <div class="task-list-col dcard" id="bizListCol">
        ${bizFilterBarHtml({ advanced: false, selectAll: false, searchId: 'bizSearchInput' })}
        ${bizBulkBarHtml()}
        <div class="task-list-rows" id="bizListRows">${bizRowsHtml()}</div>
      </div>
      <div class="task-detail-col" id="bizDetailCol">${selectedBizDetailId ? bizFullDetailHtml(selectedBizDetailId) : '<div class="placeholder-note">לא נמצאו עסקים</div>'}</div>
    </div>`;
}

// ══════════════════════════════════════════════════════════════════
// כל האוהדים — סטטיסטיקה + סינון + Master-Detail (מקביל ל"כל העסקים")
// ══════════════════════════════════════════════════════════════════

let fanSearch = '';
let fanStatusFilter = 'all';   // 'all' | 'pending' | 'approved' | 'rejected'
let fanSort = 'waitingTime';   // 'waitingTime' | 'newest' | 'oldest' | 'unverifiedFirst' | 'verifiedFirst' — תואם-handoff (2026-08-04)
let fanDateRangeFilter = 'all'; // 'all' | '7' | '30' | '90' (ימים אחורה מהיום)
let fanVerifyTypeFilter = 'all'; // 'all' | 'subscriber' | 'nonsubscriber' | 'owner' — דרופדאון "סוג אימות" תואם-handoff
// פילי-סיווג ראשיים תואמי-handoff, אותו עיקרון בדיוק כמו bizClassPill ("כל העסקים")
let fanClassPill = 'all';      // 'all' | 'pending' | 'unverified' | 'neverEntered'
// §394 — דלי-המייל שנבחר מתוך הפילוח ב"מרכז נתונים". 'all' = בלי סינון-דלי.
let fanEmailBucket = 'all';
let selectedFanIds = new Set();
let selectedFanDetailId = null;
let fanMobileShowDetail = false;

window.setFanSort = function(v) { fanSort = v; renderMain(); };
window.setFanDateRangeFilter = function(v) { fanDateRangeFilter = v; renderMain(); };
window.setFanVerifyTypeFilter = function(v) { fanVerifyTypeFilter = v; renderMain(); };
// §394 — מעבר לפיל אחר מנקה את סינון-הדלי. בלי זה המנהל היה לוחץ "הכל" ומקבל 12 רשומות,
// כי שבב-הדלי היה ממשיך לסנן בשקט מתחת לפיל שנראה כאילו הוא מציג את הכול.
window.setFanClassPill = function(v) { fanClassPill = v; fanEmailBucket = 'all'; renderMain(); };
window.setFanEmailBucket = function(v) { fanEmailBucket = v; renderMain(); };

// §394 — הגשר מהפילוח אל האנשים. מגיע מלחיצה על שורת-פילוח ב"מרכז נתונים".
window.goToFanBucket = function(key) {
  fanClassPill = 'neverEntered';
  fanEmailBucket = key;
  // איפוס שאר הסינונים: המנהל מגיע לכאן ממספר שראה בפאנל, וחיפוש/טווח-תאריכים שנשארו
  // מביקור קודם היו מציגים לו רשימה קצרה מהמספר — בדיוק הפער שהפיל של §390 נועד למנוע.
  fanSearch = ''; fanStatusFilter = 'all'; fanDateRangeFilter = 'all'; fanVerifyTypeFilter = 'all';
  selectedFanDetailId = null;
  selectTab(ALL_FANS_KEY);
};
window.clearFanFilters = function() {
  fanSearch = ''; fanStatusFilter = 'all'; fanSort = 'waitingTime'; fanDateRangeFilter = 'all'; fanVerifyTypeFilter = 'all'; fanClassPill = 'all';
  fanEmailBucket = 'all';   // §394 — אחרת "נקה סינון" משאיר סינון פעיל, וזו בדיוק ההבטחה שהכפתור מפר
  renderMain();
};

function fanClassCounts() {
  return {
    all: MOCK_FANS.length,
    pending: MOCK_FANS.filter(f => f.status === 'pending').length,
    unverified: MOCK_FANS.filter(f => !f.adminVerified).length,
    // §390 — הרשימה שהמנהל ביקש: מי שאושר ומעולם לא נכנס, כדי לפנות אליהם שוב.
    neverEntered: MOCK_FANS.filter(f => f.status === 'approved' && !f.lastSeenAt).length,
  };
}
function fanFilteredList() {
  const q = fanSearch.trim();
  const now = Date.now();
  const list = MOCK_FANS.filter(f => {
    const matchF = fanStatusFilter === 'all' ? true : f.status === fanStatusFilter;
    const matchClass = fanClassPill === 'all' ? true
      : fanClassPill === 'pending' ? f.status === 'pending'
      // §390 — ⚠️ ההגדרה זהה **מילה במילה** לזו של הפאנל (fanEntryStats/fanEntryBreakdown),
      // ובכוונה: פיל שסופר אחרת מהמספר שממנו המנהל הגיע הוא בדיוק הפער של §353.
      : fanClassPill === 'neverEntered' ? (f.status === 'approved' && !f.lastSeenAt)
      : !f.adminVerified;
    // §394 — הדלי מוגדר **רק בתוך** "אושרו ולא נכנסו", ולכן הוא נושא את התנאי הזה בעצמו
    // ולא נשען על כך שהפיל הנכון מסומן. אחרת "נמסר ולא נפתח" היה חל גם על מי שכן נכנס,
    // והמספר ברשימה היה גדול מהמספר בפאנל שממנו המנהל הגיע.
    const matchBucket = fanEmailBucket === 'all' ? true
      : (f.status === 'approved' && !f.lastSeenAt && fanEmailBucketOf(f) === fanEmailBucket);
    const matchVerify = fanVerifyTypeFilter === 'all' ? true
      : fanVerifyTypeFilter === 'subscriber' ? f.isSubscriber
      : fanVerifyTypeFilter === 'nonsubscriber' ? !f.isSubscriber
      : !!f.isBusinessOwner;
    const matchQ = !q || f.name.includes(q) || f.phone.includes(q) || f.email.includes(q);
    const matchRange = fanDateRangeFilter === 'all' || (now - f.registeredAt.getTime()) <= Number(fanDateRangeFilter) * 86400000;
    return matchF && matchClass && matchVerify && matchQ && matchRange && matchBucket;
  });
  return list.sort((a, b) => {
    // "זמן המתנה" — ממתינים-לאישור קודם (הוותיק שבהם ראשון), אחריהם השאר לפי הכי-ותיק. אותו עיקרון כמו bizSort 'waitingLongest'
    if (fanSort === 'waitingTime') {
      const aP = a.status === 'pending', bP = b.status === 'pending';
      if (aP !== bP) return aP ? -1 : 1;
      return a.registeredAt - b.registeredAt;
    }
    if (fanSort === 'oldest') return a.registeredAt - b.registeredAt;
    if (fanSort === 'unverifiedFirst') return (a.adminVerified?1:0) - (b.adminVerified?1:0);
    if (fanSort === 'verifiedFirst') return (b.adminVerified?1:0) - (a.adminVerified?1:0);
    return b.registeredAt - a.registeredAt; // newest — ברירת מחדל
  });
}

function fanRowsHtml() {
  const shown = fanFilteredList();
  if (!shown.length) return `<div class="placeholder-note">לא נמצאו אוהדים</div>`;
  return shown.map(f => {
    // אותו עיקרון כמו bizRowsHtml — classifyAction() כמקור-אמת יחיד, status==='rejected' כחריג מקומי.
    const cls = classifyAction(f, 'fan');
    const primaryLabel = f.status === 'rejected' ? '✗ נדחה' : cls.primary;
    // תואם-handoff (2026-08-04): "טרם נבדק" הוא פיל-סינון בלבד (fanClassPill='unverified'), לא באדג׳
    // על כל שורה — הוסר מכאן כי זה הפך את הרשימה לצפופה/ארוכה-מדי (כמעט כל שורה קיבלה באדג׳ נוסף).
    const badges = [`<span class="class-badge${primaryLabel === 'מאושר · אין פעולה' ? ' neutral' : ''}">${esc(primaryLabel)}</span>`]
      .concat(cls.treatments.map(t => treatBadgeHtml(t, f)));
    if (f.reviewFlag === 'possible_duplicate') badges.push(`<span class="warn-badge">כפילות אפשרית</span>`);
    else if (f.reviewFlag) badges.push(`<span class="warn-badge">שם לא תואם</span>`);
    if (f.isBusinessOwner) badges.push(`<span class="treat-badge">בעל עסק</span>`);
    const sel = selectedFanIds.has(f.id);
    const active = f.id === selectedFanDetailId;
    const metaBits = [
      f.isSubscriber ? 'מנוי' : 'לא מנוי',
      f.status === 'pending' ? `ממתין ${agoLabel(f.registeredAt)}` : (f.memberNumber ? `חבר ${f.memberNumber}` : '')
    ].filter(Boolean).join(' · ');
    const wa = fanRowWaBtnHtml(f);   // §394 — ריק כשאין סינון-דלי, ואז השורה זהה לחלוטין לקודם
    return `
      <div class="task-row ${f.status} ${active?'active':''} ${sel?'selected':''}" onclick="selectFanDetail('${f.id}')">
        <div class="task-row-top">
          <div class="task-row-check" onclick="event.stopPropagation();toggleFanSelect('${f.id}')">${sel ? '✓' : ''}</div>
          <div class="task-row-name">${esc(f.name)}</div>
        </div>
        <div class="task-row-badges">${badges.join('')}</div>
        <div class="task-row-meta${wa ? ' has-action' : ''}">${esc(metaBits)}${wa}</div>
      </div>`;
  }).join('');
}

// §394 — כפתור וואטסאפ ישירות על השורה, **רק כשסינון-דלי פעיל**. הרשימה הרגילה לא משתנה:
// שם הפעולה נבחרת מתוך כרטיס האוהד, וכפתור על כל שורה היה מוסיף רעש ל-148 רשומות.
// ⚠️ **אין שליחה המונית ולא תהיה** — `wa.me` פותח שיחה אחת בכל פעם. זו הליכה איש-איש, ועל
// עשרות בודדות זה סביר לגמרי; אם דלי יגדל למאות, הפתרון הזה כבר לא מספיק — וזה ייאמר אז.
function fanRowWaBtnHtml(f) {
  if (fanEmailBucket === 'all' || !f.phone) return '';
  return `<button class="row-wa-btn" title="פתיחת וואטסאפ עם הקוד" onclick="event.stopPropagation();sendFanWA('${f.id}','${f.phone}','${escJsAttr(f.name)}','${f.loginCode||''}')">💬 וואטסאפ</button>`;
}

window.selectFanDetail = function(id) {
  selectedFanDetailId = id;
  fanMobileShowDetail = true;
  const lr = document.getElementById('fanListRows');
  const dc = document.getElementById('fanDetailCol');
  const sp = document.getElementById('fanSplit');
  if (lr) lr.innerHTML = fanRowsHtml();
  if (dc) dc.innerHTML = fanFullDetailHtml(id);
  if (sp) sp.classList.add('mobile-show-detail');
};

window.fanBackToList = function() {
  fanMobileShowDetail = false;
  const sp = document.getElementById('fanSplit');
  if (sp) sp.classList.remove('mobile-show-detail');
};

function fanFullDetailHtml(id, opts) {
  const f = MOCK_FANS.find(x => x.id === id);
  if (!f) return `<div class="placeholder-note">אוהד לא נמצא</div>`;
  const o = Object.assign({ backFn: 'fanBackToList' }, opts || {});
  const linkedBiz = f.isBusinessOwner ? (findBiz(f.linkedBusinessId) || MOCK_BUSINESSES.find(b => b.ownerMemberId === f.id)) : null;
  // מחיקה עברה ל"החלטות ויומן" (fanDecisionPanelHtml, "מחיקת האוהד") — אותו עיקרון כמו bizDecisionPanelHtml.
  // שיפוט-מהיר לאוהד — מאחד 3 פעולות שהיו מפוזרות בכרטיס (דגל-דדופ/בדיקת-מנהל/אשר-דחה),
  // אותו עיקרון בדיוק כמו quickJudgmentHtml לעסק (§130) — "בדיקת מנהל" מוצג תמיד כ-item (לא רק pending).
  const fanQjRows = [];
  if (f.reviewFlag === 'name_mismatch') {
    fanQjRows.push(`
      <div class="qj-row">
        <div class="qj-row-label"><div class="qj-row-step">דגל אוטומטי</div><div class="qj-row-name">שם לא תואם</div></div>
        <div class="qj-row-value"><span class="qj-value-text">נרשם/ה עם טלפון שמופיע כבר ברשומה קודמת בשם אחר — יתכן דדופ-הרשמה. בדקו ידנית לפני שממשיכים לאישור.</span></div>
        <div class="qj-row-actions">
          <button class="qj-btn primary" onclick="resolveFanReviewFlagSamePerson('${f.id}')">אותו אדם, אשר</button>
          <button class="qj-btn reject" onclick="deleteFan('${f.id}')">כפילות, מחק</button>
        </div>
      </div>`);
  } else if (f.reviewFlag === 'possible_duplicate') {
    // הרשמה חדשה שהטלפון/מייל שלה תואמים רשומת-חבר קיימת — לא נדרסת אוטומטית (ר' fan-register.html,
    // אירוע 2026-08-12), רק מסומנת להצלבה ידנית. מציגים כאן את פרטי הרשומה הקיימת זה-לצד-זה כדי שהמנהל
    // יוכל להחליט: אותו אדם נרשם שוב (למחוק את הכפולה) או שני אנשים שונים חולקים פרט-קשר (לנקות דגל).
    const other = findFan(f.duplicateOfId);
    const otherInfo = other
      ? `${esc(other.name)} · ${esc(other.phone||'—')} · ${esc(other.email||'—')} · ${other.status==='approved'?'מאושר':other.status==='rejected'?'נדחה':'ממתין'}`
      : 'הרשומה הקיימת לא נמצאה (יתכן ונמחקה)';
    fanQjRows.push(`
      <div class="qj-row">
        <div class="qj-row-label"><div class="qj-row-step">דגל אוטומטי</div><div class="qj-row-name">כפילות אפשרית</div></div>
        <div class="qj-row-value"><span class="qj-value-text">הטלפון/מייל שהוזנו כאן תואמים רשומת-חבר קיימת: <b>${otherInfo}</b>. בדקו אם זה אותו אדם שנרשם שוב (למחוק את ההרשמה הכפולה) או שני אנשים שונים שחולקים פרט-קשר (לנקות את הדגל ולאשר כרשומה נפרדת).</span></div>
        <div class="qj-row-actions">
          ${other ? `<button class="qj-btn" onclick="selectFanDetail('${other.id}')">צפייה ברשומה הקיימת</button>` : ''}
          <button class="qj-btn reject" onclick="deleteFan('${f.id}')">כפילות, מחק את החדשה</button>
          <button class="qj-btn primary" onclick="resolveFanReviewFlagSamePerson('${f.id}')">לא כפילות, נקה דגל</button>
        </div>
      </div>`);
  }
  fanQjRows.push(`
    <div class="qj-row">
      <div class="qj-row-label"><div class="qj-row-step">בדיקת מנהל</div><div class="qj-row-name">${f.adminVerified ? '✓ נבדק' : 'טרם נבדק'}</div></div>
      <div class="qj-row-value"><label class="sec-reviewed-toggle" style="font-size:12.5px"><input type="checkbox" ${f.adminVerified ? 'checked' : ''} onchange="toggleFanVerified('${f.id}', this.checked)"> סימון כנבדק ואומת ע"י מנהל</label></div>
    </div>`);
  const fanQjOpen = !qjCollapsedIds.has(f.id);
  const fanQjCardHtml = `
    <div class="qj-card">
      <div class="qj-header">
        <button class="qj-toggle" onclick="toggleQuickJudgment('${f.id}')">${fanQjOpen ? '▾' : '▸'}</button>
        <div class="qj-title" onclick="toggleQuickJudgment('${f.id}')">שיפוט מהיר</div>
        <span class="qj-count">${fanQjRows.length}</span>
        ${f.status === 'pending' ? `
        <div class="qj-header-actions">
          <button class="qj-btn-approve-app" title="שולח אוטומטית מייל אישור עם קוד כניסה (Brevo)" onclick="approveFan('${f.id}')">✅ אשר את האוהד</button>
          <button class="qj-btn-reject-app" onclick="rejectFan('${f.id}')">✗ דחה</button>
          ${qjDeleteBtn('fan', f.id)}
        </div>` : f.status === 'approved' ? `
        <div class="qj-header-actions">
          <button class="qj-btn-reject-app" onclick="rejectFan('${f.id}')">↩️ ביטול אישור — לממתין</button>
          <button class="qj-btn-reject-app" onclick="rejectApprovedFan('${f.id}')">✗ דחייה</button>
          ${qjDeleteBtn('fan', f.id)}
        </div>` : f.status === 'rejected' ? `
        <div class="qj-header-actions">
          <button class="qj-btn-approve-app" onclick="restoreFanToPending('${f.id}')">↩️ שחזור לממתין</button>
          <button class="qj-btn-approve-app" title="שולח אוטומטית מייל אישור עם קוד כניסה (Brevo)" onclick="approveFan('${f.id}')">✅ אשר בכל זאת</button>
          ${qjDeleteBtn('fan', f.id)}
        </div>` : `
        <div class="qj-header-actions">${qjDeleteBtn('fan', f.id)}</div>`}
      </div>
      ${fanQjOpen ? `<div class="qj-body">${fanQjRows.join('')}</div>` : ''}
    </div>`;

  // ── כרטיס-זהות — אותו עיקרון כמו bizFullDetailHtml (§127): classifyAction()+class-badge/treat-badge
  // משותפים עם fanRowsHtml, כדי ששורת-הרשימה וכרטיס-הפרטים תמיד יסכימו על הסיווג.
  const idCls = classifyAction(f, 'fan');
  const idPrimaryLabel = f.status === 'rejected' ? '✗ נדחה' : idCls.primary;
  const idBadges = [`<span class="class-badge lg${idPrimaryLabel === 'מאושר · אין פעולה' ? ' neutral' : ''}">${esc(idPrimaryLabel)}</span>`]
    .concat(idCls.treatments.map(t => treatBadgeHtml(t, f, true)));
  if (f.reviewFlag === 'name_mismatch') idBadges.push(`<span class="warn-badge lg">שם לא תואם</span>`);
  if (f.reviewFlag === 'possible_duplicate') idBadges.push(`<span class="warn-badge lg">כפילות אפשרית</span>`);
  const idDates = [
    `נרשם ${fmtDate(f.registeredAt)}`,
    f.status === 'pending' ? `ממתין ${agoLabel(f.registeredAt)}` : '',
    f.memberNumber ? `חבר מס' ${f.memberNumber}` : (f.status === 'pending' ? 'טרם הוקצה מספר חבר' : '')
  ].filter(Boolean).join(' · ');
  const idWaBtn = f.phone ? `<button class="btn-id-wa" onclick="sendFanWA('${f.id}','${f.phone}','${escJsAttr(f.name)}','${f.loginCode||''}')">וואטסאפ</button>` : '';
  const idMailBtn = f.email ? `<button class="btn-id-mail" onclick="sendFanMail('${f.id}','${f.email}','${escJsAttr(f.name)}','${f.loginCode||''}')">מייל</button>` : '';
  // ── §366 — הקישור מוביל לכרטיס במרכז הניהול, לא לדשבורד האישי של בעל-העסק ───────────
  // המשתמש: *"בתגית הזאת בפנים יש קישור לדשבורד בעל העסק — שים שבלחיצה שיכנס לכרטיס עסק
  // בדשבורד ניהול, לא לדשבורד האישי"*. צודק: המנהל שלוחץ כאן נמצא באמצע שיפוט של אוהד
  // ורוצה לראות את **רשומת העסק שלו כדי להכריע**, לא להיכנס לממשק העריכה של בעל-העסק.
  // ⚠️ הישן גם פתח טאב חדש עם טוקן-הכניסה בכתובת — כלומר סוד בהיסטוריית הדפדפן ובכל
  // מקום שאליו הכתובת נעתקת, בשביל מסך שלא ביקשו.
  // openBizFromFan עוברת לטאב העסקים **וגם** בוחרת את הרשומה; `selectBizDetail` לבדה
  // הייתה מעדכנת אלמנטים שאינם על המסך כשהטאב הפעיל הוא "כל האוהדים".
  const idBizNote = linkedBiz ? `<div class="identity-note neutral"><div class="identity-note-h">בעל עסק</div><div class="identity-note-v"><a href="#" onclick="event.preventDefault();openBizFromFan('${esc(linkedBiz.id)}')">🏪 ${esc(linkedBiz.name)}</a></div></div>` : '';
  // §298 — קוביות "מנוי" ו"מסלול אימות" הוסרו מכרטיס-הזהות. הנתונים עצמם עברו לכרטיס
  // "אימות האוהד" שמתחת (fanVerifyCardHtml), שבנוי בדיוק כמו כרטיס האימות של בעל העסק.
  const idVerifyMethod = fanVerifyMethod(f);
  const idVerifyValue = fanVerifyValue(f);
  // אותו אישור-שליחה כמו בכרטיס העסק (ר' ההערה ב-bizFullDetailHtml): תאריך+שעה מדויקים וכתובת
  // היעד בפועל, כדי שכתובת שגויה תיתפס בעין — "נשלח" לבדו לא אומר שהמייל הגיע לאן שצריך.
  // כפתור "שליחה חוזרת" זמין תמיד כשיש כתובת — לא רק כשהמערכת זיהתה תקלה. ר' ההערה המקבילה
  // ב-bizFullDetailHtml (§206).
  const idEmailResendBtn = (f.status === 'approved' && f.loginCode && f.email)
    ? `<button type="button" class="act-btn approve tiny" style="margin-top:8px" onclick="event.stopPropagation();requeueFanEmail('${f.id}')">שליחה חוזרת</button>`
    : '';
  const idEmailNote = (f.status === 'approved' && f.loginCode)
    ? `<div class="identity-note ${(f.loginCodeEmailStatus === 'failed' || mailDeliveryFailed(f.loginCodeEmailDelivery)) ? 'warn' : 'neutral'}"><div class="identity-note-h">מייל קוד כניסה</div><div class="identity-note-v">${
        f.loginCodeEmailStatus === 'sent'
          ? `✅ נשלח${f.loginCodeEmailSentAt ? ' · ' + fmtDateTime(f.loginCodeEmailSentAt) : ''}<br>אל ${esc(f.email || '—')}${mailDeliveryLineHtml({ status: f.loginCodeEmailDelivery, at: f.loginCodeEmailDeliveryAt, reason: f.loginCodeEmailDeliveryReason, openedAt: f.loginCodeEmailOpenedAt, clickedAt: f.loginCodeEmailClickedAt, sentAt: f.loginCodeEmailSentAt })}`
          : f.loginCodeEmailStatus === 'failed'
            ? `❌ שליחה נכשלה<br>אל ${esc(f.email || '—')}${f.loginCodeEmailError ? `<br>${esc(String(f.loginCodeEmailError).slice(0, 200))}` : ''}`
            : `⏳ ממתין לשליחה — יוצא אוטומטית תוך דקה מהאישור${f.email ? `<br>אל ${esc(f.email)}` : ''}`
      }${idEmailResendBtn}</div></div>`
    : '';
  const identityCardHtml = `
    <div class="dcard identity-card">
      <div class="identity-top">
        <div style="flex:1;min-width:220px">
          <div class="identity-badges">${idBadges.join('')}</div>
          <div class="identity-name">${esc(f.name)}</div>
          <!-- §298 — קוד הכניסה עלה לשורת-הקשר, ליד הטלפון והמייל, וקובייתו הוסרה.
               המשתמש: *"רק את הקוד תשים ליד המייל והשם למעלה ותוריד את הקוביה שלו"*.
               הוא הפרט שהמנהל הכי מרבה להקריא בטלפון — קובייה שלמה בשבילו הייתה בזבוז
               שורה, והוא ממילא נקרא יחד עם השם והמייל. מוצג רק כשהוא באמת קיים: לפני
               האישור אין קוד, ו"ייווצר באישור" ליד הטלפון היה נקרא כאילו זה הקוד. -->
          <div class="identity-contact">${f.phone ? `<span class="k">${esc(f.phone)}</span>` : ''}${f.phone && f.email ? ' · ' : ''}${f.email ? esc(f.email) : ''}${
            (f.status === 'approved' && f.loginCode) ? `${(f.phone || f.email) ? ' · ' : ''}קוד כניסה <span class="k">${esc(f.loginCode)}</span>` : ''
          }</div>
          <div class="identity-dates">${idDates}</div>
        </div>
        ${(idWaBtn || idMailBtn) ? `<div class="identity-actions-row">${idWaBtn}${idMailBtn}</div>` : ''}
      </div>
      <!-- §298 — שלוש קוביות הוסרו: "קוד כניסה" (עלה לשורת-הקשר למעלה), "מנוי" ו"מסלול
           אימות". המשתמש: *"למעלה לא צריך קוביה של מנוי, ולא מסלול אימות כי הכל רשום
           למטה"*. שתיהן היו שכפול של כרטיס האימות שמתחת, וכפילות בכרטיס-הזהות גובה מחיר
           אמיתי: היא דוחפת למטה את מה שכן ייחודי לו (בעל-עסק מקושר, מצב מייל-הקוד).
           נשארות רק קוביות שאין להן מקום אחר. -->
      <div class="identity-notes">${emailWarnNote(f.email)}${idBizNote}${googleLinkNoteHtml(f)}${idEmailNote}</div>
    </div>`;

  // כרטיס "פרטי ההרשמה" נפרד (2026-08-04, תואם-handoff — קודם היה טקסט-חופשי בתוך approve-card, לא
  // כרטיס-grid משלו). אותו טופס-עריכה בדיוק (fanView/fanEdit/toggleFanEdit/saveFanDetails) — רק המבנה
  // מסביבו השתנה. "🏪 בעל עסק" (היה שדה כפול) הוסר — כבר מוצג ב-idBizNote בכרטיס-הזהות.
  // ── §298 — כרטיס "אימות האוהד" ──────────────────────────────────────────────────────────
  // המשתמש: *"תעשה שהאימות בדשבורד ניהול של האוהד יהיה כמו האימות של בעל העסק, שיש מקום
  // לתמונה והכל קריא ויפה."* — אותן מחלקות CSS בדיוק (owner-verify-*), לא העתק מעוצב-דומה:
  // כך שינוי עיצוב אחד יתפוס בשני המסכים, ואי אפשר שהם ייראו שונה בלי ששמים לב.
  //
  // ⚠️ הראיה קובעת את הפריסה: תמונה בעמודה שמאלית קבועה (232px) על רקע כהה, והנתונים לידה.
  // קודם התמונה הייתה שדה-רשת ברוחב מלא בתוך "פרטי ההרשמה" — כלומר הדבר היחיד שהמנהל
  // באמת צריך להסתכל עליו נראה כמו עוד שורת-טקסט.
  const fanPhotoRequired = PHOTO_ROUTES.has(idVerifyMethod);
  // ── §361 — הראיה של בעל-עסק יושבת על מסמך העסק, לא על רשומת החבר ────────────────────────
  // דיווח-אמת (אייל דבשה, 2026-09-02): *"התמונה שלו לא נקלטה באימות"*. היא כן נקלטה.
  //
  // מי שנרשם דרך business.html שולח את ראיית-האימות ל-/upload-biz-media, והוורקר
  // (worker/src/bizmedia.js) כותב `photoProofUrl` ב-firestorePatch **למסמך העסק בלבד**.
  // linkOrCreateOwnerMember — שרץ קודם לכן, לפני שההעלאה בכלל התחילה — אינו כותב את השדה
  // לרשומת החבר כלל, ובמסלול "חבר קיים" הוא נוגע רק ב-isBusinessOwner/linkedBusinessId.
  // התוצאה: **לכל בעל-עסק** כרטיס-האוהד הכריז "לא הועלתה" בזמן שהתמונה קיימת ומוצגת יפה
  // בכרטיס-העסק שלו, שני מסכים שקוראים אותו שם-שדה משני אוספים שונים.
  //
  // ⚠️ התיקון הוא **נפילה-לאחור בקריאה, לא שכפול של הכתובת לרשומת החבר.** שכפול היה יוצר
  // שני עותקים שמתפצלים ברגע שמנהל מחליף את התמונה מאחד המסכים — בדיוק הכשל של
  // "עסק השבוע" (מיזוג-בקריאה, לא נתיב-כתיבה שלישי). המקור נשאר אחד: מסמך העסק.
  const linkedBizProof = (!f.photoProofUrl && linkedBiz && linkedBiz.ownerProofPhotoUrl) ? linkedBiz.ownerProofPhotoUrl : '';
  const fanProofUrl = f.photoProofUrl || linkedBizProof;
  const fanVerifyPhotoHtml = fanProofUrl
    // §294 — lightbox ולא טאב חדש. §297 — <img> ולא background-image (על רקע-CSS אין onerror,
    // ולכן קובץ שהדפדפן לא מציג היה משאיר ריבוע ריק בלי שום דרך לזהות שזה קרה).
    ? `<img src="${esc(bizImageViewUrl(fanProofUrl))}" alt="ראיית האימות של האוהד"
           class="zoomable" title="לחצו להגדלה"
           onclick="openImageLightbox('${esc(fanProofUrl)}','proof-${esc(f.id)}.jpg')"
           onerror="markProofImageBroken(this)">${linkedBizProof
             // נאמר במפורש מאיפה היא הגיעה: המנהל צריך לדעת שהיא **אינה** על רשומת החבר,
             // אחרת מחיקת העסק תעלים לו ראיה שהוא חשב שהיא שלו.
             ? '<div class="proof-src">מתוך רשומת העסק המקושר</div>' : ''}`
    : fanPhotoRequired
      ? `<div class="owner-verify-photo-empty warn">⚠️ המסלול דורש תמונה — לא הועלתה</div>`
      : `<div class="owner-verify-photo-empty">במסלול הזה אין תמונה</div>`;

  const fanVerifyCardHtml = `
    <div class="dcard">
      <div class="steps-head"><div class="steps-head-title">אימות האוהד</div></div>
      <div class="owner-verify-card">
        <div class="owner-verify-photo">${fanVerifyPhotoHtml}</div>
        <div class="owner-verify-info">
          <div class="owner-verify-grid">
            <!-- §300 — "מנוי בפועל" הוא **התא הראשון**, לפני המסלול: הוא זה שקובע אילו
                 מסלולים בכלל היו פתוחים ומה רף-הראיה. אחריו "היה מנוי בעבר", ורק ללא-מנוי
                 (למנוי הוא חסר-משמעות, ו-"—" בשדה קבוע נקרא כמו רשומה חסרה). -->
            <div><div class="form-field-label">מנוי בפועל</div><div class="form-field-val${f.isSubscriber ? '' : ' empty'}">${f.isSubscriber ? 'כן' : 'לא'}</div></div>
            ${f.isSubscriber ? '' : `<div><div class="form-field-label">היה מנוי בעבר</div><div class="form-field-val${f.wasSubscriber === 'yes' ? '' : ' empty'}">${f.wasSubscriber === 'yes' ? 'כן' : 'לא'}</div></div>`}
            <div><div class="form-field-label">ענף</div><div class="form-field-val${!f.fanSport ? ' empty' : ''}">${f.fanSport ? esc(SPORT_LABELS[f.fanSport] || f.fanSport) : '—'}</div></div>
            ${f.isSubscriber ? verifiedSportCellHtml(f.verifiedSport, f.fanSport) : ''}
            ${f.isSubscriber ? `<div><div class="form-field-label">${esc(sectionLabelFor(f.verifiedSport))}</div><div class="form-field-val${!f.subscriberSection ? ' empty' : ''}">${esc(sectionWithTier(f.subscriberSection, f.subscriberTier) || '—')}</div></div>` : ''}
            <div><div class="form-field-label">מסלול האימות</div><div class="form-field-val${!idVerifyMethod ? ' empty' : ''}">${esc(fanVerifyMethodLabel(f))}</div></div>
            ${idVerifyValue ? `<div><div class="form-field-label">${esc(VERIFY_VALUE_LABELS[idVerifyMethod] || 'מה נמסר')}</div><div class="form-field-val" style="white-space:pre-line">${esc(idVerifyValue)}</div></div>` : ''}
            <!-- §342 — הפרופיל הוא **תא ברשת האימות**, לא שורה נספחת מתחתיה. הוא אחד
                 הנתונים שעליהם ההחלטה נשענת (ולא-מנוי — הנתון המרכזי שלה), והפרדה ממנה
                 גרמה לו להיקרא כמו מטא-דאטה. התווית נושאת את מקור-השדה. -->
            ${socialProofCellHtml('facebook',  'פייסבוק',  f.facebookUrl,  fanProfileSourceShort(f))}
            ${socialProofCellHtml('instagram', 'אינסטגרם', f.instagramUrl, fanProfileSourceShort(f))}
            <!-- §345 — מה שהנרשם הקליד מילה-במילה, כשהוא **לא** זה שכבר מוצג למעלה. שני
                 המקרים שמגיעים לכאן: שם-משתמש עירום בשדה-החובה של לא-מנוי (מתקבל, אבל לא
                 ידוע לאיזו רשת הוא שייך), וטקסט חופשי בשדה-הרשות של מנוי (שאינו חוסם).
                 allowGuess=false — הטופס מסרב לנחש רשת מערך עמום, והתצוגה מסרבת באותה
                 מידה: קישור שנפתח יפה אל האדם הלא-נכון גרוע מטקסט שדורש חיפוש. -->
            ${socialProofCellHtml('facebook', 'כפי שנמסר',
                (f.profileRaw && f.profileRaw !== f.facebookUrl && f.profileRaw !== f.instagramUrl) ? f.profileRaw : '',
                fanProfileSourceShort(f) + ' · לא זוהתה רשת', false)}
            <!-- ── שדה-רשות ריק הוא נתון, לא היעדר-נתון ────────────────────────────────
                 שלושת התאים שמעל מחזירים מחרוזת ריקה כשאין להם ערך, ולכן אוהד שלא מסר
                 שום פרופיל נראה בדיוק כמו אוהד שהשדה לא הוצג לו בכלל — בשני המקרים אין
                 שורה. זה בדיוק מה שהמשתמש ביקש להפריד. התא הזה נכנס רק כששלושתם ריקים. -->
            ${(!f.facebookUrl && !f.instagramUrl && !f.profileRaw) ? socialProofEmptyCellHtml(f) : ''}
          </div>
          <!-- §300 — השורה כבר לא חוזרת על "לא מנוי / היה בעבר": הם תאים ברשת למעלה.
               נשאר רק מה שהיא באמת אומרת — על מה ההחלטה נשענת. -->
          <div class="owner-verify-hint">${
            f.isSubscriber
              ? 'אין רשימת מנויים להצלבה — ההחלטה מבוססת על הראיה שנמסרה ועל הפרופיל בלבד.'
              : 'האימות נשען על התמונה מהיציע ועל הפרופיל בפייסבוק — אין כאן מספר מנוי להצלבה.'
          }</div>
        </div>
      </div>
    </div>`;

  const registrationCardHtml = `
    <div class="dcard registration-card">
      <div class="steps-head">
        <div class="steps-head-title">פרטי ההרשמה</div>
        <button class="btn-step-edit" onclick="toggleFanEdit('${f.id}')">עריכה</button>
      </div>
      <div id="fanView_${f.id}" class="form-grid" style="padding:0 24px 20px">
        <div class="form-field"><div class="form-field-label">שם פרטי ומשפחה</div><div class="form-field-val">${esc(f.name)}</div></div>
        <div class="form-field"><div class="form-field-label">טלפון</div><div class="form-field-val">${esc(f.phone||'—')}</div></div>
        <div class="form-field"><div class="form-field-label">אימייל</div><div class="form-field-val">${esc(f.email||'—')}</div></div>
        <div class="form-field"><div class="form-field-label">תאריך לידה</div><div class="form-field-val">${
          // "לא מולא בהרשמה" נאמר עד עכשיו גם על מי שנרשם ביוני, חודשיים לפני שהשדה
          // בכלל נוסף לטופס — כלומר טען שהוא דילג על שאלה שמעולם לא נשאל.
          f.birthDate ? esc(fmtBirthDate(f.birthDate)) : optionalFieldEmptyHtml(f, 'birthDate')
        }</div></div>
        <!-- §300 — "מנוי בפועל" ו"היה מנוי בעבר" עברו לכרטיס "אימות האוהד".
             המשתמש: *"אם מנוי בפועל או היה מנוי בעבר — זה בקטע של האימות צריך להיות"*.
             צודק: היותו מנוי היא **העובדה הראשונה שקובעת את מסלול האימות** ואת רף-הראיה
             הנדרש, לא פרט-רישום לצד תאריך לידה. "היה מנוי בעבר" רלוונטי רק ללא-מנוי,
             ושם הוא בדיוק הנסיבה שמרככת את ההחלטה. -->

        <!-- ── פרטי האימות בתוך "פרטי ההרשמה" (2026-08-24) ────────────────────────────────
             עד היום הם הופיעו **רק** בקוביית "מנוי" שבכרטיס-הזהות למעלה, בעוד שכאן הופיע
             "מנוי בפועל: כן" בלבד — כלומר מי שקרא את פרטי ההרשמה לא ראה ענף/שער/מספר, וטופס
             העריכה שמתחת דווקא כן מכיל אותם. הקובייה למעלה נשארת כסיכום-במבט-אחד (אותה החלטה
             כמו בכרטיס העסק), וכאן יושבים השדות עצמם — בדיוק כמו ששם/טלפון/מייל כבר מופיעים
             בשני המקומות. -->
        <!-- §298 — שדות האימות (ענף/שער/מסלול/ערך/פייסבוק/תמונה) עברו מכאן לכרטיס
             "אימות האוהד" שמתחת. הם היו פזורים כאן כשדות-רשת רגילים, והתמונה ישבה
             כשדה בודד ברוחב מלא — כלומר הראיה, שהיא כל העניין, נראתה כמו עוד שורה. -->
      </div>
      <div id="fanEdit_${f.id}" class="sec-edit-form" style="padding:0 24px 20px">
        <div class="form-row-2">
          <div class="form-row" style="margin:0"><label>שם פרטי</label><input type="text" id="fanEditFirst_${f.id}" value="${esc(f.firstName || '')}" /></div>
          <div class="form-row" style="margin:0"><label>שם משפחה</label><input type="text" id="fanEditLast_${f.id}" value="${esc(f.lastName || '')}" /></div>
        </div>
        <div class="form-row" style="margin-top:10px">
          <label>תאריך לידה</label>
          <div style="display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px">
            <select id="fanEditBirthDay_${f.id}">${birthOptionsHtml('day', f.birthDate)}</select>
            <select id="fanEditBirthMonth_${f.id}">${birthOptionsHtml('month', f.birthDate)}</select>
            <select id="fanEditBirthYear_${f.id}">${birthOptionsHtml('year', f.birthDate)}</select>
          </div>
        </div>
        <div class="form-row-2" style="margin-top:10px">
          <div class="form-row" style="margin:0"><label>טלפון</label><input type="tel" id="fanEditPhone_${f.id}" value="${esc(f.phone || '')}" /></div>
          <div class="form-row" style="margin:0"><label>אימייל</label><input type="email" id="fanEditEmail_${f.id}" value="${esc(f.email || '')}" /></div>
        </div>
        <div class="form-row" style="margin-top:10px">
          <label>מנוי בפועל?</label>
          <select id="fanEditIsSub_${f.id}" onchange="onFanEditSubChange('${f.id}')">
            <option value="yes" ${f.isSubscriber ? 'selected' : ''}>כן, מנוי</option>
            <option value="no" ${!f.isSubscriber ? 'selected' : ''}>לא מנוי</option>
          </select>
        </div>
        <div id="fanEditSubFields_${f.id}" style="display:${f.isSubscriber ? 'grid' : 'none'};margin-top:10px" class="form-row-2">
          <div class="form-row" style="margin:0"><label>ענף (לצורך האימות)</label>
            <select id="fanEditSport_${f.id}" onchange="onFanEditSportChange('${f.id}')">
              <option value="football" ${f.verifiedSport!=='basketball'?'selected':''}>כדורגל</option>
              <option value="basketball" ${f.verifiedSport==='basketball'?'selected':''}>כדורסל</option>
            </select>
          </div>
          <div></div>
          <div class="form-row" style="margin:0"><label id="fanEditGateLabel_${f.id}">${sectionLabelFor(f.verifiedSport)}</label><input type="text" id="fanEditGate_${f.id}" value="${esc(f.subscriberSection || '')}" /></div>
          <div class="form-row" style="margin:0"><label>יציע (כדורסל)</label><select id="fanEditTier_${f.id}">
            <option value=""${!f.subscriberTier ? ' selected' : ''}>—</option>
            <option value="upper"${f.subscriberTier === 'upper' ? ' selected' : ''}>עליון</option>
            <option value="lower"${f.subscriberTier === 'lower' ? ' selected' : ''}>תחתון</option>
          </select></div>
          <div class="form-row" style="margin:0"><label>מס' מנוי</label><input type="text" id="fanEditSubNum_${f.id}" value="${esc(f.subscriberNumber || '')}" /></div>
        </div>
        <div id="fanEditNoSubFields_${f.id}" style="display:${f.isSubscriber ? 'none' : 'block'};margin-top:10px">
          <div class="form-row" style="margin:0">
            <label>היה מנוי בעבר?</label>
            <select id="fanEditWasSub_${f.id}"><option value="yes" ${f.wasSubscriber==='yes'?'selected':''}>כן</option><option value="no" ${f.wasSubscriber!=='yes'?'selected':''}>לא</option></select>
          </div>
        </div>
        <!-- §321 — מחוץ ל-fanEditNoSubFields: גם מנוי מחזיק קישור סושיאל, ר' ההערה ב-saveFanDetails -->
        <div class="form-row" style="margin:10px 0 0"><label>קישור פייסבוק</label><input type="text" id="fanEditFbUrl_${f.id}" value="${esc(f.facebookUrl || '')}" /></div>
        <div class="form-row" style="margin:10px 0 0"><label>קישור אינסטגרם</label><input type="text" id="fanEditInstagram_${f.id}" value="${esc(f.instagramUrl || '')}" /></div>
        <div class="edit-btn-row" style="margin-top:12px">
          <button class="btn btn-reject" onclick="toggleFanEdit('${f.id}')" style="flex:none;padding:10px 18px">ביטול</button>
          <button class="btn btn-approve" onclick="saveFanDetails('${f.id}')" style="flex:1">💾 שמור</button>
        </div>
      </div>
    </div>`;
  // §298 — כרטיס האימות **לפני** פרטי ההרשמה: זו ההחלטה שהמנהל בא לקבל, והפרטים האישיים
  // הם רקע לה. אותו סדר בדיוק כמו בגיליון העסק.
  const fanMainTabHtml = `
    ${fanQjCardHtml}
    ${identityCardHtml}
    ${fanVerifyCardHtml}
    ${registrationCardHtml}`;
  return `
    <button class="act-btn task-back-btn" onclick="${o.backFn}()">→ חזרה</button>
    <div class="action-tabs">
      <button class="action-tab ${fanDetailViewTab==='main'?'active':''}" onclick="setFanDetailTab('main')">פרטי האוהד</button>
      <button class="action-tab ${fanDetailViewTab==='decisions'?'active':''}" onclick="setFanDetailTab('decisions')">החלטות ויומן</button>
    </div>
    ${fanDetailViewTab === 'decisions' ? fanDecisionPanelHtml(f) : fanMainTabHtml}`;
}
// "החלטות על האוהד" — טאב שני, אותו דפוס בדיוק כמו bizDecisionPanelHtml (2026-08-04, בקשת המשתמש).
// "מחיקת האוהד" (היה actionsTop למעלה, "פעולה ראשית" בתוך פרטי-האוהד) עבר לכאן.
function fanDecisionPanelHtml(f) {
  return `
    <div class="decision-panel">
      <div class="decision-panel-pad">
        <div class="decision-panel-label">החלטות על האוהד</div>
        <div class="decision-hint-text">אישור מקצה מספר חבר וקוד כניסה, ושולח את מייל הקוד אוטומטית.</div>
        <button class="decision-remove-btn" onclick="deleteFan('${f.id}')">מחיקת האוהד</button>
      </div>
      <div class="decision-divider"></div>
      ${fanEmailHistoryHtml(f)}
      ${fanActivityHtml(f)}
    </div>`;
}

// בדיקת-מנהל ידנית לאוהד — נפרד מ-status (אשר/דחה) ומ-reviewFlag האוטומטי, זמין בכל מקום שמציג כרטיס אוהד מלא
// (גם "אוהדים ממתינים" בדשבורד הראשי וגם "כל האוהדים") כי שניהם משתמשים באותו fanFullDetailHtml.
// adminVerified/adminNote לא היו קיימים בכלל בסכימת members האמיתית — הם שדות סקלריים חדשים, בטוחים
// להוספה (בלי התנגשות עם שדה קיים, לא נקראים משום קוד אחר באתר) — נוספו כאן לראשונה בפועל.
window.toggleFanEdit = function(id) {
  const view = document.getElementById('fanView_' + id);
  const edit = document.getElementById('fanEdit_' + id);
  if (!edit) return;
  const opening = !edit.classList.contains('open');
  edit.classList.toggle('open', opening);
  if (view) view.style.display = opening ? 'none' : '';
};
window.onFanEditSubChange = function(id) {
  const isSub = document.getElementById('fanEditIsSub_' + id).value === 'yes';
  const subEl = document.getElementById('fanEditSubFields_' + id);
  const noSubEl = document.getElementById('fanEditNoSubFields_' + id);
  if (subEl) subEl.style.display = isSub ? 'grid' : 'none';
  if (noSubEl) noSubEl.style.display = isSub ? 'none' : 'block';
};
window.onFanEditSportChange = function(id) {
  const sport = document.getElementById('fanEditSport_'+id).value;
  document.getElementById('fanEditGateLabel_'+id).textContent = sectionLabelFor(sport);
};
// עריכת פרטים אישיים+אימות מנוי — זהה ל-admin-members.html saveEditBtn (שדות אמיתיים בלבד)
window.saveFanDetails = async function(id) {
  const f0 = findFan(id);
  const isSub = document.getElementById('fanEditIsSub_' + id).value === 'yes';
  const updates = {
    firstName: document.getElementById('fanEditFirst_' + id).value.trim(),
    lastName: document.getElementById('fanEditLast_' + id).value.trim(),
    birthDate: composeBirthDate(
      document.getElementById('fanEditBirthDay_' + id).value,
      document.getElementById('fanEditBirthMonth_' + id).value,
      document.getElementById('fanEditBirthYear_' + id).value
    ),
    phone: document.getElementById('fanEditPhone_' + id).value.trim(),
    email: document.getElementById('fanEditEmail_' + id).value.trim().toLowerCase(),   // ר' §221
    isSubscriber: isSub,
    verifiedSport: isSub ? document.getElementById('fanEditSport_' + id).value : null,
    subscriberSection: isSub ? document.getElementById('fanEditGate_' + id).value.trim() : null,
    subscriberTier:    isSub ? (document.getElementById('fanEditTier_' + id).value || null) : null, // §318
    subscriberNumber: isSub ? document.getElementById('fanEditSubNum_' + id).value.trim() : null,
    wasSubscriber: isSub ? null : document.getElementById('fanEditWasSub_' + id).value,
    // §321 — ללא תנאי isSub. הניסוח הקודם (`isSub ? null : ...`) מחק את הקישור של כל מנוי.
    facebookUrl: document.getElementById('fanEditFbUrl_' + id).value.trim() || null,
    instagramUrl: document.getElementById('fanEditInstagram_' + id).value.trim() || null,
  };
  // §340 — אותה אזהרה בדיוק שכבר עומדת על שדות-הקישור של העסק. נתיב-העריכה הזה הוא הדרך
  // השנייה שבה ערך-שאינו-כתובת נכנס לרשומת אוהד (הראשונה, הטופס, נחסמה בצד הנרשם), והוא
  // מסוכן יותר: מנהל שמתקן ידנית קישור שבור עלול להקליד את שם-הפרופיל בדיוק כמו שהאוהד עשה.
  // אזהרה ולא חסימה — למנהל מותר לשמור ערך חלקי בכוונה, ובלבד שהוא יודע מה קורה לו בכרטיס.
  if (!confirmSuspectLink('facebook',  updates.facebookUrl,  'הפייסבוק של האוהד')) return;
  if (!confirmSuspectLink('instagram', updates.instagramUrl, 'האינסטגרם של האוהד')) return;
  const changedFields = f0 ? Object.keys(updates).filter(k => f0[k] !== updates[k]) : [];
  showSaving('שומר...');
  try {
    await updateDoc(doc(db, 'members', id), updates);
    const f = findFan(id);
    if (f) Object.assign(f, updates, { name: `${updates.firstName} ${updates.lastName}`.trim() || '—' });
    if (changedFields.length) {
      await logActivity('members', id, {
        type: 'adminEdit', title: `נערך: ${changedFields.join(', ')}`,
        detail: changedFields.map(k => `${k}: "${fmtActivityVal(f0[k])}" → "${fmtActivityVal(updates[k])}"`).join(' · '),
        field: changedFields[0], before: f0[changedFields[0]] ?? null, after: updates[changedFields[0]] ?? null,
      });
    }
    hideSaving(true);
    renderMainPreserveScroll();
  } catch (e) { console.error(e); hideSaving(false); alert('שגיאה בשמירה: ' + e.message); }
};

window.toggleFanVerified = async function(id, checked) {
  const f = findFan(id);
  if (!f) return;
  try {
    await updateDoc(doc(db, 'members', id), { adminVerified: checked });
    f.adminVerified = checked;
    await logActivity('members', id, {
      type: 'adminEdit', title: checked ? 'סומן כנבדק ואומת ע"י מנהל' : 'סימון "נבדק" בוטל',
      field: 'adminVerified', before: !checked, after: checked,
    });
    renderMain();
  } catch (e) { console.error(e); alert('שגיאה בשמירה: ' + e.message); }
};

// "אותו אדם, אשר" / "לא כפילות, נקה דגל" בפאנל שיפוט-מהיר של דגל-דדופ ("3 כל האוהדים.dc.html") —
// מנקה רק את הדגל (ואת duplicateOfId, אם היה), לא נוגעת ב-status. זהה בכוונה לתבנית שכבר הייתה קיימת
// ב-admin-members.html ("✓ סומן כנבדק", מנקה רק את הדגל) — לעולם לא לאשר חבר אוטומטית מכאן, ר'
// feedback_never_auto_decide_membership. אישור בפועל עדיין דורש לחיצה נפרדת על "✅ אשר" הרגיל.
// "כפילות, מחק" (בממשק) קורא ישירות ל-deleteFan הקיימת — אין לוגיקה חדשה. כללי לשני סוגי הדגל
// (name_mismatch הישן ו-possible_duplicate החדש, ר' fan-register.html).
window.resolveFanReviewFlagSamePerson = async function(id) {
  const f = findFan(id);
  if (!f || !f.reviewFlag) return;
  const prevFlag = f.reviewFlag;
  try {
    await updateDoc(doc(db, 'members', id), { reviewFlag: null, reviewFlagAt: null, duplicateOfId: null });
    f.reviewFlag = null;
    f.duplicateOfId = null;
    await logActivity('members', id, {

// בולק אמיתי — אותה צורת כתיבה כמו admin-members.html bulkApprove/bulkReject
window.bulkSetFanStatus = async function(status) {
  const ids = [...selectedFanIds];
  // אותו סיכום-אזהרה כמו באישור-המוני של עסקים (ר' bulkSetBizStatus)
  if (status === 'approved') {
    const suspects = ids.map(id => MOCK_FANS.find(x => x.id === id)).filter(f => f && f.status === 'pending' && emailDomainHit(f.email));
    if (suspects.length && !confirm(
      `${suspects.length} מהאוהדים שנבחרו עם כתובת מייל שנראית שגויה:\n\n` +
      suspects.map(f => `• ${f.name} — ${f.email} (כנראה ${emailDomainHit(f.email).suggested})`).join('\n') +
      `\n\nלכתובות כאלה קוד-הכניסה יסומן "נשלח" אבל לא יגיע לאף אחד.\n\nאישור = לאשר את כולם בכל זאת · ביטול = לא לאשר כלום, אתקן קודם`
    )) return;
  }
  selectedFanIds.clear();
  try {
    if (status === 'approved') {
      await Promise.all(ids.map(async id => {
        const f = MOCK_FANS.find(x => x.id === id);
        if (!f || f.status !== 'pending') return;
        const memberNumber = await allocateMemberNumber();
        const loginCode = await generateLoginCode();
        await saveLoginCode(id, loginCode);   // §248 — הקוד לאוסף הנפרד, לא על מסמך החבר
        await updateDoc(doc(db, 'members', id), {
          status: 'approved', approvedAt: serverTimestamp(), rejectedAt: null,
          memberNumber, loginCodeCreatedAt: serverTimestamp(), loginCodeEmailStatus: 'pending'
        });
      }));
    } else {
      await Promise.all(ids.map(id => {
        const f = MOCK_FANS.find(x => x.id === id);
        if (!f || f.status !== 'pending') return Promise.resolve();
        return updateDoc(doc(db, 'members', id), { status: 'rejected', rejectedAt: serverTimestamp() });
      }));
    }
  } catch (e) { console.error(e); alert('שגיאה בפעולה גורפת: ' + e.message); }
};
