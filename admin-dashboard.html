          ${field('גלריה', (b.photos&&b.photos.length)?`${b.photos.length} תמונות`:'', !(b.photos&&b.photos.length))}
          ${field('סרטונים', (b.videos&&b.videos.length)?`${b.videos.length} סרטונים`:'', !(b.videos&&b.videos.length))}
        </div>

        <div class="form-sec-title">שלב 5 · אימות בעל העסק</div>
        <div class="form-grid">
          ${field('שם מלא', [b.ownerFirst,b.ownerLast].filter(Boolean).join(' '), !(b.ownerFirst||b.ownerLast))}
          ${field('טלפון', b.ownerPhone, !b.ownerPhone)}
          ${field('אימייל', b.ownerEmail, !b.ownerEmail)}
          ${field('קרבה לבעל המנוי', RELATION_LABELS_MOCK[b.ownerRelation]||b.ownerRelation||'', !b.ownerRelation)}
          ${field('מנוי מכבי', b.ownerIsSubscriber?'כן':'לא · אימות ידני', false)}
          ${field('שער / מספר מנוי', b.ownerIsSubscriber?[b.ownerSubscriberSection,b.ownerSubscriberNumber].filter(Boolean).join(' / '):'', !b.ownerIsSubscriber)}
        </div>

        <div class="form-sec-title">סיכום ושליחה</div>
        <div class="form-grid">
          ${field('הודעה שהעסק כתב לצוות', b.note, !b.note, true)}
          ${field('תקנון', b.agreedTermsAt?`אושר · ${fmtDate(b.agreedTermsAt)}`:'', !b.agreedTermsAt)}
        </div>
      </div>
    </div>`;
}

function bizFullDetailHtml(id, opts) {
  const b = findBiz(id);
  if (!b) return `<div class="placeholder-note">עסק לא נמצא</div>`;
  const o = Object.assign({ backFn: 'bizBackToList' }, opts || {});
  initEditTagsState(id); // מכין את בורר התגיות של שלב 3 מראש, כי הוא מרונדר תמיד (גם אם מוסתר)

  // קוד כניסה — זהה למה שנוסף היום ב-admin-businesses.html. לינק-דשבורד/תקנון/סטטוס-מייל עברו
  // לתצוגה ישירה בכרטיס-הזהות למטה (idDashBtn/idTermsNote/idEmailNote) — לא chip-ים נפרדים יותר.
  if (ownerLoginCodeCache[b.id] === undefined) fetchOwnerLoginCode(b);
  const ownerLoginCode = ownerLoginCodeCache[b.id];

  const catMeta = CATEGORIES.find(c => c.key === b.catKey);
  // תגית שנייה וקטגוריה שנייה ("מופיע גם תחת") — שתיהן עוברות אישור מנהל ייעודי. האישור/דחייה עצמם
  // מוצגים היום בכרטיס-שיפוט-מהיר (quickJudgmentHtml, §130) — לא בתצוגה נפרדת כאן, כדי לא לכפול פעולה.
  const alsoCatSuggestionMeta = (b.alsoCategorySuggestion && b.alsoCategorySuggestion !== b.alsoUnderCategory)
    ? CATEGORIES.find(c => c.key === b.alsoCategorySuggestion) : null;
  // הצעת תגית חדשה חופשית (tagSuggestion) — נפרד לגמרי מ-tagSecondSuggestion (זו הצעה לתגית שלא קיימת
  // בכלל ברשימה הנעולה, לא בחירה בין תגיות קיימות). מוצג באותו דפוס תיבת-התרעה + פעולות ישירות מהכרטיס.
  const tagFreeSuggestionMapOpen = tagQueueMapping === b.id;
  const tagFreeSuggestionCatPicking = tagQueueNewCatPicking === b.id;
  const tagFreeSuggestionPool = TAGS_BY_CATEGORY_MOCK[b.catKey] || [];
  const tagFreeSuggestionCatOptions = CATEGORIES.map(c => `<option value="${c.key}" ${b.catKey===c.key?'selected':''}>${c.icon} ${c.label}${b.catKey===c.key?' (הקטגוריה של העסק)':''}</option>`).join('');
  const tagFreeSuggestionEditingOpen = tagSuggestionEditing === b.id;
  const tagFreeSuggestionHtml = b.tagSuggestion
    ? `<div class="tag-suggestion-alert">${tagFreeSuggestionEditingOpen ? `
        🆕 העסק הציע תגית חדשה:
        <div class="tagmgmt-inline-form" style="margin-top:6px">
          <input type="text" id="tagSuggestionEditInput_${b.id}" value="${esc(b.tagSuggestion)}" maxlength="40" style="flex:1">
          <button class="act-btn approve tiny" onclick="saveTagSuggestionEdit('${b.id}')">💾 שמור</button>
          <button class="act-btn tiny" onclick="cancelTagSuggestionEdit()">ביטול</button>
        </div>` : `
        🆕 העסק הציע תגית חדשה: "${b.tagSuggestion}"
        <button class="act-btn tiny" onclick="startTagSuggestionEdit('${b.id}')">✏️ ערוך</button>
        ${tagFreeSuggestionMapOpen ? `
        <div class="tagmgmt-inline-form" style="margin-top:6px">
          <select id="tagQueueMapSelect_${b.id}">
            ${tagFreeSuggestionPool.map(t => `<option value="${t.replace(/"/g,'&quot;')}">${t}</option>`).join('')}
          </select>
          <button class="act-btn approve tiny" onclick="confirmMapTagSuggestion('${b.id}')">אישור מיפוי</button>
          <button class="act-btn tiny" onclick="cancelMapTagSuggestion()">ביטול</button>
        </div>` : tagFreeSuggestionCatPicking ? `
        <div class="tagmgmt-inline-form" style="margin-top:6px">
          <span style="font-size:11px;color:var(--text-sm)">תחת איזו קטגוריה?</span>
          <select id="tagNewCatSelect_${b.id}">${tagFreeSuggestionCatOptions}</select>
          <button class="act-btn approve tiny" onclick="confirmApproveTagSuggestionNewCat('${b.id}')">✅ הוסף ואשר</button>
          <button class="act-btn tiny" onclick="cancelNewCatPicking()">ביטול</button>
        </div>` : `
        <div class="suggestion-actions">
          <button class="act-btn approve tiny" onclick="startNewCatPicking('${b.id}')">✅ אשר כתגית חדשה</button>
          <button class="act-btn tiny" onclick="startMapTagSuggestion('${b.id}')">🔀 מפה לקיימת</button>
          <button class="act-btn reject tiny" onclick="rejectTagSuggestion('${b.id}')">✗ דחה</button>
        </div>`}`}
      </div>`
    : '';
  const types = b.bizTypes || [];
  const isPhysical = types.includes('physical');
  const isOnline = types.includes('online');
  const isPro = types.includes('pro');
  const typeLabels = types.map(t => BIZ_TYPE_LABELS_MOCK[t]).filter(Boolean).join(' · ') || '—';
  const allDiscounts = [{ text: b.discountFullText, redeemMode: b.discountRedeemMode }].concat(b.additionalDiscounts || []);
  const branchesHtml = (b.branches && b.branches.length)
    ? b.branches.map(br => `${br.city} — ${br.address}`).join('<br>')
    : 'אין סניפים נוספים';
  // flagChips/statusActions הוזזו ל-bizDecisionPanelHtml (§148, 2026-08-04) — נמחקו מכאן, לא בשימוש יותר בהקשר הזה.

  // ── שדות עריכה (מוכנים תמיד, מוסתרים ב-CSS עד "✏️ ערוך") ──
  const alsoCatOptions = CATEGORIES.filter(c => c.key !== b.catKey)
    .map(c => `<option value="${c.key}" ${b.alsoUnderCategory===c.key?'selected':''}>${c.icon} ${c.label}</option>`).join('');
  const branch = (b.branches && b.branches[0]) || { city: '', address: '' };
  const proRegionsChecks = REGIONS_MOCK.map(r => `<label><input type="checkbox" class="edit-proregion-${b.id}" value="${r}" ${(b.regions||[]).includes(r)?'checked':''}> ${r}</label>`).join('');
  // בחירה מרובה אמיתית (checkboxes, לא select) — עסק יכול לתמוך בכמה מקומות-מימוש בו-זמנית לאותה
  // הטבה (למשל גם "בחנות הפיזית" וגם "באתר" עם קוד קופון). ר' PROJECT_CONTEXT.md §182/§183.
  const redeemChecks = (suffix, val) => {
    const selected = toRedeemArr(val);
    return Object.keys(REDEEM_MODE_LABELS_MOCK).map(k =>
      `<label style="display:inline-flex;align-items:center;gap:5px;margin-inline-end:14px;font-weight:400;cursor:pointer"><input type="checkbox" class="edit-redeem-${suffix}-${b.id}" value="${k}" ${selected.includes(k)?'checked':''} ${k==='online'?`onchange="toggleAdminCouponWrap('${suffix}','${b.id}')"`:''}> ${REDEEM_MODE_LABELS_MOCK[k]}</label>`
    ).join('');
  };
  // קוד הקופון עצמו — נגלה רק כש"באתר" מסומן, בדיוק כמו business.html/business-dashboard.html/
  // admin-businesses.html. עד עכשיו המסך הזה לא הציג/אפשר לערוך את הקוד בכלל (§183 — נוסף לפי בקשת המשתמש).
  const couponWrap = (suffix, code, checkedOnline) => `
    <div class="edit-coupon-wrap" id="editCouponWrap-${suffix}-${b.id}" style="display:${checkedOnline?'block':'none'};margin-top:8px">
      <label style="font-size:12px;color:var(--text-sm,#9aa4b5);display:block;margin-bottom:4px">קוד קופון <span style="font-weight:400">(מה שבעל העסק הזין)</span></label>
      <input type="text" id="edit_coupon_${suffix}_${b.id}" value="${esc(code||'')}" style="text-transform:uppercase;letter-spacing:1px" placeholder="לדוג׳: MACCABI10">
    </div>`;
  const d2 = (b.additionalDiscounts && b.additionalDiscounts[0]) || { text:'', redeemMode:[], code:'' };
  const d3 = (b.additionalDiscounts && b.additionalDiscounts[1]) || { text:'', redeemMode:[], code:'' };

  // כל פריטי השינוי הממתינים, מקובצים לפי שלב — משמש לצביעת כותרת השלב למטה ולסימון-שדה-שהשתנה
  // בטופסי העריכה (stepChangedField/stepFieldWas, §131). המשתמש: "תצבע לי את השלב ואת השדה שמבוקש לשינוי".
  const pendingChangeItems = bizPendingChangeItems(b);
  const changeItemsBySection = {};
  pendingChangeItems.forEach(it => { (changeItemsBySection[it.section] = changeItemsBySection[it.section] || []).push(it); });

  // secTitle() (כותרת-שלב הישנה) הוסרה — כל 5 השלבים הומרו ל-step-block (§131-135), אין יותר קורא.

  // ── כרטיס-זהות (ראש הכרטיס) — סגנון-מוקאפ, שלב 2 מתוך §127 בהמשך ל-bizRowsHtml/fanRowsHtml.
  // בדיוק אותו classifyAction()+class-badge/treat-badge כמו בשורת הרשימה (ר' bizRowsHtml), עם וריאנט .lg.
  // status-actions (אשר/דחה/מחק) לא הועברו לכאן — במוקאפ הן חלק מכרטיס-שיפוט-מהיר, השלב הבא בתור.
  const idCls = classifyAction(b, 'business');
  const idPrimaryLabel = b.status === 'rejected' ? '✗ נדחה' : idCls.primary;
  const idBadges = [`<span class="class-badge lg${idPrimaryLabel === 'מאושר · אין פעולה' ? ' neutral' : ''}">${esc(idPrimaryLabel)}</span>`]
    .concat(idCls.treatments.map(t => `<span class="treat-badge lg">${TREATMENT_LABELS[t]}</span>`));
  const idDates = [
    b.status === 'approved' ? `באינדקס מ-${fmtDate(b.approvedAt || b.registeredAt)}`
      : b.status === 'rejected' ? `נדחה ${fmtDate(b.rejectedAt || b.registeredAt)}`
      : `נרשם ${fmtDate(b.registeredAt)} · ממתין ${agoLabel(b.registeredAt)}`,
    b.pendingChangeDiff ? `הבקשות נשלחו ${agoLabel(b.changeSubmittedAt || b.registeredAt)}` : ''
  ].filter(Boolean).join(' · ');
  const idCity = (b.branches && b.branches[0] && b.branches[0].city) || '';
  const idTagsHtml = [
    catMeta ? `<span>${catMeta.icon} ${esc(catMeta.label)}</span>` : '',
    (typeLabels && typeLabels !== '—') ? `<span>${esc(typeLabels)}${idCity ? ' · ' + esc(idCity) : ''}</span>` : (idCity ? `<span>${esc(idCity)}</span>` : ''),
    ownerLoginCode ? `<span>קוד כניסה ${esc(ownerLoginCode)}</span>` : ''
  ].filter(Boolean).join('');
  const idWaBtn = b.ownerPhone ? `<button class="btn-id-wa" onclick="sendBizWA('${b.id}','${b.ownerPhone}','${b.ownerFirst}','${b.name}','${b.accessToken||''}')">וואטסאפ</button>` : '';
  const idMailBtn = b.ownerEmail ? `<button class="btn-id-mail" onclick="sendBizMail('${b.id}','${b.ownerEmail}','${b.ownerFirst}','${b.name}','${b.accessToken||''}')">מייל</button>` : '';
  const idDashBtn = b.accessToken ? `<a href="business-dashboard.html?token=${b.accessToken}" target="_blank" class="btn-id-dash">פתיחת דשבורד העסק</a>` : '';
  const idSubNote = b.ownerIsSubscriber
    ? `<div class="identity-note neutral"><div class="identity-note-h">מנוי מאומת</div><div class="identity-note-v">שער ${esc(b.ownerSubscriberSection||'—')} · מס' מנוי ${esc(b.ownerSubscriberNumber||'—')}</div></div>`
    : `<div class="identity-note warn"><div class="identity-note-h">מנוי לא מאומת</div><div class="identity-note-v">אומת בתמונה בשער + פייסבוק — דורש בדיקה ידנית</div></div>`;
  const idTermsNote = `<div class="identity-note neutral"><div class="identity-note-h">תקנון</div><div class="identity-note-v">${b.agreedTermsAt ? `אושר ${fmtDate(b.agreedTermsAt)}` : 'טרם אושר'}</div></div>`;
  const idEmailNote = b.status === 'approved'
    ? `<div class="identity-note ${b.ownerEmailStatus === 'failed' ? 'warn' : 'neutral'}"><div class="identity-note-h">מייל אישור</div><div class="identity-note-v">${b.ownerEmailStatus === 'sent' ? 'נשלח עם לינק לדשבורד' : b.ownerEmailStatus === 'failed' ? 'שליחה נכשלה' : 'ממתין לשליחה'}</div></div>`
    : '';
  // §147 — הערת-עסק (b.note) הייתה מוצגת רק בתוך "שיפוט מהיר" (ונעלמת לגמרי אם אין הערה בכלל, או
  // מתכווצת אם כבר טופלה) — המשתמש דיווח שזה "נעלם בשקט". תיבה קבועה כאן בכרטיס-הזהות, תמיד גלויה,
  // בנוסף לשורה ב-quickJudgmentHtml (לא במקומה) — כדי שאי-אפשר יהיה לפספס שאין/יש הערה.
  const idNoteBox = !b.note
    ? `<div class="identity-note neutral"><div class="identity-note-h">הערה מהעסק</div><div class="identity-note-v">לא נכתבה הערה בהרשמה</div></div>`
    : `<div class="identity-note ${b.noteHandled ? 'neutral' : 'warn'}"><div class="identity-note-h">הערה מהעסק${b.noteHandled ? ' (טופלה)' : ''}</div><div class="identity-note-v">"${esc(b.note)}"</div></div>`;
  const identityCardHtml = `
    <div class="dcard identity-card">
      <div class="identity-top">
        <div style="flex:1;min-width:220px">
          <div class="identity-badges">${idBadges.join('')}</div>
          <div class="identity-dates">${idDates}</div>
          <div class="identity-name-row" id="idNameViewRow_${b.id}">
            <div class="identity-name">${esc(b.name)}</div>
            <button type="button" class="identity-name-edit-btn" onclick="toggleBizNameEdit('${b.id}')" title="שינוי שם העסק">✏️</button>
          </div>
          <div class="identity-name-edit" id="idNameEditRow_${b.id}" style="display:none">
            <input type="text" id="idNameInput_${b.id}" value="${esc(b.name)}">
            <button type="button" class="act-btn approve tiny" onclick="saveBizName('${b.id}')">שמירה</button>
            <button type="button" class="act-btn tiny" onclick="toggleBizNameEdit('${b.id}')">ביטול</button>
          </div>
          <div class="identity-contact">${esc(bizMetaStr(b))}${b.ownerPhone ? ` · <span class="k">${esc(b.ownerPhone)}</span>` : ''}${b.ownerEmail ? ` · ${esc(b.ownerEmail)}` : ''}</div>
          <div class="identity-tags">${idTagsHtml}</div>
        </div>
        <div class="identity-actions">
          ${(idWaBtn || idMailBtn) ? `<div class="identity-actions-row">${idWaBtn}${idMailBtn}</div>` : ''}
          ${idDashBtn}
        </div>
      </div>
      <div class="identity-notes">${idSubNote}${idTermsNote}${idEmailNote}${idNoteBox}</div>
    </div>`;

  const anchorCardHtml = b.status === 'approved' ? `
    <div class="dcard anchor-card">
      <div class="anchor-head"><div class="anchor-head-title">📍 המיקום באינדקס</div></div>
      <div class="anchor-list">${bizAnchorLocationsHtml(b)}</div>
      ${sectionFlagsControlHtml(b)}
    </div>` : '';

  // ── שלב 1 — בעל העסק, ראשון להומר לסגנון step-block (§131, "שלב אחד בכל פעם"). שלבים 3-5 עדיין בסגנון-הישן.
  const step1Sub = [
    ([b.ownerFirst, b.ownerLast].filter(Boolean).join(' ') || '—'),
    b.ownerIsSubscriber ? `מנוי · שער ${b.ownerSubscriberSection || '—'}` : 'לא מנוי',
    b.ownerRelation ? `קרבה: ${RELATION_LABELS_MOCK[b.ownerRelation] || b.ownerRelation}` : ''
  ].filter(Boolean).join(' · ');
  // ── שלב 2 — פרטי העסק (הכי גדול מבין ה-5). stepChangedField/stepFieldWas/stepFieldHtml משותפים
  // לכל השלבים-שהומרו (בשימוש גם בשלב 4, §134) — נפרדים לגמרי מ-fieldChangeClass/fieldChangeHintHtml
  // המקוריות (עדיין קיימות, לא נגעתי בהן, לא בשימוש יותר אחרי שגם שלב 4 הומר).
  const step2Changes = changeItemsBySection[2] || [];
  const step2Reviewed = !!(b.reviewedSections && b.reviewedSections[2]);
  const step2Sub = [
    typeLabels,
    isPhysical ? ((b.branches && b.branches.length > 1) ? `${b.branches.length} סניפים` : (branch.city || '—')) : isOnline ? (b.websiteOnline || '—') : isPro ? ((b.regions && b.regions.length) ? b.regions.join(', ') : '—') : ''
  ].filter(Boolean).join(' · ');
  const stepChangedField = (field) => pendingChangeItems.some(x => x.field === field);
  const stepFieldWas = (field) => {
    const it = pendingChangeItems.find(x => x.field === field && x.old !== undefined);
    return it ? `<div class="step-field-was">היה ${esc(String(it.old))}</div>` : '';
  };
  const stepFieldHtml = (field, label, fieldHtml, full) => `
    <div class="step-field${full ? ' full' : ''}">
      <div class="step-field-h${stepChangedField(field) ? ' changed' : ''}">${label}${stepChangedField(field) ? '<span class="field-changed-tag">מבוקש שינוי</span>' : ''}</div>
      ${fieldHtml}
      ${stepFieldWas(field)}
    </div>`;
  // ── שלב 3 — קטגוריה ותגיות. editTagsAreaHtml/tagFreeSuggestionHtml נשארו בדיוק כמו שהיו (state-מורכב,
  // לא נגעתי בפנים) — רק המיקום שבו הם מוצגים עבר מ-secView3 (שנעלם) ל-secEdit3 (§131).
  const step3TreatLabel = idCls.treatments.includes('tag') ? 'בקשת תגית' : idCls.treatments.includes('category') ? 'בקשת קטגוריה' : '';
  // step3Changes — שינוי-שדה ישיר דרך pendingChanges (למשל categoryPrimary/tags) בלי treatment-badge

// ── עריכה per-שלב: toggle ישיר של show/hide (בלי רינדור-מחדש), זהה בהיגיון ל-toggleSecEdit ב-admin-businesses.html ──
window.toggleBizSecEdit = function(id, n) {
  const view = document.getElementById('secView'+n+'_'+id);
  const edit = document.getElementById('secEdit'+n+'_'+id);
  const stepBlock = document.getElementById('stepBlock'+n+'_'+id); // קיים רק לשלבים שכבר הומרו לסגנון step-block (§131) — null-safe לשאר
  if (!edit) return;
  const opening = !edit.classList.contains('open');
  if (stepBlock) {
    stepBlock.classList.toggle('open', opening);
    const editBtn = document.getElementById('stepEditBtn'+n+'_'+id);
    if (editBtn) {
      editBtn.textContent = opening ? 'סגירה' : 'עריכה';
      editBtn.className = opening ? 'btn-step-close' : 'btn-step-edit';
    }
  }
  // שלב 3 (תגיות) תלוי ב-state גלובלי (editSelectedTags) שיכול "להידבק" מעריכה קודמת שבוטלה בלי שמירה —
  // מאתחלים ומרנדרים מחדש בכל טוגל (פתיחה וגם סגירה) כדי שיהיה תמיד עקבי עם b.tags/b.tagSecondSuggestion בפועל.
  if (n === 3) {
    initEditTagsState(id);
    rerenderEditTagsArea(id);
  }
  edit.classList.toggle('open', opening);
  if (view) view.style.display = opening ? 'none' : '';
};

// סימון "נסקר" — עכשיו שדה אמיתי (businesses/{id}.reviewedSections, מפה {1:bool,...}) — נכתב מיד בכל טוגל
window.toggleSecReviewed = async function(id, n, checked) {
  const b = findBiz(id);
  if (!b) return;
  const reviewedSections = { ...(b.reviewedSections || {}), [n]: checked };

};

// זהה ל-saveSectionUpdates ב-admin-businesses.html — כותב Firestore אמיתי (רק שדות אמיתיים, לא שדות
// תאימות-תצוגה כמו hoursText/catKey/isOnline). מעדכן את המטמון המקומי מיידית דרך hydrateBiz מחדש —
// כך שדות התצוגה הנגזרים מתעדכנים באותה לוגיקה בדיוק כמו בטעינה הראשונית, בלי לכתוב אותם ל-Firestore.
// שדות-עזר טכניים (timestamps נלווים) — לא "שינוי" בפני עצמו בעיני המנהל, מדולגים ביומן.
// reviewedSections — סימון "נסקר" פר-שלב (toggleSecReviewed) הוא בדיקת-עצמי שקטה של המנהל, לא "שינוי"
// שמישהו אחר צריך לדעת עליו — לחיצה על הצ'קבוקס בכל שלב הייתה יוצרת רעש ביומן (המשתמש: "אני לא בטוח
// שזה חשוב"), בלי גם ערך קריא (אובייקט, לא מחרוזת). מדולג בכוונה.
const SAVE_LOG_SKIP_FIELDS = new Set(['noteHandledAt', 'noteOwnerAckAt', 'pendingChangesAt', 'reviewedSections']);
function fmtActivityVal(v) {
  if (v == null || v === '') return '—';
  if (Array.isArray(v)) return v.length ? v.join(', ') : '—';
  if (typeof v === 'object') return v.toDate ? fmtDate(v.toDate()) : (v instanceof Date ? fmtDate(v) : '(אובייקט)');
  return String(v);
}
// 🐛 4 ניסיונות קודמים לתקן קפיצת-גלילה ע"י *שחזור* המיקום אחרי renderMain() נכשלו בפועל (scrollY
// גולמי / עוגן-לקצה-הפאנל / drawer.scrollTop / עוגן-לאלמנט-ספציפי) — כולם ניסו לתקן תוצאה של הרס,
// לא את ההרס עצמו. renderMain() תמיד בונה מחדש innerHTML *שלם* של #tabContent — כולל .task-drawer
// (שיש לו overflow-y:auto, גלילה-פנימית) או bizDetailCol/fanDetailCol עצמם, כלומר ה-container הגלילי
// *נהרס ונבנה מחדש בכל שמירה* — אין לדפדפן שום "זיכרון" scrollTop לשמר על אלמנט שכבר לא קיים, וכל
// ניסיון-שחזור הוא מרוץ-תזמון (requestAnimationFrame מול layout/paint) שלא אמין ב-100% מהמקרים.
// הפתרון האמיתי: לא להרוס את ה-container הגלילי בכלל. refreshOpenDetailPanel() מעדכן ישירות רק את
// ה-innerHTML *של מה שבתוך* הפאנל הפתוח (.task-drawer-body / bizDetailCol / fanDetailCol עצמם) —
// ה-container שיש לו overflow/scrollTop נשאר אותו אלמנט DOM בדיוק, אז אין בכלל "קפיצה" לתקן.
function refreshOpenDetailPanel() {
  // blur() מפורש לפני ההחלפה — מניע אפשרי-נוסף (אלמנט ממוקד שנהרס יכול לגרור גלילה-לתצוגה
  // בחלק מהדפדפנים) — לא אומת כשורש-הבעיה בפועל (השורש האמיתי היה onSnapshot נפרד, ר' renderAllPreserveScroll
  // למטה), אבל נשאר כהגנה זולה ובטוחה.
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  const drawerBody = document.querySelector('.task-drawer-body');
  if (drawerBody && typeof selectedTaskKey !== 'undefined' && selectedTaskKey) {
    drawerBody.innerHTML = taskDetailHtml2(selectedTaskKey);
    return true;
  }
  const bizCol = document.getElementById('bizDetailCol');
  if (bizCol && typeof selectedBizDetailId !== 'undefined' && selectedBizDetailId) {
    bizCol.innerHTML = bizFullDetailHtml(selectedBizDetailId);
    return true;
  }
  const fanCol = document.getElementById('fanDetailCol');
  if (fanCol && typeof selectedFanDetailId !== 'undefined' && selectedFanDetailId) {
    fanCol.innerHTML = fanFullDetailHtml(selectedFanDetailId);
    return true;
  }
  return false; // אף פאנל-פרטים פתוח — נופל ל-renderMain() מלא, בטוח בכל הקשר אחר
}
function renderMainPreserveScroll() {
  if (!refreshOpenDetailPanel()) renderMain();
}

async function saveSectionUpdates(id, updates) {
  const b = findBiz(id);
  const beforeVals = {};
  if (b) Object.keys(updates).forEach(k => { beforeVals[k] = b[k]; });
  showSaving('שומר...');
  try {
    await updateDoc(doc(db, 'businesses', id), updates);
    if (b) {
      Object.assign(b, updates);
      Object.assign(b, hydrateBiz(id, b));
    }
    // 16 קריאות ל-saveSectionUpdates בקובץ (סעיפים 1-5, סימון-הערה-כטופלה, עריכת-תגית-מוצעת ועוד) —
    // מקום אחד מרכזי לרשום ביומן "מה נערך", בלי לגעת בכל קריאה בנפרד. ר' §1 במפרט.
    const fields = Object.keys(updates).filter(k => !SAVE_LOG_SKIP_FIELDS.has(k));
    if (fields.length) {
      const summary = fields.map(k => DIFF_FIELD_LABELS_MOCK[k] || k).join(', ');
      await logActivity('businesses', id, {
        type: 'adminEdit', title: `נערך: ${summary}`,
        detail: fields.map(k => `${DIFF_FIELD_LABELS_MOCK[k] || k}: "${fmtActivityVal(beforeVals[k])}" → "${fmtActivityVal(updates[k])}"`).join(' · '),
        field: fields[0], before: beforeVals[fields[0]] ?? null, after: updates[fields[0]] ?? null,
      });
    }
    hideSaving(true);
    renderMainPreserveScroll();
  } catch (e) { console.error(e); hideSaving(false); alert('שגיאה בשמירה: ' + e.message); }
}

// בתוך שלב 2 "פרטים ויצירת קשר" → עריכה. המשתמש ביקש גישה ישירה, בלי לפתוח את כל הטופס.

// יומן פעילות לעסק/אוהד — תת-אוסף businesses/{id}/activity או members/{id}/activity (לא מערך על
// המסמך, כדי שהיומן יגדל בלי הגבלה). קריטי: כל פעולת-ניהול (אישור/דחייה/עריכה/החלטת-תגית/עיגון/
// דגל-סקשן/לבבות/מייל/הערה) חייבת לקרוא לזה — בלעדיה התיעוד יוצא חלקי (ר' מפרט העברה §1).
// כשל בכתיבת היומן לא אמור לחסום את הפעולה העסקית עצמה (הכתיבה האמיתית כבר הצליחה) — רק נרשם ל-console.
async function logActivity(collectionName, entityId, entry) {
  try {
    await addDoc(collection(db, collectionName, entityId, 'activity'), {
      type: entry.type,
      title: entry.title || '',
      detail: entry.detail || '',
      field: entry.field ?? null,
      before: entry.before ?? null,
      after: entry.after ?? null,
      actorUid: CURRENT_ADMIN.uid,
      actorName: CURRENT_ADMIN.name,
      source: entry.source || 'admin',
      createdAt: serverTimestamp(),
    });

window.saveBizSec4 = async function(id) {
  const b = findBiz(id);
  if (!b) return;
  const discountFullText = document.getElementById('edit_discount_'+id).value.trim();
  // 🐛 באג-אמת שנמצא (2026-08-08): hasDiscount חושב *רק* מ-discountFullText — עסק עם הטבה אמיתית
  // (hasDiscount:true, discountText קצר עם תוכן) אבל בלי discountTextFull שמור (לא עבר קיצור-AI,
  // או עסק ישן) היה מאבד את ההטבה *כליל* בכל שמירה של שלב 4, גם אם המנהל רק שינה "מקום מימוש" —
  // כי התיבה הריקה גרמה ל-hasDiscount:false, ואז discountText/discountRedeemMode/additionalDiscounts
  // כולם נמחקים באותה שמירה (למטה). עכשיו נשמר "יש הטבה" גם אם יש כותרת-קצרה קיימת בלי תיאור-מלא.
  const hasDiscount = !!(discountFullText || b.discountText || b.aiShortTitle);
  // רשת ביטחון אחרונה — לא ניתן לשמור כותרת שחורגת בפועל מרוחב הכרטיס, גם אם המנהל הקליד/הדביק
  // משהו ארוך יותר ידנית (ensureFitsCard חותך בעדינות לגבול מילה, זהה ל-business-dashboard.html)
  const discountText = ensureFitsCard(bizAiTitleEdits[id] !== undefined ? bizAiTitleEdits[id] : (b.aiShortTitle || ''));
  const disc2Text = document.getElementById('edit_disc2_text_'+id).value.trim();
  const disc3Text = document.getElementById('edit_disc3_text_'+id).value.trim();
  const checkedRedeem = suffix => Array.from(document.querySelectorAll('.edit-redeem-'+suffix+'-'+id+':checked')).map(el => el.value);
  // קוד קופון נשמר רק כשהמקום שנבחר בפועל כולל "אונליין" — אחרת מנוקה, אותו עיקרון בדיוק כמו
  // business-dashboard.html (ר' ההערה שם), כדי לא להשאיר קוד ישן/לא-רלוונטי אחרי שהמנהל מבטל את "באתר".
  const couponFor = suffix => {
    const el = document.getElementById('edit_coupon_'+suffix+'_'+id);
    return checkedRedeem(suffix).includes('online') ? (el?.value.trim() || '') : '';
  };
  const redeem1 = checkedRedeem('1');
  const additionalDiscounts = [];
  if (disc2Text) additionalDiscounts.push({ text: disc2Text, redeemMode: checkedRedeem('2'), code: couponFor('2') });
  if (disc3Text) additionalDiscounts.push({ text: disc3Text, redeemMode: checkedRedeem('3'), code: couponFor('3') });
  const updates = {
    hasDiscount,
    discountText: hasDiscount ? discountText : '',
    discountTextFull: hasDiscount ? discountFullText : '',
    discountRedeemMode: hasDiscount ? redeem1 : [],
    discountCode: hasDiscount ? couponFor('1') : '',
    additionalDiscounts: hasDiscount ? additionalDiscounts : [],
  };
  await saveSectionUpdates(id, updates);
};


// ── בורר תגית ראשית+שנייה בטופס עריכה, כולל מנגנון האישור לתגית שנייה (זהה בהיגיון ל-admin-businesses.html) ──
// מאתחל את editSelectedTags/editSecondTagOpen כשנפתח טופס עריכה: תגיות מאושרות קיימות + הצעת תגית שנייה
// ממתינה (אם תקפה לקטגוריה הנוכחית ועדיין לא אושרה) מוצגת כבר מסומנת, כדי שאישור המנהל יהיה פשוט "שמור".
function initEditTagsState(id) {
  const b = findBiz(id);
  if (!b) return;
  const pool = TAGS_BY_CATEGORY_MOCK[b.catKey] || [];
  editSelectedTags = (b.tags || []).slice(0, 2);
  const liveSecond = editSelectedTags[1] || '';
  if (!editSelectedTags[1] && b.tagSecondSuggestion && b.tagSecondSuggestion !== liveSecond && pool.includes(b.tagSecondSuggestion)) {
    editSelectedTags[1] = b.tagSecondSuggestion;
  }
  // הטוגל נפתח כברירת מחדל רק אם יש כבר תגית שנייה *מאושרת בפועל* (liveSecond) — לא בגלל הצעה
  // ממתינה בלבד. פתיחה אוטומטית בגלל הצעה גרמה לתחושת "נסגר לי מיד" (המנהל לא ידע שהטוגל כבר
  // דלוק, ולחיצה ראשונה כיבתה אותו) — ההצעה עצמה עדיין מוצגת בתיבת התרעה עם אשר/דחה בלי לפתוח שום דבר.
  editSecondTagOpen = !!liveSecond;
}

function editTagsAreaHtml(b, catKey) {
  const pool = TAGS_BY_CATEGORY_MOCK[catKey] || [];
  const primaryChips = pool.map(t => `<div class="tag-chip selectable${editSelectedTags[0]===t?' selected':''}" onclick="selectPrimaryTag('${b.id}','${t.replace(/'/g,"\\'")}')">${t}</div>`).join('');
  const liveSecond = (b.tags || [])[1] || '';
  const suggestionHtml = (b.tagSecondSuggestion && b.tagSecondSuggestion !== liveSecond)
    ? `<div class="tag-suggestion-alert">💡 העסק ביקש תגית שנייה: "${b.tagSecondSuggestion}"</div>` : '';
  const freeSuggestionHtml = b.tagSuggestion
    ? `<div class="tag-suggestion-alert">🆕 העסק הציע תגית חדשה: "${b.tagSuggestion}"
        ${editSelectedTags.filter(Boolean).length >= 2
          ? ' — כבר נבחרו 2 תגיות, אי אפשר להוסיף עוד'
          : `<button class="act-btn approve tiny" onclick="addFreeSuggestionToPool('${b.id}','${catKey}')">➕ הוסף לרשימה ובחר (${(CATEGORIES.find(c=>c.key===catKey)||{}).label||catKey})</button>`}
      </div>`
    : '';
  const showSecondRow = !!editSelectedTags[0];
  const secondPool = pool.filter(t => t !== editSelectedTags[0]);
  const secondChips = secondPool.map(t => `<div class="tag-chip selectable${editSelectedTags[1]===t?' selected':''}" onclick="selectSecondTag('${b.id}','${t.replace(/'/g,"\\'")}')">${t}</div>`).join('');
  return `
    <div id="edit_tagsArea_${b.id}">
      <div class="tag-chip-list">${primaryChips || '<span class="tag-chip empty">אין תגיות מוגדרות לקטגוריה זו</span>'}</div>
      ${suggestionHtml}
      ${freeSuggestionHtml}
      ${showSecondRow ? `
      <div class="toggle-row">
        <span>תגית שנייה (אופציונלי)</span>
        <button type="button" class="toggle${editSecondTagOpen?' on':''}" onclick="toggleSecondTag('${b.id}')"></button>
      </div>
      ${editSecondTagOpen ? `<div class="tag-chip-list" style="margin-top:6px">${secondChips || '<span class="tag-chip empty">אין תגיות נוספות בקטגוריה זו</span>'}</div>` : ''}` : ''}
    </div>`;
}

function rerenderEditTagsArea(id) {
  const b = findBiz(id);
  const catKey = document.getElementById('edit_cat_'+id).value;
  const el = document.getElementById('edit_tagsArea_'+id);
  if (el) el.outerHTML = editTagsAreaHtml(b, catKey);
}

// ── סוג עסק בטופס עריכה — כל checkbox חושף/מסתיר רק את השדות הרלוונטיים לסוג הזה (ר' business-dashboard.html שלב 2) ──
window.onEditBizTypeChange = function(id) {
  const physicalCb = document.getElementById('edit_type_physical_'+id);
  const onlineCb   = document.getElementById('edit_type_online_'+id);
  const proCb      = document.getElementById('edit_type_pro_'+id);
  const isPhysical = physicalCb.checked;
  const isOnline   = onlineCb.checked;
  const isPro      = proCb.checked;
  const physicalEl = document.getElementById('edit_typePhysicalFields_'+id);
  const onlineEl   = document.getElementById('edit_typeOnlineFields_'+id);
  const proEl      = document.getElementById('edit_typeProFields_'+id);
  if (physicalEl) physicalEl.style.display = isPhysical ? 'block' : 'none';
  if (onlineEl) onlineEl.style.display = isOnline ? 'grid' : 'none';
  if (proEl) proEl.style.display = isPro ? 'block' : 'none';
  // 🐛 באג-אמת שנמצא (2026-08-08, המשתמש: "בוחר עוד סוג עסק וזה משתנה אבל לא מופיע"): ה-checkbox
  // עצמו מוסתר לגמרי (`.biz-type-card input { display:none }`, ר' CSS) — הסימון הוויזואלי היחיד
  // הוא מחלקת `.on` על ה-label העוטף, שהתחילה מ-render ראשוני (`types.includes(...)`) ומעולם לא
  // עודכנה בלחיצה. ה-checkbox בפועל *כן* השתנה (המצב הפנימי תקין, שמירה הייתה עובדת נכון) — פשוט
  // בלי שום משוב חזותי, בדיוק כמו הבאג הכללי עם כפתורי-שמירה שתוקן קודם באותו סשן.
  physicalCb.closest('.biz-type-card')?.classList.toggle('on', isPhysical);
  onlineCb.closest('.biz-type-card')?.classList.toggle('on', isOnline);
  proCb.closest('.biz-type-card')?.classList.toggle('on', isPro);
};

window.selectPrimaryTag = function(id, tag) {
  if (editSelectedTags[0] === tag) {
    editSelectedTags = [];
    editSecondTagOpen = false;
  } else {
    // 🐛 באג-אמת שנמצא (2026-08-08, המשתמש: "מוסיף מוחק משהו שם לא מסתדר לי"): אם התגית שנבחרת
    // עכשיו כראשית היא בדיוק אותה תגית שכבר הייתה שנייה — הקוד הישן פשוט שרשר `[tag, ...קודם]`
    // בלי לבדוק כפילות, ויצר [X,X]. שורת התגית-השנייה בכל זאת מסננת את הראשית מתוך ה-pool
    // (secondPool ב-editTagsAreaHtml), אז X "נעלם" משם ויזואלית — אבל עדיין שמור פנימית
    // כ-editSelectedTags[1], ונכתב בפועל כתגית כפולה בשמירה (saveBizSec3). אם התגית-השנייה
    // הקיימת זהה לזאת שנבחרת עכשיו כראשית — מנקים אותה, לא משכפלים.
    const nextSecond = editSelectedTags[1] === tag ? undefined : editSelectedTags[1];
    editSelectedTags = [tag, nextSecond].filter(Boolean);
  }
  rerenderEditTagsArea(id);
};

window.selectSecondTag = function(id, tag) {
  editSelectedTags[1] = (editSelectedTags[1] === tag ? undefined : tag);
  editSelectedTags = editSelectedTags.filter(Boolean);
  rerenderEditTagsArea(id);
};

window.toggleSecondTag = function(id) {
  editSecondTagOpen = !editSecondTagOpen;
  if (!editSecondTagOpen) editSelectedTags = editSelectedTags.slice(0, 1);
  rerenderEditTagsArea(id);
};

// "➕ הוסף לרשימה ובחר" בתוך טופס העריכה — מוסיף את ההצעה החופשית (tagSuggestion) לפול התגיות
// של הקטגוריה, ובוחר אותה מיד (ראשית אם ריקה, אחרת שנייה). לא מנקה b.tagSuggestion כאן —
// זה קורה רק בשמירה בפועל (saveBizSec3), בדיוק כמו tagSecondSuggestion.
// catKey מגיע מהקטגוריה שנבחרה *בפועל* בטופס העריכה כרגע (לא בהכרח b.catKey — יכול להשתנות באמצע
// עריכה דרך "קטגוריה ראשית" לפני שנשמר) — כדי שהתגית תתווסף לפול הנכון ותיבחר בהתאם.
window.addFreeSuggestionToPool = function(id, catKey) {
  const b = findBiz(id);
  if (!b || !b.tagSuggestion) return;
  const cat = catKey || b.catKey;
  const pool = TAGS_BY_CATEGORY_MOCK[cat] || (TAGS_BY_CATEGORY_MOCK[cat] = []);
  const tag = b.tagSuggestion;
  if (!pool.includes(tag)) pool.push(tag);
  if (!editSelectedTags[0]) editSelectedTags[0] = tag;
  else if (!editSelectedTags[1]) { editSelectedTags[1] = tag; editSecondTagOpen = true; }
  rerenderEditTagsArea(id);
};

// tab-aware בכוונה: הפונקציה הזו נקראת גם ממקומות מחוץ לטאב "כל העסקים" (למשל בורר הקהל
// במרכז ההודעות, שמשתמש באותם setBizXFilter/filterBizRows/toggleSelectAllBiz בדיוק) — ה-DOM-ים
// הספציפיים (#bizListCol וכו') לא קיימים שם, אז נופלים ל-renderMain מלא. ר' [[feedback_module_scope_onclick]]
// לדוגמה קודמת מאותה משפחת באג (תיקון תלוי-טאב).
function refreshBizList() {
  if (activeTab !== ALL_BIZ_KEY) { renderMain(); return; }
  const list = bizFilteredList();
  if (!list.find(b => b.id === selectedBizDetailId)) {
    selectedBizDetailId = list[0] ? list[0].id : null;
    const dc = document.getElementById('bizDetailCol');
    if (dc) dc.innerHTML = selectedBizDetailId ? bizFullDetailHtml(selectedBizDetailId) : `<div class="placeholder-note">לא נמצאו עסקים</div>`;
  }
  const el = document.getElementById('bizListRows');
  if (el) el.innerHTML = bizRowsHtml();
  const bar = document.getElementById('bizBulkBarWrap');
  if (bar) bar.outerHTML = bizBulkBarHtml();
  const selRow = document.getElementById('bizSelectAllRow');
  if (selRow) selRow.outerHTML = bizSelectAllRowHtml();
}

window.filterBizRows = function(v) {
  bizSearch = v;
  refreshBizList();
};

window.setBizStatusFilter = function(status) {
  bizStatusFilter = status;
  renderMain();
};

window.toggleBizSelect = function(id) {
  if (selectedBizIds.has(id)) selectedBizIds.delete(id); else selectedBizIds.add(id);
  refreshBizList();
};

window.toggleSelectAllBiz = function() {
  const ids = bizFilteredList().map(b => b.id);
  const allSelected = ids.length > 0 && ids.every(id => selectedBizIds.has(id));
  if (allSelected) ids.forEach(id => selectedBizIds.delete(id));
  else ids.forEach(id => selectedBizIds.add(id));
  refreshBizList();
};

// נקרא גם מטאב "שליחת הודעה" (לא רק "כל העסקים") — refreshBizList מעדכן DOM-ים שקיימים רק
// בטאב העסקים, אז כשקוראים מטאב אחר צריך renderMain מלא כדי שהתצוגה שם באמת תתעדכן.
window.clearBizSelection = function() {
  selectedBizIds.clear();
  if (activeTab === ALL_BIZ_KEY) refreshBizList(); else renderMain();
};

// בולק אמיתי — אותה צורת כתיבה כמו admin-businesses.html bulkApprove/bulkReject
window.bulkSetBizStatus = async function(status) {
  const ids = [...selectedBizIds];
  selectedBizIds.clear();
  try {
    if (status === 'approved') {
      await Promise.all(ids.map(async id => {
        const b = bizById(id);
        if (!b || b.status !== 'pending') return;
        await updateDoc(doc(db, 'businesses', id), { status: 'approved', approvedAt: serverTimestamp(), ownerEmailStatus: 'pending' });
        await approveLinkedMember(b);
      }));
    } else {
      await Promise.all(ids.map(id => {
        const b = bizById(id);
        if (!b || b.status !== 'pending') return Promise.resolve();
        return updateDoc(doc(db, 'businesses', id), { status: 'rejected', rejectedAt: serverTimestamp() });
      }));
    }
  } catch (e) { console.error(e); alert('שגיאה בפעולה גורפת: ' + e.message); }
};

function bizBulkBarHtml() {
  const count = selectedBizIds.size;

  return `

        <span>נבחרו ${count}</span>
        <span class="sp"></span>
        <button class="biz-bulk-btn approve" onclick="bulkSetBizStatus('approved')">✅ אשר נבחרים</button>
        <button class="biz-bulk-btn reject" onclick="bulkSetBizStatus('rejected')">✗ דחה נבחרים</button>

}

// כותרת+KPI תואמים ל-handoff (2026-08-04): כותרת דינמית לפי ספירת classifyAction!=מאושר,
// ולא עוד "סה״כ עסקים/ממתינים לאישור" קבועים — 3 מדדים אמיתיים: משימות פתוחות, זמן טיפול ממוצע
// (ממוצע אמיתי approvedAt-registeredAt על עסקים מאושרים, לא בדוי), עסקים באינדקס (מאושרים/סה״כ).
function bizOpenTasksCount() {
  return MOCK_BUSINESSES.filter(b => classifyAction(b, 'business').primary !== 'מאושר · אין פעולה').length;
}
function bizAvgHandlingHoursLabel() {
  const done = MOCK_BUSINESSES.filter(b => b.status === 'approved' && b.approvedAt && b.registeredAt);
  if (!done.length) return '—';
  const avgMs = done.reduce((sum, b) => sum + (b.approvedAt.getTime() - b.registeredAt.getTime()), 0) / done.length;
  return (avgMs / 3600000).toFixed(1);
}
function bizListHtml() {
  const list = bizFilteredList();
  if (selectedBizDetailId == null || !list.find(b => b.id === selectedBizDetailId)) {
    selectedBizDetailId = list[0] ? list[0].id : null;

        <div class="msg-kpi-sep"></div>
        <div><div class="msg-kpi-num">${approvedCount}<span class="msg-kpi-unit">/${MOCK_BUSINESSES.length}</span></div><div class="msg-kpi-label">עסקים באינדקס</div></div>

        <div class="task-list-rows" id="bizListRows">${bizRowsHtml()}</div>

// ══════════════════════════════════════════════════════════════════
// כל האוהדים — סטטיסטיקה + סינון + Master-Detail (מקביל ל"כל העסקים")
// ══════════════════════════════════════════════════════════════════

let fanSearch = '';
let fanStatusFilter = 'all';   // 'all' | 'pending' | 'approved' | 'rejected'
let fanSort = 'waitingTime';   // 'waitingTime' | 'newest' | 'oldest' | 'unverifiedFirst' | 'verifiedFirst' — תואם-handoff (2026-08-04)
let fanDateRangeFilter = 'all'; // 'all' | '7' | '30' | '90' (ימים אחורה מהיום)
let fanVerifyTypeFilter = 'all'; // 'all' | 'subscriber' | 'nonsubscriber' | 'owner' — דרופדאון "סוג אימות" תואם-handoff
// פילי-סיווג ראשיים תואמי-handoff, אותו עיקרון בדיוק כמו bizClassPill ("כל העסקים")
let fanClassPill = 'all';      // 'all' | 'pending' | 'unverified'
let selectedFanIds = new Set();
let selectedFanDetailId = null;
let fanMobileShowDetail = false;

window.setFanSort = function(v) { fanSort = v; renderMain(); };
window.setFanDateRangeFilter = function(v) { fanDateRangeFilter = v; renderMain(); };
window.setFanVerifyTypeFilter = function(v) { fanVerifyTypeFilter = v; renderMain(); };
window.setFanClassPill = function(v) { fanClassPill = v; renderMain(); };
window.clearFanFilters = function() {
  fanSearch = ''; fanStatusFilter = 'all'; fanSort = 'waitingTime'; fanDateRangeFilter = 'all'; fanVerifyTypeFilter = 'all'; fanClassPill = 'all';
  renderMain();
};

function fanClassCounts() {
  return {
    all: MOCK_FANS.length,
    pending: MOCK_FANS.filter(f => f.status === 'pending').length,
    unverified: MOCK_FANS.filter(f => !f.adminVerified).length,
  };
}
function fanFilteredList() {
  const q = fanSearch.trim();
  const now = Date.now();
  const list = MOCK_FANS.filter(f => {
    const matchF = fanStatusFilter === 'all' ? true : f.status === fanStatusFilter;
    const matchClass = fanClassPill === 'all' ? true
      : fanClassPill === 'pending' ? f.status === 'pending'
      : !f.adminVerified;
    const matchVerify = fanVerifyTypeFilter === 'all' ? true
      : fanVerifyTypeFilter === 'subscriber' ? f.isSubscriber
      : fanVerifyTypeFilter === 'nonsubscriber' ? !f.isSubscriber
      : !!f.isBusinessOwner;
    const matchQ = !q || f.name.includes(q) || f.phone.includes(q) || f.email.includes(q);
    const matchRange = fanDateRangeFilter === 'all' || (now - f.registeredAt.getTime()) <= Number(fanDateRangeFilter) * 86400000;
    return matchF && matchClass && matchVerify && matchQ && matchRange;
  });
  return list.sort((a, b) => {
    // "זמן המתנה" — ממתינים-לאישור קודם (הוותיק שבהם ראשון), אחריהם השאר לפי הכי-ותיק. אותו עיקרון כמו bizSort 'waitingLongest'
    if (fanSort === 'waitingTime') {
      const aP = a.status === 'pending', bP = b.status === 'pending';
      if (aP !== bP) return aP ? -1 : 1;
      return a.registeredAt - b.registeredAt;
    }
    if (fanSort === 'oldest') return a.registeredAt - b.registeredAt;
    if (fanSort === 'unverifiedFirst') return (a.adminVerified?1:0) - (b.adminVerified?1:0);
    if (fanSort === 'verifiedFirst') return (b.adminVerified?1:0) - (a.adminVerified?1:0);
    return b.registeredAt - a.registeredAt; // newest — ברירת מחדל
  });
}

function fanRowsHtml() {
  const shown = fanFilteredList();
  if (!shown.length) return `<div class="placeholder-note">לא נמצאו אוהדים</div>`;
  return shown.map(f => {
    // אותו עיקרון כמו bizRowsHtml — classifyAction() כמקור-אמת יחיד, status==='rejected' כחריג מקומי.
    const cls = classifyAction(f, 'fan');
    const primaryLabel = f.status === 'rejected' ? '✗ נדחה' : cls.primary;
    // תואם-handoff (2026-08-04): "טרם נבדק" הוא פיל-סינון בלבד (fanClassPill='unverified'), לא באדג׳
    // על כל שורה — הוסר מכאן כי זה הפך את הרשימה לצפופה/ארוכה-מדי (כמעט כל שורה קיבלה באדג׳ נוסף).
    const badges = [`<span class="class-badge${primaryLabel === 'מאושר · אין פעולה' ? ' neutral' : ''}">${esc(primaryLabel)}</span>`]
      .concat(cls.treatments.map(t => `<span class="treat-badge">${TREATMENT_LABELS[t]}</span>`));
    if (f.reviewFlag) badges.push(`<span class="warn-badge">שם לא תואם</span>`);
    if (f.isBusinessOwner) badges.push(`<span class="treat-badge">בעל עסק</span>`);
    const sel = selectedFanIds.has(f.id);
    const active = f.id === selectedFanDetailId;
    const metaBits = [
      f.isSubscriber ? 'מנוי' : 'לא מנוי',
      f.status === 'pending' ? `ממתין ${agoLabel(f.registeredAt)}` : (f.memberNumber ? `חבר ${f.memberNumber}` : '')
    ].filter(Boolean).join(' · ');
    return `
      <div class="task-row ${f.status} ${active?'active':''} ${sel?'selected':''}" onclick="selectFanDetail('${f.id}')">
        <div class="task-row-top">
          <div class="task-row-check" onclick="event.stopPropagation();toggleFanSelect('${f.id}')">${sel ? '✓' : ''}</div>
          <div class="task-row-name">${esc(f.name)}</div>
        </div>
        <div class="task-row-badges">${badges.join('')}</div>
        <div class="task-row-meta">${esc(metaBits)}</div>
      </div>`;
  }).join('');
}

window.selectFanDetail = function(id) {
  selectedFanDetailId = id;
  fanMobileShowDetail = true;
  const lr = document.getElementById('fanListRows');
  const dc = document.getElementById('fanDetailCol');
  const sp = document.getElementById('fanSplit');
  if (lr) lr.innerHTML = fanRowsHtml();
  if (dc) dc.innerHTML = fanFullDetailHtml(id);
  if (sp) sp.classList.add('mobile-show-detail');
};

window.fanBackToList = function() {
  fanMobileShowDetail = false;
  const sp = document.getElementById('fanSplit');
  if (sp) sp.classList.remove('mobile-show-detail');
};

function fanFullDetailHtml(id, opts) {
  const f = MOCK_FANS.find(x => x.id === id);
  if (!f) return `<div class="placeholder-note">אוהד לא נמצא</div>`;
  const o = Object.assign({ backFn: 'fanBackToList' }, opts || {});
  const linkedBiz = f.isBusinessOwner ? (findBiz(f.linkedBusinessId) || MOCK_BUSINESSES.find(b => b.ownerMemberId === f.id)) : null;
  // מחיקה עברה ל"החלטות ויומן" (fanDecisionPanelHtml, "מחיקת האוהד") — אותו עיקרון כמו bizDecisionPanelHtml.
  // שיפוט-מהיר לאוהד — מאחד 3 פעולות שהיו מפוזרות בכרטיס (דגל-דדופ/בדיקת-מנהל/אשר-דחה),
  // אותו עיקרון בדיוק כמו quickJudgmentHtml לעסק (§130) — "בדיקת מנהל" מוצג תמיד כ-item (לא רק pending).
  const fanQjRows = [];
  if (f.reviewFlag === 'name_mismatch') {
    fanQjRows.push(`
      <div class="qj-row">
        <div class="qj-row-label"><div class="qj-row-step">דגל אוטומטי</div><div class="qj-row-name">שם לא תואם</div></div>
        <div class="qj-row-value"><span class="qj-value-text">נרשם/ה עם טלפון שמופיע כבר ברשומה קודמת בשם אחר — יתכן דדופ-הרשמה. בדקו ידנית לפני שממשיכים לאישור.</span></div>
        <div class="qj-row-actions">
          <button class="qj-btn primary" onclick="resolveFanReviewFlagSamePerson('${f.id}')">אותו אדם, אשר</button>
          <button class="qj-btn reject" onclick="deleteFan('${f.id}')">כפילות, מחק</button>
        </div>
      </div>`);
  }
  fanQjRows.push(`
    <div class="qj-row">
      <div class="qj-row-label"><div class="qj-row-step">בדיקת מנהל</div><div class="qj-row-name">${f.adminVerified ? '✓ נבדק' : 'טרם נבדק'}</div></div>
      <div class="qj-row-value"><label class="sec-reviewed-toggle" style="font-size:12.5px"><input type="checkbox" ${f.adminVerified ? 'checked' : ''} onchange="toggleFanVerified('${f.id}', this.checked)"> סימון כנבדק ואומת ע"י מנהל</label></div>
    </div>`);
  const fanQjOpen = !qjCollapsedIds.has(f.id);
  const fanQjCardHtml = `
    <div class="qj-card">
      <div class="qj-header">
        <button class="qj-toggle" onclick="toggleQuickJudgment('${f.id}')">${fanQjOpen ? '▾' : '▸'}</button>
        <div class="qj-title" onclick="toggleQuickJudgment('${f.id}')">שיפוט מהיר</div>
        <span class="qj-count">${fanQjRows.length}</span>
        ${f.status === 'pending' ? `
        <div class="qj-header-actions">
          <button class="qj-btn-approve-app" title="שולח אוטומטית מייל אישור עם קוד כניסה (Brevo)" onclick="approveFan('${f.id}')">✅ אשר את האוהד</button>
          <button class="qj-btn-reject-app" onclick="rejectFan('${f.id}')">✗ דחה</button>
        </div>` : f.status === 'approved' ? `
        <div class="qj-header-actions">
          <button class="qj-btn-reject-app" onclick="rejectFan('${f.id}')">↩️ ביטול אישור — לממתין</button>
          <button class="qj-btn-reject-app" onclick="rejectApprovedFan('${f.id}')">✗ דחייה</button>
        </div>` : f.status === 'rejected' ? `
        <div class="qj-header-actions">
          <button class="qj-btn-approve-app" onclick="restoreFanToPending('${f.id}')">↩️ שחזור לממתין</button>
          <button class="qj-btn-approve-app" title="שולח אוטומטית מייל אישור עם קוד כניסה (Brevo)" onclick="approveFan('${f.id}')">✅ אשר בכל זאת</button>
        </div>` : ''}
      </div>
      ${fanQjOpen ? `<div class="qj-body">${fanQjRows.join('')}</div>` : ''}
    </div>`;

  // ── כרטיס-זהות — אותו עיקרון כמו bizFullDetailHtml (§127): classifyAction()+class-badge/treat-badge
  // משותפים עם fanRowsHtml, כדי ששורת-הרשימה וכרטיס-הפרטים תמיד יסכימו על הסיווג.
  const idCls = classifyAction(f, 'fan');
  const idPrimaryLabel = f.status === 'rejected' ? '✗ נדחה' : idCls.primary;
  const idBadges = [`<span class="class-badge lg${idPrimaryLabel === 'מאושר · אין פעולה' ? ' neutral' : ''}">${esc(idPrimaryLabel)}</span>`]
    .concat(idCls.treatments.map(t => `<span class="treat-badge lg">${TREATMENT_LABELS[t]}</span>`));
  if (f.reviewFlag === 'name_mismatch') idBadges.push(`<span class="warn-badge lg">שם לא תואם</span>`);
  const idDates = [
    `נרשם ${fmtDate(f.registeredAt)}`,
    f.status === 'pending' ? `ממתין ${agoLabel(f.registeredAt)}` : '',
    f.memberNumber ? `חבר מס' ${f.memberNumber}` : (f.status === 'pending' ? 'טרם הוקצה מספר חבר' : '')
  ].filter(Boolean).join(' · ');
  const idWaBtn = f.phone ? `<button class="btn-id-wa" onclick="sendFanWA('${f.id}','${f.phone}','${f.name}','${f.loginCode||''}')">וואטסאפ</button>` : '';
  const idMailBtn = f.email ? `<button class="btn-id-mail" onclick="sendFanMail('${f.id}','${f.email}','${f.name}','${f.loginCode||''}')">מייל</button>` : '';
  const idLoginNote = `<div class="identity-note neutral"><div class="identity-note-h">קוד כניסה</div><div class="identity-note-v">${(f.status === 'approved' && f.loginCode) ? esc(f.loginCode) : 'ייווצר אוטומטית באישור'}</div></div>`;
  const idBizNote = linkedBiz ? `<div class="identity-note neutral"><div class="identity-note-h">בעל עסק</div><div class="identity-note-v">${linkedBiz.accessToken ? `<a href="business-dashboard.html?token=${linkedBiz.accessToken}" target="_blank">🏪 ${esc(linkedBiz.name)}</a>` : esc(linkedBiz.name)}</div></div>` : '';
  const idSubNote = f.isSubscriber
    ? `<div class="identity-note neutral"><div class="identity-note-h">מנוי</div><div class="identity-note-v">שער ${esc(f.subscriberSection||'—')} · מס' ${esc(f.subscriberNumber||'—')}</div></div>`
    : `<div class="identity-note warn"><div class="identity-note-h">מנוי</div><div class="identity-note-v">לא מנוי כרגע${f.wasSubscriber === 'yes' ? ' (היה מנוי בעבר)' : ''}</div></div>`;
  const idEmailNote = (f.status === 'approved' && f.loginCode)
    ? `<div class="identity-note ${f.loginCodeEmailStatus === 'failed' ? 'warn' : 'neutral'}"><div class="identity-note-h">מייל קוד כניסה</div><div class="identity-note-v">${f.loginCodeEmailStatus === 'sent' ? 'נשלח' : f.loginCodeEmailStatus === 'failed' ? 'נכשל' : 'ממתין'}</div></div>`
    : '';
  const identityCardHtml = `
    <div class="dcard identity-card">
      <div class="identity-top">
        <div style="flex:1;min-width:220px">
          <div class="identity-badges">${idBadges.join('')}</div>
          <div class="identity-name">${esc(f.name)}</div>
          <div class="identity-contact">${f.phone ? `<span class="k">${esc(f.phone)}</span>` : ''}${f.phone && f.email ? ' · ' : ''}${f.email ? esc(f.email) : ''}</div>
          <div class="identity-dates">${idDates}</div>
        </div>
        ${(idWaBtn || idMailBtn) ? `<div class="identity-actions-row">${idWaBtn}${idMailBtn}</div>` : ''}
      </div>
      <div class="identity-notes">${idLoginNote}${idBizNote}${idSubNote}${idEmailNote}</div>
    </div>`;

  // כרטיס "פרטי ההרשמה" נפרד (2026-08-04, תואם-handoff — קודם היה טקסט-חופשי בתוך approve-card, לא
  // כרטיס-grid משלו). אותו טופס-עריכה בדיוק (fanView/fanEdit/toggleFanEdit/saveFanDetails) — רק המבנה
  // מסביבו השתנה. "🏪 בעל עסק" (היה שדה כפול) הוסר — כבר מוצג ב-idBizNote בכרטיס-הזהות.
  const registrationCardHtml = `
    <div class="dcard registration-card">
      <div class="steps-head">
        <div class="steps-head-title">פרטי ההרשמה</div>
        <button class="btn-step-edit" onclick="toggleFanEdit('${f.id}')">עריכה</button>
      </div>
      <div id="fanView_${f.id}" class="form-grid" style="padding:0 24px 20px">
        <div class="form-field"><div class="form-field-label">שם פרטי ומשפחה</div><div class="form-field-val">${esc(f.name)}</div></div>
        <div class="form-field"><div class="form-field-label">טלפון</div><div class="form-field-val">${esc(f.phone||'—')}</div></div>
        <div class="form-field"><div class="form-field-label">אימייל</div><div class="form-field-val">${esc(f.email||'—')}</div></div>
        <div class="form-field"><div class="form-field-label">מנוי בפועל</div><div class="form-field-val">${f.isSubscriber?'כן':'לא'}</div></div>
        <div class="form-field"><div class="form-field-label">היה מנוי בעבר</div><div class="form-field-val">${f.isSubscriber?'—':(f.wasSubscriber==='yes'?'כן':'לא')}</div></div>
        ${f.facebookUrl ? `<div class="form-field"><div class="form-field-label">קישור פייסבוק</div><div class="form-field-val"><a href="${esc(f.facebookUrl)}" target="_blank" rel="noopener">${esc(f.facebookUrl)}</a></div></div>` : ''}
        <div class="form-field full">
          <div class="form-field-label">תמונה בשער אוהדים</div>
          ${f.photoProofUrl
            ? `<a href="${esc(f.photoProofUrl)}" target="_blank" rel="noopener" class="fan-proof-photo" style="background-image:url('${esc(f.photoProofUrl)}')" title="לחצו להגדלה"></a>`
            : `<div class="fan-proof-photo empty">לא הועלתה תמונת הוכחה</div>`}
        </div>
      </div>
      <div id="fanEdit_${f.id}" class="sec-edit-form" style="padding:0 24px 20px">
        <div class="form-row-2">
          <div class="form-row" style="margin:0"><label>שם פרטי</label><input type="text" id="fanEditFirst_${f.id}" value="${esc(f.firstName || '')}" /></div>
          <div class="form-row" style="margin:0"><label>שם משפחה</label><input type="text" id="fanEditLast_${f.id}" value="${esc(f.lastName || '')}" /></div>
        </div>
        <div class="form-row-2" style="margin-top:10px">
          <div class="form-row" style="margin:0"><label>טלפון</label><input type="tel" id="fanEditPhone_${f.id}" value="${esc(f.phone || '')}" /></div>
          <div class="form-row" style="margin:0"><label>אימייל</label><input type="email" id="fanEditEmail_${f.id}" value="${esc(f.email || '')}" /></div>
        </div>
        <div class="form-row" style="margin-top:10px">
          <label>מנוי בפועל?</label>
          <select id="fanEditIsSub_${f.id}" onchange="onFanEditSubChange('${f.id}')">
            <option value="yes" ${f.isSubscriber ? 'selected' : ''}>כן, מנוי</option>
            <option value="no" ${!f.isSubscriber ? 'selected' : ''}>לא מנוי</option>
          </select>
        </div>
        <div id="fanEditSubFields_${f.id}" style="display:${f.isSubscriber ? 'grid' : 'none'};margin-top:10px" class="form-row-2">
          <div class="form-row" style="margin:0"><label>שער</label><input type="text" id="fanEditGate_${f.id}" value="${esc(f.subscriberSection || '')}" /></div>
          <div class="form-row" style="margin:0"><label>מס' מנוי</label><input type="text" id="fanEditSubNum_${f.id}" value="${esc(f.subscriberNumber || '')}" /></div>
        </div>
        <div id="fanEditNoSubFields_${f.id}" style="display:${f.isSubscriber ? 'none' : 'block'};margin-top:10px">
          <div class="form-row" style="margin:0 0 10px">
            <label>היה מנוי בעבר?</label>
            <select id="fanEditWasSub_${f.id}"><option value="yes" ${f.wasSubscriber==='yes'?'selected':''}>כן</option><option value="no" ${f.wasSubscriber!=='yes'?'selected':''}>לא</option></select>
          </div>
          <div class="form-row" style="margin:0"><label>קישור פייסבוק</label><input type="text" id="fanEditFbUrl_${f.id}" value="${esc(f.facebookUrl || '')}" /></div>
        </div>
        <div class="edit-btn-row" style="margin-top:12px">
          <button class="btn btn-reject" onclick="toggleFanEdit('${f.id}')" style="flex:none;padding:10px 18px">ביטול</button>
          <button class="btn btn-approve" onclick="saveFanDetails('${f.id}')" style="flex:1">💾 שמור</button>
        </div>
      </div>
    </div>`;
  const fanMainTabHtml = `
    ${fanQjCardHtml}
    ${identityCardHtml}
    ${registrationCardHtml}`;
  return `
    <button class="act-btn task-back-btn" onclick="${o.backFn}()">→ חזרה</button>
    <div class="action-tabs">
      <button class="action-tab ${fanDetailViewTab==='main'?'active':''}" onclick="setFanDetailTab('main')">פרטי האוהד</button>
      <button class="action-tab ${fanDetailViewTab==='decisions'?'active':''}" onclick="setFanDetailTab('decisions')">החלטות ויומן</button>
    </div>
    ${fanDetailViewTab === 'decisions' ? fanDecisionPanelHtml(f) : fanMainTabHtml}`;
}
// "החלטות על האוהד" — טאב שני, אותו דפוס בדיוק כמו bizDecisionPanelHtml (2026-08-04, בקשת המשתמש).
// "מחיקת האוהד" (היה actionsTop למעלה, "פעולה ראשית" בתוך פרטי-האוהד) עבר לכאן.
function fanDecisionPanelHtml(f) {
  return `
    <div class="decision-panel">
      <div class="decision-panel-pad">
        <div class="decision-panel-label">החלטות על האוהד</div>
        <div class="decision-hint-text">אישור מקצה מספר חבר וקוד כניסה, ושולח את מייל הקוד אוטומטית.</div>
        <button class="decision-remove-btn" onclick="deleteFan('${f.id}')">מחיקת האוהד</button>
      </div>
      <div class="decision-divider"></div>
      ${fanEmailHistoryHtml(f)}
      ${fanActivityHtml(f)}

// בדיקת-מנהל ידנית לאוהד — נפרד מ-status (אשר/דחה) ומ-reviewFlag האוטומטי, זמין בכל מקום שמציג כרטיס אוהד מלא
// (גם "אוהדים ממתינים" בדשבורד הראשי וגם "כל האוהדים") כי שניהם משתמשים באותו fanFullDetailHtml.
// adminVerified/adminNote לא היו קיימים בכלל בסכימת members האמיתית — הם שדות סקלריים חדשים, בטוחים
// להוספה (בלי התנגשות עם שדה קיים, לא נקראים משום קוד אחר באתר) — נוספו כאן לראשונה בפועל.
window.toggleFanEdit = function(id) {
  const view = document.getElementById('fanView_' + id);
  const edit = document.getElementById('fanEdit_' + id);
  if (!edit) return;
  const opening = !edit.classList.contains('open');
  edit.classList.toggle('open', opening);
  if (view) view.style.display = opening ? 'none' : '';
};
window.onFanEditSubChange = function(id) {
  const isSub = document.getElementById('fanEditIsSub_' + id).value === 'yes';
  const subEl = document.getElementById('fanEditSubFields_' + id);
  const noSubEl = document.getElementById('fanEditNoSubFields_' + id);
  if (subEl) subEl.style.display = isSub ? 'grid' : 'none';
  if (noSubEl) noSubEl.style.display = isSub ? 'none' : 'block';
};
// עריכת פרטים אישיים+אימות מנוי — זהה ל-admin-members.html saveEditBtn (שדות אמיתיים בלבד)
window.saveFanDetails = async function(id) {
  const f0 = findFan(id);
  const isSub = document.getElementById('fanEditIsSub_' + id).value === 'yes';
  const updates = {
    firstName: document.getElementById('fanEditFirst_' + id).value.trim(),
    lastName: document.getElementById('fanEditLast_' + id).value.trim(),
    phone: document.getElementById('fanEditPhone_' + id).value.trim(),
    email: document.getElementById('fanEditEmail_' + id).value.trim(),
    isSubscriber: isSub,
    subscriberSection: isSub ? document.getElementById('fanEditGate_' + id).value.trim() : null,
    subscriberNumber: isSub ? document.getElementById('fanEditSubNum_' + id).value.trim() : null,
    wasSubscriber: isSub ? null : document.getElementById('fanEditWasSub_' + id).value,
    facebookUrl: isSub ? null : document.getElementById('fanEditFbUrl_' + id).value.trim(),
  };
  const changedFields = f0 ? Object.keys(updates).filter(k => f0[k] !== updates[k]) : [];
  showSaving('שומר...');
  try {
    await updateDoc(doc(db, 'members', id), updates);
    const f = findFan(id);
    if (f) Object.assign(f, updates, { name: `${updates.firstName} ${updates.lastName}`.trim() || '—' });
    if (changedFields.length) {
      await logActivity('members', id, {
        type: 'adminEdit', title: `נערך: ${changedFields.join(', ')}`,
        detail: changedFields.map(k => `${k}: "${fmtActivityVal(f0[k])}" → "${fmtActivityVal(updates[k])}"`).join(' · '),
        field: changedFields[0], before: f0[changedFields[0]] ?? null, after: updates[changedFields[0]] ?? null,
      });
    }
    hideSaving(true);
    renderMainPreserveScroll();
  } catch (e) { console.error(e); hideSaving(false); alert('שגיאה בשמירה: ' + e.message); }
};

window.toggleFanVerified = async function(id, checked) {
  const f = findFan(id);
  if (!f) return;
  try {
    await updateDoc(doc(db, 'members', id), { adminVerified: checked });
    f.adminVerified = checked;
    await logActivity('members', id, {
      type: 'adminEdit', title: checked ? 'סומן כנבדק ואומת ע"י מנהל' : 'סימון "נבדק" בוטל',
      field: 'adminVerified', before: !checked, after: checked,
    });
    renderMain();
  } catch (e) { console.error(e); alert('שגיאה בשמירה: ' + e.message); }
};

// "אותו אדם, אשר" בפאנל שיפוט-מהיר של דגל-דדופ ("3 כל האוהדים.dc.html") — מנקה רק את הדגל, לא נוגעת
// ב-status. זהה בכוונה לתבנית שכבר הייתה קיימת ב-admin-members.html ("✓ סומן כנבדק", מנקה רק את הדגל) —
// לעולם לא לאשר חבר אוטומטית מכאן, ר' feedback_never_auto_decide_membership. אישור בפועל עדיין דורש
// לחיצה נפרדת על "✅ אשר" הרגיל. "כפילות, מחק" (בממשק) קורא ישירות ל-deleteFan הקיימת — אין לוגיקה חדשה.
window.resolveFanReviewFlagSamePerson = async function(id) {
  const f = findFan(id);
  if (!f || f.reviewFlag !== 'name_mismatch') return;
  try {
    await updateDoc(doc(db, 'members', id), { reviewFlag: null, reviewFlagAt: null });
    f.reviewFlag = null;
    await logActivity('members', id, {
      type: 'status', title: 'דגל-בדיקה טופל — אותו אדם',
      detail: `"${f.name}" סומן ע"י מנהל כאותו אדם (לא כפילות) — הדגל הוסר, האישור עצמו עדיין דורש לחיצה נפרדת`,
      field: 'reviewFlag', before: 'name_mismatch', after: null,
    });
    renderMain();
  } catch (e) { console.error(e); alert('שגיאה: ' + e.message); }
};

window.saveFanNote = async function(id, value) {
  const f = findFan(id);
  if (!f) return;
  const note = value.trim();
  try {
    await updateDoc(doc(db, 'members', id), { adminNote: note });
    f.adminNote = note;
    renderMain();
  } catch (e) { console.error(e); alert('שגיאה בשמירה: ' + e.message); }
};

window.toggleFanSelect = function(id) {
  if (selectedFanIds.has(id)) selectedFanIds.delete(id); else selectedFanIds.add(id);
  refreshFanList();
};

window.toggleSelectAllFan = function() {
  const ids = fanFilteredList().map(f => f.id);
  const allSelected = ids.length > 0 && ids.every(id => selectedFanIds.has(id));
  if (allSelected) ids.forEach(id => selectedFanIds.delete(id));
  else ids.forEach(id => selectedFanIds.add(id));
  refreshFanList();
};

// נקרא גם מטאב "שליחת הודעה" (לא רק "כל האוהדים") — ר' אותו תיקון ב-clearBizSelection.
window.clearFanSelection = function() {
  selectedFanIds.clear();
  if (activeTab === ALL_FANS_KEY) refreshFanList(); else renderMain();
};

// בולק אמיתי — אותה צורת כתיבה כמו admin-members.html bulkApprove/bulkReject
window.bulkSetFanStatus = async function(status) {
  const ids = [...selectedFanIds];
  selectedFanIds.clear();
  try {
    if (status === 'approved') {
      await Promise.all(ids.map(async id => {
        const f = MOCK_FANS.find(x => x.id === id);
        if (!f || f.status !== 'pending') return;
        const memberNumber = await allocateMemberNumber();
        const loginCode = await generateLoginCode();
        await updateDoc(doc(db, 'members', id), {
          status: 'approved', approvedAt: serverTimestamp(), rejectedAt: null,
          memberNumber, loginCode, loginCodeCreatedAt: serverTimestamp(), loginCodeEmailStatus: 'pending'
        });
      }));
    } else {
      await Promise.all(ids.map(id => {

// זמן טיפול ממוצע אמיתי — הפרש registeredAt→approvedAt על כל האוהדים+העסקים שכבר אושרו בפועל
function avgHandlingTimeLabel() {
  const durations = [];
  MOCK_FANS.forEach(f => { if (f.status === 'approved' && f.approvedAt && f.registeredAt) durations.push(f.approvedAt - f.registeredAt); });
  MOCK_BUSINESSES.forEach(b => { if (b.status === 'approved' && b.approvedAt && b.registeredAt) durations.push(b.approvedAt - b.registeredAt); });
  if (!durations.length) return '—';
  const hours = (durations.reduce((a, x) => a + x, 0) / durations.length) / 3600000;
  return hours < 48 ? `${hours.toFixed(1)} שעות` : `${(hours / 24).toFixed(1)} ימים`;
}

// ── מרכז המשימות: 3 לשוניות (סוג משימה) + Master-Detail בכל לשונית ──
let bizAiTitleEdits = {};   // עריכות ידניות לכותרת ה-AI המוצעת, לפי מזהה עסק

// ══ מרכז המשימות — שלב 2 (rosy-stirring-sun.md): 4 קוביות פילוח מקבילות (לא טאבים-מחביאים) +
// רשימה אחת מאוחדת עסקים+אוהדים, לפי §13/§14 במפרט + "2 מרכז המשימות.dc.html". classifyAction()
// (שלב 1) הוא מקור-האמת היחיד גם לספירת הקוביות וגם לתוכן השורה — לא שני מימושים נפרדים.
let taskClassFilter = 'all';    // 'all' | 'pendingBiz' | 'pendingFan' | 'requests' | 'incomplete'
let taskEntityFilter = 'all';   // 'all' | 'biz' | 'fan'
let taskSearchQ = '';
let taskSort2 = 'longestWaiting'; // 'longestWaiting' | 'leastReviewed' | 'mostReviewed' | 'newest' | 'oldest' | 'mostRequests'
let taskPeriodFilter = 'all';   // 'all' | '7' | '30' | '90' | 'over2w'
let taskCategoryFilter = 'all';
let selectedTaskKey = null;     // "biz:ID" / "fan:ID" — הכרטיס הפתוח כרגע ב-drawer (null = סגור)

const TASK_CLASS_TILES = [
  { key: 'pendingBiz', primary: 'עסק ממתין לאישור', label: 'עסקים ממתינים לאישור' },
  { key: 'pendingFan', primary: 'אוהד ממתין לאישור', label: 'אוהדים ממתינים לאישור' },
  { key: 'requests',   primary: 'בקשה מבעל העסק',   label: 'בקשות מבעלי עסקים' },
  { key: 'incomplete', primary: 'כרטיס חסר באינדקס', label: 'כרטיס חסר באינדקס' },
];

// כל עסק/אוהד עם primary פעיל (לא "מאושר · אין פעולה") — מבוסס classifyAction בלבד, לא בדיקה נפרדת
function unifiedTaskItems() {
  const biz = MOCK_BUSINESSES.map(b => ({ kind:'biz', id:b.id, entity:b, c: classifyAction(b, 'business') }))
    .filter(x => x.c.primary !== 'מאושר · אין פעולה');
  const fan = MOCK_FANS.map(f => ({ kind:'fan', id:f.id, entity:f, c: classifyAction(f, 'fan') }))
    .filter(x => x.c.primary !== 'מאושר · אין פעולה');
  return [...biz, ...fan];
}
function taskWaitDate(x) {
  return x.kind === 'biz' ? (x.entity.changeSubmittedAt || x.entity.registeredAt) : x.entity.registeredAt;
}
function taskWaitLabel(x) {
  if (x.c.primary === 'כרטיס חסר באינדקס') return '—';
  const d = taskWaitDate(x);
  return d ? agoLabel(d) : '—';
}

function taskFilteredList() {
  let items = unifiedTaskItems();
  const tile = TASK_CLASS_TILES.find(t => t.key === taskClassFilter);
  if (tile) items = items.filter(x => x.c.primary === tile.primary);
  if (taskEntityFilter !== 'all') items = items.filter(x => x.kind === taskEntityFilter);
  if (taskCategoryFilter !== 'all') items = items.filter(x => x.kind === 'biz' && x.entity.catKey === taskCategoryFilter);
  if (taskPeriodFilter !== 'all') {
    const now = Date.now();
    items = items.filter(x => {
      const d = taskWaitDate(x);
      if (!d) return false;
      const days = (now - d.getTime()) / 86400000;
      if (taskPeriodFilter === '7') return days <= 7;
      if (taskPeriodFilter === '30') return days <= 30;
      if (taskPeriodFilter === '90') return days <= 90;
      if (taskPeriodFilter === 'over2w') return days > 14;
      return true;
    });
  }
  const q = taskSearchQ.trim();
  if (q) items = items.filter(x => {
    const e = x.entity;
    const hay = x.kind === 'biz'
      ? [e.name, e.ownerFirst, e.ownerLast, e.city].filter(Boolean).join(' ')
      : [e.name, e.city].filter(Boolean).join(' ');
    return hay.includes(q);
  });
  return items.slice().sort((a, b) => {
    if (taskSort2 === 'leastReviewed') return (a.kind==='biz'?bizReviewedCount(a.entity):0) - (b.kind==='biz'?bizReviewedCount(b.entity):0);
    if (taskSort2 === 'mostReviewed') return (b.kind==='biz'?bizReviewedCount(b.entity):0) - (a.kind==='biz'?bizReviewedCount(a.entity):0);
    if (taskSort2 === 'newest') return (taskWaitDate(b)||0) - (taskWaitDate(a)||0);
    if (taskSort2 === 'oldest') return (taskWaitDate(a)||0) - (taskWaitDate(b)||0);
    if (taskSort2 === 'mostRequests') return b.c.treatments.length - a.c.treatments.length;
    return (taskWaitDate(a)||0) - (taskWaitDate(b)||0); // longestWaiting — ברירת מחדל, הכי ותיק קודם
  });
}

function taskTilesHtml() {

      <div class="class-tile-top"><span class="class-tile-num">${num}</span><span class="class-tile-label">${t.label}</span></div>
      ${sub}

      ${tile(TASK_CLASS_TILES[1], countOf('אוהד ממתין לאישור'), `<div class="class-tile-sub">${flaggedFans ? `⚠️ ${flaggedFans} עם דגל בדיקה` : ''}</div>`)}
      ${tile(TASK_CLASS_TILES[2], requestsItems.length, `<div class="class-tile-chips"><span class="treat-badge">שינוי פרטים ${tCount('details')}</span><span class="treat-badge">תגית ${tCount('tag')}</span><span class="treat-badge">קטגוריה ${tCount('category')}</span><span class="treat-badge">כתבו לנו ${tCount('note')}</span></div>`)}
      ${tile(TASK_CLASS_TILES[3], countOf('כרטיס חסר באינדקס'), `<div class="class-tile-chips"><span class="warn-badge">חסרים פרטים בכרטיס</span></div>`)}
    </div>`;
}

  return `
    <div class="filter-toolbar-row">

        <option value="leastReviewed" ${taskSort2==='leastReviewed'?'selected':''}>מיון: הכי פחות שלבים נסקרו</option>
        <option value="mostReviewed" ${taskSort2==='mostReviewed'?'selected':''}>מיון: הכי הרבה שלבים נסקרו</option>
        <option value="newest" ${taskSort2==='newest'?'selected':''}>מיון: החדש ביותר</option>
        <option value="oldest" ${taskSort2==='oldest'?'selected':''}>מיון: הישן ביותר</option>
        <option value="mostRequests" ${taskSort2==='mostRequests'?'selected':''}>מיון: הכי הרבה בקשות פתוחות</option>

      <select class="filter-select" onchange="setTaskPeriodFilter(this.value)">
        <option value="all" ${taskPeriodFilter==='all'?'selected':''}>כל התקופות</option>
        <option value="7" ${taskPeriodFilter==='7'?'selected':''}>נכנסו ב-7 הימים האחרונים</option>
        <option value="30" ${taskPeriodFilter==='30'?'selected':''}>נכנסו ב-30 הימים האחרונים</option>
        <option value="90" ${taskPeriodFilter==='90'?'selected':''}>נכנסו ב-90 הימים האחרונים</option>
        <option value="over2w" ${taskPeriodFilter==='over2w'?'selected':''}>ממתינים מעל שבועיים</option>

      <select class="filter-select" onchange="setTaskCategoryFilter(this.value)">
        <option value="all" ${taskCategoryFilter==='all'?'selected':''}>כל הקטגוריות</option>

      </select>
      <select class="filter-select" onchange="setTaskEntityFilter(this.value)">
        <option value="all" ${taskEntityFilter==='all'?'selected':''}>עסקים ואוהדים</option>

}

// שורת-משימה מאוחדת (עסק+אוהד) — טבלה ברוחב-מלא (2026-08-05, §156: המשתמש ביקש במפורש להפוך
// את ההחלטה הקודמת — רק בדף הזה, לא ב"כל העסקים"/"כל האוהדים" ששם ה-32%/68% נשאר כמו שהיה).
// גריד רחב (כמו המוקאפ) בטוח כאן כי הטבלה תופסת את כל רוחב-העמוד, לא מצומצמת לעמודת-רשימה צרה.
function taskRow2Html(x) {
  const e = x.entity;
  const key = `${x.kind}:${x.id}`;
  const badges = [`<span class="class-badge">${x.c.primary}</span>`].concat(x.c.treatments.map(t => `<span class="treat-badge">${TREATMENT_LABELS[t]}</span>`));
  if (x.kind === 'fan' && e.reviewFlag) badges.push(`<span class="warn-badge">דגל בדיקה — שם לא תואם</span>`);
  if (x.kind === 'biz' && x.c.primary === 'כרטיס חסר באינדקס') {
    missingFieldsFor(e).slice(0, 2).forEach(label => badges.push(`<span class="warn-badge">${label}</span>`));
  }
  const catLabel = x.kind === 'biz' ? ((CATEGORIES.find(c => c.key === e.catKey) || {}).label || '') : '';
  const metaLine = x.kind === 'biz'
    ? [bizMetaStr(e), catLabel, e.status === 'approved' ? `באינדקס מ-${fmtDate(e.approvedAt || e.registeredAt)}` : (e.ownerIsSubscriber ? 'מנוי' : 'לא מנוי')].filter(Boolean).join(' · ')
    : ['אוהד', e.isSubscriber ? 'מנוי' : 'לא מנוי'].filter(Boolean).join(' · ');
  const reviewCol = x.kind === 'biz'
    ? `<div class="task-table-review"><div class="task-table-review-bars">${[0,1,2,3].map(i => `<span class="${i < bizReviewedCount(e) ? 'on' : ''}"></span>`).join('')}</div><div class="task-table-review-lbl">${bizReviewedCount(e)} מתוך 4 נסקרו</div></div>`
    : `<div class="task-table-review-lbl">לא רלוונטי לאוהד</div>`;
  const openLabel = x.kind === 'fan' ? 'כרטיס אוהד' : (x.c.primary === 'עסק ממתין לאישור' ? 'פתיחה וסקירה' : 'פתיחה');
  const primaryBtn = x.c.primary === 'עסק ממתין לאישור' ? 'primary-yellow' : '';
  return `
    <div class="task-table-row ${selectedTaskKey===key?'active':''}" onclick="selectTask2('${x.kind}','${x.id}')">
      <div class="task-table-main">
        <div class="task-table-name">${esc(e.name)}</div>
        <div class="task-table-meta">${esc(metaLine)}</div>
      </div>
      <div class="task-table-badges">${badges.join('')}</div>
      ${reviewCol}
      <div class="task-table-wait">${taskWaitLabel(x)}</div>
      <div><button class="act-btn ${primaryBtn} tiny" onclick="event.stopPropagation();selectTask2('${x.kind}','${x.id}')">${openLabel}</button></div>
    </div>`;
}

function taskTableBodyHtml(list) {
  if (!list.length) return `<div class="placeholder-note">אין כרגע פריטים 🎉</div>`;
  return `<div class="task-table">${list.map(taskRow2Html).join('')}</div>`;
}

function taskCenterHtml() {
  const list = taskFilteredList();
  return `
    ${taskTilesHtml()}
    <div class="filter-toolbar">${taskFilterBarHtml()}</div>
    <div id="taskTableWrap">${taskTableBodyHtml(list)}</div>
    ${selectedTaskKey ? taskDrawerHtml(selectedTaskKey) : ''}`;
}

// כרטיס-מלא נפתח כ-drawer צף (52vw, לא עמודה קבועה) — רק במסך הזה. שאר-המסך (טבלה+קוביות+סינון)
// לא נוגעים בו כשה-drawer פתוח/נסגר, ר' refreshTaskCenter.
function taskDrawerHtml(key) {
  return `
    <div class="task-drawer-backdrop" onclick="closeTaskDrawer()"></div>
    <div class="task-drawer">
      <div class="task-drawer-head">
        <button class="task-drawer-close" onclick="closeTaskDrawer()">✕</button>
      </div>
      <div class="task-drawer-body">${taskDetailHtml2(key)}</div>
    </div>`;
}

function taskDetailHtml2(key) {
  if (!key) return '';
  const [kind, id] = key.split(':');
  if (kind === 'fan') return fanFullDetailHtml(id, { backFn: 'closeTaskDrawer' });
  return bizFullDetailHtml(id, { backFn: 'closeTaskDrawer' });
}

// ── ניהול מדיה אמיתי — לוגו/תמונה מייצגת/גלריה/סרטונים, כתיבה+העלאה אמיתית ל-Firebase Storage
// (uploadFile/uploadImageWithThumb, זהה ל-admin-businesses.html). כל פעולה כותבת מיידית (בלי טופס
// אחד גדול "שמור הכל") — פשוט יותר ובטוח יותר מלנסות לשחזר טופס-ענק דינמי לגלריה/סרטונים.
function mediaRealViewHtml(b) {
  // בלי slice — הרשמה מגבילה ל-5 תמונות גלריה, ורצוי לראות את כולן כאן ולא רק 3 ראשונות (המשתמש
  // דיווח שנראה "רק 3", הריבוע-flex-wrap כבר תומך בכמה שורות בלי לשבור פריסה).
  // כל תמונה פותחת לייטבוקס בלחיצה (לא טאב חדש) + כפתור-הורדה צמוד — ר' mediaThumbHtml למעלה, §185.
  const galleryThumbs = (b.photos || []).map(p =>

      <div class="media-slot cover ${b.coverPhoto?'filled':'missing'}">${b.coverPhoto ? mediaThumbHtml(b.coverPhotoThumb || b.coverPhoto, 'cover.jpg', 'width:100%;height:100%', b.name) : `<span class="media-slot-ic">—</span><span class="media-slot-label">חסרה תמונה</span>`}</div>

function mediaRealEditHtml(b) {
  const photosHtml = (b.photos || []).map((p, idx) => `
    <div class="media-slot-row" style="margin-top:6px">
      ${mediaThumbHtml(p.url, p.name, 'width:56px;height:56px;border-radius:6px;overflow:hidden', b.name)}

    <div class="media-slot-row" style="margin-top:6px">

      <button class="act-btn reject tiny" onclick="removeBizVideo('${b.id}', ${idx})">🗑️ הסר</button>

        <input type="file" accept="image/*" id="bizLogoFile_${b.id}" style="flex:1">
        <button class="act-btn approve tiny" onclick="uploadBizLogo('${b.id}')">⬆️ העלה</button>
        ${b.logo ? `<button class="act-btn reject tiny" onclick="removeBizLogo('${b.id}')">🗑️ הסר</button>` : ''}
      </div>

        <input type="file" accept="image/*" id="bizCoverFile_${b.id}" style="flex:1">
        <button class="act-btn approve tiny" onclick="uploadBizCover('${b.id}')">⬆️ העלה</button>

      </div>

// showSaving/hideSaving כאן — לפני saveSectionUpdates, כי דחיסה+העלאה ל-Storage הם החלק
// האיטי-באמת (כמה שניות על תמונה מהטלפון), לא ה-updateDoc עצמו. try/catch נוסף כאן במפורש —
// לפני התיקון, כשל בהעלאה (רשת/Storage) לא היה נתפס בשום מקום ולא מציג שום שגיאה למנהל בכלל.
window.uploadBizLogo = async function(id) {
  const file = document.getElementById('bizLogoFile_' + id)?.files[0];
  if (!file) { alert('נא לבחור קובץ קודם'); return; }
  showSaving('מעלה לוגו...');
  try {
    const { url, thumbUrl } = await uploadImageWithThumb(file, `businesses/${id}/logo_${Date.now()}`);
    await saveSectionUpdates(id, { logo: url, logoThumb: thumbUrl });
  } catch (e) { console.error(e); hideSaving(false); alert('שגיאה בהעלאת הלוגו: ' + e.message); }
};
window.removeBizLogo = async function(id) { await saveSectionUpdates(id, { logo: '', logoThumb: '' }); };
window.uploadBizCover = async function(id) {
  const file = document.getElementById('bizCoverFile_' + id)?.files[0];
  if (!file) { alert('נא לבחור קובץ קודם'); return; }
  showSaving('מעלה תמונה מייצגת...');
  try {
    const { url, thumbUrl } = await uploadImageWithThumb(file, `businesses/${id}/coverPhoto_${Date.now()}`);
    await saveSectionUpdates(id, { coverPhoto: url, coverPhotoThumb: thumbUrl });
  } catch (e) { console.error(e); hideSaving(false); alert('שגיאה בהעלאת התמונה: ' + e.message); }
};
window.removeBizCover = async function(id) { await saveSectionUpdates(id, { coverPhoto: '', coverPhotoThumb: '' }); };
window.uploadBizGalleryPhoto = async function(id) {
  const file = document.getElementById('bizGalleryFile_' + id)?.files[0];
  if (!file) { alert('נא לבחור קובץ קודם'); return; }
  showSaving('מעלה תמונה לגלריה...');
  try {
  const b = findBiz(id);
  // דחיסה לפני העלאה (כמו קאבר/לוגו) — בלי thumbnail נפרד, זהה ל-business.html בהרשמה (גלריה לא
  // מוצגת בכרטיס הפיד עצמו, רק בתוך דף העסק) — קובץ מקורי מהטלפון יכול להיות כמה MB, קריטי לביצועים.
  let uploadFileObj = file;
  try { uploadFileObj = await compressToFile(file, 1280, 0.82, file.name); }
  catch (e) { console.error('⚠️ image compression failed, falling back to original file:', e); }
  const url = await uploadFile(uploadFileObj, `businesses/${id}/gallery_${Date.now()}`);
  const photos = [...(b.photos || []), { url, name: file.name }];
  await saveSectionUpdates(id, { photos });
  } catch (e) { console.error(e); hideSaving(false); alert('שגיאה בהעלאת התמונה: ' + e.message); }
};
window.removeBizGalleryPhoto = async function(id, idx) {
  const b = findBiz(id);
  const photos = (b.photos || []).filter((_, i) => i !== idx);
  await saveSectionUpdates(id, { photos });
};
window.addBizVideo = async function(id) {
  const url = document.getElementById('bizVideoUrl_' + id)?.value.trim();
  const label = document.getElementById('bizVideoLabel_' + id)?.value.trim();
  if (!url) { alert('נא להזין קישור'); return; }
  const b = findBiz(id);
  const videos = [...(b.videos || []), { url, label }];
  await saveSectionUpdates(id, { videos });
};
window.removeBizVideo = async function(id, idx) {
  const b = findBiz(id);
  const videos = (b.videos || []).filter((_, i) => i !== idx);
  await saveSectionUpdates(id, { videos });
};

// מגבלת-האמת היא רוחב פיקסלים בפועל (ensureFitsCard), לא ספירת תווים — התווית מציגה "מתאים/חורג"
// לפי מדידה אמיתית, בדיוק כמו business-dashboard.html, כדי שלא יהיה פער בין מה שהמנהל רואה לביניהם
// לבין מה שבאמת יוצג בכרטיס במובייל.
function aiTitleFitLabel(val) {
  const t = (val || '').trim();
  if (!t) return { over: false, text: '' };
  const fits = measureTextWidth(t, CARD_TITLE_FONT) <= CARD_TITLE_MAX_WIDTH;
  return { over: !fits, text: fits ? '✓ נכנס בכרטיס' : '⚠️ חורג מרוחב הכרטיס — יקוצר אוטומטית בשמירה' };
}
// opts.standalone — מציג גם כפתור "שמור כותרת" עצמאי (בתצוגה הרגילה, לא בתוך טופס עריכה) — כך
// שאפשר לראות/לרענן/לבחור כותרת בלי לפתוח את כל עריכת שלב 4 (המשתמש: "בלי ללחוץ... כבר מבחוץ").
// הכרטיס המאוחד מרנדר גם תצוגה וגם טופס-עריכה בו-זמנית (רק אחד גלוי, ר' bizFullDetailHtml) — כלומר
// שני עותקים של השדה הזה קיימים ב-DOM בו-זמנית. משתמשים ב-data-attribute (לא id ייחודי) ומעדכנים
// את כל ההעתקים ביחד עם querySelectorAll, כדי שלא יתנגשו ושיישארו מסונכרנים.
// עוצב מחדש (2026-08-04) לפי handoff: שורת-כותרת (AI+טקסט+מצב-התאמה) מעל שורת-קלט+כפתור+תצוגה-מקדימה
// חיה ("כך זה ייראה") — במקום מבנה-טור ישן + char-count נפרד. גם הכפילות (standalone+בתוך-הטופס)
// הוסרה — נקרא רק פעם אחת עכשיו (standalone, תמיד-גלוי), ר' ההערה למעלה על מנגנון-הסנכרון.
function aiTitleFieldHtml(b, opts) {
  const standalone = opts && opts.standalone;
  const val = bizAiTitleEdits[b.id] !== undefined ? bizAiTitleEdits[b.id] : b.aiShortTitle;
  const fit = aiTitleFitLabel(val);
  return `
    <div class="ai-title-field">
      <div class="ai-title-head">
        <span class="ai-title-tag">AI</span>
        <div class="ai-title-head-label">הכותרת שתופיע על הכרטיס באינדקס</div>
        <div class="ai-title-fit ${fit.over?'over':''}" data-ai-title-len="${b.id}">${fit.text}</div>
      </div>
      <div class="ai-title-row">
        <input type="text" value="${val || ''}" maxlength="55" data-ai-title-input="${b.id}" oninput="setBizAiTitle('${b.id}', this.value)">
        <button type="button" class="act-btn tiny" onclick="regenerateAiTitles('${b.id}')" data-ai-title-regen="${b.id}">הצע 3 נוסחים</button>
        <div class="ai-title-preview">
          <div class="ai-title-preview-label">כך זה ייראה</div>
          <div class="ai-title-preview-text" data-ai-title-preview="${b.id}">${esc(val || '')}</div>
        </div>
      </div>
      <div data-ai-title-options="${b.id}" class="ai-title-options"></div>
      ${standalone ? `<button type="button" class="act-btn approve tiny" style="margin-top:8px" onclick="saveBizAiTitleOnly('${b.id}')">💾 שמור כותרת</button>` : ''}
    </div>`;
}
// שמירה עצמאית של הכותרת בלבד (מתוך התצוגה הרגילה, standalone:true) — לא נוגעת בשאר שדות הטבה 1
window.saveBizAiTitleOnly = async function(id) {
