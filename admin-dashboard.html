let tplFirestoreData = {};
let tplSiteTextsData = {};
let openTemplateId = null;
window.toggleTemplateItem = function(id) {
  openTemplateId = (openTemplateId === id) ? null : id;
  renderMain();
};

function tplGetLocal(key, fallback) { return localStorage.getItem('_hb_tpl_' + key) || fallback; }
function tplSetLocal(key, val) { localStorage.setItem('_hb_tpl_' + key, val); }
function findMessageTemplate(id) { return MESSAGE_TEMPLATE_ITEMS.find(i => i.id === id); }
function tplFieldValue(item, f) {
  return item.storage === 'firestore' ? (tplFirestoreData[f.key] ?? item.defaults[f.key])
    : item.storage === 'firestoreSite' ? (tplSiteTextsData[f.key] ?? item.defaults[f.key])
    : tplGetLocal(f.key, item.defaults[f.key]);
}

window.saveTemplateItem = async function(id) {
  const item = findMessageTemplate(id);
  const values = {};
  item.fields.forEach(f => values[f.key] = document.getElementById('tplField_' + f.key).value);
  if (item.storage === 'firestore' || item.storage === 'firestoreSite') {
    const targetDoc = item.storage === 'firestore' ? TPL_SETTINGS_DOC() : TPL_SITE_TEXTS_DOC();
    const cache = item.storage === 'firestore' ? tplFirestoreData : tplSiteTextsData;
    try {
      await setDoc(targetDoc, values, { merge: true });
      Object.assign(cache, values);
      alert('✅ נשמר');
    } catch (e) { console.error(e); alert('שגיאה בשמירה: ' + e.message); }
  } else {
    Object.entries(values).forEach(([k, v]) => tplSetLocal(k, v));
    alert('✅ נשמר');
  }
  renderMain();
};

window.resetTemplateItem = function(id) {
  const item = findMessageTemplate(id);
  item.fields.forEach(f => { const el = document.getElementById('tplField_' + f.key); if (el) el.value = item.defaults[f.key]; });
};

function templateFieldHtml(item, f) {
  const val = esc(tplFieldValue(item, f));
  return f.type === 'textarea'
    ? `<div class="approve-field-label" style="margin-top:10px">${f.label}</div><textarea class="broadcast-body-input" id="tplField_${f.key}" rows="${f.rows||8}">${val}</textarea>`
    : `<div class="approve-field-label" style="margin-top:10px">${f.label}</div><input class="chain-select" type="text" id="tplField_${f.key}" value="${val}">`;
}

// §137 המשך — שורה+פרוט בסגנון tpl-row/tpl-detail (מוקאף), במקום chain-block/chain-label הישנים.
// אותה לוגיקה בדיוק (openTemplateId יחיד, saveTemplateItem/resetTemplateItem/tplFieldValue) —
// רק "למי/מתי/תשובה-למייל" עברו מפסקה חופשית אחת ל-3 כרטיסי-פרוט נפרדים (tpl-detail-grid).
function templateCardHtml(item) {
  if (!item) return '';
  const isOpen = openTemplateId === item.id;
  const badgeClass = item.group === 'auto' ? 'auto' : 'manual';
  const badgeLabel = item.group === 'auto' ? 'אוטומטי' : (item.group === 'terms' || item.group === 'success') ? 'טקסט באתר' : 'שליחה ידנית';
  const varsShortLabel = item.vars.length ? `משתנים: ${item.vars.map(([k]) => k).join(', ')}` : '';
  const replyToVal = item.replyTo ? `כן — ${TPL_REPLY_TO_ADDRESS}` : (item.group === 'auto' ? 'אין — כתובת ללא מענה' : '—');
  const varsHtml = item.vars.length
    ? `<div class="tpl-vars-box">משתנים זמינים: ${item.vars.map(([k,d]) => `<code>{${k}}</code>=${esc(d)}`).join(' · ')}</div>`
    : '';
  const fieldsHtml = item.fields.map(f => templateFieldHtml(item, f)).join('');
  return `
    <div class="tpl-row" onclick="toggleTemplateItem('${item.id}')">
      <div style="flex:1 1 210px;min-width:0">
        <div class="name">${item.icon} ${esc(item.title)}</div>
        <div class="sub">${esc(item.sub)}</div>
      </div>
      <span class="tpl-badge ${badgeClass}">${badgeLabel}</span>
      ${varsShortLabel ? `<div class="tpl-vars">${esc(varsShortLabel)}</div>` : ''}
      <span class="tpl-chev">${isOpen ? '⌄' : '›'}</span>
    </div>
    ${isOpen ? `
    <div class="tpl-detail">
      <div class="tpl-detail-grid">
        <div class="tpl-detail-card"><div class="h">למי</div><div class="v">${item.who}</div></div>
        <div class="tpl-detail-card"><div class="h">מתי</div><div class="v">${item.when}</div></div>
        <div class="tpl-detail-card"><div class="h">תשובה למייל</div><div class="v">${esc(replyToVal)}</div></div>
      </div>
      ${varsHtml}
      ${fieldsHtml}
      <div class="broadcast-actions" style="margin-top:12px">
        <button class="act-btn" onclick="resetTemplateItem('${item.id}')">↩ ברירת מחדל</button>
        <button class="act-btn approve" onclick="saveTemplateItem('${item.id}')">💾 שמור</button>
      </div>
    </div>` : ''}`;
}

function templateGroupHtml(group) {
  const items = MESSAGE_TEMPLATE_ITEMS.filter(i => i.group === group);
  if (!items.length) return '';
  return `<div class="tpl-list">${items.map(templateCardHtml).join('')}</div>`;
}

// ידנית לכל אחד בנפרד (מיד קיים: sendBizWA/sendBizMail/sendFanWA/sendFanMail, שורות ~1821) —

// משמשים לבולק-אישור/דחייה ב"כל העסקים"/"כל האוהדים" — לא רוצים שבחירה כאן (ad-hoc, לשליחה

let manualPickerType = 'businesses'; // 'businesses' | 'fans'

window.setManualPickerType = function(type) {

function manualPickerSelectedSet() {

// אותם סינונים בדיוק כמו בבורר הקהל של "שידור המוני" (bizFilteredList/fanFilteredList — סטטוס/
// קטגוריה/מצב-סקירה/בריאות-פרופיל/תאריך/מיון, אותו state גלובלי משותף) — לא בורר-חיפוש נפרד.
function manualPickerListHtml() {
  const isFans = manualPickerType === 'fans';
  const filtered = isFans ? fanFilteredList() : bizFilteredList();
  if (!filtered.length) return `<div class="picker-empty">לא נמצאו תוצאות</div>`;
  const set = manualPickerSelectedSet();
  return filtered.slice(0, 100).map(x => {
    const sel = set.has(x.id);
    const noteFlag = (!isFans && bizHasUnhandledNote(x)) ? ' 💬' : '';
    return `
    <label class="aud-picker-row">
      <input type="checkbox" ${sel?'checked':''} onchange="toggleManualPickerSelect('${x.id}')">
      <span class="nm">${esc(x.name)}${noteFlag}</span>
    </label>`;
  }).join('');
}

window.toggleManualPickerSelect = function(id) {
  const set = manualPickerSelectedSet();
  if (set.has(id)) set.delete(id); else set.add(id);
  renderMain();
};

function manualSelectedRecipientsHtml() {
  const isFans = manualPickerType === 'fans';
  const set = manualPickerSelectedSet();
  if (!set.size) return '';
  const items = [...set].map(id => isFans ? findFan(id) : bizById(id)).filter(Boolean);
  return `<div style="margin-top:12px">` + items.map(x => {
    const waBtn = (isFans ? x.phone : x.ownerPhone) ? `<button class="slot-btn" onclick="sendManualAdhoc('wa','${x.id}')">📲 WhatsApp</button>` : '';
    const mailBtn = (isFans ? x.email : x.ownerEmail) ? `<button class="slot-btn" onclick="sendManualAdhoc('mail','${x.id}')">✉️ מייל</button>` : '';
    // הקשר קטן — אם לעסק יש הודעת "כתבו לנו" ממתינה, נוח לראות אותה כאן לפני שמנסחים תשובה
    const noteHint = (!isFans && bizHasUnhandledNote(x)) ? `<div class="picker-note-hint">💬 העסק כתב: "${esc(x.note)}"</div>` : '';
    return `<div class="selected-recipient-row"><span class="nm">${esc(x.name)}</span>${waBtn}${mailBtn}<button class="slot-btn" onclick="toggleManualPickerSelect('${x.id}')">✕ הסר</button>${noteHint}</div>`;
  }).join('') + `</div>`;
}

// ── עריכת תוכן חד-פעמית ("הודעה בודדת") — בכוונה נפרדת מ-_hb_tpl_* (התבנית הקבועה שמשמשת גם
// את כפתורי 📲/✉️ ליד עסק/אוהד ברשימות): עריכה כאן היא ל-session הזה בלבד, לא נשמרת ולא דורסת
// את התבנית הקבועה. ברירת המחדל בכל שדה היא הערך הנוכחי של התבנית — אפשר לערוך בלי לפגוע בו.
let manualAdhocFields = { wa: null, mailSubject: null, mail: null, fan_wa: null, fan_mailSubject: null, fan_mail: null };
window.setManualAdhocField = function(key, value) {
  manualAdhocFields[key] = value; // בכוונה בלי renderMain() — לא לאבד פוקוס/מיקום סמן בכל הקלדה
};
function manualAdhocValue(item, key) {
  return manualAdhocFields[key] != null ? manualAdhocFields[key] : tplFieldValue(item, item.fields.find(f => f.key === key));
}

function manualAdhocFieldsHtml() {
  const isFans = manualPickerType === 'fans';
  const item = findMessageTemplate(isFans ? 'fanManual' : 'bizManual');
  const waKey = isFans ? 'fan_wa' : 'wa';
  const subjKey = isFans ? 'fan_mailSubject' : 'mailSubject';
  const bodyKey = isFans ? 'fan_mail' : 'mail';
  return `
    <div class="msg-group-label" style="margin-top:16px">✏️ עריכת התוכן לשליחה הזו <span class="hint">— חד-פעמי, לא משנה את התבנית הקבועה למטה</span></div>
    <div class="approve-field-label">📲 תבנית WhatsApp</div>
    <textarea class="broadcast-body-input" rows="5" oninput="setManualAdhocField('${waKey}', this.value)">${esc(manualAdhocValue(item, waKey))}</textarea>
    <div class="approve-field-label">✉️ נושא המייל</div>
    <input type="text" class="chain-select" value="${esc(manualAdhocValue(item, subjKey))}" oninput="setManualAdhocField('${subjKey}', this.value)">
    <div class="approve-field-label">✉️ גוף המייל</div>
    <textarea class="broadcast-body-input" rows="6" oninput="setManualAdhocField('${bodyKey}', this.value)">${esc(manualAdhocValue(item, bodyKey))}</textarea>`;
}

// שליחה בפועל מ"הודעה בודדת" — משתמש בתוכן החד-פעמי (אם נערך) או בברירת המחדל מהתבנית הקבועה,
// עם אותם helper-ים של placeholder בדיוק (applyBizTpl/applyFanTplLocal/waLink, שורות ~1808-1818).
window.sendManualAdhoc = function(channel, id) {
  const isFans = manualPickerType === 'fans';
  const x = isFans ? findFan(id) : bizById(id);
  if (!x) return;
  const item = findMessageTemplate(isFans ? 'fanManual' : 'bizManual');
  if (channel === 'wa') {
    const tpl = manualAdhocValue(item, isFans ? 'fan_wa' : 'wa');
    const msg = isFans ? applyFanTplLocal(tpl, x.name, x.loginCode || '') : applyBizTpl(tpl, x.ownerFirst || '', x.name, x.accessToken || '');
    window.open(waLink(isFans ? x.phone : x.ownerPhone, msg), '_blank');
  } else {
    const subjTpl = manualAdhocValue(item, isFans ? 'fan_mailSubject' : 'mailSubject');
    const bodyTpl = manualAdhocValue(item, isFans ? 'fan_mail' : 'mail');
    const subject = encodeURIComponent(isFans ? subjTpl : applyBizTpl(subjTpl, x.ownerFirst || '', x.name, x.accessToken || ''));
    const body = encodeURIComponent(isFans ? applyFanTplLocal(bodyTpl, x.name, x.loginCode || '') : applyBizTpl(bodyTpl, x.ownerFirst || '', x.name, x.accessToken || ''));
    window.open(`mailto:${isFans ? x.email : x.ownerEmail}?subject=${subject}&body=${body}`, '_blank');
  }
};

    ${manualAdhocFieldsHtml()}`;
}

// ── בורר קהל inline לשידור המוני — משתמש **באותם סינונים בדיוק** של "כל העסקים"/"כל האוהדים"
// (bizFilteredList/bizFilterBarHtml — סטטוס/קטגוריה/סוג/מצב-סקירה/בריאות-פרופיל/תאריך/מיון,
// אותו state גלובלי) כדי לענות על הבקשה: "רק לממתינים", "הכי פחות שלבים נסקרו", "פרופיל לא בריא",
// "לפי קטגוריות" — כל אלה כבר קיימים שם, לא הומצאו מחדש. checkboxes על selectedBizIds/selectedFanIds
// (אותו Set שמשמש גם לבולק-אישור/דחייה שם — broadcastAudience() כבר קורא מהם).
// toggleBizSelect/toggleFanSelect/filterBizRows/toggleSelectAllBiz בטוחים לקריאה מכאן כי
// refreshBizList/refreshFanList הפכו ל-tab-aware (ר' למעלה) — נופלים ל-renderMain מלא כשלא
// בטאב "כל העסקים"/"כל האוהדים".
function broadcastAudPickerListHtml() {
  const isFans = broadcastAudienceType === 'fans';
  const filtered = isFans ? fanFilteredList() : bizFilteredList();
  if (!filtered.length) return `<div class="picker-empty">לא נמצאו תוצאות</div>`;
  const set = isFans ? selectedFanIds : selectedBizIds;
  const toggleFn = isFans ? 'toggleFanSelect' : 'toggleBizSelect';
  return filtered.slice(0, 100).map(x => {
    const sel = set.has(x.id);
    return `
    <label class="aud-picker-row">
      <input type="checkbox" ${sel?'checked':''} onchange="${toggleFn}('${x.id}')">
      <span class="nm">${esc(x.name)}</span>
    </label>`;
  }).join('');
}

// ── תצוגה מקדימה של המייל (שלב 5א, §8 במפרט) — placeholders מוחלפים בנתוני הנמען הראשון בקהל.
// applyBroadcastVars זהה בכוונה ל-applyVars ב-worker/src/brevo.js (split/join פשוט, לא regex) —
// אותה לוגיקת-החלפה בדיוק כמו מה שהוורקר עושה בפועל בזמן שליחה, כדי שהתצוגה תהיה נאמנה.
function broadcastVarsFor(item, isFans) {
  const base = `${location.origin}${location.pathname.replace(/[^/]*$/, '')}`;
  return isFans
    ? { name: item.firstName || item.ownerFirst || '', code: item.loginCode || '', link: base + 'home.html' }
    : { name: item.ownerFirst || '', business: item.name || '', link: item.accessToken ? base + 'business-dashboard.html?token=' + item.accessToken : '' };
}
function applyBroadcastVars(text, vars) {
  return Object.entries(vars).reduce((s, [k, v]) => s.split(`{${k}}`).join(v ?? ''), text || '');
}
function broadcastPreviewHtml(subject, body, audience, isFans) {
  if (!audience.length) return `<div class="broadcast-preview-empty">אין נמענים לתצוגה מקדימה</div>`;
  const first = audience[0];
  const vars = broadcastVarsFor(first, isFans);
  return `
    <div class="broadcast-preview">
      <div class="broadcast-preview-label">👁 תצוגה מקדימה — כפי שיראה ${isFans?'האוהד/ת':'בעל/ת העסק'} "${esc(first.name)}"</div>
      <div class="broadcast-preview-subject">${esc(applyBroadcastVars(subject, vars))}</div>
      <div class="broadcast-preview-body">${esc(applyBroadcastVars(body, vars)).replace(/\n/g,'<br>')}</div>
    </div>`;
}
// מעדכן רק את קופסת-התצוגה עצמה בהקלדה (לא renderMain מלא — היה מאבד פוקוס/מיקום-סמן בשדות)
window.updateBroadcastPreview = function() {
  const subjectEl = document.getElementById('broadcastSubject');
  const bodyEl = document.getElementById('broadcastBody');
  const box = document.getElementById('broadcastPreviewBox');
  if (!subjectEl || !bodyEl || !box) return;
  box.innerHTML = broadcastPreviewHtml(subjectEl.value, bodyEl.value, broadcastAudience(), broadcastAudienceType === 'fans');
};

// שורת "תגיות" של הקהל שנבחר בפועל — מוצגת מעל הרשימה, כדי שברור בלי לגלול מי כבר מסומן
function broadcastSelectedChipsHtml() {
  const isFans = broadcastAudienceType === 'fans';
  const set = isFans ? selectedFanIds : selectedBizIds;
  if (!set.size) return '';
  const items = [...set].map(id => isFans ? findFan(id) : bizById(id)).filter(Boolean);
  return `<div class="aud-chips-row">${items.map(x => `
    <span class="aud-chip">${esc(x.name)}<button onclick="${isFans?'toggleFanSelect':'toggleBizSelect'}('${x.id}')">✕</button></span>`).join('')}</div>`;
}

// מקטעים". המשתמש אישר במפורש להפוך את זה — "יותר נוח ככה" מ-2 טאבים. "שליחה עכשיו" = 2 המקטעים

// גוף-בלבד (בלי עטיפת-כרטיס/כותרת-קיפול משלו) — §136: מוצג בתוך sendNowSectionHtml כשמצב
// המתג הוא 'broadcast'. שום שינוי בלוגיקת-שליחה/שמירה/היסטוריה — רק הוסרה עטיפת ה-accordion.
// היסטוריית-שידורים — §139: עברה מ-broadcastTabHtml (הייתה בתחתית "שידור המוני") לעמודה-צדדית
// כהה-נייבי (history-card, לפי מוקאף demo-redesign-admin-messages.html) שמוצגת תמיד, בלי קשר
// לאיזה top-tab/מצב-שליחה פעיל. אותם שדות/פונקציות בדיוק (messageBroadcastHistory/resendFailedFromBroadcast).
function messageHistorySidebarHtml() {
  const senderName = (uid) => { const f = findFan(uid); return f ? f.name : 'מנהל'; };
  const itemsHtml = messageBroadcastHistory.length
    ? messageBroadcastHistory.map(h => `
      <div class="history-sep"></div>
      <div class="history-item">
        <div class="subj">${esc(h.subject)}</div>
        <div class="meta">${h.audienceGroup === 'fans' ? '👥 אוהדים' : '🏪 עסקים'}${h.sentAt ? ' · ' + fmtDateTime(h.sentAt) : ''}</div>
        <div class="stats-row">
          <span class="stat">${h.sentCount}/${h.totalRecipients} נשלחו בהצלחה</span>
          ${h.failedCount ? `<button class="btn-retry" onclick="resendFailedFromBroadcast('${h.id}')" ${broadcastSending?'disabled':''}>${h.failedCount} נכשלו · שליחה מחדש</button>` : ''}
        </div>
        <div class="actor">נשלח ע"י ${esc(senderName(h.sentByUid))}</div>
      </div>`).join('')
    : `<div class="history-sep"></div><div class="history-item"><div class="meta">עדיין לא נשלח אף שידור</div></div>`;
  return `
    <div class="history-card">
      <div class="history-head">
        <div class="history-kicker">מה נשלח</div>
        <div class="history-title">היסטוריית שידורים</div>
      </div>
      ${itemsHtml}
    </div>`;
}

function broadcastTabHtml() {
  const isFans = broadcastAudienceType === 'fans';
  const audience = broadcastAudience();
  const usingSelection = (isFans ? selectedFanIds : selectedBizIds).size > 0;
  const noun = isFans ? 'אוהדים' : 'עסקים';

  const audSummaryHtml = usingSelection
    ? `📌 קהל נבחר ידנית: <b>${audience.length} ${noun}</b> — <button class="filter-clear" onclick="${isFans ? 'clearFanSelection' : 'clearBizSelection'}()">נקה בחירה (לכל המאושרים)</button>`
    : `נשלח לכל ה${noun} <b>המאושרים</b> (${audience.length} כרגע) — או סמן/י קהל ספציפי ברשימה למטה:`;

  const varsHint = isFans ? '<code>{name}</code> / <code>{code}</code> / <code>{link}</code>' : '<code>{name}</code> / <code>{business}</code> / <code>{link}</code>';

  return `
    <div class="broadcast-audience-toggle">
      <button class="filter-pill ${!isFans?'active':''}" onclick="setBroadcastAudienceType('businesses')">🏪 עסקים</button>
      <button class="filter-pill ${isFans?'active':''}" onclick="setBroadcastAudienceType('fans')">👥 אוהדים</button>
    </div>
    <div class="aud-summary">${audSummaryHtml}</div>
    ${broadcastSelectedChipsHtml()}
    <div class="approve-field-label">🎯 בחירת קהל ספציפי (לא חובה) — סנן/י לפי סטטוס, קטגוריה, מצב סקירה, בריאות פרופיל ועוד, ואז סמנ/י מהרשימה:</div>
    ${isFans ? fanFilterBarHtml() : bizFilterBarHtml()}
    <div class="picker" style="margin-top:8px">
      <div class="picker-list" id="broadcastAudPickerList" style="max-height:280px">${broadcastAudPickerListHtml()}</div>
    </div>
    <div class="approve-field-label" style="margin-top:14px">נושא ההודעה</div>
    <input type="text" id="broadcastSubject" class="chain-select" value="${esc(broadcastDraft.subject)}" oninput="updateBroadcastPreview()" />
    <div class="approve-field-label">גוף ההודעה</div>
    <textarea id="broadcastBody" class="broadcast-body-input" rows="12" oninput="updateBroadcastPreview()">${esc(broadcastDraft.body)}</textarea>
    <div class="tpl-vars-box">${varsHint} יוחלפו אוטומטית לכל נמען. מייל בלבד (וואטסאפ נשאר ידני).</div>
    <div id="broadcastPreviewBox">${broadcastPreviewHtml(broadcastDraft.subject, broadcastDraft.body, audience, isFans)}</div>
    <div class="broadcast-test-row">
      <input type="email" id="broadcastTestEmail" placeholder="כתובת מייל לבדיקה" value="${esc(CURRENT_ADMIN.email)}">
      <button class="act-btn" onclick="sendTestBroadcastEmail()" ${broadcastTesting?'disabled':''}>${broadcastTesting ? '⏳ שולח בדיקה...' : '🧪 שלח מייל בדיקה אליי'}</button>
    </div>
    <div class="broadcast-actions">
      <button class="act-btn" onclick="saveBroadcastDraft()">💾 שמור טיוטה</button>
      <button class="act-btn approve" onclick="sendBroadcastNow()" ${broadcastSending || !audience.length ? 'disabled' : ''}>${broadcastSending ? '⏳ שולח...' : `📣 שלח ל-${audience.length} ${noun}`}</button>
    </div>`;
}

window.saveBroadcastDraft = async function() {
  const subject = document.getElementById('broadcastSubject').value.trim();
  const body = document.getElementById('broadcastBody').value.trim();
  broadcastDraft = { subject, body };
  try {
    await setDoc(doc(db, 'settings', 'broadcastDraft'), { subject, body }, { merge: true });
    alert('הטיוטה נשמרה');
  } catch (e) { console.error(e); alert('שגיאה בשמירת הטיוטה: ' + e.message); }
};

window.sendBroadcastNow = async function() {
  const subject = document.getElementById('broadcastSubject').value.trim();
  const body = document.getElementById('broadcastBody').value.trim();
  if (!subject || !body) { alert('חסר נושא או גוף הודעה'); return; }
  const isFans = broadcastAudienceType === 'fans';
  const noun = isFans ? 'האוהדים' : 'העסקים';
  const audience = broadcastAudience();
  if (!audience.length) { alert('אין נמענים לשלוח אליהם'); return; }
  const selectedSet = isFans ? selectedFanIds : selectedBizIds;
  const usingSelection = selectedSet.size > 0;
  const confirmMsg = usingSelection
    ? `לשלוח את ההודעה הזו במייל ל-${audience.length} ${noun} הנבחרים? הפעולה שולחת מייל אמיתי ולא ניתנת לביטול.`
    : `לשלוח את ההודעה הזו במייל ל-${audience.length} ${noun} המאושרים? הפעולה שולחת מייל אמיתי ולא ניתנת לביטול.`;
  if (!confirm(confirmMsg)) return;

  broadcastDraft = { subject, body };
  try { await setDoc(doc(db, 'settings', 'broadcastDraft'), { subject, body }, { merge: true }); } catch (e) { /* לא חוסם שליחה אם רק שמירת הטיוטה נכשלה */ }

  broadcastSending = true;
  renderMain();
  try {
    const idToken = await auth.currentUser.getIdToken();
    const idsField = isFans ? { memberIds: audience.map(x => x.id) } : { businessIds: audience.map(x => x.id) };
    const resp = await fetch(WORKER_URL + '/send-broadcast-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idToken, subject, body, audienceType: broadcastAudienceType, ...idsField }),
    });
    const data = await resp.json();
    if (data.error) { alert('שגיאה בשליחה: ' + data.error); return; }
    const results = data.results || [];
    const sentCount = results.filter(r => r.status === 'sent').length;
    const failedCount = results.filter(r => r.status === 'failed').length;
    await addDoc(collection(db, 'messageBroadcasts'), {
      subject, body, sentAt: serverTimestamp(), sentByUid: auth.currentUser.uid,
      audienceGroup: broadcastAudienceType, audienceType: usingSelection ? 'selected' : 'allApproved',
      totalRecipients: results.length, sentCount, failedCount, results,
    });
    if (usingSelection) selectedSet.clear();
    alert(`נשלח! ${sentCount} בהצלחה${failedCount ? `, ${failedCount} נכשלו` : ''}.`);
  } catch (e) {
    console.error(e);
    alert('שגיאה בשליחה: ' + e.message);
  } finally {
    broadcastSending = false;
    renderMain();
  }
};

// מייל בדיקה עצמי (שלב 5, §8 במפרט) — דורש תמיכת-שרת (worker/src/index.js, פרמטר testEmail חדש ב-
// handleSendBroadcastEmail) — נמען יחיד, ערכי-placeholder לדוגמה (לא נתוני-אמת, אין רשומת Firestore
// אמיתית מאחורי כתובת גולמית). דורש wrangler deploy כדי לעבוד בפועל — המשתמש מריץ, לא Claude.
window.sendTestBroadcastEmail = async function() {
  const subject = document.getElementById('broadcastSubject').value.trim();
  const body = document.getElementById('broadcastBody').value.trim();
  if (!subject || !body) { alert('חסר נושא או גוף הודעה'); return; }
  const testEmail = document.getElementById('broadcastTestEmail').value.trim();
  if (!testEmail) { alert('נא להזין כתובת מייל לבדיקה'); return; }
  broadcastTesting = true;
  renderMain();
  try {
    const idToken = await auth.currentUser.getIdToken();
    const resp = await fetch(WORKER_URL + '/send-broadcast-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idToken, subject, body, audienceType: broadcastAudienceType, testEmail }),
    });
    const data = await resp.json();
    if (data.error) { alert('שגיאה בשליחת מייל בדיקה: ' + data.error); return; }
    const ok = data.results && data.results[0] && data.results[0].status === 'sent';
    alert(ok ? `✅ מייל בדיקה נשלח ל-${testEmail}` : '❌ שליחת מייל הבדיקה נכשלה — ' + ((data.results && data.results[0] && data.results[0].error) || ''));
  } catch (e) {
    console.error(e);
    alert('שגיאה בשליחת מייל בדיקה: ' + e.message);
  } finally {
    broadcastTesting = false;
    renderMain();
  }
};

// שליחה מחדש לנכשלים בלבד (שלב 5ב, §8 במפרט) — results כבר נשמר עם status:'failed' לכל נמען,
// רק חסר כפתור. אותו endpoint בדיוק (/send-broadcast-email) עם רשימת-id מוגבלת לנכשלים, ורשומת-
// היסטוריה חדשה נפרדת (לא דורסת את המקורית — כדי לשמור עקבה מלאה מה נשלח מתי).
window.resendFailedFromBroadcast = async function(historyId) {
  const h = messageBroadcastHistory.find(x => x.id === historyId);
  if (!h) return;
  const failed = (h.results || []).filter(r => r.status === 'failed' && r.id);
  if (!failed.length) return;
  if (!confirm(`לשלוח שוב במייל ל-${failed.length} נמענים שנכשלו ב"${h.subject}"? הפעולה שולחת מייל אמיתי.`)) return;
  const isFans = h.audienceGroup === 'fans';
  broadcastSending = true;
  renderMain();
  try {
    const idToken = await auth.currentUser.getIdToken();
    const idsField = isFans ? { memberIds: failed.map(r => r.id) } : { businessIds: failed.map(r => r.id) };
    const resp = await fetch(WORKER_URL + '/send-broadcast-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idToken, subject: h.subject, body: h.body, audienceType: h.audienceGroup, ...idsField }),
    });
    const data = await resp.json();
    if (data.error) { alert('שגיאה בשליחה חוזרת: ' + data.error); return; }
    const results = data.results || [];
    const sentCount = results.filter(r => r.status === 'sent').length;
    const failedCount = results.filter(r => r.status === 'failed').length;
    await addDoc(collection(db, 'messageBroadcasts'), {
      subject: h.subject, body: h.body, sentAt: serverTimestamp(), sentByUid: auth.currentUser.uid,
      audienceGroup: h.audienceGroup, audienceType: 'resendFailed', resendOf: h.id,
      totalRecipients: results.length, sentCount, failedCount, results,
    });
    alert(`נשלח שוב! ${sentCount} בהצלחה${failedCount ? `, ${failedCount} עדיין נכשלו` : ''}.`);
  } catch (e) {
    console.error(e);
    alert('שגיאה בשליחה חוזרת: ' + e.message);
  } finally {
    broadcastSending = false;
    renderMain();
  }
};

function homeTabHtml() {
  return `
    ${homeStatsHtml()}
    <div class="section-h2-row">
      <div class="section-h2">⚡ מרכז המשימות — דורש טיפול</div>
    </div>
    ${taskCenterHtml()}
    ${roadmapPanelHtml()}`;
}

function renderMain() {
  const wrap = document.getElementById('tabContent');
  if (!activeTab) {
    wrap.innerHTML = `<div class="placeholder-note">👈 בחר פריט מהתפריט בצד כדי להתחיל</div>`;
    return;
  }
  if (activeTab === HOME_KEY) {
    wrap.innerHTML = homeTabHtml();
    return;
  }
  if (activeTab === ALL_BIZ_KEY) {
    wrap.innerHTML = bizListHtml();
    return;
  }
  if (activeTab === ALL_FANS_KEY) {
    wrap.innerHTML = fanListHtml();
    return;
  }
  if (activeTab === TAGS_MGMT_KEY) {
    wrap.innerHTML = tagsManagementHtml();
    return;
  }
  if (activeTab === WEEKLY_KEY) {
    wrap.innerHTML = weeklyPicksHtml();
    return;
  }
  if (activeTab === HEARTS_KEY) {
    wrap.innerHTML = heartsCenterHtml();
    return;
  }
  if (activeTab === BROADCAST_KEY) {
    wrap.innerHTML = messageCenterHtml();
    return;
  }
  if (activeTab === LANDING_KEY) {
    wrap.innerHTML = landingContentTabHtml();
    return;
  }
  if (activeTab === DATA_KEY) {
    wrap.innerHTML = dataCenterHtml();
    return;
  }
  const tab = tabMeta(activeTab);
  wrap.innerHTML = `
    ${infoAccordionHtml()}
    ${tabInfoHtml(tab)}
    <div class="sections-layout">
      <div class="sections-col-main">
        <div class="preview-label">👁 ככה זה ייראה בפועל</div>
        <div class="preview-strip">${previewStripHtml(tab)}</div>
        <div class="slots-wrap">
          <div class="slots-wrap-head">עשרת המיקומים</div>
          <div class="slots">${slotsHtml(tab)}</div>
        </div>
        <div class="section-note">10 המיקומים הראשונים בלבד ניתנים לעיגון. השאר תמיד אוטומטי.</div>
      </div>
      <div class="sections-col-side">
        ${expiringPanelHtml()}
      </div>
    </div>`;
}

function renderAll() {
  renderSidebar();
  renderMain();
}

// admin guard — session אמיתי (Firebase Auth) + isAdmin:true על רשומת החבר, זהה ל-admin-businesses.html/admin-members.html
await new Promise(resolve => {
  const unsub = onAuthStateChanged(auth, async user => {
    unsub();
    if (!user) { location.href = 'welcome.html'; return; }
    const snap = await getDoc(doc(db, 'members', user.uid));
    if (!snap.exists() || snap.data().isAdmin !== true) { location.href = 'home.html'; return; }
    const adminData = snap.data();
    CURRENT_ADMIN = { uid: user.uid, name: `${adminData.firstName || ''} ${adminData.lastName || ''}`.trim() || adminData.email || 'מנהל', email: adminData.email || '' };
    resolve();
  });
});

let _bizLoaded = false, _fanLoaded = false;
function maybeInitialRender() { if (_bizLoaded && _fanLoaded) renderAll(); }

onSnapshot(collection(db, 'businesses'), snapshot => {
  MOCK_BUSINESSES = snapshot.docs.map(d => hydrateBiz(d.id, d.data()));
  _bizLoaded = true;
  if (_fanLoaded) renderAll(); else maybeInitialRender();
}, err => console.error('שגיאה בטעינת עסקים מ-Firestore:', err));

onSnapshot(collection(db, 'members'), snapshot => {
  MOCK_FANS = snapshot.docs.map(d => hydrateFan(d.id, d.data()));
  _fanLoaded = true;
  if (_bizLoaded) renderAll(); else maybeInitialRender();
}, err => console.error('שגיאה בטעינת אוהדים מ-Firestore:', err));

// עסק השבוע · הטבת השבוע — 2 אוספים, לא חוסמים את הרינדור הראשוני (תורים קטנים, לא קריטיים כמו עסקים/אוהדים)
onSnapshot(collection(db, 'weekly_interest'), snapshot => {
  WEEKLY_INTEREST = snapshot.docs.map(d => ({ id: d.id, ...d.data(), requestedAt: toJsDate(d.data().requestedAt) }));
  if (activeTab === WEEKLY_KEY) renderMain();
}, err => console.error('שגיאה בטעינת "מי הביע עניין" מ-Firestore:', err));

onSnapshot(collection(db, 'weekly_schedule'), snapshot => {
  WEEKLY_SCHEDULE = snapshot.docs.map(d => ({ id: d.id, ...d.data(), approvedAt: toJsDate(d.data().approvedAt) }));
  if (activeTab === WEEKLY_KEY) renderMain();
}, err => console.error('שגיאה בטעינת לוח השבועות מ-Firestore:', err));

// עיגוני סקשנים/קטגוריות — מסמך יחיד, לא חוסם את הרינדור הראשוני (state כבר מאותחל ריק, "הכל אוטומטי")
onSnapshot(doc(db, 'settings', 'sectionAnchors'), snap => {
  Object.assign(state, anchorsDocToState(snap.exists() ? snap.data() : null));
  renderAll();
}, err => console.error('שגיאה בטעינת עיגונים מ-Firestore:', err));

// קטלוג תגיות — מסמך יחיד, נופל בחזרה לברירת המחדל הקשיחה אם עוד לא נכתב אף פעם
onSnapshot(doc(db, 'settings', 'tagTaxonomy'), snap => {
  const data = snap.exists() ? snap.data() : {};
  Object.keys(TAGS_BY_CATEGORY_MOCK).forEach(k => delete TAGS_BY_CATEGORY_MOCK[k]);
  Object.assign(TAGS_BY_CATEGORY_MOCK, Object.keys(data).length ? data : TAG_TAXONOMY_DEFAULTS);
  renderAll();
}, err => console.error('שגיאה בטעינת קטלוג תגיות מ-Firestore:', err));

// מרכז הפצת הודעות — טיוטת הנושא/גוף הנוכחית (נופלת לברירת המחדל הקבועה בקוד אם עוד לא נשמרה אף פעם)
onSnapshot(doc(db, 'settings', 'broadcastDraft'), snap => {
  if (snap.exists()) broadcastDraft = { subject: snap.data().subject || '', body: snap.data().body || '' };
  if (activeTab === BROADCAST_KEY) renderMain();
}, err => console.error('שגיאה בטעינת טיוטת שידור מ-Firestore:', err));

// תבניות ההודעה הקבועות (מרכז הודעות) — אותם מסמכים בדיוק שקורא/כותב admin-messages.html הישן,
// כדי ששני המסכים יישארו תמיד מסונכרנים בלי מיגרציה.
onSnapshot(TPL_SETTINGS_DOC(), snap => {
  tplFirestoreData = snap.exists() ? snap.data() : {};
  if (activeTab === BROADCAST_KEY) renderMain();
}, err => console.error('שגיאה בטעינת תבניות הודעה מ-Firestore:', err));
onSnapshot(TPL_SITE_TEXTS_DOC(), snap => {
  tplSiteTextsData = snap.exists() ? snap.data() : {};
  if (activeTab === BROADCAST_KEY) renderMain();
}, err => console.error('שגיאה בטעינת טקסטי אתר מ-Firestore:', err));

// היסטוריית שידורים — 10 האחרונים בלבד
onSnapshot(query(collection(db, 'messageBroadcasts'), orderBy('sentAt', 'desc'), limit(10)), snapshot => {
  messageBroadcastHistory = snapshot.docs.map(d => ({ id: d.id, ...d.data(), sentAt: toJsDate(d.data().sentAt) }));
  if (activeTab === BROADCAST_KEY) renderMain();
}, err => console.error('שגיאה בטעינת היסטוריית שידורים מ-Firestore:', err));

// תוכן דף הנחיתה (שלב 6) — live + טיוטה. landingWorking מאותחל פעם אחת בלבד כששניהם נטענו
// (maybeInitLandingWorking) — לא בכל snapshot, כדי לא לדרוס עריכה באמצע הקלדה עם ההד מהכתיבה
// העצמית שלנו לטיוטה (scheduleLandingDraftSave).
onSnapshot(doc(db, 'settings', 'landingContent'), snap => {
  landingLiveDoc = snap.exists() ? snap.data() : null;
  _landingLiveLoaded = true;
  maybeInitLandingWorking();
  if (activeTab === LANDING_KEY && landingWorking) landingRefreshChrome();
}, err => console.error('שגיאה בטעינת תוכן דף הנחיתה מ-Firestore:', err));

onSnapshot(doc(db, 'settings', 'landingContentDraft'), snap => {
  landingDraftDoc = snap.exists() ? snap.data() : null;
  _landingDraftLoaded = true;
  maybeInitLandingWorking();
}, err => console.error('שגיאה בטעינת טיוטת תוכן דף הנחיתה מ-Firestore:', err));
</script>
