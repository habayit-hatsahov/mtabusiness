    // (2) שני השדות קראו רק מ-raw (המצב המאושר/הישן), אף פעם לא מ-raw.pendingChanges (מה שבעל
    //     העסק בפועל ביקש ועדיין ממתין לאישור) — אז אם הייתה בקשה ממתינה, המנהל היה עורך על סמך
    //     נתונים ישנים, והשמירה הייתה דורסת את הבקשה האמיתית של בעל העסק בלי לדעת שהוא בכלל ראה אותה.
    aiShortTitle: (raw.pendingChanges && 'discountText' in raw.pendingChanges) ? raw.pendingChanges.discountText : (raw.discountText || ''),
    discountFullText: (raw.pendingChanges && 'discountTextFull' in raw.pendingChanges) ? raw.pendingChanges.discountTextFull : (raw.discountTextFull || ''),
    // אותו תיקון (2) גם כאן — הטבה 2/3 חייבות להעדיף בקשה-ממתינה על פני המצב הישן, מאותה סיבה בדיוק
    additionalDiscounts: (raw.pendingChanges && 'additionalDiscounts' in raw.pendingChanges) ? raw.pendingChanges.additionalDiscounts : (raw.additionalDiscounts || []),

    // מכיל *רק* את השדות שבעל-העסק הגיש בפועל (realPendingChangeKeys) — שדה-נגזר או ערך זהה-לקיים
    // אינו "בקשה", ולכן גם null כשאין אף שינוי אמיתי: זה מה שמוריד את העסק מ"בקשות מבעלי עסקים"
    // (classifyAction/hasPendingChange) במקום להשאיר שם רשומה בלי שום דבר להכריע בו.
    pendingChangeDiff: realPending.length ? Object.fromEntries(
      realPending.map(k => [k, { old: fmtDiffVal(k, raw[k]), new: fmtDiffVal(k, raw.pendingChanges[k]) }])
    ) : null,

    isNew: !!raw.isNew,
    isFeatured: !!raw.isFeatured,

    // "רוצה לכתוב לנו משהו?" — הודעה חופשית מבעל העסק (שלב הסיכום בהרשמה, business.html), לא בקשת
    // שינוי (יכולים לכתוב על כל נושא) — לכן מוצגת בנפרד מ"מה מבקשים לשנות". noteHandled מסומן ידנית
    // ע"י המנהל; noteHandledAt משמש לניקוי אוטומטי אחרי כמה ימים שבעל העסק צפה בסטטוס "טופל" (ר' business-dashboard.html).
    note: raw.note || '',
    // noteAt (§235) — מתי ההודעה נכתבה. קיים רק מ-2026-08-21 ואילך; להודעות ישנות יותר
    // הוא null, ואז פשוט לא מוצגת שורת-תאריך (עדיף מאשר לנחש תאריך שגוי).
    noteAt: toJsDate(raw.noteAt),
    noteHandled: !!raw.noteHandled,
    noteHandledAt: toJsDate(raw.noteHandledAt),
    noteOwnerAckAt: toJsDate(raw.noteOwnerAckAt),
    // catKey/icon — CATEGORIES כבר תואם למבנה האמיתי (fashion+sport נפרדים, ר' §59); עסק עם קטגוריה
    // שלא ברשימה מכל סיבה עדיין יוצג בלי אייקון (fallback 🏪 למטה) — לא קורס.
    catKey: raw.categoryPrimary || raw.cat || '',
  };
  b.icon = (CATEGORIES.find(c => c.key === b.catKey) || {}).icon || '🏪';
  b.healthScore = computeHealthScore(b);
  return b;
}

// ממפה מסמך members אמיתי (אוהד) לצורה שה-UI הקיים מצפה לה — לא כל אוהד הוא בעל עסק, ר' isBusinessOwner

    // הפרצה. חבר שהצ'יפ שלו ריק = אין לו מסמך ב-memberCodes, וצריך להנפיק לו קוד.

    // העבודה על כניסה עם גוגל.
    lastSeenAt: toJsDate(raw.lastSeenAt),
    rejectedAt: toJsDate(raw.rejectedAt),
    loginCodeCreatedAt: toJsDate(raw.loginCodeCreatedAt),
    loginCodeEmailQueuedAt: toJsDate(raw.loginCodeEmailQueuedAt), // מתי נכנס לתור השליחה — בסיס למדידת איחור
    loginCodeEmailSentAt: toJsDate(raw.loginCodeEmailSentAt),
    loginCodeEmailDeliveryAt: toJsDate(raw.loginCodeEmailDeliveryAt),   // מ-webhook המסירה של Brevo, §205
    loginCodeEmailOpenedAt: toJsDate(raw.loginCodeEmailOpenedAt),       // פתיחה בפועל, §206

  };
}

function findBiz(id) { return MOCK_BUSINESSES.find(b => b.id === id); }

// ── מיקום תמונה מייצגת על הכרטיס (coverPhotoPosition) — גרירה חיה בתוך תצוגה-מקדימה ביחס 4:3,
// זהה בדיוק ל-.biz-card-img/.biz-card-cover-img ב-home.html (ר' PROJECT_CONTEXT.md §184). נשמר
// כ-CSS object-position ("X% Y%") ומוזרם ישירות לתמונת-הכרטיס האמיתית — לא רק תצוגה-מקדימה פרטית.
// coverPhotoZoom (2026-08-16) — נוסף אחרי דיווח-אמת שהחיתוך ל-4:3 קוטע כיתוב בתחתית התמונה
// ("יש הדברה", "מובי סל"). ערך null/0 = התנהגות היסטורית בדיוק כמו שהייתה (object-fit:cover);
// מספר ≥1 = "כל התמונה נכנסת" (object-fit:contain) ומעליו קירוב שחותך בהדרגה. coverPhotoPosition
// משמש בשני המצבים (object-position במצב הישן, transform-origin במצב החדש) — אותו כיוון-גרירה.
const bizCoverPosEdits = {};
const bizCoverZoomEdits = {};
const COVER_ZOOM_MIN = 1, COVER_ZOOM_MAX = 2.5;
function parseCoverPos(str) {
  const m = /^(\d+(?:\.\d+)?)%\s+(\d+(?:\.\d+)?)%$/.exec(String(str || '').trim());
  return m ? { x: parseFloat(m[1]), y: parseFloat(m[2]) } : { x: 50, y: 50 };
}
function getCoverPos(id) {
  if (!bizCoverPosEdits[id]) {
    const b = findBiz(id);
    bizCoverPosEdits[id] = parseCoverPos(b && b.coverPhotoPosition);
  }
  return bizCoverPosEdits[id];
}
// null = מצב "מילוי הכרטיס" (ברירת המחדל ההיסטורית), מספר = מצב "כל התמונה"+קירוב
function getCoverZoom(id) {
  if (bizCoverZoomEdits[id] === undefined) {
    const b = findBiz(id);
    const z = parseFloat(b && b.coverPhotoZoom);
    bizCoverZoomEdits[id] = z > 0 ? z : null;
  }
  return bizCoverZoomEdits[id];
}
// מילוי השוליים במצב "כל התמונה": '' = טשטוש מהתמונה עצמה (ברירת מחדל), או צבע אחיד ('#rrggbb').
// מסגרת 4:3 מול תמונה ביחס אחר תמיד תשאיר חיתוך או שוליים — הפתרון הוא להפוך את השוליים
// לבלתי-נראים (המשתמש: "אין פתרון לזה שאיך שהתמונה עלתה יראו במלואה?"). בתמונת-פלייר עם רקע
// אחיד, צבע תואם גורם לתמונה להיראות כאילו היא פשוט ממלאת את כל הכרטיס.
const bizCoverBgEdits = {};
function getCoverBg(id) {
  if (bizCoverBgEdits[id] === undefined) {
    const b = findBiz(id);
    bizCoverBgEdits[id] = (b && b.coverPhotoBg) || '';
  }
  return bizCoverBgEdits[id];
}
function applyCoverPos(id) {
  const img = document.getElementById('coverPosImg_' + id);
  if (!img) return;
  const pos = getCoverPos(id);
  const posStr = pos.x.toFixed(0) + '% ' + pos.y.toFixed(0) + '%';
  const zoom = getCoverZoom(id);
  const bg = document.getElementById('coverPosBg_' + id);
  const fill = document.getElementById('coverPosFill_' + id);
  const bgColor = getCoverBg(id);
  if (zoom) {
    img.classList.add('fitted');
    img.style.objectPosition = '';
    img.style.setProperty('--cover-zoom', String(zoom));
    img.style.setProperty('--cover-origin', posStr);
    if (bg) bg.style.display = bgColor ? 'none' : '';
    if (fill) { fill.style.display = bgColor ? '' : 'none'; fill.style.background = bgColor || ''; }
  } else {
    img.classList.remove('fitted');
    img.style.removeProperty('--cover-zoom');
    img.style.removeProperty('--cover-origin');
    img.style.objectPosition = posStr;
    if (bg) bg.style.display = 'none';
    if (fill) fill.style.display = 'none';
  }
  const valEl = document.getElementById('coverZoomVal_' + id);
  if (valEl) valEl.textContent = coverZoomLabel(zoom);
  const fillRow = document.getElementById('coverFillRow_' + id);
  if (fillRow) fillRow.style.display = zoom ? '' : 'none';
}
// logoFit — '' (ברירת מחדל, cover) או 'contain'. ר' ההערה ליד .biz-card-logo-badge.fit ב-home.html
window.setBizLogoFit = async function(id, fit) {
  await saveSectionUpdates(id, { logoFit: fit || '' }, { reopenStep: 5 });
};
window.setCoverBg = function(id, color) {
  bizCoverBgEdits[id] = color || '';
  const picker = document.getElementById('coverBgColor_' + id);
  if (picker && color) picker.value = color;
  applyCoverPos(id);
};
function coverZoomLabel(zoom) {
  if (!zoom) return 'מילוי הכרטיס';
  if (zoom <= COVER_ZOOM_MIN + 0.001) return 'כל התמונה';
  return 'קירוב ' + Math.round(zoom * 100) + '%';
}
let coverDragState = null;
window.startCoverDrag = function(ev, id) {
  ev.preventDefault();
  const box = document.getElementById('coverPosBox_' + id);
  if (!box) return;
  const rect = box.getBoundingClientRect();
  const cur = getCoverPos(id);
  coverDragState = { id, startX: ev.clientX, startY: ev.clientY, startPosX: cur.x, startPosY: cur.y, w: rect.width, h: rect.height };
  box.classList.add('dragging');
  box.setPointerCapture && box.setPointerCapture(ev.pointerId);
};
document.addEventListener('pointermove', (ev) => {
  if (!coverDragState) return;
  const dx = ev.clientX - coverDragState.startX;
  const dy = ev.clientY - coverDragState.startY;
  // גרירה ימינה = "מזיזים את התמונה ימינה" (המשתמש רואה יותר מהצד השמאלי שלה) — לכן ההפחתה, לא הוספה.
  const nx = Math.min(100, Math.max(0, coverDragState.startPosX - (dx / coverDragState.w) * 100));
  const ny = Math.min(100, Math.max(0, coverDragState.startPosY - (dy / coverDragState.h) * 100));
  bizCoverPosEdits[coverDragState.id] = { x: nx, y: ny };
  applyCoverPos(coverDragState.id);
});
document.addEventListener('pointerup', () => {
  if (!coverDragState) return;
  document.getElementById('coverPosBox_' + coverDragState.id)?.classList.remove('dragging');
  coverDragState = null;
});
window.resetCoverPos = function(id) {
  bizCoverPosEdits[id] = { x: 50, y: 50 };
  applyCoverPos(id);
};
// מעבר בין שני המצבים. "מילוי הכרטיס" = null (התנהגות היסטורית), "כל התמונה" = COVER_ZOOM_MIN.
window.setCoverFitMode = function(id, mode) {
  bizCoverZoomEdits[id] = mode === 'fit' ? COVER_ZOOM_MIN : null;
  if (mode !== 'fit') bizCoverBgEdits[id] = '';   // צבע-שוליים לא רלוונטי במצב "מילוי" — אין שוליים
  bizCoverPosEdits[id] = { x: 50, y: 50 };
  const slider = document.getElementById('coverZoomRange_' + id);
  if (slider) { slider.value = String(COVER_ZOOM_MIN); slider.disabled = mode !== 'fit'; }
  document.querySelectorAll(`[data-cover-fit="${id}"]`).forEach(btn => btn.classList.toggle('approve', btn.dataset.coverMode === mode));
  applyCoverPos(id);
};
window.setCoverZoom = function(id, v) {
  const z = Math.min(COVER_ZOOM_MAX, Math.max(COVER_ZOOM_MIN, parseFloat(v) || COVER_ZOOM_MIN));
  bizCoverZoomEdits[id] = z;
  applyCoverPos(id);
};
window.saveCoverPos = async function(id) {
  const pos = getCoverPos(id);
  const zoom = getCoverZoom(id);
  await saveSectionUpdates(id, {
    coverPhotoPosition: pos.x.toFixed(0) + '% ' + pos.y.toFixed(0) + '%',
    // null מנקה את השדה ומחזיר את הכרטיס להתנהגות "מילוי" — לא משאיר ערך ישן תקוע
    coverPhotoZoom: zoom ? Number(zoom.toFixed(2)) : null,
    coverPhotoBg: zoom ? (getCoverBg(id) || '') : '',
  }, { reopenStep: 5 });
};

// ── תמונה-קטנה עם כפתור-הורדה צמוד + לייטבוקס בלחיצה — זהה בהיגיון ל-admin-businesses.html
// (mediaThumbHtml/downloadImage שם). המשתמש דחה במפורש <a target="_blank"> — רצה הורדה ישירה מהתמונה
// עצמה בלי לצאת מהעמוד, ותצוגה-גדולה שלא פותחת טאב חדש. ר' PROJECT_CONTEXT.md §185.
let lightboxCurrentUrl = '';
let lightboxCurrentFilename = '';
// תמונה של עסק pending/rejected חסומה ב-storage.rules ל-<img>/הורדה רגילים בלי אימות (ר' §193,
// storage.rules:46-48) — Worker /view-image מביא אותה בצד-שרת עם הרשאת ה-service-account (עוקף
// את הרוב דרך GCS ישיר, ר' worker/src/download.js) ומחזיר inline. משמש לכל תצוגת-תמונה כאן
// (thumbnail/lightbox) — לא רק ל-downloadImage שכבר עבר דרך /download-image.
// §317 — width אופציונלי: מבקש מה-Worker להחזיר גרסה מוקטנת (ר' resizeOrOriginal ב-
// worker/src/download.js). בלי הפרמטר ההתנהגות זהה לחלוטין למה שהיה — המקור המלא.
function bizImageViewUrl(url, width) {
  if (!url) return '';
  return WORKER_URL + '/view-image?url=' + encodeURIComponent(url) + (width ? '&w=' + width : '');
}
function mediaThumbHtml(url, filename, sizeStyle, alt, objectFit) {
  if (!url) return '';
  const safeUrl = esc(url);
  const viewUrl = esc(bizImageViewUrl(url, 288));
  return `
    <div class="media-thumb-wrap" style="${sizeStyle}" onclick="openImageLightbox('${safeUrl}','${esc(filename || 'image.jpg')}')">
      <img src="${viewUrl}" alt="${esc(alt || '')}" loading="lazy" decoding="async" onerror="markBizImageBroken(this)" style="width:100%;height:100%;object-fit:${objectFit || 'cover'};display:block;">
      <button type="button" class="thumb-download-btn" title="הורד תמונה" onclick="event.stopPropagation();downloadImage('${safeUrl}','${esc(filename || 'image.jpg')}')">⬇</button>
    </div>`;
}
// ── מידות אמיתיות מתחת לתמונה המייצגת במסך האישור (§240) ────────────────────────────────────
// נמדד מהתמונה שנטענה בפועל (naturalWidth) ולא משדה שמור — כי אין כזה: המידות אף פעם לא נשמרו
// ב-Firestore, ולתמונה שממתינה לאישור אין בכלל רשומה משלה.
//
// "רוחב אפקטיבי" = כמה פיקסלים אמיתיים נמתחים על **רוחב הכרטיס** אחרי החיתוך ל-4:3:
//   יחס ≥ 4/3 → הגובה הוא האילוץ, ונמתחים h×4/3     |  יחס < 4/3 → הרוחב הוא האילוץ, ונמתחים w
// הספים: כרטיס במובייל הוא ~358px CSS, כלומר 1070 פיקסלים ב-DPR 3 ו-715 ב-DPR 2. מתחת ל-715
// התמונה מטושטשת בכל מכשיר, ולא קיים קוד שיתקן את זה — צריך קובץ מקור אחר.
window.qjStampDims = function (img) {
  const out = img.closest('.qj-cover-cell') && img.closest('.qj-cover-cell').querySelector('.qj-cover-dims');
  if (!out) return;
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h) return;
  const eff = Math.round((w / h) >= 4 / 3 ? h * 4 / 3 : w);
  const verdict = eff < 715 ? '<span class="qj-dim-bad">❌ מטושטש</span>'

                : '<span class="qj-dim-ok">✅ חד</span>';

};
// ── §297 — תמונה שלא נטענת אומרת את זה ────────────────────────────────────────────────────
// עד היום `<img>` שנכשל השאיר ריבוע ריק, והמנהל לא ידע אם אין ראיה או שיש והיא לא מוצגת —
// שתי מסקנות הפוכות. הכי סביר: קובץ בפורמט שהדפדפן לא מציג (HEIC של אייפון), אבל זה תופס
// כל כשל-טעינה — קישור פג, קובץ שנמחק, או ה-Worker שלא הגיב. ההורדה עדיין אפשרית, כי
// הקובץ עצמו תקין; רק הדפדפן לא יודע לצייר אותו.
// §298 — markFanProofBroken נמחקה: כרטיס האוהד משתמש עכשיו באותו markProofImageBroken
// של כרטיס העסק, כי שני הכרטיסים חולקים את אותו מבנה.
// גרסת-התמונונת של markProofImageBroken. נפרדת ממנה בכוונה: זו מחליפה ב-owner-verify-photo-empty
// שמעוצב לעמודה של 232px, וכאן מדובר בריבועים של 36px ובתאי-שער של 220px.
window.markBizImageFailed = function(img) {
  if (window.hbImageNextHost && window.hbImageNextHost(img)) return;   // §375 — ר' markBizImageBroken

// §375 — לפני שמכריזים "לא נטענה", מנסים את הכתובת הבאה ברשימה. `ERR_NAME_NOT_RESOLVED` על
// הכתובת הראשית הוא בדיוק אותו onerror כמו קובץ פגום, ובלי הניסיון הזה הודעת-השגיאה מאשימה
// את התמונה בתקלת-רשת שלנו. אין דגל-"טופל" לפני הניסיון: hbImageNextHost מקדם כתובת אחת בכל
// קריאה ולכן הרצף עצמו סופי — שלוש כתובות, שלושה onerror לכל היותר, ואז false.
window.markBizImageBroken = function(img) {
  if (window.hbImageNextHost && window.hbImageNextHost(img)) return;
  if (!img || img.dataset.brokenHandled) return;
  img.dataset.brokenHandled = '1';
  const box = document.createElement('div');
  box.className = 'img-broken';
  box.title = 'הקובץ קיים אך לא נטען בדפדפן — אפשר להוריד אותו בכפתור ⬇';
  box.textContent = '⚠️ לא נטענה';
  img.replaceWith(box);
};

// מוריד דרך פרוקסי — עוקף חסימת CORS של הדפדפן על fetch() ישיר לכתובת Firebase Storage, זהה-ביט-לביט
// ל-downloadImage ב-admin-businesses.html (localhost→server.ps1 /api/download-image, פרודקשן→Worker).
window.downloadImage = function(url, filename) {
  if (!url) return;
  const isLocalDev = location.hostname === 'localhost';
  const base = isLocalDev ? '/api/download-image' : (WORKER_URL + '/download-image');
  const proxyUrl = base + '?url=' + encodeURIComponent(url) + '&filename=' + encodeURIComponent(filename || 'image.jpg');
  const a = document.createElement('a');
  a.href = proxyUrl;
  a.download = filename || 'image.jpg';
  document.body.appendChild(a);
  a.click();
  a.remove();
};

// תאימות לאחור: discountRedeemMode/redeemMode היו מחרוזת יחידה לפני שהמימוש הפך לבחירה מרובה (ר' PROJECT_CONTEXT.md §182)
function toRedeemArr(x) { return Array.isArray(x) ? x : (x ? [x] : []); }

// ── קוד כניסה של האוהד המקושר לעסק — לא שדה על מסמך העסק עצמו (הוא על members/{ownerMemberId}),
// לכן לא זמין סינכרונית מ-hydrateBiz. נשלף ברקע (זהה ללוקאפ ב-admin-businesses.html openBizSheet
// שנוסף היום) ונשמר במטמון קטן; bizFullDetailHtml מציג "..." עד שהוא מגיע ואז מרנדר מחדש.
const ownerLoginCodeCache = {};
async function fetchOwnerLoginCode(b) {
  if (ownerLoginCodeCache[b.id] !== undefined) return;
  let code = '';
  try {
    // §248 — הקוד עבר ל-memberCodes/{memberId}, ולכן קודם מזהים את מזהה-החבר ורק אז שולפים
    // ממנו את הקוד. MEMBER_CODES כבר טעון ברוב המקרים (onSnapshot), ונשמר כאן גם מסלול-גיבוי
    // של קריאה ישירה למקרה שהעסק נפתח לפני שה-listener הספיק לחזור.
    let memberId = b.ownerMemberId || '';
    let memberData = null;
    if (!memberId && b.ownerEmail) {
      const s = await getDocs(query(collection(db, 'members'), where('email', '==', b.ownerEmail)));
      if (!s.empty) { memberId = s.docs[0].id; memberData = s.docs[0].data(); }
    }
    if (memberId) {
      code = MEMBER_CODES[memberId] || '';
      if (!code) {
        const cs = await getDoc(doc(db, 'memberCodes', memberId));
        if (cs.exists()) code = cs.data().loginCode || '';
      }
    }
  } catch (e) { console.warn('ownerLoginCode lookup failed', e); }
  ownerLoginCodeCache[b.id] = code;
  // ── §246 — הצ'יפ "קוד כניסה" לא הופיע בפתיחה הראשונה של עסק ─────────────────────────────
  // התנאי כאן היה `if (selectedBizDetailId === b.id) renderMain()` — כלומר הרענון היה קשור
  // לפאנל של טאב "כל העסקים" בלבד. המשתמש עובד בפועל דרך **מרכז המשימות**, שם הפאנל הוא
  // `.task-drawer-body` ולא `#bizDetailCol` (אותו פער בדיוק כמו §4319 בקפיצת-הגלילה), ולכן
  // כשהקוד חזר מהשרת אחרי שהכרטיס כבר צויר — שום דבר לא צייר אותו מחדש, והצ'יפ לא הופיע.
  // בלחיצה שנייה על אותו עסק הוא כן הופיע, כי אז הוא כבר במטמון בזמן הרינדור — וזה בדיוק
  // מה שהוכיח שמדובר בתזמון ולא בנתונים או בהרשאות.
  // refreshOpenDetailPanel מכסה את שלושת סוגי הפאנלים ומחזיר false אם אף אחד לא פתוח.
  // מותנה ב-code כדי לא לבנות פאנל מחדש כשאין מה להוסיף.
  if (code && !refreshOpenDetailPanel() && selectedBizDetailId === b.id) renderMain();
}

// בריאות פרופיל נגזרת מ-4 שדות שבפועל משפיעים על איכות הכרטיס באינדקס — לא נוסחה שרירותית,
// כדי שהאחוז יהיה ניתן להסבר ("חסר: X, Y") ולא רק מספר בלי משמעות.
const HEALTH_CHECKLIST = [
  { test: b => !!b.hasCoverPhoto,   label: '🖼️ תמונה מייצגת' }, // לוגו בכוונה לא נספר כאן — לא לכל עסק יש אחד, רק תמונה מייצגת חובה
  { test: b => !!b.hoursText,       label: '🕒 שעות פעילות' },
  { test: b => !!b.descriptionText, label: '📝 תיאור עסק' },
  { test: b => !!b.hasDiscount,     label: '🏷️ הטבה מוגדרת' },
];
function computeHealthScore(b) {
  return Math.round((HEALTH_CHECKLIST.filter(c => c.test(b)).length / HEALTH_CHECKLIST.length) * 100);
}
function missingFieldsFor(b) {
  return HEALTH_CHECKLIST.filter(c => !c.test(b)).map(c => c.label);
}

// ── §252 — "סמן טופל" לכרטיס חסר ────────────────────────────────────────────────────────────
// 3 מתוך 4 השדות ב-HEALTH_CHECKLIST אינם חובה על העסק בפועל (הטבה / שעות / תיאור): עסק שבחר
// לא להגדיר הטבה נשאר "כרטיס חסר באינדקס" לנצח וממלא את מרכז-המשימות בפריטים שאין עליהם מה
// להחליט. הסימון כאן אומר "ראיתי, זה בסדר ככה" — הוא **לא** משנה שום נתון של העסק ולא את
// healthScore, רק מוריד אותו מרשימת-המשימות ומעביר אותו לארכיון "בקשות שטופלו".
//
// נשמרת רשימת השדות שהיו חסרים ברגע הסימון: אם *נוסף* חסר חדש אחר כך (למשל התמונה המייצגת
// נמחקה) — הסימון כבר לא מכסה אותו והעסק חוזר לרשימה מעצמו. אותו עיקרון בדיוק כמו "טופל מבחוץ":
// סוגר את מה שהיה פתוח באותו רגע, לא משתיק את העסק לתמיד.
function cardGapsAcceptedFor(b) {
  const acc = b && b.cardGapsAccepted;
  if (!acc || !Array.isArray(acc.fields)) return null;
  return missingFieldsFor(b).every(f => acc.fields.includes(f)) ? acc : null;
}

window.acceptCardGaps = async function(id) {
  const b = findBiz(id);
  if (!b) return;
  const missing = missingFieldsFor(b);
  if (!missing.length) { alert('הכרטיס של העסק הזה כבר מלא — אין מה לסמן.'); return; }
  try {
    await updateDoc(doc(db, 'businesses', id), { cardGapsAccepted: { at: new Date().toISOString(), fields: missing } });
    await logActivity('businesses', id, {
      type: 'changeDecision', title: 'כרטיס חסר סומן "טופל"',
      detail: `אושר להישאר כך: ${missing.join(', ')}`,
      field: 'cardGapsAccepted', before: null, after: missing.join(', '),
    });
  } catch (e) { console.error(e); alert('שגיאה בסימון: ' + e.message); }
};

window.reopenCardGaps = async function(id) {
  const b = findBiz(id);
  if (!b) return;
  try {
    await updateDoc(doc(db, 'businesses', id), { cardGapsAccepted: null });
    await logActivity('businesses', id, {
      type: 'changeDecision', title: 'כרטיס חסר הוחזר לטיפול',
      detail: `חסר כרגע: ${missingFieldsFor(b).join(', ') || '—'}`,
      field: 'cardGapsAccepted', before: 'סומן כטופל', after: null,
    });
  } catch (e) { console.error(e); alert('שגיאה בהחזרה לטיפול: ' + e.message); }
};

const BIZ_REVIEW_SECTION_LABELS = { 2: 'שלב 2', 3: 'שלב 3', 4: 'שלב 4', 5: 'שלב 5' };
const BIZ_REVIEW_SECTIONS = [2, 3, 4, 5];

// מחליף את "חסר להשלמת הפרופיל" (מד בריאות-פרופיל) בראש הכרטיס — עכשיו שיש מד סקירה ייעודי,
// זה מיותר שם (שני מדדים שונים לגמרי מוצגים זה ליד זה). מציג במקום זאת אילו שלבים עדיין לא נסקרו,
// כדי שהמנהל ידע מיד בכניסה לעריכה מה נשאר לו לעשות.
function bizReviewGapHtml(b) {
  const missing = BIZ_REVIEW_SECTIONS.filter(n => !(b.reviewedSections && b.reviewedSections[n]));
  if (!missing.length) return `<span class="review-badge ready">✓ כל השלבים נסקרו</span>`;
  return `<span class="review-badge none">עדיין לא נסקר: ${missing.map(n => BIZ_REVIEW_SECTION_LABELS[n]).join(', ')}</span>`;

// ISO string (כפי שנשמר ב-Firestore) → Date (כפי שכל שאר קוד העיגונים בקובץ הזה כבר מצפה לו)
function anchorFromRaw(raw) {
  if (!raw) return null;
  return {
    ...raw,
    setAt: raw.setAt ? new Date(raw.setAt) : null,
    until: raw.until ? new Date(raw.until) : null,
    next: raw.next ? { ...raw.next, handoverAt: raw.next.handoverAt ? new Date(raw.next.handoverAt) : null } : null,
  };
}
// Date → ISO string, לכתיבה חזרה ל-Firestore
function anchorToRaw(a) {
  if (!a) return null;
  return {
    ...a,
    setAt: a.setAt ? a.setAt.toISOString() : null,
    until: a.until ? a.until.toISOString() : null,
    next: a.next ? { ...a.next, handoverAt: a.next.handoverAt ? a.next.handoverAt.toISOString() : null } : null,
  };
}
function anchorsDocToState(raw) {
  const s = {};
  ALL_TABS.forEach(t => {
    const arr = (raw && raw[t.key]) || [];
    s[t.key] = Array.from({ length: SLOT_COUNT }, (_, i) => anchorFromRaw(arr[i] || null));
  });
  return s;
}

const hbApiFetch = (path, opts, st) => {
  const state = st || {};

      if (err && err.name === 'AbortError') throw err;
      if (i + 1 >= HB_API_HOSTS.length) throw err;
      state.via = i + 1;
      return tryHost(i + 1);

// ⚠️ מחליף **קידומת בלבד**: הנתיב והפרמטרים (?url=…&w=…) נשארים מילה במילה, אחרת ה-w
// שנשמר בקאש של ה-edge היה משתנה וכל מידה הייתה מחושבת מחדש.
window.hbImageNextHost = function(img) {
  if (!img || !img.src) return false;
  const i = HB_API_HOSTS.findIndex(h => img.src.startsWith(h));
  if (i < 0 || i + 1 >= HB_API_HOSTS.length) return false;
  img.src = HB_API_HOSTS[i + 1] + img.src.slice(HB_API_HOSTS[i].length);
  return true;
};

// 🐛 באג-אמת שנמצא (2026-08-08, המשתמש דיווח "יש עוד מקום"): הקבועים כאן לא תאמו את .biz-discount-text
// האמיתי ב-home.html בשלושה דברים בו-זמנית — (1) רוחב 151px היה שרירותי, לא נמדד מול .biz-card בפועל
// (מינימום אמיתי — כרטיסי גלילה-אופקית במובייל, min-width:260px — הרחב מ-260px, כמו הרשת/allBizGrid,
// לא הצומת המצומצם). (2) גופן 11px Heebo בזמן שה-CSS האמיתי הוא 14px. (3) family Heebo בזמן שגוף-הדף
// כולו ב-home.html הוא Rubik (body{font-family:'Rubik'}) — שני פונטים שונים עם מטריקות-רוחב שונות
// לגמרי. שלוש הטעויות ביחד גרמו לחיתוך-טקסט הרבה יותר אגרסיבי ממה שבאמת נדרש כדי להישאר בשורה אחת.
// 260 (min-width הכי-צר של .biz-card) − 32 (2×16px padding של .biz-card-body) = 228px רוחב-זמין אמיתי.
const CARD_TITLE_RAW_WIDTH = 228;
const CARD_TITLE_SAFETY_MARGIN = 10;
const CARD_TITLE_MAX_WIDTH = CARD_TITLE_RAW_WIDTH - CARD_TITLE_SAFETY_MARGIN;
const CARD_TITLE_FONT = '700 14px Rubik';
let _measureCanvas = null;
function measureTextWidth(text, font) {
  if (!_measureCanvas) _measureCanvas = document.createElement('canvas');
  const ctx = _measureCanvas.getContext('2d');
  ctx.font = font;
  return ctx.measureText(text).width;
}
function ensureFitsCard(text) {
  let t = (text || '').trim();
  if (measureTextWidth(t, CARD_TITLE_FONT) <= CARD_TITLE_MAX_WIDTH) return t;
  while (t.includes(' ') && measureTextWidth(t, CARD_TITLE_FONT) > CARD_TITLE_MAX_WIDTH) {
    t = t.slice(0, t.lastIndexOf(' ')).trim();
  }
  while (t.length > 1 && measureTextWidth(t, CARD_TITLE_FONT) > CARD_TITLE_MAX_WIDTH) {
    t = t.slice(0, -1);
  }
  return t.trim();
}

function bizById(id) { return MOCK_BUSINESSES.find(b => b.id === id); }

// מאגר העסקים הרלוונטי לטאב: קטגוריה = רק עסקים ששייכים אליה בפועל. סקשן = הכל, אלא אם יש ELIGIBLE_FILTER.
function poolFor(tab) {
  if (tab.type === 'category') return MOCK_BUSINESSES.filter(b => b.catKey === tab.catKey);
  const ef = ELIGIBLE_FILTER[tab.key];
  return ef ? MOCK_BUSINESSES.filter(ef.test) : MOCK_BUSINESSES;
}
function scopeNoteFor(tab) {
  if (tab.type === 'category') return `מציג רק עסקים ששייכים בפועל לקטגוריית "${CATEGORIES.find(c=>c.key===tab.catKey).label}"`;
  const ef = ELIGIBLE_FILTER[tab.key];
  return ef ? ef.note : 'מציג את כל העסקים המאושרים באינדקס';
}

// סדר "אוטומטי" יציב לכל טאב, לצורך התצוגה המקדימה בלבד (מדמה את הסבב היומי ההוגן האמיתי)
function autoOrderFor(tab) {
  // mostLoved (שלב 4ג, §2 במפרט) — לא סבב-הוגן אקראי כמו שאר הסקשנים: סדר אמיתי לפי מספר לבבות,
  // likesOverride (עריכה ממרכז-הלבבות) גובר על likedBy.length האמיתי אם קיים.
  if (tab.key === 'mostLoved') {
    return [...poolFor(tab)].sort((a, b) => (b.likesOverride ?? b.likes ?? 0) - (a.likesOverride ?? a.likes ?? 0));
  }
  const seed = [...tab.key].reduce((a,c) => a + c.charCodeAt(0), 0);
  return [...poolFor(tab)].sort((a, b) => {
    const ha = (a.id.charCodeAt(1) * 31 + seed) % 97;
    const hb = (b.id.charCodeAt(1) * 31 + seed) % 97;
    return ha - hb;
  });
}

function fmtDateTime(d) {
  if (!d) return '';
  return d.toLocaleDateString('he-IL') + ' ' + d.toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit'});
}
function fmtDate(d) { return d.toLocaleDateString('he-IL'); }
// תאריך קומפקטי לבאדג' ברשימה (§235) — "21.8", ועם שנה ("21.8.25") רק כשהיא לא השנה
// הנוכחית, כדי שפריט ישן לא ייראה כאילו נכתב לפני שבוע. לא מחליף את fmtDate/fmtDateTime.
function fmtDayMonth(d) {
  if (!d) return '';
  const base = d.getDate() + '.' + (d.getMonth() + 1);
  return d.getFullYear() === new Date().getFullYear() ? base : base + '.' + String(d.getFullYear()).slice(-2);
}
// "כמה זמן עבר" — לשורות ממתינים/רשומים, כדי לראות מיד כמה זמן מישהו כבר מחכה, לא רק את התאריך היבש
// "לפני 150 ימים" לא ברור בקריאה מהירה (כמה זה בערך?) — פירוק לשבועות/חודשים/שנים לפער גדול,
// ימים בודדים נשארים מדויקים כי שם זה כן ברור.
function agoLabel(d) {
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days <= 0) return 'היום';
  if (days === 1) return 'אתמול';
  if (days < 14) return `לפני ${days} ימים`;
  if (days < 60) return `לפני ${Math.round(days / 7)} שבועות`;
  if (days < 365) return `לפני ${Math.round(days / 30)} חודשים`;
  const years = Math.round(days / 365);
  return `לפני ${years === 1 ? 'שנה' : years + ' שנים'}`;
}
// §355 — חתימת-זמן לשורות-תקלה. `agoLabel` נבנה לתורים שמודדים בימים ("ממתין 3 שבועות"),
// ובתקלות-כניסה הוא מחזיר "היום" לכל מה שקרה בשמונה השעות האחרונות — כלומר בדיוק בשורות
// שבהן רוצים לדעת **מתי**, כדי להצליב מול שיחה עם האוהד או מול פריסה שיצאה בשעה מסוימת.
// ⚠️ ההשוואה היא לפי יום-לוח ולא לפי הפרש-שעות: אתמול ב-23:50 הוא "אתמול" גם כשעברו 20 דקות.
function agoTimeLabel(d) {
  if (!d) return '—';
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const now = new Date();
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  const yest = new Date(now); yest.setDate(yest.getDate() - 1);
  if (sameDay(d, now))  return 'היום ' + hm;
  if (sameDay(d, yest)) return 'אתמול ' + hm;
  const date = d.getDate() + '.' + (d.getMonth() + 1) + (d.getFullYear() !== now.getFullYear() ? '.' + d.getFullYear() : '');
  return date + ' ' + hm;
}
function daysLeft(date) { return Math.ceil((date - new Date()) / DAY_MS); }
function isExpired(anchor) { return anchor.mode === 'temp' && anchor.until && new Date() > anchor.until; }
// התאריך שבו קורה משהו למיקום הזה: לעיגון זמני זה מועד הפקיעה. לעיגון קבוע זה תאריך ההחלפה
// המתוזמן (אם הוגדר) — קבוע בלי מחליף לא "מסתיים" אף פעם, ולכן לא מוצג בפאנל.
function effectiveDate(anchor) {
  return anchor.mode === 'temp' ? anchor.until : (anchor.next ? anchor.next.handoverAt : null);
}

        <button class="exp-action-btn" onclick="editExisting(${i})">📌 קבע מי יחליף</button>
      </div>`;
  };
  const rowCovered = ({a, i, ed}) => {
    const biz = bizById(a.bizId);
    const nx  = bizById(a.next.bizId);
    return `
      <div class="expiring-item">
        <div class="exp-pos">${i+1}</div>
        <div class="exp-body">${biz.name} <span class="succ">← <span class="cv">${nx.name}</span></span></div>
        ${expDaysBadge(daysLeft(ed))}
        <button class="exp-action-btn" onclick="editExisting(${i})">ערוך</button>
      </div>`;
  };

  const attentionBlock = needsAttention.length ? `
    <div class="expiring-subgroup">
      <div class="exp-sub-title warn">⚠️ ללא מחליף — יחזרו לסבב אוטומטי (${needsAttention.length})</div>
      <div class="exp-sub-list">${needsAttention.map(rowNeedsAttention).join('')}</div>
    </div>` : '';
  const coveredBlock = covered.length ? `
    <div class="expiring-subgroup">
      <div class="exp-sub-title ok-title">✓ כבר מוגדר מי יחליף (${covered.length})</div>
      <div class="exp-sub-list">${covered.map(rowCovered).join('')}</div>
    </div>` : '';

  return `
    <div class="expiring-panel">
      <div class="expiring-title">⏳ מה מסתיים / מתחלף בקרוב</div>
      ${attentionBlock}
      ${coveredBlock}
    </div>`;
}

// מיון-תצוגה לרשימת המיקומים (2026-08-05, בקשת המשתמש) — לא משנה את המספור (slot-num תמיד המיקום
// האמיתי), רק את סדר-ההופעה. 'position' = ברירת-מחדל, זהה למה שהיה תמיד.
let sectionSlotSort = 'position'; // 'position' | 'expiring' | 'noSuccessor'
window.setSectionSlotSort = function(v) { sectionSlotSort = v; renderMain(); };

function orderedSlotIndices(tab) {
  const slots = state[activeTab];
  const idx = slots.map((_, i) => i);
  if (sectionSlotSort === 'expiring') {
    idx.sort((a, b) => {
      const A = slots[a], B = slots[b];
      const aActive = A && !isExpired(A), bActive = B && !isExpired(B);
      if (aActive && bActive) return effectiveDate(A) - effectiveDate(B);
      if (aActive !== bActive) return aActive ? -1 : 1;
      return a - b;
    });
  } else if (sectionSlotSort === 'noSuccessor') {
    idx.sort((a, b) => {
      const A = slots[a], B = slots[b];
      const aActive = A && !isExpired(A), bActive = B && !isExpired(B);
      const aNoNext = aActive && !A.next, bNoNext = bActive && !B.next;
      if (aNoNext !== bNoNext) return aNoNext ? -1 : 1;
      return a - b;
    });
  }
  return idx;
}

function renderOneSlot(i, tab, poolSize, autoPoolSize) {
  const slots = state[activeTab];
  const anchor = slots[i];
  const active = anchor && !isExpired(anchor);
  if (pickingSlot === i) return renderPickerSlot(i, tab);

  if (active) {
    const biz = bizById(anchor.bizId);
    const modeLine = anchor.mode === 'fixed'
      ? `<span class="fixed-tag">📌 קבוע</span>`
      : `<span class="temp-tag">⏳ עד ${fmtDate(anchor.until)}</span>`;
    let chainLine = '';
    if (anchor.next) {
      const when = anchor.mode === 'temp' ? 'לאחר שהעיגון יפוג' : 'ב-' + fmtDate(anchor.next.handoverAt);
      chainLine = `<div class="chain-line">→ ${when}: <span class="cv">${bizById(anchor.next.bizId).name}</span> (${anchor.next.mode==='fixed' ? 'קבוע' : 'למשך ' + anchor.next.days + ' ימים'})</div>`;
    } else if (anchor.mode === 'temp') {
      chainLine = `<div class="chain-line" style="color:var(--text-muted)">→ לאחר מכן: חוזר לסבב אוטומטי</div>`;
    }
    const scheduleBtn = anchor.mode === 'fixed'
      ? `<button class="slot-btn" onclick="editExisting(${i})">${anchor.next ? 'ערוך תזמון' : '🗓 תזמן החלפה'}</button>`
      : '';
    return `
      <div class="slot anchored">
        <div class="slot-num">${i+1}</div>
        <div class="slot-body">
          <div class="slot-biz-name">${biz.name}</div>
          <div class="slot-meta">
            ${modeLine}
            <span>נקבע ב-${fmtDateTime(anchor.setAt)}</span>
          </div>
          ${chainLine}
        </div>
        <div class="slot-actions">
          <button class="slot-btn" onclick="openPicker(${i})">החלף</button>
          ${scheduleBtn}
          <button class="slot-btn danger" onclick="removeAnchor(${i})">הסר</button>
        </div>
      </div>`;
  }

  const disabled = poolSize === 0;
  return `
    <div class="slot">
      <div class="slot-num">${i+1}</div>
      <div class="slot-body"><div class="slot-empty-txt">— אוטומטי, מתחלף יומית מתוך ${autoPoolSize} עסקים —</div></div>
      <div class="slot-actions">
        <button class="slot-btn primary" ${disabled ? 'disabled' : ''} onclick="openPicker(${i})">📌 עגן עסק כאן</button>
      </div>
    </div>`;
}

function slotsHtml(tab) {
  const slots = state[activeTab];
  const poolSize = poolFor(tab).length;
  // גודל הסבב האמיתי (§9 במפרט + עדכון-המשך מהמעצב) — מאושרים פחות מעוגנים-בפועל בסקשן הזה, לא
  // סך-כל-המאושרים (עסק מעוגן לא חוזר גם על-פני הסבב האוטומטי).
  const anchoredCount = slots.filter(a => a && !isExpired(a)).length;
  const autoPoolSize = Math.max(0, poolSize - anchoredCount);

  return orderedSlotIndices(tab).map(i => renderOneSlot(i, tab, poolSize, autoPoolSize)).join('');
}

// עיגון-מהיר בתחתית הרשימה (2026-08-05, בקשת המשתמש: "מתחת למקום 10... איזה מקום פנוי ואפשר
// לשייך אליו עסק") — לא לוגיקה חדשה, רק קיצור-דרך ל-openPicker(i) הקיימת על מיקום שנבחר מרשימה.
function emptySlotQuickAssignHtml(tab) {

}

// בלוק "מי יחליף" — זמין גם לעיגון זמני (מחליף נכנס כשהתוקף פג) וגם לעיגון קבוע
// (מחליף נכנס בתאריך שבוחרים ידנית, כי לקבוע אין תאריך פקיעה טבעי).
function renderChainBlock(tab, i) {
  const excludeIds = new Set(
    state[activeTab].map((a,idx) => (a && !isExpired(a) && idx !== i) ? a.bizId : null).filter(Boolean)
  );
  excludeIds.add(choosingBiz);
  const successorOptions = poolFor(tab).filter(b => !excludeIds.has(b.id));
  const isTemp = editMode.type === 'temp';

  const offLabel = isTemp ? '🔄 חוזר לסבב אוטומטי' : '♾ יישאר קבוע (בלי תזמון)';
  const onLabel  = isTemp ? '📌 עסק אחר יחליף' : '📌 תזמן מי יחליף ומתי';
  const blockTitle = isTemp ? 'מה קורה כשפג התוקף?' : 'לתזמן כבר עכשיו מי יחליף בעתיד?';

  return `
    <div class="chain-block">
      <div class="chain-label">${blockTitle}</div>
      <div class="mode-toggle">
        <div class="mode-opt ${editMode.chainMode==='auto'?'selected':''}" onclick="setChainMode('auto')">${offLabel}</div>
        <div class="mode-opt ${editMode.chainMode==='chain'?'selected':''}" onclick="setChainMode('chain')">${onLabel}</div>
      </div>
      ${editMode.chainMode === 'chain' ? `
        <select class="chain-select" onchange="editMode.nextBizId=this.value||null; renderAll()">
          <option value="">בחר עסק שיחליף...</option>
          ${successorOptions.map(b => `<option value="${b.id}" ${editMode.nextBizId===b.id?'selected':''}>${b.name}</option>`).join('')}
        </select>
        ${editMode.nextBizId ? `
          ${!isTemp ? `
            <div class="days-row" style="margin-bottom:8px">
              <input type="number" min="1" value="${editMode.handoverDays}" oninput="editMode.handoverDays=parseInt(this.value)||1; renderAll()">
              <span>ימים מהיום — ההחלפה תקרה ב-${fmtDate(new Date(Date.now()+ (editMode.handoverDays||30)*DAY_MS))}</span>
            </div>` : ''
          }
          <div class="chain-sub-toggle">
            <div class="mode-opt ${editMode.nextType==='fixed'?'selected':''}" onclick="setNextType('fixed')">📌 קבוע</div>
            <div class="mode-opt ${editMode.nextType==='temp'?'selected':''}" onclick="setNextType('temp')">⏳ הוא עצמו לזמן מוגבל</div>
          </div>
          ${editMode.nextType === 'temp' ? `
            <div class="days-row" style="margin-top:8px">
              <input type="number" min="1" value="${editMode.nextDays}" oninput="editMode.nextDays=parseInt(this.value)||1">
              <span>ימים מרגע שהוא נכנס</span>
            </div>` : ''
          }` : ''
        }
      ` : ''}
    </div>`;
}

function renderModeForm(i, tab) {
  const biz = bizById(choosingBiz);

  return `
    <div class="slot anchored">
      <div class="slot-num">${i+1}</div>
      <div class="slot-body" style="width:100%">
        <div class="mode-form">
          <div class="chosen">${biz.name} <span style="color:var(--text-muted);font-weight:400;font-size:11px">— בחר קבוע או זמני</span></div>
          <div class="mode-toggle">
            <div class="mode-opt ${editMode.type==='fixed'?'selected':''}" onclick="setEditMode('fixed')">📌 קבוע</div>

            <div class="days-row">
              <input type="number" min="1" value="${editMode.days}" oninput="editMode.days=parseInt(this.value)||1; renderAll()">
              <span>ימים מהיום — יפוג ב-${fmtDate(new Date(Date.now()+ (editMode.days||1)*DAY_MS))}</span>
            </div>` : ''
          }
          ${renderChainBlock(tab, i)}
          <div class="mode-actions">
            <button class="slot-btn primary" onclick="saveAnchor(${i})">שמור עיגון</button>
            <button class="slot-btn" onclick="cancelPicker()">ביטול</button>

}

window.openPicker = function(i) {
  pickingSlot = i;
  choosingBiz = null;
  editMode = { type: 'fixed', days: 30, chainMode: 'auto', nextBizId: null, nextType: 'fixed', nextDays: 30, handoverDays: 30 };
  renderAll();
  setTimeout(() => filterPicker(''), 0);
};

// עריכה מהירה של עיגון קיים (למשל מתוך פאנל "מסתיים בקרוב") — נכנס ישר לטופס המצב, בלי לחפש מחדש
window.editExisting = function(i) {
  pickingSlot = i;
  const a = state[activeTab][i];
  choosingBiz = a.bizId;
  const now = Date.now();
  editMode = {
    type: a.mode, days: a.days || 30,
    chainMode: a.next ? 'chain' : 'auto',
    nextBizId: a.next ? a.next.bizId : null,
    nextType: a.next ? a.next.mode : 'fixed',
    nextDays: (a.next && a.next.days) || 30,
    handoverDays: (a.mode === 'fixed' && a.next) ? Math.max(1, Math.round((a.next.handoverAt - now) / DAY_MS)) : 30,
  };
  renderAll();
};

window.cancelPicker = function() {
  pickingSlot = null;
  choosingBiz = null;
  renderAll();
};

window.filterPicker = function(q) {
  const tab = tabMeta(activeTab);
  const anchoredIdsElsewhere = new Set(
    state[activeTab].map((a,idx) => (a && !isExpired(a) && idx !== pickingSlot) ? a.bizId : null).filter(Boolean)
  );
  const list = poolFor(tab).filter(b =>
    !anchoredIdsElsewhere.has(b.id) &&
    (!q || b.name.includes(q))
  );
  const listEl = document.getElementById('pickerList');
  if (!listEl) return;
  listEl.innerHTML = list.length ? list.map(b => `
    <div class="picker-item" onclick="chooseBiz('${b.id}')">
      <span class="nm">${b.name}</span>
    </div>`).join('') : `<div class="picker-empty">לא נמצאו עסקים מתאימים</div>`;
};

window.chooseBiz = function(id) {
  choosingBiz = id;
  renderAll();
};

window.setEditMode = function(type) {
  editMode.type = type;
  renderAll();
};
window.setChainMode = function(mode) {
  editMode.chainMode = mode;
  renderAll();
};
window.setNextType = function(type) {
  editMode.nextType = type;
  renderAll();
};

// כתיבה ל-Firestore דורשת את המערך השלם של 10 האיברים לאותו מפתח-טאב (אין עדכון-איבר-מערך חלקי
// נוח ב-Firestore) — bumpSlot בונה state[activeTab] מעודכן ואז כותב את כולו במכה אחת.
async function bumpSlot(i, value) {
  const prev = state[activeTab][i];
  state[activeTab][i] = value; // עדכון אופטימי מקומי, לפני שהכתיבה חוזרת
  renderAll();
  try {
    const rawArr = state[activeTab].map(anchorToRaw);
    // setDoc({merge:true}) ולא updateDoc — המסמך עשוי לא להתקיים עדיין בפעם הראשונה שמעגנים משהו בכלל
    await setDoc(doc(db, 'settings', 'sectionAnchors'), { [activeTab]: rawArr }, { merge: true });
  } catch (e) {
    console.error(e);
    alert('שגיאה בשמירת העיגון: ' + e.message);
    state[activeTab][i] = prev; // rollback מקומי אם הכתיבה נכשלה
    renderAll();
  }
}

window.saveAnchor = async function(i) {
  const now = new Date();
  const until = editMode.type === 'temp' ? new Date(now.getTime() + (editMode.days||1) * DAY_MS) : null;

  let next = null;
  if (editMode.chainMode === 'chain' && editMode.nextBizId) {
    const handoverAt = editMode.type === 'temp' ? until : new Date(now.getTime() + (editMode.handoverDays||30) * DAY_MS);
    next = {
      bizId: editMode.nextBizId,
      mode: editMode.nextType,
      days: editMode.nextType === 'temp' ? (editMode.nextDays || 1) : null,
      handoverAt,
    };
  }

  const value = {
    bizId: choosingBiz,
    mode: editMode.type,
    days: editMode.type === 'temp' ? (editMode.days || 1) : null,
    setAt: now,
    until,
    next,
  };
  pickingSlot = null;
  choosingBiz = null;
  await bumpSlot(i, value);
};

window.removeAnchor = async function(i) {
  await bumpSlot(i, null);
};

// גרסה עצמאית-מטאב, לבלוק "המיקום באינדקס" בכרטיס העסק (שלב 4ב, §16 במפרט) — bumpSlot/removeAnchor
// הרגילות מניחות activeTab (הטאב שפתוח כרגע במסך העיגונים), אבל כאן המנהל לוחץ מתוך כרטיס-עסק שיכול
// להיות מעוגן במיקום בטאב אחר לגמרי מזה שפתוח.
async function removeAnchorForTab(tabKey, i) {
  const prev = state[tabKey][i];
  if (!prev) return;
  state[tabKey][i] = null;
  renderMain();
  try {
    const rawArr = state[tabKey].map(anchorToRaw);
    await setDoc(doc(db, 'settings', 'sectionAnchors'), { [tabKey]: rawArr }, { merge: true });
    const tab = tabMeta(tabKey);
    await logActivity('businesses', prev.bizId, {
      type: 'anchor', title: 'הוסרה מיקום מעוגן',
      detail: `הוסר עיגון מ"${tab ? tab.label : tabKey}", מיקום ${i + 1}`,
      field: 'anchor', before: tabKey, after: null,
    });
  } catch (e) {
    console.error(e);
    alert('שגיאה בהסרת העיגון: ' + e.message);
    state[tabKey][i] = prev;
    renderMain();
  }
}
window.removeAnchorForBizCard = function(tabKey, i) { removeAnchorForTab(tabKey, i); };
window.jumpToAnchorSlot = function(tabKey) { selectTab(tabKey); };

// מתג קבוע/זמני inline בכל שורת-עיגון (תואם-handoff, 2026-08-04) — קודם הוצג רק badge סטטי.
// מעבר לזמני-בלי-until-קיים מקבל 14 יום ברירת-מחדל (אין input-ימים בשורה הקומפקטית הזו, בשונה
// מהטופס המלא במסך "סקשנים ועיגונים" — שם יש בחירת-ימים מפורשת, לא כפלנו את זה כאן).
async function setAnchorModeForBizCard(tabKey, i, mode) {
  const prev = state[tabKey][i];
  if (!prev || prev.mode === mode) return;
  const next = { ...prev, mode, until: mode === 'temp' ? (prev.until || new Date(Date.now() + 14 * 86400000)) : null };
  state[tabKey][i] = next;
  renderMain();
  try {
    const rawArr = state[tabKey].map(anchorToRaw);
    await setDoc(doc(db, 'settings', 'sectionAnchors'), { [tabKey]: rawArr }, { merge: true });
    await logActivity('businesses', next.bizId, {
      type: 'anchor', title: mode === 'fixed' ? 'העיגון הוגדר כקבוע' : 'העיגון הוגדר כזמני',
      detail: tabMeta(tabKey).label,
    });
  } catch (e) { console.error(e); alert('שגיאה בעדכון העיגון: ' + e.message); }
}
window.setAnchorModeForBizCard = setAnchorModeForBizCard;

// בלוק "המיקום באינדקס" — כל מקום שהעסק הזה מעוגן בו (סקשן/קטגוריה), עם מתג קבוע/זמני, הסרה,
// ו"לשורה בסקשן" (מנווט למסך העיגונים של אותו טאב — לא גלילה מדויקת לשורה, אבל מגיע למקום הנכון).
// שורה עומדת-קבועה ("בסבב האוטומטי" + כפתור עיגון) לסקשן שרלוונטי לעסק תמיד — גם בלי עיגון בפועל.
// תואם-handoff (2026-08-04): המשתמש ביקש שגם "⭐ נבחרים" וגם קטגוריית-העסק יופיעו תמיד, לא רק
// "הטבות שוות" (שכבר תוקן קודם). לא מאחד עם דגלי isFeatured/isNew (סימונים, ר' שיחה) — זה נשאר
// אך ורק על מנגנון-העיגון (state[tab][slot]), בדיוק כמו שהיה.
function anchorStandingRowHtml(tabKey, label, ctaLabel) {
  return `
    <div class="anchor-row">
      <div class="anchor-row-label"><div class="anchor-row-section">${label}</div><div class="anchor-row-pos" style="font-weight:500;color:var(--text-sm);font-size:13.5px">בסבב האוטומטי</div></div>
      <div class="anchor-row-detail">מוצג לפי הסבב היומי ההוגן, לא מעוגן למיקום קבוע</div>
      <div class="anchor-actions">
        <button class="btn-anchor-row" onclick="jumpToAnchorSlot('${tabKey}')">${ctaLabel}</button>
      </div>
    </div>`;
}
function bizAnchorLocationsHtml(b) {
  const rows = [];
  ALL_TABS.forEach(t => {
    (state[t.key] || []).forEach((a, i) => {
      if (a && !isExpired(a) && a.bizId === b.id) rows.push({ tab: t, i, a });
    });
  });
  const rowsHtml = rows.map(({ tab, i, a }) => `
    <div class="anchor-row">
      <div class="anchor-row-label"><div class="anchor-row-section">${tab.label}</div><div class="anchor-row-pos">מיקום ${i+1}</div></div>
      <div class="anchor-row-detail"><span class="${a.mode==='fixed'?'class-badge':'treat-badge'}">${a.mode==='fixed' ? '📌 קבוע' : '⏳ עד ' + fmtDate(a.until)}</span></div>
      <div class="anchor-mode-toggle">
        <button class="anchor-mode-btn ${a.mode==='fixed'?'active':''}" onclick="setAnchorModeForBizCard('${tab.key}',${i},'fixed')">קבוע</button>
        <button class="anchor-mode-btn ${a.mode==='temp'?'active':''}" onclick="setAnchorModeForBizCard('${tab.key}',${i},'temp')">זמני</button>
      </div>
      <div class="anchor-actions">
        <button class="btn-anchor-row" onclick="jumpToAnchorSlot('${tab.key}')">לשורה בסקשן</button>
        <button class="btn-anchor-remove" onclick="removeAnchorForBizCard('${tab.key}',${i})">הסרת העיגון</button>
      </div>
    </div>`).join('');
  const hasRowFor = (key) => rows.some(r => r.tab.key === key);
  const catTab = b.catKey ? tabMeta('cat_' + b.catKey) : null;
  const standingRows = [
    !hasRowFor('featured') ? anchorStandingRowHtml('featured', '⭐ נבחרים', 'עיגון למיקום') : '',
    (catTab && !hasRowFor(catTab.key)) ? anchorStandingRowHtml(catTab.key, catTab.label, 'עיגון למיקום') : '',
    (b.hasDiscount && !hasRowFor('deals')) ? anchorStandingRowHtml('deals', '💛 הטבות שוות', 'עיגון למיקום') : '',
  ].join('');
  if (!rows.length && !standingRows) {
    return `<div class="anchor-row"><div class="anchor-row-detail" style="color:var(--text-muted)">לא מעוגן באף מיקום קבוע — מוצג רק לפי הסבב האוטומטי בסקשנים הרלוונטיים.</div></div>`;
  }
  return rowsHtml + standingRows;
}

// ספירות הפילים תמיד נגזרות מכל העסקים (לא מוגבלות לפילטרים-המתקדמים/סטטוס-ישן), כדי שהמספר ליד
// כל פיל ישקף את הכלל האמיתי, בדיוק כמו ב-handoff ("הכל · 7 / ממתינים לאישור · 3 / בקשות · 3").
// עסק ששעות הפעילות שלו נשמרו כטקסט חופשי ("אחר") ועדיין לא טופל — כלומר ממתין לניסוח
// שלך או לאישור של בעל-העסק. אחרי טיפול (משני הצדדים) הוא יוצא מהרשימה מעצמו, ולכן
// הגלולה מתכווצת עד שהיא נעלמת. §230.
// מחזיר את **רשימת הסיבות** שבגללן שעות הפעילות של העסק הזה דורשות מבט שלך (ריק = תקין).
// לא רק "טקסט חופשי" — כל דבר שנראה לא-הגיוני, כי אלה בדיוק המקרים שאף אחד לא מחפש.
//
// שתי רמות, וההבדל ביניהן מכוון:
//   **שגיאה קשה** — מוצגת תמיד עד שמתקנים בפועל (כל השבוע סגור / ערך-שעה פגום).
//   **שיקול-דעת** — נעלמת ברגע שמישהו (אתה או בעל-העסק) עבר על השעות ושמר, כלומר
//     hoursMigrationDone נכתב. אחרת "עסק שחוצה חצות" היה נשאר ברשימה לנצח למרות שאישרת אותו.
//
// ⚠️ "שעת סגירה מוקדמת מהפתיחה" **אינה שגיאה** — היא בר/מועדון שפתוח אחרי חצות. נמדד על
// נתוני-אמת: "אמלה" רשום "א-ד 17:00-02:00, ה 17:00-04:30", וזו הכוונה בדיוק. לכן הניסוח
// הוא "חוצה חצות — לוודא שזו הכוונה" ולא "שגיאה", והוא נעלם אחרי אישור.
function hoursIssues(b) {
  if (!b) return [];
  const out = [];
  // ⚠️ שני דגלים **נפרדים**, ולא אחד. hoursMigrationDone נכתב בכל שמירה של שלב 2 —
  // כלומר גם כשנגעת בטלפון ולא הסתכלת על השעות בכלל. לכן הוא משתיק רק את "ממתין
  // לניסוח" (שם השמירה *היא* הניסוח), ולא חריגה בנתונים.
  // חריגה מושתקת רק ע"י אישור מפורש (hoursAnomalyOk, כפתור "תקין" בקובייה).
  // נתפס על נתוני-אמת: "אלמוג פט" נעלם מהרשימה כי נערך ידנית קודם, למרות שהוא
  // בדיוק העסק שהמשתמש ביקש לראות שם.
  const reviewed = !!b.hoursMigrationDone;
  const anomalyOk = !!b.hoursAnomalyOk;
  const days = window.HB_HOURS ? HB_HOURS.normalizeDays(b.hoursDays) : null;
  const toMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; };

  if (b.hoursMode === 'fixed') {
    if (!days) out.push('מבנה השעות פגום');                              // שגיאה קשה
    else {
      if (days.every(d => d.closed)) out.push('כל השבוע מסומן סגור');    // שגיאה קשה
      const wk = days.slice(0, 5).map(d => d.closed);
      if (!anomalyOk && wk.some(x => x) && wk.some(x => !x)) out.push('חלק מימי החול סגורים');
      if (!anomalyOk && days.some(d => !d.closed && toMin(d.close) <= toMin(d.open))) out.push('שעות שחוצות חצות');
    }
  }
  if (b.hoursMode === 'other' && !reviewed) out.push('טקסט חופשי — ממתין לניסוח');
  // עסק פיזי שלקוחות מגיעים אליו ואין לו שעות בכלל. אונליין/נותן-שירות לא נספר — החלטת
  // המשתמש ב-§229 שלהם זה פשוט לא רלוונטי.
  if (!b.hoursMode && !(b.hoursText || '').trim() && (b.bizTypes || []).includes('physical')) {
    out.push('עסק פיזי בלי שעות');
  }
  // "טרם הומר" **לא** נכלל בכוונה — לזה יש את פאנל ההמרה, וכפילות הייתה מציפה את הרשימה
  // ב-22 עסקים שכבר יש להם מקום משלהם.
  return out;
}

    // ונעלם מעצמו כשכולם תוקנו. **חייב להיות כאן ולא בשורת "עוד סינונים"** — היא לא
    // מרונדרת בכלל ב"כל העסקים" (bizFilterBarHtml נקרא שם עם advanced:false).
    brokenLinks: MOCK_BUSINESSES.filter(b => brokenLinksFor(b).length > 0).length,
    // §230 — אותו דפוס בדיוק: מוצג רק כשיש מה לנסח, ונעלם כשסיימת
    hoursOther: MOCK_BUSINESSES.filter(b => hoursIssues(b).length).length,

}
function bizFilteredList() {
  const q = bizSearch.trim();
  const list = MOCK_BUSINESSES.filter(b => {
    const matchF = bizStatusFilter === 'all' ? true
      : bizStatusFilter === 'changes' ? !!b.hasPendingChange
      : b.status === bizStatusFilter;
    const matchClass = bizClassPill === 'all' ? true
      : bizClassPill === 'pending' ? b.status === 'pending'
      : bizClassPill === 'approved' ? b.status === 'approved'
      : bizClassPill === 'rejected' ? b.status === 'rejected'
      : bizClassPill === 'brokenLinks' ? brokenLinksFor(b).length > 0
      : bizClassPill === 'hoursOther' ? hoursIssues(b).length > 0
      : classifyAction(b, 'business').treatments.length > 0;
    const matchCat = bizCategoryFilter === 'all' || b.catKey === bizCategoryFilter;
    const matchType = bizTypeFilter === 'all' || (b.bizTypes || []).includes(bizTypeFilter);
    const matchReview = bizReviewFilter === 'all' ? true
      : bizReviewFilter === 'complete' ? bizReviewedCount(b) === BIZ_REVIEW_SECTIONS.length
      : bizReviewedCount(b) < BIZ_REVIEW_SECTIONS.length;
    const matchHealth = bizHealthFilter === 'all' ? true
      : bizHealthFilter === 'brokenLinks' ? brokenLinksFor(b).length > 0
      : bizHealthFilter === 'complete' ? b.healthScore === 100
      : b.healthScore < 100;
    const matchDate = bizDateRangeFilter === 'all' ? true
      : (Date.now() - b.registeredAt.getTime()) <= Number(bizDateRangeFilter) * 86400000;
    const catLabel = (CATEGORIES.find(c => c.key === b.catKey) || {}).label || '';
    const matchQ = !q || b.name.includes(q) || (b.city || '').includes(q) || catLabel.includes(q);
    return matchF && matchClass && matchCat && matchType && matchReview && matchHealth && matchDate && matchQ;
  });
  return list.sort((a, b) => {
    // "הממתין הכי הרבה זמן" — עסקים-עם-משימה-פתוחה קודם (הוותיק שבהם ראשון), אחריהם השאר לפי הכי-ותיק
    if (bizSort === 'waitingLongest') {
      const aOpen = classifyAction(a, 'business').primary !== 'מאושר · אין פעולה';
      const bOpen = classifyAction(b, 'business').primary !== 'מאושר · אין פעולה';
      if (aOpen !== bOpen) return aOpen ? -1 : 1;
      return a.registeredAt - b.registeredAt;
    }
    if (bizSort === 'oldest') return a.registeredAt - b.registeredAt;
    if (bizSort === 'clicks') return b.clicks - a.clicks;
    if (bizSort === 'likes') return b.likes - a.likes;
    if (bizSort === 'reviewedAsc') return bizReviewedCount(a) - bizReviewedCount(b);
    if (bizSort === 'reviewedDesc') return bizReviewedCount(b) - bizReviewedCount(a);
    return b.registeredAt - a.registeredAt;
  });
}

// ── §366 — כפילות הרשמה של עסק ────────────────────────────────────────────────────────
// לאוהדים יש `reviewFlag: 'possible_duplicate'` שנכתב ע"י הטופס (fan-register.html);
// לעסקים לא היה שום דבר. שבתאי לנקרי נרשם פעמיים, שתי הרשומות ישבו זו לצד זו ברשימה,
// ואיש לא ידע — המשתמש גילה את זה רק כי הוא במקרה שם לב לשם.
//
// ⚠️ מחושב **בקריאה**, לא נכתב לשום מקום: מרכז הניהול ממילא טוען את כל העסקים, והדגל
// הוא נגזרת של הנתונים ולא עובדה חדשה. שדה שנכתב היה מצריך מיגרציה לכל הרשומות הקיימות
// ונתיב-כתיבה שלישי שיישאר לא-מסונכרן — בדיוק הלקח של "עסק השבוע".
//
// ⚠️ **לא כל שני עסקים של אותו בעלים הם כפילות.** אדיר אילן רשום עם "שווארמה שמש
// אירועים" ו"גולדה אירועים" על אותו טלפון ואותו מייל, ושניהם אמיתיים. לכן מסמנים רק
// שני דפוסים שבאמת מעידים על תאונה:
//   1. **אותו בעלים + אותו שם-עסק** — זה המקרה של שבתאי, ואין לו שום פירוש תמים.
//   2. **אותו בעלים + הוגשו בתוך שעתיים זו מזו** — חתימת ה"שלחתי שוב", גם אם השם
//      הוקלד קצת אחרת בפעם השנייה.
const DUP_WINDOW_MS = 2 * 60 * 60 * 1000;
function bizDuplicateOf(b) {
  if (!b) return null;
  const norm = v => String(v == null ? '' : v).trim().replace(/[\s]+/g, ' ').toLowerCase();
  const email = norm(b.ownerEmail), phone = String(b.ownerPhone || '').replace(/[^0-9]/g, '');
  if (!email && !phone) return null;
  const at = b.registeredAt ? b.registeredAt.getTime() : null;
  return (MOCK_BUSINESSES || []).find(o => {
    if (!o || o.id === b.id) return null;
    const sameOwner = (email && norm(o.ownerEmail) === email) ||
                      (phone && String(o.ownerPhone || '').replace(/[^0-9]/g, '') === phone);
    if (!sameOwner) return false;
    if (norm(o.name) === norm(b.name)) return true;
    const oAt = o.registeredAt ? o.registeredAt.getTime() : null;
    return at && oAt && Math.abs(at - oAt) <= DUP_WINDOW_MS;
  }) || null;
}

    // כדי ששני המסכים יסכימו תמיד (לא בדיקה כפולה נפרדת כאן). status==='rejected' הוא חריג: classifyAction
    // לא מטפל בו במפורש (מחזיר "מאושר · אין פעולה" שגוי) — עוקפים מקומית, לא מתקנים classifyAction עצמה

  // לא עוד תצוגה-או-עריכה חלופיות — קודם כשהיה override פעיל, המספר האמיתי נעלם לגמרי מהתצוגה.
  const likesOverrideActive = isLikesOverrideActive(b);
  const likesDisplayed = likesOverrideActive ? b.likesOverride : b.likes;
  const likesSummary = likesOverrideActive
    ? `אמיתי ${b.likes} · מוצג ${b.likesOverride}${b.likesOverrideUntil ? ' עד ' + fmtDate(new Date(b.likesOverrideUntil)) : ' (קבוע)'}`
    : `אמיתי ${b.likes}`;
  const likesCell = `
    <div class="flag-box-row"><span class="hearts-num">${likesDisplayed}</span></div>
    <div class="flag-box-sub">${likesSummary}</div>
    <div class="hearts-edit">
       <input type="number" id="likesVal-${b.id}" min="0" placeholder="מס'" value="${likesOverrideActive ? b.likesOverride : ''}" />
       <input type="number" id="likesDays-${b.id}" min="1" placeholder="ימים" />
       <button class="btn-hearts-update" onclick="activateLikesOverride('${b.id}')">עדכון</button>
       ${likesOverrideActive ? `<button class="btn-hearts-reset" onclick="clearLikesOverride('${b.id}')">חזרה למספר האמיתי</button>` : ''}
    </div>`;
  return `<div class="flag-grid">
    <div class="flag-box neutral"><div class="flag-box-h">✨ חדש אצלנו</div>${newCell}</div>
    <div class="flag-box neutral"><div class="flag-box-h">⭐ נבחר</div>${featuredCell}</div>
    <div class="flag-box neutral"><div class="flag-box-h">💛 הטבות שוות</div>${dealsCell}</div>
    <div class="flag-box ${isLikesOverrideActive(b) ? 'warn' : 'neutral'}"><div class="flag-box-h">💙 לבבות</div>${likesCell}</div>
  </div>`;
}

async function applySectionUpdate(id, updates, msg) {
  try {
    await updateDoc(doc(db, 'businesses', id), updates);
    if (msg) alert(msg);
  } catch (e) { console.error(e); alert('שגיאה בעדכון: ' + e.message); }
}
window.activateSectionFlag = async function(id, kind, temp) {
  if (kind === 'new') {
    const days = parseInt(document.getElementById(`newDays-${id}`)?.value, 10) || 30;
    await applySectionUpdate(id, { isNew: true, newUntil: new Date(Date.now() + days * 86400000).toISOString() }, '✨ סומן כ"חדש אצלנו"');
  } else if (kind === 'featured') {
    let until = null;
    if (temp) {
      const days = parseInt(document.getElementById(`featuredDays-${id}`)?.value, 10);
      if (!days || days < 1) { alert('נא להזין מספר ימים תקין'); return; }
      until = new Date(Date.now() + days * 86400000).toISOString();
    }
    await applySectionUpdate(id, { isFeatured: true, featuredUntil: until }, '⭐ סומן כעסק נבחר');
  }
};
window.clearSectionFlag = async function(id, kind) {
  await applySectionUpdate(id, kind === 'new' ? { isNew: false, newUntil: null } : { isFeatured: false, featuredUntil: null });
};
window.toggleDealsSection = async function(id, current) {
  await applySectionUpdate(id, { sectionDeals: !current });
};
window.activateLikesOverride = async function(id) {
  const val = parseInt(document.getElementById(`likesVal-${id}`)?.value, 10);
  if (isNaN(val) || val < 0) { alert('נא להזין מספר תקין'); return; }
  const days = parseInt(document.getElementById(`likesDays-${id}`)?.value, 10);
  const until = (days && days > 0) ? new Date(Date.now() + days * 86400000).toISOString() : null;
  const b = findBiz(id);
  const before = b ? (b.likesOverride ?? b.likes) : null;
  await applySectionUpdate(id, { likesOverride: val, likesOverrideUntil: until, likesOverrideSetAt: new Date().toISOString() }, '💙 מספר הלב עודכן');
  await logActivity('businesses', id, {
    type: 'hearts', title: 'מספר לבבות מוצג נערך',
    detail: `${before} → ${val}${until ? ' עד ' + fmtDate(new Date(until)) : ' (קבוע, בלי תוקף)'}`,
    field: 'likesOverride', before, after: val,
  });
};
window.clearLikesOverride = async function(id) {
  const b = findBiz(id);
  const before = b ? b.likesOverride : null;
  await applySectionUpdate(id, { likesOverride: null, likesOverrideUntil: null, likesOverrideSetAt: null });
  await logActivity('businesses', id, {
    type: 'hearts', title: 'עריכת לבבות בוטלה — חזרה למספר האמיתי',
    field: 'likesOverride', before, after: null,
  });
};

// ══════════════════════════════════════════════════════════════════
// 💙 מרכז לבבות — מסך חדש (שלב 4ד, §2 במפרט, "8 מרכז לבבות.dc.html"). קורא ל-activateLikesOverride/
// clearLikesOverride הקיימות למעלה (אותם input-id בדיוק: likesVal-${id}/likesDays-${id}) — אין
// לוגיקת-כתיבה כפולה, רק תצוגת-טבלה חדשה על גבי אותם שדות/פונקציות.
// עודכן (2026-08-04, תואם-handoff מלא): כותרת+3 KPI (msg-content-head), חיפוש+פילי-סינון עם ספירה
// (כמו biz-class-pill), פריסת 2-עמודות + פאנל צד (דורש-החלטה/הכי-אהובים/הערת-מרכז-נתונים), עריכה
// הפכה מ-inputs-תמידיים בשורה לפאנל-toggle תחת השורה, קטגוריה+לינק-לכרטיס (jumpToBizFromTagQueue,
// אותה פונקציה כמו בניהול-תגיות) בכל שורה. "הכי אהובים" קורא ל-autoOrderFor(mostLoved) הקיים
// (אותו מיון-לפי-לבבות-מוצגים שכבר משמש את סקשן "סקשנים ועיגונים"). כפתור "עיגון מיקומים ←" מפנה
// לכרטיס העסק המוביל ברשימה — לא למסך "סקשנים ועיגונים" הגלובלי, כי הוא עדיין לא נבנה כטאב עצמאי.
// ══════════════════════════════════════════════════════════════════
let heartsSearch = '';
let heartsFilter = 'all';   // 'all' | 'active' | 'expiringWeek' | 'none' | 'zero'
let heartsSort = 'mostShown'; // 'mostShown' | 'mostReal' | 'gap' | 'expiringFirst' | 'least'
let selectedHeartsIds = new Set();
let openHeartsEditId = null; // עסק אחד בכל רגע עם פאנל-עריכה פתוח מתחת לשורה
window.setHeartsFilter = function(v) { heartsFilter = v; renderMain(); };
window.setHeartsSort = function(v) { heartsSort = v; renderMain(); };
window.toggleHeartsSelect = function(id) {
  if (selectedHeartsIds.has(id)) selectedHeartsIds.delete(id); else selectedHeartsIds.add(id);
  renderMain();
};
window.toggleHeartsEdit = function(id) {
  openHeartsEditId = openHeartsEditId === id ? null : id;
  renderMain();

window.filterHeartsRows = function(v) {
  heartsSearch = v;
  refreshHeartsList();

// אותו דפוס בדיוק כמו refreshBizList/refreshFanList — מרענן רק את שורות-הרשימה כדי לא לאבד
// פוקוס מתיבת החיפוש בכל הקשה (ר' [[feedback_module_scope_onclick]])
function refreshHeartsList() {
  if (activeTab !== HEARTS_KEY) { renderMain(); return; }
  const el = document.getElementById('heartsListRows');
  if (el) el.innerHTML = heartsFilteredSorted().map(b => heartsRowHtml(b)).join('') || `<div class="placeholder-note">אין עסקים תואמים לסינון</div>`;
}
// ספירות הפילים תמיד נגזרות מכלל העסקים המאושרים (לא מוגבלות לחיפוש/סינון פעיל), אותו עיקרון
// כמו bizClassCounts — המספר ליד כל פיל משקף את הכלל האמיתי.
function heartsClassCounts() {
  const approved = MOCK_BUSINESSES.filter(b => b.status === 'approved');
  return {
    all: approved.length,
    active: approved.filter(isLikesOverrideActive).length,
    expiringWeek: approved.filter(b => isLikesOverrideActive(b) && b.likesOverrideUntil && daysLeft(new Date(b.likesOverrideUntil)) <= 7).length,
    none: approved.filter(b => !isLikesOverrideActive(b)).length,
    zero: approved.filter(b => (b.likesOverride ?? b.likes) === 0).length,
  };
}
function heartsFilteredSorted() {
  let items = MOCK_BUSINESSES.filter(b => b.status === 'approved');
  if (heartsFilter === 'active') items = items.filter(isLikesOverrideActive);
  else if (heartsFilter === 'expiringWeek') items = items.filter(b => isLikesOverrideActive(b) && b.likesOverrideUntil && daysLeft(new Date(b.likesOverrideUntil)) <= 7);
  else if (heartsFilter === 'none') items = items.filter(b => !isLikesOverrideActive(b));
  else if (heartsFilter === 'zero') items = items.filter(b => (b.likesOverride ?? b.likes) === 0);
  const q = heartsSearch.trim();
  if (q) items = items.filter(b => b.name.includes(q));
  return items.slice().sort((a, b) => {
    const shownA = a.likesOverride ?? a.likes, shownB = b.likesOverride ?? b.likes;
    if (heartsSort === 'mostReal') return b.likes - a.likes;
    if (heartsSort === 'gap') return Math.abs(shownB - b.likes) - Math.abs(shownA - a.likes);
    if (heartsSort === 'expiringFirst') {
      const da = a.likesOverrideUntil ? new Date(a.likesOverrideUntil) : null, db = b.likesOverrideUntil ? new Date(b.likesOverrideUntil) : null;
      if (!da && !db) return 0; if (!da) return 1; if (!db) return -1;
      return da - db;
    }
    if (heartsSort === 'least') return shownA - shownB;
    return shownB - shownA; // mostShown — ברירת מחדל
  });
}
window.bulkExtendHearts = async function() {
  for (const id of [...selectedHeartsIds]) {
    const b = findBiz(id);
    if (!b || !isLikesOverrideActive(b)) continue;
    const until = new Date(Date.now() + 30 * 86400000).toISOString();
    await applySectionUpdate(id, { likesOverrideUntil: until });
    await logActivity('businesses', id, { type: 'hearts', title: 'תוקף עריכת-לבבות הוארך ב-30 יום', field: 'likesOverrideUntil', before: b.likesOverrideUntil, after: until });
  }
  selectedHeartsIds.clear();
  renderMain();
};
window.bulkRevertHearts = async function() {
  for (const id of [...selectedHeartsIds]) {
    const b = findBiz(id);
    if (!b || !isLikesOverrideActive(b)) continue;
    await window.clearLikesOverride(id);
  }
  selectedHeartsIds.clear();
  renderMain();
};

            <div id="heartsListRows">${list.map(b => heartsRowHtml(b)).join('') || `<div class="placeholder-note">אין עסקים תואמים לסינון</div>`}</div>
          </div>
          ${heartsBulkBarHtml()}
        </div>
      </div>
      <div class="hearts-col-side">
        ${heartsExpiringPanelHtml()}
