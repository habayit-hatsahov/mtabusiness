.step-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
.step-field.full { grid-column: 1 / -1; }
.step-field-h { font-size: 11.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
.step-field-h.changed { display: flex; align-items: center; gap: 7px; color: var(--accent); }
.field-changed-tag { background: var(--accent-bg); color: var(--accent); font-size: 10px; font-weight: 600; border-radius: 5px; padding: 1px 6px; }
.step-field input[type=text], .step-field input[type=url], .step-field input[type=email], .step-field input[type=date], .step-field select, .step-field textarea { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--card-bg); font-size: 13.5px; font-family: 'Heebo', sans-serif; }
.step-field textarea { height: auto; padding: 10px 12px; line-height: 1.6; resize: vertical; }
.step-field input.changed-val { border-color: rgba(var(--accent-rgb),.35); background: rgba(var(--accent-rgb),.03); font-weight: 600; }
.step-field-was { margin-top: 6px; font-size: 11.5px; color: var(--text-sm); }
/* כרטיסי-סוג-עסק — הוחלף מ-chip-צף-קטן לעיצוב זהה ל-business.html (biz-type-card, §145 v2):
   רשת-3-עמודות, אייקון+שם+תיאור, מסגרת+רקע מודגשים כשנבחר. אותם CSS-vars של admin (--accent וכו'),
   לא הצבעים המקוריים של business.html (זהב/כחול) — שפת-עיצוב-מנהל, לא שפת-עיצוב-אתר-ציבורי.
   input עצמו מוסתר, ה-label כולו לחיץ (זהה למנגנון הישן, רק העטיפה הוויזואלית השתנתה). */
.biz-type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.biz-type-card {
  display: block; border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 6px; text-align: center; cursor: pointer; user-select: none; transition: all .15s;
  background: var(--card-bg);
}
.biz-type-card:hover:not(.on) { border-color: rgba(var(--accent-rgb),.5); }
.biz-type-card.on { border-color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.15); }
.biz-type-card input { display: none; }
.biz-type-card .bt-icon { display: flex; justify-content: center; margin-bottom: 5px; color: var(--text); }
.biz-type-card .bt-name { font-size: 12px; font-weight: 700; color: var(--text); }
.biz-type-card .bt-desc { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; line-height: 1.3; }
.step-form-actions { margin-top: 18px; display: flex; gap: 9px; }
.btn-step-save { height: 38px; padding: 0 20px; border: none; border-radius: 9px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-step-save:hover { background: var(--accent-dark); }
.btn-step-cancel { height: 38px; padding: 0 16px; border: 1px solid var(--border); border-radius: 9px; background: var(--card-bg); color: var(--text-sm); font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-step-cancel:hover { background: var(--nav-bg); }

/* ── מרכז המשימות (דשבורד ראשי בלבד, 2026-08-05 §156) — טבלה ברוחב-מלא + drawer צף, לא split ── */
.task-table { background: var(--card-bg); border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09); overflow: hidden; }
.task-table-row { display: grid; grid-template-columns: minmax(200px,1.4fr) 230px 150px 110px 130px; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--border); cursor: pointer; transition: background .12s; }
.task-table-row:first-child { border-top: none; }
.task-table-row:hover { background: rgba(var(--accent-rgb),.03); }
.task-table-row.active { background: rgba(var(--accent-rgb),.07); }
.task-table-main { min-width: 0; }
.task-table-name { font-size: 13.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-table-meta { font-size: 11px; color: var(--text-sm); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-table-badges { display: flex; gap: 4px; flex-wrap: wrap; }
.task-table-review { min-width: 0; }
.task-table-review-bars { display: flex; gap: 3px; margin-bottom: 4px; }
.task-table-review-bars span { flex: 1; height: 4px; border-radius: 99px; background: var(--border-md); display: block; }
.task-table-review-bars span.on { background: var(--accent-cta); }
.task-table-review-lbl { font-size: 10.5px; color: var(--text-sm); }
.task-table-wait { font-size: 12px; font-weight: 600; color: var(--text-sm); }
.task-table-row .act-btn.primary-yellow { background: var(--accent-cta); color: var(--accent-cta-ink); border: none; font-weight: 800; }
.task-table-row .act-btn.primary-yellow:hover { background: var(--accent-cta-hover); }
.task-drawer-backdrop { position: fixed; inset: 0; background: rgba(16,24,40,.32); z-index: 59; }
.task-drawer {
  position: fixed; top: 0; bottom: 0; inset-inline-end: 0; z-index: 60; width: 52vw; min-width: 520px; max-width: 96vw;
  background: var(--bg); overflow-y: auto; border-inline-start: 1px solid var(--border); box-shadow: -10px 0 34px rgba(16,24,40,.13);
}
.task-drawer-head { position: sticky; top: 0; z-index: 2; background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
.task-drawer-close {
  width: 32px; height: 32px; flex: none; border: 1px solid var(--border); border-radius: 9px; background: var(--card-bg);
  color: var(--text-sm); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.task-drawer-close:hover { background: var(--nav-bg); color: var(--text); }
.task-drawer-body { padding: 16px 20px 40px; }
@media (max-width: 860px) {
  .class-tiles { grid-template-columns: repeat(2,1fr); }
  .task-table-row { grid-template-columns: 1fr; gap: 6px; }
  .task-table-review, .task-table-wait { display: none; }
  .task-drawer { width: 100vw; min-width: 0; }
}

/* ── active-tab info panel ── */
.tab-info {
  background: rgba(var(--accent-rgb),.05); border: 1px solid rgba(var(--accent-rgb),.2); border-radius: 12px;
  padding: 12px 14px; margin-bottom: 14px; font-size: 12px; line-height: 1.75;
}
.tab-info .ti-title { font-weight: 800; color: var(--accent); font-size: 12.5px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.tab-info .ti-type { font-size: 10px; font-weight: 700; color: var(--text-muted); background: rgba(var(--accent-rgb),.06); padding: 1px 8px; border-radius: 10px; }
.tab-info .ti-body { color: var(--text-sm); }
.tab-info .ti-body b { color: var(--text); }

/* ── expiring-soon panel — §141: הפך לכרטיס כהה-נייבי בעמודה-צדדית, אותו דפוס כמו history-card
   במרכז ההודעות (§139) — 0 שינוי-לוגיקה, רק CSS+מיקום. ── */
.expiring-panel {
  background: var(--accent); border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09);
  padding: 16px 18px 14px; margin-bottom: 0; color: #fff;
}
.expiring-title { font-size: 14.5px; font-weight: 700; color: #fff; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.expiring-empty { font-size: 11.5px; color: rgba(255,255,255,.75); }
.expiring-subgroup { margin-bottom: 14px; }
.expiring-subgroup:last-child { margin-bottom: 0; }
.exp-sub-title { font-size: 10.5px; font-weight: 800; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; color: rgba(255,255,255,.75); }
.exp-sub-title.warn { color: var(--accent-cta); }
.exp-sub-title.ok-title { color: #C9D6EE; }
.exp-sub-list { background: transparent; border-radius: 10px; overflow: hidden; }
.expiring-item { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-top: 1px solid rgba(255,255,255,.14); }
.expiring-item:first-child { border-top: none; }
.exp-pos {
  flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,.14);
  border: none; font-size: 9.5px; font-weight: 900; color: #fff;
  display: flex; align-items: center; justify-content: center;
}
.exp-body { flex: 1; min-width: 0; font-size: 12px; font-weight: 700; color: #fff; }
.exp-body .succ { font-weight: 400; color: rgba(255,255,255,.75); }
.exp-body .succ .cv { color: var(--accent-cta); font-weight: 700; }
.exp-days { font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.exp-days.urgent { color: var(--accent-cta); background: rgba(255,212,0,.16); }
.exp-days.soon { color: var(--accent-cta); background: rgba(255,212,0,.16); }
.exp-days.ok { color: rgba(255,255,255,.75); background: rgba(255,255,255,.12); }
.exp-action-btn {
  flex-shrink: 0; border: 1.5px solid rgba(255,255,255,.3); background: transparent; color: #fff;
  font-family: 'Heebo', sans-serif; font-size: 10.5px; font-weight: 700; padding: 5px 9px; border-radius: 8px; cursor: pointer;
}
.exp-action-btn:hover { border-color: var(--accent-cta); color: var(--accent-cta); }

/* ── סקשנים ועיגונים — פריסת 2-עמודות, expiring-panel כהה בעמודה-צדדית (§141) ── */
.sections-layout { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 18px; align-items: start; }
.sections-col-main { min-width: 0; }
.sections-col-side { position: sticky; top: 16px; min-width: 0; }
@media (max-width: 860px) { .sections-layout { grid-template-columns: 1fr; } .sections-col-side { position: static; } }

/* ── slots table — §141: dcard-wrap + רשימה-מחוברת (border-top), במקום קופסה-בודדת-פר-מיקום ── */
.slots-wrap { border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09); background: var(--card-bg); overflow: hidden; }
.slots-wrap-head { padding: 15px 20px 13px; font-size: 15px; font-weight: 700; }
.slots { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--border-md); }
.slot {
  background: var(--card-bg); border: none; border-radius: 0;
  padding: 13px 20px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--border-md);
}
.slot:first-child { border-top: none; }
.slot.anchored { background: rgba(var(--accent-rgb),.04); }
.slot-num {
  flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--nav-bg);
  border: 1.5px solid var(--border-md); display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900; color: var(--text-sm);
}
.slot.anchored .slot-num { background: var(--accent); color: #fff; border-color: var(--accent); }
.slot-body { flex: 1; min-width: 0; }
.slot-empty-txt { font-size: 12.5px; color: var(--text-muted); }
.slot-biz-name { font-size: 13.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.slot-meta { font-size: 11px; color: var(--text-sm); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.slot-meta .fixed-tag { color: var(--green); font-weight: 700; }
.slot-meta .temp-tag { color: var(--orange); font-weight: 700; }
.chain-line { font-size: 10.5px; color: var(--text-sm); margin-top: 4px; }
/* "המיקום באינדקס" בכרטיס העסק (שלב 4ב) — fixed-tag/temp-tag כאן עומדים לבד, לא בתוך .slot-meta */
.fixed-tag { color: var(--green); font-weight: 700; font-size: 11px; }
.temp-tag { color: var(--orange); font-weight: 700; font-size: 11px; }
.anchor-loc-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 0; border-top: 1px solid var(--border); }
.anchor-loc-row:first-of-type { border-top: none; }

/* מרכז לבבות (שלב 4ד) */
/* §142 — dcard-style (רדיוס-14+צל) כמו כל שאר הטבלאות/רשימות שהומרו הסשן הזה */
/* עודכן (2026-08-04, תואם-handoff מלא): פריסת 2-עמודות (hearts-layout) + פאנל צד, שורה עם
   קטגוריה+לינק-לכרטיס, עריכה הפכה מ-inputs-תמידיים-בשורה לפאנל-toggle תחת השורה (hearts-edit-panel) */
.hearts-layout { display: grid; grid-template-columns: minmax(0,1fr) 356px; gap: 18px; align-items: start; }
.hearts-col-main { min-width: 0; }
.hearts-col-side { position: sticky; top: 16px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 860px) { .hearts-layout { grid-template-columns: 1fr; } .hearts-col-side { position: static; } }

.hearts-table { background: var(--card-bg); border: none; border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09); overflow: hidden; }
.hearts-row { display: grid; grid-template-columns: 26px minmax(150px,1.4fr) 60px 60px 66px 130px 150px; gap: 10px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--border-md); font-size: 12.5px; }
.hearts-row:first-child { border-top: none; }
.hearts-row.hearts-head { font-size: 11px; font-weight: 800; color: var(--text-sm); background: var(--nav-bg); }
.hearts-row.selected { background: rgba(var(--accent-rgb),.05); }
.hearts-row.active-edit { background: var(--warn-bg); border-inline-start: 3px solid var(--accent-cta); padding-inline-start: 17px; }
.hearts-check { width: 18px; height: 18px; border: 1.5px solid var(--border-md); border-radius: 5px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; }
.hearts-name-cell { min-width: 0; }
.hearts-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hearts-cat { font-size: 11px; color: var(--text-sm); margin-top: 2px; }
.hearts-real, .hearts-shown { text-align: center; }
.hearts-gap { text-align: center; font-weight: 700; }
.hearts-gap.big { color: var(--orange); }
.hearts-validity { font-size: 11.5px; font-weight: 600; color: var(--text-sm); }
.hearts-row.active-edit .hearts-validity { color: var(--text); }
.hearts-row-actions { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }

.hearts-edit-panel { padding: 14px 20px 16px; background: var(--nav-bg); border-top: 1px solid var(--border-md); }
.hearts-edit-title { font-size: 12.5px; font-weight: 700; margin-bottom: 11px; }
.hearts-edit-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.hearts-edit-label { font-size: 11px; font-weight: 600; color: var(--text-sm); margin-bottom: 5px; }
.hearts-edit-input { width: 92px; height: 34px; padding: 0 10px; border: 1px solid var(--border-md); border-radius: 9px; background: var(--card-bg); font-size: 13px; font-weight: 700; }
.hearts-edit-input.days { width: 84px; font-weight: 400; }
.hearts-edit-hint { flex: 1; min-width: 170px; font-size: 11.5px; color: var(--text-sm); line-height: 1.55; padding-bottom: 8px; }

.hearts-bulk-bar { padding: 13px 20px 16px; border-top: 1px solid var(--border-md); display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.hearts-bulk-label { font-size: 12.5px; font-weight: 600; }
.hearts-bulk-hint { font-size: 11.5px; color: var(--text-sm); }

.wk-row { display: grid; grid-template-columns: 26px minmax(140px,1.3fr) 100px minmax(110px,.9fr) 110px minmax(220px,1.2fr); gap: 10px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--border-md); font-size: 12.5px; }

}
/* מסך-ממוזג (2026-08-05) — שני מסלולים זה-לצד-זה על אותו עמוד, בלי עמודה-שלישית-קבועה */
.wk-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; margin-bottom: 4px; }
@media (max-width: 860px) { .wk-two-col { grid-template-columns: 1fr; } }
.wk-track-label { font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }

.slot-actions { flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; }

/* ══════ תוכן דף הנחיתה (שלב 6) ══════ */

.lct-grid { display: grid; grid-template-columns: 360px minmax(0,1fr); gap: 16px; align-items: start; }

.lct-editor { padding: 14px 16px 16px; background: var(--nav-bg); border-top: 1px solid var(--border); }
.lct-editor-title { font-size: 12.5px; font-weight: 800; margin-bottom: 11px; }
.lct-field { margin-bottom: 11px; }

.lct-field label { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-sm); margin-bottom: 5px; }

.lct-tile-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,42,102,.9) 0%, rgba(10,42,102,.7) 40%, rgba(10,42,102,.22) 66%, rgba(10,42,102,0) 82%); pointer-events: none; }

.lct-tile-sub { margin-top: 6px; font-size: 12px; color: rgba(255,255,255,.95); max-width: 280px; line-height: 1.5; word-break: break-word; }

.lct-tile-imgbtn {
  position: absolute; inset-inline-start: 10px; top: 10px; height: 26px; padding: 0 10px; border-radius: 999px; border: none;

.lct-biz-section { padding: 22px 22px 0; }
.lct-biz-box { background: var(--lp-ink); color: #fff; border-radius: 16px; padding: 22px 24px; }
.lct-biz-eyebrow { font-size: 10.5px; font-weight: 800; letter-spacing: .07em; color: var(--lp-acc); outline: none; cursor: text; border-radius: 4px; }
.lct-biz-title { font-size: 18px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; margin-top: 8px; outline: none; cursor: text; border-radius: 4px; }

   עד ש-renderMain() רץ בסוף (יכול לקחת כמה שניות בהעלאת/דחיסת תמונה) — למנהל לא היה שום סימן
   שהלחיצה בכלל נקלטה. פיל קבוע-מיקום, לא תלוי בכפתור הספציפי (יש עשרות נקודות-שמירה בקובץ הזה). */
.saving-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(0); z-index: 9999;
  display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: var(--ink, #14213d);
  color: #fff; font-size: 13px; font-weight: 700; box-shadow: 0 6px 24px rgba(0,0,0,.25); opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s; }
.saving-toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.saving-toast.error { background: #b3261e; }

.saving-toast-spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; animation: saving-toast-spin .7s linear infinite; flex: none; }
.saving-toast.error .saving-toast-spinner, .saving-toast.ok .saving-toast-spinner { display: none; }
@keyframes saving-toast-spin { to { transform: rotate(360deg); } }
</style>

<script type="module">
// ── 2026-07-26: חובר ל-Firestore אמיתי (שלב 1) — MOCK_BUSINESSES/MOCK_FANS הוחלפו ב-onSnapshot
// אמיתי (ר' בסוף הקובץ). השם "MOCK_" נשאר בכוונה (39 מקומות משתמשים בו בקובץ) — הוא כבר לא מוק,
// זה נתון אמיתי. hydrateBiz/hydrateFan למטה ממפים בין שמות שדות שהדמו המקורי המציא לשמות האמיתיים
// ב-Firestore (למשל hasCoverPhoto נגזר מ-coverPhoto, ownerIsSubscriber מ-isSubscriber==='yes').
// שדות שאין להם מקבילה אמיתית כלל (region, reviewedSections, adminVerified/adminNote,
// pendingChangeDiff/aiShortTitle) מקבלים ברירת מחדל בטוחה — עדיין לא ניתן לשמור אותם בפועל
// (ר' באנר האזהרה ב-bizFullDetailHtml/fanFullDetailHtml ותיעוד ב-PROJECT_CONTEXT.md §54).
import { db, auth, getStorageLazy } from './firebase-config.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js';
import {
  collection, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp, getDoc, runTransaction, query, where, getDocs, writeBatch, setDoc, addDoc, orderBy, limit, getCountFromServer
} from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js';
import { ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js';

let MOCK_BUSINESSES = [];
let MOCK_FANS = [];
let WEEKLY_INTEREST = []; // "מי הביע עניין" — אוסף weekly_interest, נכתב אוטומטית מ-business.html §145
let WEEKLY_SCHEDULE = []; // שיבוץ בפועל לשבוע ספציפי — אוסף weekly_schedule, נכתב/נערך רק ע"י המנהל כאן
// זהות המנהל המחובר בפועל — נטענת ב-auth guard בתחתית הקובץ, לפני כל render/אינטראקציה.
// משמשת את logActivity() לרישום actorUid/actorName אמיתיים על כל רשומת יומן.
let CURRENT_ADMIN = { uid: null, name: 'מנהל', email: '' };

const REGIONS_MOCK = ['כל הארץ','גוש דן','ירושלים והסביבה','השפלה','השרון','חיפה והצפון','הדרום'];

// ── שומר-אינדיקטור גלובלי (ר' CSS .saving-toast) — נוסף ל-DOM פעם אחת, לא תלוי באיזה כפתור נלחץ.
// showSaving/hideSaving עוטפים את saveSectionUpdates (17 נקודות-קריאה) + פעולות-העלאה שקורות
// *לפני* ה-updateDoc (דחיסה/העלאה ל-Storage, החלק האיטי באמת בתמונות) — בלעדיהן המנהל לוחץ
// "העלה"/"שמור" ולא רואה שום שינוי במסך עד שהכל מסתיים, שניות אחר כך.
let savingDepth = 0;
function ensureSavingToastEl() {
  let el = document.getElementById('savingToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'savingToast';
    el.className = 'saving-toast';
    el.innerHTML = '<span class="saving-toast-spinner"></span><span class="saving-toast-label"></span>';
    document.body.appendChild(el);
  }
  return el;
}
function showSaving(label) {
  savingDepth++;
  const el = ensureSavingToastEl();
  el.className = 'saving-toast show';
  el.querySelector('.saving-toast-label').textContent = label || 'שומר...';
}
function hideSaving(ok, doneLabel) {
  savingDepth = Math.max(0, savingDepth - 1);
  if (savingDepth > 0) return; // עוד פעולה במקביל עדיין רצה — לא לסגור מתחתיה
  const el = ensureSavingToastEl();
  el.className = 'saving-toast show' + (ok === false ? ' error' : ' ok');
  el.querySelector('.saving-toast-label').textContent = ok === false ? 'שגיאה בשמירה' : (doneLabel || 'נשמר ✓');
  setTimeout(() => { if (savingDepth === 0) el.classList.remove('show'); }, 1400);
}

function toJsDate(ts) { return ts && ts.toDate ? ts.toDate() : (ts || null); }
// זהה ל-esc() ב-admin-businesses.html — למניעת שבירת HTML/XSS כשערך שדה (name/value) מכיל " או <
function esc(v) {
  return (v == null ? '' : String(v)).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// ── העלאת מדיה אמיתית ל-Firebase Storage — זהה בדיוק ל-admin-businesses.html (uploadFile/
// compressImageFile/compressToFile/uploadImageWithThumb) — שלב 5 (מדיה) הוא הראשון בדמו שצריך את זה. ──
async function uploadFile(file, path) {
  const storageRef = ref(await getStorageLazy(), path);
  const snap = await uploadBytes(storageRef, file, { cacheControl: 'public, max-age=31536000, immutable' });
  return await getDownloadURL(snap.ref);
}
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function dataUrlToFile(dataUrl, filename) {
  const [meta, b64] = dataUrl.split(',');
  const mime = meta.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new File([bytes], filename, { type: mime });
}
function compressImageFile(file, maxDim = 1280, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    fileToDataUrl(file).then(rawDataUrl => {
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/webp', quality));
      };
      img.onerror = reject;
      img.src = rawDataUrl;
    }).catch(reject);
  });
}
async function compressToFile(file, maxDim, quality, filename) {
  const dataUrl = await compressImageFile(file, maxDim, quality);
  return dataUrlToFile(dataUrl, filename || file.name);
}
async function uploadImageWithThumb(file, basePath) {
  try {
    const [mainFile, thumbFile] = await Promise.all([
      compressToFile(file, 1280, 0.82, file.name),
      compressToFile(file, 400, 0.75, 'thumb_' + file.name),
    ]);
    const [url, thumbUrl] = await Promise.all([
      uploadFile(mainFile, basePath),
      uploadFile(thumbFile, basePath + '_thumb'),
    ]);
    return { url, thumbUrl };
  } catch (e) {
    console.error('⚠️ image compression failed, falling back to original file:', e);
    return { url: await uploadFile(file, basePath), thumbUrl: '' };
  }
}

// המרה קריאה לתצוגת דיף (לא כמו fmtVal המפורט של admin-businesses.html — מספיק לקריאה בסיסית, לא מפורמט לפי סוג שדה)
function fmtDiffVal(v) {
  if (v == null || v === '') return '—';
  if (typeof v === 'boolean') return v ? 'כן' : 'לא';
  if (Array.isArray(v)) return v.length ? v.map(x => typeof x === 'object' ? JSON.stringify(x) : x).join(', ') : '—';
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}

// ממפה מסמך businesses אמיתי לצורה שה-UI הקיים בקובץ הזה מצפה לה (נבנה במקור סביב שמות-שדה מומצאים)
function hydrateBiz(id, raw) {
  const branches = raw.branches || [];
  const b = {
    ...raw,
    id,
    registeredAt: toJsDate(raw.submittedAt) || new Date(),
    approvedAt: toJsDate(raw.approvedAt),
    rejectedAt: toJsDate(raw.rejectedAt),
    agreedTermsAt: toJsDate(raw.agreedTermsAt),
    ownerEmailSentAt: toJsDate(raw.ownerEmailSentAt),
    pendingChangesAt: toJsDate(raw.pendingChangesAt),
    hasCoverPhoto: !!raw.coverPhoto,
    hasLogo: !!raw.logo,
    hasPhoto: !!(raw.coverPhoto || raw.logo),
    hoursText: raw.hours || '',
    descriptionText: raw.desc || '',
    hasPendingChange: !!raw.pendingChanges,
    city: (branches[0] && branches[0].city) || '',
    region: '', // אין שדה "אזור" בודד על עסק אמיתי — לא קריטי לשלב זה
    likes: (raw.likedBy || []).length,
    clicks: raw.clicks || 0,
    bizTypes: raw.bizTypes || [],
    isOnline: (raw.bizTypes || []).includes('online'),
    tags: raw.tags || [],
    regions: raw.regions || [],
    branches,
    reviewedSections: raw.reviewedSections || {}, // עדיין לא נשמר בפועל — ר' toggleSecReviewed
    ownerIsSubscriber: raw.isSubscriber === 'yes',
    ownerSubscriberSection: raw.gate || null,
    ownerSubscriberNumber: raw.subNum || null,
    ownerFacebookUrl: raw.fbUrl || '',
    ownerProofPhotoUrl: raw.photoProofUrl || '',
    // סדר-השלבים החדש בטופס (business.html, 08/2026) — קרבה לבעל המנוי ואינסטגרם-אימות (מסלול "לא מנוי")
    ownerRelation: raw.ownerRelation || '',
    ownerFanInstagram: raw.fanInstagram || '',
    // עסק השבוע · הטבת השבוע — שתי שאלות עצמאיות מהטופס, ר' "עסק השבוע והטבת השבוע.md";
    // התור/שיבוץ בפועל מתנהל ב-weekly_interest (מסך "10 עסק השבוע"), כאן רק הבעת-העניין הגולמית
    wantsBusinessOfWeek: !!raw.wantsBusinessOfWeek,
    wantsBenefitOfWeek: !!raw.wantsBenefitOfWeek,
    // תוקן — 2 באגים אמיתיים היו כאן:
    // (1) discountFullText נפל-בחזרה ל-raw.discountText (הכותרת המקוצרת) כשלא היה discountTextFull —
    //     זה גרם לטופס-העריכה להציג את הכותרת-הקצרה כאילו היא התיאור-המלא, ושמירה "מאשרת" את
    //     ההחלפה השקטה הזו לצמיתות — בדיוק התלונה: "דורסת את ההטבה הראשונה ומעתיקה את המקוצרת".
    // (2) שני השדות קראו רק מ-raw (המצב המאושר/הישן), אף פעם לא מ-raw.pendingChanges (מה שבעל
    //     העסק בפועל ביקש ועדיין ממתין לאישור) — אז אם הייתה בקשה ממתינה, המנהל היה עורך על סמך
    //     נתונים ישנים, והשמירה הייתה דורסת את הבקשה האמיתית של בעל העסק בלי לדעת שהוא בכלל ראה אותה.
    aiShortTitle: (raw.pendingChanges && 'discountText' in raw.pendingChanges) ? raw.pendingChanges.discountText : (raw.discountText || ''),
    discountFullText: (raw.pendingChanges && 'discountTextFull' in raw.pendingChanges) ? raw.pendingChanges.discountTextFull : (raw.discountTextFull || ''),
    // אותו תיקון (2) גם כאן — הטבה 2/3 חייבות להעדיף בקשה-ממתינה על פני המצב הישן, מאותה סיבה בדיוק
    additionalDiscounts: (raw.pendingChanges && 'additionalDiscounts' in raw.pendingChanges) ? raw.pendingChanges.additionalDiscounts : (raw.additionalDiscounts || []),
    // דיף שינויים ממתינים — נבנה מהערך הישן על המסמך מול הערך המוצע ב-pendingChanges (אמיתי, לא מוק)
    pendingChangeDiff: raw.pendingChanges ? Object.fromEntries(
      Object.keys(raw.pendingChanges).map(k => [k, { old: fmtDiffVal(raw[k]), new: fmtDiffVal(raw.pendingChanges[k]) }])
    ) : null,
    changeSubmittedAt: toJsDate(raw.pendingChangesAt),
    isNew: !!raw.isNew,
    isFeatured: !!raw.isFeatured,
    sectionDeals: raw.sectionDeals !== false,
    // "רוצה לכתוב לנו משהו?" — הודעה חופשית מבעל העסק (שלב הסיכום בהרשמה, business.html), לא בקשת
    // שינוי (יכולים לכתוב על כל נושא) — לכן מוצגת בנפרד מ"מה מבקשים לשנות". noteHandled מסומן ידנית
    // ע"י המנהל; noteHandledAt משמש לניקוי אוטומטי אחרי כמה ימים שבעל העסק צפה בסטטוס "טופל" (ר' business-dashboard.html).
    note: raw.note || '',
    noteHandled: !!raw.noteHandled,
    noteHandledAt: toJsDate(raw.noteHandledAt),
    noteOwnerAckAt: toJsDate(raw.noteOwnerAckAt),
    // catKey/icon — CATEGORIES כבר תואם למבנה האמיתי (fashion+sport נפרדים, ר' §59); עסק עם קטגוריה
    // שלא ברשימה מכל סיבה עדיין יוצג בלי אייקון (fallback 🏪 למטה) — לא קורס.
    catKey: raw.categoryPrimary || raw.cat || '',
  };
  b.icon = (CATEGORIES.find(c => c.key === b.catKey) || {}).icon || '🏪';
  b.healthScore = computeHealthScore(b);
  return b;
}

// ממפה מסמך members אמיתי (אוהד) לצורה שה-UI הקיים מצפה לה — לא כל אוהד הוא בעל עסק, ר' isBusinessOwner
function hydrateFan(id, raw) {
  return {
    ...raw,
    id,
    name: `${raw.firstName || ''} ${raw.lastName || ''}`.trim() || '—',
    registeredAt: toJsDate(raw.submittedAt) || new Date(),
    approvedAt: toJsDate(raw.approvedAt),
    rejectedAt: toJsDate(raw.rejectedAt),
    loginCodeCreatedAt: toJsDate(raw.loginCodeCreatedAt),
    loginCodeEmailSentAt: toJsDate(raw.loginCodeEmailSentAt),
    hasProofPhoto: !!raw.photoProofUrl,
    isBusinessOwner: !!raw.isBusinessOwner,
    linkedBusinessId: raw.linkedBusinessId || null,
    reviewFlag: raw.reviewFlag || null,
    adminVerified: !!raw.adminVerified, // עדיין לא נשמר בפועל — שדה חדש שהדמו הציע, לא קיים ב-Firestore
    adminNote: raw.adminNote || '',
  };
}

function findBiz(id) { return MOCK_BUSINESSES.find(b => b.id === id); }

// ── מיקום תמונה מייצגת על הכרטיס (coverPhotoPosition) — גרירה חיה בתוך תצוגה-מקדימה ביחס 4:3,
// זהה בדיוק ל-.biz-card-img/.biz-card-cover-img ב-home.html (ר' PROJECT_CONTEXT.md §184). נשמר
// כ-CSS object-position ("X% Y%") ומוזרם ישירות לתמונת-הכרטיס האמיתית — לא רק תצוגה-מקדימה פרטית.
const bizCoverPosEdits = {};
function parseCoverPos(str) {
  const m = /^(\d+(?:\.\d+)?)%\s+(\d+(?:\.\d+)?)%$/.exec(String(str || '').trim());
  return m ? { x: parseFloat(m[1]), y: parseFloat(m[2]) } : { x: 50, y: 50 };
}
function getCoverPos(id) {
  if (!bizCoverPosEdits[id]) {
    const b = findBiz(id);
    bizCoverPosEdits[id] = parseCoverPos(b && b.coverPhotoPosition);
  }
  return bizCoverPosEdits[id];
}
function applyCoverPos(id) {
  const img = document.getElementById('coverPosImg_' + id);
  const pos = getCoverPos(id);
  if (img) img.style.objectPosition = pos.x.toFixed(0) + '% ' + pos.y.toFixed(0) + '%';
}
let coverDragState = null;
window.startCoverDrag = function(ev, id) {
  ev.preventDefault();
  const box = document.getElementById('coverPosBox_' + id);
  if (!box) return;
  const rect = box.getBoundingClientRect();
  const cur = getCoverPos(id);
  coverDragState = { id, startX: ev.clientX, startY: ev.clientY, startPosX: cur.x, startPosY: cur.y, w: rect.width, h: rect.height };
  box.classList.add('dragging');
  box.setPointerCapture && box.setPointerCapture(ev.pointerId);
};
document.addEventListener('pointermove', (ev) => {
  if (!coverDragState) return;
  const dx = ev.clientX - coverDragState.startX;
  const dy = ev.clientY - coverDragState.startY;
  // גרירה ימינה = "מזיזים את התמונה ימינה" (המשתמש רואה יותר מהצד השמאלי שלה) — לכן ההפחתה, לא הוספה.
  const nx = Math.min(100, Math.max(0, coverDragState.startPosX - (dx / coverDragState.w) * 100));
  const ny = Math.min(100, Math.max(0, coverDragState.startPosY - (dy / coverDragState.h) * 100));
  bizCoverPosEdits[coverDragState.id] = { x: nx, y: ny };
  applyCoverPos(coverDragState.id);
});
document.addEventListener('pointerup', () => {
  if (!coverDragState) return;
  document.getElementById('coverPosBox_' + coverDragState.id)?.classList.remove('dragging');
  coverDragState = null;
});
window.resetCoverPos = function(id) {
  bizCoverPosEdits[id] = { x: 50, y: 50 };
  applyCoverPos(id);
};

// (mediaThumbHtml/downloadImage שם). המשתמש דחה במפורש <a target="_blank"> — רצה הורדה ישירה מהתמונה
// עצמה בלי לצאת מהעמוד, ותצוגה-גדולה שלא פותחת טאב חדש. ר' PROJECT_CONTEXT.md §185.
let lightboxCurrentUrl = '';
let lightboxCurrentFilename = '';
function mediaThumbHtml(url, filename, sizeStyle, alt, objectFit) {
  if (!url) return '';

window.openImageLightbox = function(url, filename) {

// מוריד דרך פרוקסי — עוקף חסימת CORS של הדפדפן על fetch() ישיר לכתובת Firebase Storage, זהה-ביט-לביט
// ל-downloadImage ב-admin-businesses.html (localhost→server.ps1 /api/download-image, פרודקשן→Worker).
window.downloadImage = function(url, filename) {
  if (!url) return;
  const isLocalDev = location.hostname === 'localhost';
  const base = isLocalDev ? '/api/download-image' : (WORKER_URL + '/download-image');
  const proxyUrl = base + '?url=' + encodeURIComponent(url) + '&filename=' + encodeURIComponent(filename || 'image.jpg');
  const a = document.createElement('a');
  a.href = proxyUrl;
  a.download = filename || 'image.jpg';
  document.body.appendChild(a);
  a.click();
  a.remove();
};

// ── קוד כניסה של האוהד המקושר לעסק — לא שדה על מסמך העסק עצמו (הוא על members/{ownerMemberId}),
// לכן לא זמין סינכרונית מ-hydrateBiz. נשלף ברקע (זהה ללוקאפ ב-admin-businesses.html openBizSheet
// שנוסף היום) ונשמר במטמון קטן; bizFullDetailHtml מציג "..." עד שהוא מגיע ואז מרנדר מחדש.
const ownerLoginCodeCache = {};
async function fetchOwnerLoginCode(b) {
  if (ownerLoginCodeCache[b.id] !== undefined) return;
  let code = '';
  try {
    let memberData = null;
    if (b.ownerMemberId) {
      const s = await getDoc(doc(db, 'members', b.ownerMemberId));
      if (s.exists()) memberData = s.data();
    }
    if (!memberData && b.ownerEmail) {
      const s = await getDocs(query(collection(db, 'members'), where('email', '==', b.ownerEmail)));
      if (!s.empty) memberData = s.docs[0].data();
    }
    code = (memberData && memberData.loginCode) || '';
  } catch (e) { console.warn('ownerLoginCode lookup failed', e); }
  ownerLoginCodeCache[b.id] = code;
  if (selectedBizDetailId === b.id) renderMain();
}

// state[tabKey][slotIndex] = null (=אוטומטי) או
// { bizId, mode:'fixed'|'temp', days, setAt:Date, until:Date|null,
//   next:null|{bizId,mode,days,handoverAt:Date} }
// handoverAt = מתי המחליף נכנס בפועל: לעיגון זמני זה תמיד until (אוטומטי). לעיגון קבוע זה תאריך
// שנבחר ידנית בעת הגדרת המחליף (כי לעיגון קבוע אין תאריך תפוגה טבעי).
// מ-2026-07-26: state נטען בפועל מ-Firestore (settings/sectionAnchors, מסמך יחיד עם שדה למפתח טאב,
// כל שדה מערך של 10 איברים nullable) — ר' anchorsDocToState/anchorToRaw למטה, וה-onSnapshot בתחתית
// הקובץ. עד שהמסמך נטען פעם ראשונה, state מאותחל ריק (הכל "אוטומטי") כדי לא לקרוס.
const state = {};
ALL_TABS.forEach(t => state[t.key] = new Array(SLOT_COUNT).fill(null));

// ISO string (כפי שנשמר ב-Firestore) → Date (כפי שכל שאר קוד העיגונים בקובץ הזה כבר מצפה לו)
function anchorFromRaw(raw) {
  if (!raw) return null;
  return {
    ...raw,
    setAt: raw.setAt ? new Date(raw.setAt) : null,
    until: raw.until ? new Date(raw.until) : null,
    next: raw.next ? { ...raw.next, handoverAt: raw.next.handoverAt ? new Date(raw.next.handoverAt) : null } : null,
  };
}
// Date → ISO string, לכתיבה חזרה ל-Firestore
function anchorToRaw(a) {
  if (!a) return null;
  return {
    ...a,
    setAt: a.setAt ? a.setAt.toISOString() : null,
    until: a.until ? a.until.toISOString() : null,
    next: a.next ? { ...a.next, handoverAt: a.next.handoverAt ? a.next.handoverAt.toISOString() : null } : null,
  };
}
function anchorsDocToState(raw) {
  const s = {};
  ALL_TABS.forEach(t => {
    const arr = (raw && raw[t.key]) || [];
    s[t.key] = Array.from({ length: SLOT_COUNT }, (_, i) => anchorFromRaw(arr[i] || null));
  });
  return s;
}

// לא הצומת המצומצם). (2) גופן 11px Heebo בזמן שה-CSS האמיתי הוא 14px. (3) family Heebo בזמן שגוף-הדף
// כולו ב-home.html הוא Rubik (body{font-family:'Rubik'}) — שני פונטים שונים עם מטריקות-רוחב שונות
// לגמרי. שלוש הטעויות ביחד גרמו לחיתוך-טקסט הרבה יותר אגרסיבי ממה שבאמת נדרש כדי להישאר בשורה אחת.
// 260 (min-width הכי-צר של .biz-card) − 32 (2×16px padding של .biz-card-body) = 228px רוחב-זמין אמיתי.
const CARD_TITLE_RAW_WIDTH = 228;
const CARD_TITLE_SAFETY_MARGIN = 10;
const CARD_TITLE_MAX_WIDTH = CARD_TITLE_RAW_WIDTH - CARD_TITLE_SAFETY_MARGIN;
const CARD_TITLE_FONT = '700 14px Rubik';
let _measureCanvas = null;
function measureTextWidth(text, font) {
  if (!_measureCanvas) _measureCanvas = document.createElement('canvas');
  const ctx = _measureCanvas.getContext('2d');
  ctx.font = font;
  return ctx.measureText(text).width;
}
function ensureFitsCard(text) {
  let t = (text || '').trim();
  if (measureTextWidth(t, CARD_TITLE_FONT) <= CARD_TITLE_MAX_WIDTH) return t;
  while (t.includes(' ') && measureTextWidth(t, CARD_TITLE_FONT) > CARD_TITLE_MAX_WIDTH) {
    t = t.slice(0, t.lastIndexOf(' ')).trim();
  }
  while (t.length > 1 && measureTextWidth(t, CARD_TITLE_FONT) > CARD_TITLE_MAX_WIDTH) {
    t = t.slice(0, -1);
  }
  return t.trim();
}

function bizById(id) { return MOCK_BUSINESSES.find(b => b.id === id); }

// מאגר העסקים הרלוונטי לטאב: קטגוריה = רק עסקים ששייכים אליה בפועל. סקשן = הכל, אלא אם יש ELIGIBLE_FILTER.
function poolFor(tab) {
  if (tab.type === 'category') return MOCK_BUSINESSES.filter(b => b.catKey === tab.catKey);
  const ef = ELIGIBLE_FILTER[tab.key];
  return ef ? MOCK_BUSINESSES.filter(ef.test) : MOCK_BUSINESSES;
}
function scopeNoteFor(tab) {
  if (tab.type === 'category') return `מציג רק עסקים ששייכים בפועל לקטגוריית "${CATEGORIES.find(c=>c.key===tab.catKey).label}"`;
  const ef = ELIGIBLE_FILTER[tab.key];
  return ef ? ef.note : 'מציג את כל העסקים המאושרים באינדקס';
}

// סדר "אוטומטי" יציב לכל טאב, לצורך התצוגה המקדימה בלבד (מדמה את הסבב היומי ההוגן האמיתי)
function autoOrderFor(tab) {
  // mostLoved (שלב 4ג, §2 במפרט) — לא סבב-הוגן אקראי כמו שאר הסקשנים: סדר אמיתי לפי מספר לבבות,
  // likesOverride (עריכה ממרכז-הלבבות) גובר על likedBy.length האמיתי אם קיים.
  if (tab.key === 'mostLoved') {
    return [...poolFor(tab)].sort((a, b) => (b.likesOverride ?? b.likes ?? 0) - (a.likesOverride ?? a.likes ?? 0));
  }
  const seed = [...tab.key].reduce((a,c) => a + c.charCodeAt(0), 0);
  return [...poolFor(tab)].sort((a, b) => {
    const ha = (a.id.charCodeAt(1) * 31 + seed) % 97;
    const hb = (b.id.charCodeAt(1) * 31 + seed) % 97;
    return ha - hb;
  });
}

function fmtDateTime(d) {
  if (!d) return '';
  return d.toLocaleDateString('he-IL') + ' ' + d.toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit'});
}
function fmtDate(d) { return d.toLocaleDateString('he-IL'); }
// "כמה זמן עבר" — לשורות ממתינים/רשומים, כדי לראות מיד כמה זמן מישהו כבר מחכה, לא רק את התאריך היבש
// "לפני 150 ימים" לא ברור בקריאה מהירה (כמה זה בערך?) — פירוק לשבועות/חודשים/שנים לפער גדול,
// ימים בודדים נשארים מדויקים כי שם זה כן ברור.
function agoLabel(d) {
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if (days <= 0) return 'היום';
  if (days === 1) return 'אתמול';
  if (days < 14) return `לפני ${days} ימים`;
  if (days < 60) return `לפני ${Math.round(days / 7)} שבועות`;
  if (days < 365) return `לפני ${Math.round(days / 30)} חודשים`;
  const years = Math.round(days / 365);
  return `לפני ${years === 1 ? 'שנה' : years + ' שנים'}`;
}
function daysLeft(date) { return Math.ceil((date - new Date()) / DAY_MS); }
function isExpired(anchor) { return anchor.mode === 'temp' && anchor.until && new Date() > anchor.until; }
// התאריך שבו קורה משהו למיקום הזה: לעיגון זמני זה מועד הפקיעה. לעיגון קבוע זה תאריך ההחלפה
// המתוזמן (אם הוגדר) — קבוע בלי מחליף לא "מסתיים" אף פעם, ולכן לא מוצג בפאנל.
function effectiveDate(anchor) {
  return anchor.mode === 'temp' ? anchor.until : (anchor.next ? anchor.next.handoverAt : null);
}

function expiringPanelHtml() {
  const slots = state[activeTab];
  const items = slots
    .map((a, i) => ({ a, i, ed: a ? effectiveDate(a) : null }))

      </div>`;
  }

  const needsAttention = items.filter(x => !x.a.next);

  const rowNeedsAttention = ({a, i, ed}) => {

    return `

    const biz = bizById(a.bizId);

      <div class="expiring-item">
        <div class="exp-pos">${i+1}</div>
        <div class="exp-body">${biz.name} <span class="succ">← <span class="cv">${nx.name}</span></span></div>

// מיון-תצוגה לרשימת המיקומים (2026-08-05, בקשת המשתמש) — לא משנה את המספור (slot-num תמיד המיקום
// האמיתי), רק את סדר-ההופעה. 'position' = ברירת-מחדל, זהה למה שהיה תמיד.
let sectionSlotSort = 'position'; // 'position' | 'expiring' | 'noSuccessor'
window.setSectionSlotSort = function(v) { sectionSlotSort = v; renderMain(); };

function orderedSlotIndices(tab) {
  const slots = state[activeTab];
  const idx = slots.map((_, i) => i);
  if (sectionSlotSort === 'expiring') {
    idx.sort((a, b) => {
      const A = slots[a], B = slots[b];
      const aActive = A && !isExpired(A), bActive = B && !isExpired(B);
      if (aActive && bActive) return effectiveDate(A) - effectiveDate(B);
      if (aActive !== bActive) return aActive ? -1 : 1;
      return a - b;
    });
  } else if (sectionSlotSort === 'noSuccessor') {
    idx.sort((a, b) => {
      const A = slots[a], B = slots[b];
      const aActive = A && !isExpired(A), bActive = B && !isExpired(B);
      const aNoNext = aActive && !A.next, bNoNext = bActive && !B.next;
      if (aNoNext !== bNoNext) return aNoNext ? -1 : 1;
      return a - b;
    });
  }
  return idx;
}

function renderOneSlot(i, tab, poolSize, autoPoolSize) {
  const slots = state[activeTab];
  const anchor = slots[i];
  const active = anchor && !isExpired(anchor);
  if (pickingSlot === i) return renderPickerSlot(i, tab);

  if (active) {
    const biz = bizById(anchor.bizId);
    const modeLine = anchor.mode === 'fixed'
      ? `<span class="fixed-tag">📌 קבוע</span>`
      : `<span class="temp-tag">⏳ עד ${fmtDate(anchor.until)}</span>`;
    let chainLine = '';
    if (anchor.next) {
      const when = anchor.mode === 'temp' ? 'לאחר שהעיגון יפוג' : 'ב-' + fmtDate(anchor.next.handoverAt);
      chainLine = `<div class="chain-line">→ ${when}: <span class="cv">${bizById(anchor.next.bizId).name}</span> (${anchor.next.mode==='fixed' ? 'קבוע' : 'למשך ' + anchor.next.days + ' ימים'})</div>`;
    } else if (anchor.mode === 'temp') {
      chainLine = `<div class="chain-line" style="color:var(--text-muted)">→ לאחר מכן: חוזר לסבב אוטומטי</div>`;
    }
    const scheduleBtn = anchor.mode === 'fixed'
      ? `<button class="slot-btn" onclick="editExisting(${i})">${anchor.next ? 'ערוך תזמון' : '🗓 תזמן החלפה'}</button>`
      : '';
    return `
      <div class="slot anchored">
        <div class="slot-num">${i+1}</div>
        <div class="slot-body">
          <div class="slot-biz-name">${biz.name}</div>
          <div class="slot-meta">
            ${modeLine}
            <span>נקבע ב-${fmtDateTime(anchor.setAt)}</span>
          </div>
          ${chainLine}
        </div>
        <div class="slot-actions">
          <button class="slot-btn" onclick="openPicker(${i})">החלף</button>
          ${scheduleBtn}
          <button class="slot-btn danger" onclick="removeAnchor(${i})">הסר</button>
        </div>
      </div>`;
  }

  const disabled = poolSize === 0;
  return `
    <div class="slot">
      <div class="slot-num">${i+1}</div>
      <div class="slot-body"><div class="slot-empty-txt">— אוטומטי, מתחלף יומית מתוך ${autoPoolSize} עסקים —</div></div>
      <div class="slot-actions">
        <button class="slot-btn primary" ${disabled ? 'disabled' : ''} onclick="openPicker(${i})">📌 עגן עסק כאן</button>
      </div>
    </div>`;
}

function slotsHtml(tab) {
  const slots = state[activeTab];
  const poolSize = poolFor(tab).length;
  // גודל הסבב האמיתי (§9 במפרט + עדכון-המשך מהמעצב) — מאושרים פחות מעוגנים-בפועל בסקשן הזה, לא
  // סך-כל-המאושרים (עסק מעוגן לא חוזר גם על-פני הסבב האוטומטי).
  const anchoredCount = slots.filter(a => a && !isExpired(a)).length;
  const autoPoolSize = Math.max(0, poolSize - anchoredCount);

  return orderedSlotIndices(tab).map(i => renderOneSlot(i, tab, poolSize, autoPoolSize)).join('');
}

// בלוק "מי יחליף" — זמין גם לעיגון זמני (מחליף נכנס כשהתוקף פג) וגם לעיגון קבוע
// (מחליף נכנס בתאריך שבוחרים ידנית, כי לקבוע אין תאריך פקיעה טבעי).
function renderChainBlock(tab, i) {
  const excludeIds = new Set(
    state[activeTab].map((a,idx) => (a && !isExpired(a) && idx !== i) ? a.bizId : null).filter(Boolean)

  const offLabel = isTemp ? '🔄 חוזר לסבב אוטומטי' : '♾ יישאר קבוע (בלי תזמון)';
  const onLabel  = isTemp ? '📌 עסק אחר יחליף' : '📌 תזמן מי יחליף ומתי';
  const blockTitle = isTemp ? 'מה קורה כשפג התוקף?' : 'לתזמן כבר עכשיו מי יחליף בעתיד?';

  return `
    <div class="chain-block">
      <div class="chain-label">${blockTitle}</div>
      <div class="mode-toggle">
        <div class="mode-opt ${editMode.chainMode==='auto'?'selected':''}" onclick="setChainMode('auto')">${offLabel}</div>
        <div class="mode-opt ${editMode.chainMode==='chain'?'selected':''}" onclick="setChainMode('chain')">${onLabel}</div>

        <select class="chain-select" onchange="editMode.nextBizId=this.value||null; renderAll()">

          ${successorOptions.map(b => `<option value="${b.id}" ${editMode.nextBizId===b.id?'selected':''}>${b.name}</option>`).join('')}
        </select>
        ${editMode.nextBizId ? `
          ${!isTemp ? `
            <div class="days-row" style="margin-bottom:8px">
              <input type="number" min="1" value="${editMode.handoverDays}" oninput="editMode.handoverDays=parseInt(this.value)||1; renderAll()">
              <span>ימים מהיום — ההחלפה תקרה ב-${fmtDate(new Date(Date.now()+ (editMode.handoverDays||30)*DAY_MS))}</span>
            </div>` : ''
          }
          <div class="chain-sub-toggle">
            <div class="mode-opt ${editMode.nextType==='fixed'?'selected':''}" onclick="setNextType('fixed')">📌 קבוע</div>
            <div class="mode-opt ${editMode.nextType==='temp'?'selected':''}" onclick="setNextType('temp')">⏳ הוא עצמו לזמן מוגבל</div>
          </div>
          ${editMode.nextType === 'temp' ? `
            <div class="days-row" style="margin-top:8px">
              <input type="number" min="1" value="${editMode.nextDays}" oninput="editMode.nextDays=parseInt(this.value)||1">
              <span>ימים מרגע שהוא נכנס</span>
            </div>` : ''
          }` : ''
        }
      ` : ''}
    </div>`;
}

// עריכה מהירה של עיגון קיים (למשל מתוך פאנל "מסתיים בקרוב") — נכנס ישר לטופס המצב, בלי לחפש מחדש
window.editExisting = function(i) {
  pickingSlot = i;
  const a = state[activeTab][i];
  choosingBiz = a.bizId;
  const now = Date.now();
  editMode = {
    type: a.mode, days: a.days || 30,
    chainMode: a.next ? 'chain' : 'auto',
    nextBizId: a.next ? a.next.bizId : null,
    nextType: a.next ? a.next.mode : 'fixed',
    nextDays: (a.next && a.next.days) || 30,
    handoverDays: (a.mode === 'fixed' && a.next) ? Math.max(1, Math.round((a.next.handoverAt - now) / DAY_MS)) : 30,
  };
  renderAll();
};

window.cancelPicker = function() {
  pickingSlot = null;
  choosingBiz = null;

window.filterPicker = function(q) {
  const tab = tabMeta(activeTab);
  const anchoredIdsElsewhere = new Set(
    state[activeTab].map((a,idx) => (a && !isExpired(a) && idx !== pickingSlot) ? a.bizId : null).filter(Boolean)
  );
  const list = poolFor(tab).filter(b =>
    !anchoredIdsElsewhere.has(b.id) &&
    (!q || b.name.includes(q))
  );
  const listEl = document.getElementById('pickerList');
  if (!listEl) return;
  listEl.innerHTML = list.length ? list.map(b => `
    <div class="picker-item" onclick="chooseBiz('${b.id}')">
      <span class="nm">${b.name}</span>

};

window.setEditMode = function(type) {

window.setChainMode = function(mode) {

window.setNextType = function(type) {

// כתיבה ל-Firestore דורשת את המערך השלם של 10 האיברים לאותו מפתח-טאב (אין עדכון-איבר-מערך חלקי
// נוח ב-Firestore) — bumpSlot בונה state[activeTab] מעודכן ואז כותב את כולו במכה אחת.
async function bumpSlot(i, value) {
  const prev = state[activeTab][i];
  state[activeTab][i] = value; // עדכון אופטימי מקומי, לפני שהכתיבה חוזרת
  renderAll();
  try {
    const rawArr = state[activeTab].map(anchorToRaw);
    // setDoc({merge:true}) ולא updateDoc — המסמך עשוי לא להתקיים עדיין בפעם הראשונה שמעגנים משהו בכלל
    await setDoc(doc(db, 'settings', 'sectionAnchors'), { [activeTab]: rawArr }, { merge: true });
  } catch (e) {
    console.error(e);
    alert('שגיאה בשמירת העיגון: ' + e.message);
    state[activeTab][i] = prev; // rollback מקומי אם הכתיבה נכשלה
    renderAll();
  }
}

window.saveAnchor = async function(i) {
  const now = new Date();
  const until = editMode.type === 'temp' ? new Date(now.getTime() + (editMode.days||1) * DAY_MS) : null;

  let next = null;
  if (editMode.chainMode === 'chain' && editMode.nextBizId) {
    const handoverAt = editMode.type === 'temp' ? until : new Date(now.getTime() + (editMode.handoverDays||30) * DAY_MS);
    next = {
      bizId: editMode.nextBizId,
      mode: editMode.nextType,
      days: editMode.nextType === 'temp' ? (editMode.nextDays || 1) : null,
      handoverAt,
    };
  }

  const value = {
    bizId: choosingBiz,
    mode: editMode.type,
    days: editMode.type === 'temp' ? (editMode.days || 1) : null,
    setAt: now,
    until,
    next,
  };

  choosingBiz = null;
  await bumpSlot(i, value);
};

// גרסה עצמאית-מטאב, לבלוק "המיקום באינדקס" בכרטיס העסק (שלב 4ב, §16 במפרט) — bumpSlot/removeAnchor
// הרגילות מניחות activeTab (הטאב שפתוח כרגע במסך העיגונים), אבל כאן המנהל לוחץ מתוך כרטיס-עסק שיכול
// להיות מעוגן במיקום בטאב אחר לגמרי מזה שפתוח.
async function removeAnchorForTab(tabKey, i) {
  const prev = state[tabKey][i];
  if (!prev) return;
  state[tabKey][i] = null;
  renderMain();
  try {
    const rawArr = state[tabKey].map(anchorToRaw);
    await setDoc(doc(db, 'settings', 'sectionAnchors'), { [tabKey]: rawArr }, { merge: true });
    const tab = tabMeta(tabKey);
    await logActivity('businesses', prev.bizId, {

function bizAnchorLocationsHtml(b) {

function bizClassCounts() {

function bizFilteredList() {
  const q = bizSearch.trim();

    const matchF = bizStatusFilter === 'all' ? true

    const matchCat = bizCategoryFilter === 'all' || b.catKey === bizCategoryFilter;
    const matchType = bizTypeFilter === 'all' || (b.bizTypes || []).includes(bizTypeFilter);
    const matchReview = bizReviewFilter === 'all' ? true

      : (Date.now() - b.registeredAt.getTime()) <= Number(bizDateRangeFilter) * 86400000;
    const catLabel = (CATEGORIES.find(c => c.key === b.catKey) || {}).label || '';
    const matchQ = !q || b.name.includes(q) || (b.city || '').includes(q) || catLabel.includes(q);

    return tagQueueSort === 'oldest' ? dx - dy : dy - dx;
  });
  return items;
}

// קטלוג תגית-אחת (חלק א׳) עם מיון/סינון — לא נוגע ב-TAGS_BY_CATEGORY_MOCK עצמו, רק בסדר/היקף התצוגה
function tagCategorySortedFiltered(catKey) {
  let tags = (TAGS_BY_CATEGORY_MOCK[catKey] || []).slice();
  if (tagCatalogFilter === 'used') tags = tags.filter(t => tagUsageCount(catKey, t) > 0);
  else if (tagCatalogFilter === 'unused') tags = tags.filter(t => tagUsageCount(catKey, t) === 0);
  else if (tagCatalogFilter === 'oneOnly') tags = tags.filter(t => tagUsageCount(catKey, t) === 1);
  if (tagCatalogSort === 'alpha') tags.sort((a, b) => a.localeCompare(b, 'he'));
  else if (tagCatalogSort === 'leastUsed' || tagCatalogSort === 'neverUsed') tags.sort((a, b) => tagUsageCount(catKey, a) - tagUsageCount(catKey, b));
  else tags.sort((a, b) => tagUsageCount(catKey, b) - tagUsageCount(catKey, a)); // mostUsed — ברירת מחדל
  return tags;
}

    // כדי ששני המסכים יסכימו תמיד (לא בדיקה כפולה נפרדת כאן). status==='rejected' הוא חריג: classifyAction
    // לא מטפל בו במפורש (מחזיר "מאושר · אין פעולה" שגוי) — עוקפים מקומית, לא מתקנים classifyAction עצמה

// זהה בהיגיון ל-admin-businesses.html האמיתי (card-section/sec-edit-btn/secView-secEdit/toggleSecEdit/saveSecN).
// כל 5 השלבים תמיד מרונדרים (תצוגה+עריכה), רק העריכה מוסתרת ב-CSS עד שלוחצים "✏️ ערוך" — בלי רינדור-מחדש
// בפתיחה/סגירה עצמה (מהיר, שומר גלילה/מצב שלבים אחרים). שמירה בפועל כן עושה renderMain() מלא (עקבי עם
// שאר הפעולות בקובץ — approveBiz/rejectBiz/approveTagSecondSuggestion וכו').
// ── סימוני סקשן (✨ חדש/⭐ נבחר/💛 הטבות שוות/💙 לב מוצג) — זהה בדיוק ל"ניהול סקשנים" ב-admin-businesses.html
// (isSecNewActive/isSecFeaturedActive/isLikesOverrideActive/newCellHtml/featuredCellHtml/dealsCellHtml/
// likesOverrideCellHtml/applySectionUpdate/activateSectionFlag/clearSectionFlag/toggleDealsSection/
// activateLikesOverride/clearLikesOverride) — כאן מוצג בתוך כרטיס העסק במקום בטבלה נפרדת, אותם שדות/כתיבות.
function isSecNewActive(b) { return !!(b.isNew && b.newUntil && new Date() < new Date(b.newUntil)); }
function isSecFeaturedActive(b) { return !!(b.isFeatured && (!b.featuredUntil || new Date() < new Date(b.featuredUntil))); }
function isLikesOverrideActive(b) { return b.likesOverride != null && (!b.likesOverrideUntil || new Date() < new Date(b.likesOverrideUntil)); }

function sectionFlagsControlHtml(b) {
  const newCell = isSecNewActive(b)
    ? `<div class="flag-box-row"><span class="flag-box-val">פעיל עד ${fmtDate(new Date(b.newUntil))}</span><button class="btn-flag-remove" onclick="clearSectionFlag('${b.id}','new')">הסרה</button></div>`
    : `<div class="flag-box-row"><input type="number" class="edit-days-input" id="newDays-${b.id}" value="30" min="1" style="width:60px" /> ימים
       <button class="btn-hearts-update" onclick="activateSectionFlag('${b.id}','new')">הפעל</button></div>`;
  const featuredCell = isSecFeaturedActive(b)
    ? `<div class="flag-box-row"><span class="flag-box-val">${b.featuredUntil ? 'עד ' + fmtDate(new Date(b.featuredUntil)) : 'קבוע'}</span><button class="btn-flag-remove" onclick="clearSectionFlag('${b.id}','featured')">הסרה</button></div>`
    : `<div class="flag-box-row"><button class="btn-hearts-update" onclick="activateSectionFlag('${b.id}','featured')">סמן קבוע</button>

  const dealsCell = !b.hasDiscount
    ? `<div class="flag-box-row"><span class="flag-box-sub">אין הטבה</span></div>`
    : `<div class="flag-box-row"><button class="toggle${b.sectionDeals !== false ? ' on' : ''}" title="${b.discountText || ''}" onclick="toggleDealsSection('${b.id}',${b.sectionDeals !== false})"></button><span class="flag-box-sub">${b.sectionDeals !== false ? 'מוצג' : 'מוסתר'}</span></div>`;
  // תואם-handoff (2026-08-04): המספר האמיתי והמוצג מוצגים תמיד ביחד ("אמיתי 47 · מוצג 184 עד 31.08"),
  // לא עוד תצוגה-או-עריכה חלופיות — קודם כשהיה override פעיל, המספר האמיתי נעלם לגמרי מהתצוגה.
  const likesOverrideActive = isLikesOverrideActive(b);
  const likesDisplayed = likesOverrideActive ? b.likesOverride : b.likes;
  const likesSummary = likesOverrideActive
    ? `אמיתי ${b.likes} · מוצג ${b.likesOverride}${b.likesOverrideUntil ? ' עד ' + fmtDate(new Date(b.likesOverrideUntil)) : ' (קבוע)'}`
    : `אמיתי ${b.likes}`;

    <div class="flag-box ${isLikesOverrideActive(b) ? 'warn' : 'neutral'}"><div class="flag-box-h">💙 לבבות</div>${likesCell}</div>
  </div>`;
}

async function applySectionUpdate(id, updates, msg) {
  try {
    await updateDoc(doc(db, 'businesses', id), updates);
    if (msg) alert(msg);
  } catch (e) { console.error(e); alert('שגיאה בעדכון: ' + e.message); }
}
window.activateSectionFlag = async function(id, kind, temp) {
  if (kind === 'new') {
    const days = parseInt(document.getElementById(`newDays-${id}`)?.value, 10) || 30;
    await applySectionUpdate(id, { isNew: true, newUntil: new Date(Date.now() + days * 86400000).toISOString() }, '✨ סומן כ"חדש אצלנו"');
  } else if (kind === 'featured') {
    let until = null;
    if (temp) {
      const days = parseInt(document.getElementById(`featuredDays-${id}`)?.value, 10);
      if (!days || days < 1) { alert('נא להזין מספר ימים תקין'); return; }
      until = new Date(Date.now() + days * 86400000).toISOString();
    }
    await applySectionUpdate(id, { isFeatured: true, featuredUntil: until }, '⭐ סומן כעסק נבחר');
  }
};
window.clearSectionFlag = async function(id, kind) {
  await applySectionUpdate(id, kind === 'new' ? { isNew: false, newUntil: null } : { isFeatured: false, featuredUntil: null });
};
window.toggleDealsSection = async function(id, current) {
  await applySectionUpdate(id, { sectionDeals: !current });
};
window.activateLikesOverride = async function(id) {
  const val = parseInt(document.getElementById(`likesVal-${id}`)?.value, 10);
  if (isNaN(val) || val < 0) { alert('נא להזין מספר תקין'); return; }
  const days = parseInt(document.getElementById(`likesDays-${id}`)?.value, 10);
  const until = (days && days > 0) ? new Date(Date.now() + days * 86400000).toISOString() : null;
  const b = findBiz(id);
  const before = b ? (b.likesOverride ?? b.likes) : null;
  await applySectionUpdate(id, { likesOverride: val, likesOverrideUntil: until, likesOverrideSetAt: new Date().toISOString() }, '💙 מספר הלב עודכן');
  await logActivity('businesses', id, {
    type: 'hearts', title: 'מספר לבבות מוצג נערך',
    detail: `${before} → ${val}${until ? ' עד ' + fmtDate(new Date(until)) : ' (קבוע, בלי תוקף)'}`,
    field: 'likesOverride', before, after: val,
  });
};
window.clearLikesOverride = async function(id) {
  const b = findBiz(id);
  const before = b ? b.likesOverride : null;

// 💙 מרכז לבבות — מסך חדש (שלב 4ד, §2 במפרט, "8 מרכז לבבות.dc.html"). קורא ל-activateLikesOverride/
// clearLikesOverride הקיימות למעלה (אותם input-id בדיוק: likesVal-${id}/likesDays-${id}) — אין
// לוגיקת-כתיבה כפולה, רק תצוגת-טבלה חדשה על גבי אותם שדות/פונקציות.
// עודכן (2026-08-04, תואם-handoff מלא): כותרת+3 KPI (msg-content-head), חיפוש+פילי-סינון עם ספירה
// (כמו biz-class-pill), פריסת 2-עמודות + פאנל צד (דורש-החלטה/הכי-אהובים/הערת-מרכז-נתונים), עריכה
// הפכה מ-inputs-תמידיים בשורה לפאנל-toggle תחת השורה, קטגוריה+לינק-לכרטיס (jumpToBizFromTagQueue,
// אותה פונקציה כמו בניהול-תגיות) בכל שורה. "הכי אהובים" קורא ל-autoOrderFor(mostLoved) הקיים
// (אותו מיון-לפי-לבבות-מוצגים שכבר משמש את סקשן "סקשנים ועיגונים"). כפתור "עיגון מיקומים ←" מפנה
// לכרטיס העסק המוביל ברשימה — לא למסך "סקשנים ועיגונים" הגלובלי, כי הוא עדיין לא נבנה כטאב עצמאי.

let heartsSearch = '';
let heartsFilter = 'all';   // 'all' | 'active' | 'expiringWeek' | 'none' | 'zero'
let heartsSort = 'mostShown'; // 'mostShown' | 'mostReal' | 'gap' | 'expiringFirst' | 'least'
let selectedHeartsIds = new Set();
let openHeartsEditId = null; // עסק אחד בכל רגע עם פאנל-עריכה פתוח מתחת לשורה
window.setHeartsFilter = function(v) { heartsFilter = v; renderMain(); };
window.setHeartsSort = function(v) { heartsSort = v; renderMain(); };
window.toggleHeartsSelect = function(id) {
  if (selectedHeartsIds.has(id)) selectedHeartsIds.delete(id); else selectedHeartsIds.add(id);
  renderMain();
};
window.toggleHeartsEdit = function(id) {

window.filterHeartsRows = function(v) {

// אותו דפוס בדיוק כמו refreshBizList/refreshFanList — מרענן רק את שורות-הרשימה כדי לא לאבד
// פוקוס מתיבת החיפוש בכל הקשה (ר' [[feedback_module_scope_onclick]])
function refreshHeartsList() {
  if (activeTab !== HEARTS_KEY) { renderMain(); return; }
  const el = document.getElementById('heartsListRows');
  if (el) el.innerHTML = heartsFilteredSorted().map(b => heartsRowHtml(b)).join('') || `<div class="placeholder-note">אין עסקים תואמים לסינון</div>`;
}
// ספירות הפילים תמיד נגזרות מכלל העסקים המאושרים (לא מוגבלות לחיפוש/סינון פעיל), אותו עיקרון
// כמו bizClassCounts — המספר ליד כל פיל משקף את הכלל האמיתי.
function heartsClassCounts() {
  const approved = MOCK_BUSINESSES.filter(b => b.status === 'approved');
  return {
    all: approved.length,
    active: approved.filter(isLikesOverrideActive).length,
    expiringWeek: approved.filter(b => isLikesOverrideActive(b) && b.likesOverrideUntil && daysLeft(new Date(b.likesOverrideUntil)) <= 7).length,
    none: approved.filter(b => !isLikesOverrideActive(b)).length,
    zero: approved.filter(b => (b.likesOverride ?? b.likes) === 0).length,
  };
}
function heartsFilteredSorted() {
  let items = MOCK_BUSINESSES.filter(b => b.status === 'approved');
  if (heartsFilter === 'active') items = items.filter(isLikesOverrideActive);
  else if (heartsFilter === 'expiringWeek') items = items.filter(b => isLikesOverrideActive(b) && b.likesOverrideUntil && daysLeft(new Date(b.likesOverrideUntil)) <= 7);
  else if (heartsFilter === 'none') items = items.filter(b => !isLikesOverrideActive(b));
  else if (heartsFilter === 'zero') items = items.filter(b => (b.likesOverride ?? b.likes) === 0);
  const q = heartsSearch.trim();
  if (q) items = items.filter(b => b.name.includes(q));
  return items.slice().sort((a, b) => {
    const shownA = a.likesOverride ?? a.likes, shownB = b.likesOverride ?? b.likes;
    if (heartsSort === 'mostReal') return b.likes - a.likes;
    if (heartsSort === 'gap') return Math.abs(shownB - b.likes) - Math.abs(shownA - a.likes);
    if (heartsSort === 'expiringFirst') {
      const da = a.likesOverrideUntil ? new Date(a.likesOverrideUntil) : null, db = b.likesOverrideUntil ? new Date(b.likesOverrideUntil) : null;
      if (!da && !db) return 0; if (!da) return 1; if (!db) return -1;
      return da - db;
    }
    if (heartsSort === 'least') return shownA - shownB;
    return shownB - shownA; // mostShown — ברירת מחדל
  });
}
window.bulkExtendHearts = async function() {
  for (const id of [...selectedHeartsIds]) {
    const b = findBiz(id);
    if (!b || !isLikesOverrideActive(b)) continue;
    const until = new Date(Date.now() + 30 * 86400000).toISOString();
    await applySectionUpdate(id, { likesOverrideUntil: until });
    await logActivity('businesses', id, { type: 'hearts', title: 'תוקף עריכת-לבבות הוארך ב-30 יום', field: 'likesOverrideUntil', before: b.likesOverrideUntil, after: until });
  }
  selectedHeartsIds.clear();
  renderMain();
};
window.bulkRevertHearts = async function() {
  for (const id of [...selectedHeartsIds]) {
    const b = findBiz(id);
    if (!b || !isLikesOverrideActive(b)) continue;
    await window.clearLikesOverride(id);
  }
  selectedHeartsIds.clear();
  renderMain();
};

// מוגבל בכוונה לטאב "עסקים" היחיד מתוך 6 טאבי הדמו (demo-redesign-admin-stats.html) — הוא היחיד

// לא נבנו כלל: אין להם צנרת-איסוף (רק events נכתב, בלי אגרגציה) — בנייתם הייתה מספרים מומצאים.
// עמודת "עדכון אחרון" מהדמו הוחלפה ב"באינדקס מאז" (approvedAt||registeredAt) כי אין שדה updatedAt
// אמיתי לעסק; זה תחליף כן מבחינת המשמעות (זמן-בפועל אמיתי) ולא המצאה. עיגונים מחושבים בזמן-אמת
// מ-state (כבר טעון מ-Firestore, ר' sectionAnchors) — לא שדה שמור בנפרד.
let dataSort = 'clicks'; // 'clicks' | 'likes' | 'anchors' | 'newest'

let dataCategoryFilter = 'all';

function anchoredForBiz(bizId) {
  const counts = {};
  ALL_TABS.forEach(t => {
    (state[t.key] || []).forEach(a => {
      if (a && a.bizId === bizId && !isExpired(a)) counts[t.label] = (counts[t.label] || 0) + 1;
    });
  });
  const total = Object.values(counts).reduce((s, n) => s + n, 0);
  const label = Object.entries(counts).map(([lbl, n]) => lbl.replace(/^\S+\s/, '') + ' ' + n).join(' · ') || '—';
  return { total, label };
}

function dataCenterHtml() {
  const approved = MOCK_BUSINESSES.filter(b => b.status === 'approved');
  const totalClicks = approved.reduce((s, b) => s + (b.clicks || 0), 0);
  const totalHearts = approved.reduce((s, b) => s + (b.likesOverride ?? b.likes ?? 0), 0);
  const q = dataSearch.trim().toLowerCase();
  const filtered = approved.filter(b => {
    if (dataCategoryFilter !== 'all' && b.catKey !== dataCategoryFilter) return false;
    if (q) {
      const catLabel = (CATEGORIES.find(c => c.key === b.catKey) || {}).label || '';
      if (!b.name.toLowerCase().includes(q) && !catLabel.toLowerCase().includes(q)) return false;
    }
    return true;
  });
  const rows = filtered.map(b => ({ b, anchors: anchoredForBiz(b.id) })).sort((x, y) => {
    if (dataSort === 'likes') return (y.b.likesOverride ?? y.b.likes ?? 0) - (x.b.likesOverride ?? x.b.likes ?? 0);
    if (dataSort === 'anchors') return y.anchors.total - x.anchors.total;
    if (dataSort === 'newest') return y.b.registeredAt - x.b.registeredAt;
    return (y.b.clicks || 0) - (x.b.clicks || 0);
  });
  return `
    <div class="msg-content-head">
      <div style="flex:1;min-width:230px">
        <div class="msg-crumb"><a onclick="selectTab('${HOME_KEY}')">← מרכז המשימות</a><span>/</span><span>מרכז נתונים</span></div>
        <div class="msg-page-title">מרכז נתונים</div>
      </div>
      <div class="msg-kpis">
        <div><div class="msg-kpi-num">${approved.length}</div><div class="msg-kpi-label">עסקים באינדקס</div></div>

const LANDING_SIZE_LABEL = { small: 'קטן', medium: 'בינוני', large: 'גדול' };
const LANDING_BLOCK_FIELDS = {

  tiles: ['tilesPerRow', 'tileSize', 'tiles'],
  previewBlock: ['previewKicker', 'previewTitle', 'previewSub'],

};
const LANDING_BLOCK_LABELS = { hero: 'כותרת הירו', tiles: 'קוביות תמונה', previewBlock: 'כותרת תצוגה חיה', bizBox: 'ריבוע כחול', finalBox: 'ריבוע צהוב' };
const LANDING_FIELD_MAP = {
  heroTitle:     { input: 'lctInHeroTitle',     preview: 'lctPvHeroTitle' },
  heroSlogan:    { input: 'lctInHeroSlogan',    preview: 'lctPvHeroSlogan' },

  finalBtn2:     { input: 'lctInFinalBtn2',     preview: 'lctPvFinalBtn2' },
};

let landingLiveDoc = null;       // raw settings/landingContent (null = מעולם לא פורסם — LANDING_DEFAULTS הם ה"חי" בפועל)
let landingDraftDoc = null;      // raw settings/landingContentDraft (null = אין טיוטה ממתינה)
let landingWorking = null;       // המצב הנערך כרגע — מתחיל מהטיוטה אם יש, אחרת מהחי. מאותחל פעם אחת ב-maybeInitLandingWorking
let landingSelectedBlock = 'hero';
let landingPanelOpen = true;
let landingDevice = 'desktop';
let landingPendingTileImgIndex = null;
let landingTileUploading = {};   // { [tileIndex]: true } בזמן העלאה אמיתית ל-Storage
let landingSaveTimer = null;
let landingPublishing = false;
let _landingLiveLoaded = false, _landingDraftLoaded = false;

function landingClone(o) { return JSON.parse(JSON.stringify(o)); }
function landingEffectiveLive() { return landingLiveDoc || LANDING_DEFAULTS; }

// אתחול חד-פעמי — לא בכל snapshot, אחרת הד הכתיבה העצמית שלנו לטיוטה (מה-debounce) היה
// דורס את מה שהמנהל מקליד באמצע העריכה.
function maybeInitLandingWorking() {
  if (!_landingLiveLoaded || !_landingDraftLoaded || landingWorking) return;
  landingWorking = landingClone(landingDraftDoc || landingEffectiveLive());
  if (activeTab === LANDING_KEY) renderMain();
}

// שוויון עמוק אמיתי — לא JSON.stringify: Firestore לא מבטיח לשמר סדר שדות במפות בתוך מערך
// (tiles), אז אחרי round-trip לשרת סטרינגיפיקציה-גולמית הראתה "נערך" כוזב על בלוק שלא נגעו בו.
function landingDeepEqual(a, b) {
  if (a === b) return true;
  if (typeof a !== 'object' || typeof b !== 'object' || a === null || b === null) return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  const aKeys = Object.keys(a), bKeys = Object.keys(b);
  if (aKeys.length !== bKeys.length) return false;
  return aKeys.every(k => landingDeepEqual(a[k], b[k]));
}
function landingBlockDirty(key) {
  if (!landingWorking) return false;
  const live = landingEffectiveLive();
  return LANDING_BLOCK_FIELDS[key].some(f => !landingDeepEqual(landingWorking[f], live[f]));
}
function landingHasUnpublished() {
  if (!landingWorking) return false;
  return Object.keys(LANDING_BLOCK_FIELDS).some(landingBlockDirty);
}

function landingRefreshChrome() {
  const bl = document.getElementById('lctBlockList');
  if (bl) bl.innerHTML = landingBlockListHtml();
  const ta = document.getElementById('lctTopActions');
  if (ta) ta.innerHTML = landingTopActionsHtml();
}

function scheduleLandingDraftSave() {
  clearTimeout(landingSaveTimer);
  landingSaveTimer = setTimeout(async () => {
    try {
      if (landingHasUnpublished()) {
        await setDoc(doc(db, 'settings', 'landingContentDraft'), landingWorking);
      } else if (landingDraftDoc) {
        await deleteDoc(doc(db, 'settings', 'landingContentDraft'));
      }
    } catch (e) { console.error('שמירת טיוטת תוכן-נחיתה נכשלה:', e); }
  }, 900);
}

window.selectLandingBlock = function(key) { landingSelectedBlock = key; renderMain(); };
window.toggleLandingPanel = function() { landingPanelOpen = !landingPanelOpen; renderMain(); };
window.setLandingDevice = function(v) { landingDevice = v; renderMain(); };

window.onLandingTextFieldInput = function(key) {
  const cfg = LANDING_FIELD_MAP[key];
  const input = document.getElementById(cfg.input);
  const raw = input.value;
  const val = raw.trim() || LANDING_DEFAULTS[key];
  landingWorking[key] = val;
  const pv = document.getElementById(cfg.preview);
  if (pv) {
    pv.textContent = val;
    if (key === 'heroTitle') pv.classList.toggle('empty', !raw.trim());
  }
  if (key === 'heroTitle') {
    const c = document.getElementById('lctHeroCount');
    if (c) { c.textContent = raw.length + ' / 90 תווים'; c.classList.toggle('warn', raw.length > 70); }
  }
  landingRefreshChrome();
  scheduleLandingDraftSave();
};

window.onLandingCardEdit = function(key, el) {
  const val = el.textContent.trim() || LANDING_DEFAULTS[key];
  landingWorking[key] = val;
  const cfg = LANDING_FIELD_MAP[key];
  if (cfg) {
    const input = document.getElementById(cfg.input);
    if (input) input.value = val;
  }
  landingRefreshChrome();
  scheduleLandingDraftSave();
};

window.onLandingTileTextEdit = function(i, field, el) {
  landingWorking.tiles[i][field] = el.textContent.trim();
  if (field === 'title') {
    const mgmtLabels = document.querySelectorAll('.lct-tile-mgmt-label');
    if (mgmtLabels[i]) {
      const t = landingWorking.tiles[i].title;
      mgmtLabels[i].textContent = t || `קובייה ${i + 1} — ללא כותרת`;
      mgmtLabels[i].classList.toggle('empty', !t);
    }
  }
  landingRefreshChrome();
  scheduleLandingDraftSave();
};

window.startLandingTileImgPick = function(i) {
  landingPendingTileImgIndex = i;
  document.getElementById('lctTileFileInput').click();
};
window.onLandingTileFile = async function(input) {
  const i = landingPendingTileImgIndex;
  const file = input.files && input.files[0];
  input.value = '';
  if (i === null || !file) return;
  landingTileUploading[i] = true;
  renderMain();
  try {
    const compressed = await compressToFile(file, 1280, 0.82, `tile_${i}.webp`);
    const url = await uploadFile(compressed, `landing/tiles/tile_${Date.now()}_${i}.webp`);
    landingWorking.tiles[i].img = url;
    scheduleLandingDraftSave();
  } catch (e) {
    console.error('העלאת תמונת-קובייה נכשלה:', e);
    alert('העלאת התמונה נכשלה — נסו שוב.');
  } finally {
    delete landingTileUploading[i];
    renderMain();
  }
};

window.addLandingTile = function() {
  if (landingWorking.tiles.length >= LANDING_MAX_TILES) return;
  landingWorking.tiles.push({ img: '', title: '', sub: '', pill: '' });
  scheduleLandingDraftSave();
  renderMain();
};
window.removeLandingTile = function(i) {
  if (landingWorking.tiles.length <= 1) return;
  landingWorking.tiles.splice(i, 1);
  scheduleLandingDraftSave();
  renderMain();
};
window.moveLandingTile = function(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= landingWorking.tiles.length) return;
  const tmp = landingWorking.tiles[i]; landingWorking.tiles[i] = landingWorking.tiles[j]; landingWorking.tiles[j] = tmp;
  scheduleLandingDraftSave();
  renderMain();
};
window.onLandingLayoutChange = function() {
  landingWorking.tilesPerRow = parseInt(document.getElementById('lctInTilesPerRow').value, 10);
  landingWorking.tileSize = document.getElementById('lctInTileSize').value;
  scheduleLandingDraftSave();
  renderMain();
};

window.publishLandingContent = async function() {
  if (!landingWorking || landingPublishing || !landingHasUnpublished()) return;
  landingPublishing = true;
  renderMain();
  try {
    const changedBlocks = Object.keys(LANDING_BLOCK_FIELDS).filter(landingBlockDirty).map(k => LANDING_BLOCK_LABELS[k]);
    const payload = landingClone(landingWorking);
    payload.updatedAt = serverTimestamp();
    payload.updatedBy = CURRENT_ADMIN.name;
    await setDoc(doc(db, 'settings', 'landingContent'), payload);
    await deleteDoc(doc(db, 'settings', 'landingContentDraft')).catch(() => {});
    await logActivity('settings', 'landingContent', {
      type: 'landingPublish',
      title: 'פורסם תוכן חדש לדף הנחיתה',
      detail: changedBlocks.length ? changedBlocks.join(', ') : 'ללא שינוי בבלוקים',
      source: 'admin',
    });
  } catch (e) {
    console.error('פרסום תוכן דף הנחיתה נכשל:', e);
    alert('הפרסום נכשל — נסו שוב.');
  } finally {
    landingPublishing = false;
    renderMain();
  }
};

window.discardLandingChanges = async function() {
  if (!landingHasUnpublished()) return;
  if (!confirm('לבטל את כל השינויים שלא פורסמו ולחזור למה שחי היום?')) return;
  clearTimeout(landingSaveTimer);
  landingWorking = landingClone(landingEffectiveLive());
  try { await deleteDoc(doc(db, 'settings', 'landingContentDraft')); } catch (e) { console.error(e); }
  renderMain();
};

function bizFormSummaryHtml(b) {
  const catMeta = CATEGORIES.find(c => c.key === b.catKey);
  const types = b.bizTypes || [];
  const typeLabels = types.map(t => BIZ_TYPE_LABELS_MOCK[t]).filter(Boolean).join(' · ') || '';
  const field = (label, value, empty, full) => `
    <div class="form-field${full ? ' full' : ''}" data-empty="${!!empty}">

    .concat(b.additionalDiscounts || []).filter(d => d && d.text);
  const discountsHtml = allDiscounts.length ? allDiscounts.map((d, i) => `
    <div class="form-discount-box">

    ? `<div class="form-field full" data-empty="false"><div class="form-field-label">סניפים · ${b.branches.length}</div><div class="form-field-val">${b.branches.map(br=>esc([br.city,br.address].filter(Boolean).join(' · '))).join('<br>')}</div></div>` : '';
  const regionsHtml = (b.regions && b.regions.length)
    ? `<div class="form-field full" data-empty="false"><div class="form-field-label">אזורי פעילות</div><div class="form-field-val">${esc(b.regions.join(', '))}</div></div>` : '';
  return `

          ${field('קטגוריה', catMeta?catMeta.label:'', !catMeta)}

        <div class="form-discounts">${discountsHtml}</div>

        <div class="form-sec-title">שלב 4 · תמונות</div>
        <div class="form-grid">
          ${field('תמונה מייצגת', b.coverPhoto?'הועלתה':'', !b.coverPhoto)}
