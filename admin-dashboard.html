        ${resendBtn}
        <button class="act-btn tiny" title="מוריד את התקלה הזו מהמסך ושומר אותה תחת &quot;טופלו&quot;. תקלה חדשה על אותו נמען עדיין תופיע." onclick="event.stopPropagation();markMailIssueHandled('${x.kind}','${x.id}','${escJsAttr(x.key)}','${escJsAttr(x.badge)}','${escJsAttr(x.name)}')">✔️ טיפלתי</button>
      </div>
    </div>`;
}

// הקובייה "תקלות מייל" פעילה — אז גוף-הטבלה הוא רשימת-התקלות, לא רשימת-המשימות המאוחדת
// §356 — ⚠️ **ששת ה-Active() האלה נשארו בשמם ובמשמעותם** ורק מקור-האמת שלהם השתנה: הם
// שואלים עכשיו את תת-הבורר במקום את הקובייה. כך כל מקומות-הקריאה הקיימים (רינדור, גארדים
// של onSnapshot, טעינה עצלנית) המשיכו לעבוד בלי לגעת בהם.
function issuesActive() { return taskClassFilter === 'issues'; }
function mailIssuesActive() { return issuesActive() && taskIssueKind === 'mail'; }
function handledActive() { return taskClassFilter === 'handled'; }

// ── ארכיון "בקשות שטופלו" (2026-08-16) ───────────────────────────────────────────────────────
// שני מקורות, שניהם שדות על מסמך העסק/החבר עצמו (בלי אוסף חדש, בלי שינוי firestore.rules):
//   requestsHandledLog[] — סגירה ידנית של בקשות ("טופל מבחוץ", ר' markRequestsHandledExternally)
//   mailIssueHandled     — תקלת מייל שסומנה "טיפלתי" (ר' markMailIssueHandled)
function handledItemsList() {
  const out = [];
  for (const b of MOCK_BUSINESSES) {
    (b.requestsHandledLog || []).forEach(h => out.push({
      type: 'request', kind: 'biz', id: b.id, name: b.name,
      at: h.at ? new Date(h.at) : null, summary: h.summary || '', note: h.note || '',
    }));
    // §215 — שגיאות-שמירה בדשבורד העסק שסומנו "טיפלתי" נכנסות לאותו ארכיון
    (b.writeErrorsHandled || []).forEach(h => h && h.key && out.push({
      type: 'bizError', kind: 'biz', id: b.id, name: b.name,
      at: h.at ? new Date(h.at) : null,
      summary: `שגיאת שמירה בדשבורד — ${h.code || ''}`, note: h.note || '',
    }));
    // §252 — מוצג רק כשהסימון עדיין *מכסה* את כל מה שחסר היום (cardGapsAcceptedFor). אם נפתח חסר
    // חדש, העסק כבר חזר לרשימה הראשית — ואז אסור שהוא יופיע גם כאן כאילו הוא סגור.
    // גם התנאי "עדיין באמת חסר משהו": עסק שהשלים בינתיים את השדה הוא פשוט כרטיס מלא —
    // אין סיבה שימשיך להופיע בארכיון כפריט שנסגר ידנית.
    const gapsAcc = missingFieldsFor(b).length ? cardGapsAcceptedFor(b) : null;
    if (gapsAcc) out.push({
      type: 'cardGaps', kind: 'biz', id: b.id, name: b.name,
      at: gapsAcc.at ? new Date(gapsAcc.at) : null,
      summary: `כרטיס חסר — אושר להישאר כך (${(gapsAcc.fields || []).join(', ')})`, note: '',
    });
    if (b.mailIssueHandled && b.mailIssueHandled.key) out.push({
      type: 'mail', kind: 'biz', id: b.id, name: b.name,
      at: b.mailIssueHandled.at ? new Date(b.mailIssueHandled.at) : null,
      summary: b.mailIssueHandled.badge || 'תקלת מייל', note: b.mailIssueHandled.note || '',
    });
  }
  for (const f of MOCK_FANS) {
    if (f.mailIssueHandled && f.mailIssueHandled.key) out.push({
      type: 'mail', kind: 'fan', id: f.id, name: f.name,
      at: f.mailIssueHandled.at ? new Date(f.mailIssueHandled.at) : null,
      summary: f.mailIssueHandled.badge || 'תקלת מייל', note: f.mailIssueHandled.note || '',
    });
  }
  // ── §355 — הסגירות שאין להן ישות ────────────────────────────────────────────────────
  // תקלת-הרשמה ותקלת-כניסה נגזרות מאירוע ולא מרשומת עסק/אוהד, ולכן הסימון שלהן יושב
  // במסמך settings ולא על ישות. עד היום הן פשוט **לא הגיעו לארכיון בכלל** — מה שהיה בסדר
  // כל עוד השורה נשארה גלויה במקומה, והופך לאיבוד-מידע ברגע שהיא יורדת מהמסך (ר'
  // regIssueFilteredList/loginFailOpenList). ⚠️ אין להן id של ישות, ולכן כפתור "פתיחת
  // כרטיס" **אסור** שיירונדר להן — כפתור מת גרוע מכפתור חסר (§302).
  const settingsArchive = (map, type, fallbackLabel) => {
    Object.entries(map || {}).forEach(([key, h]) => {
      if (!h) return;
      out.push({
        type, kind: '', id: '', name: h.title || key,
        at: h.at ? new Date(h.at) : null,
        summary: fallbackLabel, note: h.note || '', settingsKey: key,
      });
    });
  };
  settingsArchive(handledRegIssues, 'regIssue', 'תקלת הרשמה');
  settingsArchive(handledLoginIssues, 'loginIssue', 'תקלת כניסה');
  return out.sort((a, b) => (b.at ? b.at.getTime() : 0) - (a.at ? a.at.getTime() : 0));
}
function handledFilteredList() {
  let list = handledItemsList();
  if (taskEntityFilter !== 'all') list = list.filter(x => x.kind === taskEntityFilter);
  const q = taskSearchQ.trim();
  if (q) list = list.filter(x => `${x.name} ${x.summary} ${x.note}`.includes(q));
  return list;
}
function handledTableHtml(list) {
  if (!list.length) {
    return `<div class="placeholder-note">עדיין לא נסגרה כאן שום בקשה ידנית. סגירה ידנית נעשית מתוך כרטיס העסק — "שיפוט מהיר" → "טופל מבחוץ", מ"תקלות מייל"/"תקלות הרשמה"/"תקלות כניסה" → "✔️ טיפלתי", או מקוביית "כרטיס חסר באינדקס" → "✔️ טופל".</div>`;
  }
  return `
    <div class="mail-issues-note">ארכיון בלבד — פריטים שנסגרו ידנית ולא ע"י אישור/דחייה במערכת. בקשה חדשה מאותו עסק תיפתח כרגיל ברשימה הראשית.</div>
    <div class="task-table mail-issues">${list.map(x => `

          x.type === 'mail' ? 'תקלת מייל — טופלה'

          : x.type === 'regIssue' ? 'תקלת הרשמה — טופלה'
          : x.type === 'loginIssue' ? 'תקלת כניסה — טופלה'
          : 'בקשה — טופלה מבחוץ'}</span></div>
        <div class="mi-addr"></div>
        <div class="task-table-wait">${x.at ? agoLabel(x.at) : '—'}</div>
        <div class="mi-actions">
          <!-- §355 — הכפתור מותנה בקיום מזהה-ישות: לתקלת הרשמה/כניסה אין כרטיס לפתוח,
               ו-selectTask2 עם מזהה ריק היה פותח מגירה ריקה. כפתור מת גרוע מכפתור חסר. -->
          ${x.id ? `<button class="act-btn tiny" onclick="selectTask2('${x.kind}','${x.id}')">${x.kind === 'biz' ? 'פתיחת כרטיס העסק' : 'פתיחת כרטיס האוהד'}</button>` : ''}
          ${x.type === 'mail' ? `<button class="act-btn tiny" onclick="unmarkMailIssueHandled('${x.kind}','${x.id}')">↩️ החזרה לטיפול</button>` : ''}
          ${x.type === 'cardGaps' ? `<button class="act-btn tiny" onclick="reopenCardGaps('${x.id}')">↩️ החזרה לטיפול</button>` : ''}
          ${x.type === 'regIssue' ? `<button class="act-btn tiny" onclick="unmarkRegIssueHandled('${esc(x.settingsKey)}')">↩️ החזרה לטיפול</button>` : ''}
          ${x.type === 'loginIssue' ? `<button class="act-btn tiny" onclick="unmarkLoginIssueHandled('${esc(x.settingsKey)}')">↩️ החזרה לטיפול</button>` : ''}
        </div>
      </div>`).join('')}</div>`;
}

// ── "תקלות בדשבורד עסק" (2026-08-17, §215) ──────────────────────────────────────────────────
// המקור: writeErrors[] על מסמך העסק, שנכתב ע"י ה-Worker (/log-biz-error) כשכתיבה מהדשבורד של
// בעל-העסק נכשלה. למה דרך ה-Worker ולא ישירות: כשהכתיבה נכשלת בעל-העסק לרוב לא יכול לכתוב
// כלום — זו בדיוק התקלה. עד שזה נבנה, שני עסקים ביום אחד נתקעו ואיש לא ידע עד שהם התלוננו.
//
// ⚠️ זו לא "משימה" — אין מה לאשר/לדחות. מה שיש: לראות איזה קוד-שגיאה באמת חזר, לזהות דפוס
// (אותו קוד אצל כמה עסקים = באג אצלנו, קוד בודד = תקלה מקומית), ולסמן "טיפלתי" כשנסגר.
const BIZ_ERROR_ACTION_LABELS = {
  submitChanges: 'שליחת שינויים לאישור',
  saveMedia: 'שמירת תמונות',
  acceptTerms: 'אישור תנאים',
  clearNote: 'ניקוי הודעה',
  ackNote: 'סימון הודעה כנקראה',
};
// חתימת התקלה הבודדת — bizId + חותמת-הזמן המדויקת שנרשמה. יציבה בין רינדורים, ולא מתנגשת בין
// שתי שגיאות של אותו עסק, בדיוק כמו mailIssueKey.
function bizWriteErrorKey(bizId, at) { return `${bizId}|${at || ''}`; }
function bizWriteErrorList() {
  const out = [];
  for (const b of MOCK_BUSINESSES) {
    const handled = new Set((b.writeErrorsHandled || []).map(h => h && h.key).filter(Boolean));
    (b.writeErrors || []).forEach(err => {
      if (!err) return;
      const key = bizWriteErrorKey(b.id, err.at);
      if (handled.has(key)) return;
      out.push({
        id: b.id, name: b.name, key,
        at: err.at ? new Date(err.at) : null,
        action: BIZ_ERROR_ACTION_LABELS[err.action] || err.action || 'פעולה לא ידועה',
        code: err.code || 'unknown',
        message: err.message || '',
        detail: err.detail || '',
        ownerPhone: b.ownerPhone || '', ownerFirst: b.ownerFirst || '', accessToken: b.accessToken || '',
      });
    });
  }
  return out.sort((a, b) => (b.at ? b.at.getTime() : 0) - (a.at ? a.at.getTime() : 0));
}
function bizErrorsActive() { return issuesActive() && taskIssueKind === 'bizErrors'; }
function bizErrorFilteredList() {
  let list = bizWriteErrorList();
  if (taskEntityFilter === 'fan') list = [];   // תקלות דשבורד שייכות לעסקים בלבד
  const q = taskSearchQ.trim();
  if (q) list = list.filter(x => `${x.name} ${x.code} ${x.action}`.includes(q));
  return list;
}
function bizErrorsTableHtml(list) {
  if (!list.length) {
    return `<div class="placeholder-note">אף בעל עסק לא נתקל בשגיאת שמירה 🎉 כל כשל כזה נרשם כאן אוטומטית עם קוד השגיאה האמיתי — בלי להמתין לתלונה.</div>`;
  }
  // ריכוז לפי קוד — אותו קוד אצל כמה עסקים הוא באג אצלנו, לא תקלה מקומית של מישהו
  const byCode = {};
  list.forEach(x => { byCode[x.code] = (byCode[x.code] || 0) + 1; });
  const codeChips = Object.entries(byCode).sort((a, b) => b[1] - a[1])
    .map(([code, n]) => `<span class="warn-badge">${esc(code)} ×${n}</span>`).join(' ');
  return `
    <div class="mail-issues-note">כשל שמירה אמיתי אצל בעל עסק, כפי שדווח מהדפדפן שלו. ${codeChips} — אותו קוד אצל כמה עסקים מצביע על באג אצלנו ולא על תקלה מקומית.</div>
    <div class="task-table mail-issues">${list.map(x => `
      <div class="task-table-row">
        <div class="task-table-main">
          <div class="task-table-name">${esc(x.name)}</div>
          <div class="task-table-meta">${esc(x.action)}${x.message ? ' · ' + esc(x.message.slice(0, 120)) : ''}${x.detail ? ' · ' + esc(x.detail) : ''}</div>
        </div>
        <div class="task-table-badges"><span class="warn-badge">${esc(x.code)}</span></div>
        <div class="mi-addr"></div>
        <div class="task-table-wait">${x.at ? agoLabel(x.at) : '—'}</div>
        <div class="mi-actions">
          <button class="act-btn tiny" onclick="selectTask2('biz','${x.id}')">פתיחת כרטיס העסק</button>
          ${x.ownerPhone ? `<button class="act-btn tiny" onclick="sendBizWA('${x.id}','${x.ownerPhone}','${escJsAttr(x.ownerFirst)}','${escJsAttr(x.name)}','${x.accessToken}')">וואטסאפ לבעל העסק</button>` : ''}
          <button class="act-btn tiny" title="מוריד את התקלה הזו מהמסך ושומר אותה תחת &quot;בקשות שטופלו&quot;. שגיאה חדשה אצל אותו עסק עדיין תופיע." onclick="markBizWriteErrorHandled('${x.id}','${escJsAttr(x.key)}','${escJsAttr(x.code)}','${escJsAttr(x.name)}')">✔️ טיפלתי</button>
        </div>
      </div>`).join('')}</div>`;
}

// ══ תקלות הרשמה (§284) ══════════════════════════════════════════════════════════════════════
// שתי משפחות שונות באותה קובייה, כי שתיהן עונות על אותה שאלה — "מי ניסה להצטרף ומשהו
// לא בסדר בבקשה שלו":
//   1. **הצלבה** בין הצהרות של שני אוהדים. זו הבדיקה האוטומטית האמיתית **היחידה** שיש
//      למערכת: אף מסלול אימות לא נבדק מול רשימת-מנויים של המועדון (אין לנו כזו), אבל
//      התנגשות בין שתי הצהרות היא ראיה מוצקה שלפחות אחת מהן שגויה — ואת זה אפשר לחשב.
//   2. **כשל שליחה בפועל** — אירוע formError שנרשם ברגע שההרשמה נכשלה אצל הנרשם. עד §284
//      כשל כזה היה גלוי רק לנרשם עצמו; מי שלא התלונן פשוט לא היה קיים בשום מקום.
//
// ⚠️ נטישה (פתח את הטופס ולא שלח) **לא** מוצגת כשורה אלא כמשפט-סיכום בלבד: היא מודדת גם
// כל מי שרק הציץ, ולערבב אותה עם כשלים אמיתיים היה מייצר רשימה שאי אפשר לעבוד איתה.

// אותה בדיקת-תקינות כמו בטופס ההרשמה (fan-register.html, subNumberOk) — 29 מ-59 המנויים
// הרשומים הזינו ערך מומצא כשהשדה היה חובה גורפת, והם צריכים להופיע כאן כדי שיהיה אפשר
// לחזור אליהם ולאמת מחדש.
function isJunkSubNumber(n) {
  const s = String(n || '').trim();
  if (!s) return false;
  if (!/^\d+$/.test(s)) return true;
  if (/^(\d)\1*$/.test(s)) return true;
  let asc = true, desc = true;
  for (let i = 1; i < s.length; i++) {
    if (+s[i] !== +s[i - 1] + 1) asc = false;
    if (+s[i] !== +s[i - 1] - 1) desc = false;
  }
  return asc || desc;
}

// מפתח-מושב מלא. חייב שורה **וגם** כיסא — בלעדיהם "שער 7" לבדו משותף למאות אוהדים
// וכל השער היה נספר כהתנגשות אחת ענקית.
function fanSeatKey(f) {
  if (!f.seatRow || !f.seatNumber) return null;
  return [
    f.verifiedSport || '?', f.subscriberSection || '?', f.subscriberTier || '-',
    f.seatArea || '-', f.seatBlock || '-', f.seatRow, f.seatNumber,
  ].join('|');
}

function regClashList() {
  const out = [];
  const bySeat = {}, byNum = {}, byJunk = {};
  MOCK_FANS.forEach(f => {
    if (f.status === 'rejected') return;   // רשומה שנדחתה כבר טופלה — לא תקלה פתוחה
    const sk = fanSeatKey(f);
    if (sk) (bySeat[sk] = bySeat[sk] || []).push(f);
    const n = String(f.subscriberNumber || '').trim();
    if (!n) return;
    if (isJunkSubNumber(n)) (byJunk[n] = byJunk[n] || []).push(f);
    else (byNum[n] = byNum[n] || []).push(f);
  });
  const newest = list => list.map(f => f.registeredAt).filter(Boolean).sort((a, b) => b - a)[0] || null;
  // ── ⚠️ הגנה מפני "מחק את הכפילות" (אירוע אמיתי 2026-08-26) ────────────────────────────────
  // אדיר אילן הופיע פעמיים ברשימה ונראה כמו רישום כפול. הוא **לא**: הוא רשם שני עסקים
  // שונים (גולדה אירועים + שווארמה שמש אירועים) בהפרש 9 דקות, ולכל עסק נוצרה רשומת-חבר
  // משלו — שני העסקים approved וכל אחד מצביע בחזרה על ה-ownerMemberId שלו. מחיקת אחת
  // מהרשומות הייתה מנתקת עסק חי מהבעלים שלו ומשביתה לו את הכניסה לדשבורד.
  // לכן: שתי רשומות עם אותו טלפון + linkedBusinessId שונה מסומנות במפורש כאותו אדם.
  const sameOwnerNote = list => {
    const byPhone = {};
    list.forEach(f => { if (f.phone) (byPhone[f.phone] = byPhone[f.phone] || []).push(f); });
    const multi = Object.values(byPhone).filter(g => g.length > 1
      && new Set(g.map(x => x.linkedBusinessId).filter(Boolean)).size > 1);
    return multi.length
      ? ` ⚠️ ${multi[0][0].name} הוא אותו אדם עם ${multi[0].length} רשומות — אחת לכל עסק שרשם. לא למחוק.`
      : '';
  };
  Object.entries(bySeat).forEach(([k, list]) => {
    if (list.length < 2) return;
    const f = list[0];
    out.push({
      kind: 'seatClash', key: 'seat|' + k, at: newest(list), fans: list,
      title: `${list.length} אוהדים על אותו מושב`,
      detail: `${sectionLabelFor(f.verifiedSport)} ${sectionWithTier(f.subscriberSection, f.subscriberTier) || '—'}${f.seatArea ? ' · אזור ' + f.seatArea : ''}${f.seatBlock ? ' · גוש ' + f.seatBlock : ''} · שורה ${f.seatRow} · כיסא ${f.seatNumber}${sameOwnerNote(list)}`,
      badge: 'התנגשות מושב',
    });
  });
  Object.entries(byNum).forEach(([n, list]) => {
    if (list.length < 2) return;
    out.push({
      kind: 'numberClash', key: 'num|' + n, at: newest(list), fans: list,
      title: `${list.length} אוהדים עם אותו מספר מנוי`,
      detail: `מס' ${n}${sameOwnerNote(list)}`,
      badge: 'מספר מנוי כפול',
    });
  });
  Object.entries(byJunk).forEach(([n, list]) => {
    out.push({
      kind: 'junkNumber', key: 'junk|' + n, at: newest(list), fans: list,
      title: list.length > 1 ? `${list.length} אוהדים עם מספר מנוי מומצא` : 'מספר מנוי מומצא',
      detail: `נשמר "${n}" — כמעט בוודאות לא מספר אמיתי. נרשם לפני שהטופס אפשר לבחור מסלול אימות אחר.${sameOwnerNote(list)}`,
      badge: 'ערך לא אמיתי',
    });
  });
  // §357 — החיבור אל סימוני "טיפלתי". בלעדיו השורות כאן חזרו לרשימה ללא שדה `handled`
  // כלל, ו-`regIssueOpenList` (שמסננת `!x.handled`) השאירה אותן פתוחות לנצח: הכפתור כן
  // כתב ל-`settings/handledRegIssues` והשורה אפילו הופיעה ב"בקשות שטופלו" — אבל המספר
  // בקובייה לא זז. רק `regFailureList` קראה את המפתח, ולכן "טיפלתי" עבד על כשלי-שליחה
  // ולא על הצלבות. החיבור נעשה כאן במקום אחד על כל המפה, ולא בשלושת אתרי-ה-push, כדי
  // שסוג-הצלבה רביעי לא ייוולד שוב עם אותו באג בשקט.
  return out.map(x => ({ ...x, handled: handledRegIssues[x.key] || null }));
}

// ── §296 — פענוח קוד-השגיאה לשפה של מנהל ────────────────────────────────────────────────────
// ה-channel נבנה קצר בכוונה (תקרת 50 תווים ב-firestore.rules), ולכן הוא נראה כמו
// `pu:unauthorized|64k|jpeg`. עד עכשיו הוא הוצג **כמו שהוא**, ומנהל שראה את זה לא ידע אם
// מדובר בבאג אצלנו, בקובץ של הנרשם, או ברשת שלו — כלומר "יש תקלה" בלי מה לעשות איתה.
const UPLOAD_ERR_LABELS = {
  // ⚠️ אחרי §293 `unauthorized` **אינו** מעיד על באג אצלנו. החוק שנשאר בנתיב הזה הוא
  // `isImage() && underSizeLimit()` בלבד, ולכן 403 כאן אומר: הקובץ אינו תמונה (PDF/מסמך
  // שנבחר בטעות) או שהוא מעל 15MB. תווית "באג אצלנו" הייתה שולחת לחפש במקום הלא-נכון —
  // וזה בדיוק מה שקרה לנו בארבעה סבבים.
  unauthorized:            'הקובץ נדחה — כנראה אינו תמונה או מעל 15MB',
  unknown:                 'השרת דחה את ההעלאה',
  'file-too-large':        'הקובץ גדול מדי גם אחרי דחיסה',
  'upload-timeout':        'ההעלאה לא הסתיימה בזמן',
  'download-url-dead':     'הועלה אך הקישור לא נטען',
  canceled:                'ההעלאה בוטלה (סגירת דף?)',
  'retry-limit-exceeded':  'נכשל אחרי 3 ניסיונות',
  'quota-exceeded':        'חריגה ממכסת האחסון',
};
const MEDIA_ERR_LABELS = {
  TimeoutError:      'ההעלאה נתקעה ונקטעה',
  MediaPhaseTimeout: 'ההעלאה נתקעה ונקטעה',
  AbortError:        'ההעלאה נקטעה',
  TypeError:         'הבקשה לא יצאה (רשת/דפדפן)',
};

// מבדיל בין שני דברים שנראו עד היום זהים — וההבדל ביניהם הוא **מה המנהל צריך לעשות**:
//   הרשמה נכשלה   → אין רשומה בכלל. הנרשם איננו. זו התקלה החמורה.
//   התמונה לא עלתה → הרשומה קיימת ותקינה, חסרה רק הראיה. צריך לבקש אותה במייל.
// עד §296 שניהם הוצגו כ"הרשמה נכשלה", כלומר המנהל היה מחפש נרשם שלא קיים — או גרוע מזה,
// מתעלם מרשומה שכן נקלטה כי הניח שהיא אבודה.
function classifyRegError(e) {
  const ch = e.channel || '';
  const isBiz = e.blockId === 'bizForm';
  const who = isBiz ? 'עסק' : 'אוהד';

  // §290 ואילך: `pu:<code>|<KB>k|<type>`. §288 ומטה: `proof-upload:storage/<code>`.
  if (ch.startsWith('pu:') || ch.startsWith('proof-upload:')) {
    const [rawCode, kb, type] = ch.replace(/^pu:|^proof-upload:/, '').replace('storage/', '').split('|');
    const parts = [UPLOAD_ERR_LABELS[rawCode] || rawCode || 'סיבה לא ידועה'];
    if (kb) parts.push(kb.replace(/k$/, '') + 'KB');
    if (type) parts.push(type);
    return {
      kind: 'photoFailed',
      title: `תמונת האימות של ${who} לא עלתה — ההרשמה כן נקלטה`,
      detail: parts.join(' · '),
      badge: 'תמונה חסרה',
    };
  }

  // §294: `bm:<name>` — מדיה של עסק (לוגו/תמונה מייצגת/גלריה/ראיה) דרך ה-Worker.
  if (ch.startsWith('bm:')) {
    const name = ch.slice(3);
    return {
      kind: 'photoFailed',
      title: 'תמונות העסק לא עלו — ההרשמה כן נקלטה',
      detail: MEDIA_ERR_LABELS[name] || name || 'סיבה לא ידועה',
      badge: 'תמונות חסרות',
    };
  }

  return {
    kind: 'failed',
    title: `הרשמת ${who} נכשלה — אין רשומה`,
    detail: ch === 'offline' ? 'לא היה חיבור לאינטרנט אצל הנרשם' : `קוד השגיאה: ${ch || 'לא ידוע'}`,
    // התג הוא תווית-מצב, לא קוד. `permission-denied` בתג לא אומר למנהל כלום שהוא לא כבר
    // רואה בשורת-הפירוט — והוא זה שנקרא ראשון.
    badge: 'הרשמה נכשלה',
  };
}

// ── §302 — "טיפלתי" לשורת תקלה ──────────────────────────────────────────────────────────
// אירועי `events` הם `allow update: if false` — אי אפשר לסמן את האירוע עצמו. הסימון נשמר
// במסמך settings אחד (מנהל בלבד לפי הכלל הכללי `match /settings/{docId}`), לפי מפתח-השורה.
// למה לפי מפתח ולא על רשומת האוהד: כשל שני של אותו אדם הוא תקלה חדשה שצריך לראות שוב.
let handledRegIssues = {};
window.markRegIssueHandled = async function(key, title) {
  const note = prompt(`סימון "${title}" כטופל.\n\nמה נעשה? (אופציונלי)`, '');
  if (note === null) return;
  try {
    await setDoc(doc(db, 'settings', 'handledRegIssues'), {
      // §355 — `title` נשמר יחד עם הסימון, ולא רק ה-note. מרגע שהשורה יורדת מהמסך (ר'
      // regIssueFilteredList) הארכיון הוא המקום היחיד שבו רואים אותה, ומפתח-שורה גולמי
      // ('err|hb_x9k2|1756…') אינו תיאור של כלום. ⚠️ סימונים שנוצרו לפני §355 אינם נושאים
      // אותו, ולכן הארכיון חייב ליפול-לאחור למפתח במקום להציג שורה ריקה.
      [key]: { at: new Date().toISOString(), title: String(title || '').slice(0, 200), note: (note || '').trim(), by: auth.currentUser ? auth.currentUser.uid : '' },
    }, { merge: true });
  } catch (e) { console.error(e); alert('שגיאה: ' + e.message); }
};
window.unmarkRegIssueHandled = async function(key) {
  try {
    await setDoc(doc(db, 'settings', 'handledRegIssues'), { [key]: deleteField() }, { merge: true });
  } catch (e) { console.error(e); alert('שגיאה: ' + e.message); }
};

// ── §355 — "טיפלתי" על תקלת כניסה ────────────────────────────────────────────────────────
// אותו מנגנון בדיוק כמו תקלות ההרשמה, ומאותה סיבה: `events` הוא `allow update: if false`,
// ולכן אי אפשר לסמן את האירוע עצמו והסימון נשמר במסמך settings לפי חתימת-השורה.
// למה לפי חתימה ולא לפי אדם: ניסיון-כניסה שני שנכשל הוא תקלה חדשה שצריך לראות שוב.
let handledLoginIssues = {};
window.markLoginIssueHandled = async function(key, title) {
  const note = prompt('סימון תקלת הכניסה של "' + title + '" כטופלה.' + '\n\n' + 'מה נעשה? (אופציונלי — נשמר ב"בקשות שטופלו")', '');
  if (note === null) return;
  try {
    await setDoc(doc(db, 'settings', 'handledLoginIssues'), {
      [key]: { at: new Date().toISOString(), title: String(title || '').slice(0, 200), note: (note || '').trim(), by: auth.currentUser ? auth.currentUser.uid : '' },
    }, { merge: true });
  } catch (e) { console.error(e); alert('שגיאה: ' + e.message); }
};
window.unmarkLoginIssueHandled = async function(key) {
  try {
    await setDoc(doc(db, 'settings', 'handledLoginIssues'), { [key]: deleteField() }, { merge: true });
  } catch (e) { console.error(e); alert('שגיאה: ' + e.message); }
};

// כשלי-שליחה מתוך collection 'events'. אותו מקור בדיוק של פאנל "פלטפורמה" (§281) —
// נטען פעם אחת ל-30 יום ומשמש את שניהם.
function regFailureList() {
  return (platformEvents || [])
    .filter(e => e.type === 'formError')
    .map(e => {
      const c = classifyRegError(e);
      const key = 'err|' + e.sessionId + '|' + (e.at ? e.at.getTime() : 0);
      // ── §302 — מהאירוע אל האדם ───────────────────────────────────────────────────────
      // עד עכשיו השורה אמרה "מישהו במובייל נכשל ב-05:22" ונעצרה שם. המשתמש: *"אין לי
      // פרטים בתקלות הרשמה בדשבורד"*. הרשומה קיימת אצלנו במלואה — רק לא חיברנו אליה.
      // ⚠️ נפילה-לאחור לאירועים שנרשמו **לפני** §302 ואין להם memberId/bizId: ה-`formSubmit`
      // מאותו סשן כן נושא אותו. בלי זה כל התקלות ההיסטוריות היו נשארות בלי שם לנצח, והתיקון
      // היה מתחיל לעבוד רק מהכשל הבא. אותו סשן = אותה הרשמה, זו הצלבה בטוחה.
      const paired = (e.memberId || e.bizId) ? null
        : (platformEvents || []).find(s => s.type === 'formSubmit' && s.sessionId === e.sessionId && s.blockId === e.blockId);
      const memberId = e.memberId || (paired ? paired.memberId : null);
      const bizId    = e.bizId    || (paired ? paired.bizId    : null);
      const fan = memberId ? MOCK_FANS.find(f => f.id === memberId) : null;
      const biz = bizId ? MOCK_BUSINESSES.find(x => x.id === bizId) : null;
      // ⚠️ מזהה שקיים אך אין לו רשומה = ההרשמה עצמה נכשלה אחרי שהמזהה כבר נוצר (ר' ההערה
      // ב-fan-register). זו מסקנה שונה לגמרי מ"אין מזהה", ולכן היא נאמרת במפורש.
      const missing = (memberId && !fan) ? ' · ⚠️ הרשומה לא נוצרה' : '';
      const who = fan ? `${fan.name}${fan.phone ? ' · ' + fan.phone : ''}`
                : biz ? `${biz.name}${biz.ownerPhone ? ' · ' + biz.ownerPhone : ''}`
                : '';
      const h = handledRegIssues[key];
      return {
        kind: c.kind, key, at: e.at,
        fans: fan ? [{ id: fan.id, name: fan.name, status: fan.status }] : [],
        bizRef: biz ? { id: biz.id, name: biz.name } : null,
        handled: h || null,
        title: c.title,
        detail: `${who ? who + ' · ' : ''}${c.detail} · ${e.device === 'mobile' ? 'מובייל' : 'דסקטופ'}${missing}`,
        badge: c.badge,
      };
    })
    .sort((a, b) => (b.at ? b.at.getTime() : 0) - (a.at ? a.at.getTime() : 0));
}

// כמה פתחו את הטופס ולא שלחו — מוצג כמשפט-סיכום בלבד, ר' ההערה למעלה.
function regAbandonStats() {
  const opened = {}, submitted = new Set();
  (platformEvents || []).forEach(e => {
    if (!e.sessionId) return;
    if (e.type === 'formOpen' && (e.blockId === 'fanRegister' || e.blockId === 'joinModal')) opened[e.sessionId] = true;
    if (e.type === 'formSubmit' && e.blockId === 'fanRegister') submitted.add(e.sessionId);
  });
  const openedIds = Object.keys(opened);
  return { opened: openedIds.length, abandoned: openedIds.filter(s => !submitted.has(s)).length };
}

// ── §304 — משפך ההרשמה: איפה עוזבים ─────────────────────────────────────────────────────
// "72% נטשו" הוא מספר שאי אפשר לפעול לפיו. הצניחה **בין שני שלבים סמוכים** היא כן:
// היא מצביעה על החלק בטופס שעוצר אנשים. נספרים סשנים ייחודיים, לא אירועים — אדם שנגע
// בשדה חמש פעמים הוא עדיין אדם אחד.
// §324 — שני משפכים, מפרט אחד. עד כה הקוד הזה ידע רק את טופס האוהד; business.html קיבל
// אבני-דרך זהות (markStep) ולכן ההיגיון הופרד מהתוכן במקום להיות משוכפל. blockId הוא מה
// שמבדיל בין השניים, וזה בדיוק השדה שכבר עובר בשכבת הטעינה.
const FAN_FUNNEL = {
  title: 'משפך הרשמת האוהדים — איפה עוזבים',
  // joinModal = נפתח מתוך welcome.html; fanRegister = כניסה ישירה לדף ההרשמה
  openBlocks: ['fanRegister', 'joinModal'],
  block: 'fanRegister',
  steps: [
    { key: 'opened',     label: 'פתחו את הטופס' },
    { key: 'identity',   label: 'התחילו למלא פרטים' },
    { key: 'subscriber', label: 'ענו אם הם מנויים' },
    { key: 'route',      label: 'הגיעו לשלב האימות' },
    // §324 — **לא שלב-חובה**: רק חלק ממסלולי-האימות כוללים קובץ בכלל. הדגל מוציא אותו
    // משרשרת הגלגול-לאחור למטה, אחרת המסך טוען שכולם צירפו תמונה.
    { key: 'proof',      label: 'בחרו תמונת אימות', optional: true },
    { key: 'submitted',  label: 'שלחו בפועל' },
  ],
};
// §324 — עד לשינוי הזה היו לטופס העסק רק formOpen ו-formSubmit, ובין 26 פותחים ל-4 שולחים
// (26–29.8) שכבו חמישה שלבים בלי שום מדידה. התוויות זהות לכותרות ב-business.html בכוונה.
const BIZ_FUNNEL = {
  title: 'משפך הרשמת העסקים — איפה עוזבים',
  openBlocks: ['bizForm'],
  block: 'bizForm',
  steps: [
    { key: 'opened',    label: 'פתחו את הטופס' },
    { key: 'start',     label: 'התחילו למלא' },
    { key: 'step2',     label: '2 · פרטים ויצירת קשר' },
    { key: 'step3',     label: '3 · ההטבות' },
    { key: 'step4',     label: '4 · תמונות' },
    { key: 'step5',     label: '5 · אימות ושליחה' },
    { key: 'submitted', label: 'שלחו בפועל' },
  ],
};

function funnelStats(spec) {
  const S = {}; spec.steps.forEach(s => S[s.key] = new Set());
  (platformEvents || []).forEach(e => {
    if (!e.sessionId) return;
    if (e.type === 'formOpen' && spec.openBlocks.includes(e.blockId)) S.opened.add(e.sessionId);
    if (e.type === 'formSubmit' && e.blockId === spec.block) S.submitted.add(e.sessionId);
    if (e.type === 'formStep' && e.blockId === spec.block && S[e.channel]) S[e.channel].add(e.sessionId);
  });
  // ⚠️ סשן ששלח נספר גם בכל השלבים שלפניו, גם אם האירוע עצמו חסר (נרשם לפני §304, או
  // אבד ברשת). בלי זה המשפך היה מציג "שלחו יותר ממה שהגיעו לשלב האימות" — מספר שנראה
  // כמו באג ומאבד את אמון הקורא.
  //
  // 🔴 §324 — הגלגול רץ **רק על שלבי-החובה**. 'proof' אופציונלי (רק חלק ממסלולי-האימות
  // כוללים קובץ), וגלגול לתוכו הציג "בחרו תמונת אימות: 26" בזמן שבפועל **אפס** נרשמים
  // צירפו תמונה — לא רק מספר שגוי, אלא בדיוק ההיפך מהמסקנה הנכונה (מסלול-התמונה אינו
  // בשימוש כלל). נתפס בהרצת הפונקציה מול נתוני-אמת מהפרודקשן, לא בקריאת קוד.
  const chain = spec.steps.filter(s => !s.optional).map(s => s.key);
  for (let i = chain.length - 1; i > 0; i--)
    for (const id of S[chain[i]]) S[chain[i - 1]].add(id);
  // כל שלב מושווה לשלב-**החובה** שלפניו: שלב אופציונלי אינו בסיס-השוואה למי שבא אחריו,
  // אחרת "שלחו בפועל" היה מחולק באפס ברגע שאיש לא צירף תמונה.
  let prevKey = null;
  return spec.steps.map(s => {
    const n = S[s.key].size;
    const prev = prevKey ? S[prevKey].size : n;
    const row = {
      ...s, n,
      dropped: (prevKey && !s.optional) ? prev - n : 0,
      pct: prev ? Math.round(n / prev * 100) : 0,
    };
    if (!s.optional) prevKey = s.key;
    return row;
  });
}

// ── §324 — מאיזה תאריך בכלל קיימות אבני-דרך לטופס הזה ────────────────────────────────────
// **מחושב מהנתונים ולא קבוע קשיח** (בניגוד ל-SUBMIT_MEASURE_START): תאריך קשיח מתיישן
// ברגע שמישהו שוכח לעדכן אותו אחרי פריסה, ואז המשפך משקר בשקט. בלי ההערה הזאת, טופס
// שאבני-הדרך שלו טרם נאספו מציג את **גלגול-האחורה** כאילו כולם הגיעו לשלב האחרון.
function stepMeasureNote(spec) {
  const evs = (platformEvents || []).filter(e => e.type === 'formStep' && e.blockId === spec.block && e.at);
  if (!evs.length) return ' <span class="warn-badge">אבני-הדרך טרם נאספו — רק "פתחו" ו"שלחו" אמיתיים כאן</span>';
  const first  = Math.min(...evs.map(e => e.at.getTime()));
  const oldest = Math.min(...(platformEvents || []).filter(e => e.at).map(e => e.at.getTime()));
  // הפרש של פחות מיממה מקצה-החלון = המדידה קדמה לחלון, ואין מה להעיר
  if (first - oldest < 864e5) return '';
  return ` <span style="opacity:.7">(אבני-הדרך נמדדות מ-${new Date(first).toLocaleDateString('he-IL')})</span>`;
}

function funnelHtml(spec) {
  const rows = funnelStats(spec);
  if (!rows[0].n) return '';
  // השלב עם הצניחה הגדולה ביותר מסומן — הוא התשובה לשאלה "איפה עוזבים".
  const worst = rows.slice(1).reduce((a, b) => (b.dropped > a.dropped ? b : a), rows[1] || rows[0]);
  return `<div class="mail-issues-note" style="line-height:1.9">
    <b>${esc(spec.title)}</b> (30 יום, סשנים ייחודיים)${stepMeasureNote(spec)}<br>
    ${rows.map((r, i) => `${esc(r.label)}: <b>${r.n}</b>${
      !i ? ''
        : r.optional
          ? ` <span style="opacity:.7">(${r.pct}% ממי שהגיע לשלב הקודם — שלב לא-חובה, ולכן אינו נספר כנשירה)</span>`
          : ` <span style="opacity:.7">(${r.pct}% מהשלב הקודם${r.dropped ? `, ${r.dropped} עזבו` : ''})</span>`
    }${(i && r === worst && r.dropped) ? ' <span class="warn-badge">הנשירה הגדולה</span>' : ''}`).join('<br>')}
    <br><span style="opacity:.7">שלב נמדד פעם אחת לכל סשן, בזמן אמת — לא בסגירת הדף (כתיבה ברגע סגירה אינה אמינה, ודווקא אצל מי שסוגר מהר).</span>
  </div>`;
}

function regIssueList() {
  // §302 — מה שטופל יורד לתחתית הרשימה ולא נמחק ממנה. הסתרה מלאה הייתה "מנקה" יפה אבל
  // גם מוחקת את הדרך לבטל סימון שגוי; המונה בקובייה כבר סופר רק את הפתוחים, וזה מה
  // שהמשתמש באמת רצה לנקות.
  return [...regClashList(), ...regFailureList()]
    .sort((a, b) => (a.handled ? 1 : 0) - (b.handled ? 1 : 0)
                 || (b.at ? b.at.getTime() : 0) - (a.at ? a.at.getTime() : 0));
}
function regIssueOpenList() { return regIssueList().filter(x => !x.handled); }

// ══ §303 — פניות עזרה מטופס ההרשמה ══════════════════════════════════════════════════════

// ══ §322 — תקלות כניסה ══════════════════════════════════════════════════════════════════
// נגזר מאירועי `loginFail` (welcome.html). ⚠️ **מה שהקובייה הזאת לא יכולה לתת: מי.**
// האירוע נרשם לפני שההזדהות הצליחה, ולכן memberId הוא כמעט תמיד null — יש לנו את הסיבה

function hbEnvLabel(env) {

    if (p.indexOf('sw-') === 0) return 'מטמון ' + p.slice(3);
    // §359 — 'xN' = כמה כשלי-רשת רצופים קדמו לאירוע. **זו ההבחנה שהייתה חסרה ב-1.9**:
    // באותו יום היו שמונה שורות loginFail, ורק אחת מהן הייתה של אדם שבאמת נשאר בחוץ —
    // השאר נכנסו תוך דקה. בלי המונה שתי המשמעויות נראות שורה זהה, וצריך היה לשחזר ידנית
    // ציר-זמן לכל סשן כדי להבדיל ביניהן. מ-x2 ומעלה זו כמעט תמיד חסימת-רשת אצל האוהד

function loginIssuesActive() { return issuesActive() && taskIssueKind === 'login'; }

// עד עכשיו הכותרת של הקובייה הזאת אמרה במפורש "מה שהיא לא יכולה לתת: מי". עכשיו היא כן:
// welcome.html שולח את הטלפון שהוקלד, וממנו נגזרת גם רשומת החבר עצמה. ⚠️ שלוש הבחנות
// שהשורה חייבת לשמור, כי הן מובילות לשלוש פעולות שונות לגמרי:
//   טלפון + נמצא חבר   → יש למי לחזור, והסטטוס שלו (ממתין/נדחה) לרוב כבר מסביר את הכשל.
//   טלפון בלי חבר      → הוקלד מספר שאינו רשום אצלנו. זו טעות של המקליד, לא באג.
//   בלי טלפון בכלל     → אירוע שנרשם לפני §355, או כשל שקרה **לפני** שהטופס נשלח

// ההשוואה על 9 הספרות האחרונות: 0501234567 / 972-50-1234567 / 050-123-4567 הם אותו אדם,
// ורשומות החברים נשמרו לאורך השנה בשלושת הפורמטים.
function hbPhoneKey(p) {
  const d = String(p || '').replace(/[^0-9]/g, '');
  return d.length >= 9 ? d.slice(-9) : '';
}
function hbFanByPhone(phone) {
  const k = hbPhoneKey(phone);
  if (!k) return null;
  return MOCK_FANS.find(f => hbPhoneKey(f.phone) === k) || null;
}
// חתימת השורה — סשן + חותמת-הזמן המדויקת, אותו דפוס כמו regIssue/mailIssueKey. לפי כשל
// בודד ולא לפי אדם: ניסיון-כניסה שני שנכשל הוא תקלה חדשה שצריך לראות שוב.
function loginIssueKey(sessionId, at) { return 'login|' + (sessionId || '') + '|' + (at ? at.getTime() : 0); }

function loginFailList() {
  return (platformEvents || [])
    .filter(e => e.type === 'loginFail')
    .map(e => ({
      at: e.at,
      reason: e.channel || 'unknown',
      label: hbLoginFailLabel(e.channel),

      // אוהד שטעה/ממתין. ההפרדה הזאת היא מה שהופך את המספר לפעולה במקום לרעש.
      // §350 — **הרשימה הזאת חייבת לגדול יחד עם כל ערוץ חדש.** ערוץ שלא מופיע כאן מסומן
      // אוטומטית "לא תקלה" ונבלע בין טעויות-הקוד — כלומר פיצול שנועד לחשוף באג היה מסתיר

      // §353 — נבדק על **הבסיס** ולא על הערוץ הגולמי, אחרת 'late:' היה עוקף את הרשימה כולה.
      // ⚠️ 'late:badCode' **אינו** תקלה אצלנו: זו טעות של האוהד שהתשובה עליה פשוט איחרה.
      // מה שכן נכנס הוא רק הכשלים שהם שלנו — התקרה הקשיחה וכשלי ההזדהות המאוחרים.

      device: e.device, sessionId: e.sessionId || '', memberId: e.memberId || null,
      // §355 — הטלפון שהוקלד, והחבר שמאחוריו אם יש כזה (ר' ההערה על hbFanByPhone).
      phone: e.phone || null,
      fan: e.phone ? hbFanByPhone(e.phone) : null,

      // נראות כאן שורה זהה, ודורשות שלושה תיקונים שונים. ריק באירועים שנרשמו לפני §338.

// ("טיפלתי לא מפנה את השורה"): רשימה שבה כל מה שנסגר נשאר על המסך חוזרת להיות אותה ערימה

// שטופלו", ומשם אפשר להחזיר אותו לפתוח.
function loginFailOpenList() { return loginFailList().filter(x => !x.handled); }
function loginIssueFilteredList() {
  const q = taskSearchQ.trim();
  let list = loginFailOpenList();
  // §338 — env נכלל בחיפוש כדי שאפשר יהיה לבודד "pwa" או "idb-stuck" בשאילתה אחת.
  // §355 — הטלפון והשם נכללים, כי מעכשיו זו הדרך הטבעית לחפש כאן: אוהד מתקשר, מקלידים
  // את המספר שלו, ורואים מיד אם ומתי הוא נכשל.
  if (q) list = list.filter(x => `${x.label} ${x.reason} ${x.sessionId} ${x.env} ${x.phone || ''} ${x.fan ? x.fan.name : ''}`.includes(q));

}
function loginIssuesTableHtml(list) {
  // אותו דפוס כמו regIssues: האירועים נטענים עצלנית, ולכן אסור להכריז "אין תקלות" לפני שהגיעו.
  if (platformEvents === null && !platformStatsError) loadPlatformStats();
  const pending = platformEvents === null && !platformStatsError;
  if (pending) return `<div class="placeholder-note">טוען ניסיונות-כניסה מ-30 הימים האחרונים…</div>`;
  if (platformStatsError) return `<div class="mail-issues-note">⚠️ טעינת המדידה נכשלה (${esc(platformStatsError)}) — אי אפשר להציג תקלות כניסה.<div style="margin-top:8px"><button class="act-btn tiny" onclick="retryPlatformStats()">נסה שוב</button></div></div>`;
  if (!list.length) {
    return `<div class="placeholder-note">אף ניסיון כניסה לא נכשל ב-30 הימים האחרונים 🎉</div>`;
  }
  // סיכום לפי סיבה — לפני השורות. עשרות שורות "קוד שגוי" הן רעש; "3 מהן פסק-זמן" היא הידיעה.
  const byReason = {};
  list.forEach(x => { byReason[x.reason] = (byReason[x.reason] || 0) + 1; });
  const chips = Object.entries(byReason)
    .sort((a, b) => b[1] - a[1])
    // §353 — אותה רשימה בדיוק כמו `ours` בשורות (ר' ההערה על HB_LOGIN_FAIL_OURS). לפני כן
    // זו הייתה רשימה שנייה ועצמאית, שכבר פספסה את fetchTimeout/authTimeout של §350.
    .map(([r, n]) => `<span class="${HB_LOGIN_FAIL_OURS.includes(hbLoginFailBase(r)) ? 'warn-badge' : 'treat-badge'}">${esc(hbLoginFailLabel(r))} ${n}</span>`)
    .join('');
  const oursCount = list.filter(x => x.ours).length;
  const withPhone = list.filter(x => x.phone).length;
  return `
    <div class="mail-issues-note">
      ניסיונות כניסה שנכשלו ב-30 הימים האחרונים.
      ${oursCount
        ? `<b>⚠️ ${oursCount} מהם תקלה אצלנו ולא טעות של האוהד</b> — פסק-זמן או דף שלא נטען.`
        : 'כולם טעויות קוד/טלפון או המתנה לאישור — אף אחד מהם אינו תקלה אצלנו.'}
      <div class="class-tile-chips" style="margin-top:8px">${chips}</div>
      <div style="margin-top:8px;opacity:.8">${
        // §355 — המשפט הזה אמר עד עכשיו "אין כאן שמות". עכשיו יש, אבל **רק מ-§355 והלאה**:
        // אירועים ישנים נרשמו בלי טלפון וימשיכו להופיע בלי, ולכן ההסבר נגזר מהנתונים בפועל
        // ולא נכתב כקביעה. שורה בלי טלפון היא כשל שקרה לפני שהטופס בכלל נשלח (moduleTimeout).
        withPhone
          ? `${withPhone} מתוך ${list.length} השורות נושאות את הטלפון שהוקלד — אפשר לחזור אליהם ישירות.${list.length - withPhone ? ' בשאר אין טלפון: או שהכשל קרה לפני שהטופס נשלח, או שהאירוע נרשם לפני שהמדידה הזאת נוספה.' : ''}`
          : 'אין כאן טלפונים: כל השורות נרשמו לפני שהמדידה הזאת נוספה, או שהכשל קרה עוד לפני שהטופס נשלח. מי שהשאיר פרטים מופיע ב"פניות עזרה".'
      }</div>
    </div>
    <div class="task-table mail-issues">${list.slice(0, 200).map(x => `
      <div class="task-table-row">
        <div class="task-table-main">
          <!-- §355 — **מי קודם למה.** כל עוד השורה נפתחה בסיבה ("פסק-זמן"), התקלות נראו
               כמו לוג-שרת ולא כמו אנשים שממתינים לשיחה. הטלפון הוא הפעולה, הסיבה היא ההסבר. -->
          <div class="task-table-name">${
            x.fan ? esc(x.fan.name) : x.phone ? esc(x.phone) : 'לא מזוהה'
          }${x.phone && x.fan ? ` · <span style="font-weight:600;direction:ltr;display:inline-block">${esc(x.phone)}</span>` : ''}</div>
          <div class="task-table-meta">${esc(x.label)}${
            // ⚠️ סטטוס שאינו "מאושר" הוא לרוב **ההסבר עצמו** לכשל ולא נתון-לוואי: אוהד
            // שממתין לאישור ונכשל ב-'pending' אינו תקלה אלא תור שתלוי בנו.
            x.fan && x.fan.status && x.fan.status !== 'approved'
              ? ' · ⚠️ הרשומה שלו ' + (x.fan.status === 'pending' ? 'ממתינה לאישור' : 'נדחתה') : ''
          }${x.phone && !x.fan ? ' · ⚠️ המספר הזה לא רשום אצלנו' : ''}</div>
          <div class="task-table-meta" style="opacity:.75">${
            [x.device === 'mobile' ? 'מובייל' : 'דסקטופ',
             // §338 — הסביבה קודמת לסשן: בכשל 'timeout'/'moduleTimeout' זו השורה שאומרת
             // אם המכשיר הזה בכלל הריץ קוד עדכני, ולכן היא המידע הראשון שרוצים לראות.
             x.env ? hbEnvLabel(x.env) : '',
             x.memberId ? 'חבר: ' + x.memberId : '',
             'סשן: ' + x.sessionId.slice(0, 18),
            ].filter(Boolean).map(esc).join(' · ')
          }</div>
        </div>
        <div class="task-table-badges"><span class="${x.ours ? 'warn-badge' : 'treat-badge'}">${x.ours ? 'תקלה אצלנו' : 'לא תקלה'}</span></div>
        <div class="mi-addr"></div>
        <!-- §355 — חתימת-זמן ולא "היום": כל הכשלים של היום-ואתמול נראו כאן שורה זהה, ודווקא
             בהם צריך להצליב מול שעת-פריסה או מול שיחה עם האוהד. -->
        <div class="task-table-wait">${agoTimeLabel(x.at)}</div>
        <div class="mi-actions">
          ${x.fan ? `<button class="act-btn tiny" onclick="selectTask2('fan','${x.fan.id}')">פתיחת ${esc(x.fan.name)}</button>` : ''}
          <button class="act-btn approve tiny" onclick="markLoginIssueHandled('${esc(x.key)}','${escJsAttr((x.fan ? x.fan.name + ' · ' : '') + (x.phone || x.label))}')">✔️ טיפלתי</button>
        </div>
      </div>`).join('')}
    </div>
    ${list.length > 200 ? `<div class="mail-issues-note">מוצגות 200 השורות האחרונות מתוך ${list.length}.</div>` : ''}`;
}

function regIssuesActive() { return issuesActive() && taskIssueKind === 'reg'; }
function regIssueFilteredList() {
  // §355 — **שורה שסומנה "טיפלתי" יורדת מהמסך.** §302 השאיר אותה ברשימה כדי שאפשר יהיה
  // לבטל את הסימון, והתוצאה הייתה שהכפתור לא ניקה כלום: המשתמש דיווח *"טיפלתי לא מפנה
  // את השורה"*. הביטול לא אבד — הוא עבר לקוביית "בקשות שטופלו", יחד עם כל שאר הסגירות
  // הידניות במערכת, במקום להישאר תלוי על השורה שהוא אמור להעלים.
  let list = regIssueOpenList();
  // §296 — 'photoFailed' נוסף ליד 'failed'. בלי זה כשלי-תמונה היו נעלמים בשקט בסינון הזה,
  // כלומר בדיוק הדבר שהמשתמש ביקש לראות היה מוסתר ע"י סינון שנראה תמים.
  if (taskEntityFilter === 'biz') list = list.filter(x => x.kind === 'failed' || x.kind === 'photoFailed');
  const q = taskSearchQ.trim();
  if (q) list = list.filter(x => `${x.title} ${x.detail} ${x.fans.map(f => f.name).join(' ')}`.includes(q));
  return list;
}

function regIssuesTableHtml(list) {
  // האירועים נטענים עצלנית (אותה קריאה של פאנל "פלטפורמה") — עד שהם מגיעים מוצגות
  // ההצלבות בלבד, עם אמירה מפורשת שחלק מהנתונים עוד בדרך.
  if (platformEvents === null && !platformStatsError) loadPlatformStats();
  const ab = regAbandonStats();
  const loadingNote = platformEvents === null && !platformStatsError
    ? '<div class="mail-issues-note">טוען כשלי-שליחה מתוך המדידה… ההצלבות למטה כבר מלאות.</div>'
    : platformStatsError
      ? `<div class="mail-issues-note">⚠️ טעינת המדידה נכשלה (${esc(platformStatsError)}) — מוצגות הצלבות בלבד.<div style="margin-top:8px"><button class="act-btn tiny" onclick="retryPlatformStats()">נסה שוב</button></div></div>`
      // §304 — המשפט "X נטשו" נשאר כסיכום, ומתחתיו המשפך שאומר **איפה** הם עזבו.
      // "72% נטשו" הוא מספר שאי אפשר לפעול לפיו; הצניחה בין שני שלבים סמוכים כן.
      : `<div class="mail-issues-note">הצלבה אוטומטית בין הצהרות האוהדים + כשלי שליחה אמיתיים מ-30 הימים האחרונים.${
          ab.opened ? ` בנוסף: ${ab.opened} פתחו את טופס ההרשמה ו-${ab.abandoned} מהם לא שלחו — נטישה, לא בהכרח תקלה, ולכן לא מופיעה כשורות.` : ''
        }</div>`;
  // §365 — המשפכים נפרדו מ-loadingNote ועברו אחרי השורות, מקופלים. ⚠️ הם עדיין מוצגים
  // גם כשאין אף תקלה — שם הם התוכן היחיד, ואין מה להסתיר מאחוריו.
  const funnels = (platformEvents === null || platformStatsError) ? '' :
    `<details style="margin-top:14px">
       <summary style="cursor:pointer;font-size:12px;font-weight:800;color:var(--text-sm);padding:6px 0">
         📉 משפכי הנטישה — איפה עוזבים בטופס (${ab.opened} פתחו, ${ab.abandoned} לא שלחו)
       </summary>
       ${funnelHtml(FAN_FUNNEL)}${funnelHtml(BIZ_FUNNEL)}
     </details>`;
  if (!list.length) {
    // §296 — "אין תקלות 🎉" רק כשבאמת בדקנו. כשהאירועים עוד בדרך זו הכרזה שאין לה כיסוי.
    return `${loadingNote}<div class="placeholder-note">${
      platformEvents === null && !platformStatsError
        ? 'ההצלבות נקיות. כשלי-השליחה מ-30 הימים האחרונים עדיין נטענים…'
        : 'אין תקלות הרשמה 🎉 אין שני אוהדים על אותו מושב, אין מספר מנוי כפול או מומצא, אף הרשמה לא נכשלה ואף תמונה לא אבדה בדרך.'
    }</div>${funnels}`;
  }
  // §365 — סדר: הודעה קצרה → **השורות** → המשפכים המקופלים. מי שנכנס מקוביית התקלות
  // רוצה לראות מה לטפל בו, לא אחוזי-נטישה.
  return `
    ${loadingNote}
    <div class="task-table mail-issues">${list.map(x => `
      <div class="task-table-row">
        <div class="task-table-main">
          <div class="task-table-name">${esc(x.title)}</div>
          <div class="task-table-meta">${esc(x.detail)}${
            x.fans.length ? ' · ' + x.fans.map(f => esc(f.name) + (f.status === 'pending' ? ' (ממתין)' : '')).join(' · ') : ''
          }</div>
        </div>
        <!-- §355 — הרשימה כאן היא **פתוחים בלבד** (regIssueOpenList), ולכן הענף "טופל"
             שהיה כאן הוא קוד מת. הסגירות עברו לקוביית "בקשות שטופלו", ומשם גם מבטלים. -->
        <div class="task-table-badges"><span class="warn-badge">${esc(x.badge)}</span></div>
        <div class="mi-addr"></div>
        <div class="task-table-wait">${x.at ? agoLabel(x.at) : '—'}</div>
        <!-- §302 — פעולות בשורה: פתיחת הכרטיס של מי שנכשל, וסימון "טיפלתי".
             המשתמש: *"תן לי אופציה לסמן טיפלתי או לפתוח כרטיס עסק כדי לנקות שם את מה שיש"*.
             הכפתור מוצג רק כשבאמת יש למי לפתוח — כפתור מת גרוע מכפתור חסר. -->
        <div class="mi-actions">
          ${x.fans.map(f => `<button class="act-btn tiny" onclick="selectTask2('fan','${f.id}')">פתיחת ${esc(f.name)}</button>`).join('')}
          ${x.bizRef ? `<button class="act-btn tiny" onclick="selectTask2('biz','${x.bizRef.id}')">פתיחת ${esc(x.bizRef.name)}</button>` : ''}
          <button class="act-btn approve tiny" onclick="markRegIssueHandled('${esc(x.key)}','${escJsAttr(x.title)}')">✔️ טיפלתי</button>
        </div>
      </div>`).join('')}</div>${funnels}`;
}

window.markBizWriteErrorHandled = async function(id, key, code, name) {
  const note = prompt(`סימון שגיאת השמירה של "${name}" כטופלה.\n\n(${code})\n\nאיך זה טופל? (אופציונלי — נשמר ב"בקשות שטופלו")`, '');
  if (note === null) return;
  try {
    // arrayUnion לא מקבל serverTimestamp() בתוך אובייקט — ISO string, בכוונה (כמו requestsHandledLog)
    await updateDoc(doc(db, 'businesses', id), {
      writeErrorsHandled: arrayUnion({
        key, code, at: new Date().toISOString(),
        note: (note || '').trim(), by: auth.currentUser ? auth.currentUser.uid : '',
      }),
    });
    await logActivity('businesses', id, {
      type: 'changeDecision', title: 'שגיאת שמירה בדשבורד סומנה כטופלה',
      detail: code + ((note || '').trim() ? ` — ${note.trim()}` : ''),
      field: 'writeErrorsHandled', before: null, after: key,
    });
  } catch (e) { console.error(e); alert('שגיאה: ' + e.message); }
};

// אותם שני מסנני-רוחב של מרכז המשימות (חיפוש + עסקים/אוהדים) חלים גם כאן. המיונים/התקופה/
// הקטגוריה לא רלוונטיים לתקלה — המיון כאן תמיד לפי חומרה, וזה מכוון.
function mailFilteredList() {
  let list = mailIssueList();
  if (taskEntityFilter !== 'all') list = list.filter(x => x.kind === taskEntityFilter);
  const q = taskSearchQ.trim();
  if (q) list = list.filter(x => `${x.name} ${x.email}`.includes(q));
  return list;
}

function mailIssuesTableHtml(list) {
  if (!list.length) {
    return `<div class="placeholder-note">אין תקלות מייל פתוחות 🎉 כל מי שאושר קיבל את המייל שלו לכתובת תקינה.</div>`;
  }
  return `
    <div class="mail-issues-note">מייל שנשלח לדומיין שגוי מסומן אצלנו "נשלח" ולעולם לא מגיע — לכן הוא מופיע כאן ולא בשום מסך אחר. "שליחה חוזרת" מחזירה את הנמען לתור, והמייל יוצא תוך דקה.</div>
    <div class="task-table mail-issues">${list.map(mailIssueRowHtml).join('')}</div>`;
}

// שליחה חוזרת — פשוט מחזיר את הנמען ל-'pending'; ה-cron של ה-Worker (כל דקה) שולח בפועל,
// בדיוק כמו באישור רגיל. לא נוגע בסטטוס האישור עצמו — אין צורך לבטל-ולאשר מחדש.
window.requeueBizEmail = async function(id) {
  const b = findBiz(id);
  if (!b) return;
  if (b.status !== 'approved') { alert('אפשר לשלוח שוב רק לעסק מאושר.'); return; }
  if (!b.ownerEmail) { alert('אין כתובת מייל לעסק הזה — צריך להוסיף אותה בכרטיס (שלב "אימות בעל העסק").'); return; }

  // ── בעל עסק עם קוד כניסה מקבל תמיד את מכתב-הפתיחה המאוחד (2026-08-22) ─────────────────────
  // באג-אמת "לארט אופנועים" (20.8): אורן לוי קיבל ב-10:37 את מכתב-הפתיחה המאוחד כמו שצריך,
  // דווח שלא קיבל, ולחיצה על "שליחה חוזרת" שלחה לו ב-10:45 את **מייל-העסק הקצר** — כלומר
  // מייל *פחות* טוב מזה שכבר יצא, בלי קוד הכניסה ובלי "מה לעשות עכשיו". הסיבה: השליחה החוזרת
  // מחזירה ל-pending רק את מסמך העסק, וה-Worker — שרואה שמסמך החבר כבר 'sent' — נופל למייל
  // הקצר. זה קרה לכמה בעלי עסקים, ובנוסף דרס את welcomeEmailKind ל-'bizOnly' כך שהם הוצגו
  // כאן בטעות כ"קיבלו את המייל הלא-נכון". לכן: כשיש חבר מאושר עם קוד כניסה — תמיד המאוחד.
  const owner = b.ownerMemberId ? findFan(b.ownerMemberId) : null;
  if (owner && owner.status === 'approved' && owner.loginCode) return window.requeueWelcomeEmail(id);

  if (!confirmSuspectEmail(b.ownerEmail, `"${b.name}"`)) return;
  if (!confirm(`לשלוח שוב את מייל האישור ל"${b.name}"?\n\nאל: ${b.ownerEmail}\n\nהמייל יוצא אוטומטית תוך דקה.`)) return;
  try {
    // מנקה גם את תוצאת-המסירה הקודמת (§205) — אחרת "חזר" ישן נשאר על המסך אחרי שליחה חדשה
    await updateDoc(doc(db, 'businesses', id), { ownerEmailStatus: 'pending', ownerEmailQueuedAt: serverTimestamp(), ownerEmailError: null, ownerEmailDelivery: null, ownerEmailDeliveryAt: null, ownerEmailDeliveryReason: null, ownerEmailOpenedAt: null, ownerEmailClickedAt: null });
    await logActivity('businesses', id, { type: 'email', title: 'מייל האישור נשלח שוב', detail: `אל ${b.ownerEmail}`, field: 'ownerEmailStatus', before: b.ownerEmailStatus || null, after: 'pending' });
    alert('נכנס לתור — המייל יוצא תוך דקה. הסטטוס בכרטיס יתעדכן ל"נשלח" עם השעה המדויקת.');
  } catch (e) { console.error(e); alert('שגיאה: ' + e.message); }
};

// ── שליחת מכתב-הפתיחה המאוחד לבעל עסק שקיבל את המייל הקצר (2026-08-18) ──────────────────────
// אי אפשר לעשות את זה עם "שליחה חוזרת" רגילה: היא מחזירה ל-pending רק צד אחד, וה-Worker שולח
// מאוחד רק כששני הצדדים ממתינים יחד. לכן batch אטומי על שני המסמכים — בדיוק כמו באישור עצמו.
window.requeueWelcomeEmail = async function(id) {
  const b = findBiz(id);
  if (!b) return;
  if (b.status !== 'approved') { alert('אפשר לשלוח רק לעסק מאושר.'); return; }
  if (!b.ownerEmail) { alert('אין כתובת מייל לעסק הזה.'); return; }
  const f = b.ownerMemberId ? findFan(b.ownerMemberId) : null;
  if (!f || f.status !== 'approved') { alert('אין רשומת חבר מאושרת מאחורי העסק — למכתב המאוחד צריך גם קוד כניסה. אפשר לשלוח "שליחה חוזרת" רגילה במקום.'); return; }
  if (!f.loginCode) { alert('לבעל העסק אין עדיין קוד כניסה — צריך לאשר אותו כאוהד קודם.'); return; }
  if (!confirmSuspectEmail(b.ownerEmail, `"${b.name}"`)) return;
  if (!confirm(`לשלוח ל"${b.name}" את מכתב הפתיחה המלא?\n\nאל: ${b.ownerEmail}\n\nזה המייל המאוחד — קוד הכניסה (${f.loginCode}) + מה לעשות עכשיו + הקישור לדשבורד. יוצא אוטומטית תוך דקה.`)) return;
  try {
    const batch = writeBatch(db);
    batch.update(doc(db, 'businesses', id), {
      ownerEmailStatus: 'pending', ownerEmailQueuedAt: serverTimestamp(), ownerEmailError: null,
      ownerEmailDelivery: null, ownerEmailDeliveryAt: null, ownerEmailDeliveryReason: null,
      ownerEmailOpenedAt: null, ownerEmailClickedAt: null, welcomeEmailKind: null,
    });
    batch.update(doc(db, 'members', f.id), {
      loginCodeEmailStatus: 'pending', loginCodeEmailQueuedAt: serverTimestamp(), loginCodeEmailError: null,
      loginCodeEmailDelivery: null, loginCodeEmailDeliveryAt: null, loginCodeEmailDeliveryReason: null,
      loginCodeEmailOpenedAt: null, loginCodeEmailClickedAt: null,
      isBusinessOwner: true, linkedBusinessId: id,
    });

// ── קוביית "שעות שדורשות מבט" ─────────────────────────────────────────────────────────────
// רשימת-עבודה אמיתית, מקובצת לפי סוג הבעיה, עם לחיצה שקופצת ישר לעסק. נעלמת מעצמה כשריקה.
// יושבת מתחת לפאנל ההמרה כי היא רלוונטית בעיקר **אחריו** — לפני ההמרה רוב העסקים עוד לא
// במבנה בכלל.
// סיבות שהן **שיקול-דעת** ולא שגיאה — לצידן מוצג כפתור "✓ תקין" שמסיר אותן מהרשימה.
// "כל השבוע סגור" / "מבנה פגום" / "פיזי בלי שעות" אינם כאן בכוונה: אותם אי אפשר לאשר,
// רק לתקן בפועל, ולכן הם נשארים עד שהנתון עצמו משתנה.
const ANOMALY_ISSUES = new Set(['חלק מימי החול סגורים', 'שעות שחוצות חצות']);

const HOURS_ISSUE_HINTS = {
  'טקסט חופשי — ממתין לניסוח': 'השעות נשמרו כפי שהעסק כתב אותן. שווה לנסח אחיד, או להמיר לשעות מובנות.',
  'חלק מימי החול סגורים': 'ייתכן שהטקסט המקורי לא ציין טווח ימים מלא. שווה לוודא מול העסק.',
  'שעות שחוצות חצות': 'סגירה אחרי חצות — נכון לברים/מועדונים. רק לוודא שזו הכוונה.',
  'כל השבוע מסומן סגור': 'העסק מוצג ללקוחות כסגור תמיד. כמעט בוודאות טעות.',
  'מבנה השעות פגום': 'הערך השמור לא תקין ולא ניתן להצגה. צריך למלא מחדש.',
  'עסק פיזי בלי שעות': 'יש מקום שלקוחות מגיעים אליו, בלי שעות. הם לא יודעים מתי לבוא.',
};

// אישור מפורש שהחריגה תקינה. כתיבת מנהל רגילה — isAdmin() כבר מתיר אותה ב-firestore.rules,
// אין צורך בכלל חדש.

// ══════════════════════════════════════════════════════════════════════════════════════════
//  כלי ההמרה החד-פעמי — טקסט חופשי → שעות מובנות (§230)
// ══════════════════════════════════════════════════════════════════════════════════════════
// המשתמש: "אני מתכוון בסוף לאשר את זה לכולם דרך הדשבורד שלי".
// הפאנל **מסתיר את עצמו** כשאין יותר מה להמיר — זה כלי לפעם אחת, לא פיצ'ר קבוע.
// שלוש קטגוריות, ורק הראשונה נכתבת:
//   ✅ יומר   — הפרסר גזר ימים+שעות (או הניח א׳–ה׳ לפי החלטת המשתמש)
//   📝 ל"אחר" — טקסט שאי אפשר לגזור ממנו; נכנס כמו-שהוא ל-hoursOther וממתין לניסוח שלך
//   ✋ ידני   — הטקסט מזכיר ימים במילים ולא באותיות; ניחוש היה **מוחק מידע אמיתי**
function hoursMigrationRows() {
  if (!window.HB_HOURS) return [];
  return MOCK_BUSINESSES
    .filter(b => b.status === 'approved')
    .filter(b => !b.hoursMode)                     // כבר הומר — לא נוגעים
    .map(b => {
      const raw = (b.hoursText || '').trim();
      const res = HB_HOURS.convert(raw);
      const auto = res.kind === 'full' || res.kind === 'assumed';
      return {
        b, raw, kind: res.kind, auto,
        preview: auto ? HB_HOURS.daysToPlain(HB_HOURS.parsedToDays(res.parsed)) : '',
        payload: auto
          ? HB_HOURS.toPayload({ mode: 'fixed', days: HB_HOURS.parsedToDays(res.parsed) })
          : (raw ? HB_HOURS.toPayload({ mode: 'other', other: raw }) : null),
      };
    })
    .filter(r => r.payload);                        // ריק לגמרי — אין מה לכתוב
}

function hoursMigrationPanelHtml() {
  const rows = hoursMigrationRows();
  if (!rows.length) return '';                     // אין מה להמיר → הפאנל נעלם
  const auto = rows.filter(r => r.auto);
  const other = rows.filter(r => !r.auto && r.kind !== 'manual');
  const manual = rows.filter(r => r.kind === 'manual');

  const rowHtml = r => `
    <div class="hmig-row">
      <span class="hmig-name">${esc(r.b.name)}</span>
      <span class="hmig-was">${esc(r.raw) || '<i>ריק</i>'}</span>
      <span class="hmig-arrow">→</span>
      <span class="hmig-new">${r.auto ? HB_HOURS.daysToHtml(HB_HOURS.normalizeDays(r.payload.hoursDays)) : '<span class="hmig-tag other">נכנס ל״אחר״ — ימתין לניסוח שלך</span>'}</span>
    </div>`;

  return `
    <div class="hmig-panel">
      <div class="hmig-head">
        <div>
          <div class="hmig-title">🕐 המרת שעות פעילות — ${rows.length} עסקים ממתינים</div>
          <div class="hmig-sub">
            מעבר מטקסט חופשי לשדות מסודרים. <b>${auto.length}</b> יומרו אוטומטית לשעות מובנות,
            <b>${other.length + manual.length}</b> ייכנסו ל״אחר״ עם הטקסט שלהם <b>כמו שהוא</b> — שום טקסט לא נמחק.
            <br>אחרי ההרצה כל עסק יראה קובייה בדשבורד שלו ויתבקש לאשר או לתקן.
          </div>
        </div>
        <button class="hmig-run" onclick="runHoursMigration()">הרץ המרה על ${rows.length} העסקים</button>
      </div>
      <div class="hmig-list">
        ${auto.map(rowHtml).join('')}
        ${other.map(rowHtml).join('')}
        ${manual.map(rowHtml).join('')}
      </div>
      ${manual.length ? `<div class="hmig-manual">✋ <b>שווה מבט אחר כך:</b> ${manual.map(r => esc(r.b.name)).join(' · ')} —
        בטקסט שלהם יש מידע-ימים אמיתי שכתוב <b>במילים ולא באותיות</b> ("מראשון עד חמישי", "מוצ״ש").
        לכן הם נכנסים ל״אחר״ עם הטקסט המלא ולא מנוחשים — ניחוש היה מוחק להם מידע.</div>` : ''}
    </div>`;
}

// כתיבה בפועל. סדרתית ולא Promise.all במכוון — 37 כתיבות במקביל על אותו אוסף זה בדיוק
// המקרה שבו כשל-רשת אחד משאיר חצי מהעסקים מומרים בלי שנדע אילו. כאן כל כשל מדווח בשמו.
window.runHoursMigration = async function () {
  const rows = hoursMigrationRows();
  if (!rows.length) return;
  if (!confirm(`להריץ המרת שעות על ${rows.length} עסקים?\n\nכל עסק יקבל שעות מובנות ויתבקש לאשר אותן בדשבורד שלו.\nהטקסט המקורי נשמר ולא נמחק.`)) return;

  let ok = 0;
  const failed = [];
  // showSaving/hideSaving מנוהלות במונה-עומק (savingDepth) — קריאה אחת בלבד, והעדכון
  // בתוך הלולאה נעשה ישירות על התווית ולא בקריאה חוזרת שהייתה מותירה את החיווי תקוע.
  showSaving(`ממיר 0/${rows.length}…`);
  const savingLabel = () => document.querySelector('.saving-toast .saving-toast-label');
  for (const r of rows) {
    try {
      await updateDoc(doc(db, 'businesses', r.b.id), r.payload);
      Object.assign(r.b, r.payload, { hoursText: r.payload.hours });
      ok++;
      const lbl = savingLabel(); if (lbl) lbl.textContent = `ממיר ${ok}/${rows.length}…`;
    } catch (e) {
      console.error('hoursMigration', r.b.name, e);
      failed.push(r.b.name);
    }
  }
  hideSaving(!failed.length, `הומרו ${ok}`);
  // כל כשל מדווח בשמו — המרה חלקית שקטה היא בדיוק מה שאי אפשר לאתר אחר כך
  alert(failed.length
    ? `הומרו ${ok} מתוך ${rows.length}.\n\nנכשלו: ${failed.join(', ')}\nאפשר להריץ שוב — מי שכבר הומר לא ייגע.`
    : `✓ הומרו ${ok} עסקים.\n\nמכאן כל אחד מהם יראה קובייה בדשבורד שלו ויתבקש לאשר או לתקן.`);
  renderMain();
};

// §254, רשת-ביטחון שנייה: renderMain() בונה את **כל** גוף-הטאב מחדש, ולכן כל קורא שלו באמצע
// הקלדה הורג את שדה-החיפוש — כולל ה-onSnapshot הגלובליים (renderAllPreserveScroll נופל ל-renderMain
// כשאין פאנל-פרטים פתוח, וזה בדיוק המצב בדשבורד הראשי). במקום לצוד כל קורא בנפרד, המצב נשמר
// ומוחזר בנקודה אחת — מכסה גם קוראים עתידיים. רק שדות-חיפוש עם id מוכר, כדי לא "להחזיר" פוקוס
// לשדה-עריכה שהמשתמש בכלל סגר.
const SEARCH_INPUT_IDS = ['bizSearchInput', 'fanSearchInput', 'taskSearchInput', 'heartsSearchInput', 'dataSearchInput'];
function captureSearchFocus() {
  const a = document.activeElement;
  if (!a || a.tagName !== 'INPUT' || !SEARCH_INPUT_IDS.includes(a.id)) return null;
  return { id: a.id, start: a.selectionStart, end: a.selectionEnd };
}
function restoreSearchFocus(st) {
  if (!st) return;
  const el = document.getElementById(st.id);
  if (!el) return;
  el.focus();
  // setSelectionRange זורק על חלק מסוגי-ה-input; type=search תקין, אבל עוטפים בכל זאת כדי
  // ששחזור-הסמן לעולם לא יפיל את הרינדור עצמו.
  try { el.setSelectionRange(st.start, st.end); } catch (e) {}
}
// ══════════════════ §393 — מסך "מחיקות ושחזור" ═══════════════════════════════════════════
// המסך שלא היה קיים ב-§392, וששאלת "מי מחק את הרשומה" נשארה בלעדיו בלי תשובה.
//
// טעינה עצלה ופעם-אחת, בדיוק כמו loadRedeemStats/loadPlatformStats — אבל עם מצב מפורש
// ולא "אם הרשימה ריקה תטען שוב": כשל-קריאה משאיר את הרשימה ריקה, ותנאי כזה היה מייצר
// לולאת-רינדור אינסופית מול Firestore.
let deletionLogEntries = [];
let deletionLogState = 'idle';   // idle | loading | ready | error
let deletionLogError = '';

async function loadDeletionLog(force) {
  if (deletionLogState === 'loading') return;
  if (!force && (deletionLogState === 'ready' || deletionLogState === 'error')) return;
  deletionLogState = 'loading';
  if (force && activeTab === TRASH_KEY) renderMain();
  try {
    deletionLogEntries = await fetchDeletionLog(db, 200);
    deletionLogState = 'ready';
    deletionLogError = '';
  } catch (e) {
    console.error('deletion log load failed:', e);
    deletionLogState = 'error';
    deletionLogError = e && e.message ? e.message : String(e);
  }
  if (activeTab === TRASH_KEY) renderMain();
}
window.retryDeletionLog = function() { loadDeletionLog(true); };

const RESTORE_FAIL_MSG = {
  // 🔑 המקרה שבאמת קורה: הרשומה כבר שוחזרה, או שאותו אדם נרשם מחדש וקיבל את אותו מזהה
  // (מזהה של חבר שנכנס עם Google הוא ה-uid שלו — כלומר הרשמה חוזרת מחזירה בדיוק אותו ID).
  // כתיבה במצב הזה הייתה **דורסת רשומה חיה בגרסה ישנה**, בלי שום סימן.
  occupied: 'השחזור בוטל: כבר קיימת רשומה עם אותו מזהה.\n\nייתכן שהרשומה כבר שוחזרה, או שאותו אדם נרשם מחדש. כתיבה עכשיו הייתה דורסת את הרשומה החיה בגרסה ישנה.',
  noLog: 'רשומת היומן לא נמצאה. רענן/י את המסך.',
  noData: 'ברשומת היומן אין צילום של המסמך, ולכן אין מה לשחזר ממנה.',
};

window.restoreDeletedRecord = async function(logId) {
  const entry = deletionLogEntries.find(x => x.id === logId);
  if (!entry) return;
  const { name } = deletionLabel(entry.collectionName, entry.data);
  const what = entry.collectionName === 'members' ? 'האוהד' : 'העסק';
  if (!confirm(`לשחזר את ${what} "${name}"?\n\nהרשומה תיכתב בחזרה על אותו מזהה, עם התוכן שנשמר ביומן ברגע המחיקה.\nהיומן ההיסטורי של הרשומה (תת-האוסף activity) שרד את המחיקה ויחזור איתה.`)) return;
  try {
    const res = await restoreDeleted(db, logId, CURRENT_ADMIN);
    if (!res.ok) { alert(RESTORE_FAIL_MSG[res.reason] || 'השחזור לא בוצע.'); return; }
    alert(`✓ "${res.name}" שוחזר.`);
    loadDeletionLog(true);
  } catch (e) { console.error(e); alert('השחזור נכשל, ולא נכתב דבר: ' + (e && e.message ? e.message : e)); }
};

function delTs(t) { return t && typeof t.toDate === 'function' ? fmtDateTime(t.toDate()) : ''; }

function deletionLogRowHtml(entry) {
  const isFan = entry.collectionName === 'members';
  const { name, lines } = deletionLabel(entry.collectionName, entry.data);
  const when = delTs(entry.deletedAt);
  const side = entry.state === 'restored'
    ? `<div class="del-restored">✓ שוחזר${entry.restoredBy ? ' ע"י ' + esc(entry.restoredBy) : ''}${delTs(entry.restoredAt) ? '<br>' + delTs(entry.restoredAt) : ''}</div>`
    : `<button class="act-btn tiny" onclick="restoreDeletedRecord('${entry.id}')">↩️ שחזור</button>`;
  return `
    <div class="del-row">
      <div class="del-row-main">
        <div class="del-row-name">
          <span class="del-kind">${isFan ? '👥 אוהד' : '🏪 עסק'}</span>
          <span>${esc(name)}</span>
        </div>
        ${lines.length ? `<div class="del-row-ident">${lines.map(esc).join(' · ')}</div>` : ''}
        <div class="del-row-actor">נמחק ע"י ${esc(entry.actorName || '(לא ידוע)')}${when ? ' · ' + when : ''}${entry.source ? ' · מתוך ' + esc(entry.source) : ''}</div>
        ${entry.state === 'attempted'
          ? `<div class="del-attempted">⚠️ הרישום נכתב אך אישור המחיקה לא חזר — ייתכן שהרשומה כלל לא נמחקה. "שחזור" יסרב אם היא עדיין קיימת.</div>` : ''}
      </div>
      <div class="del-row-side">${side}</div>
    </div>`;
}

function deletionLogHtml() {
  const head = `
    <div class="msg-content-head">
      <div style="flex:1;min-width:230px">

  </div>`;

  if (deletionLogState === 'error') {
    return `${head}${note}<div class="placeholder-note">לא ניתן לטעון את יומן המחיקות: ${esc(deletionLogError)}

  }
  if (deletionLogState !== 'ready') {
    return `${head}${note}<div class="placeholder-note">טוען את יומן המחיקות…</div>`;
  }
  if (!deletionLogEntries.length) {
    return `${head}${note}<div class="placeholder-note">אין עדיין מחיקות ביומן. זה המצב הרצוי.</div>`;
  }
  return `${head}${note}
    <div class="dcard" style="padding:6px 16px 10px">
      ${deletionLogEntries.map(deletionLogRowHtml).join('')}
    </div>
    <div style="margin-top:10px"><button class="act-btn tiny" onclick="retryDeletionLog()">🔄 רענון</button></div>`;

// saveSectionUpdates/renderMainPreserveScroll בכלל — יש onSnapshot גלובלי על 'businesses'/'members'
// (למטה) שרץ *עצמאית*, בלי שום קשר לזרימת-השמירה שלנו, בכל פעם שמסמך כלשהו משתנה — כולל הכתיבה-
// העצמית-של-המנהל (updateDoc בתוך saveSectionUpdates מעדכן את ה-cache המקומי של Firestore כמעט
// מיידית, מה שמפעיל את ה-listener הזה *באמצע* ה-await, לפני שהקוד שלנו בכלל ממשיך). הקורא-לחזרה
// שלו קרא ל-renderAll() (=renderSidebar+renderMain) ללא תנאי — הריסה-מלאה-ובנייה-מחדש בלתי-תלויה
// לגמרי בכל מה שתוקן עד עכשיו ב-saveSectionUpdates. זו הקפיצה שנמדדה: scrollTop=0 כבר *באמצע*
// ה-await updateDoc(), הרבה לפני ש-refreshOpenDetailPanel שלנו בכלל רץ.
function renderAllPreserveScroll() {

}

// §317 — כמה onSnapshot שנוחתים באותו tick מצטמצמים לרינדור אחד בפריים הבא.
let _renderAllQueued = false;
function queueRenderAllPreserveScroll() {
  if (_renderAllQueued) return;
  _renderAllQueued = true;
  requestAnimationFrame(() => { _renderAllQueued = false; renderAllPreserveScroll(); });
}

// admin guard — session אמיתי (Firebase Auth) + isAdmin:true על רשומת החבר, זהה ל-admin-businesses.html/admin-members.html
await new Promise(resolve => {
  const unsub = onAuthStateChanged(auth, async user => {
    unsub();
    if (!user) { location.href = 'welcome.html'; return; }
    const snap = await getDoc(doc(db, 'members', user.uid));
    if (!snap.exists() || snap.data().isAdmin !== true) { location.href = 'home.html'; return; }
    const adminData = snap.data();
    CURRENT_ADMIN = { uid: user.uid, name: `${adminData.firstName || ''} ${adminData.lastName || ''}`.trim() || adminData.email || 'מנהל', email: adminData.email || '' };
    resolve();
  });
});

// ── שמירה על תוקף הזהות אחרי הטעינה ────────────────────────────────────────────────────────
// הגארד למעלה רץ פעם אחת בלבד. כל האתר חולק getAuth() יחיד (firebase-config.js) וההזדהות
// נשמרת ב-IndexedDB לכל הדומיין — כלומר סשן שפג, יציאה, או כניסה כמשתמש אחר **בטאב אחר**
// משנים את הזהות גם בטאב הזה, בלי שום סימן על המסך. התוצאה: הדף נראה תקין לחלוטין וכל
// כתיבה נדחית ב-permission-denied, שהמשתמש רואה כ"לא נשמר, יש שגיאה" בלי שום רמז לסיבה.
// לכן ההאזנה נמשכת, ושינוי-זהות חוסם את המסך בהודעה מפורשת במקום להיכשל בשקט.
onAuthStateChanged(auth, user => {
  if (user && user.uid === CURRENT_ADMIN.uid) return;
  if (document.getElementById('adminSessionLostOverlay')) return;
  const who = user ? 'המערכת מזהה עכשיו משתמש אחר' : 'החיבור שלך למערכת פג';
  const box = document.createElement('div');

  box.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(8,12,20,.92);display:flex;align-items:center;justify-content:center;padding:24px;font-family:inherit';
  box.innerHTML = `

      <div style="font-size:19px;font-weight:900;color:#101828;margin-bottom:10px">${who}</div>

    </div>`;
  document.body.appendChild(box);
});

  // ⚠️ refreshTaskCenter ולא שם מומצא — נתפס בבדיקה: `renderTasks` לא קיים בקובץ בכלל,
  // והקריאה הייתה נכשלת בשקט (typeof הגן עליה) כך שסימון לא היה מתרענן עד רענון-דף.
  // §355 — גם כשהארכיון פתוח: הסימון מוסיף שורה שם, לא רק מוריד אחת מכאן.
  if (issuesActive() || handledActive()) refreshTaskCenter();
}, err => console.error('שגיאה בטעינת סימוני תקלות הרשמה:', err));

onSnapshot(doc(db, 'settings', 'landingContentDraft'), snap => {
  landingDraftDoc = snap.exists() ? snap.data() : null;
  _landingDraftLoaded = true;
  maybeInitLandingWorking();
}, err => console.error('שגיאה בטעינת טיוטת תוכן דף הנחיתה מ-Firestore:', err));
</script>
</body>
</html>
