<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מרכז ניהול — Yellow Zone</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<!-- Rubik נטען כאן רק בשביל מדידת-פיקסלים מדויקת של כותרת-ההטבה (ensureFitsCard, ר' למטה) —
     זה הפונט האמיתי של .biz-discount-text ב-home.html (body{font-family:'Rubik'}), לא Heebo
     שהאדמין עצמו משתמש בו לעיצוב. נטען סינכרוני (לא preload+swap כמו ב-home.html) כדי שהמדידה
     הראשונה לא תרוץ לפני שהפונט זמין (סיכון-race עם טעינה אסינכרונית). -->
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700&display=swap" rel="stylesheet">
<script src="categories.js"></script>
<style>
:root {
  /* שלב 8, §18+נספח במפרט — פלטת המותג (כחול+צהוב), מחליפה את הניטרלי הקודם.
     --accent הוא ברירת המחדל לכל מה שהיה גורף עליו (מיון/מידע/מצב-נבחר) — כחול.
     פעולה-ראשית-בפועל (כפתור אחד בכל מסך, למשל "פרסום לאתר"/"שמור עיגון") משתמשת
     ב---accent-cta הצהוב במפורש (ר' .slot-btn.primary), לא ב---accent. */
  --bg: #F5F6F8;
  --nav-bg: #F3F4F6;
  --card-bg: #FFFFFF;
  --card-bg2: #FFFFFF;
  --accent: #0A2A66;
  --accent-rgb: 10,42,102; /* לשימוש ב-rgba(var(--accent-rgb),X) בכל מקום שהיה rgba(var(--accent-rgb),X) קשיח (גוון-הדגשה על היישוב הישן) */
  --accent-dark: #164193;
  --accent-bg: #EEF2FA;
  --accent-cta: #FFD400;
  --accent-cta-hover: #FFDE33;
  --accent-cta-ink: #0A2A66;
  --text: #101828;
  --text-sm: #475467;
  --text-muted: #667085;
  --green: #16A34A;
  --orange: #B54708;
  --orange-rgb: 181,71,8; /* לשימוש ב-rgba(var(--orange-rgb),X) — היה מפוזר כ-rgba(var(--orange-rgb),X) קשיח, גוון-ענבר קרוב אך לא זהה */
  --warn-bg: #FFFBEB;
  --warn-border: #FDE68A;
  --red: #DC2626;
  --border: #DDE2E8;
  --border-md: #E3E7EC;

  /* ── תוכן דף הנחיתה (שלב 6): טוקנים של welcome.html עצמו — כבר זהים לפלטת המותג ── */
  --lp-bg: #F6F6F2;
  --lp-ink: #0A2A66;
  --lp-acc: #FFD400;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Heebo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 60px;
}

/* ── layout: sidebar + main — עודכן לפי "2 מרכז המשימות.dc.html" ואילך (שלב אינטגרציה,
   2026-08-03): רוחב/גבהים/מצב-פעיל-מלא-כחול הותאמו בדיוק למוקאפ, ללא שינוי במבנה ה-DOM
   (renderSidebar נשאר זהה — רק ה-CSS השתנה) ══ */
.dash-layout { max-width: 2200px; margin: 0 auto; padding: 20px 32px 0; display: flex; align-items: flex-start; gap: 18px; }
.sidebar {
  width: 236px; flex-shrink: 0; position: sticky; top: 20px; transition: width .15s;
  background: var(--card-bg2); border-inline-start: 1px solid var(--border); border-radius: 14px; padding: 18px 12px;
  display: flex; flex-direction: column; gap: 7px;
  /* התפריט גדל (נוספה "עסק השבוע") ועבר את גובה המסך — בלי max-height+overflow הוא "sticky" שנגרר
     עם שאר העמוד ברגע שגובהו חורג, במקום להישאר קבוע וגלול בעצמו. אותו דפוס בדיוק כמו .lct-panel/
     .msg-col-side הקיימים (max-height: calc(100vh - 40px) + overflow-y: auto). */
  max-height: calc(100vh - 40px); overflow-y: auto;
}
.sidebar.collapsed { width: 64px; padding: 18px 12px; }
.sidebar-collapse-btn {
  display: flex; align-items: center; justify-content: center; width: 30px; height: 30px;
  border-radius: 8px; cursor: pointer; color: var(--text-sm); font-size: 15px; margin-bottom: 6px; transition: all .12s;
}
.sidebar-collapse-btn:hover { background: var(--bg); color: var(--text); }
.sidebar.collapsed .sidebar-standalone { justify-content: center; }
.sidebar.collapsed .sidebar-standalone span:not(.ic) { display: none; }
/* פריט עצמאי בראש הסיידבר (כל העסקים) — לא נעלם, לא תלוי בקבוצות שמתחתיו */
.sidebar-standalone {
  display: flex; align-items: center; gap: 11px; padding: 0 10px; height: 40px; border-radius: 9px;
  cursor: pointer; transition: all .12s;
  font-size: 13.5px; font-weight: 500; color: var(--text-sm);
}
.sidebar-standalone:hover { background: var(--bg); color: var(--text); }
.sidebar-standalone.active { background: var(--accent); color: #fff; font-weight: 600; }
/* "מרכז נתונים" — הדגשה קבועה בתחתית הסיידבר (2026-08-05, תואם-מוקאפ: פריט-אחרון, כהה תמיד,
   לא רק כשפעיל) — כלי-דוח/ניתוח שונה במהותו משאר פריטי-הניהול, ולכן גם ויזואלית מובחן. */
.sidebar-standalone.featured { background: var(--accent); color: #fff; font-weight: 600; }
.sidebar-standalone.featured:hover { background: var(--accent-dark); color: #fff; }
/* מספר-משימות ליד כל פריט בסיידבר (2026-08-05, בקשת המשתמש: "מספר ליד כל אזור לפי המשימות שיש") —
   אותו chip-צהוב בכל הפריטים, ליד biz-changes-badge/tag-chip; לא רק "כל העסקים" יותר. */
.sidebar-nav-badge {
  display: inline-flex; align-items: center; justify-content: center; background: var(--accent-cta); color: var(--accent);
  font-size: 10.5px; font-weight: 800; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; flex: none;
}
.sidebar-standalone .ic { display: flex; align-items: center; flex: none; font-size: 16px; }
.sidebar-divider { height: 1px; background: var(--border-md); margin: 8px 8px; }
.sidebar-section-label { font-size: 10.5px; font-weight: 700; color: var(--text-muted); letter-spacing: .08em; padding: 0 8px; margin-bottom: 6px; }
.main-content { flex: 1; min-width: 0; }
@media (max-width: 720px) {
  .dash-layout { flex-direction: column; }
  .sidebar { width: 100%; position: static; }
}

/* ── הסבר כללי + מילון מונחים — מקופל כברירת מחדל ── */
.info-accordion { background: var(--card-bg2); border: 1px solid var(--border-md); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
.info-accordion-header {
  display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
  cursor: pointer; font-size: 12.5px; font-weight: 800; color: var(--text-sm);
}
.info-accordion-header:hover { color: var(--text); }
.info-accordion-header .chev { font-size: 11px; color: var(--text-muted); transition: transform .15s; }
.info-accordion.open .chev { transform: rotate(180deg); }
.info-accordion-body { display: none; padding: 0 16px 16px; }
.info-accordion.open .info-accordion-body { display: block; }
.info-explainer { font-size: 12.5px; line-height: 1.9; color: var(--text-sm); margin-bottom: 14px; }
.info-explainer b { color: var(--text); }
.info-explainer .yl { color: var(--accent); }
.glossary-title { font-size: 11.5px; font-weight: 800; color: var(--text-muted); margin-bottom: 10px; }
.glossary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
.glossary-item { font-size: 11.5px; line-height: 1.6; }
.glossary-item .term { color: var(--accent); font-weight: 800; }
.glossary-item .def { color: var(--text-sm); }
@media (max-width: 480px) { .glossary-grid { grid-template-columns: 1fr; } }

.placeholder-note {
  background: var(--card-bg2); border: 1px dashed var(--border-md); border-radius: 12px;
  padding: 40px 16px; text-align: center; color: var(--text-muted); font-size: 13px;
}

/* ── כל העסקים: כרטיסי סטטיסטיקה + פילטר + בחירה מרובה + רשימת שורות קומפקטית ── */
/* 3 כרטיסי מידע בלבד — בדיוק כמו ב-admin-businesses.html היום (עסקים נרשמו/ממתינים לאישור/עסקים פעילים).
   אלה תצוגת מידע, לא כפתורי סינון — הסינון בפועל הוא שורת filter-btn נפרדת למטה, בדיוק כמו במקור. */
.biz-stats-row { display: flex; gap: 10px; margin-bottom: 18px; }
.biz-stat-card {
  flex: 1; background: var(--card-bg2); border: 1px solid var(--border-md); border-radius: 12px;
  padding: 14px 16px; text-align: center;
}
.biz-stat-card .num { font-size: 26px; font-weight: 900; color: var(--accent); }
.biz-stat-card.pending .num { color: var(--orange); }
.biz-stat-card.approved .num { color: var(--green); }
.biz-stat-card .lbl { font-size: 11.5px; color: var(--text-sm); margin-top: 3px; font-weight: 700; }

/* שורת סינון — 5 כפתורים + חיפוש, בדיוק כמו filter-bar במקור */
.biz-filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.biz-filter-btn {
  padding: 7px 15px; border-radius: 20px; border: 1.5px solid var(--border-md); background: var(--card-bg2);
  font-family: 'Heebo', sans-serif; font-size: 12.5px; font-weight: 700; color: var(--text-sm); cursor: pointer; transition: all .15s; white-space: nowrap;
}
.biz-filter-btn.active { background: rgba(var(--accent-rgb),.15); border-color: var(--accent); color: var(--accent); }
.biz-filter-btn.changes { border-color: rgba(var(--orange-rgb),.4); color: var(--orange); background: rgba(var(--orange-rgb),.1); }
.biz-filter-btn.changes.active { background: var(--orange); border-color: var(--orange); color: #fff; }
.biz-changes-badge {
  display: inline-flex; align-items: center; justify-content: center; background: var(--orange); color: #fff;
  font-size: 10.5px; font-weight: 800; min-width: 17px; height: 17px; border-radius: 9px; padding: 0 4px; margin-right: 3px;
}
.biz-filter-btn.changes.active .biz-changes-badge { background: #1a1a1a; color: #fbbf24; }
.biz-search {
  flex: 1; min-width: 180px; padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--border-md);
  background: var(--nav-bg); color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px;
}
.biz-search:focus { border-color: var(--accent); outline: none; }

/* ── סרגל סינון חדש (כל העסקים / כל האוהדים) — חיפוש+דרופדאונים+פילים, נקי ומכוון-משימה ── */
.filter-toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.filter-toolbar-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filter-search-input {
  flex: 1; min-width: 220px; max-width: 320px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-md);
  background: var(--card-bg); color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px;
}
.filter-search-input:focus { border-color: var(--accent); outline: none; }
.filter-select {
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-md); background: var(--card-bg);
  color: var(--text); font-family: 'Heebo', sans-serif; font-size: 12.5px; cursor: pointer;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-pill {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border-md); background: var(--card-bg);
  font-family: 'Heebo', sans-serif; font-size: 12.5px; font-weight: 700; color: var(--text-sm); cursor: pointer; transition: all .12s; white-space: nowrap;
}
.filter-pill:hover { border-color: var(--accent); color: var(--text); }
.filter-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.filter-pill.active .biz-changes-badge { background: #fff; color: var(--accent); }
.filter-clear {
  font-size: 12px; color: var(--text-sm); cursor: pointer; text-decoration: underline; background: none; border: none;
  font-family: 'Heebo', sans-serif; padding: 0;
}
.filter-clear:hover { color: var(--accent); }

/* פילי-סיווג ראשיים ("הכל · N" וכו', תואם-handoff) — שונים ויזואלית מ-.filter-pill (עוד-סינונים):
   פיל "הכל" פעיל = כמעט-שחור (לא accent), כדי לבדל אותו מפילי-הסינון-המשניים */
.biz-class-pills { gap: 6px; }
.biz-class-pill {
  padding: 5px 11px; border-radius: 99px; border: none; background: var(--card-bg2);
  font-family: 'Heebo', sans-serif; font-size: 12px; font-weight: 500; color: var(--text-sm); cursor: pointer; white-space: nowrap;
}
.biz-class-pill:hover { background: var(--border-md); }
.biz-class-pill.active { background: var(--text); color: var(--card-bg); font-weight: 600; }

.biz-select-all-row { display: flex; align-items: center; gap: 10px; padding-top: 6px; }
.biz-select-all-btn {
  flex-shrink: 0; border: 1.5px solid var(--border-md); background: var(--card-bg2); color: var(--text-sm);
  font-family: 'Heebo', sans-serif; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 20px; cursor: pointer; white-space: nowrap;
}
.biz-select-all-btn.active { background: rgba(var(--accent-rgb),.15); border-color: var(--accent); color: var(--accent); }
.biz-sel-count { font-size: 11.5px; color: var(--text-muted); }

.biz-bulk-bar {
  display: flex; align-items: center; gap: 10px; background: rgba(var(--accent-rgb),.08); border: 1px solid rgba(var(--accent-rgb),.3);
  border-radius: 10px; padding: 9px 13px; margin-bottom: 12px; font-size: 12.5px; font-weight: 700; color: var(--accent);
}
.biz-bulk-bar .sp { flex: 1; }
.biz-bulk-btn {
  border: none; font-family: 'Heebo', sans-serif; font-size: 11.5px; font-weight: 800; padding: 6px 12px;
  border-radius: 8px; cursor: pointer;
}
.biz-bulk-btn.approve { background: var(--green); color: #0f1524; }
.biz-bulk-btn.reject { background: var(--red); color: #fff; }
.biz-bulk-btn.cancel { background: transparent; border: 1.5px solid var(--border-md); color: var(--text-sm); }

/* שורת עסק — בדיוק תואמת ל-biz-card של admin-businesses.html: מסגרת ימין צבעונית לפי סטטוס,
   אווטאר גנרי, שם + תג "✏️ שינויים", שורת meta (סוג+עיר), צ'יפ סטטוס, שברון פתיחה */
.biz-list { border: 1px solid var(--border-md); border-radius: 10px; overflow: hidden; }
.biz-row {
  background: var(--card-bg); border-bottom: 1px solid var(--border); border-right: 3px solid transparent;
  padding: 9px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background .12s;
}
.biz-row:last-child { border-bottom: none; }
.biz-row:hover { background: rgba(var(--accent-rgb),.03); }
.biz-row.pending  { border-right-color: var(--orange); }
.biz-row.approved { border-right-color: var(--green); }
.biz-row.rejected { border-right-color: var(--border-md); opacity: .6; }
.biz-row.selected { background: rgba(var(--accent-rgb),.06); }
.biz-row-checkbox {
  flex-shrink: 0; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border-md);
  cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--accent);
}
.biz-row.selected .biz-row-checkbox { border-color: var(--accent); background: rgba(var(--accent-rgb),.15); }
.biz-row-icon {
  flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px; background: var(--card-bg2);
  display: flex; align-items: center; justify-content: center; font-size: 15px;
}
.biz-row-main { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.biz-row-name { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; }
.biz-row-meta { font-size: 11.5px; color: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.biz-change-badge {
  font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 9px; white-space: nowrap; flex-shrink: 0;
  color: var(--accent); background: rgba(var(--accent-rgb),.13); border: 1px solid rgba(var(--accent-rgb),.3);
}
.biz-change-badge.note { color: var(--accent); background: rgba(var(--accent-rgb),.1); border-color: rgba(var(--accent-rgb),.35); }
.biz-status-badge { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
.biz-status-badge.approved { color: var(--green); background: rgba(22,163,74,.12); }
.biz-status-badge.pending  { color: var(--orange); background: rgba(var(--orange-rgb),.12); }
.biz-status-badge.rejected { color: var(--text-sm); background: rgba(var(--accent-rgb),.08); }
.biz-row-chevron { flex-shrink: 0; color: var(--text-muted); font-size: 15px; }


.section-h2 { font-size: 13.5px; font-weight: 800; color: var(--text-sm); margin: 22px 0 10px; display: flex; align-items: center; gap: 6px; }
.section-h2-row { display: flex; align-items: center; justify-content: flex-start; gap: 10px 16px; flex-wrap: wrap; margin: 22px 0 10px; }
.section-h2-row .section-h2 { margin: 0; }
.section-h2-row .filter-toolbar { margin-bottom: 0; }

.action-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.action-tab {
  padding: 9px 16px; border-radius: 20px; border: 1.5px solid var(--border-md); background: var(--card-bg2);
  font-family: 'Heebo', sans-serif; font-size: 12.5px; font-weight: 800; color: var(--text-sm); cursor: pointer; transition: all .15s;
}
.action-tab.active { background: rgba(var(--accent-rgb),.15); border-color: var(--accent); color: var(--accent); }
.action-tab .cnt {
  display: inline-flex; align-items: center; justify-content: center; background: var(--orange); color: #fff;
  font-size: 10px; font-weight: 800; min-width: 17px; height: 17px; border-radius: 9px; padding: 0 4px; margin-left: 5px;
}
.action-tab.active .cnt { background: var(--accent); color: #fff; }

.fan-row {
  background: var(--card-bg); border: 1px solid var(--border-md); border-right: 3px solid var(--orange); border-radius: 10px;
  padding: 12px 14px; display: flex; align-items: center; gap: 14px; margin-bottom: 8px; flex-wrap: wrap;
}
.fan-row-main { flex: 1; min-width: 180px; }
.fan-row-name { font-size: 13.5px; font-weight: 800; }
.fan-row-meta { font-size: 11.5px; color: var(--text-sm); margin-top: 2px; }
.fan-row-actions { display: flex; gap: 8px; flex-shrink: 0; }
.act-btn {
  border: 1.5px solid var(--border-md); background: transparent; color: var(--text-sm);
  font-family: 'Heebo', sans-serif; font-size: 11.5px; font-weight: 800; padding: 7px 13px;
  border-radius: 8px; cursor: pointer; white-space: nowrap; transition: all .15s;
}
.act-btn:hover { border-color: var(--accent); color: var(--accent); }
.act-btn.approve { background: var(--green); color: #0f1524; border-color: var(--green); }
.act-btn.approve:hover { opacity: .88; color: #0f1524; }
.act-btn.reject { background: transparent; border-color: rgba(255,92,92,.4); color: var(--red); }
.act-btn.reject:hover { border-color: var(--red); }
.act-btn.soon { opacity: .45; cursor: default; }
.act-btn.soon:hover { border-color: var(--border-md); color: var(--text-sm); }
.act-btn.tiny { padding: 4px 10px; font-size: 11px; }
.suggestion-actions { display: flex; gap: 6px; margin-top: 8px; }

.approve-card {
  background: var(--card-bg); border: 1px solid var(--border-md); border-right: 3px solid var(--orange); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 12px;
}
/* כותרת הכרטיס — שם+מטא זה לצד זה בצמידות, לא מתוחים לרוחב מלא (בכרטיס רחב זה השאיר שטח ריק גדול באמצע) */
.approve-card-head { margin-bottom: 8px; }
.approve-card-title { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.approve-card-meta { font-size: 11px; color: var(--text-sm); margin-top: 2px; }
.approve-field { margin: 12px 0; }
.approve-field-label { font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 5px; }
.approve-longtext {
  background: var(--nav-bg); border: 1px solid var(--border-md); border-radius: 8px; padding: 9px 11px;
  font-size: 12.5px; color: var(--text-sm); line-height: 1.6;
}
/* קופסת-כותרת-AI תואמת-handoff (עודכן 2026-08-04): שורת-כותרת (תג AI+טקסט+מצב-התאמה) מעל
   שורת-קלט+כפתור+תצוגה-מקדימה-חיה, במקום מבנה-טור ישן. תג "AI" מלא-כחול+טקסט-לבן. */
.ai-title-field { background: var(--nav-bg); border-radius: 11px; padding: 14px 16px; }
.ai-title-head { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; flex-wrap: wrap; }
.ai-title-head-label { font-size: 12.5px; font-weight: 600; flex: 1; }
.ai-title-fit { font-size: 11.5px; font-weight: 600; color: var(--text-sm); }
.ai-title-fit.over { color: var(--orange); }
.ai-title-tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: #fff; background: var(--accent); padding: 2px 6px; border-radius: 5px; flex-shrink: 0; }
.ai-title-row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.ai-title-row input {
  flex: 1; min-width: 200px; height: 38px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--card-bg); color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13.5px; font-weight: 600;
}
.ai-title-preview { width: 151px; flex: none; background: var(--card-bg); border-radius: 9px; padding: 8px 10px; box-shadow: 0 1px 2px rgba(16,24,40,.06); }
.ai-title-preview-label { font-size: 9.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
.ai-title-preview-text { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ai-title-options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ai-title-option {
  padding: 6px 10px; border-radius: 8px; border: 1.5px solid rgba(var(--accent-rgb),.25); background: var(--nav-bg);
  color: var(--accent); font-family: 'Heebo', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer;
}
.ai-title-option:hover { border-color: var(--accent); }

.photo-pick-grid { display: flex; gap: 8px; flex-wrap: wrap; }
.photo-pick-item {
  width: 74px; height: 74px; border-radius: 10px; border: 1.5px solid var(--border-md); background: var(--nav-bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; position: relative;
}
.photo-pick-item .ic { font-size: 24px; }
.photo-pick-item .lb { font-size: 9.5px; color: var(--text-muted); }
.photo-pick-item.selected { border-color: var(--accent); background: rgba(var(--accent-rgb),.1); }
.photo-pick-item.selected .lb { color: var(--accent); font-weight: 700; }
.photo-pick-check { position: absolute; top: 3px; left: 3px; font-size: 11px; color: var(--accent); }

.media-manager { margin-top: 4px; }
/* §147 — בורר-קטגוריה כרשת-אייקונים לעריכת שלב 3 (catIconGridHtml/catCircleGridInnerHtml), זהה
   בהיגיון ויזואלי ל-.cat-circle-grid ב-business.html — עיגול+PNG אמיתי+תווית, לא <select> טקסטואלי.
   מותאם לצבעי admin-dashboard.html (--accent-cta צהוב, לא --yellow). */
.cat-circle-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 4px; }
.cat-circle-item {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  cursor: pointer; padding: 8px 2px; border-radius: 12px;
  border: 2px solid transparent; transition: all .15s; text-align: center; user-select: none;
}
.cat-circle-item:hover { background: rgba(10,42,102,.04); }
.cat-circle-item.active { border-color: var(--accent-cta); background: rgba(255,212,0,.08); }
.cat-circle {
  width: 46px; height: 46px; border-radius: 50%;
  background: var(--nav-bg); display: flex; align-items: center; justify-content: center;
  font-size: 20px; transition: all .15s; margin: 0 auto;
}
.cat-circle img { width: 60%; height: 60%; object-fit: contain; }
.cat-circle-item.active .cat-circle { background: rgba(255,212,0,.15); }
.cat-circle-label { font-size: 10px; font-weight: 600; color: var(--text-muted); line-height: 1.3; }
.cat-circle-item.active .cat-circle-label { color: var(--text); }

/* §147 — הותאם ל-handoff ("1 כרטיס עסק.dc.html" שלב 5): קופסה אפורה-שטוחה רגילה במקום מסגרת-אקסנט
   מודגשת לכל מצב — הדגשה (רקע-ענבר+מסגרת-מקווקוות) נשארת רק למצב "חסר" (תמונה מייצגת שלא הועלתה). */
.media-slot-row { display: flex; gap: 10px; flex-wrap: wrap; }
.media-slot {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  height: 72px; border-radius: 10px; background: var(--nav-bg); overflow: hidden; transition: all .12s;
}
.media-slot.logo, .media-slot.cover { cursor: pointer; }
.media-slot.thumb { flex: none; width: 72px; }
.media-slot.missing { background: var(--warn-bg); border: 1px dashed var(--warn-border); }
.media-slot.missing .media-slot-label, .media-slot.missing .media-slot-ic { color: var(--orange); font-weight: 700; }
.media-slot.drag-over { outline: 1.5px dashed var(--green); background: rgba(22,163,74,.08); }
.media-slot-ic { font-size: 22px; }
.media-slot-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-align: center; padding: 0 4px; }
.media-slot-note { font-size: 10.5px; color: var(--text-muted); margin-top: 6px; }
.cover-pos-box { width: 220px; max-width: 100%; aspect-ratio: 4/3; position: relative; overflow: hidden;
  border-radius: 10px; border: 1px solid var(--border); cursor: grab; touch-action: none; background: var(--nav-bg); }
.cover-pos-box.dragging { cursor: grabbing; }
.cover-pos-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
/* בדיוק כמו .biz-card-logo-badge/.biz-card-logo-badge img ב-home.html — ההדמיה צריכה להראות את
   הכרטיס האמיתי, כולל התג הקטן, לא רק את התמונה החתוכה לבד (המשתמש ביקש: "כמו שבאינדקס"). */
.cover-pos-box .biz-card-logo-badge {
  position: absolute; bottom: 8px; right: 8px; z-index: 2;
  width: 26px; height: 26px; border-radius: 7px;
  background: #fff; box-shadow: 0 2px 8px rgba(15,23,42,.18);
  display: flex; align-items: center; justify-content: center; overflow: hidden; pointer-events: none;
}
.cover-pos-box .biz-card-logo-badge img { position: static; width: 100%; height: 100%; object-fit: contain; padding: 3px; }

/* תמונה-קטנה עם כפתור-הורדה צמוד + לייטבוקס בלחיצה (במקום טאב חדש) — זהה בהיגיון ל-admin-businesses.html
   (מוריד דרך פרוקסי כדי לעקוף חסימת CORS על fetch ישיר ל-Firebase Storage). המשתמש דחה במפורש את
   הגרסה הקודמת (<a target="_blank">) — רצה הורדה ישירה מהתמונה עצמה, בלי לצאת מהעמוד בכלל.
   ר' PROJECT_CONTEXT.md §185. */
.media-thumb-wrap { position: relative; display: inline-block; cursor: pointer; flex: none; }
.thumb-download-btn {
  position: absolute; bottom: 3px; left: 3px; z-index: 2;
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(0,0,0,.55); border: none; color: #fff;
  font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.thumb-download-btn:hover { background: rgba(0,0,0,.75); }
.img-lightbox-overlay {
  display: none; position: fixed; inset: 0; z-index: 900;
  background: rgba(0,0,0,.88);
  align-items: center; justify-content: center; padding: 40px 16px;
}
.img-lightbox-overlay.open { display: flex; }
.img-lightbox-overlay img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.lightbox-close-btn, .lightbox-dl-btn {
  position: fixed; top: 16px; z-index: 901;
  height: 40px; border-radius: 20px; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-family: inherit; font-size: 13px; font-weight: 700;
}
.lightbox-close-btn { left: 16px; width: 40px; background: rgba(255,255,255,.15); color: #fff; font-size: 18px; }
.lightbox-dl-btn { right: 16px; padding: 0 18px; background: var(--green); color: #fff; }

.approve-card-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.approve-card-actions.top { margin: 0 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }

/* ── טופס עריכה מלא (בתוך כרטיס-עסק, כל העסקים) ── */
.edit-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px 14px; margin-bottom: 14px; }
.edit-field { display: flex; flex-direction: column; gap: 5px; font-size: 11px; font-weight: 800; color: var(--text-muted); min-width: 0; }
.edit-subrow { display: flex; gap: 8px; min-width: 0; }
.edit-subrow input { min-width: 0; flex: 1; }
.edit-field.full { grid-column: 1 / -1; }
.edit-field input[type="text"], .edit-field select, .edit-field textarea {
  width: 100%; box-sizing: border-box; min-width: 0;
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-md); background: var(--nav-bg); color: var(--text);
  font-family: 'Heebo', sans-serif; font-size: 13px; font-weight: 400;
}
.edit-field textarea { resize: vertical; }
.edit-check-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; font-weight: 400; color: var(--text); }
.edit-check-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
@media (max-width: 600px) { .edit-grid { grid-template-columns: 1fr; } }

.tag-chip-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.tag-chip {
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
  background: rgba(var(--accent-rgb),.06); color: var(--text); border: 1px solid var(--border-md);
}
.tag-chip.empty { color: var(--text-muted); font-weight: 400; }
.tag-chip.selectable { cursor: pointer; user-select: none; transition: background .15s, border-color .15s, color .15s; }
.tag-chip.selectable:hover { border-color: var(--accent); }
.tag-chip.selectable.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
.tag-suggestion-alert {
  display: block; width: 100%; margin-top: 6px;
  background: rgba(var(--orange-rgb),.1); border: 1.5px solid rgba(var(--orange-rgb),.35);
  border-radius: 10px; padding: 7px 11px;
  color: var(--orange); font-size: 11.5px; font-weight: 700;
}
.note-alert { margin-top: 10px; background: var(--accent-bg); border-color: rgba(var(--accent-rgb),.35); color: var(--accent); }
.note-handled-box {
  margin-top: 10px; background: var(--card-bg2); border: 1.5px solid var(--border-md); border-radius: 10px; padding: 7px 11px;
  color: var(--text-sm); font-size: 11.5px;
}
.note-handled-box summary { cursor: pointer; font-weight: 700; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
.toggle-row > span { font-size: 12px; font-weight: 800; color: var(--text-muted); }
.toggle {
  width: 36px; height: 21px; background: rgba(var(--accent-rgb),.16); border-radius: 12px;
  position: relative; cursor: pointer; border: none; flex-shrink: 0; transition: background .2s; padding: 0;
}
.toggle.on { background: var(--green); }
.toggle::after {
  content: ''; position: absolute; width: 15px; height: 15px; background: #fff; border-radius: 50%;
  top: 3px; right: 3px; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.toggle.on::after { transform: translateX(-15px); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
  border: none; border-radius: 6px; background: rgba(var(--accent-rgb),.07); cursor: pointer; font-size: 12px;
  vertical-align: middle; margin: 0 2px;
}
.icon-btn:hover { background: rgba(var(--accent-rgb),.14); }

.owner-verify-details { margin-top: 8px; }
.owner-verify-details summary {
  cursor: pointer; font-size: 11.5px; font-weight: 700; color: var(--text-sm);
  padding: 6px 0; list-style: none;
}
.owner-verify-details summary::-webkit-details-marker { display: none; }
.owner-verify-details summary::before { content: '▸ '; }
.owner-verify-details[open] summary::before { content: '▾ '; }
.owner-verify-details:hover summary { color: var(--text); }

.edit-section-title {
  font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .03em;
  margin: 18px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.edit-section-title:first-of-type { margin-top: 4px; }
/* שלבים עם מעקב-סקירה (1-5) — כל השורה צבועה, לא רק הטקסט: כתום = עדיין לא נסקר, ירוק = נסקר.
   לא אדום במכוון — "טרם נסקר" זה מצב ניטרלי/ממתין, לא שגיאה. */
.edit-section-title.review-tracked {
  padding: 7px 10px; border-radius: 8px; border-bottom: none;
  background: rgba(var(--orange-rgb),.1); color: var(--orange);
}
.edit-section-title.review-tracked.reviewed { background: rgba(22,163,74,.13); color: var(--green); }
.sec-edit-btn {
  text-transform: none; letter-spacing: normal; font-size: 11px; font-weight: 700; color: var(--accent);
  background: rgba(var(--accent-rgb),.07); border: none; border-radius: 6px; padding: 3px 9px; cursor: pointer; flex-shrink: 0;
}
.sec-edit-btn:hover { background: rgba(var(--accent-rgb),.14); }
/* עריכה per-שלב על גבי הכרטיס (כמו admin-businesses.html האמיתי) — לא עוד "ערוך פרטי עסק" גורף לכל הכרטיס */
.sec-edit-form { display: none; margin-top: -6px; }
.sec-edit-form.open { display: block; }
.sec-edit-actions { display: flex; gap: 8px; margin-top: 12px; }
.sec-title-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.sec-reviewed-toggle { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--green); text-transform: none; cursor: pointer; white-space: nowrap; }
.sec-reviewed-toggle input { accent-color: var(--green); }
.review-badge { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 20px; margin-right: 6px; white-space: nowrap; }
.review-badge.none { background: rgba(var(--orange-rgb),.13); color: var(--orange); }
.review-badge.partial { background: rgba(var(--orange-rgb),.13); color: var(--orange); }
.review-badge.ready { background: rgba(22,163,74,.14); color: var(--green); }
/* אלמנטים אופציונליים בטופס העריכה — מקופלים כברירת מחדל (אלא אם כבר קיים ערך), נפתחים בלחיצה,
   בדיוק כמו "+ הוסף עוד הטבה" בטפסי ההרשמה האמיתיים (business.html/business-dashboard.html) */
.edit-optional {
  border: 1px dashed var(--border-md); border-radius: 8px; padding: 10px 12px; margin: 10px 0; background: var(--card-bg);
}
.edit-optional summary {
  cursor: pointer; font-size: 12px; font-weight: 700; color: var(--text-sm); list-style: none;
}
.edit-optional summary::-webkit-details-marker { display: none; }
.edit-optional summary::before { content: '+ '; color: var(--accent); font-weight: 900; }
.edit-optional[open] summary::before { content: '− '; }
.edit-optional[open] summary { margin-bottom: 10px; }
.edit-optional select, .edit-optional textarea, .edit-optional input[type="text"] {
  width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-md);
  background: var(--nav-bg); color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px;
}
.edit-optional .edit-grid { margin-bottom: 0; }

/* כותרת שלב עם שינוי ממתין — תג כחול נפרד מציר reviewed (ירוק/כתום), כדי לא לערבב בין "האם נסקר" ל"יש בקשת שינוי" */
.title-change-badge {
  display: inline-block; font-size: 10px; font-weight: 800; color: #fff; background: var(--accent);
  padding: 2px 8px; border-radius: 9px; margin-inline-start: 8px; text-transform: none; letter-spacing: normal;
}
/* שדה עריכה ספציפי עם שינוי ממתין — מסגרת+רקע כתום עדין + רמז "היה: X" מתחתיו */
.edit-field.field-changed input, .edit-field.field-changed textarea, .edit-field.field-changed select {
  border-color: var(--orange); background: rgba(var(--orange-rgb),.06);
}
.field-change-hint { font-size: 10.5px; color: var(--orange); font-weight: 700; margin-top: 4px; }
/* הבהוב חד-פעמי כשקופצים אל שלב מתוך תקציר-השינויים למעלה — תגובה ויזואלית מיידית ללחיצה */
@keyframes jumpFlash { 0% { box-shadow: 0 0 0 3px rgba(37,99,235,.55); } 100% { box-shadow: 0 0 0 0 rgba(37,99,235,0); } }
.jump-flash { animation: jumpFlash 1.2s ease-out; border-radius: 10px; }

/* ── תקציר-שינויים בראש הכרטיס — כל מה שהעסק מבקש (דיף רגיל + הצעות תגית/קטגוריה), שורה לחיצה שקופצת לשלב ── */
.changes-summary {
  background: rgba(var(--orange-rgb),.06); border: 1.5px solid rgba(var(--orange-rgb),.3); border-radius: 10px;
  padding: 10px 12px; margin: 0 0 14px;
}
.changes-summary-title { font-size: 11.5px; font-weight: 800; color: var(--orange); margin-bottom: 8px; }
.changes-summary-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--card-bg); border: 1px solid var(--border-md); border-radius: 8px;
  padding: 8px 11px; margin-bottom: 6px; cursor: pointer; transition: border-color .12s;
}
.changes-summary-row:last-child { margin-bottom: 0; }
.changes-summary-row:hover { border-color: var(--accent); }
.changes-summary-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.changes-summary-label { font-size: 11.5px; font-weight: 800; color: var(--text); }
.changes-summary-detail { font-size: 11px; color: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.changes-summary-arrow { font-size: 13px; color: var(--accent); flex-shrink: 0; }

/* ── שיפוט מהיר — שלב 2ב (§7 במפרט): מחליף את .changes-summary כתקציר-לחיצה-בלבד. כל בקשה נשפטת
   בנפרד (אישור/דחייה/קפיצה), בלי "אישור כל הבקשות". אותה פלטת נספח-הצבעים כמו קוביות-הפילוח (2א). */
/* §147 — הותאם ל-handoff: box-shadow כמו שאר כרטיסי .dcard בעמוד (identity/anchor/steps), לא border שטוח */
.qj-card { background: var(--card-bg); box-shadow: 0 1px 3px rgba(16,24,40,.09); border-radius: 14px; overflow: hidden; margin-bottom: 14px; }
.qj-header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
.qj-toggle { width: 24px; height: 24px; flex: none; border: none; border-radius: 7px; background: var(--nav-bg); color: var(--text-sm); font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.qj-toggle:hover { background: var(--border-md); color: var(--text); }
.qj-title { font-size: 13.5px; font-weight: 800; cursor: pointer; }
.qj-count { background: var(--accent-bg); color: var(--accent); font-size: 11px; font-weight: 700; border-radius: 99px; padding: 2px 8px; }
.qj-count.empty { background: var(--nav-bg); color: var(--text-muted); }
.qj-hint { flex-basis: 100%; font-size: 11.5px; color: var(--text-sm); }
.qj-body { border-top: 1px solid var(--border); }
.qj-row { padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--border); }
.qj-row:first-child { border-top: none; }
.qj-row-label { flex: 0 0 150px; }
.qj-row-step { font-size: 10px; font-weight: 600; color: var(--text-sm); margin-bottom: 2px; }
.qj-row-name { font-size: 12.5px; font-weight: 700; }
.qj-row-value { flex: 1 1 200px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.qj-old { font-size: 11.5px; color: var(--text-sm); text-decoration: line-through; white-space: nowrap; }
.qj-arrow { color: var(--text-sm); font-size: 12px; }
.qj-input { flex: 1; min-width: 100px; height: 32px; padding: 0 9px; border: 1px solid var(--border-md); border-radius: 7px; background: var(--card-bg); font-size: 12.5px; font-weight: 700; }
.qj-value-text { font-size: 12.5px; font-weight: 600; }
.qj-structured { flex-direction: column; align-items: flex-start; gap: 6px; }
.qj-structured-old, .qj-structured-new { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.qj-value-hint { font-size: 10.5px; font-weight: 600; color: var(--text-sm); flex: none; }
.qj-photo-thumbs { display: flex; gap: 4px; flex-wrap: wrap; }
.qj-photo-thumbs img { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-md); }
.qj-row-actions { display: flex; gap: 5px; flex-wrap: wrap; }
.qj-btn { height: 28px; padding: 0 10px; border: 1px solid var(--border-md); border-radius: 7px; background: var(--card-bg); color: var(--text-sm); font-size: 11px; font-weight: 700; cursor: pointer; }
.qj-btn:hover { background: var(--nav-bg); }
/* צהוב, לא כחול — לפי §1 במפרט: "שדה כתיבת הערה עם כפתור צהוב הוספה ליומן". פעולה-ראשית = צהוב,
   כחול נשאר למיון/מידע (ר' הכלל ב-:root). */
.qj-btn.primary { background: var(--accent-cta); color: var(--accent-cta-ink); border-color: var(--accent-cta); font-weight: 800; }
.qj-btn.primary:hover { background: var(--accent-cta-hover); border-color: var(--accent-cta-hover); }
.qj-btn.reject:hover { color: var(--orange); }
.qj-btn.link { border: none; background: transparent; color: var(--accent); padding: 0 4px; }
.qj-btn.link:hover { text-decoration: underline; }
.qj-note-row { padding: 11px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--border); }
.qj-note-text { flex: 1; min-width: 220px; font-size: 12.5px; padding-inline-start: 10px; border-inline-start: 2px solid var(--accent-cta); line-height: 1.5; }
/* אשר/דחה-את-הבקשה-כולה — עברו לכאן מ-statusActions (§130), פעולה-ראשית=צהוב לפי אותה מוסכמה כמו .qj-btn.primary */
.qj-header-actions { margin-inline-start: auto; display: flex; gap: 6px; align-items: center; }
.qj-btn-approve-app { height: 32px; padding: 0 14px; border-radius: 8px; background: var(--accent-cta); color: var(--accent-cta-ink); font-size: 12px; font-weight: 800; border: none; cursor: pointer; }
.qj-btn-approve-app:hover { background: var(--accent-cta-hover); }
.qj-btn-reject-app { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border-md); background: var(--card-bg); color: var(--text-sm); font-size: 12px; font-weight: 700; cursor: pointer; }
.qj-btn-reject-app:hover { border-color: var(--red); color: var(--red); }

/* ── יומן פעילות (שלב 2ג, §1 במפרט) — ציר-זמן, כחול מלא = מנהל אישר/דחה, כחול-בהיר = נגזר-אוטומטית,
   צהוב = הערת-מנהל חופשית, לפי כלל-הצבע (הנקודה, לא הרקע — היומן עצמו לבן/ניטרלי כל השאר). */
.activity-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
.activity-card-title { font-size: 13.5px; font-weight: 800; margin-bottom: 2px; }
.activity-card-sub { font-size: 11.5px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.5; }
.activity-note-row { display: flex; gap: 8px; margin-bottom: 6px; }
.activity-note-input { flex: 1; min-height: 50px; padding: 9px 10px; border: 1px solid var(--border-md); border-radius: 8px; background: var(--card-bg); font-size: 12.5px; font-family: 'Heebo', sans-serif; line-height: 1.5; resize: vertical; }
.activity-note-hint { font-size: 11px; color: var(--text-muted); margin-bottom: 12px; }
.activity-timeline { display: flex; flex-direction: column; }
.activity-row { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); }
.activity-row:first-child { border-top: none; }
.activity-dot { width: 8px; height: 8px; border-radius: 99px; flex: none; margin-top: 5px; border: 1px solid var(--border-md); }
.activity-row-body { min-width: 0; }
.activity-row-title { font-size: 12.5px; font-weight: 700; }
.activity-row-detail { font-size: 11.5px; color: var(--text-sm); margin-top: 2px; }
.activity-row-meta { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }

/* §147 — "החלטות על העסק" (handoff: "1 כרטיס עסק.dc.html" שורות 666-813) — פאנל כחול-כהה. נוסה
   קודם כעמודה שלישית קבועה (sticky) — המשתמש: "מצמצם לי את הנראות על העסק, לא נוח" — הוחלף לטאב
   בתוך עמודת-הפרטים עצמה (ר' bizDetailViewTab/bizDetailTabsHtml), לא עמודה נפרדת. משתמש-מחדש
   ב-.activity-* הקיימים (בדיוק אותה לוגיקה/דאטה, fetchBizActivity/addBizActivityNote) — רק
   override-ים ל-CSS כשהם בתוך .decision-panel, כדי לא לשנות את מראה היומן במסכים אחרים בלי אישור.*/
.decision-panel { background: var(--accent); border-radius: 14px; overflow: hidden; color: #fff; }
.decision-panel-pad { padding: 17px 18px 15px; }
.decision-panel-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: #9BB0D9; margin-bottom: 11px; }
.decision-progress-row { display: flex; align-items: center; gap: 10px; }
.decision-progress-text { font-size: 12.5px; color: #C9D6EE; flex: 1; line-height: 1.5; }
.decision-hint-text { font-size: 12.5px; color: #C9D6EE; line-height: 1.55; margin-bottom: 13px; }
/* תמונת-הוכחה של אוהד — כרטיס "פרטי ההרשמה" (תואם-handoff, 2026-08-04) */
.fan-proof-photo {
  display: block; width: 190px; height: 118px; border-radius: 10px; background-color: var(--nav-bg);
  background-size: cover; background-position: center; cursor: pointer;
}
.fan-proof-photo.empty { display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 600; color: var(--text-muted); cursor: default; }
.decision-progress-bars { display: flex; gap: 3px; }
.decision-progress-bar { width: 16px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.25); }
.decision-progress-bar.done { background: var(--accent-cta); }
.decision-divider { height: 1px; background: rgba(255,255,255,.14); }
.decision-panel .activity-card { background: transparent; border: none; border-radius: 0; padding: 15px 18px 16px; margin-bottom: 0; }
.decision-panel .activity-card-title { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
.decision-panel .activity-note-row { flex-direction: column; align-items: stretch; gap: 7px; margin-top: 10px; }
.decision-panel .activity-note-input {
  height: auto; min-height: 50px; padding: 9px 11px; border: 1px solid rgba(255,255,255,.22); border-radius: 9px;
  background: rgba(255,255,255,.06); color: #fff; font-family: 'Heebo', sans-serif; line-height: 1.5;
}
.decision-panel .activity-note-input::placeholder { color: #9BB0D9; }
.decision-panel .qj-btn.primary { background: var(--accent-cta); color: var(--accent); align-self: flex-start; }
.decision-panel .activity-row { border-top: 1px solid rgba(255,255,255,.14); }
.decision-panel .activity-dot { border-color: rgba(255,255,255,.3); }
.decision-panel .activity-row-title { color: #fff; }
.decision-panel .activity-row-detail { color: #C9D6EE; }
.decision-panel .activity-row-meta { color: #9BB0D9; }
.decision-panel .qj-btn.link { color: #fff; text-decoration: underline; }
.decision-panel .activity-card-sub { color: #9BB0D9; }
.decision-panel .activity-note-hint { color: #9BB0D9; }
/* עדיין-לא-נסקר/מחק/סימונים/תאריכים — הועברו מ"פרטי העסק" (§148, 2026-08-04), צריכים ניגודיות על נייבי */
.decision-meta-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.decision-panel .approve-field-label { color: #9BB0D9; }
.decision-panel .approve-longtext { color: #fff; }
.decision-panel .edit-section-title { color: #fff; border-bottom-color: rgba(255,255,255,.14); }
.decision-panel .act-btn.reject { border-color: rgba(255,255,255,.25); color: #fff; }
.decision-panel .act-btn.reject:hover { background: rgba(255,255,255,.08); }
.decision-remove-btn {
  width: 100%; height: 36px; margin-top: 13px; border: 1px solid rgba(255,255,255,.25); border-radius: 9px;
  background: transparent; color: #fff; font-family: 'Heebo', sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.decision-remove-btn:hover { background: rgba(255,255,255,.08); }

.diff-row { background: var(--nav-bg); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; }
.diff-row.clickable { cursor: pointer; transition: background .15s; }
.diff-row.clickable:hover { background: rgba(var(--accent-rgb),.09); }
.diff-row-hint { font-size: 10.5px; color: var(--accent); font-weight: 700; margin-top: 4px; }
.diff-label { font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 5px; }
.diff-old { font-size: 12px; color: var(--red); text-decoration: line-through; opacity: .8; }
.diff-new { font-size: 12px; color: var(--green); font-weight: 700; margin-top: 2px; }
.pending-edit-input {
  width: 100%; margin-top: 4px; padding: 6px 8px; border-radius: 6px; font-family: 'Heebo', sans-serif;
  font-size: 12px; font-weight: 700; color: var(--green); background: var(--bg-main); border: 1.5px solid var(--green);
}

.broadcast-body-input {
  width: 100%; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--border-md);
  background: var(--nav-bg); color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px;
  line-height: 1.7; margin-bottom: 10px; resize: vertical;
}
.broadcast-actions { display: flex; gap: 10px; margin-bottom: 8px; }
.broadcast-test-row { display: flex; gap: 8px; margin-bottom: 10px; }
.broadcast-test-row input { flex: 1; max-width: 280px; height: 34px; padding: 0 10px; border: 1px solid var(--border-md); border-radius: 8px; background: var(--card-bg); font-size: 12.5px; }
.broadcast-audience-toggle { display: flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; width: fit-content; margin-bottom: 14px; }

/* ── מרכז הודעות — כותרת-עמוד (breadcrumb+KPI) ועמודה-צדדית כהה-נייבי להיסטוריית-שידורים (§139).
   scoped למרכז-הודעות בלבד (msg-content-head/msg-layout) — לא content-head/content-body גנריים,
   כי אלה עדיין לא קיימים בשום טאב אחר (החלטה חוצת-כל-הטאבים נפרדת, ר' §136). ── */
.msg-content-head { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
.msg-crumb { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; display: flex; align-items: center; gap: 7px; }
.msg-crumb a { color: var(--accent); font-weight: 600; cursor: pointer; }
.msg-crumb a:hover { text-decoration: underline; }
.msg-page-title { font-size: 23px; font-weight: 700; letter-spacing: -0.02em; }
.msg-kpis { display: flex; gap: 26px; align-items: flex-end; }
.msg-kpi-num { font-size: 21px; font-weight: 700; line-height: 1.1; }
.msg-kpi-unit { font-size: 12px; font-weight: 500; color: var(--text-muted); }
.msg-kpi-label { font-size: 11.5px; font-weight: 500; color: var(--text-muted); margin-top: 2px; }
.msg-kpi-sep { width: 1px; height: 34px; background: var(--border); }
.msg-layout { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 18px; align-items: start; }
.msg-col-main { min-width: 0; }
.msg-col-side { position: sticky; top: 16px; min-width: 0; }
@media (max-width: 860px) { .msg-layout { grid-template-columns: 1fr; } .msg-col-side { position: static; } }
.history-card { background: var(--accent); border-radius: 14px; overflow: hidden; color: #fff; }
.history-head { padding: 16px 18px 14px; }
.history-kicker { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: rgba(255,255,255,.6); margin-bottom: 4px; }
.history-title { font-size: 14.5px; font-weight: 700; }
.history-sep { height: 1px; background: rgba(255,255,255,.14); }
.history-item { padding: 13px 18px; display: flex; flex-direction: column; gap: 4px; }
.history-item .subj { font-size: 12.5px; font-weight: 600; }
.history-item .meta { font-size: 11.5px; color: rgba(255,255,255,.75); }
.history-item .stats-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.history-item .stat { font-size: 11.5px; color: rgba(255,255,255,.6); }
.history-item .actor { font-size: 11px; color: rgba(255,255,255,.6); }
.btn-retry { height: 24px; padding: 0 8px; border: 1px solid var(--accent-cta); border-radius: 6px; color: var(--accent-cta); font-size: 11px; font-weight: 600; background: transparent; cursor: pointer; }
.btn-retry:hover { background: rgba(255,212,0,.12); }
.btn-retry:disabled { opacity: .5; cursor: default; }
.broadcast-audience-toggle .filter-pill { border: none; border-radius: 0; background: var(--card-bg); color: var(--text-sm); padding: 8px 14px; font-size: 12.5px; font-weight: 500; }
.broadcast-audience-toggle .filter-pill.active { background: var(--accent); color: #fff; font-weight: 600; }
.broadcast-audience-toggle .filter-pill:not(:last-child) { border-inline-end: 1px solid var(--border); }

/* ── מרכז הודעות — מקטעים ניתנים לקיפול (שידור המוני / הודעה בודדת), במקום טופס פתוח תמיד.
   סגנון-קופסה עודכן ל-dcard (רדיוס-14+צל) כמו שאר הכרטיסים החדשים בכרטיס-עסק/אוהד (§127-135) —
   לא נגעתי בלוגיקת-הקיפול/שליחה עצמה, רק בעטיפה החזותית. ── */
.msg-section { border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09); background: var(--card-bg); margin-bottom: 12px; overflow: hidden; }
.msg-section-body { padding: 16px 20px 18px; border-top: 1px solid var(--border-md); }
.spacer { flex: 1; }
.card-head { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; padding: 15px 20px 13px; }
.card-head-title { font-size: 15px; font-weight: 700; }
.seg { display: flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
.seg > div { padding: 7px 13px; font-size: 12px; font-weight: 600; background: var(--card-bg); color: var(--text-sm); cursor: pointer; }
.seg > div:not(:last-child) { border-inline-end: 1px solid var(--border); }
.seg > div.on { background: var(--accent); color: #fff; }
.msg-group-label { font-size: 12.5px; font-weight: 800; color: var(--text-sm); margin: 22px 2px 4px; display: flex; align-items: baseline; gap: 8px; }
.msg-group-label .hint { font-size: 11px; color: var(--text-muted); font-weight: 400; }
.msg-group-label:first-child { margin-top: 0; }

/* ── בורר קהל inline (checkboxes) — בתוך .picker/.picker-list הקיימים, רק שורה+תיבת-סימון משלה ── */
/* label שלם (לא רק ה-checkbox) הוא היעד ללחיצה — קליק בכל מקום בשורה מסמן/מבטל, native checkbox
   כדי שיהיה חד-משמעית ברור וניתן-ללחיצה (בלי תלות ב-onclick על div מותאם-אישית). */
.aud-picker-row {
  display: flex; align-items: center; gap: 9px; padding: 7px 6px; border-radius: 8px; cursor: pointer;
  font-size: 12.5px; user-select: none;
}
.aud-picker-row:hover { background: rgba(var(--accent-rgb),.05); }
.aud-picker-row input[type="checkbox"] { flex-shrink: 0; width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
.selected-recipient-row {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 8px 10px; border-radius: 8px;
  background: var(--nav-bg); margin-bottom: 6px; font-size: 12.5px;
}
.selected-recipient-row .nm { font-weight: 700; flex: 1; }
.picker-note-hint { flex-basis: 100%; font-size: 11.5px; color: var(--accent); font-weight: 600; }
.aud-chips-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
.aud-chip {
  display: flex; align-items: center; gap: 6px; background: var(--card-bg); border: 1px solid var(--border-md);
  border-radius: 20px; padding: 5px 6px 5px 10px; font-size: 12px; font-weight: 700; color: var(--text);
}
.aud-chip button {
  border: none; background: rgba(var(--accent-rgb),.08); border-radius: 50%; width: 16px; height: 16px; font-size: 10px;
  cursor: pointer; color: var(--text-sm); display: flex; align-items: center; justify-content: center; padding: 0;
}
.tpl-vars-box { font-size: 11px; color: var(--text-muted); margin: 0 0 10px; }
.tpl-vars-box code { background: rgba(var(--accent-rgb),.08); color: var(--accent); padding: 1px 6px; border-radius: 5px; font-family: monospace; }

/* ── עמוד "התבניות הקבועות" — §137 המשך, tpl-row/tpl-detail במקום chain-block/chain-label ── */
.tpl-filters { padding: 15px 20px 13px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.tpl-filter { padding: 5px 11px; border-radius: 99px; font-size: 12px; font-weight: 500; background: var(--card-bg); border: 1px solid var(--border); color: var(--text-sm); cursor: pointer; }
.tpl-filter.on { background: var(--text); color: #fff; border-color: var(--text); font-weight: 600; }
.tpl-filter:hover:not(.on) { background: var(--nav-bg); }
.tpl-list { border-top: 1px solid var(--border-md); display: flex; flex-direction: column; gap: 1px; background: var(--border); margin-top: 10px; }
.tpl-row { padding: 13px 20px; background: var(--card-bg); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; cursor: pointer; }
.tpl-row:hover { background: var(--nav-bg); }
.tpl-row .name { font-size: 13.5px; font-weight: 600; }
.tpl-row .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.tpl-badge { font-size: 10.5px; font-weight: 600; border-radius: 6px; padding: 2px 8px; flex-shrink: 0; }
.tpl-badge.auto { background: var(--accent-bg); color: var(--accent); }
.tpl-badge.manual { background: var(--nav-bg); color: var(--text-sm); }
.tpl-vars { flex: 0 0 128px; font-size: 11.5px; color: var(--text-muted); }
.tpl-chev { font-size: 15px; color: var(--text-muted); flex-shrink: 0; }
.tpl-detail { padding: 15px 20px 18px; background: var(--nav-bg); }
.tpl-detail-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(210px,1fr)); gap: 12px; margin-bottom: 13px; }
.tpl-detail-card { background: var(--card-bg); border-radius: 10px; padding: 11px 13px; }
.tpl-detail-card .h { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 3px; }
.tpl-detail-card .v { font-size: 12.5px; color: var(--text-sm); line-height: 1.5; }
/* תצוגה מקדימה של שידור (שלב 5א) */
/* מעטפת-מייל מדומה (§149, תואם-handoff) — "מייל" לבן עם מסגרת בתוך רקע-אפור, במקום קופסת-טקסט שטוחה */
.broadcast-preview { background: var(--nav-bg); border-radius: 11px; padding: 15px 16px; margin: 10px 0 14px; }
.broadcast-preview-label { font-size: 12px; font-weight: 700; margin-bottom: 10px; }
.broadcast-preview-envelope { background: var(--card-bg); border: 1px solid var(--border-md); border-radius: 10px; overflow: hidden; }
.broadcast-preview-head { padding: 11px 14px; border-bottom: 1px solid var(--border-md); }
.broadcast-preview-meta { font-size: 11px; color: var(--text-sm); }
.broadcast-preview-subject { font-size: 13.5px; font-weight: 700; margin-top: 4px; }
.broadcast-preview-body { padding: 14px; font-size: 13px; color: var(--text); line-height: 1.7; white-space: pre-wrap; }
.broadcast-preview-note { margin-top: 9px; font-size: 11.5px; color: var(--text-sm); }
.broadcast-preview-empty { font-size: 12px; color: var(--text-muted); margin: 4px 0 14px; }
.aud-summary { font-size: 12px; color: var(--text-sm); margin-bottom: 10px; line-height: 1.6; }

.health-toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.health-list { display: flex; flex-direction: column; gap: 7px; }
.health-row {
  display: flex; align-items: center; gap: 12px; background: var(--card-bg); border: 1px solid var(--border-md);
  border-radius: 10px; padding: 9px 13px; cursor: pointer; transition: border-color .12s;
}
.health-row:hover { border-color: var(--accent); }
.health-info { width: 190px; flex-shrink: 0; overflow: hidden; }
.health-name { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.health-missing { font-size: 10.5px; color: var(--orange); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.health-missing.ok { color: var(--green); }
.health-bar-track { flex: 1; height: 8px; border-radius: 5px; background: var(--nav-bg); overflow: hidden; }
.health-bar-fill { height: 100%; border-radius: 5px; background: var(--green); }
.health-bar-fill.low { background: var(--orange); }
.health-pct { font-size: 12px; font-weight: 800; width: 38px; text-align: left; flex-shrink: 0; }
.health-pct.low { color: var(--orange); }

/* ── ניהול תגיות — תור בקשות ממתינות מרוכז + רשימת תגיות לפי קטגוריה (§140, dcard-style
   כמו כל שאר הכרטיסים החדשים — קופסה-בודדת-פר-פריט הוחלפה ברשימה-מחוברת, אותה לוגיקה/onclick). ── */
.tagmgmt-queue-wrap { border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09); background: var(--card-bg); overflow: hidden; margin-bottom: 12px; }
.tagmgmt-queue-head { padding: 15px 20px 13px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tagmgmt-section { padding: 0; overflow: hidden; margin-bottom: 18px; }
.tagmgmt-catalog-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
.tagmgmt-queue-list { border-top: 1px solid var(--border-md); display: flex; flex-direction: column; gap: 1px; background: var(--border); }
.tagmgmt-queue-card {
  background: var(--card-bg); border: none; border-radius: 0;
  padding: 13px 20px; display: flex; align-items: center; gap: 12px; margin-bottom: 0; flex-wrap: wrap;
}
.tagmgmt-queue-main { flex: 1; min-width: 200px; }
.tagmgmt-queue-name { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tagmgmt-queue-desc { font-size: 11.5px; color: var(--text-sm); margin-top: 3px; }
.tagmgmt-queue-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
.tagmgmt-cat-card {
  background: var(--card-bg); border: none; border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09); padding: 0; margin-bottom: 12px; overflow: hidden;
}
.tagmgmt-cat-head { font-size: 15px; font-weight: 700; padding: 15px 20px 13px; display: flex; align-items: center; gap: 8px; }
.tagmgmt-cat-body { padding: 0 20px 18px; }
.tagmgmt-tag-row { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--border); }
.tagmgmt-tag-row:last-of-type { border-bottom: none; }
.tagmgmt-tag-name { font-size: 12.5px; font-weight: 700; }
.tagmgmt-tag-count {
  font-size: 11px; color: var(--text-sm); white-space: nowrap; border: none; background: rgba(var(--accent-rgb),.06);
  border-radius: 20px; padding: 3px 10px; cursor: pointer; font-family: 'Heebo', sans-serif; font-weight: 700;
}
.tagmgmt-tag-count:hover { background: rgba(var(--accent-rgb),.13); }
.tagmgmt-tag-count.zero { color: var(--orange); font-weight: 800; cursor: default; background: rgba(var(--orange-rgb),.1); }
.tagmgmt-usage-list { margin: 2px 0 8px; padding-right: 4px; }
.tagmgmt-usage-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px;
  padding: 6px 10px; border-radius: 7px; cursor: pointer; color: var(--text-sm);
}
.tagmgmt-usage-item:hover { background: rgba(var(--accent-rgb),.05); color: var(--text); }
.tagmgmt-usage-arrow { color: var(--accent); font-size: 12px; }
.tagmgmt-tag-actions { display: flex; gap: 5px; flex-shrink: 0; }
.tagmgmt-text-btn {
  height: 29px; padding: 0 11px; border: 1px solid var(--border-md); border-radius: 8px; background: var(--card-bg);
  color: var(--text); font-family: 'Heebo', sans-serif; font-size: 11.5px; font-weight: 600; cursor: pointer; flex-shrink: 0; white-space: nowrap;
}
.tagmgmt-text-btn:hover { background: var(--nav-bg); }
.tagmgmt-text-btn.danger { color: var(--orange); }
.tagmgmt-inline-form { display: flex; gap: 6px; align-items: center; flex: 1; flex-wrap: wrap; }
.tagmgmt-inline-form input, .tagmgmt-inline-form select {
  padding: 6px 9px; border-radius: 7px; border: 1px solid var(--border-md); background: var(--nav-bg); color: var(--text);
  font-family: 'Heebo', sans-serif; font-size: 12.5px;
}
.tagmgmt-add-row { display: flex; gap: 6px; margin-top: 8px; }
.tagmgmt-add-row input { flex: 1; }

.roadmap-panel {
  background: var(--card-bg2); border: 1px dashed var(--border-md); border-radius: 12px; padding: 14px 16px; margin-top: 24px;
}
.roadmap-title { font-size: 12px; font-weight: 800; color: var(--text-sm); margin-bottom: 8px; }
.roadmap-list { font-size: 12px; color: var(--text-muted); line-height: 2; }

/* ── מרכז המשימות — Master-Detail (רשימה מימין, פרטים משמאל) ── */
.task-split { display: flex; gap: 14px; align-items: flex-start; }
.task-list-col {
  /* הרשימה מכילה שורות קצרות (שם+מטא) שלא צריכות הרבה רוחב — עדיף לתת את רוב השטח לכרטיס הפרטים,
     ששם יש הרבה תוכן ובלעדיו נוצרת גלילה מיותרת. לא 50/50 — נוסה וגם נראה ריק מדי בפועל בצילום מסך.
     גובה נמתח עד תחתית המסך (לא 640px קבוע) + sticky כדי שתמיד יראו כמה שיותר שורות בלי לגלול את כל הדף.
     §147 — הותאם ל-handoff: כרטיס-לבן מאוחד אחד (רקע+צל+פינות), לא פילטרים-מנותקים+שורות-חשופות. */
  flex: 0 0 32%; max-width: 32%; max-height: calc(100vh - 40px); overflow-y: auto;
  position: sticky; top: 20px;
  background: var(--card-bg); border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09);
  padding: 14px 14px 10px;
}
.task-list-rows { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
.task-detail-col { flex: 1; min-width: 0; }
.task-row {
  padding: 12px 4px; border-top: 1px solid var(--border); border-right: 3px solid transparent;
  cursor: pointer; transition: background .12s;
}
.task-row:first-child { border-top: none; }
.task-row:hover { background: rgba(var(--accent-rgb),.03); }
.task-row.active { background: rgba(var(--accent-rgb),.07); border-right-color: var(--accent); }
.task-row.rejected { opacity: .65; }
.task-row-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.task-row-check {
  flex-shrink: 0; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border-md);
  display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--accent); cursor: pointer;
}
.task-row.selected .task-row-check { border-color: var(--accent); background: rgba(var(--accent-rgb),.08); }
.task-row-name { font-size: 13.5px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-row-progress { font-size: 11px; font-weight: 600; color: var(--text-sm); flex-shrink: 0; }
.task-row-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
.task-row-meta { font-size: 11px; color: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* חזרה מוסתרת בדסקטופ (בכל 3 ההקשרים — דשבורד/כל העסקים/כל האוהדים): הרשימה תמיד גלויה לצד הכרטיס
   ב-Master-Detail, אז יש כבר איך לעבור לפריט אחר בלי כפתור ייעודי. גלויה רק במובייל, ר' מדיה-קוורי,
   כי שם רשימה+פרטים מתחלפות (רק אחת גלויה בכל רגע) וזו הדרך היחידה לחזור. */
.task-back-btn { display: none; margin-bottom: 10px; }
@media (max-width: 860px) {
  .task-split { flex-direction: column; align-items: stretch; }
  .task-list-col, .task-detail-col { max-width: 100%; flex: 1 1 auto; }
  /* במובייל רשימה+פרטים מתחלפות (לא זו-לצד-זו) — sticky/מתיחה-לגובה-מסך לא רלוונטיים שם, הדף עצמו גולל רגיל */
  .task-list-col { position: static; max-height: none; }
  .task-split:not(.mobile-show-detail) .task-detail-col { display: none; }
  .task-split.mobile-show-detail .task-list-col { display: none; }
  .task-back-btn { display: inline-flex; }
}

/* ── מרכז המשימות — 4 קוביות פילוח מקבילות + רשימה מאוחדת עסקים+אוהדים (שלב 2, classifyAction) ──
   פלטת נספח-הצבעים מהמפרט (§4/§13, "2 מרכז המשימות.dc.html"). שלב 8 (עקביות רוחבית) כבר הפך את
   --accent הכללי לאותו כחול-מותג בדיוק — ה-hex-ים הקשיחים כאן הוחלפו ב-var() בהתאם. */
.class-tiles { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 16px; }
.class-tile { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; cursor: pointer; transition: box-shadow .15s, border-color .15s; }
.class-tile:hover { box-shadow: 0 2px 8px rgba(16,24,40,.09); }
.class-tile.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(var(--accent-rgb),.15); }
.class-tile.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.class-tile-top { display: flex; align-items: baseline; gap: 8px; }
.class-tile-num { font-size: 24px; font-weight: 800; line-height: 1; }
.class-tile-label { font-size: 12.5px; font-weight: 700; flex: 1; }
.class-tile.primary .class-tile-label { color: #fff; }
.class-tile:not(.primary) .class-tile-label { color: var(--text); }
.class-tile-sub { margin-top: 8px; font-size: 11px; color: var(--text-sm); line-height: 1.5; min-height: 16px; }
.class-tile.primary .class-tile-sub { color: #C9D6EE; }
.class-tile-chips { margin-top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
.class-badge { display: inline-block; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.class-badge.neutral { background: var(--border-md); color: var(--text-sm); }
.treat-badge { display: inline-block; background: var(--accent-bg); color: var(--accent); font-size: 10px; font-weight: 700; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.warn-badge { display: inline-block; background: var(--warn-bg); color: var(--orange); font-size: 10px; font-weight: 700; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.class-badge.lg, .treat-badge.lg, .warn-badge.lg { font-size: 11.5px; border-radius: 7px; padding: 3px 10px; }

/* ── כרטיס-זהות (ראש כרטיס-מלא — עסק/אוהד) — סגנון dcard כללי, לשימוש חוזר בכרטיסים הבאים (מיקום/שיפוט-מהיר/שלבים) ── */
.dcard { background: var(--card-bg); border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09); padding: 22px 24px; margin-bottom: 12px; }
.identity-top { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.identity-badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.identity-dates { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
.identity-name { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.identity-name-row { display: flex; align-items: center; gap: 8px; }
.identity-name-edit-btn { border: none; background: none; cursor: pointer; font-size: 15px; opacity: .55; padding: 2px 4px; flex: none; }
.identity-name-edit-btn:hover { opacity: 1; }
.identity-name-edit { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.identity-name-edit input { height: 34px; padding: 0 10px; border: 1px solid var(--border-md); border-radius: 8px; background: var(--card-bg); font-size: 18px; font-weight: 700; min-width: 200px; }
.identity-contact { margin-top: 9px; font-size: 13.5px; color: var(--text-sm); }
.identity-contact .k { color: var(--text); }
.identity-tags { margin-top: 12px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); }
.identity-actions { display: flex; flex-direction: column; gap: 8px; min-width: 172px; }
.identity-actions-row { display: flex; gap: 8px; }
.btn-id-wa { flex: 1; height: 36px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; padding: 0 12px; }
.btn-id-wa:hover { background: var(--accent-dark); }
.btn-id-mail { flex: 1; height: 36px; border: 1px solid var(--accent); border-radius: 9px; background: var(--card-bg); color: var(--accent); font-size: 13px; font-weight: 600; padding: 0 12px; }
.btn-id-mail:hover { background: var(--accent-bg); }
.btn-id-dash { height: 36px; border: 1px solid var(--border); border-radius: 9px; background: var(--card-bg); color: var(--text-sm); font-size: 13px; font-weight: 600; padding: 0 14px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn-id-dash:hover { background: var(--nav-bg); }
.identity-notes { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border-md); display: flex; gap: 10px; flex-wrap: wrap; }
.identity-note { flex: 1; min-width: 150px; border-radius: 10px; padding: 11px 13px; }
.identity-note.warn { background: var(--warn-bg); }
.identity-note.neutral { background: var(--nav-bg); }
.identity-note-h { font-size: 11px; font-weight: 600; margin-bottom: 3px; }
.identity-note.warn .identity-note-h { color: var(--orange); }
.identity-note.neutral .identity-note-h { color: var(--text-muted); }
.identity-note-v { font-size: 12.5px; color: var(--text-sm); line-height: 1.5; }

/* ── כרטיס "המיקום באינדקס" — עיגונים + סימוני-סקשן, שלב 2 חלק ב׳ (§128) ── */
.anchor-card { padding: 0; overflow: hidden; }
.owner-verify-step { padding: 0; overflow: hidden; }
.anchor-head { padding: 15px 22px 13px; display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
.anchor-head-title { font-size: 14.5px; font-weight: 700; }
.anchor-list { border-top: 1px solid var(--border-md); display: flex; flex-direction: column; gap: 1px; background: var(--border); }
.anchor-row { padding: 12px 22px; background: var(--card-bg); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.anchor-row-label { flex: 0 0 132px; }
.anchor-row-section { font-size: 10.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
.anchor-row-pos { font-size: 13.5px; font-weight: 600; }
.anchor-row-detail { flex: 1 1 210px; min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--text-sm); }
.anchor-mode-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex: none; }
.anchor-mode-btn { padding: 6px 11px; border: none; background: var(--card-bg); color: var(--text-sm); font-family: 'Heebo', sans-serif; font-size: 11.5px; font-weight: 500; cursor: pointer; }
.anchor-mode-btn:hover { background: var(--nav-bg); }
.anchor-mode-btn.active { background: var(--accent); color: #fff; font-weight: 600; }
.anchor-actions { display: flex; gap: 5px; flex-wrap: wrap; }
.btn-anchor-row { height: 29px; padding: 0 10px; display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--card-bg); color: var(--text-sm); font-size: 11.5px; font-weight: 600; }
.btn-anchor-row:hover { background: var(--nav-bg); }
.btn-anchor-remove { height: 29px; padding: 0 10px; border-radius: 8px; color: var(--text-sm); font-size: 11.5px; font-weight: 600; background: transparent; border: none; cursor: pointer; }
.btn-anchor-remove:hover { color: var(--red); }
.flag-grid { border-top: 1px solid var(--border-md); padding: 15px 22px 18px; display: grid; grid-template-columns: repeat(auto-fit,minmax(215px,1fr)); gap: 12px; }
.flag-box { border-radius: 10px; padding: 12px 13px; }
.flag-box.neutral { background: var(--nav-bg); }
.flag-box.warn { background: var(--warn-bg); }
.flag-box-h { font-size: 11px; font-weight: 600; margin-bottom: 7px; }
.flag-box.neutral .flag-box-h { color: var(--text-muted); }
.flag-box.warn .flag-box-h { color: var(--orange); }
.flag-box-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.flag-box-val { font-size: 12.5px; font-weight: 600; }
.flag-box-sub { font-size: 11.5px; color: var(--text-muted); }
.btn-flag-remove { height: 27px; padding: 0 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--card-bg); color: var(--text-sm); font-size: 11px; font-weight: 600; }
.btn-flag-remove:hover { background: var(--nav-bg); }
.hearts-num { font-size: 12.5px; font-weight: 700; }
.hearts-edit { margin-top: 8px; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.hearts-edit input[type=number] { height: 28px; padding: 0 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--card-bg); font-size: 12px; }
.hearts-edit input[type=number]:first-child { width: 66px; font-weight: 600; }
.hearts-edit input[type=number]:nth-child(2) { width: 62px; }
.btn-hearts-update { height: 28px; padding: 0 10px; border-radius: 7px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; border: none; cursor: pointer; }
.btn-hearts-update:hover { background: var(--accent-dark); }
.btn-hearts-reset { height: 28px; padding: 0 9px; border-radius: 7px; color: var(--text-sm); font-size: 11px; font-weight: 600; background: transparent; border: none; cursor: pointer; }
.btn-hearts-reset:hover { color: var(--red); }

/* ── כרטיס "5 השלבים" — שלב 2 חלק ד׳ (§131), שלב-אחר-שלב. כרגע רק שלב 1 ממומש בסגנון הזה,
   שלבים 2-5 עדיין בסגנון-הישן (edit-section-title/sec-edit-form) עד שיומרו בתורם. ── */
.steps-card { padding: 0; overflow: hidden; }
.steps-head { padding: 17px 24px 15px; display: flex; align-items: center; gap: 12px; }
.steps-head-title { font-size: 15px; font-weight: 700; flex: 1; }
.steps-head-hint { font-size: 12px; color: var(--text-muted); }
/* טאבים "ביקורת ואישור"/"כל מה שהעסק מילא" בראש כרטיס 5-השלבים (תואם-handoff, 2026-08-04) */
.steps-tabs { padding: 0 24px; display: flex; align-items: center; gap: 24px; border-bottom: 1px solid var(--border-md); }
.steps-tab { padding: 17px 0 14px; font-size: 14.5px; font-weight: 500; color: var(--text-sm); background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.steps-tab.active { color: var(--text); font-weight: 700; border-bottom-color: var(--accent); }
/* כרטיס "אימות בעל העסק" עשיר (תואם-handoff, 2026-08-04) — מציג תמונת-הוכחה+פרטי-מנוי+פייסבוק+3
   כפתורי-החלטה, במקום שורת-סיכום פשוטה. שדה חדש ownerVerificationStatus (ר' setOwnerVerification) —
   לא היה קיים בסכימה קודם, נוסף כאן כדי לתעד את ההחלטה בלי לגעת בזרימת האישור/דחייה של העסק כולו. */
.owner-verify-card { margin: 0 24px 20px; border: 1px solid var(--border-md); border-radius: 12px; overflow: hidden; display: flex; flex-wrap: wrap; }
.owner-verify-photo { flex: 0 0 232px; background: #101828; position: relative; min-height: 180px; display: flex; align-items: center; justify-content: center; }
.owner-verify-photo img { width: 100%; height: 100%; min-height: 180px; object-fit: cover; }
.owner-verify-photo-empty { color: #98A2B3; font-size: 12px; font-weight: 600; padding: 20px; text-align: center; }
.owner-verify-info { flex: 1 1 300px; min-width: 0; padding: 16px 18px; display: flex; flex-direction: column; gap: 13px; }
.owner-verify-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(118px,1fr)); gap: 13px; }
.owner-verify-fb { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; padding-top: 13px; border-top: 1px solid var(--border-md); }
.owner-verify-fb a { font-size: 12.5px; font-weight: 600; color: var(--accent); }
.owner-verify-hint { background: var(--nav-bg); border-radius: 9px; padding: 9px 11px; font-size: 12px; color: var(--text-sm); line-height: 1.5; }
.owner-verify-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: auto; }
/* "כל מה שהעסק מילא" — תצוגת-קריאה */
.form-summary-toolbar { padding: 14px 24px; background: var(--nav-bg); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--border-md); }
.form-summary-note { flex: 1; min-width: 220px; font-size: 12.5px; color: var(--text-sm); line-height: 1.5; }
.form-summary-check { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--text); cursor: pointer; user-select: none; }
.form-summary-body { padding: 4px 24px 20px; }
.form-sec-title { padding: 14px 0 8px; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; color: var(--text-muted); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(184px,1fr)); gap: 12px 20px; padding-bottom: 6px; }
.form-field.full { grid-column: 1 / -1; }
.form-field-label { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
.form-field-val { font-size: 13.5px; font-weight: 600; line-height: 1.6; }
.form-field-val.empty { color: var(--text-muted); font-weight: 500; }
.only-missing [data-empty="false"] { display: none; }
.form-discounts { display: flex; flex-direction: column; gap: 9px; padding-bottom: 16px; }
.form-discount-box { border: 1px solid var(--border-md); border-radius: 10px; padding: 11px 13px; }
.form-discount-tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
.form-discount-tag { background: var(--nav-bg); color: var(--text-sm); font-size: 10.5px; font-weight: 700; border-radius: 6px; padding: 2px 8px; }
.form-discount-tag.primary { background: var(--accent-cta); color: var(--accent-cta-ink); }
.form-discount-meta { font-size: 11.5px; color: var(--text-muted); }
.form-discount-text { font-size: 13.5px; line-height: 1.6; }
@media print { .no-print, .sidebar, .task-list-col, .msg-content-head, .steps-tabs, .decision-panel, .identity-card, .anchor-card, .approve-card, .qj-card { display: none !important; } }
.step-block { border-top: 1px solid var(--border-md); }
.step-block.open { background: var(--nav-bg); }
.step-row { padding: 15px 24px; display: flex; align-items: center; gap: 13px; }
.step-num { width: 26px; height: 26px; flex: none; border-radius: 99px; background: var(--nav-bg); color: var(--text-sm); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.step-num.active { background: var(--accent); color: #fff; }
.step-body { flex: 1; min-width: 0; }
.step-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step-name { font-size: 14px; font-weight: 600; }
.step-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
/* מספור-שלבים מהטופס החדש (business.html §145) שונה מחלוקת-השדות כאן — לא "פשוט שכתוב", ר' PROJECT_CONTEXT.md §146.
   רפרנס בלבד ליד שם השלב, לא שינוי-מבנה/נתונים. */
.step-form-ref { font-size: 10.5px; font-weight: 500; color: var(--text-muted); margin-inline-start: 6px; }
.step-reviewed { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--text); user-select: none; }
.step-reviewed input { width: 16px; height: 16px; accent-color: var(--accent); }
.btn-step-edit { height: 32px; padding: 0 13px; border: 1px solid var(--border); border-radius: 8px; background: var(--card-bg); font-size: 12.5px; font-weight: 600; color: var(--text); cursor: pointer; }
.btn-step-edit:hover { background: var(--nav-bg); }
.btn-step-close { height: 32px; padding: 0 13px; border: none; border-radius: 8px; background: var(--text); color: #fff; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.btn-step-close:hover { opacity: .85; }
.step-form { display: none; padding: 2px 24px 22px; }
.step-form.open { display: block; }
