// דשבורד ראשי (Home) — שורת מדדים, מרכז משימות (Master-Detail), בריאות פרופיל
// ══════════════════════════════════════════════════════════════════


// ══════════════════════════════════════════════════════════════════
// §253 — הצטרפות לאורך זמן (רצועה אחת בראש 3 המסכים)
// ══════════════════════════════════════════════════════════════════
// היו רק מספרים מצטברים ("46 עסקים", "+3 השבוע") — לא היה שום מקום שממנו רואים את הקצב עצמו,
// ולא כמה מתוך מי שנרשם באמת נכנס לאינדקס. שתי השאלות ("כמה הצטרפו" ו"והאם נרשמו") מוצגות
// יחד: מספר ההרשמות בתקופה + הפילוח מאושר/ממתין/נדחה שלה, באותה שורה.
//
// **קובייה אחת, לא רשת** (החלטת המשתמש, 2026-08-24): הגרסאות הקודמות היו טבלה יומית ואז 5
// תיבות-סיכום — שתיהן ירדו, "זה סתם יותר מדי קוביות בדשבורד הראשי". מה שנשאר: רצועה אחת
// דקה עם **בורר תקופה** אחד, שממנו נבחרות כל האפשרויות (היום · אתמול · 7/30/90 ימים ·
// השבוע · שבוע שעבר · החודש · חודש שעבר · 3/12 חודשים · סה״כ). הפירוט תקופה-אחר-תקופה
// שייך ל"מרכז נתונים" ייעודי שייבנה בהמשך, לא לראש מסך-עבודה.
//
// מקור-האמת הוא registeredAt (=submittedAt) על מסמך העסק/החבר עצמו — אין אוסף אגרגציה, ואין
// צורך באחד: ~50 עסקים + ~50 חברים נסרקים בזיכרון בלי עלות. רשומה בלי submittedAt נופלת
// ב-hydrate ל-new Date() ולכן הייתה נספרת כ"נרשמה היום" — registeredAtKnown מוציא אותה
// מכל תקופה, והכמות שלה מדווחת לצד הרצועה כדי שהפער יהיה גלוי ולא שקט.

function joinsStartOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
// ראשון = תחילת השבוע (getDay()===0), לא שני — זה השבוע הישראלי, ו"שבוע שעבר" חייב להתאים
// למה שהמנהל רואה בלוח השנה שלו.
function joinsStartOfWeek(d) { const x = joinsStartOfDay(d); x.setDate(x.getDate() - x.getDay()); return x; }
function joinsStartOfMonth(d) { const x = joinsStartOfDay(d); x.setDate(1); return x; }
function joinsBucketStart(d, groupBy) {
  return groupBy === 'month' ? joinsStartOfMonth(d) : groupBy === 'week' ? joinsStartOfWeek(d) : joinsStartOfDay(d);
}
function joinsBucketKey(d, groupBy) {
  const b = joinsBucketStart(d, groupBy);
  return b.getFullYear() + '-' + String(b.getMonth() + 1).padStart(2, '0') + '-' + String(b.getDate()).padStart(2, '0');
}
// i דליים אחורה מ-start (שכבר מיושר לתחילת-תקופה). setMonth בטוח כאן כי היום-בחודש הוא תמיד 1.
function joinsBucketBack(start, groupBy, i) {
  const x = new Date(start);
  if (groupBy === 'month') x.setMonth(x.getMonth() - i);
  else if (groupBy === 'week') x.setDate(x.getDate() - 7 * i);
  else x.setDate(x.getDate() - i);
  return x;
}
// תקופה בודדת, n דליים אחורה (0 = הנוכחית)
function joinsInBucketAgo(list, groupBy, n) {
  const key = joinsBucketKey(joinsBucketBack(joinsBucketStart(new Date(), groupBy), groupBy, n), groupBy);
  return list.filter(x => x.registeredAtKnown && x.registeredAt && joinsBucketKey(x.registeredAt, groupBy) === key);
}
// n הדליים האחרונים כולל הנוכחי (n=1 → התקופה הנוכחית בלבד)
function joinsLastBuckets(list, groupBy, n) {
  const from = joinsBucketBack(joinsBucketStart(new Date(), groupBy), groupBy, n - 1);
  return list.filter(x => x.registeredAtKnown && x.registeredAt && x.registeredAt >= from);
}

const joinsPl = (n, one, many) => n + ' ' + (n === 1 ? one : many);
// "והאם נרשמו" — לא מספיק לדעת ש-4 עסקים הצטרפו השבוע; השאלה היא כמה מהם באמת עלו לאינדקס.
function joinsBreakdown(list) {
  const c = k => list.filter(x => x.status === k).length;
  return [
    c('approved') ? '✓ ' + joinsPl(c('approved'), 'אושר', 'אושרו') : '',
    c('pending') ? '⏳ ' + joinsPl(c('pending'), 'ממתין', 'ממתינים') : '',
    c('rejected') ? '✗ ' + joinsPl(c('rejected'), 'נדחה', 'נדחו') : '',
  ].filter(Boolean).join(' · ');
}
// גרסה מקוצרת לרצועה — סמל+מספר בלבד; המילים המלאות נשארות ב-title, בלי לאבד מידע.
function joinsBrkMini(list) {
  const c = k => list.filter(x => x.status === k).length;
  const parts = [c('approved') ? '✓ ' + c('approved') : '', c('pending') ? '⏳ ' + c('pending') : '', c('rejected') ? '✗ ' + c('rejected') : ''].filter(Boolean);
  return parts.length ? `<span class="joins-brk" title="${joinsBreakdown(list)}">${parts.join(' ')}</span>` : '';
}

// כל אפשרויות הזמן בבורר אחד. g = רזולוציית-הדלי, mode: 'ago' דלי בודד אחורה · 'last' N דליים
// אחרונים כולל הנוכחי · 'all' הכל (לא חלון-זמן, ולכן גם רשומות בלי תאריך נכללות בו).
const JOINS_PERIODS = [
  { key: 'today',     grp: 'לפי יום',   label: 'היום',                g: 'day',   mode: 'ago',  n: 0 },
  { key: 'yesterday', grp: 'לפי יום',   label: 'אתמול',               g: 'day',   mode: 'ago',  n: 1 },
  { key: 'last7',     grp: 'לפי יום',   label: '7 הימים האחרונים',    g: 'day',   mode: 'last', n: 7 },
  { key: 'last30',    grp: 'לפי יום',   label: '30 הימים האחרונים',   g: 'day',   mode: 'last', n: 30 },
  { key: 'last90',    grp: 'לפי יום',   label: '90 הימים האחרונים',   g: 'day',   mode: 'last', n: 90 },
  { key: 'thisWeek',  grp: 'לפי שבוע',  label: 'השבוע',               g: 'week',  mode: 'ago',  n: 0 },
  { key: 'lastWeek',  grp: 'לפי שבוע',  label: 'שבוע שעבר',           g: 'week',  mode: 'ago',  n: 1 },

// זמן טיפול ממוצע אמיתי — הפרש registeredAt→approvedAt על כל האוהדים+העסקים שכבר אושרו בפועל
function avgHandlingTimeLabel() {
  const durations = [];
  MOCK_FANS.forEach(f => { if (f.status === 'approved' && f.approvedAt && f.registeredAt) durations.push(f.approvedAt - f.registeredAt); });
  MOCK_BUSINESSES.forEach(b => { if (b.status === 'approved' && b.approvedAt && b.registeredAt) durations.push(b.approvedAt - b.registeredAt); });
  if (!durations.length) return '—';
  const hours = (durations.reduce((a, x) => a + x, 0) / durations.length) / 3600000;
  return hours < 48 ? `${hours.toFixed(1)} שעות` : `${(hours / 24).toFixed(1)} ימים`;
}

  // לסרוק במבט אחד: המשתמש היה צריך לעבור עליהן אחת-אחת כדי לדעת אם יש בכלל מה לעשות.

// ── §356 — ששת סוגי-התקלה שבתוך הקובייה המאוחדת ─────────────────────────────────────────
// כל ערך כאן היה עד §356 קובייה בפני עצמה. ⚠️ **הרשימה הזאת היא מקור-האמת היחיד** לשבבים
// בקובייה, לבורר מעל הטבלה, ולספירה הכוללת — כדי שסוג-תקלה חדש לא יצטרך להיזכר בשלושה
// מקומות ולהישכח באחד מהם (אותה מלכודת של רשימת-ההיתר `type` ב-firestore.rules, §326).
//
// `open`   — מה נספר בשבב: **פתוחות בלבד**, אחרת "טיפלתי" לא מנקה כלום (§302/§355).
// `urgent` — מה נכנס למספר הגדול והאדום. §358: **כל מה שפתוח**, בכל הסוגים.
//            עד §358 הוא היה תת-קבוצה (מייל sev<=2, כניסה `ours` בלבד), כדי ש-49 "קוד שגוי"
//            לא יהפכו את המספר לרעש. ⚠️ **המשתמש ביטל את ההבחנה במפורש** ("הכל דורש אותנו"):
//            שני שבבים שהראו "5" מול מספר גדול "5" היו בלתי-ניתנים ליישוב במבט.
//            ההבחנה עצמה לא אבדה — היא נשארה **בשורות**: תג "תקלה אצלנו"/"לא תקלה" בכל שורת
//            כניסה, ודירוג-החומרה בכל שורת מייל. היא כבר לא מסננת את המונה.
const ISSUE_KINDS = [
  { key: 'mail',      label: 'מייל',          open: () => mailIssueList(),
    urgent: l => l.length },
  { key: 'reg',       label: 'הרשמה',         open: () => regIssueOpenList(),      urgent: l => l.length },
  { key: 'login',     label: 'כניסה',         open: () => loginFailOpenList(),
    urgent: l => l.length },
  { key: 'help',      label: 'פניות עזרה',    open: () => helpReqOpenList(),       urgent: l => l.length },
  { key: 'bizErrors', label: 'דשבורד עסק',    open: () => bizWriteErrorList(),     urgent: l => l.length },
];
function issueKindCounts() {
  const out = {};
  let openTotal = 0, urgentTotal = 0;
  ISSUE_KINDS.forEach(k => {
    const list = k.open() || [];
    const urgent = k.urgent(list);
    out[k.key] = { open: list.length, urgent };
    openTotal += list.length; urgentTotal += urgent;
  });
  return { byKind: out, openTotal, urgentTotal };
}

// כל עסק/אוהד עם primary פעיל (לא "מאושר · אין פעולה") — מבוסס classifyAction בלבד, לא בדיקה נפרדת
function unifiedTaskItems() {
  const biz = MOCK_BUSINESSES.map(b => ({ kind:'biz', id:b.id, entity:b, c: classifyAction(b, 'business') }))
    .filter(x => x.c.primary !== 'מאושר · אין פעולה');
  const fan = MOCK_FANS.map(f => ({ kind:'fan', id:f.id, entity:f, c: classifyAction(f, 'fan') }))
    .filter(x => x.c.primary !== 'מאושר · אין פעולה');
  return [...biz, ...fan];
}
function taskWaitDate(x) {
  return x.kind === 'biz' ? (x.entity.changeSubmittedAt || x.entity.registeredAt) : x.entity.registeredAt;
}
function taskWaitLabel(x) {
  if (x.c.primary === 'כרטיס חסר באינדקס') return '—';
  const d = taskWaitDate(x);
  return d ? agoLabel(d) : '—';
}

function taskFilteredList() {
  let items = unifiedTaskItems();
  const tile = TASK_CLASS_TILES.find(t => t.key === taskClassFilter);
  if (tile && tile.primary) items = items.filter(x => x.c.primary === tile.primary);
  if (taskEntityFilter !== 'all') items = items.filter(x => x.kind === taskEntityFilter);
  if (taskCategoryFilter !== 'all') items = items.filter(x => x.kind === 'biz' && x.entity.catKey === taskCategoryFilter);
  if (taskPeriodFilter !== 'all') {
    const now = Date.now();
    items = items.filter(x => {
      const d = taskWaitDate(x);
      if (!d) return false;
      const days = (now - d.getTime()) / 86400000;
      if (taskPeriodFilter === '7') return days <= 7;
      if (taskPeriodFilter === '30') return days <= 30;
      if (taskPeriodFilter === '90') return days <= 90;
      if (taskPeriodFilter === 'over2w') return days > 14;
      return true;
    });
  }
  const q = taskSearchQ.trim();
  if (q) items = items.filter(x => {
    const e = x.entity;
    const hay = x.kind === 'biz'
      ? [e.name, e.ownerFirst, e.ownerLast, e.city].filter(Boolean).join(' ')
      : [e.name, e.city].filter(Boolean).join(' ');
    return hay.includes(q);
  });
  return items.slice().sort((a, b) => {
    if (taskSort2 === 'leastReviewed') return (a.kind==='biz'?bizReviewedCount(a.entity):0) - (b.kind==='biz'?bizReviewedCount(b.entity):0);
    if (taskSort2 === 'mostReviewed') return (b.kind==='biz'?bizReviewedCount(b.entity):0) - (a.kind==='biz'?bizReviewedCount(a.entity):0);
    if (taskSort2 === 'newest') return (taskWaitDate(b)||0) - (taskWaitDate(a)||0);
    if (taskSort2 === 'oldest') return (taskWaitDate(a)||0) - (taskWaitDate(b)||0);
    if (taskSort2 === 'mostRequests') return b.c.treatments.length - a.c.treatments.length;
    return (taskWaitDate(a)||0) - (taskWaitDate(b)||0); // longestWaiting — ברירת מחדל, הכי ותיק קודם
  });
}

// ── §356 — הרשימה המאוחדת ────────────────────────────────────────
// חמישה מקורות שונים לגמרי מנורמלים לשורה אחת. ⚠️ **זו תצוגת-מיון, לא שולחן-עבודה**:
// היא עונה על "יש משהו לבדוק, ואיפה", ולכן היא נושאת רק את הפעולות המשותפות לכל הסוגים —
// פתיחת הכרטיס וסימון "טיפלתי". הפעולות הייחודיות (שליחה חוזרת של מייל, פתיחת כל אוהד
// בהצלבה, המשפכים) נשארות ברשימה של הסוג עצמו, שנמצאת במרחק לחיצה אחת בבורר.
// שכפול שלהן לכאן היה מייצר עותק שני שיסחף מהמקור — בדיוק הדפוס של §353.
function unifiedIssueList() {
  const out = [];
  const q1 = s => "'" + s + "'";

  mailIssueList().forEach(x => out.push({
    kind: 'mail', at: x.when, urgent: x.sev <= 2,
    who: x.name, title: x.badge,
    meta: [x.email, x.ownerBizName ? 'בעל העסק «' + x.ownerBizName + '»' : '', x.detail].filter(Boolean).join(' · '),
    entity: { kind: x.kind, id: x.id },
    markJs: 'markMailIssueHandled(' + [q1(x.kind), q1(x.id), q1(escJsAttr(x.key)),
             q1(escJsAttr(x.badge)), q1(escJsAttr(x.name))].join(',') + ')',
  }));

  regIssueOpenList().forEach(x => out.push({

            // §358 — `urgentTotal === openTotal` מאז שההבחנה בוטלה, ולכן הענף
            // "אף אחת אינה תקלה אצלנו" הפך לקוד מת ונמחק.
            c.openTotal ? 'פתוחות — לחצו על סוג כדי להיכנס אליו'
            : 'אין תקלות פתוחות באף ערוץ'
          }</div>`);
      })()}
      ${tile(TASK_CLASS_TILES[5], handledItems.length, `<div class="class-tile-sub">${handledItems.length ? 'נסגרו ידנית — ארכיון' : 'אין עדיין סגירות ידניות'}</div>`)}
    </div>`;
}

// שורת-משימה מאוחדת (עסק+אוהד) — טבלה ברוחב-מלא (2026-08-05, §156: המשתמש ביקש במפורש להפוך
// את ההחלטה הקודמת — רק בדף הזה, לא ב"כל העסקים"/"כל האוהדים" ששם ה-32%/68% נשאר כמו שהיה).
// גריד רחב (כמו המוקאפ) בטוח כאן כי הטבלה תופסת את כל רוחב-העמוד, לא מצומצמת לעמודת-רשימה צרה.
function taskRow2Html(x) {
  const e = x.entity;
  const key = `${x.kind}:${x.id}`;
  const badges = [`<span class="class-badge">${x.c.primary}</span>`].concat(x.c.treatments.map(t => treatBadgeHtml(t, e)));
  if (x.kind === 'fan' && e.reviewFlag === 'possible_duplicate') badges.push(`<span class="warn-badge">דגל בדיקה — כפילות אפשרית</span>`);
  else if (x.kind === 'fan' && e.reviewFlag) badges.push(`<span class="warn-badge">דגל בדיקה — שם לא תואם</span>`);
  // ── §366 — "בעל עסק" חסר דווקא במסך שבו מחליטים ──────────────────────────────────────
  // המשתמש: *"בכל האוהדים יש תגית בעל העסק, בדשבורד ראשי בממתינים אין להם תגית"*.
  // התג היה קיים ב-fanRowsHtml (רשימת כל האוהדים) אבל לא כאן — וזה בדיוק המסך שבו
  // עוברים על הממתינים ומאשרים. ⚠️ ההבדל אינו קוסמטי: אישור אוהד שהוא **גם בעל עסק**
  // שולח מייל אחר לגמרי (המייל המאוחד, ר' §127) ומשפיע גם על רשומת העסק. מנהל שלא
  // רואה את זה בשורה מכריע בלי לדעת מה הוא מפעיל.
  if (x.kind === 'fan' && e.isBusinessOwner) badges.push(`<span class="treat-badge">בעל עסק</span>`);
  if (x.kind === 'biz' && x.c.primary === 'כרטיס חסר באינדקס') {
    missingFieldsFor(e).slice(0, 2).forEach(label => badges.push(`<span class="warn-badge">${label}</span>`));
  }
  const catLabel = x.kind === 'biz' ? ((CATEGORIES.find(c => c.key === e.catKey) || {}).label || '') : '';
  const metaLine = x.kind === 'biz'
    ? [bizMetaStr(e), catLabel, e.status === 'approved' ? `באינדקס מ-${fmtDate(e.approvedAt || e.registeredAt)}` : (e.ownerIsSubscriber ? 'מנוי' : 'לא מנוי')].filter(Boolean).join(' · ')
    : ['אוהד', e.isSubscriber ? 'מנוי' : 'לא מנוי'].filter(Boolean).join(' · ');
  const reviewCol = x.kind === 'biz'
    ? `<div class="task-table-review"><div class="task-table-review-bars">${[0,1,2,3].map(i => `<span class="${i < bizReviewedCount(e) ? 'on' : ''}"></span>`).join('')}</div><div class="task-table-review-lbl">${bizReviewedCount(e)} מתוך 4 נסקרו</div></div>`
    : `<div class="task-table-review-lbl">לא רלוונטי לאוהד</div>`;
  const openLabel = x.kind === 'fan' ? 'כרטיס אוהד' : (x.c.primary === 'עסק ממתין לאישור' ? 'פתיחה וסקירה' : 'פתיחה');
  const primaryBtn = x.c.primary === 'עסק ממתין לאישור' ? 'primary-yellow' : '';
  // §252 — "✔️ טופל" ישירות מהשורה, בלי לפתוח את הכרטיס: זה בדיוק המקרה שבו אין מה להחליט בפנים
  // (השדה החסר אינו חובה על העסק), והמנהל רק רוצה לנקות את הרשימה. מוצג רק לסיווג הזה.
  const acceptGapsBtn = (x.kind === 'biz' && x.c.primary === 'כרטיס חסר באינדקס')
    ? `<button class="act-btn tiny task-accept-gaps" title="מוריד את העסק מרשימת המשימות בלי לשנות לו שום נתון — לשימוש כשהשדה החסר לא חובה עליו. נשמר תחת &quot;בקשות שטופלו&quot; וניתן להחזרה." onclick="event.stopPropagation();acceptCardGaps('${x.id}')">✔️ טופל</button>`
    : '';
  return `
    <div class="task-table-row ${selectedTaskKey===key?'active':''}" onclick="selectTask2('${x.kind}','${x.id}')">
      <div class="task-table-main">
        <div class="task-table-name">${esc(e.name)}</div>
        <div class="task-table-meta">${esc(metaLine)}</div>
      </div>
      <div class="task-table-badges">${badges.join('')}</div>
      ${reviewCol}
      <div class="task-table-wait">${taskWaitLabel(x)}</div>
      <div class="task-table-acts"><button class="act-btn ${primaryBtn} tiny" onclick="event.stopPropagation();selectTask2('${x.kind}','${x.id}')">${openLabel}</button>${acceptGapsBtn}</div>
    </div>`;
}

function taskTableBodyHtml(list) {
  if (!list.length) return `<div class="placeholder-note">אין כרגע פריטים 🎉</div>`;
  return `<div class="task-table">${list.map(taskRow2Html).join('')}</div>`;
}

function taskCenterHtml() {
  return `
    ${taskTilesHtml()}
    <div class="filter-toolbar">${taskFilterBarHtml()}</div>
    <div id="taskTableWrap">${safeTaskCenterTableHtml()}</div>
    ${selectedTaskKey ? taskDrawerHtml(selectedTaskKey) : ''}`;
}

// כרטיס-מלא נפתח כ-drawer צף (52vw, לא עמודה קבועה) — רק במסך הזה. שאר-המסך (טבלה+קוביות+סינון)
// לא נוגעים בו כשה-drawer פתוח/נסגר, ר' refreshTaskCenter.
function taskDrawerHtml(key) {
  return `
    <div class="task-drawer-backdrop" onclick="closeTaskDrawer()"></div>
    <div class="task-drawer">
      <div class="task-drawer-head">
        <button class="task-drawer-close" onclick="closeTaskDrawer()">✕</button>
      </div>
      <div class="task-drawer-body">${taskDetailHtml2(key)}</div>
    </div>`;
}

function taskDetailHtml2(key) {
  if (!key) return '';
  const [kind, id] = key.split(':');
  if (kind === 'fan') return fanFullDetailHtml(id, { backFn: 'closeTaskDrawer' });
  return bizFullDetailHtml(id, { backFn: 'closeTaskDrawer' });
}

// ── ניהול מדיה אמיתי — לוגו/תמונה מייצגת/גלריה/סרטונים, כתיבה+העלאה אמיתית ל-Firebase Storage
// (uploadFile/uploadImageWithThumb, זהה ל-admin-businesses.html). כל פעולה כותבת מיידית (בלי טופס
// אחד גדול "שמור הכל") — פשוט יותר ובטוח יותר מלנסות לשחזר טופס-ענק דינמי לגלריה/סרטונים.
function mediaRealViewHtml(b) {
  // בלי slice — הרשמה מגבילה ל-5 תמונות גלריה, ורצוי לראות את כולן כאן ולא רק 3 ראשונות (המשתמש
  // דיווח שנראה "רק 3", הריבוע-flex-wrap כבר תומך בכמה שורות בלי לשבור פריסה).
  // כל תמונה פותחת לייטבוקס בלחיצה (לא טאב חדש) + כפתור-הורדה צמוד — ר' mediaThumbHtml למעלה, §185.
  const galleryThumbs = (b.photos || []).map(p =>
    `<div class="media-slot thumb filled">${mediaThumbHtml(p.url, p.name, 'width:100%;height:100%', b.name)}</div>`).join('');
  return `
    <div class="media-slot-row">
      <div class="media-slot logo ${b.logo?'filled':''}">${b.logo ? mediaThumbHtml(b.logo, 'logo.png', 'width:100%;height:100%', 'לוגו', 'contain') : `<span class="media-slot-ic">—</span><span class="media-slot-label">לוגו</span>`}</div>
      <div class="media-slot cover ${b.coverPhoto?'filled':'missing'}">${b.coverPhoto ? mediaThumbHtml(b.coverPhotoThumb || b.coverPhoto, 'cover.jpg', 'width:100%;height:100%', b.name) : `<span class="media-slot-ic">—</span><span class="media-slot-label">חסרה תמונה</span>`}</div>
      ${galleryThumbs}
    </div>
    <div class="approve-longtext" style="margin-top:6px">${(b.photos||[]).length} תמונות בגלריה</div>
    ${mediaUploadFailureHtml(b)}`;
}

// ── §376 — כשל-העלאה שנרשם ומעולם לא נקרא ────────────────────────────────────────────────
// `worker/src/bizmedia.js` כותב `mediaUploadFailed` (מערך שמות-שדות) ו-`mediaUploadFailedAt`
// על מסמך העסק בכל תמונה שנפלה, מאז 2026-08-22 — **ואף מסך ניהול לא הציג אותם.** ההערה בקוד
// הוורקר אומרת את זה במפורש: "הם קיימים כדי שיהיה מה לשלוף כשעסק מדווח 'שלחתי תמונות ואין'".
// ב-§375 זה בדיוק מה שקרה: השדה היה התשובה (ריק — כלומר ההעלאה הצליחה והבעיה ברשת), ונאלצנו
// לשלוף אותו מקונסול הדפדפן. נתון שנאסף שנה ולא נקרא שווה בדיוק כמו נתון שלא נאסף.
//
// ⚠️ **היעדר כשל אינו הודעה.** מוצג רק כשיש כשל בפועל — באנר "הכל תקין" בכל עסק היה מרעיש
// את הגיליון ומאמן את העין לדלג עליו, וזו בדיוק הסיבה שהשורה הזו תפספס ביום שהיא כן תופיע.
function mediaUploadFailureHtml(b) {
  const failed = b.mediaUploadFailed;
  if (!Array.isArray(failed) || !failed.length) return '';
  const at = toJsDate(b.mediaUploadFailedAt);
  // שמות-השדות נכתבים באנגלית ע"י הוורקר (`fanPhoto`/`logo`/`cover`/`coverThumb`/`gallery[0]`).
  // ⚠️ נפילה-לאחור לשם הגולמי ולא דילוג: שדה חדש בוורקר שלא תורגם כאן חייב עדיין להופיע —
  // מוטב "gallery[7]" באנגלית מאשר כשל שנעלם כי אין לו תרגום.
  const he = { fanPhoto: 'תמונת אימות', logo: 'לוגו', cover: 'תמונה מייצגת', coverThumb: 'תמונה מייצגת (ממוזערת)' };
  const names = failed.map(f => he[f] || (f.startsWith('gallery') ? 'תמונת גלריה' : f));
  return `
    <div class="media-upload-failed">
      ⚠️ ${names.length === 1 ? 'העלאה אחת נכשלה' : names.length + ' העלאות נכשלו'} בהרשמה: ${esc(names.join(', '))}
      ${at ? `<span class="muf-when">${esc(fmtDateTime(at))}</span>` : ''}
      <div class="muf-hint">הקבצים האלה מעולם לא הגיעו ל-Storage — צריך לבקש אותם מבעל העסק. (תמונה שקיימת אך לא מוצגת היא תקלה אחרת לגמרי, ר' §375.)</div>
    </div>`;
}

function mediaRealEditHtml(b) {
  // §257 — סדר הגלריה. המספר הוא המיקום בפועל בדף העסק (b.photos נקרא שם כמערך, לפי סדר).
  const photoCount = (b.photos || []).length;
  const photosHtml = (b.photos || []).map((p, idx) => `
    <div class="media-slot-row" style="margin-top:6px">
      ${mediaThumbHtml(p.url, p.name, 'width:56px;height:56px;border-radius:6px;overflow:hidden', b.name)}
      <span style="flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name || '')}</span>
      <input type="number" class="gal-pos-input" value="${idx + 1}" min="1" max="${photoCount}"
             title="המיקום בגלריה — אפשר לכתוב מספר ולעבור ישירות לשם"
             onchange="setBizGalleryPos('${b.id}', ${idx}, this)">
      <button class="act-btn reject tiny" onclick="removeBizGalleryPhoto('${b.id}', ${idx})">🗑️ הסר</button>
    </div>`).join('');
  return `
    <div class="media-manager" id="media_${b.id}">
      <div class="approve-field-label">לוגו</div>
      <div class="media-slot-row" style="align-items:center">
        ${b.logo ? mediaThumbHtml(b.logo, 'logo.png', 'width:56px;height:56px;border-radius:6px;overflow:hidden', 'לוגו', 'contain') : ''}
        <label class="media-drop" ondragover="mediaDragOver(event,this)" ondragleave="mediaDragLeave(this)" ondrop="mediaDrop(event,this,'${b.id}','logo')">
          <input type="file" accept="image/*" onchange="uploadBizLogo('${b.id}', this.files)">
          <span class="media-drop-plus">＋</span><span>${b.logo ? 'החלפת הלוגו' : 'הוספת לוגו'}</span>
        </label>
        ${b.logo ? `<button class="act-btn reject tiny" onclick="removeBizLogo('${b.id}')">🗑️ הסר</button>` : ''}
      </div>
      ${b.logo ? `
      <div class="approve-field-label" style="margin-top:12px">איך הלוגו יושב בתג שעל הכרטיס</div>
      <div class="logo-fit-row">
        <button type="button" class="logo-fit-opt${b.logoFit === 'contain' ? '' : ' sel'}" onclick="setBizLogoFit('${b.id}','')">
          <span class="logo-fit-badge"><img src="${esc(bizImageViewUrl(b.logo))}" alt="" onerror="markBizImageFailed(this)"></span>
          <span>ממלא את התג</span>
        </button>
        <button type="button" class="logo-fit-opt${b.logoFit === 'contain' ? ' sel' : ''}" onclick="setBizLogoFit('${b.id}','contain')">
          <span class="logo-fit-badge fit"><img src="${esc(bizImageViewUrl(b.logo))}" alt="" onerror="markBizImageFailed(this)"></span>
          <span>הלוגו כולו</span>
        </button>
      </div>
      <div class="media-slot-note">כל אפשרות מציגה את התג <b>בגודל האמיתי שלו בכרטיס</b> — בוחרים לפי מה שנראה טוב. "ממלא את התג" מתאים ללוגו ריבועי ואטום; "הלוגו כולו" ללוגו רחב או עם רקע שקוף, שאחרת נחתך בצדדים.</div>` : ''}
      <div class="approve-field-label" style="margin-top:14px">תמונה מייצגת</div>
      <div class="media-slot-row">
        ${b.coverPhoto ? mediaThumbHtml(b.coverPhotoThumb || b.coverPhoto, 'cover.jpg', 'width:56px;height:56px;border-radius:6px;overflow:hidden', b.name) : ''}
        <label class="media-drop" ondragover="mediaDragOver(event,this)" ondragleave="mediaDragLeave(this)" ondrop="mediaDrop(event,this,'${b.id}','cover')">
          <input type="file" accept="image/*" onchange="uploadBizCover('${b.id}', this.files)">
          <span class="media-drop-plus">＋</span><span>${b.coverPhoto ? 'החלפת התמונה' : 'הוספת תמונה מייצגת'}</span>
        </label>
        ${b.coverPhoto ? `<button class="act-btn reject tiny" onclick="removeBizCover('${b.id}')">🗑️ הסר</button>` : ''}
      </div>
      ${b.coverPhoto ? (() => {
        const curZoom = getCoverZoom(b.id);
        const curPos = esc(b.coverPhotoPosition || '50% 50%');
        const curBg = getCoverBg(b.id);
        return `
      <div class="approve-field-label" style="margin-top:14px">מיקום וגודל התמונה על הכרטיס <span style="font-weight:400;color:var(--text-muted)">(גררו להזזה — כך היא נראית בפועל באינדקס, יחס 4:3, כולל תג-הלוגו אם קיים)</span></div>

        <span id="coverPosFill_${b.id}" class="cover-fill" style="${(curZoom && curBg) ? `background:${esc(curBg)}` : 'display:none'}"></span>
        <img id="coverPosImg_${b.id}" class="${curZoom ? 'fitted' : ''}" src="${esc(bizImageViewUrl(b.coverPhoto))}" draggable="false" onerror="markBizImageFailed(this)" style="${curZoom ? `--cover-zoom:${curZoom};--cover-origin:${curPos}` : `object-position:${curPos}`}">
        ${b.logo ? `<div class="biz-card-logo-badge${b.logoFit === 'contain' ? ' fit' : ''}" id="coverPosLogo_${b.id}"><img src="${esc(bizImageViewUrl(b.logo))}" alt="לוגו" onerror="markBizImageFailed(this)"></div>` : ''}
      </div>
      <div class="media-slot-row" style="margin-top:8px">
        <button type="button" class="act-btn tiny${curZoom ? '' : ' approve'}" data-cover-fit="${b.id}" data-cover-mode="fill" onclick="setCoverFitMode('${b.id}','fill')">מילוי הכרטיס</button>
        <button type="button" class="act-btn tiny${curZoom ? ' approve' : ''}" data-cover-fit="${b.id}" data-cover-mode="fit" onclick="setCoverFitMode('${b.id}','fit')">כל התמונה</button>

// היה: קובץ אחד בכל לחיצה, ואחריו הטופס נסגר — כלומר 5 תמונות = 5 סבבים של פתח/בחר/העלה/פתח.
// עכשיו: בוחרים הכל בבת אחת, מעלים בסדרה עם התקדמות גלויה, ושמירה **אחת** בסוף.
// חשוב: כשל באמצע לא מפיל את מה שכבר עלה — התמונות שהצליחו נשמרות, והשגיאה מדווחת בנפרד.
// (העלאה סדרתית ולא מקבילה בכוונה — דחיסה בקנבס + Storage במקביל על 5 קבצים מטלפון הפילה
// דפדפנים בעבר, וגם ההתקדמות הייתה נעשית חסרת-משמעות.)
window.uploadBizGalleryPhoto = async function(id, fileList) {
  const files = [...(fileList || [])];
  if (!files.length) return;
  const b = findBiz(id);
  const added = [];
  let uploadErr = null;
  try {
    for (let i = 0; i < files.length; i++) {
      showSaving(files.length > 1 ? `מעלה תמונה ${i + 1} מתוך ${files.length}...` : 'מעלה תמונה לגלריה...');
      // דחיסה לפני העלאה (כמו קאבר/לוגו) — בלי thumbnail נפרד, זהה ל-business.html בהרשמה (גלריה לא
      // מוצגת בכרטיס הפיד עצמו, רק בתוך דף העסק) — קובץ מקורי מהטלפון יכול להיות כמה MB.
      let uploadFileObj = files[i];
      try { uploadFileObj = await compressToFile(files[i], 1280, 0.82, files[i].name); }
      catch (e) { console.error('⚠️ image compression failed, falling back to original file:', e); }
      const url = await uploadFile(uploadFileObj, `businesses/${id}/gallery_${Date.now()}_${i}`);
      added.push({ url, name: files[i].name });
    }
  } catch (e) { console.error(e); uploadErr = e; }

  if (added.length) {
    await saveSectionUpdates(id, { photos: [...(b.photos || []), ...added] }, { reopenStep: 5 });
  } else {
    hideSaving(false);
  }
  if (uploadErr) {
    alert(added.length
      ? `${added.length} מתוך ${files.length} התמונות הועלו ונשמרו. השאר נכשלו: ${uploadErr.message}`
      : 'שגיאה בהעלאת התמונה: ' + uploadErr.message);
  }
};
window.removeBizGalleryPhoto = async function(id, idx) {
  const b = findBiz(id);
  const photos = (b.photos || []).filter((_, i) => i !== idx);
  await saveSectionUpdates(id, { photos }, { reopenStep: 5 });

// ── §257 — סדר הגלריה ───────────────────────────────────────────────────────────────────────
// עד עכשיו הסדר בדף העסק היה סדר-ההעלאה בלבד, בלי שום דרך לשנות אותו חוץ ממחיקה והעלאה מחדש.
// **כתיבת מיקום ולא חצים** (בקשת המשתמש, 2026-08-24): "להעביר תמונה 8 לתמונה 1 זה המון לחיצות" —
// עם חצים זה 7 הזזות, כלומר 7 כתיבות ל-Firestore ו-7 בניות-מחדש של הכרטיס. כאן זו פעולה אחת.
// splice-out + splice-in (ולא החלפת-שכנים) — העברה למקום רחוק חייבת להסיט את כל מי שביניהם
// במקום להחליף עם היעד, אחרת התמונה שהייתה שם הייתה קופצת לסוף.
window.setBizGalleryPos = async function(id, from, el) {
  const b = findBiz(id);
  if (!b) return;
  const photos = [...(b.photos || [])];
  const restore = () => { if (el) el.value = from + 1; };
  const raw = parseInt(el && el.value, 10);
  if (!Number.isFinite(raw)) { restore(); return; }
  const target = Math.min(Math.max(raw, 1), photos.length) - 1;
  if (target === from) { restore(); return; }
  const [moved] = photos.splice(from, 1);
  photos.splice(target, 0, moved);
  await saveSectionUpdates(id, { photos }, { reopenStep: 5 });
};

// מגבלת-האמת היא רוחב פיקסלים בפועל (ensureFitsCard), לא ספירת תווים — התווית מציגה "מתאים/חורג"

// הוסרה — נקרא רק פעם אחת עכשיו (standalone, תמיד-גלוי), ר' ההערה למעלה על מנגנון-הסנכרון.

  // הזו מסבירה בדיוק את הפער, ומראה מה מוצג באמת לאוהדים כרגע. שמירה כאן מכריעה את הבקשה.

// (זהה בדיוק ל-admin-members.html/admin-businesses.html generateLoginCode)
async function generateLoginCode() {
  for (let i = 0; i < 20; i++) {
    const code = String(Math.floor(100000 + Math.random() * 900000));
    // §248 — הייחודיות נבדקת מול memberCodes בלבד. **לא להחזיר כאן בדיקה מול members:** אין
    // שם יותר loginCode אחרי cleanup, כלומר כל קוד היה נראה "ייחודי" ושני חברים היו יכולים
    // לקבל את אותו קוד — והם היו נכנסים אחד לחשבון של השני.
    const snap = await getDocs(query(collection(db, 'memberCodes'), where('loginCode', '==', code)));
    if (snap.empty) return code;
  }
  throw new Error('לא הצלחנו להגריל קוד ייחודי');
}

async function saveLoginCode(memberId, code) {

}
// זהה בדיוק ל-admin-members.html allocateMemberNumber
async function allocateMemberNumber() {
  const counterRef = doc(db, 'counters', 'members');
  return await runTransaction(db, async tx => {
    const snap = await tx.get(counterRef);
    const current = snap.exists() ? (snap.data().nextNumber || 1) : 1;
    tx.set(counterRef, { nextNumber: current + 1 });
    return current;
  });
}

// ביניים — פער של כשנייה. סריקת-המיילים ב-Worker רצה כל דקה ושואלת קודם מי מהחברים ממתין ורק
// בסוף מי מהעסקים; עסק שנתפס בתוך הפער קיבל את מייל-העסק הקצר לבדו, ובעל העסק קיבל מייל
// קוד-כניסה נפרד — במקום מכתב-הפתיחה המאוחד שכל השאר מקבלים. באג-אמת: Kaneti insurance (17.8)
// ובני שליחויות (16.8). הפונקציה הזו רק *מכינה* את עדכון החבר; הקורא מצרף אותו ל-writeBatch
// יחד עם העסק, כך ששני המסמכים הופכים ל-'pending' באותו רגע ואין חלון שבו רק אחד מהם ממתין.
// ownerMemberId עדיף, ownerEmail רק fallback legacy. מקצה מספר חבר+קוד כניסה אם עוד אין.
async function prepareLinkedMemberApproval(b) {
  try {
    let memberId = b.ownerMemberId || null;
    if (!memberId) {
      const email = b.ownerEmail || b.email || '';
      if (!email) return;
      const msnap = await getDocs(query(collection(db, 'members'), where('email', '==', email)));
      if (msnap.empty) return;
      memberId = msnap.docs[0].id;
    }
    const mSnap = await getDoc(doc(db, 'members', memberId));
    if (!mSnap.exists()) return null;
    const m = mSnap.data();
    // loginCodeEmailStatus תמיד חוזר ל-pending (גם לחבר שכבר יש לו קוד) — המשתמש ביקש שהקוד
    // תמיד יישלח מחדש באישור, כדי שיהיה "מול העיניים" גם למי ששכח, לא רק בפעם הראשונה.
    const updates = {
      status: 'approved', approvedAt: serverTimestamp(), isBusinessOwner: true,
      loginCodeEmailStatus: 'pending', loginCodeEmailQueuedAt: serverTimestamp(),
    };
    // בלי הקישור הזה ה-Worker לא יודע שהחבר הוא בעל-העסק ולעולם לא ישלח מייל מאוחד
    // (התנאי בסריקה הוא isBusinessOwner && linkedBusinessId). היה חסר כאן לגמרי.
    if (!m.linkedBusinessId && b.id) updates.linkedBusinessId = b.id;
    if (!m.memberNumber) updates.memberNumber = await allocateMemberNumber();
    // §248 — הקוד נשמר ב-memberCodes ולא על מסמך החבר, ולכן הוא מוחזר לקורא כדי שיצרף אותו
    // לאותו writeBatch. חשוב שיישאר אטומי: אישור עסק+חבר הוא כתיבה אחת, ולא יכול להיווצר מצב
    // שבו החבר אושר אבל הקוד שלו לא נכתב (או להפך).
    // ⚠️ "כבר יש לו קוד?" נבדק מול memberCodes ולא מול m.loginCode — השדה הזה כבר לא קיים על
    // מסמך החבר, ובדיקה מולו הייתה מחזירה תמיד "אין", כלומר **הנפקת קוד חדש לחבר שכבר יש לו
    // קוד** ופסילת הקוד שהוא כבר מחזיק ביד. MEMBER_CODES כבר טעון מה-onSnapshot.
    let codeDoc = null;
    const existingCode = MEMBER_CODES[memberId] || (await getDoc(doc(db, 'memberCodes', memberId))).data()?.loginCode;
    if (!existingCode) {
      codeDoc = { ref: doc(db, 'memberCodes', memberId), data: { loginCode: await generateLoginCode() } };
      updates.loginCodeCreatedAt = serverTimestamp();
    }
    return { ref: doc(db, 'members', memberId), updates, codeDoc };
  } catch (e) { console.error('prepareLinkedMemberApproval failed', e); return null; }
}

// אישור עסק אחד + החבר שמאחוריו, בכתיבה אטומית אחת. כל הקריאות האיטיות
// (getDoc/allocateMemberNumber/generateLoginCode) קורות *לפני* ה-batch, כדי שה-commit עצמו
// יהיה רגע יחיד ולא חלון שסריקת-המיילים יכולה ליפול לתוכו.
async function approveBizWithMemberBatch(b) {
  const memberUpd = await prepareLinkedMemberApproval(b);
  const batch = writeBatch(db);
  batch.update(doc(db, 'businesses', b.id), {
    status: 'approved', approvedAt: serverTimestamp(),
    ownerEmailStatus: 'pending', ownerEmailQueuedAt: serverTimestamp(),
    ownerVerificationStatus: 'confirmed',
  });
  if (memberUpd) batch.update(memberUpd.ref, memberUpd.updates);
  if (memberUpd && memberUpd.codeDoc) batch.set(memberUpd.codeDoc.ref, memberUpd.codeDoc.data);   // §248
  await batch.commit();
}

  try {

    const loginCode = await generateLoginCode();

// להקליד את שם העסק, כי מחיקת עסק מוחקת גם את כל ההיסטוריה והמדיה שלו ואין ממנה חזרה.

// שחזור הוא תיקון-בדיעבד, לא רישיון למחוק בקלות.
function qjDeleteBtn(kind, id) {

// ══════════════ §393 — מחיקה שנרשמת לפני שהיא קורית ══════════════════════════════════════
// ר' ההסבר המלא בראש deletion-log.js. כאן רק העטיפות שנוגעות למסך.

// 🔑 **הצילום לאישור נקרא מ-Firestore, לא מ-MOCK_FANS/MOCK_BUSINESSES.** הרשומה בזיכרון עברה
// hydrate — קוד-כניסה שמוזרם מ-memberCodes, טוקן מ-bizTokens, המרות תאריך — ומה שהמנהל מאשר
// חייב להיות מה שבאמת יימחק. בדרך זה גם תופס מוקדם את המצב שבו הרשומה כבר איננה.
async function confirmDeletion(collectionName, id) {
  let data;
  try {
    const s = await getDoc(doc(db, collectionName, id));
    if (!s.exists()) { alert(DELETE_MISSING_MSG); return false; }
    data = s.data();
  } catch (e) {
    console.error(e);
    // ⚠️ קריאה שנכשלה אינה "אין רשומה" — הכשל של §388. לכן לא ממשיכים למחיקה על סמך חוסר-מידע.
    alert('לא ניתן לקרוא את הרשומה, ולכן המחיקה לא בוצעה: ' + e.message);
    return false;
  }
  return confirm(deletionConfirmText(collectionName, data));
}

const DELETE_MISSING_MSG = 'הרשומה כבר לא קיימת בבסיס הנתונים — ייתכן שנמחקה במקביל בחלון אחר. רענן/י את המסך.';

// שהמחיקה אולי כן עברה — ואז מוחק שוב, או מפסיק לסמוך על המסך.
function deleteFailedMsg(e) {

    + 'הסיבה: ' + (e && e.message ? e.message : e);
}

// ── מקור-אמת יחיד ל"מה בעל-העסק באמת הגיש" (2026-08-17) ────────────────────────────────────
// המשתמש: "אם בעל העסק לא הגיש שינוי אני לא רוצה שתציג לי שום דבר, רק את מה שהוא הגיש".
// pendingChanges מכיל גם מה שהמערכת הוסיפה לבד: שדה-נגזר (thumb/כותרת-AI/snapshot/כפילות —
// DIFF_FIELD_EXCLUDE) ושדה שנשלח מחדש עם ערך זהה לקיים (בעל-העסק פתח כרטיס ולחץ "שמירה").
// שני אלה אינם בקשה, ולכן הם לא נספרים ולא מוצגים בשום מקום — לא בשיפוט-מהיר, לא בסיווג
// "בקשה מבעל העסק" (classifyAction) ולא בסינון "שינויים" (hasPendingChange).
// מקבל מסמך גולמי או עסק מ-hydrateBiz — שניהם מחזיקים את הערך החי ב-o[k] ואת המבוקש ב-pendingChanges.
function realPendingChangeKeys(o) {
  const p = o && o.pendingChanges;
  if (!p) return [];
  return Object.keys(p).filter(k => !DIFF_FIELD_EXCLUDE.has(k) && fmtDiffVal(k, o[k]) !== fmtDiffVal(k, p[k]));
}
// מפת pendingChanges לכתיבה חזרה — או null אם *לא נשארה בה אף בקשה אמיתית*. כיוון שהשאריות
// הטכניות כבר לא מוצגות, אין דרך בממשק להכריע בהן; להשאיר אותן ב-DB = להשאיר את העסק
// "עם בקשה ממתינה" לנצח (הבאג של "יש הדברה", ר' PROJECT_CONTEXT.md §206.1/§214). הן יורדות עם
// ההכרעה האחרונה. שדות-לוויין שהערך שלהם כן צריך להיכתב מטופלים ב-PENDING_COMPANION_FIELDS.
function prunedPending(b, pending) {
  if (!pending || !Object.keys(pending).length) return null;
  return realPendingChangeKeys({ ...b, pendingChanges: pending }).length ? pending : null;
}

// ── סנכרון פרטי-הבעלים לרשומת החבר המקושרת בעת אישור בקשה (2026-08-22) ─────────────────────
// כשהמנהל עורך את "אימות בעל העסק" בעצמו (saveBizSec1) הפרטים מסונכרנים זה מכבר ל-members.
// אישור **בקשה שהגיעה מבעל-העסק** לא עשה זאת — כלומר בעל-עסק שביקש לתקן את המייל שלו וקיבל
// אישור נשאר עם הכתובת הישנה ברשומת החבר. זה לא ניואנס טכני: ה"מייל המאוחד" (קוד כניסה + לינק
// לדשבורד) נשלח בפועל לכתובת שברשומת **החבר**, לא ל-ownerEmail — כך שהאישור נראה מוצלח והמייל
// המשיך לצאת לכתובת הישנה בדיוק. ר' ההערה ב-idEmailNote ו-§221.
const OWNER_MEMBER_FIELD_MAP = { ownerFirst: 'firstName', ownerLast: 'lastName', ownerPhone: 'phone', ownerEmail: 'email' };
async function syncOwnerFieldsToMember(b, applied) {
  if (!b || !b.ownerMemberId || !applied) return;
  const patch = {};
  Object.entries(OWNER_MEMBER_FIELD_MAP).forEach(([bizKey, memberKey]) => {
    if (bizKey in applied) patch[memberKey] = applied[bizKey];
  });
  if (!Object.keys(patch).length) return;
  // כישלון כאן לא מבטל את האישור עצמו (הוא כבר נכתב) — מדווח ולא זורק, זהה ל-saveBizSec1.
  try { await updateDoc(doc(db, 'members', b.ownerMemberId), patch); }

}

// ── תיעוד החלטת-המנהל על מסמך העסק (2026-08-20) ─────────────────────────────────────────────
// בקשה מפורשת: "לאחר שמנהל מבצע פעולה של אישור או דחיה שתפתח להם קוביה חדשה על הפעולה שבוצעה...
// יש להראות לו מה אושר ומה נדחה מהבקשות שלו, באיזה סטטוס כל אחת."
//
// למה לא להסתפק ב-logActivity שכבר נקרא כאן: הוא כותב ל-תת-אוסף `businesses/{id}/activity`,
// שהוא יומן-ניהול פנימי — בעל-העסק לא קורא אותו כלל (וגם לא אמור; יש שם החלטות ותיעוד שאינם
// מיועדים לו). `changeDecisions` יושב על מסמך העסק עצמו, שבעל-העסק ממילא מאזין לו ב-onSnapshot,
// ומכיל בדיוק את מה שצריך להציג לו ולא יותר.
//
// ניקוי: הרשומות מסוננות ל-DECISION_KEEP_DAYS **בכל כתיבה**, כך שהמערך לא גדל לנצח ואין צורך
// במשימת-תחזוקה נפרדת. 30 יום בצד השרת מול 14 יום שמוצגים בדשבורד — מרווח מכוון, כדי שבעל-עסק
// שלא נכנס שבועיים עדיין ימצא את ההחלטה אם ייכנס באיחור קטן.
const DECISION_KEEP_DAYS = 30;
function withChangeDecision(b, field, decision, extra) {
  const cutoff = Date.now() - DECISION_KEEP_DAYS * 864e5;
  const prev = (b.changeDecisions || []).filter(d => {
    const t = Date.parse(d && d.at || '');
    return t && t > cutoff;
  });
  return [...prev, {
    field,
    label: DIFF_FIELD_LABELS_MOCK[field] || field,
    decision,                                  // 'approved' | 'rejected'
    at: new Date().toISOString(),              // ISO ולא serverTimestamp — Firestore אוסר sentinel בתוך מערך
    ...(extra || {}),
  }];
}

// ── שיפוט-מהיר פר-שדה (שלב 2ב, §7 במפרט) — מחליפות את approveChanges/rejectChanges הגורפות בממשק
// (אלה נשארות למעלה כ-fallback פנימי, לא מקושרות יותר לשום כפתור). כל שדה נמחק בנפרד מ-pendingChanges
// (לא כל המפה במכה אחת) — valueOverride כי המנהל יכול לתקן את הערך לפני האישור (השדה הוא קלט, לא טקסט).
window.approveChangeField = async function(id, field, valueOverride) {
  const b = findBiz(id);
  if (!b || !b.pendingChanges || !(field in b.pendingChanges)) return;
  const oldVal = b[field];
  // שדות-מבנה (מערך/אובייקט — תמונות/סרטונים/סניפים/הטבות-נוספות...) לא מגיעים עם valueOverride
  // בכלל (אין קלט-טקסט חופשי בשבילם, ר' qjStructuredPreviewHtml) — הערך המקורי מ-pendingChanges
  // הוא האמת, לא לבנות אותו מחדש מטקסט שהמנהל לא נגע בו.
  const newVal = valueOverride !== undefined ? valueOverride : b.pendingChanges[field];
  const newPending = { ...b.pendingChanges };
  delete newPending[field];
  const updates = { [field]: newVal };
  // שדות-לוויין (thumb/כותרת-AI/snapshot) מאושרים יחד עם השדה הראשי — ר' PENDING_COMPANION_FIELDS
  (PENDING_COMPANION_FIELDS[field] || []).forEach(c => {
    if (c in newPending) { updates[c] = newPending[c]; delete newPending[c]; }
  });
  // prunedPending: אם נשארו רק שאריות טכניות (שלא מוצגות בכלל) — הבקשה נסגרת כאן ולא נתקעת
  const kept = prunedPending(b, newPending);
  updates.pendingChanges = kept;
  if (!kept) updates.pendingChangesAt = null;
  updates.changeDecisions = withChangeDecision(b, field, 'approved');
  try {
    await updateDoc(doc(db, 'businesses', id), updates);
    await syncOwnerFieldsToMember(b, updates);
    Object.assign(b, updates);
    Object.assign(b, hydrateBiz(id, b));
    b.healthScore = computeHealthScore(b);
    await logActivity('businesses', id, {
      type: 'changeDecision', title: `אושר שינוי: ${DIFF_FIELD_LABELS_MOCK[field] || field}`,
      detail: `${DIFF_FIELD_LABELS_MOCK[field] || field}: "${fmtActivityVal(oldVal)}" → "${fmtActivityVal(newVal)}"`,
      field, before: oldVal, after: newVal,
    });
    renderMain();
  } catch (e) { console.error(e); alert('שגיאה באישור השינוי: ' + e.message); }
};
window.rejectChangeField = async function(id, field) {
  const b = findBiz(id);
  if (!b || !b.pendingChanges || !(field in b.pendingChanges)) return;
  const rejectedVal = b.pendingChanges[field];
  const newPending = { ...b.pendingChanges };
  delete newPending[field];
  // דחיית השדה הראשי מפילה גם את שדות-הלוויין שלו — אחרת נשארת גרסה-ממוזערת/כותרת של שינוי שנדחה
  (PENDING_COMPANION_FIELDS[field] || []).forEach(c => delete newPending[c]);
  const kept = prunedPending(b, newPending);   // ר' ההערה ב-approveChangeField
  const updates = { pendingChanges: kept };
  if (!kept) updates.pendingChangesAt = null;
  updates.changeDecisions = withChangeDecision(b, field, 'rejected');
  try {
    await updateDoc(doc(db, 'businesses', id), updates);
    Object.assign(b, updates);
    Object.assign(b, hydrateBiz(id, b));
    await logActivity('businesses', id, {
      type: 'changeDecision', title: `נדחה שינוי: ${DIFF_FIELD_LABELS_MOCK[field] || field}`,
      detail: `הבקשה לשנות ${DIFF_FIELD_LABELS_MOCK[field] || field} ל"${rejectedVal}" נדחתה`,
      field, before: b[field], after: null,
    });
    renderMain();
  } catch (e) { console.error(e); alert('שגיאה בדחיית השינוי: ' + e.message); }
};

// קפיצה מתקציר-השינויים בראש הכרטיס לעריכת השלב הרלוונטי + גלילה אליו. פותח את השלב רק אם הוא סגור —
// לא כמו toggleBizSecEdit הרגיל (טוגל) — כדי שלא "יסגור" בטעות שלב שכבר פתוח אם לוחצים שוב בטעות.
// מוסיף גם הבהוב-צבע חד-פעמי (jump-flash) על השלב עצמו כתגובה ויזואלית מיידית ללחיצה — בנוסף לצביעה
// הקבועה של כותרת השלב + השדה הספציפי (secTitle/field-changed, ר' bizFullDetailHtml) שנשארת כל עוד השינוי ממתין.
window.jumpToBizSection = function(id, n) {
  const edit = document.getElementById('secEdit' + n + '_' + id);
  if (edit && !edit.classList.contains('open')) toggleBizSecEdit(id, n);
  const target = document.getElementById('secEdit' + n + '_' + id) || document.getElementById('secView' + n + '_' + id);
  if (target) {
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    target.classList.add('jump-flash');
    setTimeout(() => target.classList.remove('jump-flash'), 1300);
  }
};

// ── כל "פריטי השינוי הממתינים" של עסק, ברשימה שטוחה אחת — מקור אמת יחיד המשמש גם לתקציר בראש הכרטיס
// וגם לצביעת כותרת-השלב + השדה הספציפי בטופסי העריכה (ר' secTitle/fieldChangeHintHtml למטה).
// מאחד דיף רגיל (טלפון/שעות/הטבה) + כל סוגי הצעות תגית/קטגוריה שנייה — "גם תגית או כל דבר שיהיה בשינויים".
function bizPendingChangeItems(b) {
  const items = [];
  if (b.pendingChangeDiff) {
    Object.keys(b.pendingChangeDiff).forEach(key => {
      if (DIFF_FIELD_EXCLUDE.has(key)) return; // כפילות-מכוונת/snapshot פנימי — ר' הערת DIFF_FIELD_EXCLUDE
      const d = b.pendingChangeDiff[key];
      if (d.old === d.new) return; // בלי שינוי אמיתי — לא להציג "X → X" (רק מה שבאמת ביקשו לשנות)
      // section (domId) חייב להישאר מספור-ה-DOM הפנימי — changeItemsBySection/jumpToBizSection
      // בכרטיס-הביקורת המלא (bizFullDetailHtml) תלויים בו ישירות. display הוא הקנוני-לתצוגה,
      // רק לשיפוט-מהיר (כותרת+מיון) — ר' ההערה המפורטת ליד DIFF_GROUPS. אסור לערבב בין השניים.
      items.push({
        section: DIFF_FIELD_TO_SECTION[key] || 2, display: DIFF_FIELD_TO_DISPLAY[key] || 2,
        field: key, label: DIFF_FIELD_LABELS_MOCK[key] || key, old: d.old, new: d.new,
        detail: `לפני: "${d.old}"  →  עכשיו: "${d.new}"`,
      });
    });
  }
  // ארבע ההצעות הבאות שייכות לקבוצת "העסק · קטגוריה ותגיות" (domId=3/display=1). alreadyInDiff
  // מונע שורה כפולה אם אותו שדה כבר הוצג דרך pendingChangeDiff למעלה (יכול לקרות אם השדה גם נכתב
  // ל-pendingChanges וגם עדיין חי כשדה נפרד).
  const alreadyInDiff = key => b.pendingChangeDiff && key in b.pendingChangeDiff && !DIFF_FIELD_EXCLUDE.has(key);
  const liveSecondTag = (b.tags || [])[1] || '';
  if (b.tagSecondSuggestion && b.tagSecondSuggestion !== liveSecondTag && !alreadyInDiff('tagSecondSuggestion')) {
    items.push({ section: 3, display: 1, field: 'tagSecondSuggestion', label: '🏷️ תגית שנייה', detail: `הציע/ה: "${b.tagSecondSuggestion}"` });
  }
  if (b.tagSuggestion && !alreadyInDiff('tagSuggestion')) {
    items.push({ section: 3, display: 1, field: 'tagSuggestion', label: '🆕 תגית חדשה (הצעה חופשית)', detail: `הציע/ה: "${b.tagSuggestion}"` });
  }
  const alsoCatSugMeta = (b.alsoCategorySuggestion && b.alsoCategorySuggestion !== b.alsoUnderCategory && !alreadyInDiff('alsoCategorySuggestion'))
    ? CATEGORIES.find(c => c.key === b.alsoCategorySuggestion) : null;
  if (alsoCatSugMeta) {
    items.push({ section: 3, display: 1, field: 'alsoCategorySuggestion', label: '🏷️ קטגוריה נוספת ("מופיע גם תחת")', detail: `הציע/ה: ${alsoCatSugMeta.icon} ${alsoCatSugMeta.label}` });
  }
  if (b.alsoCategoryNote && !alreadyInDiff('alsoCategoryNote')) {
    items.push({ section: 3, display: 1, field: 'alsoCategoryNote', label: '📝 הערה לגבי קטגוריה נוספת', detail: `"${b.alsoCategoryNote}"` });
  }
  // ממוין לפי מספר-התצוגה הקנוני (display, 1←5) ובתוך אותו שלב לפי סדר-השאלות האמיתי בטופס
  // (DIFF_FIELD_ORDER_INDEX) — לא לפי section (domId, שמספורו שרירותי-היסטורי ולא קשור לסדר-תצוגה)
  // ולא לפי סדר-מקרי של Object.keys(pendingChanges). שדה בלי אינדקס-ידוע מקבל 99 → אחרון בתוך השלב.
  items.sort((a, b2) => (a.display - b2.display) || ((DIFF_FIELD_ORDER_INDEX[a.field] ?? 99) - (DIFF_FIELD_ORDER_INDEX[b2.field] ?? 99)));
  return items;
}

// ── שאריות-בקשה "בלתי-נראות" — היסטוריה (2026-08-16 → 2026-08-17) ──────────────────────────
// הבאג המקורי: עסק ("יש הדברה") ביקש תמונות, המנהל אישר — והשורה נשארה תקועה ב"בקשות מבעלי
// עסקים" בלי שום פריט להכריע בו, כי pendingChanges החזיק גם שדות-נגזרים (DIFF_FIELD_EXCLUDE)
// וגם שדות שהערך שלהם זהה לקיים. הפתרון דאז היה שורת "X שדות טכניים ממתינים" עם אישור/ניקוי.
// 2026-08-17 — השורה הוסרה לפי הנחיה מפורשת: "אם בעל העסק לא הגיש שינוי אני לא רוצה שתציג לי
// שום דבר, רק את מה שהוא הגיש". במקומה: realPendingChangeKeys מגדיר מה נחשב בקשה (וכל המסכים
// נגזרים ממנו), ו-prunedPending סוגר את השאריות אוטומטית בהכרעה האחרונה — כך שאין יותר
// שורה תקועה *ולא* שורה טכנית על המסך. approvePendingLeftovers/rejectPendingLeftovers נמחקו.

// שדות-לוויין שנשלחים תמיד ביחד עם השדה הראשי (העלאת תמונה יוצרת גם גרסה ממוזערת; עריכת הטבה
// יוצרת גם כותרת-AI קצרה ו-snapshot). אישור/דחייה של הראשי מכריע גם אותם — אחרת נשארה שארית
// שלא ניתן להגיע אליה בממשק, וזה בדיוק מה שהחזיק שורות תקועות במסך הבקשות.
const PENDING_COMPANION_FIELDS = {
  hours: ['hoursMode', 'hoursDays', 'hoursOther'],
  coverPhoto: ['coverPhotoThumb'],
  logo: ['logoThumb'],
  discountTextFull: ['discountText', 'discountBuilder'],

// היסטוריית מיילים שנשלחו לעסק/אוהד הזה דרך "שידור המוני" — נושא+תאריך בלבד, כמו שביקש המשתמש
// ("אם זה לא אומר מה הכותרת/נושא של המייל אין למה"). מבוסס messageBroadcastHistory (10 השידורים
// האחרונים, כבר טעון ב-onSnapshot) — לא כולל שליחות ידניות (WA/מייל בודד), כי אלה פותחות חלון
// אצל המנהל בלבד ואין שום אישור/רישום שהן אכן נשלחו בפועל.
function recipientEmailHistoryHtml(id, isFans, label) {
  const sent = messageBroadcastHistory
    .filter(h => (isFans ? h.audienceGroup === 'fans' : h.audienceGroup !== 'fans'))
    .map(h => ({ subject: h.subject, sentAt: h.sentAt, r: (h.results || []).find(r => r.id === id) }))
    .filter(x => x.r && x.r.status === 'sent');
  if (!sent.length) return '';
  return `
    <div class="approve-field">
      <div class="approve-field-label">📧 מיילים שנשלחו ל${label} הזה (שידור המוני)</div>
      <div class="approve-longtext">${sent.map(x => `${esc(x.subject)} — ${x.sentAt ? fmtDateTime(x.sentAt) : ''}`).join('<br>')}</div>
    </div>`;
}
function bizEmailHistoryHtml(b) { return recipientEmailHistoryHtml(b.id, false, 'עסק'); }
function fanEmailHistoryHtml(f) { return recipientEmailHistoryHtml(f.id, true, 'אוהד'); }

// ── יומן פעילות לאוהד — אותו דפוס בדיוק כמו bizActivityHtml למטה, על members/{id}/activity.
// מחליף את "הערה לעצמי" הישנה (adminNote, שדה יחיד שנדרס בכל עדכון — בדיוק הפער שמתואר ב-§1 במפרט).
// saveFanNote/adminNote נשארות מוגדרות כ-fallback פנימי, לא מקושרות יותר לשום שדה בממשק.
let fanActivityCache = {};
let fanActivityCountCache = {}; // אותו עיקרון כמו bizActivityCountCache — getCountFromServer זול, ל"הצגת היומן המלא (X רשומות)"
let fanActivityExpanded = new Set();
async function fetchFanActivity(id, full) {

// עודכן (2026-08-04) תואם-handoff, אותו שיפור בדיוק כמו bizActivityHtml: textarea+הערת-פרטיות+מספר-רשומות
function fanActivityHtml(f) {
  const id = f.id;
  if (fanActivityCache[id] === undefined) fetchFanActivity(id, false);
  if (fanActivityCountCache[id] === undefined) fetchFanActivityCount(id);
  const full = fanActivityExpanded.has(id);
  const list = full ? (fanActivityCache[`${id}:full`] || []) : (fanActivityCache[id] || []);
  const loading = full ? fanActivityCache[`${id}:full`] === undefined : fanActivityCache[id] === undefined;
  const dotColor = (entry) => entry.type === 'note' ? '#FFD400' : entry.source === 'system' ? 'transparent' : '#0A2A66';
  const rows = loading
    ? `<div class="placeholder-note" style="padding:10px 0">טוען יומן…</div>`

        </div>
      </div>`).join('')
    : `<div class="placeholder-note" style="padding:10px 0">אין עדיין רשומות ביומן</div>`;
  const fanFullCount = fanActivityCountCache[id];
  const fanFullBtnLabel = 'הצגת היומן המלא' + (fanFullCount ? ` (${fanFullCount} רשומות)` : '');

    <div class="activity-card">

      <div class="activity-note-row">
        <textarea rows="2" id="fanActivityNoteInput_${id}" class="activity-note-input" placeholder="כתוב הערה על האוהד — תיכנס ליומן"></textarea>
        <button class="qj-btn primary" onclick="addFanActivityNote('${id}')">הוספה ליומן</button>
      </div>
      <div class="activity-note-hint">גלוי למנהלים בלבד</div>
      <div class="activity-timeline">${rows}</div>
      ${!loading && !full && list.length >= 5 ? `<button class="qj-btn link" onclick="toggleFanActivityFull('${id}')">${fanFullBtnLabel}</button>` : ''}
      ${!loading && full ? `<button class="qj-btn link" onclick="toggleFanActivityFull('${id}')">הצגת 5 אחרונים בלבד</button>` : ''}
    </div>`;
}

// §147 — עמודת-ההחלטות השלישית (task-decision-col): פס-התקדמות-סקירה (4 שלבים, זהה ל-
// BIZ_REVIEW_SECTION_LABELS — שלב 1 לא נכלל, ר' ההערה למעלה) + יומן (bizActivityHtml הקיים, לא
// שוכפל) — עטופים יחד ב-.decision-panel אחד, כחול-כהה, sticky בעמודה נפרדת (ר' bizListHtml).
function bizDecisionPanelHtml(b) {
  if (!b) return '';
  const stepKeys = [2, 3, 4, 5];
  const reviewedCount = stepKeys.filter(k => b.reviewedSections && b.reviewedSections[k]).length;
  const bars = stepKeys.map(k => `<div class="decision-progress-bar ${b.reviewedSections && b.reviewedSections[k] ? 'done' : ''}"></div>`).join('');
  // "הסרה מהאינדקס" (תואם-handoff, 2026-08-04) — לא היה קיים בכלל. רלוונטי רק לעסק שכרגע מאושר
  // וחי באינדקס; קורא ל-rejectBiz הקיימת (מחזירה approved→pending, בדיוק "הסרה" בפועל, ר' §16),
  // עם confirm ייעודי כי זו פעולה משמעותית שלא הייתה חשופה קודם ככפתור בודד.
  const removeFromIndexBtn = b.status === 'approved'
    ? `<button class="decision-remove-btn" onclick="removeBizFromIndex('${b.id}')">הסרה מהאינדקס</button>` : '';
  // הועבר לכאן מ"פרטי העסק" (§148, ר' ההערה ליד mainTabHtml) — עדיין-לא-נסקר/מחק/סימונים/תאריכים.
  const flagChips = [
    b.isNew ? '<span class="tag-chip">✨ חדש אצלנו</span>' : '',

    !b.sectionDeals && b.hasDiscount ? '<span class="tag-chip empty">💛 לא מוצג בהטבות שוות</span>' : '',

  return `
    <div class="decision-panel">

        <div class="decision-progress-row">

          <div class="decision-progress-bars">${bars}</div>
        </div>
        ${removeFromIndexBtn}
      </div>
      <div class="decision-divider"></div>
      <div class="decision-panel-pad">
        <div class="decision-meta-row">${statusActions}${bizReviewGapHtml(b)}</div>
        ${bizNoteHtml(b)}
        ${bizEmailHistoryHtml(b)}
        ${flagChips ? `<div class="approve-field"><div class="approve-field-label">🚩 סימונים</div><div class="tag-chip-list">${flagChips}</div></div>` : ''}
        <div class="edit-section-title"><span>תאריכים</span></div>
        <div class="approve-field">
          <div class="approve-longtext">נרשם: ${fmtDate(b.registeredAt)} (${agoLabel(b.registeredAt)})${b.approvedAt ? '<br>אושר: ' + fmtDate(b.approvedAt) : ''}</div>
        </div>
      </div>
      <div class="decision-divider"></div>
      ${bizActivityHtml(b)}

}

// ── שיפוט מהיר — בראש הכרטיס, בלי לגלול לעריכה המלאה (שלב 2ב, §7 במפרט). מחליף את
// bizPendingChangesSummaryHtml (תקציר לחיצה-בלבד, בלי פעולות) — כל בקשה נשפטת ונכתבת בנפרד,

// תצוגה קריאה של שדה-מבנה (מערך/אובייקט) בשורת "שיפוט מהיר" — לא JSON.stringify גולמי.

// הטבות-נוספות, תגיות, אזורים...) מקבלים סיכום-טקסט קריא. ר' ההערה ב-rowHtml למעלה למה זה קיים.
// שדות-תמונה שערכם מחרוזת-URL בודדת — מקבלים תצוגת לפני/אחרי כתמונות במקום URL גולמי (ר' rowHtml)
const IMAGE_DIFF_FIELDS = new Set(['coverPhoto', 'logo', 'coverPhotoThumb', 'logoThumb', 'ownerProofPhotoUrl']);

    // (§193), כך שהתצוגה כאן הייתה ריקה/שבורה בדיוק במקרה שהכי חשוב: בקשת-תמונות של עסק ממתין.

    return `<span class="qj-value-text">${esc(arr.map(br => `${br.city||''} — ${br.address||''}`).join(' · '))}</span>`;
  }

  // ממתינות. hasBody (למטה) כבר מטפל נכון במצב-ריק (מסתיר toggle/count/body, משאיר רק כותרת).

      // כתמונות בשום מקום. תצוגה קריאה בלבד + אישור עם הערך המקורי (b.pendingChanges[field]), לא מהקלט.

  const noteRow = hasNote ? `
    <div class="qj-note-row">
      <div class="qj-note-text"><strong>העסק כתב לנו${b.noteAt ? ' · ' + fmtDateTime(b.noteAt) : ''}: </strong>"${esc(b.note)}"</div>
      <div class="qj-row-actions">
        <button class="qj-btn" onclick="toggleBizNoteHandled('${b.id}', true)">סימון כטופל</button>
        ${b.ownerPhone ? `<button class="qj-btn link" onclick="sendBizWA('${b.id}','${b.ownerPhone}','${escJsAttr(b.ownerFirst)}','${escJsAttr(b.name)}','${b.accessToken||''}')">מענה בוואטסאפ</button>` : ''}
        ${b.ownerEmail ? `<button class="qj-btn link" onclick="sendBizMail('${b.id}','${b.ownerEmail}','${escJsAttr(b.ownerFirst)}','${escJsAttr(b.name)}','${b.accessToken||''}')">מענה במייל</button>` : ''}
      </div>
    </div>` : '';
  // ── §232 — קישורים שלא נפתחים, שורה לכל ערך שבור ─────────────────────────────────────────
  // בבקשה מפורשת: לא רק באדג' בכרטיס-הזהות, אלא כפריט-עבודה אמיתי בשיפוט המהיר, כדי שיהיה
  // אפשר לעבור עסק-עסק ולטפל. **חייב להיכנס ל-totalCount** — לרוב 9 העסקים האלה אין בכלל
  // בקשות ממתינות, ובלי זה hasBody=false והגוף לא מרונדר, כלומר השורה לא הייתה נראית בכלל.
  // אין כאן "אישור/דחייה": אי אפשר לגזור כתובת מ"ספורט אנד פול" — צריך לבקש אותה מבעל העסק,
  // ולכן הפעולות הן פנייה אליו + קפיצה לשלב 2 להדבקת הכתובת הנכונה.
  const qjBrokenLinks = brokenLinksFor(b);
  const brokenLinkRows = qjBrokenLinks.map(l => `
    <div class="qj-row">
      <div class="qj-row-label"><div class="qj-row-step">שלב 2 · ${DIFF_SECTION_NAMES[2]}</div><div class="qj-row-name">🔗 ${l.label} — לא נפתח</div></div>
      <div class="qj-row-value">
        <span class="qj-value-text">"${esc(l.raw)}"</span>
        <div class="qj-value-hint">זה שם ולא כתובת — הקישור לא מוצג ללקוח בכרטיס</div>
      </div>
      <div class="qj-row-actions">
        <button class="qj-btn primary" onclick="jumpToBizSection('${b.id}',2)">לתיקון בשלב 2 ←</button>
        ${b.ownerPhone ? `<button class="qj-btn link" onclick="sendBizWA('${b.id}','${b.ownerPhone}','${escJsAttr(b.ownerFirst)}','${escJsAttr(b.name)}','${b.accessToken||''}')">בקשת הקישור בוואטסאפ</button>` : ''}
      </div>
    </div>`).join('');
  // אין כאן יותר שורת "שדות טכניים ממתינים" — מוצג רק מה שבעל-העסק הגיש בפועל. ר' ההערה
  // ההיסטורית ליד realPendingChangeKeys/prunedPending.
  const totalCount = items.length + (hasNote ? 1 : 0) + qjBrokenLinks.length;
  const hasBody = totalCount > 0;
  // §147 — לפני: count/toggle/hint רק כש-hasBody, כך שכרטיס-ריק היה נראה כמו שורת-טקסט בודדת ולא
  // כמו "פיצ'ר קיים" (המשתמש: "אין שיפוט מהיר"). עכשיו תמיד גלוי — כולל ה-hint שמסביר מה זה, בדיוק
  // כמו ב-handoff ("1 כרטיס עסק.dc.html" qjHint) — גם כשאין מה לשפוט.
  const hint = !hasBody
    ? 'אין בקשות ממתינות כרגע'
    : (isOpen ? 'כל בקשה ניתנת לעריכה כאן לפני אישור, או לקפיצה לשלב שממנו היא באה' : 'סגור — לחצו כדי לפרוס את כל הבקשות');
  return `
    <div class="qj-card">
      <div class="qj-header">
        ${hasBody ? `<button class="qj-toggle" onclick="toggleQuickJudgment('${b.id}')">${isOpen ? '−' : '+'}</button>` : ''}
        <div class="qj-title"${hasBody ? ` onclick="toggleQuickJudgment('${b.id}')"` : ''}>שיפוט מהיר</div>
        <span class="qj-count${hasBody?'':' empty'}">${totalCount}</span>
        ${showApproveApp ? `
        <div class="qj-header-actions">
          <button class="qj-btn-approve-app" title="שולח אוטומטית מייל אישור עם קישור לדשבורד" onclick="approveBiz('${b.id}')">✅ אשר את העסק</button>
          <button class="qj-btn-reject-app" onclick="rejectBiz('${b.id}')">✗ דחה</button>
          ${qjDeleteBtn('biz', b.id)}
        </div>` : b.status === 'approved' ? `
        <div class="qj-header-actions">
          <button class="qj-btn-reject-app" onclick="rejectBiz('${b.id}')">↩️ ביטול אישור — לממתין</button>
          <button class="qj-btn-reject-app" onclick="rejectApprovedBiz('${b.id}')">✗ דחייה</button>
          ${qjDeleteBtn('biz', b.id)}
        </div>` : b.status === 'rejected' ? `
        <div class="qj-header-actions">
          <button class="qj-btn-approve-app" onclick="restoreBizToPending('${b.id}')">↩️ שחזור לממתין</button>
          <button class="qj-btn-approve-app" title="שולח אוטומטית מייל אישור עם קישור לדשבורד" onclick="approveBiz('${b.id}')">✅ אשר בכל זאת</button>
          ${qjDeleteBtn('biz', b.id)}
        </div>` : ''}
        <div class="qj-hint">${hint}</div>
      </div>
      ${(hasBody && isOpen) ? `<div class="qj-body">${brokenLinkRows}${items.map(rowHtml).join('')}${noteRow}${handledExternallyRow(b)}</div>` : ''}
    </div>`;
}

// ── "טופל מבחוץ" (2026-08-16, בקשת המשתמש: "לנקות שם את המסך ולטפל תמיד בהכל") ────────────────
// לא כל בקשה נסגרת בתוך המערכת — לפעמים המנהל מדבר עם בעל-העסק בטלפון/וואטסאפ ומסיים שם. עד עכשיו
// השורה נשארה תקועה במסך לנצח. הכפתור הזה סוגר את *כל* מה שממתין על העסק במכה אחת (בלי להחיל את
// הערכים — זו הנקודה: הטיפול כבר קרה מחוץ למערכת), ושומר רשומת-ארכיון על מסמך העסק עצמו
// (requestsHandledLog) כדי שתופיע בקובייה "בקשות שטופלו". בקשה חדשה שתגיע אחרי זה תפתח שורה חדשה
// כרגיל — הסימון לא "משתיק" את העסק, הוא סוגר רק את מה שהיה פתוח באותו רגע.
function handledExternallyRow(b) {
  return `
    <div class="qj-row qj-row-handled">
      <div class="qj-row-label"><div class="qj-row-step">סגירה ידנית</div><div class="qj-row-name">✔️ טופל מבחוץ</div></div>
      <div class="qj-row-value"><span class="qj-value-text">סוגר את כל הבקשות הפתוחות של העסק הזה בלי להחיל אותן — לשימוש כשסגרתם את זה בשיחה/וואטסאפ. נשמר ב"בקשות שטופלו".</span></div>
      <div class="qj-row-actions"><button class="qj-btn" onclick="markRequestsHandledExternally('${b.id}')">סימון כטופל מבחוץ</button></div>
    </div>`;
}
window.markRequestsHandledExternally = async function(id) {
  const b = findBiz(id);
  if (!b) return;
  const items = bizPendingChangeItems(b);
  const summaryParts = [
    ...items.map(it => it.label),
    ...(bizHasUnhandledNote(b) ? ['הודעה מהעסק ("כתבו לנו")'] : []),
  ];
  if (!summaryParts.length) { alert('אין כרגע בקשות פתוחות לעסק הזה.'); return; }
  const note = prompt(`סימון "${b.name}" כטופל מבחוץ.\n\nייסגרו: ${summaryParts.join(', ')}\n\nאיך זה טופל? (אופציונלי — נשמר בארכיון)`, '');
  if (note === null) return;
  const updates = {
    pendingChanges: null, pendingChangesAt: null,
    tagSecondSuggestion: '', tagSuggestion: '',
    alsoCategorySuggestion: '', alsoCategoryNote: '',
    // arrayUnion לא מקבל serverTimestamp() בתוך אובייקט — לכן ISO string, בכוונה
    requestsHandledLog: arrayUnion({
      at: new Date().toISOString(), by: auth.currentUser ? auth.currentUser.uid : '',
      summary: summaryParts.join(', '), note: (note || '').trim(),
    }),
  };
  // מסמנים "הודעה טופלה" רק אם באמת יש הודעה פתוחה — אחרת נכתב דגל מיותר על עסק בלי הודעה בכלל
  if (bizHasUnhandledNote(b)) { updates.noteHandled = true; updates.noteHandledAt = serverTimestamp(); }
  try {
    await updateDoc(doc(db, 'businesses', id), updates);
    await logActivity('businesses', id, {
      type: 'changeDecision', title: 'הבקשות סומנו כ"טופל מבחוץ"',
      detail: summaryParts.join(', ') + ((note || '').trim() ? ` — ${note.trim()}` : ''),
      field: 'requestsHandledLog', before: null, after: null,
    });
    alert('סומן. השורה ירדה ממסך הבקשות ונשמרה תחת "בקשות שטופלו".');
  } catch (e) { console.error(e); alert('שגיאה: ' + e.message); }
};

// ══════════════════════════════════════════════════════════════════
// 🏷️ ניהול תגיות — חלק א׳ (רשימה לפי קטגוריה, ➕✏️🔀🗑️) + חלק ב׳ (תור בקשות ממתינות מרוכז:
// tagSecondSuggestion + tagSuggestion). ר' PROJECT_CONTEXT.md §41/§48.
// ══════════════════════════════════════════════════════════════════

function tagUsageCount(catKey, tag) {
  return MOCK_BUSINESSES.filter(b => b.catKey === catKey && (b.tags || []).includes(tag)).length;
}

// האם לעסק יש הצעת-תגית ממתינה מכל סוג (שנייה או חופשית) — משותף לתור הממוין ול"שינויים לעסקים"
// (המשתמש ביקש שעסק עם הצעת-תגית בלבד, בלי pendingChangeDiff אחר, גם יופיע שם — ר' PROJECT_CONTEXT.md §48/§49)
function bizHasPendingTagSuggestion(b) {
  return (b.tagSecondSuggestion && b.tagSecondSuggestion !== ((b.tags || [])[1] || '')) || !!b.tagSuggestion;
}
// בקשת קטגוריה נוספת ("מופיע גם תחת") — בין אם דרך בחירה בגריד (alsoCategorySuggestion) ובין אם
// רק במלל חופשי (alsoCategoryNote, קיים רק בעריכה מהדשבורד — ר' business-dashboard.html שלב 3)
function bizHasPendingCategoryRequest(b) {
  return (b.alsoCategorySuggestion && b.alsoCategorySuggestion !== b.alsoUnderCategory) || !!b.alsoCategoryNote;
}
// הודעה חופשית מ"רוצה לכתוב לנו משהו?" שעדיין לא סומנה כטופלה — לא בקשת שינוי, ר' ההערה ב-hydrateBiz
function bizHasUnhandledNote(b) {
  return !!b.note && !b.noteHandled;
}
// תוויות תצוגה לכל סוג "טיפול" ממתין — המפתחות ('details'/'tag'/'category'/'note') זהים בכוונה
// ל-CHANGES_TYPE_OPTIONS הקיים, כדי שסינון-לפי-סוג ותצוגה ישתמשו באותם מפתחות בדיוק.
const TREATMENT_LABELS = { details: 'שינוי פרטים', tag: 'בקשת תגית', category: 'בקשת קטגוריה', note: 'כתבו לנו' };

// באדג' "טיפול נדרש" — מקור-אמת יחיד ל-5 המקומות שמציגים אותו (§235): שורת עסק, כרטיס-זהות
// של עסק, שורת אוהד, כרטיס-זהות של אוהד, ושורת מרכז-המשימות. עד עכשיו כל אחד מהם בנה את אותו
// span בעצמו, וכל תוספת הייתה צריכה להיכתב 5 פעמים.
// **רק note נושא תאריך** — הוא היחיד עם חותמת-זמן משלו (noteAt); לשאר הסוגים אין אחת, והם
// נשארים תווית-סוג נקייה. ברשימות אין את טקסט ההודעה בכלל, ולכן בלי התאריך אי אפשר להבדיל בין
// פנייה שנכתבה היום לאחת שיושבת שבועיים, בלי לפתוח כל עסק בנפרד. hover = תאריך+שעה מלאים.
// הודעה שנכתבה לפני 2026-08-21 אין לה noteAt — הבאדג' פשוט חוזר לתווית בלי תאריך.
function treatBadgeHtml(t, entity, lg) {
  const at = t === 'note' ? (entity && entity.noteAt) : null;
  const cls = 'treat-badge' + (lg ? ' lg' : '');
  return at
    ? `<span class="${cls}" title="${fmtDateTime(at)}">${TREATMENT_LABELS[t]} · ${fmtDayMonth(at)}</span>`
    : `<span class="${cls}">${TREATMENT_LABELS[t]}</span>`;
}

// מקור-אמת יחיד לסיווג הפעולה הנדרשת על עסק/אוהד — כל מסך שצריך "מה המצב פה?" קורא לזה, ולא בונה
// שוב את אותה בדיקה בעצמו. זה מה שסוגר את באג "5 מול 6" (כמה מקומות חישבו את אותו דבר בנפרד ולא
// תמיד הסכימו). kind: 'business' | 'fan' — קובע איזה primary-label מתאים למקרה "ממתין לאישור",
// ומגביל "בקשה מבעל העסק"/"כרטיס חסר באינדקס" (שני אלה שייכים לעסקים בלבד).
// מחזיר { primary: string, treatments: string[] } — treatments הם מפתחות (לא טקסט), ר' TREATMENT_LABELS.
function classifyAction(entity, kind) {
  const treatments = [];
  // pendingChangeDiff כבר מכיל *רק* שינויים שבעל-העסק הגיש בפועל (ר' realPendingChangeKeys) —
  // עסק עם שאריות טכניות בלבד אינו "בקשה מבעל העסק" ולא מופיע ברשימה. §214.
  if (entity.pendingChangeDiff) treatments.push('details');
  if (bizHasPendingTagSuggestion(entity)) treatments.push('tag');
  if (bizHasPendingCategoryRequest(entity)) treatments.push('category');
  if (bizHasUnhandledNote(entity)) treatments.push('note');

  let primary;
  if (entity.status === 'pending') {
    primary = kind === 'fan' ? 'אוהד ממתין לאישור' : 'עסק ממתין לאישור';
  } else if (kind !== 'fan' && treatments.length > 0) {
    primary = 'בקשה מבעל העסק';
  } else if (kind !== 'fan' && entity.status === 'approved' && typeof entity.healthScore === 'number' && entity.healthScore < 100 && !cardGapsAcceptedFor(entity)) {
    // §252 — cardGapsAcceptedFor: המנהל סימן "ראיתי, זה בסדר ככה". healthScore עצמו לא משתנה
    // (המד בכרטיס ממשיך להציג את האמת), רק ההגדרה "זו משימה פתוחה" מתבטלת.
    primary = 'כרטיס חסר באינדקס';
  } else {
    primary = 'מאושר · אין פעולה';
  }
  return { primary, treatments };
}

// שם עסק+תגית משותפים לכתיבה בטוחה בתוך onclick="...('...')" — מונע שבירה כשיש גרשיים בתגית עצמה
function jsq(s) { return String(s).replace(/'/g, "\\'"); }

function tagSecondSuggestionQueue() {
  return MOCK_BUSINESSES.filter(b => b.tagSecondSuggestion && b.tagSecondSuggestion !== ((b.tags || [])[1] || ''));
}
function tagFreeSuggestionQueue() {
  return MOCK_BUSINESSES.filter(b => b.tagSuggestion);
}

// מאתר "משבצת" פנויה לתגית (ראשית קודם, אחרת שנייה) — משותף לאישור-כחדשה ולמיפוי-לקיימת.
// אם שתי המשבצות תפוסות, לא ניתן לשבץ אוטומטית (חוסם עם הסבר) — המנהל צריך להסיר תגית קודם דרך עריכת שלב 3.
// פונקציה טהורה (לא מוטטת את b) — מחזירה מערך-תגיות חדש או null אם אין מקום. הקורא כותב ל-Firestore
// עם המערך המוחזר ורק אחרי הצלחה מעדכן את b.tags בפועל (ר' התיקון ל-3 הפונקציות למטה).
function assignTagToBiz(b, tag) {
  const tags = [...(b.tags || [])];
  if (!tags[0]) { tags[0] = tag; }
  else if (!tags[1]) { tags[1] = tag; }
  else { alert(`ל"${b.name}" כבר יש 2 תגיות. יש להסיר אחת קודם (דרך "✏️ ערוך" בשלב 3 בכרטיס העסק) לפני שאפשר להוסיף תגית נוספת.`); return null; }
  return tags;
}

// "אשר כתגית חדשה" — לא חד-לחיצה: קודם בוחרים תחת איזו קטגוריה התגית שייכת (ברירת מחדל = הקטגוריה
// של העסק עצמו, אבל המנהל יכול לבחור אחרת — למשל תגית שמתאימה יותר לקטגוריה שונה מזו של העסק המציע).
// אם נבחרה קטגוריה אחרת מזו של העסק, התגית מתווספת לפול של הקטגוריה הנבחרת אבל *לא* משויכת לעסק הזה
// (כי תגיות מוגבלות לפול הקטגוריה הראשית של העסק בפועל — לא ניתן לשייך תגית מקטגוריה אחרת).
window.startNewCatPicking = function(id) { tagQueueNewCatPicking = id; tagQueueMapping = null; renderMain(); };
window.cancelNewCatPicking = function() { tagQueueNewCatPicking = null; renderMain(); };
window.confirmApproveTagSuggestionNewCat = async function(id) {
  const b = findBiz(id);
  if (!b || !b.tagSuggestion) return;
  const sel = document.getElementById('tagNewCatSelect_' + id);
  const chosenCat = sel ? sel.value : b.catKey;
  const tag = b.tagSuggestion;
  const sameCategory = chosenCat === b.catKey;
  let newTags = null;
  if (sameCategory) {
    newTags = assignTagToBiz(b, tag);
    if (!newTags) return; // אם שתי המשבצות תפוסות — assignTagToBiz כבר הציג alert ועצר, לא ממשיכים
  }
  try {
    const updates = { tagSuggestion: '' };
    if (sameCategory) updates.tags = newTags;
    await updateDoc(doc(db, 'businesses', id), updates);
  } catch (e) { console.error(e); alert('שגיאה באישור תגית חדשה: ' + e.message); return; }
  if (sameCategory) b.tags = newTags;
  b.tagSuggestion = '';
  b.healthScore = computeHealthScore(b);
  // קטלוג התגיות (settings/tagTaxonomy) — אותו דפוס כמו confirmMergeTag: נכתב אחרי שכתיבת מסמך
  // העסק כבר הצליחה, לא בתוך אותו try (ר' ההערה שם).
  const pool = TAGS_BY_CATEGORY_MOCK[chosenCat] || (TAGS_BY_CATEGORY_MOCK[chosenCat] = []);
  if (!pool.includes(tag)) pool.push(tag);
  await saveTagTaxonomy();
  if (!sameCategory) {
    const chosenLabel = (CATEGORIES.find(c => c.key === chosenCat) || {}).label || chosenCat;
    const ownLabel = (CATEGORIES.find(c => c.key === b.catKey) || {}).label || b.catKey;
    alert(`התגית "${tag}" נוספה לקטגוריית "${chosenLabel}" — לא שויכה ל"${b.name}" כי הקטגוריה שלו ("${ownLabel}") שונה.`);
  }
  tagQueueNewCatPicking = null;
  await logActivity('businesses', id, {
    type: 'tagDecision', title: 'אושרה הצעת תגית חדשה',
    detail: sameCategory ? `"${tag}" נוספה כתגית חדשה ל"${b.name}"` : `"${tag}" נוספה לקטלוג "${chosenCat}" בלי שיוך ל"${b.name}" (קטגוריה שונה)`,
    field: 'tagSuggestion', before: tag, after: sameCategory ? tag : null,
  });
  renderMain();
};
window.rejectTagSuggestion = async function(id) {
  const b = findBiz(id);
  if (!b) return;
  const tag = b.tagSuggestion;
  try {
    await updateDoc(doc(db, 'businesses', id), { tagSuggestion: '' });
    b.tagSuggestion = '';
    await logActivity('businesses', id, {
      type: 'tagDecision', title: 'נדחתה הצעת תגית', detail: `"${tag}" נדחתה עבור "${b.name}"`,
      field: 'tagSuggestion', before: tag, after: null,
    });
    renderMain();
  } catch (e) { console.error(e); alert('שגיאה בדחיית תגית: ' + e.message); }
};
// עריכת טקסט ה-tagSuggestion לפני אישור/מיפוי (למשל תיקון שגיאת הקלדה) — זמינה גם מהכרטיס וגם
// מתור "ניהול תגיות" (tagQueueRowHtml). נכתבת מיד ל-Firestore, בדיוק כמו פעולות האישור/דחייה/מיפוי
// למעלה (כולן כבר כותבות updateDoc בפועל — הפער הישן מ-§67 תוקן, אומת בקריאת-קוד 2026-08-05).
window.startTagSuggestionEdit = function(id) { tagSuggestionEditing = id; renderMain(); };
window.cancelTagSuggestionEdit = function() { tagSuggestionEditing = null; renderMain(); };
window.saveTagSuggestionEdit = async function(id) {
  const input = document.getElementById('tagSuggestionEditInput_' + id);
  const val = input ? input.value.trim() : '';
  if (!val) return;
  tagSuggestionEditing = null;
  await saveSectionUpdates(id, { tagSuggestion: val });
};
window.startMapTagSuggestion = function(id) { tagQueueMapping = id; tagQueueNewCatPicking = null; renderMain(); };
window.cancelMapTagSuggestion = function() { tagQueueMapping = null; renderMain(); };
window.confirmMapTagSuggestion = async function(id) {
  const b = findBiz(id);
  if (!b) return;
  const sel = document.getElementById('tagQueueMapSelect_' + id);
  const tag = sel ? sel.value : '';
  if (!tag) return;
  const newTags = assignTagToBiz(b, tag);
  if (!newTags) return;
  const suggested = b.tagSuggestion;
  try {
    await updateDoc(doc(db, 'businesses', id), { tags: newTags, tagSuggestion: '' });
    b.tags = newTags;
    b.tagSuggestion = '';
    b.healthScore = computeHealthScore(b);
    tagQueueMapping = null;
    await logActivity('businesses', id, {
      type: 'tagDecision', title: 'הצעת תגית מופתה לתגית קיימת', detail: `"${suggested}" מופתה ל"${tag}" עבור "${b.name}"`,
      field: 'tags', before: suggested, after: tag,
    });
    renderMain();
  } catch (e) { console.error(e); alert('שגיאה במיפוי תגית: ' + e.message); }
};

// ניווט-החוצה מהתור המרוכז ל"כל העסקים" עם העסק הרלוונטי פתוח — הסינונים מתאפסים כדי שהעסק בטוח יופיע ברשימה

// נדרש מאותה סיבה בדיוק: עסק שאינו עובר את הסינון הפעיל לא יופיע ברשימה שנפתחת.
