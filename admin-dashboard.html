.class-badge.neutral { background: var(--border-md); color: var(--text-sm); }
.treat-badge { display: inline-block; background: var(--accent-bg); color: var(--accent); font-size: 10px; font-weight: 700; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.warn-badge { display: inline-block; background: var(--warn-bg); color: var(--orange); font-size: 10px; font-weight: 700; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.class-badge.lg, .treat-badge.lg, .warn-badge.lg { font-size: 11.5px; border-radius: 7px; padding: 3px 10px; }

/* ── כרטיס-זהות (ראש כרטיס-מלא — עסק/אוהד) — סגנון dcard כללי, לשימוש חוזר בכרטיסים הבאים (מיקום/שיפוט-מהיר/שלבים) ── */
.dcard { background: var(--card-bg); border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09); padding: 22px 24px; margin-bottom: 12px; }
.identity-top { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.identity-badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.identity-dates { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
.identity-name { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.identity-name-row { display: flex; align-items: center; gap: 8px; }
.identity-name-edit-btn { border: none; background: none; cursor: pointer; font-size: 15px; opacity: .55; padding: 2px 4px; flex: none; }
.identity-name-edit-btn:hover { opacity: 1; }
.identity-name-edit { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.identity-name-edit input { height: 34px; padding: 0 10px; border: 1px solid var(--border-md); border-radius: 8px; background: var(--card-bg); font-size: 18px; font-weight: 700; min-width: 200px; }
.identity-contact { margin-top: 9px; font-size: 13.5px; color: var(--text-sm); }
.identity-contact .k { color: var(--text); }
/* עריכת טלפון+מייל של בעל העסק ישירות משורת-הקשר (2026-08-22) — אותה תבנית בדיוק כמו עריכת-השם
   מעליה (.identity-name-edit), רק בגודל-הטקסט של שורת-הקשר ולא של כותרת-השם. */
.identity-contact-edit { margin-top: 9px; display: none; align-items: center; gap: 6px; flex-wrap: wrap; }
.identity-contact-edit.open { display: flex; }
.identity-contact-edit input { height: 32px; padding: 0 10px; border: 1px solid var(--border-md); border-radius: 8px; background: var(--card-bg); font-size: 13.5px; min-width: 175px; }
.identity-tags { margin-top: 12px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); }
.identity-actions { display: flex; flex-direction: column; gap: 8px; min-width: 172px; }
.identity-actions-row { display: flex; gap: 8px; }
.btn-id-wa { flex: 1; height: 36px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; padding: 0 12px; }
.btn-id-wa:hover { background: var(--accent-dark); }
.btn-id-mail { flex: 1; height: 36px; border: 1px solid var(--accent); border-radius: 9px; background: var(--card-bg); color: var(--accent); font-size: 13px; font-weight: 600; padding: 0 12px; }
.btn-id-mail:hover { background: var(--accent-bg); }
.btn-id-dash { height: 36px; border: 1px solid var(--border); border-radius: 9px; background: var(--card-bg); color: var(--text-sm); font-size: 13px; font-weight: 600; padding: 0 14px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn-id-dash:hover { background: var(--nav-bg); }
.identity-notes { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border-md); display: flex; gap: 10px; flex-wrap: wrap; }
.identity-note { flex: 1; min-width: 150px; border-radius: 10px; padding: 11px 13px; }
.identity-note.warn { background: var(--warn-bg); }
.identity-note.neutral { background: var(--nav-bg); }
.identity-note-h { font-size: 11px; font-weight: 600; margin-bottom: 3px; }
.identity-note.warn .identity-note-h { color: var(--orange); }
.identity-note.neutral .identity-note-h { color: var(--text-muted); }
.identity-note-v { font-size: 12.5px; color: var(--text-sm); line-height: 1.5; }

/* ── כרטיס "המיקום באינדקס" — עיגונים + סימוני-סקשן, שלב 2 חלק ב׳ (§128) ── */
.anchor-card { padding: 0; overflow: hidden; }
.owner-verify-step { padding: 0; overflow: hidden; }
.anchor-head { padding: 15px 22px 13px; display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
.anchor-head-title { font-size: 14.5px; font-weight: 700; }
.anchor-list { border-top: 1px solid var(--border-md); display: flex; flex-direction: column; gap: 1px; background: var(--border); }
.anchor-row { padding: 12px 22px; background: var(--card-bg); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.anchor-row-label { flex: 0 0 132px; }
.anchor-row-section { font-size: 10.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
.anchor-row-pos { font-size: 13.5px; font-weight: 600; }
.anchor-row-detail { flex: 1 1 210px; min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--text-sm); }
.anchor-mode-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex: none; }
.anchor-mode-btn { padding: 6px 11px; border: none; background: var(--card-bg); color: var(--text-sm); font-family: 'Heebo', sans-serif; font-size: 11.5px; font-weight: 500; cursor: pointer; }
.anchor-mode-btn:hover { background: var(--nav-bg); }
.anchor-mode-btn.active { background: var(--accent); color: #fff; font-weight: 600; }
.anchor-actions { display: flex; gap: 5px; flex-wrap: wrap; }
.btn-anchor-row { height: 29px; padding: 0 10px; display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--card-bg); color: var(--text-sm); font-size: 11.5px; font-weight: 600; }
.btn-anchor-row:hover { background: var(--nav-bg); }
.btn-anchor-remove { height: 29px; padding: 0 10px; border-radius: 8px; color: var(--text-sm); font-size: 11.5px; font-weight: 600; background: transparent; border: none; cursor: pointer; }
.btn-anchor-remove:hover { color: var(--red); }
.flag-grid { border-top: 1px solid var(--border-md); padding: 15px 22px 18px; display: grid; grid-template-columns: repeat(auto-fit,minmax(215px,1fr)); gap: 12px; }
.flag-box { border-radius: 10px; padding: 12px 13px; }
.flag-box.neutral { background: var(--nav-bg); }
.flag-box.warn { background: var(--warn-bg); }
.flag-box-h { font-size: 11px; font-weight: 600; margin-bottom: 7px; }
.flag-box.neutral .flag-box-h { color: var(--text-muted); }
.flag-box.warn .flag-box-h { color: var(--orange); }
.flag-box-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.flag-box-val { font-size: 12.5px; font-weight: 600; }
.flag-box-sub { font-size: 11.5px; color: var(--text-muted); }
.btn-flag-remove { height: 27px; padding: 0 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--card-bg); color: var(--text-sm); font-size: 11px; font-weight: 600; }
.btn-flag-remove:hover { background: var(--nav-bg); }
.hearts-num { font-size: 12.5px; font-weight: 700; }
.hearts-edit { margin-top: 8px; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.hearts-edit input[type=number] { height: 28px; padding: 0 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--card-bg); font-size: 12px; }
.hearts-edit input[type=number]:first-child { width: 66px; font-weight: 600; }
.hearts-edit input[type=number]:nth-child(2) { width: 62px; }
.btn-hearts-update { height: 28px; padding: 0 10px; border-radius: 7px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; border: none; cursor: pointer; }
.btn-hearts-update:hover { background: var(--accent-dark); }
.btn-hearts-reset { height: 28px; padding: 0 9px; border-radius: 7px; color: var(--text-sm); font-size: 11px; font-weight: 600; background: transparent; border: none; cursor: pointer; }
.btn-hearts-reset:hover { color: var(--red); }

/* ── כרטיס "5 השלבים" — שלב 2 חלק ד׳ (§131), שלב-אחר-שלב. כרגע רק שלב 1 ממומש בסגנון הזה,
   שלבים 2-5 עדיין בסגנון-הישן (edit-section-title/sec-edit-form) עד שיומרו בתורם. ── */
.steps-card { padding: 0; overflow: hidden; }
.steps-head { padding: 17px 24px 15px; display: flex; align-items: center; gap: 12px; }
.steps-head-title { font-size: 15px; font-weight: 700; flex: 1; }
.steps-head-hint { font-size: 12px; color: var(--text-muted); }
/* טאבים "ביקורת ואישור"/"כל מה שהעסק מילא" בראש כרטיס 5-השלבים (תואם-handoff, 2026-08-04) */
.steps-tabs { padding: 0 24px; display: flex; align-items: center; gap: 24px; border-bottom: 1px solid var(--border-md); }
.steps-tab { padding: 17px 0 14px; font-size: 14.5px; font-weight: 500; color: var(--text-sm); background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.steps-tab.active { color: var(--text); font-weight: 700; border-bottom-color: var(--accent); }
/* כרטיס "אימות בעל העסק" עשיר (תואם-handoff, 2026-08-04) — מציג תמונת-הוכחה+פרטי-מנוי+פייסבוק+3
   כפתורי-החלטה, במקום שורת-סיכום פשוטה. שדה חדש ownerVerificationStatus (ר' setOwnerVerification) —
   לא היה קיים בסכימה קודם, נוסף כאן כדי לתעד את ההחלטה בלי לגעת בזרימת האישור/דחייה של העסק כולו. */
.owner-verify-card { margin: 0 24px 20px; border: 1px solid var(--border-md); border-radius: 12px; overflow: hidden; display: flex; flex-wrap: wrap; }
.owner-verify-photo { flex: 0 0 232px; background: #101828; position: relative; min-height: 180px; display: flex; align-items: center; justify-content: center; }
.owner-verify-photo img { width: 100%; height: 100%; min-height: 180px; object-fit: cover; }
.owner-verify-photo-empty { color: #98A2B3; font-size: 12px; font-weight: 600; padding: 20px; text-align: center; }
/* §294 — "המסלול דורש תמונה ואין" הוא ממצא, לא היעדר-מידע: הוא חייב להיראות אחרת
   מ"במסלול הזה אין תמונה", אחרת המנהל מאשר בלי לשים לב שהראיה חסרה. */
.owner-verify-photo-empty.warn { color: #FDB022; }
/* §361 — מאיפה הגיעה הראיה, כשהיא לא יושבת על רשומת החבר עצמה. */
.proof-src { margin-top: 6px; font-size: 11px; font-weight: 600; color: #98A2B3; text-align: center; }
/* §294 — התמונה נפתחת ב-lightbox הקיים של הדשבורד (openImageLightbox), לא בטאב חדש.
   ⚠️ לא נבנה כאן lightbox שני: הדשבורד כבר מחזיק אחד (#lightboxImg), כולל כפתור הורדה
   ומעבר דרך /view-image — שנדרש כדי לראות תמונות של עסק pending. */
.owner-verify-photo img.zoomable { cursor: zoom-in; }
.owner-verify-info { flex: 1 1 300px; min-width: 0; padding: 16px 18px; display: flex; flex-direction: column; gap: 13px; }
.owner-verify-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(118px,1fr)); gap: 13px; }
.owner-verify-fb { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; padding-top: 13px; border-top: 1px solid var(--border-md); }
.owner-verify-fb a { font-size: 12.5px; font-weight: 600; color: var(--accent); }
/* §340 — שתי תוספות לשורת הפרופיל החברתי: מאיפה בטופס הערך הגיע, ומה קורה כשהוא בכלל לא
   כתובת. שתיהן טקסט-משנה ולא צ'יפ — הן מלוות את הקישור, לא מתחרות בו. */
.owner-verify-fb .social-src { font-size: 11.5px; color: var(--text-muted); }
/* §342 — הערך הגולמי הוא הדבר הראשי בשורה; "פתיחה ←" נלווה אליו. שבירת-מילים חיונית:
   כתובת פייסבוק ארוכה בתא-רשת צר גלשה מחוץ לכרטיס. */
.social-val { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
.social-val .social-raw { font-weight: 600; overflow-wrap: anywhere; direction: ltr; text-align: right; unicode-bidi: plaintext; }
.social-val a { font-size: 12.5px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.social-val .social-bad { font-size: 12px; font-weight: 600; color: var(--orange); white-space: nowrap; }
.social-val .social-src { font-size: 11.5px; color: var(--text-muted); }
.owner-verify-fb .social-bad { font-size: 12.5px; font-weight: 600; color: var(--orange); }
.owner-verify-hint { background: var(--nav-bg); border-radius: 9px; padding: 9px 11px; font-size: 12px; color: var(--text-sm); line-height: 1.5; }
/* §298 — במסך צר הכרטיס גולש לשתי שורות, ואז `flex: 0 0 232px` השאיר את התמונה ברוחב
   קבוע עם שטח מת לצידה. ברוחב מלא היא גם נקראת טוב יותר — וזו הראיה שהמנהל בא לראות.
   חל על שני הכרטיסים (אוהד ובעל-עסק) כי הם חולקים את אותן מחלקות. */
@media (max-width: 640px) {
  .owner-verify-photo { flex: 1 1 100%; min-height: 210px; }
  .owner-verify-photo img { min-height: 210px; }
}
/* שורת-הסטטוס הנוכחי של אימות בעל העסק — נוספה אחרי בלבול-אמת בין באדג' "ממתין להחלטה" בכותרת
   לבין כפתור בניסוח-עבר ("אימות אושר") בתוך הכרטיס. ר' ההערה ליד ownerVerifStateLine. */
.owner-verify-state { border-radius: 9px; padding: 9px 11px; font-size: 12.5px; font-weight: 700; line-height: 1.5; }
.owner-verify-state.ok  { background: rgba(22,163,74,.10); color: #15803d; }
.owner-verify-state.bad { background: rgba(185,28,28,.10); color: #b91c1c; }
.owner-verify-state.wait{ background: var(--warn-bg, rgba(234,179,8,.12)); color: var(--orange, #a35b00); }
.owner-verify-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: auto; }
/* "כל מה שהעסק מילא" — תצוגת-קריאה */
.form-summary-toolbar { padding: 14px 24px; background: var(--nav-bg); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--border-md); }
.form-summary-note { flex: 1; min-width: 220px; font-size: 12.5px; color: var(--text-sm); line-height: 1.5; }
.form-summary-check { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--text); cursor: pointer; user-select: none; }
.form-summary-body { padding: 4px 24px 20px; }
.form-sec-title { padding: 14px 0 8px; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; color: var(--text-muted); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(184px,1fr)); gap: 12px 20px; padding-bottom: 6px; }
.form-field.full { grid-column: 1 / -1; }
.form-field-label { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
.form-field-val { font-size: 13.5px; font-weight: 600; line-height: 1.6; }
.form-field-val.empty { color: var(--text-muted); font-weight: 500; }
/* שדה-רשות שלא מולא — נאמר במפורש במקום להיעלם מהכרטיס. הסיבה ("לא נשאל" מול "דילג")
   קטנה ודהויה יותר מהקביעה עצמה: היא הקשר, לא הנתון. */
.opt-empty { font-style: italic; color: var(--text-muted); font-weight: 500; }
.opt-empty.warn { font-style: normal; color: var(--orange); font-weight: 700; }
.opt-empty-why { font-size: 11.5px; opacity: .72; font-style: normal; }
.only-missing [data-empty="false"] { display: none; }
.form-discounts { display: flex; flex-direction: column; gap: 9px; padding-bottom: 16px; }
.form-discount-box { border: 1px solid var(--border-md); border-radius: 10px; padding: 11px 13px; }
.form-discount-tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
.form-discount-tag { background: var(--nav-bg); color: var(--text-sm); font-size: 10.5px; font-weight: 700; border-radius: 6px; padding: 2px 8px; }
.form-discount-tag.primary { background: var(--accent-cta); color: var(--accent-cta-ink); }
.form-discount-meta { font-size: 11.5px; color: var(--text-muted); }
.form-discount-text { font-size: 13.5px; line-height: 1.6; }
@media print { .no-print, .sidebar, .task-list-col, .msg-content-head, .steps-tabs, .decision-panel, .identity-card, .anchor-card, .approve-card, .qj-card { display: none !important; } }
.step-block { border-top: 1px solid var(--border-md); }
.step-block.open { background: var(--nav-bg); }
.step-row { padding: 15px 24px; display: flex; align-items: center; gap: 13px; }
.step-num { width: 26px; height: 26px; flex: none; border-radius: 99px; background: var(--nav-bg); color: var(--text-sm); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.step-num.active { background: var(--accent); color: #fff; }
.step-body { flex: 1; min-width: 0; }
.step-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step-name { font-size: 14px; font-weight: 600; }
.step-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
/* מספור-שלבים מהטופס החדש (business.html §145) שונה מחלוקת-השדות כאן — לא "פשוט שכתוב", ר' PROJECT_CONTEXT.md §146.
   רפרנס בלבד ליד שם השלב, לא שינוי-מבנה/נתונים. */
.step-form-ref { font-size: 10.5px; font-weight: 500; color: var(--text-muted); margin-inline-start: 6px; }
.step-reviewed { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--text); user-select: none; }
.step-reviewed input { width: 16px; height: 16px; accent-color: var(--accent); }
.btn-step-edit { height: 32px; padding: 0 13px; border: 1px solid var(--border); border-radius: 8px; background: var(--card-bg); font-size: 12.5px; font-weight: 600; color: var(--text); cursor: pointer; }
.btn-step-edit:hover { background: var(--nav-bg); }
.btn-step-close { height: 32px; padding: 0 13px; border: none; border-radius: 8px; background: var(--text); color: #fff; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.btn-step-close:hover { opacity: .85; }
.step-form { display: none; padding: 2px 24px 22px; }
.step-form.open { display: block; }
.step-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
.step-field.full { grid-column: 1 / -1; }
.step-field-h { font-size: 11.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
.step-field-h.changed { display: flex; align-items: center; gap: 7px; color: var(--accent); }
.field-changed-tag { background: var(--accent-bg); color: var(--accent); font-size: 10px; font-weight: 600; border-radius: 5px; padding: 1px 6px; }
.step-field input[type=text], .step-field input[type=url], .step-field input[type=email], .step-field input[type=date], .step-field select, .step-field textarea { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--card-bg); font-size: 13.5px; font-family: 'Heebo', sans-serif; }
.step-field textarea { height: auto; padding: 10px 12px; line-height: 1.6; resize: vertical; }
.step-field input.changed-val { border-color: rgba(var(--accent-rgb),.35); background: rgba(var(--accent-rgb),.03); font-weight: 600; }
.step-field-was { margin-top: 6px; font-size: 11.5px; color: var(--text-sm); }
/* כרטיסי-סוג-עסק — הוחלף מ-chip-צף-קטן לעיצוב זהה ל-business.html (biz-type-card, §145 v2):
   רשת-3-עמודות, אייקון+שם+תיאור, מסגרת+רקע מודגשים כשנבחר. אותם CSS-vars של admin (--accent וכו'),
   לא הצבעים המקוריים של business.html (זהב/כחול) — שפת-עיצוב-מנהל, לא שפת-עיצוב-אתר-ציבורי.
   input עצמו מוסתר, ה-label כולו לחיץ (זהה למנגנון הישן, רק העטיפה הוויזואלית השתנתה). */
.biz-type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.biz-type-card {
  display: block; border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 6px; text-align: center; cursor: pointer; user-select: none; transition: all .15s;
  background: var(--card-bg);
}
.biz-type-card:hover:not(.on) { border-color: rgba(var(--accent-rgb),.5); }
.biz-type-card.on { border-color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.15); }
.biz-type-card input { display: none; }
.biz-type-card .bt-icon { display: flex; justify-content: center; margin-bottom: 5px; color: var(--text); }
.biz-type-card .bt-name { font-size: 12px; font-weight: 700; color: var(--text); }
.biz-type-card .bt-desc { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; line-height: 1.3; }
.step-form-actions { margin-top: 18px; display: flex; gap: 9px; }
.btn-step-save { height: 38px; padding: 0 20px; border: none; border-radius: 9px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-step-save:hover { background: var(--accent-dark); }
.btn-step-cancel { height: 38px; padding: 0 16px; border: 1px solid var(--border); border-radius: 9px; background: var(--card-bg); color: var(--text-sm); font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-step-cancel:hover { background: var(--nav-bg); }

/* ── מרכז המשימות (דשבורד ראשי בלבד, 2026-08-05 §156) — טבלה ברוחב-מלא + drawer צף, לא split ── */
.task-table { background: var(--card-bg); border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09); overflow: hidden; }
.task-table-row { display: grid; grid-template-columns: minmax(200px,1.4fr) 230px 150px 110px 152px; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--border); cursor: pointer; transition: background .12s; }
.task-table-acts { display: flex; flex-direction: column; gap: 5px; align-items: stretch; }
.task-table-row:first-child { border-top: none; }
.task-table-row:hover { background: rgba(var(--accent-rgb),.03); }
.task-table-row.active { background: rgba(var(--accent-rgb),.07); }
.task-table-main { min-width: 0; }
.task-table-name { font-size: 13.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-table-meta { font-size: 11px; color: var(--text-sm); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-table-badges { display: flex; gap: 4px; flex-wrap: wrap; }
.task-table-review { min-width: 0; }
.task-table-review-bars { display: flex; gap: 3px; margin-bottom: 4px; }
.task-table-review-bars span { flex: 1; height: 4px; border-radius: 99px; background: var(--border-md); display: block; }
.task-table-review-bars span.on { background: var(--accent-cta); }
.task-table-review-lbl { font-size: 10.5px; color: var(--text-sm); }
.task-table-wait { font-size: 12px; font-weight: 600; color: var(--text-sm); }
.task-table-row .act-btn.primary-yellow { background: var(--accent-cta); color: var(--accent-cta-ink); border: none; font-weight: 800; }
.task-table-row .act-btn.primary-yellow:hover { background: var(--accent-cta-hover); }
/* §252 — "✔️ טופל" לכרטיס חסר. ירוק-רך בכוונה ולא אדום/צהוב: זו לא דחייה ולא אישור-תוכן,
   אלא "ראיתי, זה בסדר ככה" — ולכן גם לא מתחרה ויזואלית בכפתור הפעולה הראשי שמעליו. */
.task-table-row .act-btn.task-accept-gaps { border-color: rgba(22,163,74,.45); color: #15803d; font-weight: 700; }
.task-table-row .act-btn.task-accept-gaps:hover { background: rgba(22,163,74,.09); }

/* ── §257 — סדר הגלריה בטופס העריכה (מרכז הניהול) ─────────────────────────────────────────
   חיצים ולא גרירה, מאותה סיבה כמו בדשבורד של בעל-העסק: המסך נבדק במובייל, וגרירה בתוך רשימה
   שנגללת נשברת שם. המספר הוא המיקום בפועל בגלריה שהאוהד רואה. */
.gal-pos-input {
  flex: none; width: 46px; padding: 5px 6px; text-align: center;
  font-family: 'Rubik', sans-serif; font-size: 13px; font-weight: 800; color: var(--text);
  border: 1px solid var(--border-md); border-radius: 7px; background: var(--card-bg);
}
.gal-pos-input:focus { outline: none; border-color: var(--accent-cta); }

/* ── §253 — רצועת "הצטרפות" (בראש הדשבורד הראשי / כל העסקים / כל האוהדים) ──────────────
   רצועה אחת דקה, לא רשת-קוביות: בדשבורד הראשי כבר יש שורת-KPI + 7 קוביות-סיווג מעל
   מרכז המשימות, וקוביות נוספות הפכו את המסך ללא-קריא (בקשת המשתמש, 2026-08-24). */
.joins-card {
  display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap;
  background: var(--card-bg); border-radius: 12px; box-shadow: 0 1px 3px rgba(16,24,40,.09);
  padding: 9px 14px; margin-bottom: 14px;
}
.joins-title { font-weight: 800; font-size: 13px; color: var(--text); }
.joins-period { width: auto; min-width: 158px; }
.joins-stat { display: inline-flex; align-items: baseline; gap: 6px; }
.joins-sum-num { font-size: 18px; font-weight: 800; color: var(--text); }
.joins-sum-ent { font-size: 12px; font-weight: 600; color: var(--text-sm); }
.joins-brk { font-size: 11px; color: var(--text-sm); white-space: nowrap; }
/* נדחפת לקצה הרצועה — הערת-שוליים, לא נתון שמתחרה במספרים */
.joins-note { margin-inline-start: auto; font-size: 11px; color: var(--text-sm); cursor: help; }
@media (max-width: 700px) {
  .joins-note { margin-inline-start: 0; }
}

/* ── תקלות מייל (§204) — קובייה חמישית במרכז המשימות; אותו שלד-טבלה, עם עמודת-כתובת במקום עמודת-הסקירה ── */
.mail-issues-note { font-size: 11.5px; color: var(--text-sm); margin: 0 0 8px; line-height: 1.7; }
.task-table.mail-issues .task-table-row { grid-template-columns: minmax(180px,1.3fr) 210px minmax(150px,.9fr) 100px 190px; cursor: default; }
.mail-issues .mi-addr { font-size: 11.5px; font-weight: 600; direction: ltr; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-issues .mi-addr.bad { color: #b91c1c; text-decoration: underline wavy rgba(185,28,28,.5); }
.mail-issues .mi-actions { display: flex; gap: 6px; flex-wrap: wrap; }
@media (max-width: 900px) {
  .task-table.mail-issues .task-table-row { grid-template-columns: 1fr; }
}
.task-drawer-backdrop { position: fixed; inset: 0; background: rgba(16,24,40,.32); z-index: 59; }
.task-drawer {
  position: fixed; top: 0; bottom: 0; inset-inline-end: 0; z-index: 60; width: 52vw; min-width: 520px; max-width: 96vw;
  background: var(--bg); overflow-y: auto; border-inline-start: 1px solid var(--border); box-shadow: -10px 0 34px rgba(16,24,40,.13);
}
.task-drawer-head { position: sticky; top: 0; z-index: 2; background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
.task-drawer-close {
  width: 32px; height: 32px; flex: none; border: 1px solid var(--border); border-radius: 9px; background: var(--card-bg);
  color: var(--text-sm); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.task-drawer-close:hover { background: var(--nav-bg); color: var(--text); }
.task-drawer-body { padding: 16px 20px 40px; }
@media (max-width: 860px) {
  .class-tiles { grid-template-columns: repeat(2,1fr); }
  .task-table-row { grid-template-columns: 1fr; gap: 6px; }
  .task-table-review, .task-table-wait { display: none; }
  .task-drawer { width: 100vw; min-width: 0; }
}

/* ── active-tab info panel ── */
.tab-info {
  background: rgba(var(--accent-rgb),.05); border: 1px solid rgba(var(--accent-rgb),.2); border-radius: 12px;
  padding: 12px 14px; margin-bottom: 14px; font-size: 12px; line-height: 1.75;
}
.tab-info .ti-title { font-weight: 800; color: var(--accent); font-size: 12.5px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.tab-info .ti-type { font-size: 10px; font-weight: 700; color: var(--text-muted); background: rgba(var(--accent-rgb),.06); padding: 1px 8px; border-radius: 10px; }
.tab-info .ti-body { color: var(--text-sm); }
.tab-info .ti-body b { color: var(--text); }

/* ── expiring-soon panel — §141: הפך לכרטיס כהה-נייבי בעמודה-צדדית, אותו דפוס כמו history-card
   במרכז ההודעות (§139) — 0 שינוי-לוגיקה, רק CSS+מיקום. ── */
.expiring-panel {
  background: var(--accent); border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09);
  padding: 16px 18px 14px; margin-bottom: 0; color: #fff;
}
.expiring-title { font-size: 14.5px; font-weight: 700; color: #fff; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.expiring-empty { font-size: 11.5px; color: rgba(255,255,255,.75); }
.expiring-subgroup { margin-bottom: 14px; }
.expiring-subgroup:last-child { margin-bottom: 0; }
.exp-sub-title { font-size: 10.5px; font-weight: 800; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; color: rgba(255,255,255,.75); }
.exp-sub-title.warn { color: var(--accent-cta); }
.exp-sub-title.ok-title { color: #C9D6EE; }
.exp-sub-list { background: transparent; border-radius: 10px; overflow: hidden; }
.expiring-item { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-top: 1px solid rgba(255,255,255,.14); }
.expiring-item:first-child { border-top: none; }
.exp-pos {
  flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,.14);
  border: none; font-size: 9.5px; font-weight: 900; color: #fff;
  display: flex; align-items: center; justify-content: center;
}
.exp-body { flex: 1; min-width: 0; font-size: 12px; font-weight: 700; color: #fff; }
.exp-body .succ { font-weight: 400; color: rgba(255,255,255,.75); }
.exp-body .succ .cv { color: var(--accent-cta); font-weight: 700; }
.exp-days { font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.exp-days.urgent { color: var(--accent-cta); background: rgba(255,212,0,.16); }
.exp-days.soon { color: var(--accent-cta); background: rgba(255,212,0,.16); }
.exp-days.ok { color: rgba(255,255,255,.75); background: rgba(255,255,255,.12); }
.exp-action-btn {
  flex-shrink: 0; border: 1.5px solid rgba(255,255,255,.3); background: transparent; color: #fff;
  font-family: 'Heebo', sans-serif; font-size: 10.5px; font-weight: 700; padding: 5px 9px; border-radius: 8px; cursor: pointer;
}
.exp-action-btn:hover { border-color: var(--accent-cta); color: var(--accent-cta); }

/* ── סקשנים ועיגונים — פריסת 2-עמודות, expiring-panel כהה בעמודה-צדדית (§141) ── */
.sections-layout { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 18px; align-items: start; }
.sections-col-main { min-width: 0; }
.sections-col-side { position: sticky; top: 16px; min-width: 0; }
@media (max-width: 860px) { .sections-layout { grid-template-columns: 1fr; } .sections-col-side { position: static; } }

/* ── slots table — §141: dcard-wrap + רשימה-מחוברת (border-top), במקום קופסה-בודדת-פר-מיקום ── */
.slots-wrap { border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09); background: var(--card-bg); overflow: hidden; }
.slots-wrap-head { padding: 15px 20px 13px; font-size: 15px; font-weight: 700; }
.slots { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--border-md); }
.slot {
  background: var(--card-bg); border: none; border-radius: 0;
  padding: 13px 20px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--border-md);
}
.slot:first-child { border-top: none; }
.slot.anchored { background: rgba(var(--accent-rgb),.04); }
.slot-num {
  flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--nav-bg);
  border: 1.5px solid var(--border-md); display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900; color: var(--text-sm);
}
.slot.anchored .slot-num { background: var(--accent); color: #fff; border-color: var(--accent); }
.slot-body { flex: 1; min-width: 0; }
.slot-empty-txt { font-size: 12.5px; color: var(--text-muted); }
.slot-biz-name { font-size: 13.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.slot-meta { font-size: 11px; color: var(--text-sm); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.slot-meta .fixed-tag { color: var(--green); font-weight: 700; }
.slot-meta .temp-tag { color: var(--orange); font-weight: 700; }
.chain-line { font-size: 10.5px; color: var(--text-sm); margin-top: 4px; }
/* "המיקום באינדקס" בכרטיס העסק (שלב 4ב) — fixed-tag/temp-tag כאן עומדים לבד, לא בתוך .slot-meta */
.fixed-tag { color: var(--green); font-weight: 700; font-size: 11px; }
.temp-tag { color: var(--orange); font-weight: 700; font-size: 11px; }
.anchor-loc-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 0; border-top: 1px solid var(--border); }
.anchor-loc-row:first-of-type { border-top: none; }

/* מרכז לבבות (שלב 4ד) */
/* §142 — dcard-style (רדיוס-14+צל) כמו כל שאר הטבלאות/רשימות שהומרו הסשן הזה */
/* עודכן (2026-08-04, תואם-handoff מלא): פריסת 2-עמודות (hearts-layout) + פאנל צד, שורה עם
   קטגוריה+לינק-לכרטיס, עריכה הפכה מ-inputs-תמידיים-בשורה לפאנל-toggle תחת השורה (hearts-edit-panel) */
.hearts-layout { display: grid; grid-template-columns: minmax(0,1fr) 356px; gap: 18px; align-items: start; }
.hearts-col-main { min-width: 0; }
.hearts-col-side { position: sticky; top: 16px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 860px) { .hearts-layout { grid-template-columns: 1fr; } .hearts-col-side { position: static; } }

.hearts-table { background: var(--card-bg); border: none; border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09); overflow: hidden; }
.hearts-row { display: grid; grid-template-columns: 26px minmax(150px,1.4fr) 60px 60px 66px 130px 150px; gap: 10px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--border-md); font-size: 12.5px; }
.hearts-row:first-child { border-top: none; }
.hearts-row.hearts-head { font-size: 11px; font-weight: 800; color: var(--text-sm); background: var(--nav-bg); }
.hearts-row.selected { background: rgba(var(--accent-rgb),.05); }
.hearts-row.active-edit { background: var(--warn-bg); border-inline-start: 3px solid var(--accent-cta); padding-inline-start: 17px; }
.hearts-check { width: 18px; height: 18px; border: 1.5px solid var(--border-md); border-radius: 5px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; }
.hearts-name-cell { min-width: 0; }
.hearts-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hearts-cat { font-size: 11px; color: var(--text-sm); margin-top: 2px; }
.hearts-real, .hearts-shown { text-align: center; }
.hearts-gap { text-align: center; font-weight: 700; }
.hearts-gap.big { color: var(--orange); }
.hearts-validity { font-size: 11.5px; font-weight: 600; color: var(--text-sm); }
.hearts-row.active-edit .hearts-validity { color: var(--text); }
.hearts-row-actions { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }

.hearts-edit-panel { padding: 14px 20px 16px; background: var(--nav-bg); border-top: 1px solid var(--border-md); }
.hearts-edit-title { font-size: 12.5px; font-weight: 700; margin-bottom: 11px; }
.hearts-edit-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.hearts-edit-label { font-size: 11px; font-weight: 600; color: var(--text-sm); margin-bottom: 5px; }
.hearts-edit-input { width: 92px; height: 34px; padding: 0 10px; border: 1px solid var(--border-md); border-radius: 9px; background: var(--card-bg); font-size: 13px; font-weight: 700; }
.hearts-edit-input.days { width: 84px; font-weight: 400; }
.hearts-edit-hint { flex: 1; min-width: 170px; font-size: 11.5px; color: var(--text-sm); line-height: 1.55; padding-bottom: 8px; }

.hearts-bulk-bar { padding: 13px 20px 16px; border-top: 1px solid var(--border-md); display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.hearts-bulk-label { font-size: 12.5px; font-weight: 600; }
.hearts-bulk-hint { font-size: 11.5px; color: var(--text-sm); }

.hearts-loved-head { padding: 15px 16px 12px; }
.hearts-loved-title { font-size: 13.5px; font-weight: 700; }
.hearts-loved-sub { font-size: 11.5px; color: var(--text-sm); margin-top: 3px; }
.hearts-loved-list { border-top: 1px solid var(--border-md); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.hearts-loved-row { display: flex; align-items: center; gap: 9px; }
.hearts-loved-rank { width: 19px; font-size: 11.5px; font-weight: 700; color: var(--accent); }
.hearts-loved-name { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hearts-loved-num { font-size: 12px; font-weight: 700; }
.hearts-loved-cta { padding: 0 16px 16px; }
.hearts-loved-link { display: block; width: 100%; text-align: center; height: 32px; line-height: 32px; border: 1px solid var(--border-md); border-radius: 8px; background: var(--card-bg); color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; }
.hearts-loved-link:hover { background: var(--nav-bg); }
.hearts-loved-note { padding: 12px 16px 15px; background: var(--warn-bg); font-size: 11.5px; color: var(--text-sm); line-height: 1.6; }

.hearts-side-note { background: var(--nav-bg); border-radius: 14px; padding: 15px 16px; }
.hearts-side-note-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
.hearts-side-note-body { font-size: 12.5px; color: var(--text-sm); line-height: 1.65; }
.hearts-side-note-body a { color: var(--accent); font-weight: 600; cursor: pointer; }

/* מרכז נתונים — טאב "עסקים" בלבד, נתון-אמת בלבד (פריט 4 האחרון, §3 במפרט) */
.data-tbl { background: var(--card-bg); border: none; border-radius: 14px 14px 0 0; box-shadow: 0 1px 3px rgba(16,24,40,.09); overflow: hidden; }
/* §275 — נוספה עמודת "מימושים" (העמודה הרביעית). היא רחבה מהשאר כי מתחת למספר יושב פירוק
   לפי ערוץ ("העתיקו קוד 12 · עברו לאתר 5"), ו-align-items עבר ל-start כדי שהפירוק לא ידחוף
   את שאר העמודות למרכז. */
.data-row { display: grid; grid-template-columns: minmax(150px,1.3fr) 80px 80px minmax(150px,1.1fr) 110px minmax(140px,1fr); gap: 10px; align-items: start; padding: 12px 20px; border-top: 1px solid var(--border-md); font-size: 12.5px; }
.data-redeem-brk { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-top: 3px; line-height: 1.5; }
/* שורת סיכום-הערוצים מעל הטבלה — סה"כ לכל הפלטפורמה, לא פר-עסק */
.redeem-kpi-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.redeem-kpi { background: var(--card-bg); border-radius: 12px; box-shadow: 0 1px 3px rgba(16,24,40,.09); padding: 10px 16px; min-width: 104px; }
.redeem-kpi-num { font-size: 18px; font-weight: 800; color: var(--text); }
.redeem-kpi-lbl { font-size: 11.5px; color: var(--text-sm); margin-top: 2px; }
.data-row:first-child { border-top: none; }
.data-row.data-head { font-size: 11px; font-weight: 800; color: var(--text-sm); background: var(--nav-bg); }
.data-name { font-weight: 700; }
.data-cat { font-size: 11.5px; color: var(--text-muted); }
.data-val { color: var(--text-sm); }
.data-val.strong { font-weight: 700; color: var(--text); }

/* §281 — פאנל "פלטפורמה": כניסות ומשפך-הרשמה מתוך collection 'events' (עד היום נאסף ולא הוצג) */
.plat-panel { background: var(--card-bg); border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09); padding: 15px 18px 16px; margin-bottom: 12px; }
.plat-title { font-size: 13.5px; font-weight: 800; }
.plat-sub { font-size: 11.5px; color: var(--text-sm); line-height: 1.65; margin-top: 3px; }
.plat-note { font-size: 11.5px; line-height: 1.65; color: var(--text-sm); background: rgba(255,212,0,.1); border-radius: 10px; padding: 9px 12px; margin-top: 10px; }
.plat-note b { color: var(--text); }
.plat-sect { font-size: 12px; font-weight: 800; color: var(--text); margin: 14px 0 6px; }
.plat-head-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.plat-toggle { display: inline-flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 11.5px; color: var(--text-sm); cursor: pointer; }
.plat-toggle input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
/* שורות במקום ריבועים (2026-08-26) — רשת-ריבועים דחסה את ההסבר לכלום, ו-12 ריבועים זהים
   נקראו כקיר-מספרים בלי היררכיה. שורה נותנת מקום אמיתי למשפט שמסביר מה נספר. */
.plat-rows { border-top: 1px solid var(--border-md); }
.plat-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; padding: 10px 2px 11px; border-bottom: 1px solid var(--border-md); }
.plat-row-name { font-size: 13px; font-weight: 700; color: var(--text); flex: 1 1 150px; }
.plat-row-num { font-size: 19px; font-weight: 800; color: var(--text); }
.plat-row-sub { font-size: 11.5px; font-weight: 700; color: var(--accent); }
.plat-row-help { flex: 1 1 100%; font-size: 11px; color: var(--text-sm); line-height: 1.6; }
.plat-row-help b { color: var(--text); font-weight: 700; }

/* פסי משפך — הרוחב יחסי לשלב הראשון, כדי שהנשירה תיראה לעין ולא רק תיקרא כמספר */
.plat-bar-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
.plat-bar-name { flex: 0 0 118px; font-size: 12.5px; font-weight: 700; color: var(--text); }
.plat-bar-track { flex: 1; height: 26px; min-width: 70px; background: var(--nav-bg); border-radius: 7px; overflow: hidden; }
.plat-bar-fill { height: 100%; background: var(--accent); border-radius: 7px; min-width: 3px; }
.plat-bar-val { flex: 0 0 auto; min-width: 68px; font-size: 13px; font-weight: 800; color: var(--text); }

/* ── §394 — שורת-פילוח שמובילה לרשימה, והבאנר שמסביר למה הרשימה מסוננת ──────────────── */
.plat-row.clickable { cursor: pointer; border-radius: 8px; transition: background .12s; }
.plat-row.clickable:hover { background: var(--nav-bg); }
.plat-row-go { font-size: 11px; font-weight: 700; color: var(--accent); opacity: 0; transition: opacity .12s; }
.plat-row.clickable:hover .plat-row-go { opacity: 1; }

.fan-bucket-banner { background: var(--nav-bg); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin: 2px 0 4px; }
.fan-bucket-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.fan-bucket-title { font-size: 12.5px; font-weight: 800; color: var(--text); }
.fan-bucket-count { font-size: 16px; font-weight: 800; color: var(--accent); }
.fan-bucket-action { font-size: 11.5px; line-height: 1.7; color: var(--text-sm); margin-top: 6px; }
.fan-bucket-action b { color: var(--text); font-weight: 700; }
.row-wa-btn { margin-inline-start: auto; background: #25D366; color: #fff; border: none; border-radius: 7px;
  padding: 4px 10px; font-size: 11.5px; font-weight: 700; cursor: pointer; font-family: inherit; flex: none; }
.row-wa-btn:hover { filter: brightness(.93); }
/* ⚠️ מודיפייר בלבד, לא `.task-row-meta` הגלובלי: הכלל ההוא (שורה 1141) נושא
   white-space/overflow/ellipsis ומשרת את **כל** שורות העסקים והאוהדים. דריסתו ל-flex
   הייתה משנה את קיצור-הטקסט בכל הרשימות בשביל כפתור שמופיע רק בסינון-דלי. */
.task-row-meta.has-action { display: flex; align-items: center; gap: 8px; overflow: visible; }

/* ── §393 — יומן מחיקות ושחזור ─────────────────────────────────────────────────────────── */
.del-note { background: var(--nav-bg); border: 1px solid var(--border-md); border-radius: 10px; padding: 12px 14px; font-size: 12px; line-height: 1.75; color: var(--text-sm); margin-bottom: 14px; }
.del-note b { color: var(--text); font-weight: 700; }
.del-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px; padding: 13px 4px 14px; border-bottom: 1px solid var(--border-md); }
.del-row-main { flex: 1 1 240px; min-width: 0; }
.del-row-name { font-size: 14px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.del-kind { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--nav-bg); border: 1px solid var(--border-md); color: var(--text-sm); }
.del-row-ident { font-size: 11.5px; color: var(--text-sm); line-height: 1.7; margin-top: 3px; }
.del-row-actor { font-size: 11.5px; font-weight: 700; color: var(--accent); margin-top: 5px; }
.del-row-side { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.del-restored { font-size: 11.5px; font-weight: 700; color: var(--green, #1a7f4b); text-align: left; line-height: 1.6; }
.del-attempted { font-size: 11px; font-weight: 700; color: var(--orange); }
.plat-bar-pct { font-size: 11.5px; font-weight: 700; color: var(--text-sm); }
.plat-drop { font-size: 12px; font-weight: 700; color: var(--orange); padding-right: 128px; }
.plat-funnel-help { font-size: 11px; color: var(--text-sm); line-height: 1.7; margin-top: 8px; }
.plat-funnel-help b { color: var(--text); font-weight: 700; }
@media (max-width: 620px) {
  .plat-bar-name { flex-basis: 92px; }
  .plat-drop { padding-right: 0; }
}
.plat-src { display: flex; flex-wrap: wrap; gap: 6px; }
.plat-src-chip { background: var(--nav-bg); border-radius: 999px; padding: 5px 12px; font-size: 11.5px; color: var(--text-sm); }
.plat-src-chip b { color: var(--text); }

/* ── עסק השבוע · הטבת השבוע — 3 חלקים ── */
.wk-live-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 4px; }
.wk-live-grid.single { grid-template-columns: 1fr; max-width: 360px; }
.wk-live-card { background: var(--card-bg); border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09); padding: 14px 16px; }
.wk-live-card.empty { display: flex; flex-direction: column; }
.wk-live-label { font-size: 12px; font-weight: 700; color: var(--text-muted); }
.wk-live-name { font-size: 15px; font-weight: 700; margin-top: 4px; }
.wk-live-range { font-size: 12px; color: var(--text-sm); margin-top: 2px; }
.wk-live-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.wk-sched-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(16,24,40,.09); margin-bottom: 4px; }
.wk-sched-row { background: var(--card-bg); padding: 12px 18px; }
.wk-sched-week { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.wk-sched-sub { font-size: 11.5px; color: var(--text-sm); margin-top: 3px; }
.wk-sched-form { margin-top: 10px; }
.wk-content-block { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border-md); }
.wk-content-block-h { font-size: 12px; font-weight: 700; margin-bottom: 8px; }
.wk-live-img { width: 100%; height: 90px; object-fit: cover; border-radius: 9px; margin-bottom: 8px; }
.wk-sched-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.wk-tbl { background: var(--card-bg); border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09); overflow: hidden; }
.wk-row { display: grid; grid-template-columns: 26px minmax(140px,1.3fr) 100px minmax(110px,.9fr) 110px minmax(220px,1.2fr); gap: 10px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--border-md); font-size: 12.5px; }
.wk-row:first-child { border-top: none; }
.wk-row.wk-head { font-size: 11px; font-weight: 800; color: var(--text-sm); background: var(--nav-bg); }
.wk-check input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.wk-row-actions { display: flex; gap: 5px; flex-wrap: wrap; }
@media (max-width: 720px) {
  .wk-live-grid { grid-template-columns: 1fr; }
  .wk-row { grid-template-columns: 1fr; }
  .wk-row.wk-head { display: none; }
}
/* מסך-ממוזג (2026-08-05) — שני מסלולים זה-לצד-זה על אותו עמוד, בלי עמודה-שלישית-קבועה */
.wk-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; margin-bottom: 4px; }
@media (max-width: 860px) { .wk-two-col { grid-template-columns: 1fr; } }
.wk-track-label { font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.wk-action-panel .expiring-item { cursor: pointer; }
.wk-action-panel .expiring-item:hover { background: rgba(255,255,255,.06); }
.wk-howto { background: var(--card-bg); border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09); overflow: hidden; }
.wk-howto-head { padding: 15px 16px 12px; font-size: 13.5px; font-weight: 700; }
.wk-howto-steps { border-top: 1px solid var(--border-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.wk-howto-step { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: var(--text-sm); line-height: 1.6; }
.wk-howto-step b { color: var(--accent); flex-shrink: 0; }
.wk-howto-note { padding: 12px 16px 15px; background: rgba(255,212,0,.1); font-size: 11.5px; color: var(--text-sm); line-height: 1.6; }
.biz-foot { padding: 13px 20px 16px; border-top: 1px solid var(--border-md); font-size: 11.5px; color: var(--text-sm); line-height: 1.65; background: var(--card-bg); border-radius: 0 0 14px 14px; }
.biz-foot .hl { font-weight: 600; color: var(--text); }
.biz-foot .warnhl { font-weight: 700; color: var(--orange); }
.chain-line .cv { color: var(--accent); font-weight: 700; }
.slot-actions { flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; }
.slot-btn {

/* ── picker panel (inline, replaces slot body when picking) ── */

}

/* ══════ תוכן דף הנחיתה (שלב 6) ══════ */

.lct-grid.panel-hidden .lct-panel { display: none; }
@media (max-width: 980px) { .lct-grid { grid-template-columns: 1fr; } }

.lct-panel { background: var(--card-bg); border: none; border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.09); overflow: hidden; position: sticky; top: 16px; }

.lct-block-row.selected { background: rgba(var(--accent-rgb),.06); border-inline-start: 3px solid var(--accent); padding-inline-start: 13px; }

.lct-block-row.locked:hover { background: transparent; }
.lct-block-name { font-size: 12.5px; font-weight: 700; flex: 1; min-width: 0; }
.lct-block-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.lct-block-dirty { background: var(--warn-bg); color: var(--orange); font-size: 9.5px; font-weight: 800; border-radius: 5px; padding: 1px 6px; flex-shrink: 0; }
.lct-block-link { font-size: 11px; font-weight: 700; color: var(--accent); flex-shrink: 0; }

}
.lct-field input[type=text]:focus, .lct-field textarea:focus, .lct-field select:focus { outline: none; border-color: var(--accent); }
.lct-count { font-size: 10.5px; color: var(--text-muted); margin-top: 3px; text-align: left; }
.lct-count.warn { color: var(--orange); font-weight: 700; }
.lct-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.lct-hint { margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--border-md); font-size: 11px; color: var(--text-muted); line-height: 1.6; }

  width: 100%; height: 34px; border-radius: 8px; border: 1.5px dashed var(--border-md); background: #fff;

}

.lct-btn-add-tile:disabled { opacity: .4; cursor: default; }

.lct-preview-col { min-width: 0; }
.lct-preview-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.lct-preview-head-title { font-size: 12.5px; font-weight: 800; }
.lct-preview-head-hint { font-size: 11px; color: var(--text-muted); }
.lct-device-toggle { display: flex; border: 1px solid var(--border-md); border-radius: 8px; overflow: hidden; margin-inline-start: auto; }
.lct-device-toggle > div { padding: 6px 12px; font-size: 11.5px; font-weight: 700; cursor: pointer; }
.lct-frame { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(16,24,40,.09); }
.lct-frame-bar { padding: 8px 13px; background: var(--nav-bg); display: flex; align-items: center; gap: 6px; }
.lct-frame-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-md); }
.lct-frame-url { margin-inline-start: 9px; font-size: 10.5px; color: var(--text-muted); background: #fff; border-radius: 6px; padding: 3px 9px; }
.lct-frame-body { font-family: 'Rubik', sans-serif; background: var(--lp-bg); margin: 0 auto; }

.lct-hero { background: var(--lp-acc); padding: 38px 24px 32px; text-align: center; }
.lct-hero h1 { font-size: 32px; font-weight: 800; letter-spacing: -.02em; color: var(--lp-ink); line-height: 1.18; max-width: 720px; margin: 0 auto; word-break: break-word; outline: none; cursor: text; border-radius: 5px; }
.lct-hero h1.empty { color: rgba(10,42,102,.32); }
.lct-hero-slogan { margin-top: 12px; font-size: 13px; font-weight: 800; letter-spacing: .08em; color: var(--lp-ink); opacity: .78; outline: none; cursor: text; border-radius: 5px; display: inline-block; }
.lct-hero [contenteditable]:hover, .lct-hero [contenteditable]:focus { box-shadow: 0 0 0 2px rgba(10,42,102,.28); }

.lct-tiles-row { display: flex; flex-wrap: wrap; gap: 14px; padding: 26px 22px 6px; }
.lct-tile { position: relative; border-radius: 16px; overflow: hidden; background: #dfe1e6; }
.lct-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
.lct-tile .noimg { position: absolute; inset: 0; background: linear-gradient(135deg, var(--lp-ink), #123a8c); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.5); font-size: 11.5px; font-weight: 700; cursor: pointer; }
.lct-tile-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,42,102,.9) 0%, rgba(10,42,102,.7) 40%, rgba(10,42,102,.22) 66%, rgba(10,42,102,0) 82%); pointer-events: none; }
.lct-tile-content { position: absolute; inset: 0; padding: 17px 19px 0; pointer-events: none; }
.lct-tile-content [contenteditable] { pointer-events: auto; }
.lct-tile [contenteditable] { outline: none; border-radius: 5px; transition: box-shadow .12s; cursor: text; }
.lct-tile [contenteditable]:hover, .lct-tile [contenteditable]:focus { box-shadow: 0 0 0 2px rgba(255,255,255,.55); }
.lct-tile [contenteditable]:empty::before { content: attr(data-placeholder); opacity: .55; }
.lct-tile-title { font-size: 18px; font-weight: 800; color: #fff; word-break: break-word; }
.lct-tile-sub { margin-top: 6px; font-size: 12px; color: rgba(255,255,255,.95); max-width: 280px; line-height: 1.5; word-break: break-word; }
.lct-tile-pill { position: absolute; bottom: 14px; inset-inline-end: 14px; height: 29px; padding: 0 12px; border-radius: 999px; background: var(--lp-acc); color: var(--lp-ink); font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; min-width: 20px; }
.lct-tile-imgbtn {
  position: absolute; inset-inline-start: 10px; top: 10px; height: 26px; padding: 0 10px; border-radius: 999px; border: none;
  background: rgba(255,255,255,.94); color: var(--lp-ink); font-size: 10.5px; font-weight: 800; cursor: pointer;
  opacity: 0; transition: opacity .15s; display: flex; align-items: center; gap: 4px;
}
.lct-tile:hover .lct-tile-imgbtn { opacity: 1; }
.lct-tile-uploading { position: absolute; inset: 0; background: rgba(10,42,102,.55); color: #fff; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

.lct-pv-block { padding: 30px 22px 8px; text-align: center; }
.lct-pv-kicker { font-size: 11px; font-weight: 800; letter-spacing: .07em; color: rgba(10,42,102,.55); text-transform: uppercase; outline: none; cursor: text; border-radius: 5px; }
.lct-pv-title { font-size: 21px; font-weight: 800; letter-spacing: -.02em; color: var(--lp-ink); margin-top: 6px; outline: none; cursor: text; border-radius: 5px; }
.lct-pv-sub { font-size: 12px; color: rgba(10,42,102,.62); margin: 8px auto 0; max-width: 440px; outline: none; cursor: text; border-radius: 5px; }
.lct-pv-block [contenteditable]:hover, .lct-pv-block [contenteditable]:focus { box-shadow: 0 0 0 2px rgba(10,42,102,.18); }
.lct-pv-block [contenteditable]:empty::before { content: attr(data-placeholder); opacity: .4; }
.lct-pv-placeholder { margin: 15px auto 0; max-width: 500px; border: 1px dashed rgba(10,42,102,.25); border-radius: 12px; padding: 15px; font-size: 11px; color: rgba(10,42,102,.45); }

.lct-biz-section { padding: 22px 22px 0; }
.lct-biz-box { background: var(--lp-ink); color: #fff; border-radius: 16px; padding: 22px 24px; }
.lct-biz-eyebrow { font-size: 10.5px; font-weight: 800; letter-spacing: .07em; color: var(--lp-acc); outline: none; cursor: text; border-radius: 4px; }
.lct-biz-title { font-size: 18px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; margin-top: 8px; outline: none; cursor: text; border-radius: 4px; }
.lct-biz-text { font-size: 12px; line-height: 1.6; color: rgba(255,255,255,.76); margin-top: 8px; outline: none; cursor: text; border-radius: 4px; }
.lct-biz-btn { display: inline-flex; margin-top: 12px; height: 36px; padding: 0 17px; border-radius: 10px; background: var(--lp-acc); color: var(--lp-ink); font-size: 12.5px; font-weight: 800; align-items: center; outline: none; cursor: text; }
.lct-biz-box [contenteditable]:hover, .lct-biz-box [contenteditable]:focus { box-shadow: 0 0 0 2px rgba(255,255,255,.4); }
.lct-biz-box [contenteditable]:empty::before { content: attr(data-placeholder); opacity: .5; }

.lct-final-section { padding: 18px 22px 0; }
.lct-final-box { border-radius: 16px; background: var(--lp-acc); padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.lct-final-title { font-size: 20px; font-weight: 800; color: var(--lp-ink); outline: none; cursor: text; border-radius: 4px; }
.lct-final-sub { font-size: 12px; color: rgba(10,42,102,.78); outline: none; cursor: text; border-radius: 4px; }
.lct-final-actions { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.lct-final-btn { height: 35px; padding: 0 16px; border-radius: 9px; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; outline: none; cursor: text; }
.lct-final-btn.ink { background: var(--lp-ink); color: #fff; }
.lct-final-btn.white { background: #fff; color: var(--lp-ink); }
.lct-final-box [contenteditable]:hover, .lct-final-box [contenteditable]:focus { box-shadow: 0 0 0 2px rgba(10,42,102,.3); }
.lct-final-box [contenteditable]:empty::before { content: attr(data-placeholder); opacity: .5; }

.lct-footer-note { padding: 20px 24px 24px; text-align: center; font-size: 11px; color: var(--text-muted); }

/* ── שומר-אינדיקטור גלובלי — הפער שדווח: לחיצה על שמירה/העלאת-תמונה לא הראתה שום שינוי במסך
   עד ש-renderMain() רץ בסוף (יכול לקחת כמה שניות בהעלאת/דחיסת תמונה) — למנהל לא היה שום סימן
   שהלחיצה בכלל נקלטה. פיל קבוע-מיקום, לא תלוי בכפתור הספציפי (יש עשרות נקודות-שמירה בקובץ הזה). */
.saving-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(0); z-index: 9999;
  display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: var(--ink, #14213d);
  color: #fff; font-size: 13px; font-weight: 700; box-shadow: 0 6px 24px rgba(0,0,0,.25); opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s; }
.saving-toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.saving-toast.error { background: #b3261e; }
.saving-toast.ok { background: #1e7d4a; }
.saving-toast-spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; animation: saving-toast-spin .7s linear infinite; flex: none; }
.saving-toast.error .saving-toast-spinner, .saving-toast.ok .saving-toast-spinner { display: none; }
@keyframes saving-toast-spin { to { transform: rotate(360deg); } }
</style>

<div class="img-lightbox-overlay" id="imgLightboxOverlay" onclick="if(event.target===this)closeImageLightbox()">
  <button class="lightbox-close-btn" onclick="closeImageLightbox()">✕</button>

<script type="module">
// ── 2026-07-26: חובר ל-Firestore אמיתי (שלב 1) — MOCK_BUSINESSES/MOCK_FANS הוחלפו ב-onSnapshot
// אמיתי (ר' בסוף הקובץ). השם "MOCK_" נשאר בכוונה (39 מקומות משתמשים בו בקובץ) — הוא כבר לא מוק,
// זה נתון אמיתי. hydrateBiz/hydrateFan למטה ממפים בין שמות שדות שהדמו המקורי המציא לשמות האמיתיים
// ב-Firestore (למשל hasCoverPhoto נגזר מ-coverPhoto, ownerIsSubscriber מ-isSubscriber==='yes').
// שדות שאין להם מקבילה אמיתית כלל (region, reviewedSections, adminVerified/adminNote,
// pendingChangeDiff/aiShortTitle) מקבלים ברירת מחדל בטוחה — עדיין לא ניתן לשמור אותם בפועל
// (ר' באנר האזהרה ב-bizFullDetailHtml/fanFullDetailHtml ותיעוד ב-PROJECT_CONTEXT.md §54).
import { db, auth, getStorageLazy } from './firebase-config.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js';
import {
  collection, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp, getDoc, runTransaction, query, where, getDocs, writeBatch, setDoc, addDoc, orderBy, limit, getCountFromServer, arrayUnion, deleteField
} from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js';
import { ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-storage.js';
// מנוע העיצוב של גוף המייל — אותו קובץ בדיוק שהוורקר מייבא (worker/src/brevo.js), כדי שהתצוגה
// המקדימה במרכז ההודעות תהיה מה שנשלח בפועל ולא חיקוי שלו. ר' ההערה בראש mail-format.js.
import { MAIL_FONTS, mailFontKey, renderMailHtml, footerHtml as mailFooterHtml } from './mail-format.js';
// §393 — יומן מחיקות ושחזור. אותו קובץ בדיוק שמייבאים admin-members.html ו-admin-businesses.html,
// כדי ששלוש הדלתות שמוחקות חבר/עסק יריצו את **אותו** מנגנון ולא שלושה חיקויים שמתיישנים בנפרד.
import { logAndDelete, restoreDeleted, fetchDeletionLog, deletionConfirmText, deletionLabel } from './deletion-log.js';

// ── §244 — טוקן הכניסה לדשבורד יושב ב-bizTokens/{businessId}, לא על מסמך העסק ────────────────
// מסמך עסק approved קריא ציבורית לגמרי, ולכן טוקן-כניסה שיושב עליו שקול לפרסום סיסמה.

function showSaving(label) {

// §318 — יציע עליון/תחתון. קיים בכדורסל בלבד (במנורה מבטחים יש שתי טבעות), ורשומות שנרשמו
// לפני §318 פשוט אין להן ערך — מחזיר '' ולא "—", כדי שהקורא יוכל להשמיט את השדה לגמרי.
const TIER_LABELS = { upper: 'עליון', lower: 'תחתון' };
function normSocialHref(u) {
  const s = String(u || '').trim();
  if (!s) return '';
  // ⚠️ שתי הבק-סלאשים בשורה הזאת נבלעו בעבר בכתיבה דרך heredoc (ר' §355), והתוצאה הייתה
  // שקטה לגמרי: `/^https?:` נסגר כרג'קס, ו-`//i.test(s) ? …` הפך להערה עד סוף השורה — כלומר
  // הפונקציה החזירה **אובייקט RegExp** במקום כתובת, בלי שום שגיאה ובלי ש-node --check יתלונן.
  return /^https?:\/\//i.test(s) ? s : 'https://' + s.replace(/^\/+/, '');

// ── §340 — קישור-פרופיל שהוא לא קישור ────────────────────────────────────────────────────
// שדות הפייסבוק/אינסטגרם של אוהד ושל בעל-עסק הם טקסט חופשי, וחלקם נשמרים **בלי שום ולידציה**
// (השדה האופציונלי "פייסבוק או אינסטגרם" ב-fan-register.html, וגם שדות העריכה כאן במרכז
// הניהול). בפועל נרשמים מקלידים את *שם* הפרופיל ולא כתובת. עד עכשיו הערך הגולמי נדחף היישר
// ל-href — ומחרוזת בלי סכימה היא כתובת **יחסית**, ולכן "פתיחה ←" הובילה אל
// yellowzone.co.il/<מה שהוקלד>, כלומר 404 מהאתר שלנו. זה נקרא למנהל כמו תקלה במרכז הניהול
// במקום כמו נתון-רישום שגוי, ולכן גם לא היה שום סיכוי שיתוקן מול האוהד.
//
// הנרמול עובר עכשיו דרך social-links.js (HB_LINKS) — בדיוק אותו מנוע שכבר מנרמל את קישורי
// העסק (§232) — ומה שאי-אפשר לגזור ממנו כתובת מוצג כטקסט מסומן ולא כקישור מת. הערך הגולמי
// לא נדרס אף פעם: הנרמול הוא בזמן רינדור בלבד, וגם כשהוא נכשל המנהל רואה בדיוק מה נכתב.
// fail-open אם הקובץ לא נטען — נפילה-לאחור ל-normSocialHref, שלפחות אינו יחסי.
// §342 — **הערך הגולמי מוצג תמיד, והקישור הוא תוספת לידו.**
// המשתמש, מול הכרטיס: *"זה כמו לחצן לפייסבוק, לא רואים בכלל מה האוהד מילא"* — צודק. עד
// עכשיו השורה הציגה רק "פתיחה ←", כלומר הנתון עצמו היה בלתי-נראה: אי-אפשר היה לדעת אם
// האוהד מסר כתובת מלאה, שם-משתמש, או את שמו בעברית — ואלה שלוש רמות-אמינות שונות לגמרי.
// עכשיו מה שהוא כתב מופיע כטקסט, ו-"פתיחה ←" נלווה אליו רק כשיש מה לפתוח.
function socialProofValHtml(kind, raw, allowGuess) {
  const n   = window.HB_LINKS ? window.HB_LINKS.normalize(kind, raw) : null;
  const guessed = !!(n && n.confidence === 'guessed');
  const url = n ? ((n.ok && (allowGuess !== false || !guessed)) ? n.url : '') : normSocialHref(raw);
  const rawHtml = `<span class="social-raw">${esc(raw)}</span>`;
  if (!url) {
    // ── §362 — סדר הפוך ("drorchen.facebook.com") ──────────────────────────────────────
    // לא "לא כתובת" ולא "שם משתמש": הערך כמעט נכון וחסר בו היפוך אחד. זה בדיוק הנוסח
    // שצריך לחזור לאוהד כשמבקשים ממנו לתקן, ולכן ההצעה מוצגת כטקסט — **לא** כקישור.
    // עד היום הערך הזה הופיע כאן כ"פתיחה ←" תקין לגמרי, והוביל לשגיאת-רשת.
    if (n && n.reason === 'reversed') {
      return rawHtml + '<span class="social-bad">סדר הפוך — הכתובת לא קיימת' +
             (n.suggest ? ' · כנראה ' + esc(n.suggest) : '') + '</span>';
    }
    // §345 — שתי סיבות שונות לגמרי לכך שאין קישור, ולמנהל הן מחייבות פעולה שונה:
    // שם-משתמש הוא מצביע שאפשר לחפש בשתי הרשתות (הטופס מקבל אותו בכוונה, ופשוט מסרב
    // לנחש לאיזו רשת הוא שייך); טקסט חופשי הוא לא-כלום. "לא כתובת" על שניהם היה קובר
    // את ההבדל ושולח את המנהל לחפש דווקא במקרה שאין בו מה לחפש.
    //
    // §362 — ונשאלות **שתי** הרשתות. קו-תחתון פסול בשם-משתמש של פייסבוק וחוקי לגמרי
    // באינסטגרם, ולכן handle אינסטגרמי טיפוסי ("ofek_k28") נבדק כאן מול פייסבוק בלבד,
    // נפל, והוצג כ"אין מה לפתוח" — כלומר נתון מצוין לחיפוש נקרא למנהל כמו רעש. שלושה
    // אוהדים רשומים מוצגים כך היום.
    const ig = window.HB_LINKS ? window.HB_LINKS.normalize('instagram', raw) : null;
    const looksLikeHandle = !!(n && n.ok && guessed) ||
                            !!(ig && ig.ok && ig.confidence === 'guessed');
    return rawHtml + `<span class="social-bad">${looksLikeHandle ? 'שם משתמש — לחיפוש בפייסבוק/אינסטגרם' : 'לא כתובת — אין מה לפתוח'}</span>`;
  }
  // 'guessed' = הוקלד שם-משתמש בלבד והורכבה ממנו כתובת. חייב להיאמר במפורש שזו השלמה שלנו
  // ולא מה שהאוהד מסר — אחרת פרופיל שגוי ייראה כמו ראיה שהוא עצמו סיפק.
  return rawHtml + `<a href="${esc(url)}" target="_blank" rel="noopener">פתיחה ←</a>` +
         (guessed ? `<span class="social-src">(כתובת שהושלמה מהשם)</span>` : '');
}

// תא ברשת האימות. המשתמש: *"תכניס את זה לאימות שלא יהיה ככה בנפרד, שנדע מאיפה זה נכנס"* —
// הפרופיל הוא חלק מהאימות ולא נספח מתחתיו, ומקור-השדה יושב בתווית עצמה.
function socialProofCellHtml(kind, label, value, srcShort, allowGuess) {
  const raw = String(value == null ? '' : value).trim();
  if (!raw) return '';
  const head = srcShort ? `${label} · ${srcShort}` : label;
  return `<div><div class="form-field-label">${esc(head)}</div>` +
         `<div class="form-field-val social-val">${socialProofValHtml(kind, raw, allowGuess)}</div></div>`;
}

// שורה (כרטיס בעל-העסק) — אותו תוכן בדיוק, פריסה אחרת.
function socialProofRowHtml(kind, label, value, srcNote, allowGuess) {
  const raw = String(value == null ? '' : value).trim();
  if (!raw) return '';
  return `<div class="owner-verify-fb"><span class="form-field-label">${esc(label)}</span>` +
         `<span class="social-val">${socialProofValHtml(kind, raw, allowGuess)}</span>` +
         (srcNote ? `<span class="social-src">${esc(srcNote)}</span>` : '') + `</div>`;
}

// ── §340 — באיזה שלב בטופס נמסר הפייסבוק ─────────────────────────────────────────────────
// facebookUrl הוא שדה אחד שמתמלא **משלושה מקומות שונים** ב-fan-register.html:
//   1. לא-מנוי → "קישור לפרופיל הפייסבוק שלך", שדה חובה (נבדק http + facebook).
//   2. מנוי שבחר במסלול "תמונה מהיציע + פייסבוק" → standsFacebookUrl (נבדק שנראה ככתובת).
//   3. מנוי בכל מסלול אחר → השדה האופציונלי "פייסבוק או אינסטגרם" — בלי ולידציה בכלל.
// ההבדל מכריע להחלטה: ב-1 וב-2 הפרופיל הוא **חלק מהראיה**, וב-3 הוא תוספת רשות שאין עליה
// שום התחייבות. עד עכשיו שלושתם נראו זהה — שורת "פייסבוק" אחת — ולא היה איך לדעת מהיכן הוא
// הגיע. הנתון כבר קיים ברשומה (isSubscriber + verifyMethod); הוא פשוט לא הוצג.
// §343 — מאיזה שדה בטופס הגיע הפרופיל. תווית קצרה, יושבת בתווית התא ברשת האימות.
// 'verifyRoute' כבר לא נכתב (§342 — השדה ירד ממסלול היציע), אבל נשאר כאן בשביל רשומות
// שנכתבו איתו.
const PROFILE_SOURCE_SHORT = {
  nonSubRequired: 'שדה חובה, לא-מנוי',
  verifyRoute:    'מתוך מסלול האימות',
  optional:       'שדה רשות',
};
function fanProfileSourceShort(f) {
  const src = f.profileSource || f.facebookUrlSource;   // facebookUrlSource — שם קודם, §340-§342
  if (src) return PROFILE_SOURCE_SHORT[src] || src;
  // ⚠️ נפילה-לאחור לרשומות שנוצרו לפני §343 (כל האוהדים הקיימים). הגזירה נכונה למסלולים
  // כפי שהיו, ואי-אפשר לדעת ממנה יותר — לכן היא מסומנת ולא מוצגת כאילו תועדה.
  if (!f.verifyMethod) return 'הרשמה ישנה';
  const g = !f.isSubscriber ? PROFILE_SOURCE_SHORT.nonSubRequired
          : f.verifyMethod === 'standsPhoto' ? PROFILE_SOURCE_SHORT.verifyRoute
          : PROFILE_SOURCE_SHORT.optional;
  return g + ' (משוער)';
}
function sectionWithTier(section, tier) {
  const t = TIER_LABELS[tier] || '';
  if (!section) return t;
  return t ? section + ' · ' + t : section;
}
const SPORT_LABELS = { football: 'כדורגל', basketball: 'כדורסל', both: 'כדורגל+כדורסל' };

// ── ענף האימות (2026-08-27) ───────────────────────────────────────────────────────────────
// הנרשם שמנוי בשני הענפים בוחר בטופס **על איזה מהם** הוא מאמת, וזה קובע מה בכלל אפשר
// לצפות לראות: בכדורסל (מנורה מבטחים) אין "גוש", ולכן פרטי-מושב בלי גוש הם רשומה תקינה
// ולא מילוי חלקי. עד היום הבחירה הזאת השתקפה רק בתווית שדה-המיקום (שער↔אולם/יציע) —
// כלומר המנהל לא יכול היה לדעת אותה בלי לפענח תווית. עכשיו היא תא משלה.
function verifiedSportCellHtml(verifiedSport, fanSport) {
  const v = verifiedSport || (fanSport && fanSport !== 'both' ? fanSport : null);
  const note = fanSport === 'both' ? ' <span style="opacity:.6">(מתוך שניהם)</span>' : '';
  return `<div><div class="form-field-label">ענף האימות</div><div class="form-field-val${v ? '' : ' empty'}">${

  }</div></div>`;
}

// ── מסלולי אימות אוהד (§284) ────────────────────────────────────────────────────────────────
// עד §284 היה מסלול אחד בלבד — "מספר מנוי" כשדה-חובה גורף — ומדידה על 59 המנויים הרשומים
// הראתה ש-29 מהם הזינו ערך מומצא (00000/12345/11111). עכשיו הנרשם בוחר איך לאמת, ולכן מרכז
// הניהול חייב להראות **באיזה מסלול** נבחר, אחרת "מס' מנוי: —" נראה כמו רשומה חסרה במקום
// כמו אוהד שאימת בדרך אחרת.
const VERIFY_METHOD_LABELS = {
  subNumber:      'מספר מנוי',
  passScreenshot: 'צילום מסך של המנוי',
  seatDetails:    'פרטי מושב',
  purchaseEmail:  'אישור רכישה/חידוש במייל',
  // §342 — היה 'תמונה מהיציע + פייסבוק'. שדה הפייסבוק ירד מהמסלול ב-fan-register.html
  // (הוא הופיע פעמיים באותו מסך), והראיה במסלול היא התמונה בלבד.
  // ⚠️ business.html **עדיין** אוסף פרופיל בתוך המסלול הזה — התווית משותפת לשני הכרטיסים,
  // ולכן היא מנוסחת כשם-מסלול נייטרלי. הפרופיל של בעל-העסק מוצג בשורה משלו ממילא.
  standsPhoto:    'תמונה מהיציע',
  manual:         'בקשה ידנית (טקסט חופשי)',
};

// §294 — התווית של **הערך** שנמסר, לא של המסלול. "מסלול: פרטי מושב · פרטי מושב: גוש 3…"
// היה חוזר על עצמו; שלושת המסלולים שיש להם ערך-טקסט מקבלים כאן תווית ייעודית.
const VERIFY_VALUE_LABELS = {
  subNumber:   'מספר המנוי',
  seatDetails: 'המושב',
  manual:      'מה נכתב',
};

// ⚠️ נפילה-לאחור ל-60 הרשומות שנוצרו **לפני** §284 ואין להן verifyMethod בכלל. בלי זה כל
// האוהדים הקיימים היו מוצגים כ"אימות: —" ביום שהמסך הזה עולה.
function fanVerifyMethod(f) {
  if (f.verifyMethod) return f.verifyMethod;
  if (f.isSubscriber) return f.subscriberNumber ? 'subNumber' : null;
  return 'standsPhoto';
}
function fanVerifyMethodLabel(f) {
  const m = fanVerifyMethod(f);
  if (!m) return 'לא תועד (הרשמה ישנה)';
  return VERIFY_METHOD_LABELS[m] || m;
}

// ── §294 — בעל עסק עובר דרך אותן פונקציות בדיוק ─────────────────────────────────────────
// מסמך העסק שומר את אותם נתונים בשמות אחרים (verifyRoute/subNum/gate). במקום להעתיק את
// טבלת-ההכרעה לכרטיס העסק — ושתי עותקות היו נפרדות זו מזו ביום הראשון — מתרגמים כאן פעם
// אחת לשמות של רשומת-אוהד, וכל השאר משותף. שינוי במסלולים יתפוס בשני המסכים יחד.
function ownerAsFan(b) {
  return {
    verifyMethod:     b.ownerVerifyRoute || (b.ownerIsSubscriber ? null : 'standsPhoto'),
    isSubscriber:     b.ownerIsSubscriber,
    verifiedSport:    b.ownerVerifiedSport,
    subscriberNumber: b.ownerSubscriberNumber,
    subscriberTier:   b.ownerSubscriberTier,   // §318
    seatArea:         b.ownerSeatArea,         // §318
    seatBlock:        b.ownerSeatBlock,
    seatRow:          b.ownerSeatRow,
    seatNumber:       b.ownerSeatNumber,
    verifyNote:       b.ownerVerifyNote,
  };
}

// המסלולים שהראיה שלהם היא **קובץ**. משמש גם את כרטיס האימות של העסק, כדי להבדיל בין
// "לא נדרשת תמונה במסלול הזה" לבין "נדרשת ולא הועלתה" — שתי מסקנות הפוכות למנהל.
const PHOTO_ROUTES = new Set(['passScreenshot', 'purchaseEmail', 'standsPhoto']);

// הערך שהנרשם מסר בפועל במסלול שבחר — מה שהמנהל צריך לקרוא כדי להחליט. מסלולי-תמונה
// מחזירים '' כי הראיה שלהם היא הקובץ עצמו, שכבר מוצג בנפרד בכרטיס.
function fanVerifyValue(f) {
  switch (fanVerifyMethod(f)) {
    case 'subNumber':   return f.subscriberNumber || '—';
    // בכדורסל אין "גוש" (מנורה מבטחים) והשדה כלל לא מוצג בטופס — בלי ההבחנה הזאת רשומה
    // תקינה של מנוי כדורסל נראית למנהל כמו מילוי חלקי של מנוי כדורגל.
    case 'seatDetails': return [
      f.seatArea ? 'אזור ' + f.seatArea : '',   // §318 — כדורגל בלבד
      f.seatBlock ? 'גוש ' + f.seatBlock
        : (f.verifiedSport === 'basketball' ? 'ללא גוש (כדורסל)' : ''),
      f.seatRow ? 'שורה ' + f.seatRow : '', f.seatNumber ? 'כיסא ' + f.seatNumber : '',
    ].filter(Boolean).join(' · ') || '—';
    case 'manual':      return f.verifyNote || '—';
    default:            return '';
  }
}

// ── תאריך לידה (2026-08-24) ────────────────────────────────────────────────────────────────
// נשמר כמחרוזת 'YYYY-MM-DD' על רשומת החבר (members), לא על מסמך העסק — מסמך של עסק מאושר
// נקרא ציבורית במלואו (§244) ותאריך לידה הוא מידע אישי.
const BIRTH_MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני',
                      'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
function fmtBirthDate(v) {
  if (!v) return '';
  const d = new Date(v + 'T00:00:00');
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' });
}
// ── שדות-רשות: "לא מולא" מול "לא נשאל" ─────────────────────────────────────────────────
// המשתמש: *"אני רוצה לראות בהרשמה של אוהד את השדות הלא חובה ולדעת האם מילא או לא"*.
// עד היום שדה-רשות ריק פשוט **לא הופיע בכלל** בכרטיס (socialProofCellHtml מחזיר '' על ערך
// ריק), ותאריך לידה ריק הופיע כ"לא מולא בהרשמה" — משפט שנכון רק לחלק מהרשומות.
//
// ⚠️ ההבחנה הקריטית: רוב האוהדים הקיימים ריקים כי **השדה לא היה קיים כשהם נרשמו**, לא כי
// הם דילגו עליו. שני השדות נוספו לטופס בתאריכים שונים, ואין מילוי רטרואקטיבי (§346):
//   תאריך לידה           → 2026-08-24 (commit 5bc171a)

// האופציות נבנות בתוך מחרוזת-התבנית של הפאנל ולא ממולאות אחרי הרינדור — הפאנל מרונדר מחדש
// בכל renderMain/refreshOpenDetailPanel, ומילוי מאוחר היה נמחק (ר' §246).
function birthOptionsHtml(kind, cur) {
  const o = (v, t, sel) => `<option value="${v}"${sel ? ' selected' : ''}>${t}</option>`;
  const [y, m, d] = cur ? String(cur).split('-').map(Number) : [0, 0, 0];
  if (kind === 'day')   return o('', 'יום', !d) + Array.from({ length: 31 }, (_, i) => o(i + 1, i + 1, d === i + 1)).join('');
  if (kind === 'month') return o('', 'חודש', !m) + BIRTH_MONTHS.map((n, i) => o(i + 1, n, m === i + 1)).join('');
  const ty = new Date().getFullYear();

// מחזיר 'YYYY-MM-DD' או null. הרכבה תמימה של 31/02 מחליקה ל-3 במרץ, לכן נבדק שהתאריך חזר
// בדיוק כמו שנבחר. המנהל **כן** רשאי לרוקן — הוא מי שמתקן נתון שגוי, והבוררים נטענים מהרשומה
// בכל רינדור כך שעריכת טלפון בלבד לא מוחקת תאריך קיים בטעות.
function composeBirthDate(day, month, year) {
  const d = +day, m = +month, y = +year;
  if (!d || !m || !y) return null;
  const dt = new Date(y, m - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

// ── העלאת מדיה אמיתית ל-Firebase Storage — זהה בדיוק ל-admin-businesses.html (uploadFile/
// compressImageFile/compressToFile/uploadImageWithThumb) — שלב 5 (מדיה) הוא הראשון בדמו שצריך את זה. ──
async function uploadFile(file, path) {

  // §290 — contentType מפורש: בלעדיו ה-SDK נופל ל-file.type, ואם הוא ריק נשלח
  // application/octet-stream ו-isImage() ב-storage.rules דוחה ב-403 ("storage/unauthorized").
  const contentType = /^image\//.test(file.type || '') ? file.type : 'image/jpeg';
  const snap = await uploadBytes(storageRef, file, { contentType, cacheControl: 'public, max-age=31536000, immutable' });
  return await getDownloadURL(snap.ref);
}
function fileToDataUrl(file) {

    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function dataUrlToFile(dataUrl, filename) {
  const [meta, b64] = dataUrl.split(',');
  const mime = meta.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new File([bytes], filename, { type: mime });
}
function compressImageFile(file, maxDim = 1280, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    fileToDataUrl(file).then(rawDataUrl => {
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, width, height);
        // webp — כ-25-35% קטן יותר מ-JPEG באיכות דומה.
        // ⚠️ toDataURL מחזיר PNG **בשקט** כשהדפדפן לא יודע לקודד את הטיפוס המבוקש — כך מוגדר בתקן,
        // ופרמטר ה-quality פשוט מתעלם (PNG הוא חסר-אובדן). זה לא תיאורטי: **6 מתוך 30 התמונות
        // המייצגות בפרודקשן נשמרו כ-PNG**, אחת מהן 2.2MB — פי ~15 מהמשקל, על אותה תמונה בדיוק.
        // לכן בודקים מה באמת חזר ונופלים ל-JPEG (נתמך בכל דפדפן) במקום להישאר עם PNG. §240
        const webp = canvas.toDataURL('image/webp', quality);
        resolve(webp.startsWith('data:image/webp') ? webp : canvas.toDataURL('image/jpeg', quality));

// ── תקרת הרזולוציה של התמונה המייצגת (§240) ─────────────────────────────────────────────────
// הכרטיס באינדקס הוא 4:3 עם object-fit:cover, ובמובייל הוא תופס ~358px CSS — כלומר במסך DPR=3
// הוא צריך **~1070 פיקסלים אמיתיים לרוחב**. התקרה הישנה (1280 בצד הארוך) נראתה מספיקה, אבל
// בתמונה **לאורך** הצד הארוך הוא הגובה: 960×1280 נותנת רק 960 פיקסל לרוחב הכרטיס. כלומר
// הדחיסה שלנו עצמה הורידה תמונות מתחת לסף החדות — 13 מתוך 30 התמונות בפרודקשן, רובן לאורך.
// 1600 מבטיח ≥1200 לרוחב גם בתמונה לאורך 3:4, במחיר ~100KB לקובץ. תקף לתמונה המייצגת בלבד;
// לוגו וגלריה נשארים על 1280 (הלוגו מוצג כתג קטן, הגלריה רק בתוך דף העסק).
const COVER_MAX_DIM = 1600;
async function uploadImageWithThumb(file, basePath, maxDim = 1280) {
  try {
    const [mainFile, thumbFile] = await Promise.all([
      compressToFile(file, maxDim, 0.82, file.name),
      compressToFile(file, 640, 0.80, 'thumb_' + file.name),
    ]);
    const [url, thumbUrl] = await Promise.all([
      uploadFile(mainFile, basePath),
      uploadFile(thumbFile, basePath + '_thumb'),
    ]);
    return { url, thumbUrl };
  } catch (e) {
    console.error('⚠️ image compression failed, falling back to original file:', e);
    return { url: await uploadFile(file, basePath), thumbUrl: '' };
  }
}

// המרה קריאה לתצוגת דיף — מקבל את מפתח השדה (k) כדי לתרגם ערכי enum/קטגוריה לעברית במקום להציג
// את המפתח הגולמי (למשל 'sport' → '⚽ ספורט') — זהה ברעיון ל-fmtFieldVal ב-business-dashboard.html.
// שדות-מבנה (מערך/אובייקט) לא עוברים כאן בפועל — quickJudgmentHtml מפנה אותם ל-qjStructuredPreviewHtml
// לפי הערך הגולמי (לא לפי המחרוזת המפורמטת כאן), אז הטיפול במערכים כאן הוא רק רשת-ביטחון למקרי-קצה
// (למשל discountRedeemMode בפורמט הישן — מחרוזת בודדת, לא מערך).
function fmtDiffVal(k, v) {
  if (k === 'discountRedeemMode' || k === 'discountTypes') {
    const arr = toRedeemArr(v);
    return arr.length ? arr.map(t => REDEEM_MODE_LABELS_MOCK[t] || t).join(', ') : '—';
  }
  if (k === 'bizTypes') return (v || []).length ? v.map(t => BIZ_TYPE_LABELS_MOCK[t] || t).join(', ') : '—';
  if (k === 'categoryPrimary' || k === 'cat' || k === 'alsoCategorySuggestion' || k === 'alsoUnderCategory') {
    return v ? ((CATEGORIES.find(c => c.key === v) || {}).label || v) : '—';
  }
  if (v == null || v === '') return '—';
  if (typeof v === 'boolean') return v ? 'כן' : 'לא';
  if (Array.isArray(v)) return v.length ? v.map(x => typeof x === 'object' ? JSON.stringify(x) : x).join(', ') : '—';
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}
