  const btns = document.querySelectorAll(`[data-ai-title-regen="${id}"]`);
  const optsEls = document.querySelectorAll(`[data-ai-title-options="${id}"]`);
  btns.forEach(btn => { btn.disabled = true; btn.textContent = '⏳ חושב על ניסוחים...'; });
  try {
    const resp = await fetch(WORKER_URL + '/shorten-benefit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },

    if (!data.shortTitles || !data.shortTitles.length) throw new Error(data.error || 'no_titles');
    const optionsHtml = data.shortTitles.map(t => `<button type="button" class="ai-title-option" onclick="pickAiTitleOption('${id}','${jsq(t)}')">${t}</button>`).join('');

// קוד כניסה קבוע (6 ספרות) — מחליף את ה-OTP. נבדקת ייחודיות מול Firestore לפני שימוש
// (זהה בדיוק ל-admin-members.html/admin-businesses.html generateLoginCode)
async function generateLoginCode() {
  for (let i = 0; i < 20; i++) {
    const code = String(Math.floor(100000 + Math.random() * 900000));
    const snap = await getDocs(query(collection(db, 'members'), where('loginCode', '==', code)));
    if (snap.empty) return code;
  }
  throw new Error('לא הצלחנו להגריל קוד ייחודי');
}
// זהה בדיוק ל-admin-members.html allocateMemberNumber
async function allocateMemberNumber() {
  const counterRef = doc(db, 'counters', 'members');
  return await runTransaction(db, async tx => {
    const snap = await tx.get(counterRef);
    const current = snap.exists() ? (snap.data().nextNumber || 1) : 1;
    tx.set(counterRef, { nextNumber: current + 1 });
    return current;
  });
}
// זהה בדיוק ל-admin-businesses.html approveLinkedMember — מאשר את החבר המקושר לעסק (ownerMemberId
// עדיף, ownerEmail רק fallback legacy) ומקצה לו מספר חבר+קוד כניסה אם עוד אין
async function approveLinkedMember(b) {
  try {
    let memberId = b.ownerMemberId || null;
    if (!memberId) {
      const email = b.ownerEmail || b.email || '';
      if (!email) return;
      const msnap = await getDocs(query(collection(db, 'members'), where('email', '==', email)));
      if (msnap.empty) return;
      memberId = msnap.docs[0].id;
    }
    const mSnap = await getDoc(doc(db, 'members', memberId));
    if (!mSnap.exists()) return;
    const m = mSnap.data();
    // loginCodeEmailStatus תמיד חוזר ל-pending (גם לחבר שכבר יש לו קוד) — המשתמש ביקש שהקוד
    // תמיד יישלח מחדש באישור, כדי שיהיה "מול העיניים" גם למי ששכח, לא רק בפעם הראשונה.
    const updates = { status: 'approved', approvedAt: serverTimestamp(), isBusinessOwner: true, loginCodeEmailStatus: 'pending' };
    if (!m.memberNumber) updates.memberNumber = await allocateMemberNumber();
    if (!m.loginCode) {
      updates.loginCode = await generateLoginCode();
      updates.loginCodeCreatedAt = serverTimestamp();
    }
    await updateDoc(doc(db, 'members', memberId), updates);
  } catch (e) { console.error('approveLinkedMember failed', e); }
}

  } catch (e) { console.error(e); alert('שגיאה באישור השינויים: ' + e.message); }
};

// ── שיפוט-מהיר פר-שדה (שלב 2ב, §7 במפרט) — מחליפות את approveChanges/rejectChanges הגורפות בממשק
// (אלה נשארות למעלה כ-fallback פנימי, לא מקושרות יותר לשום כפתור). כל שדה נמחק בנפרד מ-pendingChanges
// (לא כל המפה במכה אחת) — valueOverride כי המנהל יכול לתקן את הערך לפני האישור (השדה הוא קלט, לא טקסט).
window.approveChangeField = async function(id, field, valueOverride) {
  const b = findBiz(id);
  if (!b || !b.pendingChanges || !(field in b.pendingChanges)) return;
  const oldVal = b[field];
  // שדות-מבנה (מערך/אובייקט — תמונות/סרטונים/סניפים/הטבות-נוספות...) לא מגיעים עם valueOverride
  // בכלל (אין קלט-טקסט חופשי בשבילם, ר' qjStructuredPreviewHtml) — הערך המקורי מ-pendingChanges
  // הוא האמת, לא לבנות אותו מחדש מטקסט שהמנהל לא נגע בו.
  const newVal = valueOverride !== undefined ? valueOverride : b.pendingChanges[field];
  const newPending = { ...b.pendingChanges };
  delete newPending[field];
  const stillPending = Object.keys(newPending).length > 0;
  const updates = { [field]: newVal, pendingChanges: stillPending ? newPending : null };
  if (!stillPending) updates.pendingChangesAt = null;
  try {
    await updateDoc(doc(db, 'businesses', id), updates);
    Object.assign(b, updates);
    Object.assign(b, hydrateBiz(id, b));
    b.healthScore = computeHealthScore(b);
    await logActivity('businesses', id, {
      type: 'changeDecision', title: `אושר שינוי: ${DIFF_FIELD_LABELS_MOCK[field] || field}`,
      detail: `${DIFF_FIELD_LABELS_MOCK[field] || field}: "${fmtActivityVal(oldVal)}" → "${fmtActivityVal(newVal)}"`,
      field, before: oldVal, after: newVal,
    });
    renderMain();
  } catch (e) { console.error(e); alert('שגיאה באישור השינוי: ' + e.message); }
};
window.rejectChangeField = async function(id, field) {
  const b = findBiz(id);
  if (!b || !b.pendingChanges || !(field in b.pendingChanges)) return;
  const rejectedVal = b.pendingChanges[field];
  const newPending = { ...b.pendingChanges };
  delete newPending[field];
  const stillPending = Object.keys(newPending).length > 0;
  const updates = { pendingChanges: stillPending ? newPending : null };
  if (!stillPending) updates.pendingChangesAt = null;
  try {
    await updateDoc(doc(db, 'businesses', id), updates);
    Object.assign(b, updates);
    Object.assign(b, hydrateBiz(id, b));
    await logActivity('businesses', id, {
      type: 'changeDecision', title: `נדחה שינוי: ${DIFF_FIELD_LABELS_MOCK[field] || field}`,
      detail: `הבקשה לשנות ${DIFF_FIELD_LABELS_MOCK[field] || field} ל"${rejectedVal}" נדחתה`,
      field, before: b[field], after: null,
    });
    renderMain();
  } catch (e) { console.error(e); alert('שגיאה בדחיית השינוי: ' + e.message); }
};

// קפיצה מתקציר-השינויים בראש הכרטיס לעריכת השלב הרלוונטי + גלילה אליו. פותח את השלב רק אם הוא סגור —

// מוסיף גם הבהוב-צבע חד-פעמי (jump-flash) על השלב עצמו כתגובה ויזואלית מיידית ללחיצה — בנוסף לצביעה
// הקבועה של כותרת השלב + השדה הספציפי (secTitle/field-changed, ר' bizFullDetailHtml) שנשארת כל עוד השינוי ממתין.
window.jumpToBizSection = function(id, n) {
  const edit = document.getElementById('secEdit' + n + '_' + id);
  if (edit && !edit.classList.contains('open')) toggleBizSecEdit(id, n);

// וגם לצביעת כותרת-השלב + השדה הספציפי בטופסי העריכה (ר' secTitle/fieldChangeHintHtml למטה).
// מאחד דיף רגיל (טלפון/שעות/הטבה) + כל סוגי הצעות תגית/קטגוריה שנייה — "גם תגית או כל דבר שיהיה בשינויים".
function bizPendingChangeItems(b) {
  const items = [];
  if (b.pendingChangeDiff) {
    Object.keys(b.pendingChangeDiff).forEach(key => {
      const n = DIFF_FIELD_TO_SECTION[key] || 2;
      const d = b.pendingChangeDiff[key];
      items.push({ section: n, field: key, label: DIFF_FIELD_LABELS_MOCK[key] || key, old: d.old, new: d.new, detail: `לפני: "${d.old}"  →  עכשיו: "${d.new}"` });
    });
  }
  const liveSecondTag = (b.tags || [])[1] || '';
  if (b.tagSecondSuggestion && b.tagSecondSuggestion !== liveSecondTag) {
    items.push({ section: 3, field: 'tagSecondSuggestion', label: '🏷️ תגית שנייה', detail: `הציע/ה: "${b.tagSecondSuggestion}"` });
  }
  if (b.tagSuggestion) {
    items.push({ section: 3, field: 'tagSuggestion', label: '🆕 תגית חדשה (הצעה חופשית)', detail: `הציע/ה: "${b.tagSuggestion}"` });
  }
  const alsoCatSugMeta = (b.alsoCategorySuggestion && b.alsoCategorySuggestion !== b.alsoUnderCategory)
    ? CATEGORIES.find(c => c.key === b.alsoCategorySuggestion) : null;
  if (alsoCatSugMeta) {
    items.push({ section: 3, field: 'alsoCategorySuggestion', label: '🏷️ קטגוריה נוספת ("מופיע גם תחת")', detail: `הציע/ה: ${alsoCatSugMeta.icon} ${alsoCatSugMeta.label}` });

  return items;
}

// ("אם זה לא אומר מה הכותרת/נושא של המייל אין למה"). מבוסס messageBroadcastHistory (10 השידורים
// האחרונים, כבר טעון ב-onSnapshot) — לא כולל שליחות ידניות (WA/מייל בודד), כי אלה פותחות חלון
// אצל המנהל בלבד ואין שום אישור/רישום שהן אכן נשלחו בפועל.
function recipientEmailHistoryHtml(id, isFans, label) {
  const sent = messageBroadcastHistory
    .filter(h => (isFans ? h.audienceGroup === 'fans' : h.audienceGroup !== 'fans'))

  // וחי באינדקס; קורא ל-rejectBiz הקיימת (מחזירה approved→pending, בדיוק "הסרה" בפועל, ר' §16),
  // עם confirm ייעודי כי זו פעולה משמעותית שלא הייתה חשופה קודם ככפתור בודד.

    : `<div class="placeholder-note" style="padding:10px 0">אין עדיין רשומות ביומן</div>`;
  const fullCount = bizActivityCountCache[id];
  const fullBtnLabel = 'הצגת היומן המלא' + (fullCount ? ` (${fullCount} רשומות)` : '');
  return `
    <div class="activity-card">
      <div class="activity-card-title">📖 יומן פעילות</div>
      <div class="activity-card-sub">כל פעולה על העסק נרשמת כאן אוטומטית — אישור, דחייה, עריכת שדה, סימוני סקשן, מיילים ושליחות ידניות</div>
      <div class="activity-note-row">
        <textarea rows="2" id="bizNoteInput_${id}" class="activity-note-input" placeholder="הוסיפו הערה ליומן..."></textarea>
        <button class="qj-btn primary" onclick="addBizActivityNote('${id}')">הוספה ליומן</button>
      </div>
      <div class="activity-note-hint">גלוי למנהלים בלבד</div>
      <div class="activity-timeline">${rows}</div>
      ${!loading && !full && list.length >= 5 ? `<button class="qj-btn link" onclick="toggleBizActivityFull('${id}')">${fullBtnLabel}</button>` : ''}
      ${!loading && full ? `<button class="qj-btn link" onclick="toggleBizActivityFull('${id}')">הצגת 5 אחרונים בלבד</button>` : ''}
    </div>`;
}

// "רוצה לכתוב לנו משהו?" — הודעה חופשית משלב הסיכום בהרשמה (business.html). בכוונה נפרד לגמרי
// מ"מה מבקשים לשנות" (quickJudgmentHtml) — זו לא בקשת שינוי, בעל העסק יכול לכתוב על כל
// נושא (המשתמש: "הם לא מבקשים לשנות הם יכולים לכתוב בכל נושא"). לא מטופל → תיבה בולטת פתוחה עם
// כפתור "סמן כטופל". מטופל → תיבה מכווצת (<details>, "אפשר לפתוח ולראות") שאפשר עדיין לפתוח.
// הודעה לא-מטופלת עברה ל-quickJudgmentHtml (שיפוט מהיר, שלב 2ב) — כאן נשאר רק המצב "טופלה"
// (תיבה מכווצת, אפשר עדיין לפתוח ולראות/לבטל סימון).
function bizNoteHtml(b) {
  if (!b.note || !b.noteHandled) return '';
  return `
    <details class="note-handled-box">
      <summary>💬 הודעה מהעסק (טופלה) — לחצו לפתיחה</summary>
      <div class="approve-longtext" style="margin-top:6px">"${esc(b.note)}"</div>
      <button class="act-btn tiny" style="margin-top:6px" onclick="toggleBizNoteHandled('${b.id}', false)">↩️ בטל סימון "טופל"</button>
    </details>`;
}
window.toggleBizNoteHandled = async function(id, handled) {
  await saveSectionUpdates(id, { noteHandled: handled, noteHandledAt: handled ? serverTimestamp() : null, noteOwnerAckAt: null });
};

// ── שיפוט מהיר — בראש הכרטיס, בלי לגלול לעריכה המלאה (שלב 2ב, §7 במפרט). מחליף את
// bizPendingChangesSummaryHtml (תקציר לחיצה-בלבד, בלי פעולות) — כל בקשה נשפטת ונכתבת בנפרד,
// בלי "אישור כל הבקשות"/"דחיית הכל" (הוסרו במפורש מ-statusActions למעלה).
let qjCollapsedIds = new Set();
window.toggleQuickJudgment = function(id) {
  if (qjCollapsedIds.has(id)) qjCollapsedIds.delete(id); else qjCollapsedIds.add(id);
  renderMain();
};
// "אישור כתגית"/"מיפוי לקיימת" על tagSuggestion דורשים בחירת קטגוריה (startNewCatPicking/
// startMapTagSuggestion, בורר קיים בשלב 3) — מפעיל את הבורר ומקפיץ לשלב 3 כדי שיהיה גלוי מיד.
window.qjApproveTagFlow = function(id, mode) {
  if (mode === 'new') startNewCatPicking(id); else startMapTagSuggestion(id);
  jumpToBizSection(id, 3);
};
// תצוגה קריאה של שדה-מבנה (מערך/אובייקט) בשורת "שיפוט מהיר" — לא JSON.stringify גולמי.
// photos/videos מקבלים תצוגה ייעודית (תמונות בפועל / קישור+תווית); כל שאר המערכים (סניפים,
// הטבות-נוספות, תגיות, אזורים...) מקבלים סיכום-טקסט קריא. ר' ההערה ב-rowHtml למעלה למה זה קיים.
function qjStructuredPreviewHtml(field, val) {
  const arr = Array.isArray(val) ? val : (val ? [val] : []);
  if (!arr.length) return '<span class="qj-value-text">—</span>';
  if (field === 'photos') {
    return `<div class="qj-photo-thumbs">${arr.map(p => p && p.url ? `<img src="${esc(p.url)}" alt="${esc(p.name||'')}">` : '').join('')}</div>`;
  }
  if (field === 'videos') {
    return `<span class="qj-value-text">${esc(arr.map(v => v.label || v.url).filter(Boolean).join(' · '))}</span>`;
  }
  if (field === 'additionalDiscounts') {
    return `<span class="qj-value-text">${esc(arr.map(d => d && d.text).filter(Boolean).join(' | '))}</span>`;
  }
  if (field === 'branches') {
    return `<span class="qj-value-text">${esc(arr.map(br => `${br.city||''} — ${br.address||''}`).join(' · '))}</span>`;
  }
  // מערך-טקסטים פשוט (תגיות/אזורים/סוגי-עסק) או אובייקט לא-צפוי — סיכום קריא, לא JSON גולמי
  return `<span class="qj-value-text">${esc(arr.map(x => typeof x === 'object' ? Object.values(x).filter(Boolean).join(' ') : x).join(', '))}</span>`;
}
function quickJudgmentHtml(b) {
  const items = bizPendingChangeItems(b);
  const hasNote = bizHasUnhandledNote(b);
  const showApproveApp = b.status === 'pending'; // אישור/דחיית העסק כולו — עבר לכאן מ-statusActions, לפי מבנה המוקאפ
  // §147 — בעבר: return '' כשאין כלום ממתין, כך שהכרטיס כולו (כולל הכותרת "שיפוט מהיר") נעלם לגמרי.
  // ב-handoff הכותרת תמיד מוצגת (גם עם 0 פריטים) — המשתמש: "אין שיפוט מהיר" כשבחר עסק בלי בקשות
  // ממתינות. hasBody (למטה) כבר מטפל נכון במצב-ריק (מסתיר toggle/count/body, משאיר רק כותרת).
  const isOpen = !qjCollapsedIds.has(b.id);
  const rowHtml = (it) => {
    if (b.pendingChangeDiff && it.field in b.pendingChangeDiff) {
      // שדה-מבנה (מערך/אובייקט — תמונות/סרטונים/הטבות-נוספות/סניפים/תגיות וכו') לא יכול לעבור
      // דרך תיבת-טקסט-חופשי לעריכה: ה-value של <input type="text"> הוא תמיד string, אז אישור
      // היה כותב את ה-JSON-כטקסט (או רשימה מופרדת-פסיקים) *כמחרוזת* לתוך שדה שאמור להיות מערך —
      // שובר את כל מקום שקורא את השדה הזה (mediaRealViewHtml/home.html וכו', .map על string=שגיאה).
      // נמצא בפועל: תמונות-שהועלו על ידי עסק לא הופיעו כי הן ישבו ב-pendingChanges בצורה הזו, לא נראות
      // כתמונות בשום מקום. תצוגה קריאה בלבד + אישור עם הערך המקורי (b.pendingChanges[field]), לא מהקלט.
      const pendingVal = b.pendingChanges ? b.pendingChanges[it.field] : undefined;
      const isStructured = Array.isArray(pendingVal) || (pendingVal !== null && typeof pendingVal === 'object');
      if (isStructured) {
        return `
        <div class="qj-row">
          <div class="qj-row-label"><div class="qj-row-step">שלב ${it.section} · שינוי פרטים</div><div class="qj-row-name">${it.label}</div></div>
          <div class="qj-row-value qj-structured">
            <div class="qj-structured-old"><span class="qj-value-hint">היה:</span> ${qjStructuredPreviewHtml(it.field, b[it.field])}</div>
            <div class="qj-structured-new"><span class="qj-value-hint">מבוקש:</span> ${qjStructuredPreviewHtml(it.field, pendingVal)}</div>
          </div>
          <div class="qj-row-actions">
            <button class="qj-btn primary" onclick="approveChangeField('${b.id}','${it.field}')">אישור</button>
            <button class="qj-btn reject" onclick="rejectChangeField('${b.id}','${it.field}')">דחייה</button>
            <button class="qj-btn link" onclick="jumpToBizSection('${b.id}',${it.section})">לשלב ${it.section} ←</button>
          </div>
        </div>`;
      }
      const inputId = `qjInput_${b.id}_${it.field}`;
      return `
        <div class="qj-row">
          <div class="qj-row-label"><div class="qj-row-step">שלב ${it.section} · שינוי פרטים</div><div class="qj-row-name">${it.label}</div></div>
          <div class="qj-row-value">
            <span class="qj-old">${it.old}</span><span class="qj-arrow">→</span>
            <input type="text" id="${inputId}" class="qj-input" value="${esc(String(it.new))}">
          </div>
          <div class="qj-row-actions">
            <button class="qj-btn primary" onclick="approveChangeField('${b.id}','${it.field}', document.getElementById('${inputId}').value)">אישור</button>
            <button class="qj-btn reject" onclick="rejectChangeField('${b.id}','${it.field}')">דחייה</button>
            <button class="qj-btn link" onclick="jumpToBizSection('${b.id}',${it.section})">לשלב ${it.section} ←</button>
          </div>
        </div>`;
    }
    if (it.field === 'tagSecondSuggestion') return `
        <div class="qj-row">
          <div class="qj-row-label"><div class="qj-row-step">שלב 3 · בקשת תגית</div><div class="qj-row-name">${it.label}</div></div>
          <div class="qj-row-value"><span class="qj-value-text">"${esc(b.tagSecondSuggestion)}"</span></div>
          <div class="qj-row-actions">
            <button class="qj-btn primary" onclick="approveTagSecondSuggestion('${b.id}')">אישור</button>
            <button class="qj-btn reject" onclick="rejectTagSecondSuggestion('${b.id}')">דחייה</button>
            <button class="qj-btn link" onclick="jumpToBizSection('${b.id}',3)">לשלב 3 ←</button>
          </div>
        </div>`;
    if (it.field === 'tagSuggestion') return `
        <div class="qj-row">
          <div class="qj-row-label"><div class="qj-row-step">שלב 3 · בקשת תגית</div><div class="qj-row-name">${it.label}</div></div>
          <div class="qj-row-value"><span class="qj-value-text">"${esc(b.tagSuggestion)}"</span></div>
          <div class="qj-row-actions">
            <button class="qj-btn primary" onclick="qjApproveTagFlow('${b.id}','new')">אישור כתגית</button>
            <button class="qj-btn" onclick="qjApproveTagFlow('${b.id}','map')">מיפוי לקיימת</button>
            <button class="qj-btn reject" onclick="rejectTagSuggestion('${b.id}')">דחייה</button>
          </div>
        </div>`;
    if (it.field === 'alsoCategorySuggestion') return `
        <div class="qj-row">
          <div class="qj-row-label"><div class="qj-row-step">שלב 3 · בקשת קטגוריה</div><div class="qj-row-name">${it.label}</div></div>
          <div class="qj-row-value"><span class="qj-value-text">${it.detail}</span></div>
          <div class="qj-row-actions">
            <button class="qj-btn primary" onclick="approveAlsoCatSuggestion('${b.id}')">אישור</button>
            <button class="qj-btn reject" onclick="rejectAlsoCatSuggestion('${b.id}')">דחייה</button>
            <button class="qj-btn link" onclick="jumpToBizSection('${b.id}',3)">לשלב 3 ←</button>
          </div>
        </div>`;
    // alsoCategoryNote — מלל חופשי, אין פונקציית אישור/דחייה ייעודית היום (גם לא ב-diffHtmlForSection הקיים) — תצוגה+קפיצה בלבד
    return `
        <div class="qj-row">
          <div class="qj-row-label"><div class="qj-row-step">שלב 3</div><div class="qj-row-name">${it.label}</div></div>
          <div class="qj-row-value"><span class="qj-value-text">${it.detail}</span></div>
          <div class="qj-row-actions"><button class="qj-btn link" onclick="jumpToBizSection('${b.id}',3)">לשלב 3 ←</button></div>
        </div>`;
  };
  const noteRow = hasNote ? `
    <div class="qj-note-row">
      <div class="qj-note-text"><strong>העסק כתב לנו: </strong>"${esc(b.note)}"</div>
      <div class="qj-row-actions">
        <button class="qj-btn" onclick="toggleBizNoteHandled('${b.id}', true)">סימון כטופל</button>
        ${b.ownerPhone ? `<button class="qj-btn link" onclick="sendBizWA('${b.id}','${b.ownerPhone}','${b.ownerFirst}','${b.name}','${b.accessToken||''}')">מענה בוואטסאפ</button>` : ''}
        ${b.ownerEmail ? `<button class="qj-btn link" onclick="sendBizMail('${b.id}','${b.ownerEmail}','${b.ownerFirst}','${b.name}','${b.accessToken||''}')">מענה במייל</button>` : ''}
      </div>
    </div>` : '';
  const totalCount = items.length + (hasNote ? 1 : 0);
  const hasBody = totalCount > 0;
  // §147 — לפני: count/toggle/hint רק כש-hasBody, כך שכרטיס-ריק היה נראה כמו שורת-טקסט בודדת ולא
  // כמו "פיצ'ר קיים" (המשתמש: "אין שיפוט מהיר"). עכשיו תמיד גלוי — כולל ה-hint שמסביר מה זה, בדיוק
  // כמו ב-handoff ("1 כרטיס עסק.dc.html" qjHint) — גם כשאין מה לשפוט.
  const hint = !hasBody
    ? 'אין בקשות ממתינות כרגע'
    : (isOpen ? 'כל בקשה ניתנת לעריכה כאן לפני אישור, או לקפיצה לשלב שממנו היא באה' : 'סגור — לחצו כדי לפרוס את כל הבקשות');
  return `
    <div class="qj-card">
      <div class="qj-header">
        ${hasBody ? `<button class="qj-toggle" onclick="toggleQuickJudgment('${b.id}')">${isOpen ? '−' : '+'}</button>` : ''}
        <div class="qj-title"${hasBody ? ` onclick="toggleQuickJudgment('${b.id}')"` : ''}>שיפוט מהיר</div>
        <span class="qj-count${hasBody?'':' empty'}">${totalCount}</span>
        ${showApproveApp ? `
        <div class="qj-header-actions">
          <button class="qj-btn-approve-app" title="שולח אוטומטית מייל אישור עם קישור לדשבורד" onclick="approveBiz('${b.id}')">✅ אשר את העסק</button>
          <button class="qj-btn-reject-app" onclick="rejectBiz('${b.id}')">✗ דחה</button>
        </div>` : b.status === 'approved' ? `
        <div class="qj-header-actions">
          <button class="qj-btn-reject-app" onclick="rejectBiz('${b.id}')">↩️ ביטול אישור — לממתין</button>
          <button class="qj-btn-reject-app" onclick="rejectApprovedBiz('${b.id}')">✗ דחייה</button>
        </div>` : b.status === 'rejected' ? `
        <div class="qj-header-actions">
          <button class="qj-btn-approve-app" onclick="restoreBizToPending('${b.id}')">↩️ שחזור לממתין</button>
          <button class="qj-btn-approve-app" title="שולח אוטומטית מייל אישור עם קישור לדשבורד" onclick="approveBiz('${b.id}')">✅ אשר בכל זאת</button>
        </div>` : ''}
        <div class="qj-hint">${hint}</div>
      </div>
      ${(hasBody && isOpen) ? `<div class="qj-body">${items.map(rowHtml).join('')}${noteRow}</div>` : ''}
    </div>`;
}

// ══════════════════════════════════════════════════════════════════
// 🏷️ ניהול תגיות — חלק א׳ (רשימה לפי קטגוריה, ➕✏️🔀🗑️) + חלק ב׳ (תור בקשות ממתינות מרוכז:
// tagSecondSuggestion + tagSuggestion). ר' PROJECT_CONTEXT.md §41/§48.
// ══════════════════════════════════════════════════════════════════

function tagUsageCount(catKey, tag) {
  return MOCK_BUSINESSES.filter(b => b.catKey === catKey && (b.tags || []).includes(tag)).length;
}

// האם לעסק יש הצעת-תגית ממתינה מכל סוג (שנייה או חופשית) — משותף לתור הממוין ול"שינויים לעסקים"
// (המשתמש ביקש שעסק עם הצעת-תגית בלבד, בלי pendingChangeDiff אחר, גם יופיע שם — ר' PROJECT_CONTEXT.md §48/§49)
function bizHasPendingTagSuggestion(b) {
  return (b.tagSecondSuggestion && b.tagSecondSuggestion !== ((b.tags || [])[1] || '')) || !!b.tagSuggestion;
}
// בקשת קטגוריה נוספת ("מופיע גם תחת") — בין אם דרך בחירה בגריד (alsoCategorySuggestion) ובין אם
// רק במלל חופשי (alsoCategoryNote, קיים רק בעריכה מהדשבורד — ר' business-dashboard.html שלב 3)
function bizHasPendingCategoryRequest(b) {
  return (b.alsoCategorySuggestion && b.alsoCategorySuggestion !== b.alsoUnderCategory) || !!b.alsoCategoryNote;
}
// הודעה חופשית מ"רוצה לכתוב לנו משהו?" שעדיין לא סומנה כטופלה — לא בקשת שינוי, ר' ההערה ב-hydrateBiz
function bizHasUnhandledNote(b) {
  return !!b.note && !b.noteHandled;
}
// תוויות תצוגה לכל סוג "טיפול" ממתין — המפתחות ('details'/'tag'/'category'/'note') זהים בכוונה
// ל-CHANGES_TYPE_OPTIONS הקיים, כדי שסינון-לפי-סוג ותצוגה ישתמשו באותם מפתחות בדיוק.
const TREATMENT_LABELS = { details: 'שינוי פרטים', tag: 'בקשת תגית', category: 'בקשת קטגוריה', note: 'כתבו לנו' };

// מקור-אמת יחיד לסיווג הפעולה הנדרשת על עסק/אוהד — כל מסך שצריך "מה המצב פה?" קורא לזה, ולא בונה
// שוב את אותה בדיקה בעצמו. זה מה שסוגר את באג "5 מול 6" (כמה מקומות חישבו את אותו דבר בנפרד ולא
// תמיד הסכימו). kind: 'business' | 'fan' — קובע איזה primary-label מתאים למקרה "ממתין לאישור",
// ומגביל "בקשה מבעל העסק"/"כרטיס חסר באינדקס" (שני אלה שייכים לעסקים בלבד).
// מחזיר { primary: string, treatments: string[] } — treatments הם מפתחות (לא טקסט), ר' TREATMENT_LABELS.
function classifyAction(entity, kind) {
  const treatments = [];
  if (entity.pendingChangeDiff) treatments.push('details');
  if (bizHasPendingTagSuggestion(entity)) treatments.push('tag');
  if (bizHasPendingCategoryRequest(entity)) treatments.push('category');
  if (bizHasUnhandledNote(entity)) treatments.push('note');

  let primary;
  if (entity.status === 'pending') {
    primary = kind === 'fan' ? 'אוהד ממתין לאישור' : 'עסק ממתין לאישור';
  } else if (kind !== 'fan' && treatments.length > 0) {
    primary = 'בקשה מבעל העסק';
  } else if (kind !== 'fan' && entity.status === 'approved' && typeof entity.healthScore === 'number' && entity.healthScore < 100) {
    primary = 'כרטיס חסר באינדקס';
  } else {
    primary = 'מאושר · אין פעולה';
  }
  return { primary, treatments };
}

// שם עסק+תגית משותפים לכתיבה בטוחה בתוך onclick="...('...')" — מונע שבירה כשיש גרשיים בתגית עצמה
function jsq(s) { return String(s).replace(/'/g, "\\'"); }

function tagSecondSuggestionQueue() {
  return MOCK_BUSINESSES.filter(b => b.tagSecondSuggestion && b.tagSecondSuggestion !== ((b.tags || [])[1] || ''));
}
function tagFreeSuggestionQueue() {
  return MOCK_BUSINESSES.filter(b => b.tagSuggestion);
}

// מאתר "משבצת" פנויה לתגית (ראשית קודם, אחרת שנייה) — משותף לאישור-כחדשה ולמיפוי-לקיימת.
// אם שתי המשבצות תפוסות, לא ניתן לשבץ אוטומטית (חוסם עם הסבר) — המנהל צריך להסיר תגית קודם דרך עריכת שלב 3.
// פונקציה טהורה (לא מוטטת את b) — מחזירה מערך-תגיות חדש או null אם אין מקום. הקורא כותב ל-Firestore
// עם המערך המוחזר ורק אחרי הצלחה מעדכן את b.tags בפועל (ר' התיקון ל-3 הפונקציות למטה).
function assignTagToBiz(b, tag) {
  const tags = [...(b.tags || [])];
  if (!tags[0]) { tags[0] = tag; }
  else if (!tags[1]) { tags[1] = tag; }
  else { alert(`ל"${b.name}" כבר יש 2 תגיות. יש להסיר אחת קודם (דרך "✏️ ערוך" בשלב 3 בכרטיס העסק) לפני שאפשר להוסיף תגית נוספת.`); return null; }
  return tags;
}

// "אשר כתגית חדשה" — לא חד-לחיצה: קודם בוחרים תחת איזו קטגוריה התגית שייכת (ברירת מחדל = הקטגוריה
// של העסק עצמו, אבל המנהל יכול לבחור אחרת — למשל תגית שמתאימה יותר לקטגוריה שונה מזו של העסק המציע).
// אם נבחרה קטגוריה אחרת מזו של העסק, התגית מתווספת לפול של הקטגוריה הנבחרת אבל *לא* משויכת לעסק הזה
// (כי תגיות מוגבלות לפול הקטגוריה הראשית של העסק בפועל — לא ניתן לשייך תגית מקטגוריה אחרת).
window.startNewCatPicking = function(id) { tagQueueNewCatPicking = id; tagQueueMapping = null; renderMain(); };
window.cancelNewCatPicking = function() { tagQueueNewCatPicking = null; renderMain(); };
window.confirmApproveTagSuggestionNewCat = async function(id) {
  const b = findBiz(id);
  if (!b || !b.tagSuggestion) return;
  const sel = document.getElementById('tagNewCatSelect_' + id);
  const chosenCat = sel ? sel.value : b.catKey;
  const tag = b.tagSuggestion;
  const sameCategory = chosenCat === b.catKey;
  let newTags = null;
  if (sameCategory) {
    newTags = assignTagToBiz(b, tag);
    if (!newTags) return; // אם שתי המשבצות תפוסות — assignTagToBiz כבר הציג alert ועצר, לא ממשיכים
  }
  try {
    const updates = { tagSuggestion: '' };
    if (sameCategory) updates.tags = newTags;
    await updateDoc(doc(db, 'businesses', id), updates);
  } catch (e) { console.error(e); alert('שגיאה באישור תגית חדשה: ' + e.message); return; }
  if (sameCategory) b.tags = newTags;
  b.tagSuggestion = '';
  b.healthScore = computeHealthScore(b);
  // קטלוג התגיות (settings/tagTaxonomy) — אותו דפוס כמו confirmMergeTag: נכתב אחרי שכתיבת מסמך
  // העסק כבר הצליחה, לא בתוך אותו try (ר' ההערה שם).
  const pool = TAGS_BY_CATEGORY_MOCK[chosenCat] || (TAGS_BY_CATEGORY_MOCK[chosenCat] = []);
  if (!pool.includes(tag)) pool.push(tag);
  await saveTagTaxonomy();
  if (!sameCategory) {
    const chosenLabel = (CATEGORIES.find(c => c.key === chosenCat) || {}).label || chosenCat;
    const ownLabel = (CATEGORIES.find(c => c.key === b.catKey) || {}).label || b.catKey;
    alert(`התגית "${tag}" נוספה לקטגוריית "${chosenLabel}" — לא שויכה ל"${b.name}" כי הקטגוריה שלו ("${ownLabel}") שונה.`);
  }
  tagQueueNewCatPicking = null;
  await logActivity('businesses', id, {
    type: 'tagDecision', title: 'אושרה הצעת תגית חדשה',
    detail: sameCategory ? `"${tag}" נוספה כתגית חדשה ל"${b.name}"` : `"${tag}" נוספה לקטלוג "${chosenCat}" בלי שיוך ל"${b.name}" (קטגוריה שונה)`,
    field: 'tagSuggestion', before: tag, after: sameCategory ? tag : null,
  });
  renderMain();
};
window.rejectTagSuggestion = async function(id) {
  const b = findBiz(id);
  if (!b) return;
  const tag = b.tagSuggestion;
  try {
    await updateDoc(doc(db, 'businesses', id), { tagSuggestion: '' });
    b.tagSuggestion = '';
    await logActivity('businesses', id, {
      type: 'tagDecision', title: 'נדחתה הצעת תגית', detail: `"${tag}" נדחתה עבור "${b.name}"`,
      field: 'tagSuggestion', before: tag, after: null,
    });
    renderMain();
  } catch (e) { console.error(e); alert('שגיאה בדחיית תגית: ' + e.message); }
};
// עריכת טקסט ה-tagSuggestion לפני אישור/מיפוי (למשל תיקון שגיאת הקלדה) — זמינה גם מהכרטיס וגם
// מתור "ניהול תגיות" (tagQueueRowHtml). נכתבת מיד ל-Firestore, בדיוק כמו פעולות האישור/דחייה/מיפוי
// למעלה (כולן כבר כותבות updateDoc בפועל — הפער הישן מ-§67 תוקן, אומת בקריאת-קוד 2026-08-05).
window.startTagSuggestionEdit = function(id) { tagSuggestionEditing = id; renderMain(); };
window.cancelTagSuggestionEdit = function() { tagSuggestionEditing = null; renderMain(); };

};
window.startMapTagSuggestion = function(id) { tagQueueMapping = id; tagQueueNewCatPicking = null; renderMain(); };
window.cancelMapTagSuggestion = function() { tagQueueMapping = null; renderMain(); };
window.confirmMapTagSuggestion = async function(id) {
  const b = findBiz(id);
  if (!b) return;
  const sel = document.getElementById('tagQueueMapSelect_' + id);
  const tag = sel ? sel.value : '';
  if (!tag) return;
  const newTags = assignTagToBiz(b, tag);
  if (!newTags) return;
  const suggested = b.tagSuggestion;
  try {
    await updateDoc(doc(db, 'businesses', id), { tags: newTags, tagSuggestion: '' });
    b.tags = newTags;
    b.tagSuggestion = '';
    b.healthScore = computeHealthScore(b);
    tagQueueMapping = null;
    await logActivity('businesses', id, {
      type: 'tagDecision', title: 'הצעת תגית מופתה לתגית קיימת', detail: `"${suggested}" מופתה ל"${tag}" עבור "${b.name}"`,
      field: 'tags', before: suggested, after: tag,
    });
    renderMain();
  } catch (e) { console.error(e); alert('שגיאה במיפוי תגית: ' + e.message); }
};

// ניווט-החוצה מהתור המרוכז ל"כל העסקים" עם העסק הרלוונטי פתוח — הסינונים מתאפסים כדי שהעסק בטוח יופיע ברשימה
window.jumpToBizFromTagQueue = function(id) {

  selectedBizDetailId = id;
  selectTab(ALL_BIZ_KEY);

// עודכן (2026-08-04, תואם-handoff): מקבל item={b,kind} במקום b בלבד (§148 — עסק יכול להופיע כמה
// פעמים בתור אם יש לו כמה סוגי-בקשות בו-זמנית, לא רק הראשון-שנמצא). נוסף סוג שלישי 'category'.
function tagQueueRowHtml(item) {
  const { b, kind } = item;
  const catMeta = CATEGORIES.find(c => c.key === b.catKey);
  const catChip = catMeta ? `<span class="tag-chip">${catMeta.label}</span>` : '';
  if (kind === 'second') {
    return `
      <div class="tagmgmt-queue-card">
        <div class="tagmgmt-queue-main">
          <div class="tagmgmt-queue-name">${b.name} ${catChip}</div>
          <div class="tagmgmt-queue-desc">💡 ביקש/ה תגית שנייה: "${b.tagSecondSuggestion}"</div>
        </div>
        <div class="tagmgmt-queue-actions">
          <button class="act-btn approve tiny" onclick="approveTagSecondSuggestion('${b.id}')">✅ אשר</button>
          <button class="act-btn reject tiny" onclick="rejectTagSecondSuggestion('${b.id}')">✗ דחה</button>
          <button class="act-btn tiny" onclick="jumpToBizFromTagQueue('${b.id}')">🔗 לעסק</button>
        </div>
      </div>`;
  }
  if (kind === 'category') {
    const wantsCat = (b.alsoCategorySuggestion && b.alsoCategorySuggestion !== b.alsoUnderCategory)
      ? CATEGORIES.find(c => c.key === b.alsoCategorySuggestion) : null;
    return `
      <div class="tagmgmt-queue-card">
        <div class="tagmgmt-queue-main">
          <div class="tagmgmt-queue-name">${b.name} ${catChip}</div>
          ${wantsCat ? `<div class="tagmgmt-queue-desc">🏷️ מבקש/ת להופיע גם תחת: <strong>${wantsCat.label}</strong></div>` : ''}
          ${b.alsoCategoryNote ? `<div class="tagmgmt-queue-desc">📝 הערת העסק: "${esc(b.alsoCategoryNote)}"</div>` : ''}
        </div>
        <div class="tagmgmt-queue-actions">
          ${wantsCat ? `
          <button class="act-btn approve tiny" onclick="approveAlsoCatSuggestion('${b.id}')">✅ אשר</button>
          <button class="act-btn reject tiny" onclick="rejectAlsoCatSuggestion('${b.id}')">✗ דחה</button>` : ''}
          <button class="act-btn tiny" onclick="jumpToBizFromTagQueue('${b.id}')">🔗 לעסק</button>
        </div>
      </div>`;
  }
  const pool = TAGS_BY_CATEGORY_MOCK[b.catKey] || [];
  const isMapping = tagQueueMapping === b.id;
  const isPickingCat = tagQueueNewCatPicking === b.id;
  const catOptions = CATEGORIES.map(c => `<option value="${c.key}" ${b.catKey===c.key?'selected':''}>${c.icon} ${c.label}${b.catKey===c.key?' (הקטגוריה של העסק)':''}</option>`).join('');
  return `
    <div class="tagmgmt-queue-card">
      <div class="tagmgmt-queue-main">
        <div class="tagmgmt-queue-name">${b.name} ${catChip}</div>
        <div class="tagmgmt-inline-form" style="margin-top:4px">
          <span style="font-size:11px;color:var(--text-sm);white-space:nowrap">🆕 תגית חדשה:</span>
          <input type="text" id="tagSuggestionEditInput_${b.id}" value="${esc(b.tagSuggestion)}" maxlength="40" onchange="saveTagSuggestionEdit('${b.id}')" style="flex:1">
        </div>
        ${isMapping ? `
        <div class="tagmgmt-inline-form" style="margin-top:6px">
          <select id="tagQueueMapSelect_${b.id}">
            ${pool.map(t => `<option value="${t.replace(/"/g,'&quot;')}">${t}</option>`).join('')}
          </select>
          <button class="act-btn approve tiny" onclick="confirmMapTagSuggestion('${b.id}')">אישור מיפוי</button>
          <button class="act-btn tiny" onclick="cancelMapTagSuggestion()">ביטול</button>
        </div>` : ''}
        ${isPickingCat ? `
        <div class="tagmgmt-inline-form" style="margin-top:6px">
          <span style="font-size:11px;color:var(--text-sm)">תחת איזו קטגוריה?</span>
          <select id="tagNewCatSelect_${b.id}">${catOptions}</select>
          <button class="act-btn approve tiny" onclick="confirmApproveTagSuggestionNewCat('${b.id}')">✅ הוסף ואשר</button>
          <button class="act-btn tiny" onclick="cancelNewCatPicking()">ביטול</button>
        </div>` : ''}
      </div>
      ${!isMapping && !isPickingCat && !isEditingText ? `
      <div class="tagmgmt-queue-actions">
        <button class="act-btn approve tiny" onclick="startNewCatPicking('${b.id}')">✅ אשר כתגית חדשה</button>
        <button class="act-btn tiny" onclick="startMapTagSuggestion('${b.id}')">🔀 מפה לקיימת</button>
        <button class="act-btn reject tiny" onclick="rejectTagSuggestion('${b.id}')">✗ דחה</button>
        <button class="act-btn tiny" onclick="jumpToBizFromTagQueue('${b.id}')">🔗 לעסק</button>
      </div>` : ''}
    </div>`;
}

// ── חלק א׳ — רשימת תגיות לפי קטגוריה: הוספה/עריכת שם/מיזוג/מחיקה ──
window.startAddTag = function(catKey) { tagsMgmtAdding[catKey] = true; renderMain(); };
window.cancelAddTag = function(catKey) { tagsMgmtAdding[catKey] = false; renderMain(); };
window.confirmAddTag = async function(catKey) {
  const input = document.getElementById('tagAddInput_' + catKey);
  const val = input ? input.value.trim() : '';
  if (!val) return;
  const pool = TAGS_BY_CATEGORY_MOCK[catKey] || (TAGS_BY_CATEGORY_MOCK[catKey] = []);
  if (pool.includes(val)) { alert('תגית בשם הזה כבר קיימת בקטגוריה זו.'); return; }
  pool.push(val);
  await saveTagTaxonomy();
  tagsMgmtAdding[catKey] = false;
  renderMain();
};

window.startTagEdit = function(catKey, tag) { tagsMgmtEditing = { catKey, tag }; tagsMgmtMerging = null; renderMain(); };
window.cancelTagEdit = function() { tagsMgmtEditing = null; renderMain(); };
window.confirmRenameTag = async function(catKey, oldTag) {
  const input = document.getElementById('tagEditInput_' + catKey);
  const newTag = input ? input.value.trim() : '';
  if (!newTag || newTag === oldTag) { tagsMgmtEditing = null; renderMain(); return; }
  const pool = TAGS_BY_CATEGORY_MOCK[catKey] || [];
  if (pool.includes(newTag)) { alert('כבר יש תגית בשם הזה בקטגוריה — כדי לאחד ביניהן יש להשתמש בפעולת מיזוג (🔀) במקום שינוי שם.'); return; }
  const affected = MOCK_BUSINESSES.filter(b => b.catKey === catKey && ((b.tags || []).includes(oldTag) || b.tagSecondSuggestion === oldTag));
  const count = affected.length;
  if (count > 0 && !confirm(`${count} עסק${count===1?' משתמש':'ים משתמשים'} בתגית "${oldTag}". לשנות את השם ל"${newTag}" גם אצלם (כתיבה אמיתית ל-Firestore)?`)) return;
  const idx = pool.indexOf(oldTag);
  if (idx > -1) pool[idx] = newTag;
  try {
    if (affected.length) {
      const batch = writeBatch(db);
      affected.forEach(b => {
        const patch = { tags: (b.tags || []).map(t => t === oldTag ? newTag : t) };
        if (b.tagSecondSuggestion === oldTag) patch.tagSecondSuggestion = newTag;
        batch.update(doc(db, 'businesses', b.id), patch);
      });
      await batch.commit();
    }
    await saveTagTaxonomy();
  } catch (e) { console.error(e); alert('שגיאה בשינוי השם: ' + e.message); return; }
  affected.forEach(b => {
    b.tags = (b.tags || []).map(t => t === oldTag ? newTag : t);
    if (b.tagSecondSuggestion === oldTag) b.tagSecondSuggestion = newTag;
  });
  tagsMgmtEditing = null;
  renderMain();
};

window.deleteTag = async function(catKey, tag) {
  const count = tagUsageCount(catKey, tag);
  if (count > 0) { alert(`אי אפשר למחוק את "${tag}" — ${count} עסק${count===1?' עדיין משתמש':'ים עדיין משתמשים'} בה. אפשר למזג אותה לתוך תגית אחרת (🔀) כדי להעביר ${count===1?'אותו':'אותם'} קודם.`); return; }
  if (!confirm(`למחוק את התגית "${tag}"?`)) return;
  const pool = TAGS_BY_CATEGORY_MOCK[catKey] || [];
  const idx = pool.indexOf(tag);
  if (idx > -1) pool.splice(idx, 1);
  await saveTagTaxonomy();
  renderMain();
};

window.startTagMerge = function(catKey, tag) {
  if ((TAGS_BY_CATEGORY_MOCK[catKey] || []).filter(t => t !== tag).length === 0) { alert('אין תגית נוספת באותה קטגוריה למזג אליה.'); return; }
  tagsMgmtMerging = { catKey, tag }; tagsMgmtEditing = null; renderMain();
};
window.cancelTagMerge = function() { tagsMgmtMerging = null; renderMain(); };
// מיזוג תגיות — משנה בפועל את tags על כל העסקים שמשתמשים בתגית המקור (batch אחד אטומי), וגם את
// קטלוג התגיות עצמו (settings/tagTaxonomy) — כל שינויי ניהול-התגיות (מיזוג/שינוי-שם/מחיקה) נשמרים
// בפועל כאן. business.html/admin-businesses.html עדיין לא קוראים מהקטלוג הזה (ר' הערה למעלה).
window.confirmMergeTag = async function(catKey, oldTag) {
  const sel = document.getElementById('tagMergeTarget_' + catKey);
  const newTag = sel ? sel.value : '';
  if (!newTag) return;
  const affected = MOCK_BUSINESSES.filter(b => b.catKey === catKey && (b.tags || []).includes(oldTag));
  const count = affected.length;
  if (!confirm(`למזג "${oldTag}" לתוך "${newTag}"? ${count} עסק${count===1?' יעבור':'ים יעברו'} לתגית "${newTag}" — כתיבה אמיתית ל-Firestore, לא ניתנת לביטול אוטומטי.`)) return;
  try {
    const batch = writeBatch(db);
    affected.forEach(b => {
      const newTags = [...new Set(b.tags.map(t => t === oldTag ? newTag : t))]; // Set מונע כפילות אם העסק כבר החזיק גם את שתי התגיות שהתמזגו
      const patch = { tags: newTags };
      if (b.tagSecondSuggestion === oldTag) patch.tagSecondSuggestion = newTag;
      batch.update(doc(db, 'businesses', b.id), patch);
    });
    await batch.commit();
  } catch (e) { console.error(e); alert('שגיאה במיזוג: ' + e.message); return; }
  const pool = TAGS_BY_CATEGORY_MOCK[catKey] || [];
  const idx = pool.indexOf(oldTag);
  if (idx > -1) pool.splice(idx, 1);
  await saveTagTaxonomy();
  tagsMgmtMerging = null;
  alert(`✅ מוזג — ${count} עסק${count===1?' עבר':'ים עברו'} בפועל ל-"${newTag}"`);
  renderMain();
};

function tagRowHtml(catKey, tag) {
  const count = tagUsageCount(catKey, tag);
  const isEditing = tagsMgmtEditing && tagsMgmtEditing.catKey === catKey && tagsMgmtEditing.tag === tag;
  const isMerging = tagsMgmtMerging && tagsMgmtMerging.catKey === catKey && tagsMgmtMerging.tag === tag;

  if (isMerging) {

        <div class="tagmgmt-inline-form">

  const countHtml = count > 0
    ? `<button class="tagmgmt-tag-count" onclick="toggleTagUsageList('${catKey}','${jsq(tag)}')" title="לחצו לראות אילו עסקים בדיוק">${countLabel} ${usageOpen ? '▴' : '▾'}</button>`
    : `<span class="tagmgmt-tag-count zero">${countLabel}</span>`;
  // כפתורים כטקסט-נקי במקום אייקוני-אימוג'י, וספירת-השימוש ליד שם-התגית (2026-08-04, בקשת המשתמש
  // + תואם-handoff שכבר תיעד את זה כפער ב-§148: "כפתורים-עם-אימוג'ים... במקום טקסט-נקי-נייבי").
  return `
    <div class="tagmgmt-tag-row">
      <span class="tagmgmt-tag-name">${tag}</span>
      ${countHtml}
      <div style="flex:1"></div>
      <div class="tagmgmt-tag-actions">

// ══════════════════ עסק השבוע · הטבת השבוע ══════════════════
// לפי המפרט המלא של המשתמש ("עסק השבוע והטבת השבוע — שתי שאלות.md"). **סבב שלישי (2026-08-04):**
// המשתמש ביקש שהמסך כולו יתייחס ל-2 המסלולים כ-2 יוזמות נפרדות שמנוהלות בנפרד לגמרי, כולל
// טאב-מתג עליון. **סבב רביעי (2026-08-05, אחרי בדיקה חיה של הגרסה-המופרדת):** המשתמש ראה את זה
// בפועל וביקש הפוך — לאחד את 2 המסלולים לאותו מסך אחד (בלי טאב-מתג, שני live-cards זה-לצד-זה,
// רשימת "מי הביע עניין" ממוזגת עם צ'יפ-לכל-מסלול) — מחליף את ההחלטה מהסבב השלישי. weekly_schedule
// עדיין **מסמך אחד = שיבוץ אחד למסלול אחד בשבוע אחד** (`track: 'business'|'benefit'`) — זה לא
// השתנה, רק התצוגה: לוח-השבועות/היסטוריה נשארים 2 רשימות נפרדות-אך-גלויות-יחד-על-אותו-מסך (לא
// טאב-מתג, לא מיזוג-שורה-לשורה שהיה דורש איחוד-לוגיקת-עריכה מסוכן). "מי הביע עניין" כן מוזג
// לרשימה אחת — weekly_interest ממילא מסמך-אחד-לעסק (contactStatus משותף לשני המסלולים במכוון,
// זו אותה שיחת-טלפון), כך שמיזוג-תצוגה כאן זול ובטוח, לא רק אפשרי.

function weekStartOf(d) {
  const dt = new Date(d);
  dt.setHours(0, 0, 0, 0);
  dt.setDate(dt.getDate() - dt.getDay());
  return dt;
}
function weekStartStr(d) { return weekStartOf(d).toISOString().slice(0, 10); }
function weekEndDate(weekStr) { const end = new Date(weekStr + 'T00:00:00'); end.setDate(end.getDate() + 7); return end; }
function fmtWeekRange(weekStr) {
  if (!weekStr) return '—';
  const start = new Date(weekStr + 'T00:00:00');
  const end = new Date(start); end.setDate(end.getDate() + 6);
  return `${fmtDate(start)}–${fmtDate(end)}`;
}
function isCurrentWeek(weekStr) { return !!weekStr && new Date() >= new Date(weekStr + 'T00:00:00') && new Date() < weekEndDate(weekStr); }
function isFutureWeek(weekStr) { return !!weekStr && new Date(weekStr + 'T00:00:00') > new Date(); }
function isPastWeek(weekStr) { return !!weekStr && weekEndDate(weekStr) <= new Date(); }
function daysLeftInWeek(weekStr) { return Math.max(0, Math.ceil((weekEndDate(weekStr) - new Date()) / DAY_MS)); }

function weeklyScheduleForTrack(track) { return WEEKLY_SCHEDULE.filter(s => s.track === track); }
function scheduleRowsFor(bizId, track) { return WEEKLY_SCHEDULE.filter(s => s.businessId === bizId && s.track === track); }
function weeklyDerivedStatus(w, track) {
  const rows = scheduleRowsFor(w.businessId, track);
  if (rows.some(s => isCurrentWeek(s.weekStart) || isFutureWeek(s.weekStart))) return 'scheduled';
  if (rows.some(s => isPastWeek(s.weekStart))) return 'done';
  return w.contactStatus; // pending | contacted | declined
}
const WEEKLY_STATUS_LABELS = { pending: 'ממתין לשיחה', contacted: 'דיברנו, מוכן', declined: 'הוסר מהרשימה', scheduled: 'נקבע תור', done: 'היה כבר' };
const WEEKLY_TRACK_LABELS = { business: '🏆 עסק השבוע', benefit: '🎁 הטבת השבוע' };

// ── חלק 1: על האוויר עכשיו ──────────────────────────────────────────────
function weeklyLiveCardHtml(track) {

  const b = live ? bizById(live.businessId) : null;
  if (!live || !b) return `<div class="wk-live-card empty"><div class="wk-live-label">${label}</div><div class="placeholder-note" style="padding:10px 0">אין כרגע עסק משובץ</div></div>`;
  const img = live.image ? `<img src="${live.image}" class="wk-live-img" alt="">` : '';
  return `

// בורר "מי" — שדה-חיפוש חופשי (datalist, לא <select> גלילה) לפי בקשת המשתמש (2026-08-04): רשימת
// כל העסקים המאושרים יכולה להיות ארוכה, וגלילה ב-<select> לא נוחה. מועמדים "אמיתיים" (מי שסימן
// את השאלה הרלוונטית ודיברנו איתו — contactStatus==='contacted') מוצגים בלי תווית; כל עסק מאושר
// אחר מוצג עם "(לא ביקש/ה)" — כדי לשמר את ההבחנה "הצענו להם" (סעיף 3 במפרט) גם בלי optgroup
// (datalist לא תומך בקיבוץ ויזואלי). המיפוי טקסט-מוצג→ID נשמר ב-weeklyBizNameMaps, לא כתוב כ-HTML
// inline (script בתוך innerHTML לא רץ) — syncWeeklyBizPick קורא ממנו כשהמשתמש מקליד/בוחר.
let weeklyBizNameMaps = {}; // { [scheduleId]: { [תווית-מוצגת]: businessId } }

function weeklyBizPickerHtml(scheduleId, track, alreadyPickedId) {
  const flagKey = track === 'business' ? 'wantsBusinessOfWeek' : 'wantsBenefitOfWeek';
  const requested = WEEKLY_INTEREST.filter(w => w[flagKey] && w.contactStatus === 'contacted' && bizById(w.businessId)).map(w => bizById(w.businessId));
  const requestedIds = new Set(requested.map(b => b.id));
  const already = alreadyPickedId ? bizById(alreadyPickedId) : null;
  const manualPool = MOCK_BUSINESSES.filter(b => b.status === 'approved' && !requestedIds.has(b.id) && b.id !== alreadyPickedId);

  const map = {};
  const labels = [];
  const addOpt = (b, suffix) => {
    if (!b || map[b.name + suffix]) return;
    const label = suffix ? `${b.name} ${suffix}` : b.name;
    map[label] = b.id;
    labels.push(label);
  };
  requested.forEach(b => addOpt(b, ''));
  if (already && !requestedIds.has(already.id)) addOpt(already, '(הוצע ידנית)');
  manualPool.forEach(b => addOpt(b, '(לא ביקש/ה)'));

  weeklyBizNameMaps[scheduleId] = map;
  const currentLabel = already ? (labels.find(l => map[l] === already.id) || already.name) : '';
  const dlId = 'wkBizDL_' + scheduleId;
  return `
    <input type="text" id="wkSchedBizSearch_${scheduleId}" list="${dlId}" value="${esc(currentLabel)}"
      placeholder="הקלידו לחיפוש שם עסק, או השאירו ריק לביטול בחירה" oninput="syncWeeklyBizPick('${scheduleId}')" autocomplete="off">
    <datalist id="${dlId}">${labels.map(l => `<option value="${esc(l)}">`).join('')}</datalist>
    <input type="hidden" id="wkSchedBiz_${scheduleId}" value="${already ? already.id : ''}">`;
}
window.syncWeeklyBizPick = function(scheduleId) {
  const input = document.getElementById('wkSchedBizSearch_' + scheduleId);
  const hidden = document.getElementById('wkSchedBiz_' + scheduleId);
  const map = weeklyBizNameMaps[scheduleId] || {};
  hidden.value = map[input.value] || '';
};

window.saveWeeklySchedule = async function(id) {
  const s = WEEKLY_SCHEDULE.find(x => x.id === id);
  if (!s) return;
  const updates = {
    businessId:       document.getElementById('wkSchedBiz_' + id).value || null,
    noticePreference: document.getElementById('wkSchedNotice_' + id).value || null,
    status:           document.getElementById('wkSchedStatus_' + id).value,
    rawNotes:         document.getElementById('wkRawNotes_' + id).value.trim(),
    title:            document.getElementById('wkTitle_' + id).value.trim(),
    bodyText:         document.getElementById('wkBodyText_' + id).value.trim(),
    historyNote:      document.getElementById('wkHistoryNote_' + id).value.trim(),
  };
  if (updates.status === 'confirmed' && s.status !== 'confirmed') {
    updates.approvedBy = CURRENT_ADMIN.name;
    updates.approvedAt = serverTimestamp();
  }
  try {
    const imageFile = document.getElementById('wkImage_' + id)?.files[0];
    if (imageFile) {
      const compressed = await compressToFile(imageFile, 1280, 0.82, imageFile.name);
      updates.image = await uploadFile(compressed, `weeklySchedule/${id}/img_${Date.now()}`);
    }
    await updateDoc(doc(db, 'weekly_schedule', id), updates);
    weeklyEditingId = null;
    await logActivity('weekly_schedule', id, { type: 'weeklyScheduleSave', title: 'עדכון שיבוץ ותוכן שבוע', detail: `${WEEKLY_TRACK_LABELS[s.track]} · ${fmtWeekRange(s.weekStart)}`, field: 'status', before: s.status, after: updates.status });
  } catch (e) { console.error(e); alert('שגיאה בשמירה: ' + e.message); }
};

// ── חלק 3: מי הביע עניין ────────────────────────────────────────────────
const DEFAULT_WEEKLY_FOLLOWUP_SUBJECT = 'נחזור אליכם בקרוב — עסק השבוע / הטבת השבוע 💛';
const DEFAULT_WEEKLY_FOLLOWUP_MAIL = 'שלום {name},\n\nתודה שסימנתם עניין ב"{business}" עבור עסק השבוע / הטבת השבוע ב-Yellow Zone!\n\nנחזור אליכם בקרוב לתאם שיחה קצרה ולסגור פרטים ותאריך.\n\nבאהבה,\nצוות Yellow Zone 💛';

window.markWeeklyContacted = async function(id) {
  const w = WEEKLY_INTEREST.find(x => x.id === id);
  if (!w) return;
  try {
    await updateDoc(doc(db, 'weekly_interest', id), { contactStatus: 'contacted' });
    await logActivity('weekly_interest', id, { type: 'weeklyContact', title: 'סומן "דיברנו איתם"', field: 'contactStatus', before: w.contactStatus, after: 'contacted' });
  } catch (e) { console.error(e); alert('שגיאה: ' + e.message); }
};
window.declineWeeklyInterest = async function(id) {
  const w = WEEKLY_INTEREST.find(x => x.id === id);
  if (!w) return;
  try {
    await updateDoc(doc(db, 'weekly_interest', id), { contactStatus: 'declined' });
    await logActivity('weekly_interest', id, { type: 'weeklyDecline', title: 'הוסר מהרשימה', field: 'contactStatus', before: w.contactStatus, after: 'declined' });
  } catch (e) { console.error(e); alert('שגיאה: ' + e.message); }
};
window.bulkMarkWeeklyContacted = async function() {
  for (const id of [...selectedWeeklyIds]) await markWeeklyContacted(id);
  selectedWeeklyIds.clear(); renderMain();
};
window.bulkDeclineWeekly = async function() {
  for (const id of [...selectedWeeklyIds]) await declineWeeklyInterest(id);
  selectedWeeklyIds.clear(); renderMain();
};
window.bulkWeeklyFollowupMail = function() {
  [...selectedWeeklyIds].forEach(id => {
    const w = WEEKLY_INTEREST.find(x => x.id === id);
    const b = w && bizById(w.businessId);
    if (!b || !b.ownerEmail) return;
    const subject = encodeURIComponent(DEFAULT_WEEKLY_FOLLOWUP_SUBJECT);
    const body = encodeURIComponent(DEFAULT_WEEKLY_FOLLOWUP_MAIL.replace(/\{name\}/g, b.ownerFirst || '').replace(/\{business\}/g, b.name));
    window.open(`mailto:${b.ownerEmail}?subject=${subject}&body=${body}`, '_blank');
    logActivity('weekly_interest', id, { type: 'email', title: 'נשלח מייל מעקב "נחזור אליכם"', detail: `אל ${b.ownerEmail}`, field: 'channel', before: null, after: 'email' });
  });
};

// והיסטוריה נשארים 2 רשימות נפרדות אך גלויות-יחד-זו-לצד-זו (לא טאב-מתג, לא מיזוג-שורה-לשורה
// שהיה דורש איחוד-לוגיקת-עריכה מסוכן — כל שיבוץ עדיין מסמך נפרד ל-track אחד).

function weeklyInterestRowMergedHtml(w) {

  const statusLines = tracks.map(t => `<div>${WEEKLY_TRACK_LABELS[t]}: ${WEEKLY_STATUS_LABELS[weeklyDerivedStatus(w, t)] || ''}</div>`).join('');
  const waBtn = b.ownerPhone ? `<button class="act-btn tiny" onclick="sendBizWA('${b.id}','${b.ownerPhone}','${b.ownerFirst||''}','${b.name}','${b.accessToken||''}')">וואטסאפ</button>` : '';
  const mailBtn = b.ownerEmail ? `<button class="act-btn tiny" onclick="sendBizMail('${b.id}','${b.ownerEmail}','${b.ownerFirst||''}','${b.name}','${b.accessToken||''}')">מייל</button>` : '';

function weeklyInterestListMergedHtml() {

    declined: all.filter(w => w.contactStatus === 'declined').length,

  const filtered = all
    .filter(w => {
      if (weeklyStatusFilter === 'all') return true;
      if (weeklyStatusFilter === 'business') return w.wantsBusinessOfWeek;
      if (weeklyStatusFilter === 'benefit') return w.wantsBenefitOfWeek;
      return w.contactStatus === weeklyStatusFilter;

    .sort((a, b) => weeklySort === 'oldest' ? a.requestedAt - b.requestedAt : b.requestedAt - a.requestedAt);
  const chip = (key, label) => `<button class="biz-class-pill ${weeklyStatusFilter===key?'active':''}" onclick="setWeeklyStatusFilter('${key}')">${label} · ${counts[key]}</button>`;
  return `

      <select class="filter-select" onchange="setWeeklySort(this.value)">
        <option value="newest" ${weeklySort==='newest'?'selected':''}>מיון: חדש ביותר</option>

// כותרת-עמוד דינמית + KPI אמיתיים, ממוזגת על 2 המסלולים ביחד.
function weeklyHeaderHtml() {
  const allInterest = WEEKLY_INTEREST.filter(w => (w.wantsBusinessOfWeek || w.wantsBenefitOfWeek) && bizById(w.businessId));
  const pendingCount = allInterest.filter(w => w.contactStatus === 'pending').length;
  const upcoming = [...weeklyScheduleForTrack('business'), ...weeklyScheduleForTrack('benefit')].filter(s => !isPastWeek(s.weekStart));
  const filledUpcoming = upcoming.filter(s => s.businessId).length;
  let title;
  if (pendingCount > 0) title = pendingCount === 1 ? `עסק אחד מחכה לשיחה השבוע` : `${pendingCount} עסקים מחכים לשיחה השבוע`;
  else if (upcoming.length && filledUpcoming < upcoming.length) {
    const empty = upcoming.length - filledUpcoming;
    title = `אין ממתינים לשיחה כרגע — אבל ${empty === 1 ? 'שבוע אחד עדיין ריק' : empty + ' שבועות עדיין ריקים'}`;
  }
  else title = `הכל מטופל — אין ממתינים ואין שבועות ריקים`;
  return `
    <div class="msg-content-head">
      <div style="flex:1;min-width:230px">
        <div class="msg-crumb"><a onclick="selectTab('${HOME_KEY}')">← מרכז המשימות</a><span>/</span><span>עסק השבוע · הטבת השבוע</span></div>
        <div class="msg-page-title">${title}</div>
      </div>
      <div class="msg-kpis">
        <div><div class="msg-kpi-num">${allInterest.length}</div><div class="msg-kpi-label">ברשימת ההמתנה</div></div>
        <div class="msg-kpi-sep"></div>
        <div><div class="msg-kpi-num">${pendingCount}</div><div class="msg-kpi-label">ממתינים לשיחה</div></div>
        <div class="msg-kpi-sep"></div>
        <div><div class="msg-kpi-num">${filledUpcoming}<span style="font-size:13px;font-weight:500;color:var(--text-sm)">/${upcoming.length}</span></div><div class="msg-kpi-label">שבועות מאוכלסים</div></div>
      </div>
    </div>`;
}

function weeklyScheduleBlockHtml(track, past) {
  const list = weeklyScheduleForTrack(track)
    .filter(s => past ? isPastWeek(s.weekStart) : !isPastWeek(s.weekStart))
    .sort((a, b) => past ? b.weekStart.localeCompare(a.weekStart) : a.weekStart.localeCompare(b.weekStart));
  const emptyMsg = past ? 'אין עדיין היסטוריה — שבועות עוברים לכאן אוטומטית אחרי שהשבוע מסתיים' : `אין עדיין שבועות בלוח ל${WEEKLY_TRACK_LABELS[track]}`;
  return `<div class="wk-sched-list">${list.map(s => weeklyScheduleRowHtml(s)).join('') || `<div class="placeholder-note">${emptyMsg}</div>`}</div>`;
}

// פאנל "דורש פעולה" (כהה-נייבי, אותו סגנון expiring-panel כמו §141) — ממוזג על 2 המסלולים.
function weeklyActionPanelHtml() {
  const pending = WEEKLY_INTEREST.filter(w => (w.wantsBusinessOfWeek || w.wantsBenefitOfWeek) && w.contactStatus === 'pending' && bizById(w.businessId))
    .sort((a, b) => a.requestedAt - b.requestedAt).slice(0, 3);
  const emptyWeeks = [...weeklyScheduleForTrack('business'), ...weeklyScheduleForTrack('benefit')]
    .filter(s => !isPastWeek(s.weekStart) && !s.businessId)
    .sort((a, b) => a.weekStart.localeCompare(b.weekStart)).slice(0, 2);

  const items = [
    ...pending.map(w => {
      const b = bizById(w.businessId);
      const marks = [w.wantsBusinessOfWeek ? WEEKLY_TRACK_LABELS.business : null, w.wantsBenefitOfWeek ? WEEKLY_TRACK_LABELS.benefit : null].filter(Boolean).join(' + ');
      return { title: b.name, sub: `ביקש/ה ${marks} · ${agoLabel(w.requestedAt)} · טרם דובר`, onclick: `jumpToBizFromTagQueue('${b.id}')` };
    }),
    ...emptyWeeks.map(s => ({ title: `${fmtWeekRange(s.weekStart)} · ${WEEKLY_TRACK_LABELS[s.track]}`, sub: `אין עסק משובץ לשבוע הזה`, onclick: `startWeeklyEdit('${s.id}')` })),
  ];

  if (!items.length) {
    return `
      <div class="expiring-panel wk-action-panel">
        <div class="expiring-title">✓ דורש פעולה</div>
        <div class="expiring-empty">אין כרגע פריטים שדורשים פעולה.</div>
      </div>`;
  }
  return `
    <div class="expiring-panel wk-action-panel">
      <div class="expiring-title">⚠️ דורש פעולה</div>
      <div class="expiring-subgroup">
        <div class="exp-sub-list">
          ${items.map((it, i) => `
          <div class="expiring-item" onclick="${it.onclick}">
            <div class="exp-pos">${i+1}</div>
            <div class="exp-body">${esc(it.title)}<div style="font-weight:400;color:rgba(255,255,255,.75);font-size:11px;margin-top:2px">${esc(it.sub)}</div></div>
          </div>`).join('')}
        </div>
      </div>
    </div>`;
}

## 2. הגבלת אחריות והסרת אחריות מוחלטת
"Yellow Zone", מפעילת האתר, מנהליו, וכן בעלי העסקים ונותני השירות המפרסמים בו, אינם נושאים ולא יישאו בכל אחריות מכל סוג שהוא לגבי הרכישות או הגלישה.
טיב השירות והמוצרים: אין לאתר כל אחריות על איכות, טיב, חוקיות, בטיחות, או אספקה של המוצרים או השירותים המוצעים על ידי העסקים המופיעים באינדקס.
נזקים ישירים או עקיפים: האתר ובעליו לא יהיו אחראים לכל נזק, הפסד, עוגמת נפש או פגיעה שייגרמו למשתמש כתוצאה מהסתמכות על המידע באתר.
סכסוכים בין משתמשים לעסקים: בכל מקרה של מחלוקת, המשתמש פוטר באופן מוחלט את האתר מכל אחריות.

## 3. מדיניות רישום, סינון ואישור עסקים
אישור ידני ומותנה: הגשת בקשה לרישום עסק באתר אינה מהווה אישור אוטומטי לפרסומו.
זכות סינון מוחלטת: הנהלת האתר שומרת לעצמה את הזכות המלאה לקבוע מי רשאי להופיע באינדקס, בכל עת ומכל סיבה שהיא.
עדכון והסרת תכנים: מנהלי האתר רשאים להסיר פרסום של עסק קיים באופן מיידי במידה ויעלה חשש כי המידע אינו מדויק.

## 4. נכונות המידע ואמינות הפרסומים
המידע על העסקים נמסר לאתר על ידי בעלי העסקים עצמם. האתר אינו בודק את אמיתות המידע, רישיונות העסק, או יושרתם. האחריות הבלעדית לבדיקת העסק חלה על המשתמש בלבד.

## 5. התנהגות משתמשים וקהילתיות
האתר הוקם מתוך רוח קהילתית ועזרה הדדית בין אוהדים. המשתמש מתחייב שלא לעשות שימוש באתר למטרות לא חוקיות, פגיעה בפרטיות, הטעיה, או פרסום תכנים פוגעניים.

## 6. קניין רוחני

let tplFirestoreData = {};
let tplSiteTextsData = {};
let openTemplateId = null;
window.toggleTemplateItem = function(id) {
  openTemplateId = (openTemplateId === id) ? null : id;
  renderMain();
};

function tplGetLocal(key, fallback) { return localStorage.getItem('_hb_tpl_' + key) || fallback; }
function tplSetLocal(key, val) { localStorage.setItem('_hb_tpl_' + key, val); }
function findMessageTemplate(id) { return MESSAGE_TEMPLATE_ITEMS.find(i => i.id === id); }
function tplFieldValue(item, f) {
  return item.storage === 'firestore' ? (tplFirestoreData[f.key] ?? item.defaults[f.key])
    : item.storage === 'firestoreSite' ? (tplSiteTextsData[f.key] ?? item.defaults[f.key])
    : tplGetLocal(f.key, item.defaults[f.key]);
}

window.saveTemplateItem = async function(id) {
  const item = findMessageTemplate(id);
  const values = {};
  item.fields.forEach(f => values[f.key] = document.getElementById('tplField_' + f.key).value);
  if (item.storage === 'firestore' || item.storage === 'firestoreSite') {
    const targetDoc = item.storage === 'firestore' ? TPL_SETTINGS_DOC() : TPL_SITE_TEXTS_DOC();
    const cache = item.storage === 'firestore' ? tplFirestoreData : tplSiteTextsData;
    try {
      await setDoc(targetDoc, values, { merge: true });
      Object.assign(cache, values);
      alert('✅ נשמר');
    } catch (e) { console.error(e); alert('שגיאה בשמירה: ' + e.message); }
  } else {
    Object.entries(values).forEach(([k, v]) => tplSetLocal(k, v));
    alert('✅ נשמר');
  }
  renderMain();
};

window.resetTemplateItem = function(id) {
  const item = findMessageTemplate(id);
  item.fields.forEach(f => { const el = document.getElementById('tplField_' + f.key); if (el) el.value = item.defaults[f.key]; });
};

function templateFieldHtml(item, f) {
  const val = esc(tplFieldValue(item, f));
  const preview = item.group === 'auto' ? ` oninput="updateTemplatePreview('${item.id}')"` : '';
  return f.type === 'textarea'
    ? `<div class="approve-field-label" style="margin-top:10px">${f.label}</div><textarea class="broadcast-body-input" id="tplField_${f.key}" rows="${f.rows||8}"${preview}>${val}</textarea>`
    : `<div class="approve-field-label" style="margin-top:10px">${f.label}</div><input class="chain-select" type="text" id="tplField_${f.key}" value="${val}"${preview}>`;
}

// (תיבת-קוד/כפתור/לוגו) שהוורקר בונה בפועל ב-worker/src/brevo.js (richBodyHtml/codeBoxHtml/
// linkButtonHtml/brandHeaderHtml). קוד מוכפל בכוונה (אין שיתוף-קוד בין Worker ל-admin) — כל שינוי

const TPL_LOGO_URL = 'https://yellowzone.co.il/images/yellowzone-mark-square.png';
const TPL_LOGO_HORIZONTAL_URL = 'https://yellowzone.co.il/images/yellowzone-logo-horizontal.png';
function tplCodeBoxHtml(code) {
  return `<table role="presentation" align="center" cellpadding="0" cellspacing="0" style="margin:20px auto"><tr><td style="width:260px;background:#FFDE00;border-radius:20px;padding:22px 20px;text-align:center"><div style="font-size:32px;font-weight:900;letter-spacing:4px;color:#0A2A66;line-height:1">${esc(code)}</div><div style="margin-top:10px"><a href="https://yellowzone.co.il" style="font-size:14px;font-weight:700;color:#0A2A66;text-decoration:underline">yellowzone.co.il</a></div></td></tr></table>`;
}
function tplLinkButtonHtml(link, label) {
  return `<table role="presentation" align="center" cellpadding="0" cellspacing="0" style="margin:16px auto"><tr><td style="background:#FFDE00;border-radius:14px"><a href="${esc(link)}" style="display:inline-block;color:#16130a;font-weight:900;text-decoration:none;padding:12px 28px;font-size:15px">${esc(label)}</a></td></tr></table>`;
}
function tplBrandHeaderHtml() {
  return `<div style="text-align:left;margin:0 0 18px 0"><img src="${TPL_LOGO_HORIZONTAL_URL}" height="26" alt="Yellow Zone" /></div>`;
}
function tplBoundedColumnHtml(innerHtml) {
  return `<div style="max-width:480px;margin:0 auto;text-align:right">${innerHtml}</div>`;
}
// הדגשה בסגנון וואטסאפ — *מילה* הופך ל-<b>מילה</b>, זהה ל-applyBold ב-worker/src/brevo.js
function tplApplyBold(escapedText) {
  return escapedText.replace(/\*(.+?)\*/g, '<b>$1</b>');
}
// קישורים לחיצים בטקסט חופשי, זהה ל-linkifyUrls ב-worker/src/brevo.js
function tplLinkifyUrls(text) {
  return text.replace(/(https?:\/\/[^\s<]+|(?:www\.)?[a-zA-Z0-9-]+\.(?:com|co\.il|net|org|io)(?:\/[^\s<]*)?)/g, (match) => {
    const href = match.startsWith('http') ? match : `https://${match}`;
    return `<a href="${href}" style="color:#16130a;font-weight:700;text-decoration:underline">${match}</a>`;
  });
}
function tplRichBodyHtml(bodyTemplate, vars, linkLabel) {
  return (bodyTemplate || '').split('\n\n').map(para => {
    const trimmed = para.trim();
    if (trimmed === '{code}' && vars.code) return tplCodeBoxHtml(vars.code);
    if (trimmed === '{link}' && vars.link) return tplLinkButtonHtml(vars.link, linkLabel || 'כניסה');
    if (trimmed === '{login_link}') return tplLinkButtonHtml('https://yellowzone.co.il/welcome.html', 'כניסה לאתר');
    return `<p style="margin:0 0 16px 0">${tplLinkifyUrls(tplApplyBold(esc(applyBroadcastVars(para, vars)))).replace(/\n/g, '<br>')}</p>`;
  }).join('');
}

    return `<div class="tpl-list">
      ${templateCombinedRowHtml('termsFan', 'termsBiz', 'תקנון — אוהדים ועסקים', 'הטקסט המשפטי בעמוד התקנון (terms.html)', '📜')}
      ${templateCombinedRowHtml('successFan', 'successBiz', '"הבקשה התקבלה" — אוהדים ועסקים', 'המסך שמוצג מיד אחרי שליחת טופס ההרשמה', '✅')}
    </div>`;
  }
  const items = MESSAGE_TEMPLATE_ITEMS.filter(i => i.group === group);
  if (!items.length) return '';
  return `<div class="tpl-list">${items.map(templateCardHtml).join('')}</div>`;
}
// מספר-השורות-המוצגות (לא מספר-רשומות-הדאטה) — תקנון+הצלחה נספרים כשורה אחת כל אחד (תואם-handoff · 7),
// לא 4 כמו MESSAGE_TEMPLATE_ITEMS.length בפועל (9, כי כל גרסת-אודיינס נשמרת כרשומה נפרדת ב-Firestore).
function messageTemplateRowCount() {
  return MESSAGE_TEMPLATE_ITEMS.filter(i => i.group === 'auto' || i.group === 'manual').length + 2;
}

// ── "הודעה בודדת/למספר נמענים" — חיפוש+בחירה מרובה (checkboxes) של עסקים/אוהדים, ואז שליחה
// ידנית לכל אחד בנפרד (מיד קיים: sendBizWA/sendBizMail/sendFanWA/sendFanMail, שורות ~1821) —
// בלי לחפש את השורה ברשימה הארוכה. Set נפרד מ-selectedBizIds/selectedFanIds בכוונה: אלה
// משמשים לבולק-אישור/דחייה ב"כל העסקים"/"כל האוהדים" — לא רוצים שבחירה כאן (ad-hoc, לשליחה
// ידנית בלבד) תתערבב עם זרימת האישור שם.
let manualPickerType = 'businesses'; // 'businesses' | 'fans'
let manualPickerSelectedBizIds = new Set();
let manualPickerSelectedFanIds = new Set();
// מצב-שליחה — שידור-המוני מול נמענים-נבחרים, מתג אחד עם 2 מצבים (§136, לפי מוקאפ
// demo-redesign-admin-messages.html) — מחליף 2 אקורדיונים-עצמאיים ישנים (msgOpenSection/toggleMsgSection).
let msgSendMode = 'broadcast'; // 'broadcast' | 'single'
window.setMsgSendMode = function(m) { msgSendMode = m; renderMain(); };

window.setManualPickerType = function(type) {
  manualPickerType = type;
  renderMain();
};

function manualPickerSelectedSet() {
  return manualPickerType === 'fans' ? manualPickerSelectedFanIds : manualPickerSelectedBizIds;
}

// אותם סינונים בדיוק כמו בבורר הקהל של "שידור המוני" (bizFilteredList/fanFilteredList — סטטוס/
// קטגוריה/מצב-סקירה/בריאות-פרופיל/תאריך/מיון, אותו state גלובלי משותף) — לא בורר-חיפוש נפרד.
function manualPickerListHtml() {
  const isFans = manualPickerType === 'fans';
  const filtered = isFans ? fanFilteredList() : bizFilteredList();
  if (!filtered.length) return `<div class="picker-empty">לא נמצאו תוצאות</div>`;
  const set = manualPickerSelectedSet();
  return filtered.slice(0, 100).map(x => {
    const sel = set.has(x.id);
    const noteFlag = (!isFans && bizHasUnhandledNote(x)) ? ' 💬' : '';
    return `
    <label class="aud-picker-row">
      <input type="checkbox" ${sel?'checked':''} onchange="toggleManualPickerSelect('${x.id}')">
      <span class="nm">${esc(x.name)}${noteFlag}</span>
    </label>`;
  }).join('');
}

window.toggleManualPickerSelect = function(id) {
  const set = manualPickerSelectedSet();
  if (set.has(id)) set.delete(id); else set.add(id);
  renderMain();
};

function manualSelectedRecipientsHtml() {
  const isFans = manualPickerType === 'fans';
  const set = manualPickerSelectedSet();
  if (!set.size) return '';
  const items = [...set].map(id => isFans ? findFan(id) : bizById(id)).filter(Boolean);
  return `<div style="margin-top:12px">` + items.map(x => {
    const waBtn = (isFans ? x.phone : x.ownerPhone) ? `<button class="slot-btn" onclick="sendManualAdhoc('wa','${x.id}')">📲 WhatsApp</button>` : '';
    const mailBtn = (isFans ? x.email : x.ownerEmail) ? `<button class="slot-btn" onclick="sendManualAdhoc('mail','${x.id}')">✉️ מייל</button>` : '';
    // הקשר קטן — אם לעסק יש הודעת "כתבו לנו" ממתינה, נוח לראות אותה כאן לפני שמנסחים תשובה
    const noteHint = (!isFans && bizHasUnhandledNote(x)) ? `<div class="picker-note-hint">💬 העסק כתב: "${esc(x.note)}"</div>` : '';
    return `<div class="selected-recipient-row"><span class="nm">${esc(x.name)}</span>${waBtn}${mailBtn}<button class="slot-btn" onclick="toggleManualPickerSelect('${x.id}')">✕ הסר</button>${noteHint}</div>`;
  }).join('') + `</div>`;
}

// ── עריכת תוכן חד-פעמית ("הודעה בודדת") — בכוונה נפרדת מ-_hb_tpl_* (התבנית הקבועה שמשמשת גם
// את כפתורי 📲/✉️ ליד עסק/אוהד ברשימות): עריכה כאן היא ל-session הזה בלבד, לא נשמרת ולא דורסת
// את התבנית הקבועה. ברירת המחדל בכל שדה היא הערך הנוכחי של התבנית — אפשר לערוך בלי לפגוע בו.
let manualAdhocFields = { wa: null, mailSubject: null, mail: null, fan_wa: null, fan_mailSubject: null, fan_mail: null };
window.setManualAdhocField = function(key, value) {
  manualAdhocFields[key] = value; // בכוונה בלי renderMain() — לא לאבד פוקוס/מיקום סמן בכל הקלדה
};
function manualAdhocValue(item, key) {
  return manualAdhocFields[key] != null ? manualAdhocFields[key] : tplFieldValue(item, item.fields.find(f => f.key === key));
}

function manualAdhocFieldsHtml() {
  const isFans = manualPickerType === 'fans';
  const item = findMessageTemplate(isFans ? 'fanManual' : 'bizManual');
  const waKey = isFans ? 'fan_wa' : 'wa';
  const subjKey = isFans ? 'fan_mailSubject' : 'mailSubject';
  const bodyKey = isFans ? 'fan_mail' : 'mail';
  return `
    <div class="msg-group-label" style="margin-top:16px">✏️ עריכת התוכן לשליחה הזו <span class="hint">— חד-פעמי, לא משנה את התבנית הקבועה למטה</span></div>
    <div class="approve-field-label">📲 תבנית WhatsApp</div>
    <textarea class="broadcast-body-input" rows="5" oninput="setManualAdhocField('${waKey}', this.value)">${esc(manualAdhocValue(item, waKey))}</textarea>
    <div class="approve-field-label">✉️ נושא המייל</div>
    <input type="text" class="chain-select" value="${esc(manualAdhocValue(item, subjKey))}" oninput="setManualAdhocField('${subjKey}', this.value)">
    <div class="approve-field-label">✉️ גוף המייל</div>
    <textarea class="broadcast-body-input" rows="6" oninput="setManualAdhocField('${bodyKey}', this.value)">${esc(manualAdhocValue(item, bodyKey))}</textarea>`;
}

// שליחה בפועל מ"הודעה בודדת" — משתמש בתוכן החד-פעמי (אם נערך) או בברירת המחדל מהתבנית הקבועה,
// עם אותם helper-ים של placeholder בדיוק (applyBizTpl/applyFanTplLocal/waLink, שורות ~1808-1818).
window.sendManualAdhoc = function(channel, id) {
  const isFans = manualPickerType === 'fans';
  const x = isFans ? findFan(id) : bizById(id);
  if (!x) return;
  const item = findMessageTemplate(isFans ? 'fanManual' : 'bizManual');
  if (channel === 'wa') {
    const tpl = manualAdhocValue(item, isFans ? 'fan_wa' : 'wa');
    const msg = isFans ? applyFanTplLocal(tpl, x.name, x.loginCode || '') : applyBizTpl(tpl, x.ownerFirst || '', x.name, x.accessToken || '');
    window.open(waLink(isFans ? x.phone : x.ownerPhone, msg), '_blank');
  } else {
    const subjTpl = manualAdhocValue(item, isFans ? 'fan_mailSubject' : 'mailSubject');
    const bodyTpl = manualAdhocValue(item, isFans ? 'fan_mail' : 'mail');
    const subject = encodeURIComponent(isFans ? subjTpl : applyBizTpl(subjTpl, x.ownerFirst || '', x.name, x.accessToken || ''));
    const body = encodeURIComponent(isFans ? applyFanTplLocal(bodyTpl, x.name, x.loginCode || '') : applyBizTpl(bodyTpl, x.ownerFirst || '', x.name, x.accessToken || ''));
    window.open(`mailto:${isFans ? x.email : x.ownerEmail}?subject=${subject}&body=${body}`, '_blank');
  }
};

// גוף-בלבד (בלי עטיפת-כרטיס/כותרת-קיפול משלו) — §136: מוצג בתוך sendNowSectionHtml כשמצב
// המתג הוא 'single'. ההערה "בתבניות הקבועות... שליחה ידנית" עברה להיות hint קבוע במתג עצמו.
function singleSenderBodyHtml() {
  const isFans = manualPickerType === 'fans';
  return `
    <div class="broadcast-audience-toggle">
      <button class="filter-pill ${!isFans?'active':''}" onclick="setManualPickerType('businesses')">🏪 עסקים</button>
      <button class="filter-pill ${isFans?'active':''}" onclick="setManualPickerType('fans')">👥 אוהדים</button>
    </div>
    ${isFans ? fanFilterBarHtml() : bizFilterBarHtml()}
    <div class="picker" style="margin-top:8px">
      <div class="picker-list" id="manualPickerList" style="max-height:280px">${manualPickerListHtml()}</div>
    </div>
    ${manualSelectedRecipientsHtml()}
    ${manualAdhocFieldsHtml()}`;
}

// ── בורר קהל inline לשידור המוני — משתמש **באותם סינונים בדיוק** של "כל העסקים"/"כל האוהדים"
// (bizFilteredList/bizFilterBarHtml — סטטוס/קטגוריה/סוג/מצב-סקירה/בריאות-פרופיל/תאריך/מיון,
// אותו state גלובלי) כדי לענות על הבקשה: "רק לממתינים", "הכי פחות שלבים נסקרו", "פרופיל לא בריא",
// "לפי קטגוריות" — כל אלה כבר קיימים שם, לא הומצאו מחדש. checkboxes על selectedBizIds/selectedFanIds
// (אותו Set שמשמש גם לבולק-אישור/דחייה שם — broadcastAudience() כבר קורא מהם).
// toggleBizSelect/toggleFanSelect/filterBizRows/toggleSelectAllBiz בטוחים לקריאה מכאן כי
// refreshBizList/refreshFanList הפכו ל-tab-aware (ר' למעלה) — נופלים ל-renderMain מלא כשלא
// בטאב "כל העסקים"/"כל האוהדים".
function broadcastAudPickerListHtml() {
  const isFans = broadcastAudienceType === 'fans';
  const filtered = isFans ? fanFilteredList() : bizFilteredList();
  if (!filtered.length) return `<div class="picker-empty">לא נמצאו תוצאות</div>`;
  const set = isFans ? selectedFanIds : selectedBizIds;
  const toggleFn = isFans ? 'toggleFanSelect' : 'toggleBizSelect';
  return filtered.slice(0, 100).map(x => {
    const sel = set.has(x.id);
    return `
    <label class="aud-picker-row">
      <input type="checkbox" ${sel?'checked':''} onchange="${toggleFn}('${x.id}')">
      <span class="nm">${esc(x.name)}</span>
    </label>`;
  }).join('');
}

// ── תצוגה מקדימה של המייל (שלב 5א, §8 במפרט) — placeholders מוחלפים בנתוני הנמען הראשון בקהל.
// applyBroadcastVars זהה בכוונה ל-applyVars ב-worker/src/brevo.js (split/join פשוט, לא regex) —
// אותה לוגיקת-החלפה בדיוק כמו מה שהוורקר עושה בפועל בזמן שליחה, כדי שהתצוגה תהיה נאמנה.
function broadcastVarsFor(item, isFans) {
  const base = `${location.origin}${location.pathname.replace(/[^/]*$/, '')}`;
  return isFans
    ? { name: item.firstName || item.ownerFirst || '', code: item.loginCode || '', link: base + 'home.html' }
    : { name: item.ownerFirst || '', business: item.name || '', link: item.accessToken ? base + 'business-dashboard.html?token=' + item.accessToken : '' };
}
function applyBroadcastVars(text, vars) {
  return Object.entries(vars).reduce((s, [k, v]) => s.split(`{${k}}`).join(v ?? ''), text || '');
}
// מעטפת-מייל מדומה (§149, תואם-handoff: "כך המייל ייראה אצל X" + כותרת מ/אל + נושא+גוף בתוך
// "מייל" לבן עם מסגרת) — במקום קופסת-טקסט-שטוחה. אותם נתונים בדיוק (broadcastVarsFor/
// applyBroadcastVars), רק העיצוב השתנה.
function broadcastPreviewHtml(subject, body, audience, isFans) {
  if (!audience.length) return `<div class="broadcast-preview-empty">אין נמענים לתצוגה מקדימה</div>`;
  const first = audience[0];
  const vars = broadcastVarsFor(first, isFans);
  const toEmail = (isFans ? first.email : first.ownerEmail) || '—';
  return `
    <div class="broadcast-preview">
      <div class="broadcast-preview-label">כך המייל ייראה אצל ${esc(first.name)}</div>
      <div class="broadcast-preview-envelope">
        <div class="broadcast-preview-head">
          <div class="broadcast-preview-meta">מ־ Yellow Zone · אל ${esc(toEmail)}</div>
          <div class="broadcast-preview-subject">${esc(applyBroadcastVars(subject, vars))}</div>
        </div>
        <div class="broadcast-preview-body">${esc(applyBroadcastVars(body, vars)).replace(/\n/g,'<br>')}</div>
      </div>
      <div class="broadcast-preview-note">המשתנים הוחלפו בנתונים של הנמען הראשון בקהל</div>
    </div>`;
}
// מעדכן רק את קופסת-התצוגה עצמה בהקלדה (לא renderMain מלא — היה מאבד פוקוס/מיקום-סמן בשדות)
window.updateBroadcastPreview = function() {
  const subjectEl = document.getElementById('broadcastSubject');
  const bodyEl = document.getElementById('broadcastBody');
  const box = document.getElementById('broadcastPreviewBox');
  if (!subjectEl || !bodyEl || !box) return;
  box.innerHTML = broadcastPreviewHtml(subjectEl.value, bodyEl.value, broadcastAudience(), broadcastAudienceType === 'fans');
};

// שורת "תגיות" של הקהל שנבחר בפועל — מוצגת מעל הרשימה, כדי שברור בלי לגלול מי כבר מסומן
function broadcastSelectedChipsHtml() {
  const isFans = broadcastAudienceType === 'fans';
  const set = isFans ? selectedFanIds : selectedBizIds;
  if (!set.size) return '';
  const items = [...set].map(id => isFans ? findFan(id) : bizById(id)).filter(Boolean);
  return `<div class="aud-chips-row">${items.map(x => `
    <span class="aud-chip">${esc(x.name)}<button onclick="${isFans?'toggleFanSelect':'toggleBizSelect'}('${x.id}')">✕</button></span>`).join('')}</div>`;
}

// שני טאבים ראשיים (שלב 5, §8 במפרט) — מחליף החלטה קודמת של "עמוד גלילה אחד, לא טאבים שמחביאים
// מקטעים". המשתמש אישר במפורש להפוך את זה — "יותר נוח ככה" מ-2 טאבים. "שליחה עכשיו" = 2 המקטעים
// הפעילים (הודעה בודדת + שידור המוני, עדיין נפתחים/נסגרים בפני עצמם עם toggleMsgSection כרגיל),
// "תבניות קבועות" = 4 קבוצות-ההגדרות עם סינון-צ'יפים ביניהן.
let msgMainTab = 'send';       // 'send' | 'templates'
let msgTemplateGroupFilter = 'all'; // 'all' | 'manual' | 'auto' | 'site' — 'site' מכסה גם 'success' וגם 'terms' (ר' templateGroupHtml)
window.setMsgMainTab = function(v) { msgMainTab = v; renderMain(); };
window.setMsgTemplateGroupFilter = function(v) { msgTemplateGroupFilter = v; renderMain(); };
// כרטיס "שליחה עכשיו" מאוחד — מתג (שידור המוני / נמענים נבחרים) בכותרת, גוף מוחלף לפי המצב
// (§136, לפי מוקאפ). מחליף 2 אקורדיונים-עצמאיים ישנים (manualSenderHtml+broadcastTabHtml
// היו כל אחד עם עטיפת-כרטיס+כותרת-קיפול משלו) — עכשיו הם רק ספקי-תוכן (body-only).
function sendNowSectionHtml() {
  const isSingle = msgSendMode === 'single';
  const singleCount = manualPickerSelectedSet().size;
  return `
    <div class="msg-section">
      <div class="card-head">
        <div class="card-head-title">שליחה עכשיו</div>
        <div class="spacer"></div>
        <div class="seg">
          <div class="${!isSingle?'on':''}" onclick="setMsgSendMode('broadcast')">שידור המוני</div>
          <div class="${isSingle?'on':''}" onclick="setMsgSendMode('single')">נמענים נבחרים${singleCount?` (${singleCount})`:''}</div>
        </div>
      </div>
      <div class="msg-section-body">
        ${isSingle ? singleSenderBodyHtml() : broadcastTabHtml()}
      </div>
    </div>`;
}

// כותרת-עמוד (breadcrumb+3 KPI) — §139, לפי מוקאף. scoped למרכז-הודעות בלבד (עדיין לא קיים
// בשום טאב אחר, ר' §136) — "שידורים נשלחו" מוגבל ל-10 האחרונים כי זה גודל ה-onSnapshot query
// הקיים (messageBroadcastHistory), לא נוספה שאילתת-ספירה-אמיתית חדשה בשביל KPI אחד.
function msgContentHeadHtml() {
  const approvedFans = MOCK_FANS.filter(f => f.status === 'approved').length;
  const approvedBiz = MOCK_BUSINESSES.filter(b => b.status === 'approved').length;
  return `
    <div class="msg-content-head">
      <div style="flex:1;min-width:240px">
        <div class="msg-crumb"><a onclick="selectTab('${HOME_KEY}')">← מרכז המשימות</a><span>/</span><span>מרכז הודעות</span></div>
        <div class="msg-page-title">מרכז הודעות</div>
      </div>
      <div class="msg-kpis">
        <div><div class="msg-kpi-num">${approvedFans}</div><div class="msg-kpi-label">אוהדים מאושרים</div></div>
        <div class="msg-kpi-sep"></div>
        <div><div class="msg-kpi-num">${approvedBiz}</div><div class="msg-kpi-label">עסקים מאושרים</div></div>
        <div class="msg-kpi-sep"></div>
        <div><div class="msg-kpi-num">${messageBroadcastHistory.length}</div><div class="msg-kpi-label">שידורים אחרונים</div></div>
      </div>
    </div>`;
}

function messageCenterHtml() {
  const total = messageTemplateRowCount();
  const showGroup = (g) => msgTemplateGroupFilter === 'all' || msgTemplateGroupFilter === g;
  return `
    ${msgContentHeadHtml()}
    <div class="msg-layout">
      <div class="msg-col-main">
        <div class="action-tabs">
          <button class="action-tab ${msgMainTab==='send'?'active':''}" onclick="setMsgMainTab('send')">📨 שליחה עכשיו</button>
          <button class="action-tab ${msgMainTab==='templates'?'active':''}" onclick="setMsgMainTab('templates')"><span class="cnt">${total}</span>התבניות הקבועות</button>
        </div>
        ${msgMainTab === 'send' ? `
          ${sendNowSectionHtml()}
        ` : `
          <div class="msg-section">
            <div class="tpl-filters">
              <div class="card-head-title" style="margin-inline-end:4px">התבניות הקבועות</div>
              <button class="tpl-filter ${msgTemplateGroupFilter==='all'?'on':''}" onclick="setMsgTemplateGroupFilter('all')">הכל · ${total}</button>
              <button class="tpl-filter ${msgTemplateGroupFilter==='auto'?'on':''}" onclick="setMsgTemplateGroupFilter('auto')">✉️ מיילים אוטומטיים</button>
              <button class="tpl-filter ${msgTemplateGroupFilter==='manual'?'on':''}" onclick="setMsgTemplateGroupFilter('manual')">📨 הודעות ידניות</button>
              <button class="tpl-filter ${msgTemplateGroupFilter==='site'?'on':''}" onclick="setMsgTemplateGroupFilter('site')">📜 טקסטים באתר</button>
            </div>
            <div class="msg-section-body" style="padding-top:2px">
