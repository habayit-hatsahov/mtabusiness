<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>דמו – איך מממשים? ליד כל הטבה</title>
  <!-- §604 — דמו: קישור "איך מממשים?" בכל כרטיס-מימוש בגיליון העסק (home.html), שפותח רק את המסלול
       של אותה הטבה – חנות / נותן שירות / אתר – עם שם העסק. הנוסח = הנוסח המאוחד המוצע למדריך שבקרוסלה
       ולמדריך של בעל העסק (biz-guides.js / redemption-guide.html). דמו בלבד, בלי קריאת נתונים. -->
  <style>
    @font-face { font-family: 'Rubik'; font-style: normal; font-weight: 300 900; font-display: swap;
      src: url('fonts/rubik-hebrew.woff2') format('woff2'); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
    @font-face { font-family: 'Rubik'; font-style: normal; font-weight: 300 900; font-display: swap;
      src: url('fonts/rubik-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+2122, U+2212, U+2713; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --yellow: #FFD400; --ink: #0A2A66; --ink-2: #3A4C7A; --ink-3: #6B7A9B;
      --line: #ECE8DA; --field-line: #E4E4DC; --acc: #FFD400; --acc-ink: #0A2A66;
      --acc-soft: #FFF7DB; --acc-line: #F5E3A0; --r-card: 16px; --cream: #FBF8EE;
    }
    body { font-family: 'Rubik', sans-serif; color: var(--ink); background: #F4F2EA; }
    .demo-bar { position: sticky; top: 0; z-index: 5; background: #1c1c1c; color: #fff; padding: 10px 12px;
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
    .demo-bar .lbl { font-size: 12px; opacity: .7; width: 100%; text-align: center; }
    .demo-bar button { border: 1px solid #555; background: #2b2b2b; color: #fff; border-radius: 20px;
      padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
    .demo-bar button.on { background: var(--yellow); color: var(--ink); border-color: var(--yellow); }
    .sheet { max-width: 440px; margin: 0 auto; background: #fff; min-height: 100vh; padding: 22px 16px 40px; }
    h1 { font-size: 26px; font-weight: 900; }
    .desc { font-size: 15px; color: var(--ink-2); margin-top: 10px; line-height: 1.6; }
    .sec-h { margin-top: 18px; font-size: 12.5px; font-weight: 800; color: var(--ink-2); letter-spacing: .04em; }
    .sheet-benefit { margin-top: 8px; background: var(--acc-soft); border: 1px solid var(--acc-line); border-radius: var(--r-card); padding: 14px; }
    .sheet-benefit-tag { font-size: 11px; font-weight: 700; color: var(--ink-3); margin-bottom: 4px; }
    .sheet-benefit-text { font-size: 17px; font-weight: 800; line-height: 1.35; white-space: pre-line; }
    .sheet-benefit-type { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
    .sheet-benefit-secondary { margin-top: 8px; background: #fff; border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px 14px; }
    .sheet-benefit-secondary .sheet-benefit-text { font-size: 14px; }
    .redeem-card { background: #fff; border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px; margin-top: 22px; }
    .redeem-card + .redeem-card { margin-top: 10px; }
    .redeem-benefit-tag { font-size: 11px; font-weight: 700; color: var(--ink-3); margin-bottom: 10px; padding-bottom: 9px; border-bottom: 1px solid var(--line); }
    .redeem-benefit-tag b { color: var(--ink); font-weight: 800; }
    .redeem-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .redeem-text { flex: 1; min-width: 0; }
    .redeem-title { font-size: 15px; font-weight: 800; }
    .redeem-desc { font-size: 12.5px; font-weight: 500; color: var(--ink-3); margin-top: 4px; line-height: 1.5; }
    .redeem-icon-sq { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center; }
    .redeem-toggle-btn { display: block; width: 100%; height: 46px; margin-top: 12px; background: var(--acc); color: var(--acc-ink);
      border: none; border-radius: 12px; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; }
    /* החדש: הקישור הקטן מתחת לכפתור – שקט, לא מתחרה בכפתור הצהוב */
    .howto-link { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin-top: 8px;
      background: none; border: none; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--ink-2);
      cursor: pointer; padding: 6px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(10,42,102,.3); }
    .howto-link svg { flex-shrink: 0; }

    /* הגיליון הקטן */
    .ov { position: fixed; inset: 0; background: rgba(10,20,40,.45); display: none; z-index: 20; }
    .ov.open { display: block; }
    .mini { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 440px; margin: 0 auto; background: #fff;
      border-radius: 22px 22px 0 0; padding: 10px 18px 26px; transform: translateY(105%); transition: transform .25s ease;
      max-height: 88vh; overflow-y: auto; }
    .mini.open { transform: none; }
    .grab { width: 40px; height: 4px; border-radius: 4px; background: #D9D6CA; margin: 0 auto 14px; }
    .mini-who { font-size: 12px; font-weight: 800; color: var(--ink-3); }
    .mini h2 { font-size: 21px; font-weight: 900; margin-top: 2px; }
    .route { margin-top: 14px; background: var(--cream); border-radius: 16px; padding: 13px 14px; }
    .route + .route { margin-top: 10px; }
    .route-h { font-size: 15px; font-weight: 900; }
    .step { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; font-size: 14px; line-height: 1.5; }
    .n { width: 24px; height: 24px; border-radius: 50%; background: var(--yellow); font-weight: 900; font-size: 13px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .checks-h { font-size: 15px; font-weight: 900; margin-top: 16px; }
    .chk { display: flex; gap: 8px; margin-top: 8px; font-size: 14px; line-height: 1.45; }
    .chk .v { color: #1e6b34; font-weight: 900; }
    .chk span.s { color: var(--ink-3); }
    .strip { margin-top: 12px; background: linear-gradient(140deg,#0A2A66 0%,#123A82 100%); border-radius: 12px; padding: 10px 12px 9px; color: #fff; }
    .strip .h { display: flex; justify-content: space-between; align-items: center; }
    .strip .r1 { display: flex; align-items: center; gap: 6px; }
    .strip .dot { width: 7px; height: 7px; border-radius: 50%; background: #22C55E; }
    .strip .cap { font-size: 10.5px; font-weight: 700; color: var(--yellow); }
    .strip .mk { font-size: 9.5px; font-weight: 800; color: var(--yellow); letter-spacing: .06em; }
    .strip .ft { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 8px; padding-top: 7px; border-top: 1px solid rgba(255,255,255,.14); }
    .strip .bz { font-size: 15px; font-weight: 800; }
    .strip .clk { font-size: 10.5px; font-weight: 700; color: #C9D8F5; background: rgba(255,255,255,.1); border-radius: 6px; padding: 3px 7px; direction: ltr; white-space: nowrap; }
    .strip-cap { font-size: 12px; color: var(--ink-3); margin-top: 6px; text-align: center; }
    .mini-note { margin-top: 14px; font-size: 13px; color: var(--ink-3); text-align: center; }
    .mini-close { display: block; width: 100%; height: 46px; margin-top: 14px; background: #fff; border: 1px solid var(--field-line);
      border-radius: 12px; font-family: inherit; font-size: 15px; font-weight: 800; color: #475467; cursor: pointer; }
  </style>
</head>
<body>
  <div class="demo-bar">
    <div class="lbl">דמו – בחרו סוג עסק, ולחצו "איך מממשים?" בכרטיס</div>
    <button data-ex="store" class="on">חנות</button>
    <button data-ex="pro">נותן שירות</button>
    <button data-ex="both">חנות + נותן שירות</button>
    <button data-ex="online">אתר</button>
    <button data-ex="mixed">2 הטבות (חנות + אתר)</button>
  </div>

  <div class="sheet" id="sheet"></div>

  <div class="ov" id="ov" onclick="closeHowto()"></div>
  <div class="mini" id="mini" role="dialog" aria-modal="true"></div>

<script>
// דוגמאות – שמות מומצאים (הריפו מוגש פומבית)
const EX = {
  store:  { name: 'הקפה של היציע', desc: 'בית קפה שכונתי עם מאפים טריים כל בוקר.', isPhysical: true, isPro: false,
            units: [{ text: '10% הנחה', types: ['physical'] }] },
  pro:    { name: 'יוסי שיפוצים', desc: 'שיפוצים כלליים, צבע וגבס.', isPhysical: false, isPro: true,
            units: [{ text: '15% הנחה על עבודה ראשונה', types: ['sale'] }] },
  both:   { name: 'הפקות הזהב', desc: 'תכנון, עיצוב והפקה של אירועים פרטיים ועסקיים.', isPhysical: true, isPro: true,
            units: [{ text: '10% הנחה', types: ['sale'] }] },
  online: { name: 'חולצות כחול-צהוב', desc: 'חנות אונליין לחולצות ומרצ\'נדייז.', isPhysical: false, isPro: false,
            units: [{ text: '12% הנחה באתר', types: ['online'], code: 'YZ12' }] },
  mixed:  { name: 'אופטיקה המזרחי', desc: 'משקפי ראייה, שמש ועדשות מגע.', isPhysical: true, isPro: false,
            units: [{ text: '20% על משקפי שמש', types: ['physical'] }, { text: '10% על עדשות מגע', types: ['online'], code: 'YZLENS' }] },
};

const ICON_LOCK = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
const ICON_TAG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>';
const ICON_Q = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>';

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// אותה לוגיקה כמו home.html (§603): הכותרת של הכרטיס = השורה מתחת להטבה
function routesOf(b, types) {
  const store = (b.isPhysical || b.isPro) && (types.includes('physical') || types.includes('sale'));
  const r = [];
  if (store) r.push(b.isPro && !b.isPhysical ? 'pro' : (b.isPhysical && b.isPro ? 'storePro' : 'store'));
  if (types.includes('online')) r.push('online');
  return r;
}
const TITLE = { store: 'מימוש בחנות', storePro: 'מימוש בחנות', pro: 'מימוש מול נותן השירות', online: 'מימוש באתר' };
function cardTitle(b, types) {
  const r = routesOf(b, types);
  if (r.length === 2) return b.isPro && !b.isPhysical ? 'מימוש מול נותן השירות או באתר' : 'מימוש בחנות או באתר';
  return TITLE[r[0]] || '';
}

// ── הנוסח המאוחד (מוצע) – אותן עובדות במדריך שבקרוסלה ובמדריך של בעל העסק ──
const STEPS = {
  store: [
    'לוחצים <b>"לקבלת ההטבה"</b> – נפתחת תעודת החבר, ומתחתיה פס כחול עם שם העסק ושעון חי.',
    'מציגים בקופה <b>את המסך עצמו</b> – לא צילום מסך.',
  ],
  pro: [
    'לוחצים <b>"לקבלת ההטבה"</b> – נפתחת תעודת החבר, ומתחתיה פס כחול עם שם העסק ושעון חי.',
    'בפגישה או בשיחת וידאו – מציגים את המסך.',
    'בוואטסאפ – שולחים <b>צילום מסך</b> שרואים בו את התעודה ואת הפס הכחול.',
  ],
  online: [
    'לוחצים <b>"לקבלת ההטבה"</b> ומעתיקים את קוד הקופון.',
    'לוחצים <b>"לרכישה באתר"</b> ומדביקים את הקוד בהזמנה.',
  ],
};
STEPS.storePro = [
  STEPS.store[0],
  'בקופה – מציגים את המסך עצמו. מול נותן השירות – בפגישה או בווידאו מציגים את המסך, ובוואטסאפ שולחים צילום מסך שרואים בו את התעודה ואת הפס.',
];
function checksFor(route, biz) {
  if (route === 'online') return [['הקוד מוצג רק לחברים', 'לא לשתף אותו מחוץ לקהילה']];
  const live = route === 'store'
    ? ['השעון רץ', 'השניות מתחלפות – מסך חי']
    : ['שעה עדכנית', 'בשעון החי, או בצילום מסך מאותו רגע'];
  return [['שם העסק בפס הכחול', esc(biz)], live, ['שם ומספר חבר', 'בתעודת החבר'], ['תעודה מזהה', 'עם אותו שם כמו בתעודת החבר']];
}

let cur = 'store';
function render() {
  const b = EX[cur];
  const multi = b.units.length > 1;
  let h = `<h1>${esc(b.name)}</h1><p class="desc">${esc(b.desc)}</p>
    <div class="sec-h">${multi ? 'ההטבות שלך' : 'ההטבה שלך'}</div>
    <div class="sheet-benefit">
      ${multi ? '<div class="sheet-benefit-tag">ההטבה הראשית</div>' : ''}
      <div class="sheet-benefit-text">${esc(b.units[0].text)}</div>
      <div class="sheet-benefit-type">${cardTitle(b, b.units[0].types)}</div>
    </div>`;
  b.units.slice(1).forEach(u => {
    h += `<div class="sheet-benefit-secondary"><div class="sheet-benefit-text">${esc(u.text)}</div>
      <div class="sheet-benefit-type">${cardTitle(b, u.types)}</div></div>`;
  });
  b.units.forEach((u, i) => {
    const r = routesOf(b, u.types);
    const online = r.length === 1 && r[0] === 'online';
    h += `<div class="redeem-card">
      ${multi ? `<div class="redeem-benefit-tag">${i === 0 ? 'ההטבה הראשית' : 'הטבה נוספת'} · <b>${esc(u.text)}</b></div>` : ''}
      <div class="redeem-top"><div class="redeem-text">
        <div class="redeem-title">${cardTitle(b, u.types)}</div>
        <div class="redeem-desc">${online ? 'קוד קופון לשימוש בקנייה אונליין' : (b.isPro && !b.isPhysical ? 'הציגו את תעודת החבר בפגישה או בשיחה עם נותן השירות' : 'הציגו את תעודת החבר בקופה, הצוות יאשר את ההטבה')}</div>
      </div><div class="redeem-icon-sq">${online ? ICON_TAG : ICON_LOCK}</div></div>
      <button class="redeem-toggle-btn" type="button">לקבלת ההטבה</button>
      <button class="howto-link" type="button" onclick="openHowto(${i})">${ICON_Q}<span>איך מממשים?</span></button>
    </div>`;
  });
  document.getElementById('sheet').innerHTML = h;
}

function openHowto(i) {
  const b = EX[cur], u = b.units[i];
  const routes = routesOf(b, u.types);
  let h = `<div class="grab"></div><div class="mini-who">${esc(b.name)} · ${esc(u.text)}</div>
    <h2>איך מממשים</h2>`;
  routes.forEach(rt => {
    h += `<div class="route"><div class="route-h">${TITLE[rt]}${rt === 'storePro' ? ' או מול נותן השירות' : ''}</div>
      ${STEPS[rt].map((s, k) => `<div class="step"><span class="n">${k + 1}</span><div>${s}</div></div>`).join('')}
    </div>`;
  });
  const main = routes.find(r => r !== 'online');
  h += `<div class="checks-h">${main ? 'מה בודקים' : 'שימו לב'}</div>` +
    checksFor(main || 'online', b.name).map(([t, s]) => `<div class="chk"><span class="v">✓</span><div><b>${t}</b> – <span class="s">${s}</span></div></div>`).join('');
  if (main) {
    h += `<div class="strip"><div class="h"><div class="r1"><span class="dot"></span><span class="cap">אימות בתוקף עבור ההטבה</span></div><span class="mk">YELLOW ZONE</span></div>
      <div class="ft"><span class="bz">${esc(b.name)}</span><span class="clk" data-clock></span></div></div>
      <div class="strip-cap">ככה נראה הפס הכחול אצלכם ב${esc(b.name)}</div>`;
  }
  h += `<div class="mini-note">משהו לא עבד? כתבו לנו ב"האזור שלי" ← "הודעות"</div>
    <button class="mini-close" type="button" onclick="closeHowto()">הבנתי</button>`;
  const m = document.getElementById('mini');
  m.innerHTML = h;
  tick();
  document.getElementById('ov').classList.add('open');
  m.classList.add('open');
}
function closeHowto() {
  document.getElementById('ov').classList.remove('open');
  document.getElementById('mini').classList.remove('open');
}
function tick() {
  const n = new Date();
  const t = n.toLocaleDateString('he-IL') + ' · ' + n.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.querySelectorAll('[data-clock]').forEach(e => e.textContent = t);
}
setInterval(tick, 1000);

document.querySelectorAll('.demo-bar [data-ex]').forEach(btn => btn.onclick = () => {
  cur = btn.dataset.ex;
  document.querySelectorAll('.demo-bar [data-ex]').forEach(x => x.classList.toggle('on', x === btn));
  closeHowto(); render();
});
render();
</script>
</body>
</html>
