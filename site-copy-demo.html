<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>דמו – שורת האתר מעתיקה את הקוד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#E9EDF5;font-family:Rubik,sans-serif;color:#0A2A66}
  .demo-bar{position:sticky;top:0;z-index:50;background:#0A2A66;color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
  .demo-bar b{color:#FFD400;margin-inline-end:auto}
  .demo-bar button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
  .demo-bar button.on{background:#FFD400;color:#0A2A66}
  .note{max-width:430px;margin:0 auto;padding:12px 16px;font-size:12.5px;line-height:1.6;color:#3A4C7A;background:#FFF8CC;border-bottom:1px solid #F0E08A}
  .wrap{max-width:430px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 30px rgba(10,42,102,.12);padding:18px 0 40px}
  .wrap h2{margin:0 16px 10px;font-size:18px;font-weight:800}
  .wrap .sub{margin:14px 16px 0;font-size:12.5px;color:#6B7A9B;line-height:1.55}
  #wkRoot{padding:0 16px}
  .hd{max-width:430px;margin:0 auto;background:#0A2A66;color:#fff;padding:16px;text-align:center}.hd img{height:30px}.hd p{margin:8px 0 0;font-size:14px;font-weight:700}
  #inl{margin-top:14px;border-top:1px solid #EEE}#inl .wk-close{display:none}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0A2A66;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20000;display:none}
  /* דמו §789 – שורת האתר מעתיקה את הקוד */
  .sc-sub{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;font-weight:700;color:#0A2A66}
  .sc-sub b{direction:ltr;background:#FFD400;color:#0A2A66;border-radius:6px;padding:1px 7px;font-weight:900;letter-spacing:.5px}
  .sc-pr-tag{display:block;margin-top:6px;font-size:11px;font-weight:800;color:#0A2A66;background:#FFF3B0;border-radius:999px;padding:2px 8px;text-align:center}
  .sc-ov{position:fixed;inset:0;z-index:30000;background:rgba(10,42,102,.55);display:none;align-items:flex-end;justify-content:center}
  .sc-ov.on{display:flex}
  .sc-card{width:100%;max-width:430px;background:#fff;border-radius:20px 20px 0 0;padding:22px 20px 28px;text-align:center;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
  .sc-card .ok{font-size:15px;font-weight:800;color:#1E7A3C}
  .sc-card .code{direction:ltr;display:inline-block;margin:10px 0 6px;font-size:34px;font-weight:900;letter-spacing:2px;background:#FFD400;color:#0A2A66;border-radius:12px;padding:4px 22px}
  .sc-card p{margin:6px 0 0;font-size:14px;line-height:1.55;color:#3A4C7A}
  .sc-card .go{margin-top:14px;display:block;background:#0A2A66;color:#fff;border-radius:14px;padding:13px;font-weight:800;font-size:15px;text-decoration:none}
  .sc-card .bar{height:4px;background:#E9EDF5;border-radius:4px;margin-top:12px;overflow:hidden}.sc-card .bar i{display:block;height:100%;width:0;background:#FFD400}
  .sc-card .bar i.run{transition:width 1.6s linear;width:100%}
  .sc-card small{display:block;margin-top:8px;font-size:12px;color:#8A97B5}
</style>
</head>
<body>
<div class="hd"><img src="images/yellowzone-logo-horizontal.png" alt="Yellow Zone"><p>דמו: כניסה לאתר = הקוד כבר מועתק<br>לחצו על "כניסה לאתר" או על חולצה</p></div>
<div class="wrap">
  <h2>הטבות ועדכונים</h2>
  <div id="wkRoot"></div>
  <p class="sub">בדף הבית – התיבה בקרוסלה. לחיצה עליה פותחת את העמוד המלא:</p>
  <div class="wk-sheet wk-inline" id="inl"></div>
</div>
<div class="toast" id="toast"></div>

<script src="weekly-render.js?v=776h"></script>
<script>
(function () {
  window.WK_DEMO_NOW = '2026-11-16T12:00';
  window.WK_DEMO_MEMBER = true;
  // בדמו אין כרטיס עסק – רק הודעה במקום
  window.openBiz = function () { toast('באפליקציה – כאן נפתח כרטיס העסק של Glory Street'); };
  function toast(s) { var t = document.getElementById('toast'); t.textContent = s; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 2200); }

  var LOGO = 'https://firebasestorage.googleapis.com/v0/b/habayit-hatsahov.firebasestorage.app/o/businesses%2FUN1zkEcAjbDaXKl3XYmV%2Flogo_1786989109477_thumb?alt=media&token=db86b096-3d25-4708-aedd-2d3c67eee0a3';
  var BEN = {
    start: '2026-11-16', end: '2026-12-01',
    badge: 'הטבת אונליין בלעדית', tag2: '',
    slideTitle: '50 ₪ מתנה',
    slideHint: 'בקוד קופון · באתר',
    brandLogo: 'images/weekly/glory-logo.png', brandLogoCrop: [26, 160, 660, 58, 625], brandLogoClear: true, brandLogoH: 36,
    titleBottom: true, slidePrice: 'ללא הגבלה · כולל כפל מבצעים', slidePriceOneLine: true, sizeExtra: '', more: 'לפרטים',
    prices: [], options: [], after: '', img: '', heroImg: '', bg: '',
    photo: 'images/weekly/bull-glory.jpg', photoBg: '#FEDB05',
    photoH: 300, photoTop: -10, photoLeft: -24, photoFadeBottom: 0,
    slidePhoto: { photoH: 286, photoTop: -2, photoLeft: -4, photoFadeBottom: 0 },
    heroWide: 'images/weekly/bull-glory-trio.jpg',
    title: '50 ₪ מתנה ב-Glory Street',
    hint: 'הטבת אונליין · ללא הגבלה · כולל כפל מבצעים',
    intro: 'Glory Street – מותג אופנת רחוב בהשראת אייקונים מעולם הכדורגל, הכדורסל, ההיפ הופ וה-UFC. לחברי Yellow Zone, לזמן מוגבל, באתר:',
    gifts: [{ big: '50 ₪', line: 'מתנה', sub: '' }],
    promo: {
      title: 'ובנוסף – המבצע באתר',
      text: '• 2 חולצות – 50 ₪ הנחה\n• 3 חולצות – 100 ₪ הנחה\nוה-50 ₪ שלנו מצטרפים גם למבצע.'
    },
    shop: { title: 'החולצות של Glory Street', url: 'https://glory-street.com/', max: 16, site: 'glory' },
    cycNote: 'ב-1 וב-16 בכל חודש עולה הטבה בלעדית חדשה, רק לחברי Yellow Zone ולזמן מוגבל.',
    whereTitle: 'איפה מממשים · הטבת אונליין',
    biz: [{ id: 'UN1zkEcAjbDaXKl3XYmV', name: 'Glory Street', area: 'חנות אונליין · glory-street.com', logo: LOGO }],
    coupon: {
      code: 'MTA50', url: 'https://glory-street.com/', instagram: 'https://www.instagram.com/glorystreet.il/', siteLabel: 'לאתר', btn: 'לקבלת קוד הקופון',
      note: 'מזינים את הקוד בקופה באתר – 50 ₪ יורדים מהסכום.',
      guestLine: 'הקוד לחברי Yellow Zone בלבד. מתחברים ומקבלים אותו מיד.'
    },
    howTitle: 'איך זה עובד',
    how: '• לוחצים "לקבלת קוד הקופון" ומעתיקים את הקוד\n• נכנסים לאתר Glory Street ובוחרים מה שאוהבים\n• בקופה מזינים את הקוד – 50 ₪ יורדים, גם על מבצעי האתר\n• בתוקף עד {end}'
  };
  function render() { var d = WK.merge({ ben: BEN }); WK.mount(document.getElementById('wkRoot'), d); var x = document.getElementById('inl'); x.innerHTML = WK.sheetInner('ben', d, WK.ctxFor(d));
    var fx = document.getElementById('wkSheet-ben'); if (fx) fx.remove(); if (typeof dlSync === "function") dlSync(); }
  // בעמוד הזה הגיליון מוצג מתחת לתיבה – לחיצה על התיבה גוללת אליו
  var open0 = WK.open; WK.open = function (k) { if (k === 'ben') document.getElementById('inl').scrollIntoView({ behavior: 'smooth' }); else open0(k); };
  render();

  // ── דמו §789: כל לחיצה שמובילה לאתר (שורת האתר / "לאתר" / חולצה / "לכל החנות") מעתיקה קודם את הקוד ──
  var CODE = BEN.coupon.code;
  function copyNow(code) {
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(code).catch(function () { legacy(code); }); return; } } catch (e) {}
    legacy(code);
  }
  function legacy(code) { var t = document.createElement('textarea'); t.value = code; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;top:-100px;opacity:0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} t.remove(); }
  // השורה עצמה אומרת מראש מה יקרה
  function decorate() {
    var row = document.querySelector('#inl .wk-row-site:not(.wk-row-ig)');
    if (row && !row.querySelector('.sc-sub')) {
      var m = row.querySelector('.wk-row-main');
      m.insertAdjacentHTML('beforeend', '<div class="sc-sub">הקוד <b>' + CODE + '</b> מועתק לבד</div>');
    }
    var more = document.querySelector('#inl .wk-pr-more small');
    if (more && !more.dataset.sc) { more.dataset.sc = 1; more.textContent = 'הקוד ' + CODE + ' מועתק לבד'; }
  }
  decorate();
  new MutationObserver(decorate).observe(document.getElementById('inl'), { childList: true, subtree: true });
  // החלון הקטן: "הקוד הועתק" ואז האתר נפתח (באפליקציה – אוטומטית אחרי שנייה וחצי)
  var ov = document.createElement('div'); ov.className = 'sc-ov';
  ov.innerHTML = '<div class="sc-card"><div class="ok">✓ הקוד הועתק</div><div class="code">' + CODE + '</div>' +
    '<p>בקופה באתר מדביקים אותו בשדה "קוד קופון"<br>ו-50 ₪ יורדים מהסכום.</p><div class="bar"><i></i></div>' +
    '<a class="go" href="#">פותחים את Glory Street…</a><small>בדמו האתר לא נפתח – באפליקציה הוא נפתח לבד</small></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click', function (e) { if (e.target === ov) ov.classList.remove('on'); });
  ov.querySelector('.go').addEventListener('click', function (e) { e.preventDefault(); ov.classList.remove('on'); });
  document.getElementById('inl').addEventListener('click', function (e) {
    var a = e.target.closest('a.wk-row-site:not(.wk-row-ig), a.wk-cp-site, a.wk-pr');
    if (!a || /welcome\.html/.test(a.getAttribute('href') || '')) return;
    e.preventDefault();
    copyNow(CODE);
    var i = ov.querySelector('.bar i'); i.classList.remove('run'); void i.offsetWidth;
    ov.classList.add('on'); i.classList.add('run');
    clearTimeout(ov._t); ov._t = setTimeout(function () { ov.classList.remove('on'); toast('באפליקציה – כאן נפתח ' + (a.classList.contains('wk-pr') ? 'עמוד החולצה' : 'האתר של Glory Street') + ', והקוד כבר בלוח'); }, 1700);
  }, true);
  // דמו: הלב לא נשמר – רק מראה איך זה נראה (12 = הלבבות של Glory Street היום)
  var dl = { n: 12, mine: false };
  WK.onLike(function (id) { dl.mine = !dl.mine; dl.n += dl.mine ? 1 : -1; WK.setBenLike(id, dl.n, dl.mine); });
  function dlSync() { if (!dl) return; var k = WK.benLikeKey(); if (k) WK.setBenLike(k, dl.n, dl.mine); }
  dlSync();

})();
</script>
</body>
</html>
