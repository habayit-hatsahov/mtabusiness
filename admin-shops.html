// ── קריאה לוורקר: אותן שלוש כתובות ואותו היגיון כמו hbApiFetch במרכז הניהול (§402/§403) ──
const HB_API_HOSTS = ['https://api.yellowzone.co.il', 'https://habayit-hatsahov.web.app/api', 'https://habayit-hatsahov-worker.yellowzone.workers.dev'];
const HB_HOST_TIMEOUT_MS = 3500;
const hbApiFetch = (path, opts) => {
  const tryHost = (i) => {
    const last = i + 1 >= HB_API_HOSTS.length, ac = new AbortController();
    // הסריקה והבדיקה פונות לאתר של העסק ויכולות לקחת עד ~30 שנ'. הדד-ליין רק על "האם הכתובת עונה" – 3.5 שנ' עד לכותרות.
    const timer = last ? null : setTimeout(() => ac.abort(), HB_HOST_TIMEOUT_MS);
    return fetch(HB_API_HOSTS[i] + path, { ...opts, signal: ac.signal }).then(
      (res) => { if (timer) clearTimeout(timer); return res; },
      (err) => { if (timer) clearTimeout(timer); if (last) throw err; return tryHost(i + 1); });
  };
  return tryHost(0);
};
const api = async (body) => {
  const idToken = await auth.currentUser.getIdToken();
  const r = await hbApiFetch('/admin-shops', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...body, idToken }) });
  return r.json();
};

const fmt = n => n == null ? '–' : Number(n).toLocaleString('he-IL');

const NEED = {

בשביל זה צריך ליצור בחשבון ה-Shopify שלכם "אפליקציה" עם הרשאת קריאה בלבד (כ-10 דקות, ואפשר לעשות את זה יחד בטלפון):

      render(); toast(res.rebuild ? 'נשמר, אבל הבנייה נכשלה: ' + res.rebuild : 'נשמר – הכרטיס נבנה מחדש');
    }
    else if (a === 'focus') { const v = true; const res = await api({ action: 'set', bizId: id, focus: v }); if (!res.ok) throw new Error(res.error); patchRow(id, { focus: v }); render(); toast(v ? 'נוסף ל"לטיפול" בראש הרשימה' : 'הוצא מ"לטיפול"'); }
    else if (a === 'saveNote') { const v = $('note_' + id).value; const res = await api({ action: 'set', bizId: id, note: v }); if (!res.ok) throw new Error(res.error); patchRow(id, { note: v }); OPEN[id] = ''; render(); toast('ההערה נשמרה'); }
    else if (a === 'save') {
      const s = shopOf(r), kind = keyKind(s.platform), v = x => ($(x + id) || {}).value || '';
      const creds = kind === 'woocommerce' ? { ck: v('ck_'), cs: v('cs_') } : kind === 'shopify' ? { shop: v('shop_'), clientId: v('cid_'), clientSecret: v('csec_') } : kind === 'magento' ? { token: v('tok_') } : { text: v('txt_') };
      $('kres_' + id).innerHTML = '<div class="res info">שומר ובודק מול האתר…</div>';
      const res = await api({ action: 'saveKey', bizId: id, platform: s.platform, creds });
      if (!res.ok) { $('kres_' + id).innerHTML = `<div class="res bad">✖ ${esc(res.error)}</div>`; return; }
      patchRow(id, Object.assign({ key: res.key, test: res.test }, res.stage ? { stage: res.stage } : {}));
      OPEN[id] = 'key'; render(); toast('נשמר');
    }
    else if (a === 'test') { $('kres_' + id).innerHTML = '<div class="res info">בודק…</div>'; const res = await api({ action: 'test', bizId: id }); if (!res.ok) throw new Error(res.error); patchRow(id, { test: res.test }); OPEN[id] = 'key'; render(); }
    else if (a === 'delKey') { if (!confirm(`למחוק את פרטי האינטגרציה של ${r.name}? (בעל העסק יצטרך לשלוח חדשים)`)) return; const res = await api({ action: 'delKey', bizId: id }); if (!res.ok) throw new Error(res.error); patchRow(id, { key: null, test: null }); render(); toast('נמחק'); }
  } catch (er) { toast('שגיאה: ' + (er.message || er)); }
  finally { b.disabled = false; }
});

onAuthStateChanged(auth, async u => {
  if (!u) { location.href = 'welcome.html?login=1'; return; }
  const snap = await getDoc(doc(db, 'members', u.uid));
  if (!snap.exists() || snap.data().isAdmin !== true) { location.href = 'home.html'; return; }
  try {
    const res = await api({ action: 'list' });
    if (!res.ok) throw new Error(res.error || 'נכשל');
    ROWS = res.rows.map(normRow);
    render();
    // §796יב – עסק חדש עם אתר (עוד לא נסרק) נסרק לבד בכניסה לדף – כך כל עסק חדש עם חנות מקבל קישור בחירה בלי לחיצה
    const fresh = ROWS.filter(x => !x.shop || !x.shop.scannedAt);
    if (fresh.length) {
      $('scanState').textContent = 'סורק ' + fresh.length + ' עסקים חדשים…';
      let done = 0; const q = fresh.slice();
      const w = async () => { while (q.length) { const x = q.shift(); try { await scanOne(x.id); } catch (e) {} done++; $('scanState').textContent = done < fresh.length ? 'סורק עסקים חדשים ' + done + '/' + fresh.length : ''; } };
      Promise.all([w(), w(), w()]).then(async () => { try { const r2 = await api({ action: 'list' }); if (r2.ok) { ROWS = r2.rows.map(normRow); render(); } } catch (e) { render(); } });
    }
  } catch (e) { $('main').innerHTML = `<div class="boot">הטעינה נכשלה: ${esc(e.message || e)} – רעננו את הדף</div>`; }
});
</script>
