<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>דמו – כרטיס ההטבה במרכז הנתונים</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#F4F5F8;font-family:Rubik,sans-serif}
  .bar{background:#0A2A66;color:#fff;padding:10px 16px;font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .bar b{color:#FFD400;margin-inline-end:auto}
  .bar button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
  .bar button.on{background:#FFD400;color:#0A2A66}
  .yzu{--yzu-ink:#0A2A66;--yzu-muted:#5B6B8C;--yzu-line:#E7E7E0;--yzu-acc:#FFD400;--yzu-acc-soft:#FFF7DB;--yzu-acc-line:#FFE9A3;--yzu-ok:#1B8A4B;--yzu-ok-soft:#E7F6EC;--yzu-gray:#EEF0F5;color:var(--yzu-ink);font-size:14px;max-width:980px;margin:16px auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 6px rgba(10,42,102,.08)}
  h2{margin:0 0 4px;font-size:20px}
  .yzu-def{margin:0 0 14px;color:var(--yzu-muted);font-size:13.5px;line-height:1.6}
  .yzu-note{font-size:12.5px;color:var(--yzu-muted);line-height:1.6;margin:8px 0 0}
  .yzu-box{border:1px solid var(--yzu-line);border-radius:12px;padding:12px;background:#FCFCFA;min-width:0;margin-bottom:12px}
  .yzu-box h3{margin:0 0 10px;font-size:15px}
  .yzu-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:720px){.yzu-cols{grid-template-columns:1fr}.k4{grid-template-columns:repeat(2,1fr)!important}.fs{grid-template-columns:1fr!important}}
  .hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .hd img{height:30px;filter:brightness(0)}
  .pill{display:inline-block;background:var(--yzu-acc-soft);border:1px solid var(--yzu-acc-line);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700}
  .pill.live{background:var(--yzu-ok-soft);border-color:#BFE5CC;color:var(--yzu-ok)}
  .k4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
  .k{background:#fff;border:2px solid var(--yzu-line);border-radius:14px;padding:10px 12px}
  .k.main{border-color:var(--yzu-acc);background:var(--yzu-acc-soft)}
  .k small{display:block;font-size:12.5px;color:var(--yzu-muted);font-weight:700}
  .k b{display:block;font-size:26px;font-weight:900;margin-top:2px}
  .k span{font-size:12px;color:var(--yzu-muted)}
  .fun{display:flex;flex-direction:column;gap:7px}
  .fs{display:grid;grid-template-columns:210px 1fr 110px;gap:12px;align-items:center;border:1px solid var(--yzu-line);border-radius:12px;padding:9px 12px;background:#fff}
  .fs .l{font-weight:700;font-size:13.5px}.fs .l small{display:block;font-weight:500;color:var(--yzu-muted);font-size:11.5px}
  .tr{height:16px;background:var(--yzu-gray);border-radius:5px;overflow:hidden}.tr i{display:block;height:100%;background:var(--yzu-ink);border-radius:5px}
  .fs.woo{border-color:var(--yzu-acc);background:var(--yzu-acc-soft)}.fs.woo .tr i{background:var(--yzu-ok)}
  .fs .v{text-align:left;font-weight:900;font-size:16px}.fs .v small{display:block;font-weight:600;font-size:11.5px;color:var(--yzu-muted)}
  .src{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-inline-start:6px;vertical-align:1px}
  .src.app{background:var(--yzu-gray);color:var(--yzu-muted)}.src.wc{background:#EDE7F6;color:#5B3E96}
  .hb{display:grid;grid-template-columns:150px 1fr 54px;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}
  .hb b{text-align:left}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 8px;border-bottom:1px solid var(--yzu-line);text-align:right;white-space:nowrap}
  th{color:var(--yzu-muted);font-size:12px}
  td.n,th.n{text-align:left}
  .tw{overflow-x:auto}
  .how{background:var(--yzu-acc-soft);border:1px solid var(--yzu-acc-line);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.65;margin-top:4px}
</style>
</head>
<body>
<div class="bar"><b>דמו · כרטיס ההטבה במרכז הנתונים (לשונית "מעורבות" ← קרוסלות)</b>
  <button type="button" data-m="mid" class="on">באמצע ההטבה (מספרים לדוגמה)</button>
  <button type="button" data-m="now">היום – לפני 16.11</button>
</div>
<div class="yzu" id="root"></div>

<script>
(function () {
  var f = function (n) { return Number(n || 0).toLocaleString('he-IL'); };
  var pc = function (a, b) { return b ? Math.round(a / b * 100) + '%' : '–'; };
  // מספרים לדוגמה – באמצע ההטבה (יום 8 מתוך 16)
  var MID = {
    day: 8, left: 9,
    car: { view: 2410, open: 612, coupon: 248, copy: 196, site: 214, product: 133, shopTab: 71 },
    wc: { orders: 31, revenue: 6450, items: 58, avg: 208, discount: 1550 },
    days: [['16.11', 380, 104, 46, 6, 1240], ['17.11', 352, 92, 38, 5, 1010], ['18.11', 301, 77, 30, 4, 860], ['19.11', 296, 71, 27, 3, 590],
           ['20.11', 288, 70, 29, 4, 830], ['21.11', 270, 66, 26, 3, 640], ['22.11', 262, 69, 28, 4, 760], ['23.11', 261, 63, 24, 2, 520]],
    cats: [['כדורגל', 52], ['הכי נמכרים', 31], ['כדורסל', 22], ['UFC ואיגרוף', 14], ['היפ הופ', 9], ['אייקוניות', 5]]
  };
  var NOW = { day: 0, left: 16, car: {}, wc: { orders: 0, revenue: 0, items: 0, avg: 0, discount: 0 }, days: [], cats: [] };

  function render(D) {
    var c = D.car, w = D.wc, live = D.day > 0;
    var steps = [
      ['ראו את התיבה', 'בדף הבית', c.view, 'app'],
      ['פתחו את ההטבה', 'לחצו על התיבה', c.open, 'app'],
      ['לקחו קוד', 'לחצו "לקבלת קוד הקופון"', c.coupon, 'app'],
      ['העתיקו את הקוד', '', c.copy, 'app'],
      ['עברו לאתר', 'מהכפתור "לאתר" או מחולצה', (c.site || 0) + (c.product || 0), 'app'],
      ['קנו בקוד MTA50', 'הזמנות באתר של העסק', w.orders, 'wc']
    ];
    var mx = Math.max(1, steps[0][2] || 0);
    var fun = steps.map(function (s, i) {
      var prev = i ? steps[i - 1][2] : 0;
      return '<div class="fs' + (s[3] === 'wc' ? ' woo' : '') + '"><div class="l">' + s[0] + '<span class="src ' + s[3] + '">' + (s[3] === 'wc' ? 'WooCommerce' : 'אפליקציה') + '</span>' + (s[1] ? '<small>' + s[1] + '</small>' : '') + '</div>' +
        '<div class="tr"><i style="width:' + Math.max(s[2] ? 1.5 : 0, (s[2] || 0) / mx * 100) + '%"></i></div>' +
        '<div class="v">' + f(s[2]) + (i ? '<small>' + pc(s[2] || 0, prev) + ' מהשלב הקודם</small>' : '<small>&nbsp;</small>') + '</div></div>';
    }).join('');
    var cmx = Math.max(1, ...(D.cats.map(function (x) { return x[1]; })), 1);
    var rows = D.days.map(function (d) {
      return '<tr><td>' + d[0] + '</td><td class="n">' + f(d[1]) + '</td><td class="n">' + f(d[2]) + '</td><td class="n">' + f(d[3]) + '</td><td class="n"><b>' + f(d[4]) + '</b></td><td class="n">' + f(d[5]) + ' ₪</td></tr>';
    }).join('');
    document.getElementById('root').innerHTML =
      '<div class="hd"><span style="display:block;position:relative;overflow:hidden;width:118px;height:28px"><img src="images/weekly/glory-logo.png" alt="Glory Street" style="position:absolute;width:138px;height:auto;top:-5px;left:-12px"></span>' +
        '<h2>הטבה בלעדית – 50 ₪ מתנה ב-Glory Street</h2></div>' +
      '<p class="yzu-def">16.11–1.12 · קוד MTA50 · ' + (live ? '<span class="pill live">באוויר · יום ' + D.day + ' · עוד ' + D.left + ' ימים</span>' : '<span class="pill">עולה ב-16.11</span>') +
        ' · הקרוסלה מהאפליקציה, המכירות מהאתר של העסק (WooCommerce) – מתעדכן כל שעה.</p>' +
      '<div class="k4">' +
        '<div class="k main"><small>הזמנות בקוד</small><b>' + f(w.orders) + '</b><span>' + (c.coupon ? pc(w.orders, c.coupon) + ' ממי שלקחו קוד' : 'עוד אין') + '</span></div>' +
        '<div class="k main"><small>מכירות לעסק</small><b>' + f(w.revenue) + ' ₪</b><span>אחרי ההנחות</span></div>' +
        '<div class="k"><small>פריטים שנמכרו</small><b>' + f(w.items) + '</b><span>' + (w.orders ? (w.items / w.orders).toFixed(1) + ' להזמנה' : '–') + '</span></div>' +
        '<div class="k"><small>ממוצע להזמנה</small><b>' + f(w.avg) + ' ₪</b><span>' + (w.discount ? 'הנחה שניתנה: ' + f(w.discount) + ' ₪' : '–') + '</span></div>' +
      '</div>' +
      '<div class="yzu-box"><h3>מהתיבה ועד הקנייה</h3><div class="fun">' + fun + '</div>' +
        '<p class="yzu-note">כל שלב באפליקציה נספר פעם אחת לביקור, בלי מנהלים. "קנו בקוד" = כל ההזמנות עם MTA50 באתר שלו – גם מי שקיבל את הקוד מחבר ולא דרך האפליקציה.</p></div>' +
      '<div class="yzu-cols">' +
        '<div class="yzu-box"><h3>מה עניין בחנות שבגיליון</h3>' +
          (D.cats.length ? D.cats.map(function (x) { return '<div class="hb"><span>' + x[0] + '</span><div class="tr"><i style="width:' + (x[1] / cmx * 100) + '%"></i></div><b>' + f(x[1]) + '</b></div>'; }).join('') +
            '<p class="yzu-note">' + f(c.product) + ' לחיצות על חולצות · ' + f(c.shopTab) + ' החלפות לשונית.</p>' : '<p class="yzu-note">אין עדיין</p>') + '</div>' +
        '<div class="yzu-box"><h3>שווה לעסק?</h3>' +
          (w.orders ? '<div class="hb"><span>מכירות</span><div class="tr"><i style="width:100%;background:#1B8A4B"></i></div><b>' + f(w.revenue) + '</b></div>' +
            '<div class="hb"><span>הנחה שנתן (50 ₪ × הזמנה)</span><div class="tr"><i style="width:' + (w.discount / w.revenue * 100) + '%"></i></div><b>' + f(w.discount) + '</b></div>' +
            '<p class="yzu-note">על כל 1 ₪ הנחה – ' + (w.revenue / w.discount).toFixed(1) + ' ₪ מכירות. מספר טוב לשלוח לבעל העסק בסוף ההטבה.</p>' : '<p class="yzu-note">יתמלא כשתהיה הזמנה ראשונה.</p>') + '</div>' +
      '</div>' +
      '<div class="yzu-box tw"><h3>לפי יום</h3>' + (rows ? '<table><tr><th>יום</th><th class="n">ראו</th><th class="n">פתחו</th><th class="n">לקחו קוד</th><th class="n">הזמנות</th><th class="n">מכירות</th></tr>' + rows + '</table>' : '<p class="yzu-note">ההטבה עוד לא עלתה.</p>') + '</div>' +
      '<div class="how"><b>מה אמיתי כבר עכשיו:</b> החיבור לאתר שלו עובד – נבדק היום על קוד ישן שלו (glory5): 5 הזמנות, 1,344 ₪, 11 פריטים, ממוצע 269 ₪. MTA50 עוד לא שומש (0). ' +
        'נקרא רק סיכום מספרי – בלי שמות, טלפונים או כתובות של לקוחות. כל המספרים בדמו הזה הם לדוגמה.</div>';
  }
  render(MID);
  document.querySelectorAll('[data-m]').forEach(function (b) {
    b.onclick = function () { document.querySelectorAll('[data-m]').forEach(function (x) { x.classList.toggle('on', x === b); }); render(b.getAttribute('data-m') === 'mid' ? MID : NOW); };
  });
})();
</script>
</body>
</html>
