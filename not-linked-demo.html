<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>דמו – נראה שעוד לא נרשמתם</title>
<!-- §544 — דמו בלבד (§543): אדם חדש לוחץ "כניסה" עם Google/Apple בחשבון שלא שייך לאף חבר.
     היום: הודעת-כשל כתומה שמדברת אל חבר, וההרשמה בשורה קטנה בתחתית. מוצע: המסך מתהפך –
     הרשמה היא הפעולה הראשית, והשם והמייל עוברים לטופס מאותו חשבון. בלי Firestore, בלי מדידה,
     שמות ומיילים לדוגמה בלבד (הקובץ מוגש פומבית). -->
<style>
  @font-face { font-family: 'Rubik'; font-style: normal; font-weight: 300 900; font-display: swap;
    src: url('fonts/rubik-hebrew.woff2') format('woff2');
    unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: 'Rubik'; font-style: normal; font-weight: 300 900; font-display: swap;
    src: url('fonts/rubik-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F6F6F2; --surface: #FFFFFF; --ink: #0A2A66; --ink-2: #3A4C7A; --ink-3: #6B7A9B;
    --line: #E7E7E0; --field: #F2F2EC; --field-line: #E4E4DC;
    --acc: #FFD400; --acc-ink: #0A2A66; --acc-soft: #FFF7DB; --acc-line: #FFE9A3;
    --ok: #15803D; --warn: #B45309;
    --r-field: 11px; --r-btn: 13px; --r-shell: 20px;
  }
  html, body { background: #DCDCD4; color: var(--ink); font-family: 'Rubik', system-ui, sans-serif; }
  body { min-height: 100vh; padding: 16px 16px 150px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  button { font: inherit; cursor: pointer; }

  /* ── מסגרת טלפון: רקע האפליקציה + מודאל ── */
  .phone { width: 100%; max-width: 390px; min-height: 720px; border-radius: 28px; overflow: hidden; position: relative;
    background: linear-gradient(180deg, var(--acc) 0 230px, var(--bg) 230px); box-shadow: 0 20px 50px rgba(10,14,22,.25); }
  .phone-bg { padding: 22px 20px; }
  .phone-bg .logo { font-weight: 900; font-size: 20px; letter-spacing: .3px; }
  .phone-bg .tag { margin-top: 10px; font-size: 22px; font-weight: 800; line-height: 1.25; }
  .scrim { position: absolute; inset: 0; background: rgba(10,14,22,.55); display: flex; align-items: flex-start; justify-content: center; padding: 60px 12px 16px; overflow: auto; }
  .modal { background: #fff; border-radius: var(--r-shell); width: 100%; position: relative; box-shadow: 0 24px 60px rgba(10,14,22,.35); }
  .close { position: absolute; top: 14px; left: 14px; width: 34px; height: 34px; border-radius: 50%; background: var(--field); border: 0; color: var(--ink); font-size: 15px; }
  .body { padding: 30px 22px 24px; display: flex; flex-direction: column; gap: 14px; }
  .title { font-size: 20px; font-weight: 800; text-align: center; }
  .sub { font-size: 13px; color: var(--ink-3); text-align: center; line-height: 1.55; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 12.5px; }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  .btn-g, .btn-a { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 46px; border-radius: 999px; font-weight: 700; font-size: 15px; }
  .btn-g { background: #1A73E8; color: #fff; border: 0; }
  .btn-g .gwrap { width: 26px; height: 26px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .btn-a { background: #000; color: #fff; border: 0; }
  .btn-a svg { width: 18px; height: 18px; fill: #fff; }
  .btn-outline { width: 100%; min-height: 46px; border-radius: var(--r-btn); background: #fff; border: 1.5px solid var(--field-line); color: var(--ink); font-weight: 700; font-size: 15px; }
  .btn-primary { width: 100%; min-height: 52px; border-radius: var(--r-btn); background: var(--acc); border: 0; color: var(--acc-ink); font-weight: 800; font-size: 16px; box-shadow: 0 2px 0 rgba(10,42,102,.12); }
  .link { background: none; border: 0; color: var(--ink-2); font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
  .note { font-size: 12.5px; color: var(--ink-3); text-align: center; line-height: 1.6; }
  .loading { text-align: center; color: var(--ink-3); font-size: 13px; padding: 6px 0; }

  /* ── היום: הודעת הכשל, מילה במילה מ-welcome.html ── */
  .msg-warn { font-size: 12.5px; line-height: 1.6; text-align: center; color: var(--warn); }
  .msg-warn a { color: inherit; font-weight: 800; text-decoration: underline; }
  .msg-warn .act { display: block; width: 100%; margin: 10px 0 8px; padding: 10px 12px; border: 1.5px solid currentColor; border-radius: var(--r-field); background: transparent; color: inherit; font-weight: 800; }
  .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .field input { width: 100%; height: 46px; border-radius: var(--r-field); border: 1.5px solid var(--field-line); background: var(--field); padding: 0 12px; font: inherit; font-size: 15px; color: var(--ink); }
  .field input[readonly] { color: var(--ink-2); background: #EFEFE8; }
  .btn-navy { width: 100%; min-height: 48px; border-radius: var(--r-btn); background: var(--ink); color: #fff; border: 0; font-weight: 800; font-size: 16px; }

  /* ── מוצע: "נראה שעוד לא נרשמתם" ── */
  .acct { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--field); border: 1px solid var(--field-line); }
  .acct .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; background: #fff; border: 1px solid var(--field-line); }
  .acct .av svg { width: 18px; height: 18px; }
  .acct .who { min-width: 0; flex: 1; }
  .acct .who b { display: block; font-size: 14px; }
  .acct .who span { display: block; font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: right; }
  .acct .swap { background: none; border: 0; color: var(--ink-3); font-size: 12px; text-decoration: underline; flex: 0 0 auto; }
  .member-box { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
  .member-box p { font-size: 13px; color: var(--ink-2); line-height: 1.55; }

  /* ── טופס ההרשמה (embed), החלק העליון בלבד ── */
  .reg { background: var(--bg); border-radius: var(--r-shell); overflow: hidden; }
  .reg-head { display: flex; gap: 10px; align-items: flex-start; padding: 20px 18px 14px; background: var(--acc); }
  .reg-head .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--ink); color: var(--acc); font-weight: 900; display: grid; place-items: center; flex: 0 0 auto; }
  .reg-head b { font-size: 17px; display: block; }
  .reg-head span { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; display: block; margin-top: 2px; }
  .reg-body { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: #fff; border-radius: 16px; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; }
  .card h4 { font-size: 15px; font-weight: 800; }
  .cap { font-size: 12.5px; line-height: 1.6; color: var(--ink-3); text-align: center; background: #F0FAF3; border: 1px solid #CDEBD6; border-radius: 12px; padding: 10px; }
  .cap b { color: var(--ink); }
  .cap .undo { display: block; margin: 4px auto 0; background: none; border: 0; color: var(--ink-3); font-size: 12px; text-decoration: underline; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hl input:not([readonly]) { border-color: var(--acc); background: #fff; box-shadow: 0 0 0 3px var(--acc-soft); }
  .toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .toggle button { min-height: 44px; border-radius: var(--r-field); border: 1.5px solid var(--field-line); background: var(--field); font-weight: 700; color: var(--ink); font-size: 14px; }

  /* ── הסבר מתחת לטלפון ── */
  .explain { width: 100%; max-width: 390px; background: #fff; border-radius: 16px; padding: 14px 16px; font-size: 13.5px; line-height: 1.6; color: var(--ink-2); }
  .explain h3 { font-size: 14.5px; color: var(--ink); margin-bottom: 6px; }
  .explain ul { padding-right: 18px; }
  .explain li + li { margin-top: 4px; }

  /* ── סרגל הדמו ── */
  .demobar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--ink); color: #fff; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 50; }
  .demobar .lbl { font-size: 11.5px; opacity: .75; }
  .seg { display: inline-flex; background: rgba(255,255,255,.12); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; color: #fff; padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 700; }
  .seg button.on { background: var(--acc); color: var(--ink); }
  .bar-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .restart { background: none; border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 999px; padding: 6px 12px; font-size: 12.5px; }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="phone-bg" aria-hidden="true">
    <div class="logo">YELLOW ZONE</div>
    <div class="tag">כל העסקים של אוהדי מכבי – במקום אחד</div>
  </div>
  <div class="scrim"><div id="screen" style="width:100%"></div></div>
</div>

<div class="explain" id="explain"></div>

<div class="demobar">
  <div class="lbl">דמו · שמות ומיילים לדוגמה · לחצו על הכפתורים במסך</div>
  <div class="bar-row">
    <div class="seg" role="group" aria-label="גרסה">
      <button type="button" data-k="ver" data-v="new">מוצע</button>
      <button type="button" data-k="ver" data-v="old">היום</button>
    </div>
    <div class="seg" role="group" aria-label="חשבון">
      <button type="button" data-k="prov" data-v="google">Google</button>
      <button type="button" data-k="prov" data-v="apple">Apple</button>
    </div>
    <button type="button" class="restart" id="restart">מההתחלה</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var G_ICO = '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-2.9-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.2-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>';
  var A_ICO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 12.6c.02 2.4 2.1 3.2 2.13 3.21-.02.06-.33 1.14-1.1 2.26-.66.97-1.35 1.94-2.43 1.96-1.06.02-1.4-.63-2.62-.63-1.21 0-1.6.61-2.6.65-1.05.04-1.85-1.05-2.52-2.02-1.37-1.98-2.41-5.6-1.01-8.04.7-1.21 1.94-1.98 3.29-2 1.03-.02 2 .69 2.62.69.63 0 1.81-.85 3.05-.73.52.02 1.98.21 2.92 1.58-.08.05-1.74 1.02-1.73 3.07ZM14.4 5.04c.55-.67.92-1.6.82-2.53-.79.03-1.75.53-2.32 1.2-.51.59-.96 1.54-.84 2.44.88.07 1.79-.45 2.34-1.11Z"/></svg>';
  // חשבונות לדוגמה. באפל: שם מגיע רק בהרשאה הראשונה, ומייל יכול להיות כתובת מוסתרת של אפל.
  var ACCT = {
    google: { name: 'דני', last: 'כהן', email: 'dani.demo@gmail.com', label: 'Google' },
    apple:  { name: 'דני', last: 'כהן', email: 'dani.demo@icloud.com', label: 'Apple' },
  };
  var st = { ver: 'new', prov: 'google', step: 'login' };
  var screen = document.getElementById('screen');
  var explain = document.getElementById('explain');
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function provBtns() {
    return '<button type="button" class="btn-g" data-go="tryGoogle"><span class="gwrap">' + G_ICO.replace('<svg', '<svg width="16" height="16"') + '</span>המשך עם Google</button>' +
      '<button type="button" class="btn-a" data-go="tryApple">' + A_ICO + 'המשך עם Apple</button>';
  }

  var SCREENS = {
    // מסך הכניסה כמו היום (מקוצר: בלי ההערות הארוכות)
    login: function () {
      return '<div class="modal"><button class="close" aria-label="סגירה">✕</button><div class="body">' +
        '<div><div class="title">התחברות</div><div class="sub">נכנסים בלי קוד – או עם הטלפון והקוד בן 6 הספרות</div></div>' +
        '<div class="or">נכנסים בלי קוד – עם Google או Apple</div>' + provBtns() +
        '<div class="or">או</div><button type="button" class="btn-outline">כניסה עם טלפון וקוד</button>' +
        '</div></div>';
    },
    loading: function () {
      return '<div class="modal"><div class="body"><div class="title">התחברות</div><div class="loading">בודקים את החשבון…</div></div></div>';
    },
    // היום — הנוסח מ-welcome.html (ענף notLinked), ושדות הקוד נפתחים מיד (heroShowCodePath)
    old: function () {
      var a = ACCT[st.prov];
      var member = st.prov === 'google'
        ? '<br><br><b>כבר חברים?</b> היכנסו עם הטלפון והקוד למטה – ואז תוכלו לחבר את Google מדף הבית, ולהיכנס בלחיצה אחת בפעם הבאה.'
        : '<br><br><b>כבר חברים?</b> כנראה נרשמתם עם מייל אחר – היכנסו עם הטלפון והקוד למטה.';
      return '<div class="modal"><button class="close" aria-label="סגירה">✕</button><div class="body">' +
        '<div class="title">התחברות</div>' +
        '<div class="msg-warn">⚠️ עדיין לא חיברתם את חשבון ה-' + a.label + ' הזה (<b>' + esc(a.email) + '</b>) לכניסה ל-Yellow Zone.' + member +
        '<button type="button" class="act">לא זוכרים את הקוד? שלחו לי קוד חדש למייל</button>' +
        '<b>עדיין לא נרשמתם?</b> <a href="#" data-go="regOld">הצטרפו כאן</a></div>' +
        provBtns() +
        '<div class="field"><label>מספר טלפון</label><input placeholder="05X-XXXXXXX" inputmode="tel"></div>' +
        '<div class="field"><label>קוד בן 6 ספרות</label><input placeholder="X X X X X X" inputmode="numeric"></div>' +
        '<button type="button" class="btn-navy">התחברו</button>' +
        '</div></div>';
    },
    // מוצע — המסך מתהפך: הרשמה ראשית, החשבון שנבחר מוצג, ו"כבר חברים" משני
    neu: function () {
      var a = ACCT[st.prov];
      return '<div class="modal"><button class="close" aria-label="סגירה">✕</button><div class="body">' +
        '<div><div class="title">נראה שעוד לא נרשמתם</div>' +
        '<div class="sub" style="margin-top:8px">אין עדיין חבר ב-Yellow Zone עם החשבון הזה. ההרשמה חינם ולוקחת פחות משתי דקות.</div></div>' +
        '<div class="acct"><div class="av">' + (st.prov === 'google' ? G_ICO : A_ICO) + '</div>' +
          '<div class="who"><b>' + esc(a.name + ' ' + a.last) + '</b><span>' + esc(a.email) + '</span></div>' +
          '<button type="button" class="swap" data-go="login">חשבון אחר</button></div>' +
        '<button type="button" class="btn-primary" data-go="reg">להרשמה – השם והמייל יוזנו אוטומטית</button>' +
        '<div class="member-box"><p><b>כבר חברים?</b> כנראה נרשמתם עם מייל אחר.</p>' +
          '<button type="button" class="btn-outline" data-go="code">כניסה עם טלפון וקוד</button>' +
          '<button type="button" class="link">לא זוכרים את הקוד? שלחו לי קוד חדש למייל</button></div>' +
        '</div></div>';
    },
    // היום — "הצטרפו כאן" פותח טופס ריק, וצריך ללחוץ שוב על Google בתוך הטופס
    regOld: function () { return regForm(false); },
    reg: function () { return regForm(true); },
    code: function () {
      return '<div class="modal"><button class="close" aria-label="סגירה">✕</button><div class="body">' +
        '<div class="title">כניסה עם טלפון וקוד</div>' +
        '<div class="field"><label>מספר טלפון</label><input placeholder="05X-XXXXXXX" inputmode="tel"></div>' +
        '<div class="field"><label>קוד בן 6 ספרות</label><input placeholder="X X X X X X" inputmode="numeric"></div>' +
        '<button type="button" class="btn-navy">התחברו</button><button type="button" class="link" data-go="neu">חזרה</button>' +
        '</div></div>';
    },
  };

  function regForm(filled) {
    var a = ACCT[st.prov];
    var v = function (x) { return filled ? ' value="' + esc(x) + '" readonly' : ''; };
    var top = filled
      ? '<div class="cap">✅ <b dir="ltr">' + esc(a.email) + '</b> – המייל אומת ע"י ' + a.label + '.<br>אחרי שנאשר אתכם תיכנסו בלחיצה אחת, בלי קוד.<button type="button" class="undo" data-go="regOld">זה לא החשבון שלי</button></div>'
      : provBtns().replace(/data-go="try\w+"/g, '').replace('המשך עם Google', 'הרשמה עם Google').replace('המשך עם Apple', 'הרשמה עם Apple') + '<div class="or">או למלא ידנית</div>';
    return '<div class="reg"><div class="reg-head"><div class="mark">Z</div><div><b>הרשמה לאוהדים</b><span>הטבות בעסקים של אוהדי מכבי – אוכל, אירועים ובעלי מקצוע. ההרשמה חינם ולוקחת פחות משתי דקות.</span></div></div>' +
      '<div class="reg-body' + (filled ? ' hl' : '') + '"><div class="card"><h4>פרטים אישיים</h4>' + top +
        '<div class="row2"><div class="field"><label>שם פרטי *</label><input' + v(a.name) + ' placeholder="ישראל"></div>' +
        '<div class="field"><label>שם משפחה *</label><input' + v(a.last) + ' placeholder="ישראלי"></div></div>' +
        '<div class="field"><label>מספר טלפון *</label><input placeholder="050-0000000" inputmode="tel"></div>' +
        '<div class="field"><label>אימייל *</label><input' + v(a.email) + ' placeholder="israel@gmail.com" dir="ltr" style="text-align:right"></div></div>' +
        '<div class="card"><h4>אימות אוהד</h4><div class="note" style="text-align:right">האם אתה מנוי של מכבי תל אביב? *</div>' +
        '<div class="toggle"><button type="button">✓ כן, מנוי</button><button type="button">לא מנוי, אבל אוהד</button></div></div>' +
      '</div></div>';
  }

  var EXPLAIN = {
    old: '<h3>היום</h3><ul>' +
      '<li>הודעה כתומה עם ⚠️ שמדברת אל חבר שנכשל: "עדיין לא חיברתם", "כבר חברים?", "לא זוכרים את הקוד?".</li>' +
      '<li>ההרשמה היא השורה הקטנה האחרונה: "עדיין לא נרשמתם? הצטרפו כאן".</li>' +
      '<li>שדות הטלפון והקוד נפתחים מעצמם, אף שלאדם חדש אין קוד.</li>' +
      '<li>"הצטרפו כאן" פותח טופס <b>ריק</b>, וצריך לבחור שוב את חשבון ה-Google או ה-Apple.</li></ul>',
    new: '<h3>מה משתנה</h3><ul>' +
      '<li>רק כשהמייל של החשבון <b>לא שייך לאף חבר</b> (חבר שהמייל שלו מוכר ממשיך להיכנס בלחיצה אחת, כמו היום).</li>' +
      '<li>כותרת רגילה במקום אזהרה כתומה, והחשבון שנבחר מוצג: שם ומייל.</li>' +
      '<li>כפתור צהוב ראשי פותח את טופס ההרשמה שבו השם והמייל <b>מוזנים אוטומטית</b>, בלי לבחור שוב חשבון. בסוף ההרשמה החשבון מתחבר, ואחרי האישור נכנסים בלחיצה אחת.</li>' +
      '<li>"כבר חברים?" נשאר, אבל משני: כנראה נרשמו עם מייל אחר, ולכן נכנסים עם טלפון וקוד או מבקשים קוד חדש.</li>' +
      '<li>שדות הקוד לא נפתחים מעצמם.</li>' +
      '<li>באפל: השם מגיע רק בהרשאה הראשונה, והמייל יכול להיות כתובת מוסתרת של אפל. כשאין שם, השדות נשארים ריקים להקלדה.</li></ul>',
  };

  function render() {
    var s = st.step;
    if (s === 'result') s = st.ver === 'new' ? 'neu' : 'old';
    screen.innerHTML = SCREENS[s]();
    explain.innerHTML = EXPLAIN[st.ver];
    document.querySelectorAll('.seg button').forEach(function (b) { b.classList.toggle('on', st[b.dataset.k] === b.dataset.v); });
  }
  document.addEventListener('click', function (e) {
    var seg = e.target.closest('.seg button');
    if (seg) { st[seg.dataset.k] = seg.dataset.v; if (st.step !== 'login' && st.step !== 'loading') st.step = 'result'; render(); return; }
    if (e.target.closest('#restart')) { st.step = 'login'; render(); return; }
    var go = e.target.closest('[data-go]');
    if (!go) return;
    e.preventDefault();
    var g = go.dataset.go;
    if (g === 'tryGoogle' || g === 'tryApple') {
      st.prov = g === 'tryGoogle' ? 'google' : 'apple';
      st.step = 'loading'; render();
      setTimeout(function () { st.step = 'result'; render(); }, 700);
      return;
    }
    st.step = g; render();
    document.getElementById('phone').scrollIntoView({ block: 'start' });
  });
  render();
})();
</script>
</body>
</html>
